function makeTable(){
  // 3 pop bumpers in triangle — more vertical space, bottom closer to center.
  // The two lower bumpers are mirror positions, so they share one tint (blue);
  // the top-centre bumper keeps the orange axis colour. (They used to be blue
  // left / green right — an asymmetric tint break on mirrored geometry, and
  // unlike the original 2600 game where every bumper is the same colour.)
  Game.bumpers=[
    {x:PL_CX, y:PF.y+PF.h*0.38, r:46, v:1, hit:0, col:0},  // top center
    {x:PL_CX-PL_W*0.24, y:PF.y+PF.h*0.63, r:46, v:1, hit:0, col:1},  // bottom left
    {x:PL_CX+PL_W*0.24, y:PF.y+PF.h*0.63, r:46, v:1, hit:0, col:1}   // bottom right
  ];
  // Special target — THE main centre shot between the two lower bumpers.
  // Always solid (a real pinball target is physical whether its lamp is on
  // or not): unlit hits score 500; when LIT it pays an escalating streak
  // (1000 → 2500 → 5000) that resets on drain. Lit windows are long (10s)
  // and frequent so the centre lane stays the go-to shot.
  Game.special={x:PL_CX, y:PF.y+PF.h*0.63, r:18, lit:false, t:0, cd:0, streak:0};
  // 3 diamond lights across the top — pass-over switches (original game):
  // the ball rolls straight over them, no deflection at all.
  const tgtSpread=PL_W*0.29;
  Game.targets=[
    {x:PL_CX-tgtSpread, y:PF.y+PF.h*0.075, down:false, t:0, in:false},
    {x:PL_CX, y:PF.y+PF.h*0.075, down:false, t:0, in:false},
    {x:PL_CX+tgtSpread, y:PF.y+PF.h*0.075, down:false, t:0, in:false}
  ];
  // Two top rollover pass-through lanes — centred in each half of playable area.
  // Vertically centred between the pass-through lane corridor walls.
  const rlaneY=LANE_CY;             // rollover circles share the skill shot's centre line
  Game.rolls=[
    {x:(PL_L+PL_CX)/2, y:rlaneY, in:false},  // left lane
    {x:(PL_CX+PL_R)/2, y:rlaneY, in:false}   // right lane
  ];
  // Two spinners — smaller, at midpoint, pulled well away from walls
  Game.spinners=[
    {x:PL_L+PL_W*0.15, y:PF.y+PF.h*0.505, ang:0, spin:0, cd:0},
    {x:PL_R-PL_W*0.15, y:PF.y+PF.h*0.505, ang:0, spin:0, cd:0}
  ];
  // Expert difficulty: two extra drain holes
  Game.drainHoles=Game.diff===0?[{x:PL_L+PL_W*0.06,y:PF.b-24},{x:PL_R-PL_W*0.06,y:PF.b-24}]:[];
  // Skill shot — sits in the CENTRE DROP ZONE between the two pass-through
  // lanes: after a launch the ball rides the top rail (decelerating) and
  // falls off at a power-determined spot; only the EXACT pull drops the ball
  // on this target. The disc is dead centre (SS_X) and level with the two
  // rollover circles (SS_Y), so the shot is genuinely hard — a hair over or
  // under and the ball drops past it (the arming band is the measured
  // collect range per preset).
  Game.skillShot={x:SS_X,y:SS_Y,r:22,collect:SS_COLLECT}; // collect is a fallback — PHYS.skillShot.collect (tuneLaunch) is live
  Game.skillShotReady=false;Game.skillShotDone=false; // fresh game/ball — the shot is up for grabs
}
function resetBall(){
  // Ball sits ON the rod tip at rest — tip at PF.b-66, ball radius above that
  const tipRestY=PF.b-66;
  Game.ball={x:PF.r-24,y:tipRestY-BALL_R,vx:0,vy:0,live:false,stuck:0,trail:[]};
  Game.plungerCharge=0;Game.plungerY=0;Game.launchAnim=0;Game.springBob=0;Game.launching=false;Game.arc=null;
  Game.skillShotT=0; // no live chance while the ball is parked on the rod
  Game.launchStartY=tipRestY-BALL_R;
  // Flippers always reset to rest for the next ball (a flipper frozen mid-swing
  // while the ball is on the plunger looks like a glitch)
  FL.l.ang=FL.l.rest;FL.r.ang=FL.r.rest;FL.l.prev=FL.l.rest;FL.r.prev=FL.r.rest;FL.l.av=0;FL.r.av=0;
  FL.l._obl=false;FL.r._obl=false; // one-shot oblique steering per swing
}
function newGame(){
  demoMode=false;Game.msg='';Game.msgT=0;Game.pfx.length=0; // leave the attract demo
  Game.cur=0;Game.scores=[0,0];Game.balls=[1,1];
  Game.extra=[false,false];Game.usedExtra=[false,false];
  // GAMES 2 & 4 are the 2-player variations (ACCUM / RESET)
  Game.players=(Game.game===2||Game.game===4)?2:1;
  Game.bumperAccum=(Game.game===1||Game.game===2);
  Game.bumperVal=1;Game.tilt=false;Game.tiltHeat=0;
  Game.saveArmed=false; // no free save on the game's first ball
  Game.autoSaveTimer=10;
  makeTable();startTurn();
}
function startTurn(){
  Game.atariHits=0;Game.bonus=1;Game.leftRoll=0;
  Game.tilt=false;Game.tiltHeat=0;Game.usedExtra[Game.cur]=false;
  if(!Game.bumperAccum){Game.bumperVal=1;Game.bumpers.forEach(b=>b.v=1);}
  Game.targets.forEach(t=>{t.down=false;t.t=0;t.in=false;});
  Game.rolls.forEach(r=>r.in=false);
  Game.special.lit=false;Game.special.t=0;Game.special.cd=0;Game.special.streak=0;
  Game.skillShotDone=false; // new ball — the skill shot is back on offer
  Game.autoSaveTimer=10;
  resetBall();state=S.LAUNCH;
}
function launchBall(){
  if((state!==S.LAUNCH&&!demoMode)||!Game.ball||Game.ball.live)return;
  const pull=Game.plungerCharge;
  Game.launchPower=pull; // raw 0..1, no minimum
  // Feather tap — just a nudge of the spring, the ball stays on the tip
  if(pull<0.05){Game.springBob=0.4;AudioSys.plungerRelease(0.12);return;}
  // REAL LAUNCH — the spring-energy model of an actual arcade plunger.
  // Hooke's law F=kx stores E=½kx² in the spring, which becomes the ball's
  // kinetic energy ½mv², so launch speed is LINEAR in pull distance (v∝pull)
  // — a half pull launches at half speed, exactly like a real machine. The
  // reference is the top of the playfield: a FULL pull crosses the top at the
  // preset's top speed (PHYS.maxVel), and every other pull scales from there.
  // Weak pulls climb partway, roll back down the lane and re-arm — the
  // authentic soft-plunge behaviour.
  // SPRING LAUNCH — Hooke's law: the plunger stores E=½kx² (x = pull
  // distance) and the ball leaves the rod at v = x·√(k/m): speed LINEAR in
  // the pull, exactly like a real spring. The reference: a FULL pull is
  // solved by tuneLaunch() to exit the top guide curve at exactly
  // PHYS.maxVel after paying the real lane climb and curve losses — so the
  // meter reads true speed across its whole travel.
  const v0=PHYS.vTipFull*pull;
  // The ball is LIVE from the moment of release and climbs the lane under real
  // gravity. The shooter-lane divider + tube catch keep it in the lane; if it
  // runs out of energy it rolls back down and re-arms (no penalty, no drain).
  Game.ball.vx=0;Game.ball.vy=-v0;Game.ball.live=true;
  Game.launching=true;Game.arc=null;
  Game._rbWhiff=false;Game._rbAcc=0;Game._lastVy=-v0; // rollback audio state
  Game.launchAnim=1.0;
  Game.springBob=1.0;
  Game._ltAcc=0;Game._ltPX=Game.ball.x;Game._ltPY=Game.ball.y; // reset launch-trail spacing
  if(!demoMode)state=S.PLAY;
  // Mechanical release thunk — the spring firing, scaled by the pull
  AudioSys.plungerRelease(pull);
}
function addScore(pts){
  if(Game.tilt)return;
  Game.scores[Game.cur]=(Game.scores[Game.cur]+pts)%1000000;
}
function addScoreFlat(pts){Game.scores[Game.cur]=(Game.scores[Game.cur]+pts)%1000000;}
function flash(){Game.flashes=8;}

// Rounded top corners (real pinball playfields have curved corners so a ball
// arcs over the top naturally instead of pinning in a square corner). The
// corner arcs (radius CR) OWN the top-left/top-right corner bands; the flat
// clamps skip those bands so the two never fight. A ball rolling along the
// top wall rides up over the arc and around the corner — the natural launch
// flow. The arc push keeps the ball at radius CR+R from the corner centre, so
// it can never be pushed outside the table: at the arc's top end the ball
// centre sits one radius above the flat top wall (exactly like a real ball on
// a rounded corner) and rides the arc down to the side wall.
const CORNER_R=36;
function clampPF(b){
  const R=BALL_R,CR=CORNER_R,cxL=PF.x+CR,cxR=PF.r-CR,cyT=PF.y+CR;
  // left corner arc
  if(b.x<cxL&&b.y<cyT){
    // ALWAYS correct inside the corner quadrant: every point beyond the arc
    // here is outside the table, so the ball must be held on the arc. The old
    // ad<CR+R upper bound let a ball a hair past the radius (e.g. ad=50.1 vs
    // the 49 limit after a superball kick) escape entirely — the clamp never
    // fired again and the ball accelerated out of the table.
    const adx=b.x-cxL,ady=b.y-cyT,ad=Math.hypot(adx,ady);
    if(ad>0.001){
      const nx=adx/ad,ny=ady/ad;b.x=cxL+nx*(CR+R);b.y=cyT+ny*(CR+R);
      const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=PHYS.wallBounce*vn*nx;b.vy-=PHYS.wallBounce*vn*ny;}
    }
  }
  // right corner arc — mirror of the left. The launch's guide curve (see
  // arcStep) swings the ball through this region on its own rail, clear of
  // the corner quadrant, so both arcs always seal their corners.
  if(b.x>cxR&&b.y<cyT){
    const adx=b.x-cxR,ady=b.y-cyT,ad=Math.hypot(adx,ady);
    if(ad>0.001){
      const nx=adx/ad,ny=ady/ad;b.x=cxR+nx*(CR+R);b.y=cyT+ny*(CR+R);
      const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=PHYS.wallBounce*vn*nx;b.vy-=PHYS.wallBounce*vn*ny;}
    }
  }
  // flat walls — skip the corner bands (the arcs own them)
  if(b.x<PF.x+R&&b.y>=cyT){b.x=PF.x+R;b.vx=Math.abs(b.vx)*PHYS.wallBounce;}
  if(b.x>PF.r-R&&b.y>=cyT){b.x=PF.r-R;b.vx=-Math.abs(b.vx)*PHYS.wallBounce;}
  if(b.y<PF.y+R&&b.x>=cxL&&b.x<=cxR){b.y=PF.y+R;b.vy=Math.abs(b.vy)*PHYS.wallBounce;}
}

/* ---------- top guide curve (the shooter lane's 90°+ arc) ---------- */
// Constrained-channel integration, run once per physics substep while
// Game.arc is set: the ball follows the guide rail, decelerating under
// gravity's tangential component (full g on the rise, zero at the apex,
// accelerating down the far side) and guide friction ∝ the normal force
// |v²/R − g·sinα| — outer rail while fast, inner rail while slow. A ball
// that runs out of speed stalls on the curve and rolls BACK down it (the
// authentic weak-plunge return: deterministic, no randomness). At the exit
// angle the ball is released into free flight — pull strength set only its
// speed; the guide fixes the direction, like a real machine.
function arcStep(b,dt){
  const A=Game.arc,g=PHYS.grav,R=CURVE_R;
  const N=Math.abs(A.v*A.v/R-g*Math.sin(A.a));
  A.v+=(-g*Math.cos(A.a)-PHYS.curveMu*N*(A.v>0?1:A.v<0?-1:-1))*dt;
  // A marginal plunge that creeps near the apex can't balance there (friction
  // vs gravity is a near-tie) — a real ball teeters and falls back. Nudge it.
  if(A.dir>0&&A.a<Math.PI/2&&A.v<15){A.dir=-1;A.v=-15;AudioSys.softPlunge();}
  const prevA=A.a,prevV=A.v;
  A.a+=(A.v/R)*dt;
  const cx=PF.r-24-R; // guide centre — entry sits on the tube centreline
  const exa=Math.PI/2+PHYS.exitDrop;
  if(A.a>=exa&&A.dir>0){ // ===== CURVE EXIT — into free flight =====
    // Exact release: the 240Hz substep can overshoot the exit angle by several
    // degrees (a fast ball sweeps ~0.09 rad/step), which fired the ball
    // measurably steeper than the solver's physics. Interpolate back to the
    // exact exit fraction of the step so sim and solver agree.
    const f=Math.max(0,Math.min(1,(exa-prevA)/((A.a-prevA)||1e-9)));
    A.a=exa;A.v=prevV+(A.v-prevV)*f;
    b.x=cx+R*Math.cos(A.a);
    b.y=CURVE_ENTRY_Y-R*Math.sin(A.a);
    b.vx=-Math.sin(A.a)*A.v;
    b.vy=-Math.cos(A.a)*A.v;
    Game.arc=null;Game.launching=false;
    Game.launchAnim=0.5; // glow flash as the ball enters play
    if(Game.saveArmed){Game.ballSaveTimer=5.0;Game.saveArmed=false;}
    // Skill shot arms ONLY inside the exact-power band — the pull whose
    // projectile path drops the ball onto the target. tuneLaunch derives the
    // band from this very curve's exit physics, so meter and physics agree
    // by construction. Too weak: the ball rolls back down the lane; too
    // strong: it overshoots the target and the shot is missed.
    Game.skillShotReady=!Game.skillShotDone&&Game.launchPower>=PHYS.skillShot.min&&Game.launchPower<=PHYS.skillShot.max;
    Game.skillShotT=Game.skillShotReady?SKILL_SHOT_TIME:0; // the live chance is on a clock
    AudioSys.launch();haptic(30+30*Game.launchPower,0.3+0.4*Game.launchPower);
    return;
  }
  b.x=cx+R*Math.cos(A.a);
  b.y=CURVE_ENTRY_Y-R*Math.sin(A.a);
  b.vx=-Math.sin(A.a)*A.v;
  b.vy=-Math.cos(A.a)*A.v;
  if(A.a<=0&&A.dir<0){ // rolled back to the lane — free fall to the plunger
    Game.arc=null;b.vx=0; // launching stays true: the tube catch re-arms
  }
}

function physStep(dt){
  const b=Game.ball;if(!b||!b.live)return;
  b.vy+=PHYS.grav*dt;
  let sp=Math.hypot(b.vx,b.vy);
  // Launch exemption: while the ball is in the launch flight (Game.launching
  // — lane climb, guide curve) the in-play speed cap doesn't apply; the
  // spring's real speed rules. The moment it enters play (launching→false)
  // the normal cap is back.
  if(sp>PHYS.maxVel&&!Game.launching){b.vx*=PHYS.maxVel/sp;b.vy*=PHYS.maxVel/sp;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  // Shooter-lane rolling resistance while the launch ball climbs — a real
  // ball rolling up the lane bleeds a little energy to friction on top of
  // the slope's gravity component.
  if(Game.launching&&b.vy<0)b.vy+=ROLL_F*dt;
  // Guide-curve entry — the climb reaches the tube top and swings into the
  // top guide; arcStep owns the ball from here.
  if(Game.launching&&!Game.arc&&b.vy<0&&b.y<=CURVE_ENTRY_Y){
    b.x=PF.r-24;b.y=CURVE_ENTRY_Y;
    Game.arc={a:0,v:Math.hypot(b.vx,b.vy),dir:1};
  }
  // ===== CURVE PHASE — the arc integrator is authoritative (position,
  // velocity, guide normal forces); free physics and clamps are skipped.
  if(Game.launching&&Game.arc){arcStep(b,dt);return;}
  const R=BALL_R;
  clampPF(b);
  // Left lane inner wall — keep the ball SURFACE clear of the divider (the
  // old PL_L+4 clamp let the ball body sink 9px into the rail)
  if(b.x<PL_L+6){b.x=PL_L+6;b.vx=Math.abs(b.vx)*PHYS.wallBounce;}
  // shooter lane inner wall — the ball stays in the playfield and bounces off
  // the lane divider. But ONLY when the ball is on the playfield side: once it
  // crosses OVER the divider and into the tube (x>laneX+BALL_R), the divider
  // lets it pass through so it can fall into the launch tube and onto the
  // plunger. (The old blanket push emptied the tube — the ball could never fall
  // into it and the user only saw it glitch through the wall.)
  const laneX=PF.r-48,laneExitY=PF.y+PF.h*0.10; // divider wall runs from the tube top down
  if(b.x>laneX-BALL_R-3&&b.y>laneExitY&&b.x<laneX+BALL_R){b.x=laneX-BALL_R-3;b.vx=-Math.abs(b.vx)*PHYS.wallBounce;}

  // ===== skill shot — bonus target hit from launch =====
  if(Game.skillShotReady){
    const ss=Game.skillShot;
    // The collect radius is per-preset, derived by tuneLaunch (difficulty
    // parity after the target moved to the lane-circle line — see there);
    // PHYS is the live source, Game.skillShot.collect only a fallback.
    const sr=((PHYS.skillShot&&PHYS.skillShot.collect)||ss.collect||ss.r)+R;
    const sdx=b.x-ss.x,sdy=b.y-ss.y;
    if(sdx*sdx+sdy*sdy<sr*sr){
      const skillBonus=5000;
      addScore(skillBonus);flash();
      Game.msg='SKILL SHOT +'+skillBonus;Game.msgT=2.0;
      AudioSys.skill();haptic(70,0.8);
      burst(ss.x,ss.y,3);
      Game.skillShotReady=false;Game.skillShotDone=true; // collected — one per ball
    }
  }

  // bumpers — real pop bumpers fire a solenoid ring, kicking the ball outward energetically
  for(const bp of Game.bumpers){
    // hw = drawn bumper radius so the ball surface stays flush with the ring
    const hw=bp.r,dx=b.x-bp.x,dy=b.y-bp.y;
    if(Math.abs(dx)<hw+R&&Math.abs(dy)<hw+R){
      const ox=(hw+R)-Math.abs(dx),oy=(hw+R)-Math.abs(dy);
      const jit=()=>(Math.random()-0.5)*PHYS.bumperJitter;
      const kickSpd=PHYS.bumperKick;
      // REAL POP BUMPER KICK: the solenoid ring fires UPWARD (the skirt is
      // pushed up by the coil), so the ball is flung up-and-away from the
      // bumper regardless of where it contacts — a genuine energy ADDER that
      // keeps play in the upper playfield. The old code kicked radially
      // (sign(dy)), so a ball clipping a bumper's UNDERSIDE — the common case
      // for a rising centre/side shot — got slammed straight back DOWN or
      // sideways into a lane: the "play is limited to the bottom half" bug.
      // Direction = radial normal blended with a strong upward bias, speed =
      // max(current speed, kick) so bumpers always ADD energy, never steal it.
      const d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
      // Up-biased kick direction. The random lateral term in kx keeps a
      // dead-centre hit from firing perfectly vertical (kx=0): a purely
      // vertical kick ping-pongs the ball straight up-and-down against the
      // top wall instead of caroming between the three bumpers, so the ball
      // falls straight back down the centre lane — the "play sags back down"
      // symptom. A small always-present lateral spread forces every bumper
      // hit to deflect the ball sideways a little, so it drifts into the
      // neighbouring bumpers and stays alive in the upper playfield.
      const kx=nx*0.55+(Math.random()-0.5)*0.30,ky=ny*0.55-0.82;
      const kl=Math.hypot(kx,ky)||1;
      const out=Math.max(Math.hypot(b.vx,b.vy),kickSpd);
      b.vx=kx/kl*out+jit();b.vy=ky/kl*out+jit()*0.8;
      b.x+=Math.sign(dx)*ox;b.y+=Math.sign(dy)*oy;
      addScore(bp.v*100);bp.hit=5;AudioSys.bumper(bp.v);haptic(40,0.7);flash();burst(b.x,b.y,bp.col);
      Game.skillShotReady=false;
      // Clamp after bumper push and break — one bumper per sub-step
      clampPF(b);
      break;
    }
  }
  // special target — always solid; LIT pays the escalating centre streak
  const sp2=Game.special;
  {const dx=b.x-sp2.x,dy=b.y-sp2.y;
    if((sp2.cool||0)<=0&&dx*dx+dy*dy<(sp2.r+R)*(sp2.r+R)){
      sp2.cool=0.12; // refractory — one score/kick per contact (substeps re-enter radius)
      const wasLit=sp2.lit;
      sp2.lit=false;sp2.t=0;
      const d=Math.hypot(dx,dy)||1;
      b.vx=dx/d*Math.max(Math.hypot(b.vx,b.vy),PHYS.specialKick);b.vy=dy/d*Math.max(Math.abs(b.vy),PHYS.specialKick);
      let pts;
      if(wasLit){
        sp2.streak=Math.min(3,(sp2.streak||0)+1);
        pts=sp2.streak===1?1000:sp2.streak===2?2500:5000;
        Game.msg='SPECIAL '+pts+(sp2.streak>1?' ×'+sp2.streak:'');
      }else{
        pts=500;Game.msg='TARGET 500';
      }
      addScore(pts);flash();AudioSys.special();haptic(90,1);
      Game.msgT=1.2;burst(b.x,b.y,3);
      Game.skillShotReady=false; // consumed on first contact
    }
  }
  // top diamond lights — pass-over switches (original game behaviour):
  // the ball rolls straight over them, switching each one off and awarding
  // 100 pts, with NO deflection or bounce whatsoever.
  for(const t of Game.targets){
    if(t.down)continue;
    const over=Math.abs(b.x-t.x)<20&&Math.abs(b.y-t.y)<20;
    if(over&&!t.in){
      t.in=true;t.down=true;
      addScore(100);AudioSys.target();haptic(35,0.6);ring(t.x,t.y,'#ffd23a');
      // NOTE: diamonds are no-deflection pass-over switches — rolling over
      // one must NOT cancel an armed skill shot. The band-power launch
      // descent clips the right diamond's sensor ~145px above the disc
      // (measured: ready was consumed at y≈217 on its way to the target),
      // which stole the shot from the slow half of the arming band.
      if(Game.targets.every(q=>q.down)){
        if(Game.bumperVal<9)Game.bumperVal++;
        Game.bumpers.forEach(bp=>bp.v=Game.bumperVal);
        Game.msg='BUMPER VALUE '+Game.bumperVal;Game.msgT=1.4;
        setTimeout(()=>Game.targets.forEach(q=>{q.down=false;q.in=false;}),1200);
      }
    }else if(!over){t.in=false;}
  }
  // rollover lanes — only trigger on downward pass through lane
  for(let i=0;i<Game.rolls.length;i++){
    const r=Game.rolls[i];
    const inside=Math.abs(b.x-r.x)<18&&Math.abs(b.y-r.y)<28;
    if(inside&&!r.in){
      r.in=true;addScore(100);AudioSys.roll();
      if(i===0){
        // LEFT ROLLOVER: increments left roll counter
        Game.leftRoll=Math.min(Game.leftRoll+1,4);
        ring(r.x,r.y,'#3fd0ff');
      } else {
        // ATARI ROLLOVER: lights ATARI symbols, extra ball after 4 hits
        Game.bonus=Math.min(Game.bonus+1,9);Game.atariHits++;
        ring(r.x,r.y,'#ff7a2a');
        if(Game.atariHits>=4&&!Game.extra[Game.cur]&&!Game.usedExtra[Game.cur]){
          Game.extra[Game.cur]=true;AudioSys.extra();
          Game.msg='EXTRA BALL';Game.msgT=2;
        }
      }
    } else if(!inside){r.in=false;}
  }
  // spinners — POWERED kicker-style: the blade catches the ball and whips it
  // back UP toward the bumper zone. (Real spinners are passive, but the table
  // needs an upper-playfield energy source — the old logic DRAINED the ball's
  // speed here, which is why play sagged into the bottom half.) Power scales
  // with the ball's impact speed: a fast ball through the spinner gets flung
  // higher, rewarding speed. Kick aims up and toward the table centre so the
  // ball rejoins the bumper flow instead of dead-ending in an outlane.
  for(const s of Game.spinners){
    s.cd=Math.max(0,s.cd-dt);
    const inside=Math.abs(b.x-s.x)<12&&Math.abs(b.y-s.y)<24;
    if(inside&&s.cd<=0){
      s.cd=0.12;
      const impactSpeed=Math.hypot(b.vx,b.vy);
      s.spin=Math.min(200,Math.floor(impactSpeed*0.35));
      addScore(1);AudioSys.spin();
      Game.skillShotReady=false; // consumed on first contact
      const kick=PHYS.spinnerKick+Math.min(impactSpeed,600)*PHYS.spinnerKickScale;
      const towardC=(s.x<PL_CX)?1:-1; // ALWAYS steer toward the table centre
      b.vx=towardC*kick*0.45;
      b.vy=-kick*0.9; // upward
    }
    if(s.spin>0){s.ang+=3.5;s.spin-=Math.random()<0.20?0:1;}
  }
  // flippers — only one can collide per sub-step to avoid ping-pong trap
  if(flipperStep(b,FL.l,dt)){}else flipperStep(b,FL.r,dt);
  // guide rails
  const gg=guideGeom();
  for(const g of gg)segCollide(b,g[0],g[1],g[2],g[3],G_RAD,PHYS.guideBounce,g[4]);
  // Re-clamp to playfield after collision pushes — prevent wall escapes
  clampPF(b);
  if(b.x<PL_L+6){b.x=PL_L+6;b.vx=Math.abs(b.vx)*PHYS.wallBounce;}
  const laneX2=PF.r-48,laneExitY2=PF.y+PF.h*0.10;
  // Shooter-lane divider (upper section only): keep the ball on the playfield
  // side until it drops into the tube mouth from above. The lower angled
  // outlane wall is handled by the guide-rail collision (guideGeom, tMax 1.0)
  // which deflects smoothly. The old hard clamp here yanked a ball that had
  // reached the tube/outlane channel ~150px left in ONE frame — the "ball
  // glitched from the right side to the left" teleport. Removed; the rail
  // collision plus the right-outlane drain check handle that region cleanly.
  if(b.y>laneExitY2&&b.y<WALL_TOP_Y&&b.x>laneX2-BALL_R-3&&b.x<laneX2){
    b.x=laneX2-BALL_R-3;b.vx=-Math.abs(b.vx)*PHYS.wallBounce;
  }
  // ===== tube catch (real pinball) =====
  // A live ball that falls back into the shooter lane settles on the plunger
  // and can be relaunched with NO penalty — no drain, no ball advance. The
  // divider above lets in-tube balls pass through, so this only fires for a
  // genuine fall-in: the ball is fully inside the tube (x past the divider),
  // low in the lane (y past the plunger's rest tip, and well ABOVE the drain
  // line so it always beats the outlane drain check), and not moving up. No
  // speed gate — a ball falling down the tube is moving fast the whole way and
  // would drain before it ever slowed down. resetBall() parks it on the rod
  // tip and re-arms the launcher; score, rolls and flippers are untouched.
  if(b.x>laneX2+BALL_R&&b.y>PF.b-60&&b.vy>-50){
    // A rolled-back ball settling onto the rod — the soft mechanical thunk
    // that closes the failed-plunge story (whiff at the stall, rattle on the
    // way down, thunk here)
    if(Game.launching)AudioSys.plungerSettle();
    resetBall();if(!demoMode)state=S.LAUNCH;return;
  }
  // Final guide-rail pass — a bumper or flipper push must never leave the
  // ball overlapping a rail at the end of a step.
  for(const g of gg)segCollide(b,g[0],g[1],g[2],g[3],G_RAD,PHYS.guideBounce,g[4]);
  // Cap velocity after all collisions — bumpers/rails can stack speed past MAXV.
  // Same launch exemption as the top of physStep: the spring's real speed
  // rules until the curve exit; the moment it enters play the cap is back.
  sp=Math.hypot(b.vx,b.vy);if(sp>PHYS.maxVel&&!Game.launching){b.vx*=PHYS.maxVel/sp;b.vy*=PHYS.maxVel/sp;}
  // ===== bottom drain zones =====
  // The flippers are the last line of defence: a ball still in contact with a
  // bat is supported and stays in play. Everything else below the flipper line
  // drains. (A ball resting on a flipper must NOT count as drained.)
  const restTipLX=FL.l.x+Math.cos(FL.l.rest)*FL.l.len;
  const restTipRX=FL.r.x-Math.cos(FL.r.rest)*FL.r.len;
  const Rf=BALL_R+8;
  const cl=flipperContact(b,FL.l),cr=flipperContact(b,FL.r);
  // "On the flipper" = touching the BAT BODY from the playfield side, with the
  // ball's projection genuinely on the body (tRaw>=0.14 — past the base end it
  // is in the drain and must fall). The pivot area is NOT part of the flipper.
  // +1 tolerance: the flipper clamp rests the ball at EXACTLY Rf, so a strict
  // < would misclassify a resting ball as not-on-flipper and drain it.
  const onFlip=(cl.tRaw>=0.14&&cl.d<Rf+1&&cl.face>-8)||(cr.tRaw>=0.14&&cr.d<Rf+1&&cr.face>-8);
  if(!onFlip){
    // outlanes — past the outer edge of either flipper. The threshold covers the
    // pivot region so a ball falling beside a flipper base always drains.
    if(b.y>FL.l.y-2&&(b.x<FL.l.x+10||b.x>FL.r.x-10)){b.live=false;ballDrained();return;}
    // centre drain — between the two flipper tips
    if(b.y>FL.l.y+8&&b.x>restTipLX-4&&b.x<restTipRX+4){b.live=false;ballDrained();return;}
    // safety floor — never let the ball fall off the table
    if(b.y>PF.b+28){b.live=false;ballDrained();return;}
  }
  // drain holes (difficulty a)
  for(const dh of Game.drainHoles){if(Math.hypot(b.x-dh.x,b.y-dh.y)<20){b.live=false;ballDrained();return;}}
  // stuck detection — a ball resting on a flipper is NOT stuck; it's waiting
  // for the player to flip. Only rescue balls stuck elsewhere on the table.
  if(!onFlip){
    if(sp<PHYS.stuckSpd){b.stuck+=dt;}else b.stuck=0;
    const inBottom=b.y>PF.b-150;
    if(b.stuck>(inBottom?PHYS.stuckBot:PHYS.stuckTop)){
      if(inBottom){b.live=false;ballDrained();return;}
      b.vy=-PHYS.stuckVy;b.vx+=(Math.random()-0.5)*PHYS.stuckVxJit;b.stuck=0;
    }
    // Anti-loop: only a FAST ball that keeps returning to the EXACT same 30px
    // cell is genuinely looping (e.g. pinballed between two walls — it returns
    // to the same cells every cycle). Neighbour-tolerance was the bug: a ball
    // falling or rolling straight down a narrow lane stays in one x-column, so
    // its grid history was full of adjacent cells and it got slammed with
    // +260px/s down + sideways jitter mid-fall. A straight-line ball NEVER
    // returns to an exact cell, so exact-match counting is safe. Slow balls are
    // covered by the stuck-rescue above. The kick always pushes the ball DOWN
    // into the playfield (never up, which would pin it against the top wall).
    if(!b.visitGrid)b.visitGrid=[];
    const gx=Math.floor(b.x/30),gy=Math.floor(b.y/30),key=gx*1000+gy;
    // Record a cell visit ONLY on entry (cell change). Counting every frame was
    // wrong: a ball slowly accelerating down a lane lingers in each 30px cell
    // for many frames, so its own cell showed 12+ "revisits" and it got slammed
    // with +260px/s down + sideways jitter mid-fall (the mystery corner kicks).
    // With entry-only recording a straight-line ball enters every cell exactly
    // once — only a genuine loop (returning to cells it has left) accumulates.
    if(b.lastCell!==key){
      b.lastCell=key;
      b.visitGrid.push(key);
      if(b.visitGrid.length>300)b.visitGrid.shift();
      let revisits=0;
      for(const k2 of b.visitGrid){if(k2===key)revisits++;}
      // 8+ re-entries of the same cell within recent history = a real loop; a
      // normal ball never returns to a cell 8 times. Require real speed — slow
      // balls are covered by the stuck-rescue above. NOTE: do NOT reset b.stuck
      // here — a ball wedged in geometry needs the stuck-rescue (kick/drain) to
      // fire; resetting stuck would hold it forever.
      if(revisits>=8&&sp>200){
        b.vy=Math.abs(b.vy)+260+Math.random()*160;
        b.vx+=(Math.random()-0.5)*220;
        b.visitGrid=[];
      }
    }
  }
  b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>8)b.trail.pop();
}

const FL={
  // Flipper geometry modelled on real pinball machines:
  // - pivots ~24px above the playfield floor (PF.b-24), 100px bats (≈3" bat)
  // - rest droop 0.20 rad (~11.5°) — the tips sit level with the playfield edge
  // - full swing to -0.52 rad (~-30°) — a ~41° sweep, tips clear the drain
  // - pivot spread 23% of play width each side → ~47px gap between rest tips
  //   (≈1.8 ball diameters — a fair centre drain, and the bats never touch)
  l:{x:PL_CX-PL_W*0.23,y:PF.b-24,len:100,ang:0.20,rest:0.20,up:-0.52,av:0,prev:0.20,side:-1},
  r:{x:PL_CX+PL_W*0.23,y:PF.b-24,len:100,ang:Math.PI-0.20,rest:Math.PI-0.20,up:Math.PI+0.52,av:0,prev:Math.PI-0.20,side:1}
};
function flipperContact(b,f){
  // Closest point on the BAT BODY, with t clamped to [0.14,1]. The pivot area is
  // deliberately excluded: a full capsule around the pivot lets balls wedge in
  // the notch beside a raised flipper and hang there forever (the ball gets
  // clamped 21px from the pivot endpoint, catch-friction pins it, and it counts
  // as "on the flipper" so the stuck-rescue never fires). Balls rolling down the
  // outlane guides must be free to fall past the pivot into the drain.
  // tRaw is the UNCLAMPED projection: a ball whose closest point lies past the
  // base end (tRaw<0.14) is NOT on the bat — it must fall into the drain rather
  // than rest on the rounded base cap (the "hung on the flipper edge" bug).
  const len=f.len||80;
  const dx=Math.cos(f.ang)*len,dy=Math.sin(f.ang)*len;
  const tRaw=((b.x-f.x)*dx+(b.y-f.y)*dy)/(dx*dx+dy*dy);
  let t=tRaw;if(t<0.14)t=0.14;if(t>1)t=1;
  const px=f.x+dx*t,py=f.y+dy*t;
  const d=Math.hypot(b.x-px,b.y-py);
  // Signed distance to the bat's playfield-side face. Positive = ball above the
  // bat (playfield side) — only these collide. A ball behind a swinging bat
  // (drain side) passes through and drains instead of being slapped back up.
  const npx=-f.side*Math.sin(f.ang),npy=f.side*Math.cos(f.ang);
  const face=(b.x-f.x)*npx+(b.y-f.y)*npy;
  return {t:t,tRaw:tRaw,d:d,face:face,px:px,py:py};
}
function segCollide(b,x1,y1,x2,y2,rad,rest,tMax){
  // tMax < 1 truncates the collision: the segment's tail (near the flippers) is
  // pass-through so a ball rolling off the guide can fall onto the flipper or
  // into the drain instead of wedging between the guide end and the bat base.
  const dx=x2-x1,dy=y2-y1;
  const t=Math.max(0,Math.min(tMax||1,((b.x-x1)*dx+(b.y-y1)*dy)/(dx*dx+dy*dy)));
  const px=x1+dx*t,py=y1+dy*t;
  let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny);
  if(d<rad&&d>0.001){nx/=d;ny/=d;b.x=px+nx*rad;b.y=py+ny*rad;
    const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=rest*vn*nx;b.vy-=rest*vn*ny;}return true;}
  return false;
}
function guideGeom(){
  return[
    // lower outlane guides — feed the ball ONTO the flippers. Both are perfect
    // mirrors across PL_CX: the left starts at the left rail (x=PL_L), the right
    // at the right rail (x=PL_R) at the same height, and both angle inward to
    // the flipper pivots. The collision runs all the way to the pivot (tMax 1)
    // so the ball rides the guide down and is released ON the bat body
    // (t≈0.15, right of the pivot). With the old 0.85 cut the ball was released
    // at x≈232-245 — left of the bat's usable body (t≥0.14 ⇒ x≥252) — and
    // fell straight into the outlane corner: the "corner drain" on both sides.
    // No wedge risk: the bat collision excludes the pivot (tRaw≥0.14 gate), so
    // the guide end hands the ball cleanly to the bat base.
    [PL_L,WALL_TOP_Y,FL.l.x-2,FL.l.y,1.0],
    [PL_R,WALL_TOP_Y,FL.r.x+2,FL.r.y,1.0],
    // ---- LEFT BALL RETURN LANE (48px tube, mirrors right shooter lane) ----
    [PL_L, PF.y+PF.h*0.10, PL_L, FL.l.y-10],
    // ---- PASS-THROUGH LANE CORRIDORS — tight narrow lanes ----
    [PL_L+PL_W*0.19, LANE_TOP+4, PL_L+PL_W*0.19, LANE_BOT-44],
    [PL_L+PL_W*0.31, LANE_TOP+4, PL_L+PL_W*0.31, LANE_BOT-44],
    // Right lane: tight walls on both sides
    [PL_R-PL_W*0.31, LANE_TOP+4, PL_R-PL_W*0.31, LANE_BOT-44],
    [PL_R-PL_W*0.19, LANE_TOP+4, PL_R-PL_W*0.19, LANE_BOT-44],
    // NOTE: no horizontal bar between the lower bumpers. The original game has
    // the SPECIAL target freely hittable in the centre lane between the two
    // lower bumpers — a decorative chrome bar there hard-stopped every centre
    // shot (vy −1100 → +1 in one frame), pinning play to the bottom half of
    // the table and making the SPECIAL target unreachable. Removed so centre
    // flips flow up the middle to the top bumper/diamonds like the original.
  ];
}
function flipperAnimate(f,dt){
  // The pure animation half of flipperStep — bat angle, surface velocity and
  // oblique-steer reset, NO ball interaction. Runs from the PLAY physics AND
  // from the LAUNCH tick so the bats answer the buttons while you aim (a real
  // machine's flippers are live whenever a ball is on the plunger; the old
  // code left them frozen through the whole launch phase).
  // Tilt de-energizes the flippers — they drop to rest and stay dead until the
  // ball ends (authentic: a tilted machine won't fire the coils).
  const target=Game.tilt?f.rest:(f.side<0?input.lFlip:input.rFlip)?f.up:f.rest;
  const prev=f.ang;
  // Cap the per-substep swing: the raw lerp (dt*flipperSpeed) sweeps the bat TIP
  // ~33px in one 1/240s sub-step — faster than the 26px ball diameter — so a
  // flipping bat skipped clean through a ball resting in the middle of the bat
  // (the "ball passes through the flipper" bug). 0.10 rad/substep ≈ 10px tip
  // sweep (well under the ball diameter) and ~28 rad/s — a realistic flip that
  // can never tunnel. Flip POWER (restitution) ramps off f.av and saturates at
  // the 1.2 cap below (a real solenoid imparts MORE than elastic restitution).
  const dang=Math.max(-0.10,Math.min(0.10,(target-f.ang)*Math.min(1,dt*PHYS.flipperSpeed)));
  f.ang+=dang;f.av=(f.ang-prev)/dt;
  // Bat back at rest → the next swing gets its own oblique steering
  if(Math.abs(f.ang-f.rest)<0.012&&Math.abs(f.av)<2)f._obl=false;
}
function flipperStep(b,f,dt){
  flipperAnimate(f,dt);
  const R=BALL_R+8,fx=f.x,fy=f.y;
  const ux=Math.cos(f.ang),uy=Math.sin(f.ang);
  const c=flipperContact(b,f);
  // d<R+1 (not d<R): the clamp below pushes the ball to EXACTLY R, so a strict
  // d<R would leave a resting ball out of contact every frame — it would free-
  // slide down the bat face with no friction and no clamp. The +1 tolerance
  // keeps a settled ball "in contact" so the catch friction holds it.
  if(c.tRaw>=0.14&&c.d<R+1&&c.d>0.001&&c.face>-8){
    const nx=(b.x-c.px)/c.d,ny=(b.y-c.py)/c.d;
    b.x=c.px+nx*R;b.y=c.py+ny*R;
    const rx=c.px-fx,ry=c.py-fy;const svx=-f.av*ry,svy=f.av*rx;
    const rvx=b.vx-svx,rvy=b.vy-svy;const vn=rvx*nx+rvy*ny;
    if(vn<0){
      // Per-contact-spot restitution: tip hits harder than base.
      // c.t = distance from pivot along the bat (0=base, 1=tip).
      // Resting flippers use flipperRestBase (~0.4 = real pinball rubber, so the
      // ball BOUNCES off a still bat instead of thudding dead onto it), and a
      // swinging flipper ramps up to a 1.2 cap. A real solenoid flipper imparts
      // MORE than elastic restitution (Power Law ≈2 — the flipper's momentum
      // transfers into the ball), so rest>1 on a full swing is correct; the
      // ball leaves with the bat's surface velocity PLUS its bounce.
      const baseRest=Math.min(1.2,PHYS.flipperRestBase+Math.min(0.95,Math.abs(f.av)/PHYS.flipperRestScale));
      const rest=baseRest*(0.6+0.4*c.t);
      b.vx-=(1+rest)*vn*nx;b.vy-=(1+rest)*vn*ny;
      // Oblique correction — ONE-SHOT per swing (the flag prevents re-adds on
      // every contact substep and on the ball's return bounce): steer the shot
      // toward the table CENTRE. Without it a left-flipper launch drifts left
      // up the rise, grazes the underside of the bottom-left pop bumper and is
      // knocked straight back DOWN — the whole table never opens up. Real
      // flippers steer shots toward the middle; this is the same idea. 24% of
      // the new vertical speed, capped — weak taps stay soft, full flips climb
      // the centre.
      if(!f._obl){f._obl=true;b.vx+=(f.side<0?1:-1)*Math.min(380,Math.abs(b.vy)*0.24);}
      if(Math.abs(f.av)>2){AudioSys.flip();haptic(25,0.4);}
    }
    // BASE ZONE (t<0.4): force a slow settled ball to roll DOWNHILL along the
    // bat — toward the tip when the bat droops, toward the base when raised.
    // Without this, a ball landing on the bat's inner end balances on the
    // rounded collision cap and freezes forever (the "hung on the flipper edge"
    // bug). Rolling toward the base when raised lets the ball fall into the
    // drain; rolling onto the face when drooped ends in a normal catch.
    const sdir=Math.sign(Math.sin(f.ang));
    const along=b.vx*ux+b.vy*uy;
    if(c.t<0.4&&Math.abs(f.av)<6&&Math.hypot(b.vx,b.vy)<200){
      b.vx+=(sdir*80-along)*ux;b.vy+=(sdir*80-along)*uy;
    }else if(Math.abs(f.ang-f.up)<0.15&&c.t>0.2&&c.t<0.92&&Math.abs(f.av)<4&&Math.hypot(b.vx,b.vy)<150){
      // The catch ONLY works on a flipper you are actively holding up — real
      // pinball: a ball landing on a drooped (resting) flipper rolls off the
      // tip and drains. Strong friction along the bat holds the ball on the
      // rubber until you release. Only on the BAT BODY: at the tip the friction
      // would trap the ball — there it stays free to roll off into the drain.
      b.vx-=along*ux*0.95;b.vy-=along*uy*0.95;
    }
    return true;}
  return false;}

/* ---------- drain / tally / tilt ---------- */
function ballDrained(){
  // Demo mode: the attract AI just relaunches — no ball-save, tally or game over
  if(demoMode){
    Attr.phase='drained';Attr.timer=1.6+Math.random()*0.8;
    Game.skillShotDone=false; // each attract ball re-offers the skill shot
    resetBall();return;
  }
  // Ball-save: if still in grace window, return ball to plunger
  if(Game.ballSaveTimer>0){
    Game.ballSaveTimer=0; // consumed — one save per launch
    Game.msg='BALL SAVED';Game.msgT=2.0;
    Game.flashes=5;Game.shakeT=0.15;
    AudioSys.save();haptic(40,0.3);
    resetBall();state=S.LAUNCH;return;
  }
  if(Game.tilt){
    if(Game.leftRoll>0)addScoreFlat(Game.leftRoll*1000);
    Game.extra[Game.cur]=false;endTurn();return;
  }
  Game.saveArmed=true; // a drain arms the save for the next launch
  let pay=0;if(Game.leftRoll>0)pay+=Game.leftRoll*1000;
  const totalPay=pay*Game.bonus;
  Game.tally={base:pay,mult:Game.bonus,paid:0,total:totalPay,t:0,_tickAcc:0};
  AudioSys.drain();haptic(120,0.9);state=S.TALLY;
}
function tallyStep(dt){
  const t=Game.tally;if(!t)return;t.t+=dt;
  // Pacing: short pause, then count at increasing speed in a BOUNDED number of
  // ticks (the old geometric step — remaining/10 — decayed asymptotically, so a
  // 36000 payout took ~6s of dead time), then a brief hold at the total.
  if(t.paid<t.total&&t.t>0.4){
    // Speed ramps up: starts slow, finishes fast
    const speedFrac=Math.min(1,(t.t-0.4)/0.5); // ramp over 0.5s
    const ticksPerSec=6+speedFrac*20; // 6→26 ticks/sec
    const tickInterval=1/ticksPerSec;
    // Accumulate fractional ticks
    if(!t._tickAcc)t._tickAcc=0;
    t._tickAcc+=dt;
    // Total tick budget: 6 ticks for a small payout, up to 30 for the max —
    // the count ALWAYS finishes in ~1.5–2.5s regardless of the total.
    if(t._left===undefined)t._left=Math.max(6,Math.min(30,Math.ceil(t.total/600)));
    while(t._tickAcc>=tickInterval&&t.paid<t.total&&t._left>0){
      t._tickAcc-=tickInterval;
      // Even steps over the remaining ticks — finishes EXACTLY on the last
      // tick (no asymptotic tail), and never under/over-shoots the total.
      const remaining=t.total-t.paid;
      const step=Math.max(1,Math.ceil(remaining/t._left));
      t._left--;
      const add=Math.min(step,remaining);
      addScoreFlat(add);t.paid+=add;
      AudioSys.tallyTick();
    }
  }
  // Zero-payout drains flash through quickly (0.7s); paid payouts hold the
  // total until t≈2.4s so the final number sits readable for ~0.7s after the
  // count lands (~1.7s) before the next ball.
  const holdTime=t.total>0?2.4:0.7;
  if(t.paid>=t.total&&t.t>holdTime){
    // Transition: null the tally and move on
    // Draw holds Game.tally for one extra frame so the final total is visible
    if(!t._done){t._done=true;return;}
    Game.tally=null;
    if(Game.extra[Game.cur]){Game.extra[Game.cur]=false;Game.usedExtra[Game.cur]=true;
      Game.msg='X PLAY';Game.msgT=1.5;resetBall();state=S.LAUNCH;return;}
    if(Game.balls[Game.cur]<3){Game.balls[Game.cur]++;startTurn();return;}
    if(Game.players===2&&Game.cur===0){Game.cur=1;startTurn();return;}
    gameOver();
  }
}
function endTurn(){
  Game.tally=null;
  if(Game.balls[Game.cur]<3){Game.balls[Game.cur]++;startTurn();return;}
  if(Game.players===2&&Game.cur===0){Game.cur=1;startTurn();return;}
  gameOver();
}
function gameOver(){
  state=S.GAMEOVER;Game._goT=performance.now();AudioSys.over();clearSave();
  // Total = both players' scores (P1 base; P2 added in 2-player games)
  const final=Game.scores[0]+(Game.players===2?Game.scores[1]:0);
  Game.rank=final>250000?'PINBALL WIZARD':final>100000?'SOLID STATE PRO':
    final>40000?'TECHNICIAN':final>10000?'APPRENTICE':'ROOKIE';
  const s=final,idx=store.scores.findIndex(x=>s>x);
  if(idx>=0){store.scores.splice(idx,0,s);store.names.splice(idx,0,'AAA');
    store.scores=store.scores.slice(0,8);store.names=store.names.slice(0,8);
    Game.entryRank=idx;state=S.ENTRY;Game.entryBuf=0;Game.entryChar=['A','A','A'];}
  saveStore();
}
function nudgeStep(dt){
  if(tiltBob.cd>0)tiltBob.cd--;
  if(state!==S.PLAY){input.nudgeL=input.nudgeR=input.nudgeU=false;return;}
  let dir=0,dy=0;
  if(input.nudgeL){dir=-1;input.nudgeL=false;}
  else if(input.nudgeR){dir=1;input.nudgeR=false;}
  else if(input.nudgeU){dy=-1;input.nudgeU=false;}
  if(dir||dy){
    Game.tiltHeat+=1;Game.shakeT=0.12;AudioSys.nudge();
    const b=Game.ball;if(b&&b.live&&!Game.launching){b.vx+=dir*PHYS.nudgeX;b.vy+=dy*PHYS.nudgeY;}
    // Tilt threshold from sensitivity: LOW=7, NORMAL=5, HIGH=3
    const tiltThresh=[7,5,3][store.tilt-1]||5;
    if(Game.tiltHeat>tiltThresh-1)doTilt();
  }
  Game.tiltHeat=Math.max(0,Game.tiltHeat-dt*1.0);
}
function doTilt(){Game.tilt=true;Game.tiltHeat=0;AudioSys.tilt();haptic(300,1);Game.msg='TILT';Game.msgT=2.5;}
function specialStep(dt){
  const s=Game.special;
  if(s.cool)s.cool-=dt;
  if(s.lit){s.t-=dt;if(s.t<=0)s.lit=false;}
  else{s.cd=(s.cd||0)-dt;if(s.cd<=0){s.lit=true;s.t=10;s.cd=5+Math.random()*4;}}
}

/* ---------- particles ---------- */
function burst(x,y,kind){
  const cols=kind===0?['#ffb347','#ff7a2a','#fff']:kind===1?['#7ad0ff','#3f7fff','#fff']:
    kind===2?['#a5ffb0','#37e06a','#fff']:kind===3?['#ffd95a','#ffb020','#fff']:['#ff8a6a','#ff5a3a','#fff'];
  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,sp=120+Math.random()*300;
    Game.pfx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0.4+Math.random()*0.4,t:0,col:cols[i%cols.length],size:2+Math.random()*2.6});}
}
function ring(x,y,col){Game.pfx.push({x,y,vx:0,vy:0,life:0.5,t:0,col,size:6,ring:true});}
function pfxStep(dt){
  const p=Game.pfx;Game.pfxLife=0;
  for(let i=p.length-1;i>=0;i--){const q=p[i];q.t+=dt;
    if(q.t>=q.life){p.splice(i,1);continue;}
    if(!q.ring){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.grav||420)*dt;q.vx*=0.98;}}
}

/* ---------- menus ---------- */
let menuIdx=0,optIdx=0;
function menuItems(){const base=['OPTIONS','HIGH SCORES','HOW TO PLAY'];if(hasSave())return['RESUME GAME','DISCARD SAVE'].concat(base);return['START GAME'].concat(base);}
function uiConfirm(){
  AudioSys.uiBig();
  if(state===S.TITLE){state=S.MENU;demoMode=false;menuIdx=0;return;}
  if(state===S.MENU){
    if(menuIdx===0){if(hasSave()&&loadGame());else newGame();}
    else if(hasSave()&&menuIdx===1){clearSave();state=S.MENU;menuIdx=0;}
    else{const off=hasSave()?2:1;
      if(menuIdx===off){state=S.OPTS;optIdx=0;}
      else if(menuIdx===off+1){state=S.SCORES;}
      else state=S.HELP;}return;
  }
  if(state===S.OPTS){
    if(optIdx===0)Game.game=Game.game%4+1;
    else if(optIdx===1)Game.diff=1-Game.diff;
    else if(optIdx===2)store.snd=!store.snd;
    else if(optIdx===3)store.hap=!store.hap;
    else if(optIdx===4)store.tilt=store.tilt%3+1; // cycle 1→2→3→1
    else if(optIdx===5)setPhysics(store.physics==='atari'?'arcade':store.physics==='arcade'?'superball':'atari');
    else if(store.physics==='arcade'&&optIdx===6)setAngle(store.angle%5+1);
    else{state=S.MENU;}
    store.game=Game.game;store.diff=Game.diff;saveStore();return;
  }
  if(state===S.SCORES||state===S.HELP||state===S.PAUSE){state=S.MENU;return;}
  if(state===S.GAMEOVER){state=S.TITLE;return;}
  // ENTRY is handled by its dedicated keydown handler (letters set + advance,
  // Enter/Space advance or commit) and by pad/touch below — uiConfirm itself
  // must do nothing here. (It used to bump the letter on Enter, which fired
  // alongside the dedicated handler and corrupted the final initial.)
}
function uiBack(){AudioSys.ui();
  if(state===S.OPTS||state===S.SCORES||state===S.HELP)state=S.MENU;
  else if(state===S.MENU)state=S.TITLE;
  else if(state===S.PAUSE){state=Game.prevState;}}
function uiMove(d){AudioSys.ui();const n=(state===S.MENU)?menuItems().length:(state===S.OPTS?(store.physics==='arcade'?8:7):0);if(!n)return;
  if(state===S.MENU)menuIdx=(menuIdx+d+n)%n;else optIdx=(optIdx+d+n)%n;}
function uiTouch(x,y){if(state===S.TITLE){uiConfirm();return;}
  if(state===S.ENTRY){if(Game.entryBuf<2)Game.entryBuf++;else commitEntry();Game.entryTimer=performance.now();return;}
  if(state===S.MENU||state===S.OPTS){if(y>0.8)uiMove(1);else if(y<0.2)uiBack();else uiConfirm();return;}
  uiConfirm();}
// Number of OPTIONS rows that cycle a value (the rest are BACK / sub-rows)
const optEditableRows=()=>store.physics==='arcade'?7:6;
// Vertical layout for panel rows — the whole block is centred in the card so
// short lists don't hug the top. drawPanel and rowHitIndex share these.
function menuRowY(i){
  const py=100,ph=H-230;
  const n=menuItems().length,block=n*74;
  const top=py+96,bottom=py+ph-60;
  return top+Math.max(0,(bottom-top-block)/2)+i*74;
}
function optRowY(i){
  const py=100,ph=H-230;
  const n=store.physics==='arcade'?8:7,block=n*78;
  const top=py+96,bottom=py+ph-60;
  return top+Math.max(0,(bottom-top-block)/2)+i*78;
}
// Map a normalized Y coordinate to the panel row under the pointer (MENU/OPTS only).
// Geometry must match drawPanel() exactly.
function rowHitIndex(yN){
  if(state!==S.MENU&&state!==S.OPTS)return -1;
  const y=yN*H;
  if(state===S.MENU){const n=menuItems().length;for(let i=0;i<n;i++)if(Math.abs(y-menuRowY(i))<32)return i;return -1;}
  const n=store.physics==='arcade'?8:7;
  for(let i=0;i<n;i++)if(Math.abs(y-optRowY(i))<30)return i;return -1;
}
window.addEventListener('keydown',e=>{
  if(state===S.MENU||state===S.OPTS){if(e.key==='ArrowUp'||e.key==='w')uiMove(-1);if(e.key==='ArrowDown'||e.key==='s')uiMove(1);}
  if(state===S.OPTS&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!e.repeat){if(optIdx<optEditableRows())uiConfirm();}
  if(e.key==='Backspace')uiBack();});

function plungerStep(dt){
  // Ball rides the rod tip — moves down as the spring compresses (only at rest;
  // once the ball is live it climbs the lane under real physics)
  // demoMode lets the attract AI charge the real plunger (state stays TITLE)
  if((state===S.LAUNCH||demoMode)&&Game.launchAnim<=0&&Game.ball&&!Game.ball.live){
    Game.plungerCharge=input.plunger?Math.min(1,Game.plungerCharge+dt*1.2):Game.plungerCharge;
    // Spring creak — a real plunger's coils tick as they compress; the pitch
    // rises with the pull, so the charge is audible before you release.
    const creakStep=Math.floor(Game.plungerCharge/0.06);
    if(creakStep!==Game._creak){Game._creak=creakStep;if(Game.plungerCharge>0.04)AudioSys.springPull(Game.plungerCharge);}
    const tipY=PF.b-66+(Game.plungerCharge*36);
    Game.ball.x=PF.r-24;
    Game.ball.y=tipY-BALL_R;
  }
  // ===== REAL LAUNCH FLIGHT =====
  // After release the ball is LIVE and climbs the shooter lane under the real
  // gravity — the same kinematics as a real machine. In the tube it travels
  // straight up; gravity bleeds its energy. If it reaches the lane top it
  // swings into the playfield; if not, it rolls back down the lane and the
  // tube catch parks it on the plunger for another pull (no penalty).
  const b=Game.ball;
  if(Game.launching&&b&&b.live){
    // Launch trail: a fading particle every ~12px so the fast climb reads.
    if(Game._ltAcc===undefined)Game._ltAcc=0;
    if(Game._ltPX===undefined){Game._ltPX=b.x;Game._ltPY=b.y;}
    Game._ltAcc+=Math.hypot(b.x-Game._ltPX,b.y-Game._ltPY);
    Game._ltPX=b.x;Game._ltPY=b.y;
    while(Game._ltAcc>=12){
      Game._ltAcc-=12;
      // Trail colour = preset identity (atari orange / arcade cyan /
      // superball magenta) — the launch flight reads at a glance.
      const col=PHYS.label==='SUPERBALL'?'#ff40b0':PHYS.label==='ARCADE SIM'?'#7ad0ff':'#ffb347';
      Game.pfx.push({x:b.x+(Math.random()-0.5)*4,y:b.y+3,
        vx:(Math.random()-0.5)*26,vy:16+Math.random()*26,
        life:0.28+Math.random()*0.22,t:0,col:col,size:1.4+Math.random()*1.6,grav:40});
    }
    // Weak-plunge whiff — a straight-lane stall: the climb dies below the
    // guide and the ball peaks. (A curve stall fires its whiff in arcStep.)
    if(Game._lastVy===undefined)Game._lastVy=b.vy;
    if(!Game.arc&&!Game._rbWhiff&&Game._lastVy<0&&b.vy>=0){
      Game._rbWhiff=true;AudioSys.softPlunge();
    }
    Game._lastVy=b.vy;
    // Rollback rattle — tiny metallic ticks as the ball knocks its way back
    // down the lane, one per ~28px of descent, pitch-randomized so the
    // sequence reads as a rattle. Forward flight never rattles (the only
    // live-and-launching descent IS a rollback).
    if(b.vy>0&&(!Game.arc||Game.arc.dir<0)){
      if(Game._rbAcc===undefined)Game._rbAcc=0;
      Game._rbAcc+=b.vy*dt;
      while(Game._rbAcc>=28){Game._rbAcc-=28;AudioSys.rollTick(Math.abs(b.vy));}
    }else Game._rbAcc=0;
  }
  // Launch glow decay (short flash after release / on lane exit)
  if(Game.launchAnim>0)Game.launchAnim=Math.max(0,Game.launchAnim-dt*1.8);
  // Spring oscillation after release
  if(Game.springBob>0)Game.springBob=Math.max(0,Game.springBob-dt*8);
}

/* helpers */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function glowCircle(x,y,r,color,alpha){
  const g=ctx.createRadialGradient(x,y,r*0.15,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.globalAlpha=1;}
function chromeBar(x1,y1,x2,y2,w,cx){const c=cx||ctx;c.lineCap='round';
  // soft drop shadow — tighter than before so bar-to-bar joints stay crisp
  c.strokeStyle='rgba(0,0,0,0.45)';c.lineWidth=w+2;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  // crisp dark edge — the same outline treatment as the side rails
  c.strokeStyle='#0c0f14';c.lineWidth=w+1;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  // brushed-steel body — the canonical chrome gradient shared by every rail
  const g=c.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,'#5b6570');g.addColorStop(0.5,'#aeb8c2');g.addColorStop(1,'#2a3036');
  c.strokeStyle=g;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  // specular catch-light down the centre, matching the rails' top-edge light
  c.strokeStyle='rgba(255,255,255,0.4)';c.lineWidth=Math.max(1.5,w*0.22);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  c.lineCap='butt';}
// Chrome frame — a rounded-rect bezel in the same brushed-steel language as the
// playfield rails (drop shadow, steel gradient, top catch-light, dark outline).
// Used for the cabinet trim: the DMD bezel, the marquee frame and the backglass
// playfield-window border, so the whole cabinet reads as one metal finish.
function chromeFrame(x,y,w,h,r){
  // soft drop shadow (down-right, like the rails)
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(x+3,y+4,w,h,r);ctx.fill();
  // brushed-steel body — canonical rail gradient
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#5b6570');g.addColorStop(0.5,'#aeb8c2');g.addColorStop(1,'#2a3036');
  ctx.fillStyle=g;rr(x,y,w,h,r);ctx.fill();
  // top catch-light + mid wash (same edge light as the rails)
  ctx.save();ctx.beginPath();rr(x,y,w,h,r);ctx.clip();
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(x,y,w,Math.max(3,h*0.22));
  ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(x,y+2,w,Math.max(2,h*0.5));
  ctx.restore();
  // crisp dark outline
  ctx.strokeStyle='#0c0f14';ctx.lineWidth=1.5;rr(x+0.75,y+0.75,w-1.5,h-1.5,r);ctx.stroke();
}
// Authentic Atari "Fuji" logo — the official vector asset (AtariFuji.svg, CC0)

const ATARI_FUJI_PATH=new Path2D("m0 21.653s3.154-0.355 5.612-2.384c2.339-1.93 3.185-3.592 3.77-5.476 0.584-1.885 0.671-6.419 0.671-7.764v-3.683h-1.455v1.365c-0.024 2.041-0.2 5.918-1.135 8.444-2.26 6.087-7.463 6.62-7.463 6.62zm24 0s-3.154-0.355-5.61-2.384c-2.342-1.93-3.187-3.592-3.772-5.476-0.583-1.885-0.671-6.419-0.671-7.764v-3.683h1.453l1e-3 1.365c0.024 2.041 0.202 5.918 1.138 8.444 2.258 6.087 7.46 6.62 7.46 6.62zm-13.341-19.305h2.685v19.306h-2.684z");
const FUJI_W=24,FUJI_H=19.308,FUJI_Y=2.346;
// Draw the genuine Atari logo centered at (cx,cy), scaled to pixel width w
function drawAtariLogo(cx,cy,w,color){
  const h=w*FUJI_H/FUJI_W, k=w/FUJI_W;

/* ---------- static playfield ---------- */
let pfLayer=null;
const BPC=[[255,150,40],[64,160,255],[90,225,150]];
function buildPF(){
  pfLayer=document.createElement('canvas');pfLayer.width=W*dpr;pfLayer.height=H*dpr;
  const c=pfLayer.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  // cabinet wood — the two side margins are exact MIRRORS so both walls read
  // identically: wood band at the outer edge, then the dark gap, then the
  // chrome rail overlapping the playfield edge by 2px. (The right side used to
  // butt the wood right against the rail, so a brown gradient showed next to
  // the right wall while the left had a clean dark gap.)
  const wood=c.createLinearGradient(PF.x-22,0,PF.x,0);wood.addColorStop(0,'#2a120b');wood.addColorStop(1,'#4a2414');
  c.fillStyle=wood;c.fillRect(0,0,PF.x-22,H);
  const woodR=c.createLinearGradient(PF.r,0,PF.r+22,0);woodR.addColorStop(0,'#4a2414');woodR.addColorStop(1,'#2a120b');
  c.fillStyle=woodR;c.fillRect(PF.r+22,0,W-PF.r-22,H);
  // playfield plate — rounded TOP corners (matches the corner-arc physics) so
  // the launched ball rides the drawn edge and never crosses it
  const platePath=()=>{c.beginPath();c.moveTo(PF.x,PF.y+CORNER_R);
    c.arcTo(PF.x,PF.y,PF.x+CORNER_R,PF.y,CORNER_R);c.lineTo(PF.r-CORNER_R,PF.y);
    c.arcTo(PF.r,PF.y,PF.r,PF.y+CORNER_R,CORNER_R);c.lineTo(PF.r,PF.b);c.lineTo(PF.x,PF.b);c.closePath();};
  const pg=c.createLinearGradient(PF.x,PF.y,PF.r,PF.b);
  pg.addColorStop(0,'#1b2750');pg.addColorStop(0.5,'#263a78');pg.addColorStop(1,'#16204a');
  platePath();c.fillStyle=pg;c.fill();
  // dark corner wedges — fill the removed corner regions with cabinet wood so
  // no transparent hole shows where the plate rounds off. (The old path drew
  // the quarter-arc plus a closing chord, which filled a lens INSIDE the plate
  // with wood and left the actual notch transparent — the top corners showed a
  // black hole with the rail shadows bleeding through it and a brown smear on
  // the plate. The wedge now traces the square corner plus the plate's own
  // rounding arc, so it covers exactly the notch, mirrored on both sides.)
  c.fillStyle='#3a1f12';
  c.beginPath();c.moveTo(PF.x,PF.y+CORNER_R);
  c.lineTo(PF.x,PF.y);c.lineTo(PF.x+CORNER_R,PF.y);
  c.arc(PF.x+CORNER_R,PF.y+CORNER_R,CORNER_R,-Math.PI/2,Math.PI,true);c.closePath();c.fill();
  c.beginPath();c.moveTo(PF.r-CORNER_R,PF.y);
  c.lineTo(PF.r,PF.y);c.lineTo(PF.r,PF.y+CORNER_R);
  c.arc(PF.r-CORNER_R,PF.y+CORNER_R,CORNER_R,0,-Math.PI/2,true);c.closePath();c.fill();
  const sheen=c.createRadialGradient(PF.x+PF.w*0.25,PF.y+PF.h*0.18,40,PF.x+PF.w*0.25,PF.y+PF.h*0.18,PF.w*0.95);
  sheen.addColorStop(0,'rgba(255,255,255,0.16)');sheen.addColorStop(0.5,'rgba(255,255,255,0.04)');sheen.addColorStop(1,'rgba(0,0,0,0.25)');
  platePath();c.fillStyle=sheen;c.fill();
  c.globalAlpha=1;
  // grain
  c.globalAlpha=0.03;c.strokeStyle='#ffffff';
  for(let i=-20;i<40;i+=3){c.beginPath();c.moveTo(PF.x+i*18,PF.y);c.lineTo(PF.x+i*18-400,PF.b);c.stroke();}
  c.globalAlpha=1;
  // floor shadow
  const floor=c.createLinearGradient(0,PF.b-70,0,PF.b);floor.addColorStop(0,'rgba(0,0,0,0)');floor.addColorStop(1,'rgba(0,0,0,0.4)');
  c.fillStyle=floor;c.fillRect(PF.x,PF.b-70,PF.w,70);
  // chrome rails
  const rrail=(x,y,w,h,sd)=>{const g=c.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,'#5b6570');g.addColorStop(0.5,'#aeb8c2');g.addColorStop(1,'#2a3036');
    // shadow x-offset: +2 (right) by default; side walls pass -2 so their shadows
    // fall INWARD onto the plate — every frame rail casts its shadow into the
    // playfield well, so the two side rails mirror (left: 2px strip right of the
    // rail, right: 2px strip left of the rail) instead of the right shadow
    // disappearing into the outer margin. sd=0 keeps the top rail's shadow
    // perfectly centred so both top corners darken the same 14px of side rail.
    c.fillStyle='rgba(0,0,0,0.5)';c.fillRect(x+(sd===undefined?2:sd),y+2,w,h);c.fillStyle=g;c.fillRect(x,y,w,h);
    // Brushed-steel micro-texture — faint horizontal streaks across the face so
    // the flat rails read as machined metal rather than smooth plastic. Two
    // interleaved 1px lines (light/dark) at very low alpha, clipped to the body
    // and layered UNDER the catch-light and outline.
    c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
    c.fillStyle='rgba(255,255,255,0.055)';
    for(let sy=y+1;sy<y+h;sy+=3)c.fillRect(x,sy,w,1);
    c.fillStyle='rgba(0,0,0,0.05)';
    for(let sy=y+2;sy<y+h;sy+=3)c.fillRect(x,sy,w,1);
    c.restore();
    c.fillStyle='rgba(255,255,255,0.4)';c.fillRect(x,y,w,Math.max(2,h*0.16));
    c.fillStyle='rgba(255,255,255,0.12)';c.fillRect(x,y+2,w,Math.max(1,h*0.5));
    c.strokeStyle='#0c0f14';c.strokeRect(x+0.5,y+0.5,w-1,h-1);};
  // Side rails are mirrors across the playfield centre: left spans [PF.x-12, PF.x+2]
  // (14px), right spans [PF.r-2, PF.r+12] (14px) — same chrome width, same 2px
  // overlap onto the plate. The right rail was 1px thinner (13px) and read as
  // a visibly skinnier wall.
  // Top rail spans the SAME outer faces as the side rails (PF.x-12 … PF.r+12) so
  // the three frame rails meet in flush 90° corners — the old top rail was inset
  // 4px and left a visible step at both top corners. Shadow offsets: left side
  // rail defaults +2 (falls right, into the plate), right side rail passes -2
  // (falls left, into the plate), top rail passes 0 so its 2px under-strip and
  // corner darkening are centred — the three rails read as one recessed frame
  // with an unbroken inner shadow around the plate.
  rrail(PF.x-12,PF.y-10,14,PF.h+22);rrail(PF.r-2,PF.y-10,14,PF.h+22,-2);rrail(PF.x-12,PF.y-10,PF.w+24,14,0);
  // shooter lane divider (right) — 48px tube. The 5px stub sits at PF.r-53 so
  // it is the exact mirror of the left stub (left [96,101] ↔ right [619,624]);
  // its shadow falls left into the plate like the left stub's falls right, so
  // BOTH dividers cast their 2px shadow onto the playfield (the old right stub
  // at 624 cast its shadow into its own halo — the two walls never matched).
  rrail(PF.r-53,PF.y+PF.h*0.12,5,PF.h*0.88,-2);
  // NOTE: the old drawn "guide channel" here — two pale curves sweeping from
  // the tube top toward the top rail — was purely decorative: the PHYSICAL
  // launch guide lives in arcStep/clampPF, not in these strokes, and they
  // read as stray lines floating on the plate. Removed.
  // left ball return lane divider — mirrors right shooter lane exactly
  rrail(PL_L,PF.y+PF.h*0.12,5,PF.h*0.88);
  // shooter lane arrows — point UP
  c.fillStyle='#9fb4ff';c.globalAlpha=0.5;
  for(let i=0;i<5;i++){const y=PF.y+PF.h*0.15+i*32;c.beginPath();c.moveTo(PF.r-28,y+18);c.lineTo(PF.r-24,y+8);c.lineTo(PF.r-20,y+18);c.closePath();c.fill();}
  // left return lane arrows — point DOWN (the ball-escape lane flows down)
  for(let i=0;i<5;i++){const y=PF.y+PF.h*0.15+i*32;c.beginPath();c.moveTo(PL_L-24,y+18);c.lineTo(PL_L-28,y+8);c.lineTo(PL_L-20,y+8);c.closePath();c.fill();}
  c.globalAlpha=1;
  // lane dark channels — MIRRORED both sides so the left return lane and the
  // right shooter lane read identically (the right tube used to be plain plate
  // while the left was a dark danger zone, so the two walls never matched).
  // Each channel also runs 2px under its outer rail, giving both walls the
  // same dark "lane colour under the chrome line".
  c.fillStyle='rgba(0,0,0,0.15)';c.fillRect(PF.x,PF.y+PF.h*0.10,48,PF.h*0.87);
  c.fillStyle='rgba(0,0,0,0.15)';c.fillRect(PF.r-48,PF.y+PF.h*0.10,48,PF.h*0.87);
  // top lane divider (separates left and right lanes)
  // === PASS-THROUGH LANES — chrome corridor walls, centered on playable area ===
  // Lane floor glow — left lane (cyan)
  const llcx=(PL_L+PL_CX)/2;
  const lglowY=PF.y+PF.h*0.235-20;  // match the rollover sensor y after recentre
  const llg=c.createRadialGradient(llcx,lglowY,5,llcx,lglowY,60);
  llg.addColorStop(0,'rgba(63,208,255,0.18)');llg.addColorStop(1,'rgba(0,0,0,0)');
  const LW2=32, LTOP2=LANE_TOP+4, LBOT2=LANE_BOT-44;
  c.fillStyle=llg;c.fillRect(llcx-LW2,LTOP2,LW2*2,LBOT2-LTOP2);
  // Lane floor glow — right lane (orange)
  const rlcx=(PL_CX+PL_R)/2;
  const rlg=c.createRadialGradient(rlcx,lglowY,5,rlcx,lglowY,60);
  rlg.addColorStop(0,'rgba(255,122,42,0.18)');rlg.addColorStop(1,'rgba(0,0,0,0)');

/* --- attract step: AI plays pinball on the title screen --- */
function demoStep(dt){
  // The demo runs the REAL game logic below (plungerStep / specialStep /
  // physStep) — Attr only decides when to charge the plunger, when to flip,
  // and which approaches to "miss" for the difficulty knob.
  // AI plunger — hold until charged, then release exactly like a player
  if(Attr.phase==='aiming'){
    Attr.timer-=dt;
    input.plunger=Attr.timer<=0;
    if(Attr.timer<=0){
      // Real machines need a strong pull to clear the lane — a soft plunge
      // rolls back down. The AI plays the skill-shot design: sometimes it
      // pulls the EXACT power band to collect the skill shot, sometimes it
      // pulls hard (a deliberate overshoot that forfeits the shot), and
      // sometimes it soft-plunges so the demo shows the authentic roll-back
      // behaviour too.
      if(!Attr.charge){const r=Math.random();
        Attr.charge=r<0.30?(PHYS.skillShot.min+PHYS.skillShot.max)/2+(Math.random()-0.5)*0.04
          :r<0.75?0.72+Math.random()*0.20
          :0.50+Math.random()*0.16;}
      if(Game.plungerCharge>=Attr.charge){
        input.plunger=false;Attr.charge=0;
        launchBall();
        Attr.phase='tubing';
      }
    }
  }else if(Attr.phase==='tubing'){
    input.plunger=false;
    if(!Game.ball.live){ // soft plunge rolled back down the lane — re-aim
      Attr.phase='aiming';Attr.timer=0.3+Math.random()*0.4;
    }else if(!Game.launching){ // cleared the lane — ball is in play
      Attr.phase='play';
    }
  }else if(Attr.phase==='drained'){
    input.plunger=false;
    Attr.timer-=dt;
    if(Attr.timer<=0){Attr.phase='aiming';Attr.timer=0.4+Math.random()*0.5;}
  }else input.plunger=false;
  // Real plunger + special cycling (identical to a live game)
  plungerStep(dt);
  specialStep(dt);
  // Real physics when the ball is live
  const b=Game.ball;
  if(b&&b.live){
    // AI flippers — flip on an approach unless this one is a "miss" (difficulty).
    // No flips while the ball is still climbing/rolling back in the shooter lane.
    if(!Game.launching){
      const flipperY=FL.l.y,lZone=FL.l.x-20,rZone=FL.r.x+20;
      const catchRate=Attr.diffRates[Attr.diff]||0.82;
      const inL=b.y>flipperY-30&&b.vy>50&&b.x<rZone;
      const inR=b.y>flipperY-30&&b.vy>50&&b.x>lZone;
      if(inL&&!Attr._lIn){Attr._lIn=true;Attr._lMiss=Math.random()<catchRate;}
      if(!inL)Attr._lIn=false;
      if(inR&&!Attr._rIn){Attr._rIn=true;Attr._rMiss=Math.random()<catchRate;}
      if(!inR)Attr._rIn=false;
      input.lFlip=inL&&!Attr._lMiss;
      input.rFlip=inR&&!Attr._rMiss;
      // Occasional random nudges
      if(Math.random()<0.006&&Attr.nudgeC<0.1){Attr.nudgeC=1;b.vx+=(Math.random()-0.5)*200;b.vy+=(Math.random()-0.5)*120;}
      if(Attr.nudgeC>0)Attr.nudgeC-=dt*4;
    }else{input.lFlip=false;input.rFlip=false;}
    let n=Math.ceil(dt/SUB_DT);const sub=dt/n;
    for(let i=0;i<n;i++){if(Game.ball&&Game.ball.live)physStep(sub);else break;}
    // Tube catch — the real physStep reset the ball onto the plunger
    if(!Game.ball.live&&Attr.phase==='play'){Attr.phase='aiming';Attr.timer=0.4+Math.random()*0.5;Attr.charge=0;}
  }
  // The demo never shakes the backglass or flashes the screen
  Game.shakeT=0;Game.flashes=0;
}
