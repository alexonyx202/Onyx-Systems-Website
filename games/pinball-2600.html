<script>
'use strict';
/* =====================================================================================
   PINBALL 2600 — a modern arcade tribute to Atari 2600 "Video Pinball" (CX2648, 1980).

   Faithful to the original cartridge & 1980 manual (C016943-48 REV.1):
   - DROP TARGETS .... 3 diamond-shaped targets across the top, 100 pts each.
                       Knock down all 3 to raise bumper value by 1 (max 9).
   - LEFT ROLLOVER ... Upper-left lane. 100 pts each pass, number shows hit count
                       (1→4). At drain: pays number × 1000 points.
   - ATARI ROLLOVER .. Upper-right lane. 100 pts, +1 bonus multiplier per pass.
                       After 4 passes: EXTRA BALL (once per ball).
   - BUMPERS ......... 3 pop bumpers in triangle: 100 × current value (1..9).
                       GAMES 1&2 accumulate value; GAMES 3&4 reset each ball.    - SPECIAL TARGET .. main centre shot: 500 unlit; lit streak 1000/2500/5000.

   - SPINNERS ........ 1 pt each pass (2 spinners, mid left & right).
   - TILT ............ Too many nudges: flippers freeze, no scoring, extra ball lost.
   - DIFFICULTY A .... Adds two extra drain holes at the bottom corners.
   - SCORE ........... Rolls over at 1,000,000 (keeps remainder).
   - GAMES 1..4 ...... 1P/2P × accumulate/reset bumper value.

   Modern presentation: chrome rails & flippers, lit pop bumpers, glowing inserts,
   DMD scoreboard, attract marquee, particles, dynamic light, synthesized audio.
   ===================================================================================== */

/* ---------- typography — modern display font with clean system fallbacks ---------- */
const F_DISP='"Orbitron","Arial Black","Segoe UI",system-ui,sans-serif';
const F_UI='"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
const F_MONO='ui-monospace,"Cascadia Mono","Courier New",monospace';

/* ---------- logical stage ---------- */
const W=720, H=1200;
const CAB_H=168;
const PF={x:48,y:CAB_H,w:W-96,h:H-CAB_H-118};
PF.r=PF.x+PF.w; PF.b=PF.y+PF.h;
/* playable area — 48px shooter lane on right, 48px ball return on left */
const PL_L=PF.x+48, PL_R=PF.r-48, PL_CX=(PL_L+PL_R)/2, PL_W=PL_R-PL_L;
const LANE_TOP=PF.y+PF.h*0.13, LANE_BOT=PF.y+PF.h*0.34;
/* pass-through lane circle line — vertical centre of the lane corridors; the
   rollover circles AND the skill-shot disc share this centre line */
const LANE_CY=PF.y+PF.h*0.235-20;       // midpoint of LANE_TOP+4 … LANE_BOT-44
/* angled outlane wall top — both angled walls start at this height (mirrored) */

/* ---------- state machine ---------- */
const S={TITLE:0,MENU:1,OPTS:2,SCORES:3,HELP:4,LAUNCH:5,PLAY:6,PAUSE:7,TALLY:8,GAMEOVER:9,ENTRY:10};
let state=S.TITLE;

/* ---------- persistent ---------- */
const LSK='pinball2600.v3';
let store={scores:[0,0,0,0,0,0,0,0],names:['AAA','AAA','AAA','AAA','AAA','AAA','AAA','AAA'],
            diff:1,game:1,snd:true,hap:true,tilt:2,physics:'atari',angle:3};
try{const s=JSON.parse(localStorage.getItem(LSK));if(s)store=Object.assign(store,s)}catch(e){}
function saveStore(){try{localStorage.setItem(LSK,JSON.stringify(store))}catch(e){}}
const SAVKEY=LSK+'.sav';
function saveGame(silent){
  if(state!==S.PLAY&&state!==S.LAUNCH&&state!==S.PAUSE)return;
  const g=Game,b=g.ball;
  const snap={
    st:state,ps:g.players,cur:g.cur,sc:[...g.scores],bl:[...g.balls],ex:[...g.extra],ue:[...g.usedExtra],
    ah:g.atariHits,bn:g.bonus,lr:g.leftRoll,bv:g.bumperVal,ba:g.bumperAccum,
    sa:g.saveArmed,bt:g.ballSaveTimer,ss:g.skillShotReady,skt:g.skillShotT,sd:g.skillShotDone,pc:g.plungerCharge,lp:g.launchPower,
    ti:g.tilt,th:g.tiltHeat,
    bx:b?b.x:0,by:b?b.y:0,bvx:b?b.vx:0,bvy:b?b.vy:0,blv:b?b.live:false,bsk:b?b.stuck||0:0,
    tdn:g.targets.filter(t=>t.down).map((_,i)=>i),
    rin:g.rolls.reduce((a,r,i)=>{if(r.in)a.push(i);return a;},[]),
    sl:g.special.lit,stt:g.special.t,scd:g.special.cd,spv:g.special.streak||0,
    bmp:g.bumpers.map(bp=>bp.v),fla:[FL.l.ang,FL.r.ang],
  };
  try{localStorage.setItem(SAVKEY,JSON.stringify(snap));if(!silent){Game.msg='💾 SAVED';Game.msgT=1.5;}}catch(e){}
}
function clearSave(){try{localStorage.removeItem(SAVKEY)}catch(e){}}
function hasSave(){try{return!!localStorage.getItem(SAVKEY)}catch(e){return false;}}
function loadGame(){
  let snap;try{snap=JSON.parse(localStorage.getItem(SAVKEY));clearSave();}catch(e){return false;}
  if(!snap)return false;
  demoMode=false;Game.msg='';Game.msgT=0;Game.pfx.length=0; // leave the attract demo
  const g=Game;
  makeTable();
  g.players=snap.ps;g.cur=snap.cur;g.scores=[...snap.sc];g.balls=[...snap.bl];
  g.extra=[...snap.ex];g.usedExtra=[...snap.ue];
  g.atariHits=snap.ah;g.bonus=snap.bn;g.leftRoll=snap.lr;g.bumperVal=snap.bv;g.bumperAccum=snap.ba;
  g.saveArmed=snap.sa;g.ballSaveTimer=snap.bt;g.skillShotReady=snap.ss;g.skillShotT=snap.skt||0;
  // One skill shot per ball survives save/restore too — otherwise a mid-ball
  // save/load would re-offer an already-collected shot (a free extra +5000).
  g.skillShotDone=!!snap.sd;
  g.plungerCharge=snap.pc;g.launchPower=snap.lp;g.tilt=snap.ti;g.tiltHeat=snap.th;
  Game.bumpers.forEach((bp,i)=>{bp.v=snap.bmp[i]||1;});
  if(snap.tdn)snap.tdn.forEach(i=>{Game.targets[i].down=true;Game.targets[i].in=false;});
  if(snap.rin)snap.rin.forEach(i=>{Game.rolls[i].in=true;});
  Game.special.lit=snap.sl;Game.special.t=snap.stt;Game.special.cd=snap.scd;Game.special.streak=snap.spv||0;
  Game.ball={x:snap.bx,y:snap.by,vx:snap.bvx,vy:snap.bvy,live:snap.blv,stuck:snap.bsk||0,trail:[]};
  if(snap.fla){FL.l.ang=snap.fla[0];FL.r.ang=snap.fla[1];FL.l.prev=snap.fla[0];FL.r.prev=snap.fla[1];}
  g.autoSaveTimer=10;
  state=S.PLAY;Game.prevState=S.PLAY;
  return true;
}

/* ---------- audio ---------- */
const AudioSys=(()=>{
  let ctx=null,master=null,mix=null,reverb=null,reverbGain=null;
  // Master chain: dry bus → master → speakers, plus a centered reverb send.
  // The synthetic impulse response has IDENTICAL left/right channels, so the
  // wet path stays perfectly symmetric — a mono input up-mixed to stereo and
  // convolved with an L=R IR yields L=R output (x*ir + x*ir on both sides).
  // Subtle mirrored space without ever breaking the centered mix.
  function buildGraph(c){
    if(master)return;
    master=c.createGain();master.gain.value=0.96;master.connect(c.destination);
    reverb=c.createConvolver();
    const irLen=Math.floor(c.sampleRate*1.3),pre=Math.floor(c.sampleRate*0.012),
      ir=c.createBuffer(2,irLen,c.sampleRate),d0=ir.getChannelData(0),d1=ir.getChannelData(1);
    let lp=0;
    for(let i=0;i<irLen;i++){
      let v=0;
      if(i>=pre){
        const t=(i-pre)/(irLen-pre);
        lp+=0.18*((Math.random()*2-1)-lp); // one-pole damping → warm room tail
        v=lp*Math.pow(1-t,2.4)*Math.min(1,t*20);
      }
      d0[i]=v;d1[i]=v; // identical channels → perfectly centered wet path
    }
    reverb.buffer=ir;
    reverbGain=c.createGain();reverbGain.gain.value=0.14;
    reverb.connect(reverbGain);reverbGain.connect(master);
    mix=c.createGain();mix.connect(master);mix.connect(reverb);
  }
  function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(ctx&&ctx.state==='suspended')ctx.resume();if(ctx)buildGraph(ctx);return ctx;}
  function tone(f0,f1,dur,type,vol,when,shape,force){
    if(demoMode&&!force)return;const c=ac();if(!c||!store.snd)return;const t=c.currentTime+(when||0);
    const o=c.createOscillator(),g=c.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    if(shape==='pluck'){g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.5);}
    else{g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
    o.connect(g);g.connect(mix);o.start(t);o.stop(t+dur+0.02);
  }
  function noise(dur,vol,hp,lp){
    if(demoMode)return;const c=ac();if(!c||!store.snd)return;const n=Math.floor(c.sampleRate*dur),
      buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource();src.buffer=buf;const g=c.createGain();g.gain.value=vol||0.15;
    let node=src;
    if(hp){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;node.connect(f);node=f;}
    if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;node.connect(f);node=f;}
    node.connect(g);g.connect(mix);src.start();
  }
  function ring(f,dur,vol){tone(f,f*0.98,dur,'sine',vol,0,'pluck');tone(f*1.01,f*0.99,dur*0.7,'sine',vol*0.5,0.01,'pluck');}
  function thud(vol){tone(100,40,0.06,'sine',vol);noise(0.03,vol*0.5,200,800);}
  function zap(f0,f1,dur,vol){tone(f0,f1,dur,'sawtooth',vol);noise(dur*0.4,vol*0.6,f0*3);}
  return{
    unlock(){ac();},
    // ---- SOLENOID FLIPPER: mechanical snap + magnetic clack + rubber thwack ----
    flip(){
      const c=ac();if(!c||!store.snd)return;const t=c.currentTime;
      // Solenoid body resonance — low metallic ring
      const o1=c.createOscillator(),g1=c.createGain();o1.type='triangle';o1.frequency.setValueAtTime(380,t);
      o1.frequency.exponentialRampToValueAtTime(220,t+0.02);o1.frequency.exponentialRampToValueAtTime(110,t+0.05);
      g1.gain.setValueAtTime(0.14,t);g1.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
      o1.connect(g1);g1.connect(mix);o1.start(t);o1.stop(t+0.08);
      // Click — sharp attack
      tone(2400,800,0.02,'square',0.09);
      // Mechanical snap
      noise(0.04,0.12,1800);
      // Low rubber thwack
      tone(200,80,0.04,'sine',0.10);
    },
    // ---- POP BUMPER: metallic ring layered with impact burst, pitch follows value ----
    bumper(v){
      const c=ac();if(!c||!store.snd)return;const t=c.currentTime;
      const base=220+v*28;
      // Ringing dome resonance
      ring(base*2,0.09,0.10);
      ring(base*3,0.07,0.06);
      // Impact burst — bright noise crack
      noise(0.05,0.13,base*2.5);
      // Low body thud
      thud(0.14);
      // Score beep overlay (satisfying digital chirp)
      tone(base*4,base*3,0.06,'square',0.07);
    },
    // ---- DROP TARGET: crack + glass shatter ring + thud ----
    target(){
      noise(0.06,0.14,1800);
      ring(1200,0.07,0.09);
      ring(800,0.05,0.07);
      thud(0.12);
      tone(1500,800,0.06,'sawtooth',0.08);
    },
    // ---- ROLLOVER LANE: bright ascending electronic chime ----
    roll(){
      tone(1100,1500,0.08,'sine',0.10,0,'pluck');
      tone(550,750,0.06,'sine',0.06,0.02,'pluck');
    },
    // ---- SPINNER: rapid ratchet whirl that decays with ball energy ----
    spin(){
      const c=ac();if(!c||!store.snd)return;const t=c.currentTime;
      // 8-10 rapid ticks in quick succession simulating the spinner ratchet
      for(let i=0;i<9;i++){
        tone(2800+Math.random()*600,1200,0.015,'square',0.04,t+i*0.008);
      }
      // Underlying whir
      noise(0.06,0.06,3000);
    },
    // ---- SPECIAL TARGET: ascending arpeggio + sparkle ----
    special(){
      [880,1108,1318,1760].forEach((f,i)=>{
        tone(f,f*1.02,0.10,'square',0.11,i*0.06);
        tone(f*1.5,f*1.4,0.06,'sine',0.05,i*0.06+0.03);
      });
      noise(0.08,0.10,2000);
    },
    // ---- PLUNGER LAUNCH: spring whoosh → mechanical release → ball rolling ----
    launch(){
      const c=ac();if(!c||!store.snd)return;const t=c.currentTime;
      // Spring stretching/release whoosh
      zap(500,120,0.10,0.10);
      // Metallic release click
      tone(600,300,0.03,'square',0.10,0.05);
      // Spring bounce vibration
      noise(0.08,0.12,600);
      // Rolling ball rumble
      noise(0.15,0.08,0,400);
      // Ascending tone — ball traveling up lane
      tone(140,600,0.12,'sine',0.08);
    },
    // ---- PLUNGER RELEASE: mechanical thunk when the spring fires ----
    // Volume scales with the pull — a full pull thunks hard, a feather tap is
    // a faint click. (Soft pulls that roll back down the lane get softPlunge.)
    plungerRelease(pull){
      const v=0.4+0.6*Math.max(0,Math.min(1,pull||0));
      // Sharp release clack — rod snapping against the stop
      tone(1500,450,0.03,'square',0.10*v);
      tone(800,250,0.04,'sawtooth',0.06*v,0.006);
      // Spring twang as the rod flies back up
      tone(340,70,0.10,'triangle',0.11*v,0.012);
      tone(520,130,0.06,'sine',0.05*v,0.02,'pluck');
      // Low mechanical thud
      tone(110,45,0.06,'sine',0.13*v,0.008);
      noise(0.04,0.10*v,1500);
    },
    // ---- SOFT PLUNGE: a gentle whiff when a soft pull rolls back down the lane ----
    softPlunge(){
      // Whiff — the launch energy peters out partway up the lane: a soft
      // dying tone plus the first breath of the ball rolling back. The
      // descent itself rattles (rollTick) and the plunger landing thunks
      // (plungerSettle) — three beats, one failed plunge.
      tone(720,150,0.18,'sine',0.06);
      noise(0.16,0.04,300,900);
    },
    // ---- ROLLBACK RATTLE: one tiny metallic tick of the ball knocking
    // against the lane walls on the way back down. plungerStep calls it
    // every ~28px of descent — the randomized pitch across calls is what
    // makes the sequence read as a rattle rather than a tone. Kept well
    // under the whiff so the failed plunge stays a soft story.
    rollTick(sp){
      const f=900+Math.random()*900,v=0.016+Math.min(0.018,(sp||0)/45000);
      tone(f,f*0.85,0.014,'square',v);
      if(Math.random()<0.3)noise(0.01,0.012,2600+Math.random()*1800);
    },
    // ---- PLUNGER SETTLE: the soft thunk of the ball landing back on the
    // rod tip — the mechanical full stop that ends a failed plunge. Softer
    // than the release thunk: a landed ball, not a fired spring.
    plungerSettle(){
      tone(140,58,0.05,'sine',0.085);
      tone(92,48,0.07,'sine',0.06,0.012);
      noise(0.018,0.028,700);
      tone(1900,1300,0.012,'square',0.02,0.005);
    },
    // ---- SPRING PULL: the coils ticking as the plunger compresses — a real
    // machine's charge is audible before you release. Kept quiet; the pitch
    // rises with the pull so the charge is readable by ear.
    springPull(c){
      tone(200+700*c,160+560*c,0.03,'square',0.028);
      noise(0.015,0.02,900+2600*c);
    },
    // ---- DRAIN: descending groan + sad whine + thud ----
    drain(){
      zap(400,55,0.45,0.11);
      tone(300,50,0.4,'sine',0.07);
      // Low rumble thud at bottom
      const c=ac();if(!c||!store.snd)return;const t=c.currentTime;
      const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(80,t+0.35);
      o.frequency.exponentialRampToValueAtTime(30,t+0.55);
      g.gain.setValueAtTime(0,0.35);g.gain.setValueAtTime(0.15,t+0.36);g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
      o.connect(g);g.connect(mix);o.start(t+0.35);o.stop(t+0.6);
    },
    // ---- TALLY TICK: cash-register ding ----
    tallyTick(){
      tone(1400,1400,0.02,'square',0.08,0,'pluck');
      tone(1100,1100,0.015,'sine',0.05,0.005,'pluck');
    },
    // ---- EXTRA BALL JINGLE: celebratory ascending fanfare ----
    extra(){
      [523,659,784,1046,1318,1568].forEach((f,i)=>{
        tone(f,f*1.01,0.11,'square',0.11,i*0.08);
        tone(f*1.25,f*1.2,0.08,'sine',0.05,i*0.08+0.04);
      });
      noise(0.05,0.08,1500);
    },
    // ---- TILT: alarm buzzer ----
    tilt(){
      noise(0.7,0.14,200);
      tone(120,100,0.6,'sawtooth',0.14);
      tone(240,200,0.5,'square',0.08,0.1);
    },
    // ---- NUDGE: low-frequency shake rumble ----
    nudge(){
      noise(0.07,0.16,0,300);
      tone(55,35,0.06,'sine',0.12);
    },
    // ---- UI NAVIGATION: crisp blip ----
    ui(){tone(900,900,0.03,'square',0.06,0,'pluck',true);},
    // ---- UI CONFIRM: stronger two-tone beep ----
    uiBig(){tone(500,700,0.08,'square',0.09,0,undefined,true);tone(700,900,0.06,'square',0.07,0.06,undefined,true);},
    // ---- GAME OVER: descending sad chord ----
    over(){
      [392,330,262,196,147].forEach((f,i)=>tone(f,f*0.88,0.20,'sawtooth',0.09,i*0.14));
    },
    // ---- BALL SAVE: heroic rising save ----
    save(){
      tone(400,800,0.12,'sine',0.11);
      tone(600,1200,0.10,'square',0.07,0.02);
      noise(0.08,0.07,600,1200);
      tone(900,900,0.05,'sine',0.10,0.01,'pluck');
    },
    // ---- SKILL SHOT: triumphant cash-out fanfare ----
    skill(){
      tone(660,880,0.13,'sine',0.12);
      tone(880,1100,0.10,'square',0.09,0.04);
      tone(1320,1320,0.07,'sine',0.08,0.06,'pluck');
      noise(0.06,0.09,800,2000);
      tone(1760,1760,0.05,'square',0.07,0.10,'pluck');
    },
  };
})();

/* ---------- input ---------- */
const input={lFlip:false,rFlip:false,plunger:false,nudgeL:false,nudgeR:false,nudgeU:false,_plungerHeld:false,_bothFlip:false};

/* ---------- tilt-bob sensor (DeviceOrientation) ---------- */
const tiltBob={beta:0,gamma:0,active:false,cd:0};
function initTiltBob(){
  // iOS 13+ requires explicit permission; other platforms fire events directly
  const request=typeof DeviceOrientationEvent!=='undefined'&&
    typeof DeviceOrientationEvent.requestPermission==='function'?
    DeviceOrientationEvent.requestPermission:null;
  function start(){window.addEventListener('deviceorientation',onTilt,{passive:true});tiltBob.active=true;}
  if(request){
    const cv=document.getElementById('C');
    function ask(){request().then(p=>{if(p==='granted')start();}).catch(()=>{});cv.removeEventListener('click',ask);cv.removeEventListener('touchstart',ask);}
    cv.addEventListener('click',ask,{once:true});
    cv.addEventListener('touchstart',ask,{once:true});
  }else{start();}
}
function onTilt(e){
  if(!e.beta||!e.gamma||state!==S.PLAY||tiltBob.cd>0)return;
  tiltBob.beta=e.beta; tiltBob.gamma=e.gamma;
  const threshold=20, dead=12;
  const absBeta=Math.abs(e.beta-90);
  const absGamma=Math.abs(e.gamma);
  if(absBeta>threshold){
    if(e.beta<90-dead){input.nudgeL=true;tiltBob.cd=30;}
    else if(e.beta>90+dead){input.nudgeR=true;tiltBob.cd=30;}
  }else if(absGamma>threshold){input.nudgeU=true;tiltBob.cd=30;}
}

function keyAction(e,down){
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Shift','Enter','Escape','Tab','m','M'].includes(k))e.preventDefault();
  if(!down){
    if(k==='ArrowLeft'||k==='a'||k==='A'){input.lFlip=false;input.nudgeL=false;}
    if(k==='ArrowRight'||k==='d'||k==='D'){input.rFlip=false;input.nudgeR=false;}
    if(k==='ArrowDown'||k==='s'||k==='S'){input.plunger=false;input.nudgeD=false;
      // releasing the plunger key fires the launch (charge while held)
      if(state===S.LAUNCH)launchBall();}
    if(k==='ArrowUp'||k==='w'||k==='W'){input.nudgeU=false;
      // The ↑/W "flip both" press must also RELEASE both bats — the old handler
      // only cleared nudgeU here, so both flippers stuck in the up position
      // forever after one press. The _bothFlip guard keeps a separately-held
      // flipper key (e.g. holding A) from being dropped by this release.
      if(input._bothFlip){input.lFlip=false;input.rFlip=false;input._bothFlip=false;}}
    if(k==='Shift'){input.nudgeL=false;input.nudgeR=false;}
    return;
  }
  if(e.repeat)return;AudioSys.unlock();const shift=e.shiftKey;
  switch(k){
    case'ArrowLeft':case'a':case'A':shift?input.nudgeL=true:input.lFlip=true;break;
    case'ArrowRight':case'd':case'D':
      if(state===S.TITLE){Attr.diff=(Attr.diff+1)%Attr.diffRates.length;AudioSys.ui();break;}
      shift?input.nudgeR=true:input.rFlip=true;break;
    case'ArrowUp':case'w':case'W':shift?input.nudgeU=true:(input.lFlip=true,input.rFlip=true,input._bothFlip=true);break;
    case'ArrowDown':case's':case'S':
      if((k==='s'||k==='S')&&state===S.PAUSE){saveGame();break;}
      input.plunger=true;input._plungerHeld=true;break;
    case' ':if(state===S.LAUNCH)launchBall();else if(state===S.PLAY&&input._plungerHeld)launchBall();else uiConfirm();break;
    case'Enter':uiConfirm();break;
    case'Escape':case'p':case'P':
      if(state===S.PLAY||state===S.LAUNCH){state=S.PAUSE;Game._pauseT=performance.now();AudioSys.ui();saveGame();}
      else if(state===S.PAUSE){state=Game.prevState;AudioSys.ui();}break;
    case'm':case'M':store.snd=!store.snd;saveStore();
      if(state===S.PLAY||state===S.LAUNCH){Game.msg=store.snd?'🔊 SOUND ON':'🔇 SOUND OFF';Game.msgT=1.5;}break;
    case'Tab':if(state===S.TITLE){state=S.MENU;demoMode=false;AudioSys.ui();}break;
  }
}
window.addEventListener('keydown',e=>keyAction(e,true),{passive:false});
window.addEventListener('keyup',e=>keyAction(e,false));

function touchInit(){
  const cv=document.getElementById('C');
  function handle(e,phase){

//   intoPlay = weakest pull that still clears the curve (white tick)

/* ---------- real launch solver ---------- */
// AUTHENTIC PLUNGER PHYSICS — the launch chain of a real arcade machine:
//   1. SPRING: Hooke's law F=kx stores E=½kx² in the plunger spring; the
//      ball leaves the rod at v_tip = pull·vTipFull — speed LINEAR in pull
//      distance (energy in x²), exactly like a real spring.
//   2. LANE CLIMB: the ball rolls up the 743px shooter lane against the
//      slope's gravity component (PHYS.grav is exactly that, in px/s²) plus
//      rolling resistance (ROLL_F). Kinetic energy pays 2·a·d.
//   3. TOP CURVE: a constrained 90°+ guide (radius CURVE_R) bends the lane's
//      vertical flight onto the playfield. Gravity's tangential component
//      decelerates the climb (full g at entry, zero at the apex, accelerating
//      down the far side); guide friction scales with the normal force
//      |v²/R − g·sinα| — the ball presses on the OUTER rail while fast and
//      on the INNER rail while slow, like a real channeled curve.
//   4. EXIT & FREE FLIGHT: the ball leaves the guide heading left and
//      slightly DOWN (exitDrop rad) at whatever speed survived, then flies
//      as a plain projectile under playfield gravity. Pull strength sets
//      ONLY the speed — the guide fixes the direction — so the drop point is
//      a pure function of the pull. Too weak: the ball stalls on the curve
//      and ROLLS BACK down the lane — the real machine's weak-plunge
//      return, fully deterministic (no dice, ever).
// The solver derives, per preset: vTipFull (full pull exits at maxVel — the
// reference the whole meter scales from), intoPlay (weakest clearing pull),
// the skill target x (where the design-centre pull's parabola crosses the
// target line) and the SKILL band (pulls whose parabola passes within
// SS_COLLECT of it). Gauge, HELP and arming all read these derived values.
const CURVE_R=72;                       // top guide radius (px)
const ROLL_F=110;                       // lane rolling resistance (px/s²) ≈0.11 m/s² real
const CURVE_ENTRY_Y=PF.y+PF.h*0.10;     // tube top — where the guide begins
const SS_COLLECT=30;                    // skill-shot collect radius (px) — the CLASSIC reference
const SS_COLLECT_CAP=100;               // parity-radius ceiling: band-edge drops stay clear of the lane corridors
const SS_Y_CLASSIC=PF.y+PF.h*0.116;     // pre-move target line — kept only as the difficulty reference
// SKILL-SHOT CHANCE CLOCK — real-machine insert behaviour, researched:
//   · The shot lights at ball start and stays lit while you AIM — a real
//     machine puts no limit on how long the ball may sit on the plunger.
//   · The chance itself is live only while the launch resolves: the plunge
//     is the shot (Twilight Zone's rollover zones), and it's over the moment
//     the ball touches anything else / the shot is made — the insert goes
//     dark once the ball is in general play.
//   · It is one chance per ball (Johnny Mnemonic: "a skill shot at the start
//     of each numbered ball"; most machines explicitly don't re-offer after
//     ball saves). Modern games that extend the window bound it with an
//     explicit countdown (Pulp Fiction's Super Skill Shot: "hit ... before
//     the timer expires") — typically 5–10s.
// This clock is the bounded window: armed when the shot goes live, and the
// light resolves when it expires, the ball is collected or first touched.
const SKILL_SHOT_TIME=10;               // seconds the armed chance stays live
const SS_X=PL_CX;                       // skill target: dead centre between the pass-through lanes
const SS_Y=LANE_CY;                     // ... level with the lane rollover circles (shared centre line)
function arcExitSpeed(vTip,p){
  // Sim-faithful launch integrator — replicates the LIVE physics chain
  // step-for-step so every derived value (vTipFull, intoPlay, skillCenter,
  // the skill band, the wall-clearance filter) matches what the ball actually
  // does. The old closed-form climb + fine-dt curve drifted ~10–17px/s fast
  // on exit speed versus the sim — enough to skew the band edges by a full
  // meter step (measured: the 0.61 edge was admitted but its real flight
  // clipped the corridor wall and missed the shot).
  //   CLIMB: the same semi-implicit Euler physStep runs at its 1/240 substep
  //   (gravity, plus rolling resistance while rising), down to the tube top.
  //   CURVE: the same Euler step arcStep runs at 1/240, including the exact
  //   exit-fraction interpolation at the guide mouth.
  const dt=1/240;
  let vy=-vTip,y=(PF.b-66-BALL_R);      // ball sits ON the rod tip at rest
  while(y>CURVE_ENTRY_Y){
    vy+=p.grav*dt;
    if(vy<0)vy+=ROLL_F*dt;
    y+=vy*dt;
    if(vy>=0)return 0;                  // ran out of speed — rolls back down
  }
  let v=-vy,a=0;const exa=Math.PI/2+p.exitDrop;let guard=0;
  while(guard++<40000){
    const N=Math.abs(v*v/CURVE_R-p.grav*Math.sin(a));
    const prevV=v;
    v+=(-p.grav*Math.cos(a)-p.curveMu*N*(v>0?1:-1))*dt;
    if(v<=0)return 0;                   // stalls on the curve — rolls back
    const prevA=a;
    a+=(v/CURVE_R)*dt;
    if(a>=exa){                         // exit-fraction interpolation, as arcStep
      const f=Math.max(0,Math.min(1,(exa-prevA)/((a-prevA)||1e-9)));
      return prevV+(v-prevV)*f;
    }
  }
  return v;
}
function parabolaAtY(vExit,p,yT){
  // where the post-exit projectile first crosses the yT line (x coordinate)
  const x0=PF.r-24-CURVE_R-CURVE_R*Math.sin(p.exitDrop),
        y0=CURVE_ENTRY_Y-CURVE_R*Math.cos(p.exitDrop),
        vx=-vExit*Math.cos(p.exitDrop),vy=vExit*Math.sin(p.exitDrop),dy=yT-y0;
  const A=0.5*p.grav,disc=vy*vy+4*A*dy;
  if(disc<0)return Infinity;
  return x0+vx*(-vy+Math.sqrt(disc))/(2*A);
}
function tuneLaunch(){
  // vTipFull — the rod speed whose full pull exits the curve at exactly maxVel
  let lo=0,hi=3*PHYS.maxVel+Math.sqrt(2*(PHYS.grav+ROLL_F)*900);
  for(let i=0;i<50;i++){const m=(lo+hi)/2;(arcExitSpeed(m,PHYS)<PHYS.maxVel?lo=m:hi=m);}
  PHYS.vTipFull=(lo+hi)/2;
  // intoPlay — weakest pull that still clears the curve with ≥120px/s
  const vAt=pull=>arcExitSpeed(pull*PHYS.vTipFull,PHYS);
  lo=0;hi=1;for(let i=0;i<40;i++){const m=(lo+hi)/2;(vAt(m)<120?lo=m:hi=m);}
  PHYS.intoPlay=Math.ceil(((lo+hi)/2)*200)/200;
  // skill target — FIXED at the playfield centre between the two pass-through
  // lanes (SS_X), level with the two lane rollover circles (SS_Y = LANE_CY):
  // the target is a playfield FEATURE, identical for every preset and table
  // angle. The PHYSICS adapts instead: the design-centre pull is solved as
  // the one whose parabola crosses (SS_X, SS_Y) exactly (crossing x falls
  // monotonically with pull, so a bisection nails it), and the SKILL band =
  // the pulls whose parabola passes within the parity-derived collect radius
  // of it (see DIFFICULTY PARITY below). Collection fires ~126px below the
  // diamond pass-over sensors — and the skill check
  // runs before the diamond sensors anyway — so the diamonds the shot flies
  // past can never steal it.
  PHYS.skillX=SS_X;
  const cross=pull=>parabolaAtY(vAt(pull),PHYS,SS_Y);
  let c1=PHYS.intoPlay,c2=0.95;
  for(let i=0;i<36;i++){const m=(c1+c2)/2;(cross(m)>SS_X?c1=m:c2=m);}
  PHYS.skillCenter=Math.round(((c1+c2)/2)*200)/200;
  // ===== DIFFICULTY PARITY ===== Moving the target down to the lane-circle
  // line steepens the descent through it: the ball is airborne longer before
  // crossing the target line, so pull-driven speed differences compound and
  // the drop point became 2–3.5× more pull-sensitive (measured). The classic
  // 30px circle would map to a hair-thin band (atari 0.62–0.63 vs the classic
  // 0.65–0.685), so the collect radius is DERIVED per preset: widen it until
  // the band width matches the one the CLASSIC placement gave (SS_Y_CLASSIC
  // with SS_COLLECT — re-measured live, so preset tuning and table angle stay
  // honest). At band edges the descent is ~25–31° steep, so the ball's true
  // closest approach to the disc is only ~0.5× the horizontal miss (25–44px)
  // — it visibly grazes the disc and stays inside the 48px armed glow.
  // Ceiling: band-edge drops must stay clear of the pass-through lane
  // corridors (100px either side of the disc).
  // LANE-CORRIDOR CLEARANCE — a band pull must reach the disc without
  // clipping the pass-through lane walls: the descent crosses each inner
  // corridor wall line exactly once, and when that crossing lands inside a
  // wall's span the ball grinds along the rail and is deflected away from
  // the target (measured: the 0.61 slow edge crossed the right corridor's
  // wall line at y≈295 — 4px inside its top end — and lost the shot, while
  // 0.615, crossing 13px above the end, only grazed it and collected).
  // Same parabola as parabolaAtY, so the scan rejects clipping pulls for
  // free. CLEAR=6 reproduces the measured live boundary: it rejects the
  // deep 0.61 clip yet keeps the 0.615–0.645 edges that empirically collect
  // (near the wall ENDS the contact is a momentary graze that barely
  // deflects the ball — the full G_RAD=19 zone would over-reject them).
  const LANE_WALLS=[PL_L+PL_W*0.19,PL_L+PL_W*0.31,PL_R-PL_W*0.31,PL_R-PL_W*0.19];
  const CORRIDOR_CLEAR=6;
  const clipsCorridor=v=>{
    const x0=PF.r-24-CURVE_R-CURVE_R*Math.sin(PHYS.exitDrop),
          y0=CURVE_ENTRY_Y-CURVE_R*Math.cos(PHYS.exitDrop),
          vx=-v*Math.cos(PHYS.exitDrop),vy0=v*Math.sin(PHYS.exitDrop);
    for(const wx of LANE_WALLS){
      const t=(wx-x0)/vx;if(t<=0)continue;
      const y=y0+vy0*t+0.5*PHYS.grav*t*t;
      if(y>LANE_TOP+4-CORRIDOR_CLEAR&&y<LANE_BOT-44+CORRIDOR_CLEAR)return true;
    }
    return false;
  };
  const dropLive=[],dropClassic=[];   // scanned pull → |crossing x − target| per line
  for(let q=0.30;q<=0.96;q+=0.0025){
    const v=vAt(q);if(v<120)continue;
    if(!clipsCorridor(v))dropLive.push([q,Math.abs(parabolaAtY(v,PHYS,SS_Y)-SS_X)]);
    dropClassic.push([q,Math.abs(parabolaAtY(v,PHYS,SS_Y_CLASSIC)-SS_X)]); // width reference only — no clearance filter
  }
  const bandFrom=(drops,r)=>{         // measured band, quantised like the meter
    let mn=1,mx=0;
    for(const [q,m] of drops)if(m<=r){if(q<mn)mn=q;if(q>mx)mx=q;}
    return mx>mn?{min:Math.ceil(mn*200)/200,max:Math.floor(mx*200)/200}:null;
  };
  const ref=bandFrom(dropClassic,SS_COLLECT);
  let band=bandFrom(dropLive,SS_COLLECT),collect=SS_COLLECT;
  if(ref&&(!band||band.max-band.min<ref.max-ref.min)){
    let lo=SS_COLLECT,hi=SS_COLLECT*5;  // width grows with radius — bisect it
    for(let i=0;i<24;i++){
      const m=(lo+hi)/2,b=bandFrom(dropLive,m);
      (b&&b.max-b.min>=ref.max-ref.min)?hi=m:lo=m;
    }
    collect=Math.min(Math.ceil(hi),SS_COLLECT_CAP);
    band=bandFrom(dropLive,collect);
  }
  if(band)PHYS.skillShot={min:band.min,max:band.max,collect};
}
