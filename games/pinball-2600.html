  ctx.fillStyle=mq;ctx.fillRect(10,4,W-20,42);ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(10,4,W-20,42);
  ctx.textAlign='center';ctx.font='800 24px '+F_DISP;
  const lg=ctx.createLinearGradient(0,4,0,46);lg.addColorStop(0,'#ffca6a');lg.addColorStop(1,'#ff7d2a');
  ctx.fillStyle=lg;ctx.fillText('PINBALL 2600',W/2,34);
  // Lamp row — 30 lamps at 23px pitch centered on the marquee glass. (The old
  // hard-coded 18px start spanned 18–685, 8.5px LEFT of the 360px centre — the
  // mirror of the leftmost lamp sat 17px past the rightmost one. Now centered
  // so the cabinet trim reads symmetric like the rails.)
  const lampW=29*23,lampX0=(W-lampW)/2;
  // Bidirectional chase — two 5-lamp bands start at the outer edges and sweep
  // toward the centre, meet at the middle pair, then sweep back out. A triangle
  // phase (0..10..0) keeps it continuous — no hard snap — and every frame is
  // mirrored about the centre lamp axis, so the ANIMATION reads symmetric too
  // (the old chase swept one 10-lamp block left→right).
  const kk=Math.floor(t*8)%21,k=kk<11?kk:20-kk;
  for(let i=0;i<30;i++){const m=i<15?i:29-i,on=m>=k&&m<k+5;
    glowCircle(lampX0+i*23,8,on?4:2,on?'#ffd95a':'rgba(120,60,120,0.6)',on?0.8:0.3);}
  const dx=PF.x,dy=50,dw=PF.w,dh=104;
  // Chrome bezel around the score screen — the rail finish on the DMD trim.
  chromeFrame(dx-5,48,dw+10,dh+10,12);
  // Thin chrome divider strip — sits exactly on the seam (y=48) where the
  // marquee frame and the DMD bezel meet, spanning the full cabinet width like
  // the marquee so the two trim pieces read as ONE continuous cabinet rail.
  // (Both frames carried their own outline at the joint; the strip masks the
  // seam with a single steel line — same gradient, catch-light and outline as
  // every rail — plus a tight shadow so it reads as a raised divider.)
  {
    const sdx=6,sdy=46,sdw=W-12,sdh=4;
    ctx.fillStyle='rgba(0,0,0,0.4)';rr(sdx+2,sdy+2,sdw,sdh,2);ctx.fill();
    const sg=ctx.createLinearGradient(0,sdy,0,sdy+sdh);
    sg.addColorStop(0,'#aeb8c2');sg.addColorStop(0.5,'#8e959d');sg.addColorStop(1,'#5b6570');
    ctx.fillStyle=sg;rr(sdx,sdy,sdw,sdh,2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(sdx,sdy,sdw,1);
    ctx.strokeStyle='#0c0f14';ctx.lineWidth=1;rr(sdx+0.5,sdy+0.5,sdw-1,sdh-1,2);ctx.stroke();
  }
  const dg=ctx.createLinearGradient(0,dy,0,dy+dh);dg.addColorStop(0,'#0a0d12');dg.addColorStop(1,'#05070a');
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(dx+2,dy+2,dw,dh,8);ctx.fill();
  ctx.fillStyle=dg;rr(dx,dy,dw,dh,8);ctx.fill();
  drawSeven(String(Game.scores[Game.cur]).padStart(6,'0'),dx+dw/2,dy+52,'#ff7d1f');
  // 12px baseline grid — every label baseline snaps to dy+12k, readouts evenly spaced
  ctx.textAlign='left';ctx.font='700 13px '+F_MONO;ctx.fillStyle='#9fb4ff';
  ctx.fillText('P'+(Game.cur+1)+'  BALL '+Game.balls[Game.cur]+'/3',dx+14,dy+24);
  ctx.fillText('HI  '+String(store.scores[0]).padStart(6,'0'),dx+dw-6-ctx.measureText('HI  '+String(store.scores[0]).padStart(6,'0')).width,dy+24);
  // Physics mode — subtle indicator below player/ball line
  ctx.font='700 10px '+F_MONO;ctx.textAlign='left';
  ctx.fillStyle=PHYS.label==='SUPERBALL'?'#ff5a8a':PHYS.label==='ARCADE SIM'?'#5ac8ff':'#ffb040';
  ctx.fillText(PHYS.label,dx+14,dy+36);
  ctx.font='700 13px '+F_MONO;ctx.fillStyle='#7dffb0';ctx.textAlign='right';
  ctx.fillText('BONUS ×'+Game.bonus,dx+dw-14,dy+72);
  ctx.fillStyle='#7dc8ff';ctx.fillText('DRAIN ×'+Game.leftRoll+' = '+(Game.leftRoll*1000),dx+dw-14,dy+84);
  ctx.fillStyle='#ffd9a0';  ctx.fillText('BUMPER ×'+Game.bumperVal,dx+dw-14,dy+96);
  // Mute indicator — show a subtle icon when sound is off
  if(!store.snd){
    ctx.globalAlpha=0.8;ctx.font='600 12px '+F_UI;ctx.textAlign='right';
    ctx.fillStyle='#ff9a6a';ctx.fillText('🔇 MUTED',dx+dw-14,dy+36);ctx.globalAlpha=1;
  }
  // Countdown pills — the SPECIAL lit-window and BALL SAVE grace-window timers
  // share one container shape: matched gold pills (dark-gold fill, gold border,
  // and the shrinking gold bar inside above the label), centered under the
  // score as a pair. Each pill centers on its own when the other isn't running.
  const pills=[];
  // Both pills share ONE pulse (the old SPECIAL sin·6t / BALL SAVE sin·12t ran
  // at different frequencies, ranges AND phases — at any instant one pill was
  // near-full bright while the other sat nearly dark, so the pair never read
  // mirrored). Shared pulse = the pair breathes in lockstep.
  const pillPulse=0.7+0.3*Math.sin(t*8);
  if(Game.special.lit)pills.push({txt:'SPECIAL '+Game.special.t.toFixed(1)+'s',pulse:pillPulse,frac:Math.max(0,Math.min(1,Game.special.t/10.0))});
  if(Game.ballSaveTimer>0)pills.push({txt:'⚡ BALL SAVE  '+Game.ballSaveTimer.toFixed(1)+'s',pulse:pillPulse,frac:Math.max(0,Math.min(1,Game.ballSaveTimer/5.0))});
  if(pills.length){
    ctx.font='700 14px '+F_MONO;ctx.textAlign='center';
    const py=dy+76,gap=10;
    const pw=pills.map(p=>ctx.measureText(p.txt).width+24);
    let px=dx+dw/2-(pw.reduce((a,b)=>a+b,0)+gap*(pills.length-1))/2;
    for(let i=0;i<pills.length;i++){
      const p=pills[i],cw=pw[i];
      ctx.fillStyle='rgba(24,18,8,0.6)';rr(px,py-20,cw,32,16);ctx.fill();
      ctx.strokeStyle='rgba(255,217,90,0.4)';ctx.lineWidth=1;rr(px,py-20,cw,32,16);ctx.stroke();
      // Shrinking time bar — remaining window as a gold progress bar inside the
      // pill above the label. The pair's bars recede OUTWARD — left pill hugs
      // its left edge, right pill its right edge — so the countdown reads
      // mirrored (both bars used to be left-anchored, so the right pill's bar
      // shrank toward the centre while the left's shrank away). A lone centred
      // pill anchors left like a normal progress bar.
      const bw=cw-12,by=py-18,bh=4;
      ctx.globalAlpha=0.5;ctx.fillStyle='rgba(255,255,255,0.12)';rr(px+6,by,bw,bh,2);ctx.fill();
      const barX=i===1?px+cw-6-bw*p.frac:px+6;
      ctx.globalAlpha=0.85*p.pulse;ctx.fillStyle='#ffd95a';rr(barX,by,bw*p.frac,bh,2);ctx.fill();
      ctx.globalAlpha=p.pulse;ctx.fillStyle='#ffd95a';ctx.fillText(p.txt,px+cw/2,py);
      ctx.globalAlpha=1;
      px+=cw+gap;
    }
  }
}
function drawSeven(str,x,y,color){ctx.save();ctx.textAlign='center';ctx.font='800 44px '+F_DISP;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillText(str,x+2,y+3);
  const g=ctx.createLinearGradient(0,y-40,0,y+4);g.addColorStop(0,'#fff2d0');g.addColorStop(0.5,color);g.addColorStop(1,'#b34400');
  ctx.fillStyle=g;ctx.fillText(str,x,y);ctx.restore();}

/* ---------- table objects ---------- */
function drawTable(){
  // Not built yet — the first frame's tick is skipped (dt=0), so startDemo()
  // hasn't populated Game.rolls when the title draws. Frame 2 renders fully.
  if(Game.rolls.length===0)return;
  const t=performance.now()/1000;

  // ===== LEFT ROLLOVER LANE (upper-left, numbered) =====
  const lr=Game.rolls[0],lv=Game.leftRoll;
  const llcx=lr.x,llcy=lr.y;
  // Lane surface glow
  if(lv>0)glowCircle(llcx,llcy,34,'#3fd0ff',0.30);
  // Rollover button housing
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(llcx+2,llcy+3,20,18,0,0,6.28);ctx.fill();
  const lrg=ctx.createRadialGradient(llcx-4,llcy-4,1,llcx,llcy,18);
  if(lv>0){lrg.addColorStop(0,'#eafcff');lrg.addColorStop(0.6,'#3fd0ff');lrg.addColorStop(1,'#0a7ab0');}
  else{lrg.addColorStop(0,'#3a4668');lrg.addColorStop(1,'#141a30');}
  ctx.fillStyle=lrg;ctx.beginPath();ctx.arc(llcx,llcy,17,0,6.28);ctx.fill();
  ctx.strokeStyle=lv>0?'rgba(200,250,255,0.8)':'rgba(120,150,210,0.4)';ctx.lineWidth=2;ctx.stroke();
  // Number display
  ctx.fillStyle=lv>0?'#003a55':'#8aa0cf';ctx.font='bold 22px "Courier New",monospace';ctx.textAlign='center';
  ctx.fillText(String(lv||1),llcx,llcy+8);

  // LEFT LANE — both arrows point TOWARD the rollover circle, matching the
  // right pass-through lane (arrows converge on the lane's circle).
  ctx.fillStyle=lv>0?'rgba(63,208,255,0.6)':'rgba(150,180,220,0.3)';
  ctx.beginPath();ctx.moveTo(llcx,llcy+24);ctx.lineTo(llcx-8,llcy+38);ctx.lineTo(llcx+8,llcy+38);ctx.closePath();ctx.fill();
  // Above arrow also points down toward the circle (tip below the base)
  ctx.beginPath();ctx.moveTo(llcx,llcy-24);ctx.lineTo(llcx-8,llcy-38);ctx.lineTo(llcx+8,llcy-38);ctx.closePath();ctx.fill();

  // ===== ATARI ROLLOVER LANE (upper-right, ATARI logo) =====
  const ar=Game.rolls[1],atariLit=Math.min(Game.atariHits,4);
  const alcx=ar.x,alcy=ar.y;
  // Lane surface glow
  if(atariLit>0)glowCircle(alcx,alcy,34,'#ff7a2a',0.25+atariLit*0.05);
  // Rollover button housing
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(alcx+2,alcy+3,20,18,0,0,6.28);ctx.fill();
  const arg=ctx.createRadialGradient(alcx-4,alcy-4,1,alcx,alcy,18);
  if(atariLit>0){arg.addColorStop(0,'#fff2d0');arg.addColorStop(0.6,'#ff7d2a');arg.addColorStop(1,'#a34400');}
  else{arg.addColorStop(0,'#3a4668');arg.addColorStop(1,'#141a30');}
  ctx.fillStyle=arg;ctx.beginPath();ctx.arc(alcx,alcy,17,0,6.28);ctx.fill();
  ctx.strokeStyle=atariLit>0?'rgba(255,240,190,0.8)':'rgba(120,150,210,0.4)';ctx.lineWidth=2;ctx.stroke();

  // Arrow pointing down from lane (below the circle)
  ctx.fillStyle=atariLit>0?'rgba(255,122,42,0.6)':'rgba(150,180,220,0.3)';
  ctx.beginPath();ctx.moveTo(alcx,alcy+24);ctx.lineTo(alcx-8,alcy+38);ctx.lineTo(alcx+8,alcy+38);ctx.closePath();ctx.fill();
  // Arrow pointing down toward the circle (above) — mirrors the lower arrow
  ctx.beginPath();ctx.moveTo(alcx,alcy-24);ctx.lineTo(alcx-8,alcy-38);ctx.lineTo(alcx+8,alcy-38);ctx.closePath();ctx.fill();
  // ATARI logo on lane button — always visible
  drawAtariLogo(alcx,alcy,22,'#E31B23');

  // ===== SKILL SHOT TARGET =====
  // Light states mirror a real machine's skill-shot insert (researched — see
  // SKILL_SHOT_TIME):
  //   AIMING  — lit warm gold while the ball is parked on the plunger or in
  //             the launch flight: the shot is on offer, take your time (real
  //             machines never time out the aim).
  //   ARMED   — full pulsing bullseye while the chance is live: the ball is
  //             away from an in-band pull and the collect window is open —
  //             until collect, first touch, or the SKILL_SHOT_TIME clock.
  //   DARK    — dim disc once the ball is in general play (chance over) or
  //             the shot was collected (one skill shot per ball).
  const sk=Game.skillShot;
  if(sk&&sk.r>0){
    const active=Game.skillShotReady, up=!Game.skillShotDone;
    const aiming=up&&(Game.launching||!Game.ball.live); // on the plunger / in flight
    if(active){
      // Glowing bullseye — pulses to attract the eye
      glowCircle(sk.x,sk.y,sk.r*2.2,'#ffd95a',0.40+0.20*Math.sin(t*8));
      const sgg=ctx.createRadialGradient(sk.x-3,sk.y-3,2,sk.x,sk.y,sk.r);
      sgg.addColorStop(0,'#ffffff');sgg.addColorStop(0.4,'#ffe566');sgg.addColorStop(1,'#c88800');
      ctx.fillStyle=sgg;ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2.5;ctx.stroke();
      // Inner ring
      ctx.strokeStyle='#ffd95a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r*0.5,0,6.28);ctx.stroke();
      ctx.fillStyle='#4a2000';ctx.font='bold 9px "Courier New",monospace';ctx.textAlign='center';
      ctx.fillText('SKILL',sk.x,sk.y-3);ctx.fillText('SHOT',sk.x,sk.y+9);
    } else if(aiming){
      // LIT steady state — the insert is ON: warm amber disc with a slow
      // breathing glow, readable while aiming from the plunger.
      glowCircle(sk.x,sk.y,sk.r*1.9,'#ffd95a',0.18+0.08*Math.sin(t*3));
      const sug=ctx.createRadialGradient(sk.x-3,sk.y-3,2,sk.x,sk.y,sk.r);
      sug.addColorStop(0,'#ffe9a8');sug.addColorStop(0.5,'#d9a832');sug.addColorStop(1,'#7a5410');
      ctx.fillStyle=sug;ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(255,215,110,0.75)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.strokeStyle='rgba(120,80,10,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r*0.5,0,6.28);ctx.stroke();
      ctx.fillStyle='#3a2600';ctx.font='bold 9px "Courier New",monospace';ctx.textAlign='center';
      ctx.fillText('SKILL',sk.x,sk.y-3);ctx.fillText('SHOT',sk.x,sk.y+9);
    } else {
      ctx.fillStyle='rgba(100,90,60,0.55)';ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(180,150,80,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r,0,6.28);ctx.stroke();
    }
  }

  // ===== top diamond lights — pass-over switches (original game) =====
  // Lit diamonds glow; when the ball rolls over one it switches off (dark)
  // and re-lights after a moment. No movement, no deflection.
  ctx.fillStyle='rgba(0,0,0,0.3)';
  rr(Game.targets[0].x-22,Game.targets[0].y-22,(Game.targets[2].x-Game.targets[0].x)+44,38,12);ctx.fill();
  for(const d of Game.targets){
    ctx.save();ctx.translate(d.x,d.y);ctx.rotate(Math.PI/4);
    const lit=!d.down;
    if(lit)glowCircle(0,0,26,'#ff9a2a',0.30+0.10*Math.sin(t*5));
    const dg3=ctx.createLinearGradient(-11,-11,11,11);
    if(lit){dg3.addColorStop(0,'#fff0c0');dg3.addColorStop(0.5,'#ff8a2a');dg3.addColorStop(1,'#c25400');}
    else{dg3.addColorStop(0,'#333c58');dg3.addColorStop(1,'#161c30');}
    ctx.fillStyle=dg3;ctx.fillRect(-11,-11,22,22);
    ctx.strokeStyle=lit?'rgba(255,240,210,0.9)':'rgba(140,160,200,0.35)';ctx.lineWidth=2;ctx.strokeRect(-11,-11,22,22);
    ctx.restore();
  }

  // ===== special target — main centre shot =====
  const sp=Game.special;
  if(sp.lit){
    glowCircle(sp.x,sp.y,34,'#ffd95a',0.45+0.15*Math.sin(t*10));
    // Pulsing halo ring — the on-table lit indicator, readable at a glance
    // without any text. A tight halo hugging the diamond: crisp ring + soft
    // glow, sized to clear the pulsing arrows and the SPECIAL label below.
    // The pulse quickens as the countdown nears zero for end-of-window urgency.
    const u=Math.max(0,1-sp.t/3);          // 0 until 3s left, then 0 → 1
    const pr=22+(1.5+2*u)*Math.sin(t*(5+9*u));
    ctx.strokeStyle='rgba(255,225,120,0.85)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sp.x,sp.y,pr,0,6.28);ctx.stroke();
    ctx.strokeStyle='rgba(255,210,90,0.30)';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(sp.x,sp.y,pr,0,6.28);ctx.stroke();
    ctx.save();ctx.translate(sp.x,sp.y);ctx.rotate(Math.PI/4);
    const sg=ctx.createLinearGradient(-11,-11,11,11);sg.addColorStop(0,'#fff5c0');sg.addColorStop(1,'#ffb020');
    ctx.fillStyle=sg;ctx.fillRect(-11,-11,22,22);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-11,-11,22,22);
    ctx.restore();ctx.fillStyle='#6a2a00';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='center';
    ctx.fillText('SPECIAL',sp.x,sp.y+14);
    if((sp.streak||0)>0){ // show next streak value
      ctx.fillStyle='#ffd95a';ctx.font='bold 10px "Courier New",monospace';
      ctx.fillText(sp.streak>=2?'5000':sp.streak===1?'2500':'1000',sp.x,sp.y-42);
    }
  }else{
    ctx.save();ctx.translate(sp.x,sp.y);ctx.rotate(Math.PI/4);
    const ug=ctx.createLinearGradient(-9,-9,9,9);ug.addColorStop(0,'#39466b');ug.addColorStop(1,'#1a2238');
    ctx.fillStyle=ug;ctx.fillRect(-9,-9,18,18);
    ctx.strokeStyle='rgba(150,180,235,0.55)';ctx.lineWidth=1.5;ctx.strokeRect(-9,-9,18,18);ctx.restore();
  }

  // ===== spinners =====
  for(const s of Game.spinners){
    const spinning=s.spin>0;
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(s.x+2,s.y+3,20,24,0,0,6.28);ctx.fill();
    if(spinning){glowCircle(s.x,s.y,22,'rgba(255,255,255,0.4)',0.35);}
    const hg=ctx.createRadialGradient(s.x-4,s.y-4,2,s.x,s.y,19);
    hg.addColorStop(0,spinning?'#c8d8f0':'#6a7a92');hg.addColorStop(0.5,spinning?'#8098b8':'#3a4658');hg.addColorStop(1,'#1c2430');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(s.x,s.y,18,0,6.28);ctx.fill();
    ctx.strokeStyle=spinning?'rgba(240,255,255,0.7)':'rgba(160,190,255,0.35)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.ang);
    const tg=ctx.createLinearGradient(-4,-20,4,20);
    tg.addColorStop(0,spinning?'#ffffff':'#c6d2e2');tg.addColorStop(0.4,spinning?'#b8c8e0':'#7a8aa2');tg.addColorStop(1,spinning?'#6a7a92':'#3a4658');
    ctx.fillStyle=tg;ctx.fillRect(-5,-20,10,40);
    ctx.strokeStyle='#ffffff';ctx.lineWidth=spinning?1.5:0.8;
    ctx.strokeRect(-5,-20,10,40);
    ctx.restore();
    if(spinning){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(s.x,s.y,18,0,6.28);ctx.fill();}
  }

  // NOTE: the decorative chrome bar between the lower bumpers is intentionally
  // gone — it hard-stopped every centre shot (see guideGeom). The SPECIAL
  // target below it is now freely reachable, matching the original game.

  // ===== pop bumpers =====
  for(const bp of Game.bumpers){
    if(bp.hit>0)bp.hit--;const hit=bp.hit>0,col=BPC[bp.col];
    // Idle breathing phase — min(x, W-x) is symmetric about the centre axis, so
    // the mirrored lower pair swell in LOCKSTEP (the old raw-bp.x phase put
    // them ~120° apart: one bumped while the other shrank). The top-centre
    // bumper sits on the axis, so its own phase keeps the field symmetric too.
    const flare=hit?1.15:(1+0.05*Math.sin(t*3+Math.min(bp.x,W-bp.x)));
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(bp.x+5,bp.y+8,bp.r*flare,bp.r*0.82*flare,0,0,6.28);ctx.fill();
    if(hit)glowCircle(bp.x,bp.y,bp.r*2.2,'rgb('+col[0]+','+col[1]+','+col[2]+')',0.30);
    const pg2=ctx.createLinearGradient(bp.x-bp.r*flare,0,bp.x+bp.r*flare,0);
    pg2.addColorStop(0,'rgb('+Math.round(col[0]*0.6)+','+Math.round(col[1]*0.6)+','+Math.round(col[2]*0.6)+')');
    pg2.addColorStop(0.45,'rgb('+col[0]+','+col[1]+','+col[2]+')');
    pg2.addColorStop(1,'rgb('+Math.round(col[0]*0.45)+','+Math.round(col[1]*0.45)+','+Math.round(col[2]*0.45)+')');
    ctx.fillStyle=pg2;ctx.beginPath();ctx.arc(bp.x,bp.y,bp.r*flare,0,6.28);ctx.fill();
    // Skirt ring — the rubber ring around the bumper base
    ctx.strokeStyle=hit?'#ffffff':'rgba(255,255,255,0.55)';ctx.globalAlpha=hit?0.9:0.5;
    ctx.lineWidth=hit?4:3;
    ctx.beginPath();ctx.arc(bp.x,bp.y,bp.r*flare-6,0,6.28);ctx.stroke();ctx.globalAlpha=1;
    // Clean flat center with subtle highlight
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.arc(bp.x+1,bp.y+2,bp.r*0.28,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(bp.x-2,bp.y-3,bp.r*0.22,0,6.28);ctx.fill();
    // Value number in the center — clean, bold
    ctx.fillStyle=hit?'#ffffff':'rgba(255,255,255,0.85)';
    ctx.font='bold 16px "Courier New",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(bp.v),bp.x,bp.y+1);
    ctx.textBaseline='alphabetic';
  }

  // ===== ATARI FUJI LOGOS — 3 in a row below bottom bumpers (hit count indicators) =====
  const fujiY=PF.y+PF.h*0.68, fujiCX=PL_CX;
  const fujiAtari=Math.min(Game.atariHits,4);
  for(let fi=0;fi<3;fi++){
    const fx=fujiCX+(fi-1)*42;
    const lit=fi<fujiAtari;
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.arc(fx+1,fujiY+1,13,0,6.28);ctx.fill();
    if(lit)glowCircle(fx,fujiY,18,'#ff7d2a',0.5);
    const fg2=ctx.createRadialGradient(fx-3,fujiY-3,1,fx,fujiY,12);
    fg2.addColorStop(0,lit?'#fff5d0':'#4a5688');fg2.addColorStop(0.6,lit?'#ff7d2a':'#2a3050');fg2.addColorStop(1,lit?'#a34400':'#1a2030');
    ctx.fillStyle=fg2;ctx.beginPath();ctx.arc(fx,fujiY,11,0,6.28);ctx.fill();
    ctx.strokeStyle=lit?'rgba(255,240,180,0.9)':'rgba(80,100,150,0.3)';ctx.lineWidth=1.5;ctx.stroke();
    if(fi===1&&Game.extra[Game.cur]){
      // Middle turns to RED X = extra ball earned (original game indicator)
      ctx.fillStyle='#ff2a2a';ctx.font='bold 18px "Courier New",monospace';ctx.textAlign='center';
      ctx.fillText('X',fx,fujiY+7);
      glowCircle(fx,fujiY,20,'#ff3030',0.6);
      ctx.strokeStyle='rgba(255,60,60,0.9)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(fx,fujiY,13,0,6.28);ctx.stroke();
    } else {
      // ATARI logo — match the classic mountain shape
      drawAtariLogo(fx,fujiY,18,lit?'#E31B23':'rgba(200,180,180,0.45)');
    }
  }

  // ===== flippers =====
  for(const f of [FL.l,FL.r]){
    const tx=f.x+Math.cos(f.ang)*f.len,ty=f.y+Math.sin(f.ang)*f.len;
    const nx=Math.cos(f.ang),ny=Math.sin(f.ang);
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(f.x+5,f.y+6);ctx.lineTo(tx+5,ty+6);ctx.stroke();
    ctx.strokeStyle='#14181d';ctx.lineWidth=20;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(tx,ty);ctx.stroke();
    const fg2=ctx.createLinearGradient(f.x-ny*10,f.y+nx*10,f.x+ny*10,f.y-nx*10);
    fg2.addColorStop(0,'#5b6570');fg2.addColorStop(0.5,'#aeb8c2');fg2.addColorStop(1,'#2a3036');
    ctx.strokeStyle=fg2;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(tx,ty);ctx.stroke();
    const tl=0.70,rx=f.x+(tx-f.x)*tl,ry=f.y+(ty-f.y)*tl;
    ctx.globalAlpha=0.12;ctx.lineWidth=26;ctx.beginPath();ctx.moveTo(rx-3,ry-3);ctx.lineTo(tx,ty);ctx.stroke();ctx.globalAlpha=1;
    const rg4=ctx.createLinearGradient(rx-ny*10,ry+nx*10,rx+ny*10,ry-nx*10);
    rg4.addColorStop(0,'#ff8a7a');rg4.addColorStop(0.45,'#e2231a');rg4.addColorStop(1,'#8f0f08');
    ctx.strokeStyle=rg4;ctx.lineWidth=19;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.arc(f.x+2,f.y+2,10,0,6.28);ctx.fill();
    const pv=ctx.createRadialGradient(f.x-3,f.y-3,1,f.x,f.y,9);
    pv.addColorStop(0,'#ffffff');pv.addColorStop(0.6,'#aeb8c2');pv.addColorStop(1,'#2a3036');
    ctx.fillStyle=pv;ctx.beginPath();ctx.arc(f.x,f.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();ctx.lineCap='butt';
  }

  // drain holes
  for(const dh of Game.drainHoles){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.arc(dh.x,dh.y,17,0,6.28);ctx.fill();
    const dg4=ctx.createRadialGradient(dh.x-4,dh.y-4,1,dh.x,dh.y,16);dg4.addColorStop(0,'#ff6a6a');dg4.addColorStop(1,'#a01010');
    ctx.fillStyle=dg4;ctx.beginPath();ctx.arc(dh.x,dh.y,13,0,6.28);ctx.fill();
  }

  // ===== plunger — spring-loaded rod with coiled spring =====
  // Real pinball plunger: spring compresses when you pull the handle. At rest
  // the rod tip sits high in the lane under the ball. Pulling withdraws the
  // tip downward, compressing the spring against the fixed housing. Travel is
  // bounded to a real spring's proportions: a genuine plunger spring (~5.5"
  // free length) is compressed by a ~1.75–2" full pull, so it shortens to
  // ~65% of its rest length and NEVER binds solid. The rod and handle are one
  // rigid piece, so the handle pulls out with the tip, and after release the
  // spring settles back to rest with a short oscillation.
  const housingY=PF.b+40;   // fixed spring housing (the stop the spring pushes against)
  const tipRestY=PF.b-66;    // rod tip at full rest — sits just below the ball
  const tipTravel=36;        // full pull withdraws the tip this far (~35% of the spring)
  const charging=!Game.ball||!Game.ball.live; // ball on the tip = being charged
  const pullFrac=(state===S.LAUNCH||demoMode||Game.springBob>0)?Game.plungerCharge:0;
  // 1 while charging; eases 1→0 after release so the rod springs back to rest
  const easeBack=charging?1:Game.springBob;
  const pullPos=pullFrac*tipTravel*easeBack;
  // Short spring oscillation after release (amplitude ∝ pull)
  const bob=Game.springBob*Math.sin(Game.springBob*25)*(8*pullFrac+3);
  // Tip moves DOWN when charging: rod withdraws, spring compresses against the
  // housing. Clamped so the tip can never pass the housing/bushing.
  const tipY=Math.max(tipRestY-6,Math.min(tipRestY+tipTravel+2,tipRestY+pullPos+bob));
  // Handle position — the handle is the outer end of the rod: it pulls OUT
  // (down) with the tip and rides back with the spring after release
  const hy=housingY+10+pullPos;
  // Spring sits between the housing (bottom) and the rod tip (top).
  // More charge = tip closer to housing = spring shorter (never below ~60%).
  const springTop=Math.min(tipY,housingY-4);
  const springLen=Math.max(6,housingY-springTop);
  // Dark channel behind spring
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.fillRect(PF.r-50,springTop-4,52,springLen+12);
  // Spring coils — fixed count; the pitch compresses as the spring shortens
  const coils=9;
  const coilSpacing=springLen/coils;
  ctx.save();ctx.beginPath();
  ctx.rect(PF.r-50,springTop-4,52,springLen+12);ctx.clip();
  for(let ci=0;ci<coils;ci++){
    const cy=springTop+ci*coilSpacing+coilSpacing*0.5;
    const cw=10;
    ctx.strokeStyle='#aeb8c2';ctx.lineWidth=2.6;
    ctx.beginPath();ctx.moveTo(PF.r-26-cw,cy-coilSpacing*0.35);
    ctx.lineTo(PF.r-26+cw,cy+coilSpacing*0.35);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(PF.r-27-cw,cy-coilSpacing*0.35+1);
    ctx.lineTo(PF.r-27+cw,cy+coilSpacing*0.35+1);ctx.stroke();
  }
  ctx.restore();
  // Housing bracket
  ctx.fillStyle='rgba(0,0,0,0.35)';rr(PF.r-38,housingY-4,20,8,3);ctx.fill();
  ctx.fillStyle='#5b6570';rr(PF.r-37,housingY-3,18,6,3);ctx.fill();
  // Rod shaft (runs through the spring down to the handle — one rigid piece)
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(PF.r-26,tipY-8);ctx.lineTo(PF.r-26,hy);ctx.stroke();
  const rodG=ctx.createLinearGradient(PF.r-30,0,PF.r-22,0);
  rodG.addColorStop(0,'#5b6570');rodG.addColorStop(0.5,'#aeb8c2');rodG.addColorStop(1,'#2a3036');
  ctx.strokeStyle=rodG;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(PF.r-26,tipY-8);ctx.lineTo(PF.r-26,hy);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(PF.r-27,tipY-8);ctx.lineTo(PF.r-27,hy);ctx.stroke();
  // Flat rod tip — the ball sits on this wide platform, not a dome
  const tipTopY=tipY-4;
  // Shadow beneath the flat tip
  ctx.fillStyle='rgba(0,0,0,0.35)';rr(PF.r-32,tipTopY,12,10,3);ctx.fill();
  // Flat metal platform
  const tipG=ctx.createLinearGradient(PF.r-32,tipTopY,PF.r-32,tipTopY+10);
  tipG.addColorStop(0,'#e8edf3');tipG.addColorStop(0.2,'#ffffff');tipG.addColorStop(0.5,'#aeb8c2');tipG.addColorStop(0.9,'#5b6570');
  tipG.addColorStop(1,'#2a3036');
  ctx.fillStyle=tipG;rr(PF.r-31,tipTopY+1,10,8,3);ctx.fill();
  // Highlight line on top edge
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(PF.r-29,tipTopY+1);ctx.lineTo(PF.r-23,tipTopY+1);ctx.stroke();
  // Handle at bottom — travels with the rod (pulls out as the spring compresses)
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(PF.r-38,hy,20,28,6);ctx.fill();
  const hg=ctx.createLinearGradient(PF.r-38,hy,PF.r-38,hy+28);
  hg.addColorStop(0,'#ff7d2a');hg.addColorStop(0.6,'#d45518');hg.addColorStop(1,'#8a2808');
  ctx.fillStyle=hg;rr(PF.r-37,hy+1,18,26,5);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)';rr(PF.r-35,hy+2,14,6,3);ctx.fill();
  // Charge glow beneath handle
  if(pullFrac>0){
    glowCircle(PF.r-26,hy+30,12+pullFrac*14,'#ff7d2a',pullFrac*0.6);
    glowCircle(PF.r-26,hy+30,6+pullFrac*8,'#ffd23a',pullFrac*0.8);
  }

  // ===== chevrons on the angled outlane walls — classic lane arrows =====
  // Precisely aligned with the outlane guide rails so the chevrons sit ON the
  // chrome bars, not floating in mid-air.
  const chv=[
    [PL_L,   WALL_TOP_Y, FL.l.x-2, FL.l.y],   // left guide
    [PL_R,   WALL_TOP_Y, FL.r.x+2, FL.r.y]    // right guide (matches guideGeom)
  ];
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const g of chv){
    for(let i=0;i<5;i++){
      const u=(i+0.5)/5;
      const cx=g[0]+(g[2]-g[0])*u,cy=g[1]+(g[3]-g[1])*u;
      ctx.globalAlpha=0.35+0.28*Math.sin(t*6+i*1.25);
      ctx.strokeStyle=i%2?'#ff9a3a':'#ffd23a';
      ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(cx-7,cy);ctx.lineTo(cx,cy+9);ctx.lineTo(cx+7,cy);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

}

/* ---------- ball ---------- */
function drawBall(){
  const b=Game.ball;if(!b)return;if(!b.live&&state!==S.LAUNCH&&!demoMode)return;
  const superball=PHYS.label==='SUPERBALL';
  const t=performance.now()/1000;
  // Launch glow
  if(Game.launchAnim>0){
    glowCircle(b.x,b.y,BALL_R*3,'rgba(255,200,80,'+Game.launchAnim.toFixed(2)+')',Game.launchAnim*0.8);
  }
  // Trail
  for(let i=b.trail.length-1;i>=1;i--){const p=b.trail[i],a=0.16*(1-i/b.trail.length);
    ctx.globalAlpha=a;ctx.fillStyle=superball?'#ff40b0':'#bcd6ff';ctx.beginPath();
    ctx.arc(p.x,p.y,BALL_R*(1-i*0.07),0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.ellipse(b.x+3,b.y+5,BALL_R*1.1,BALL_R*0.9,0,0,6.28);ctx.fill();
  // Main ball
  const g=ctx.createRadialGradient(b.x-5,b.y-6,2,b.x,b.y,BALL_R+1);
  if(superball){
    // Brilliant hot-pink sparkling ball
    const hue=Math.sin(t*10)*15;
    g.addColorStop(0,'#ffffff');g.addColorStop(0.15,'#ffe0f0');g.addColorStop(0.35,'#ff40b0');
    g.addColorStop(0.6,'#cc1070');g.addColorStop(0.85,'#600830');g.addColorStop(1,'#200010');
  }else{
    g.addColorStop(0,'#ffffff');g.addColorStop(0.3,'#e8f0ff');g.addColorStop(0.5,'#9fb4c9');
    g.addColorStop(0.75,'#45586e');g.addColorStop(1,'#141c26');
  }
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,6.28);ctx.fill();
  // Specular highlight band
  ctx.save();ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,6.28);ctx.clip();
  ctx.fillStyle=superball?'rgba(255,255,255,0.45)':'rgba(255,125,42,0.33)';ctx.fillRect(b.x-BALL_R,b.y+1,BALL_R*2,3);
  ctx.fillStyle=superball?'rgba(255,200,255,0.35)':'rgba(63,208,255,0.25)';ctx.fillRect(b.x-BALL_R,b.y-5,BALL_R*2,2);
  if(superball){ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(b.x-BALL_R,b.y-2,BALL_R*2,1.5);}
  ctx.restore();
  // Sparkle points for SUPERBALL
  if(superball){for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2+t*4,bright=0.5+0.5*Math.sin(t*16+i*2.5);
    if(bright<0.4)continue;const sx=b.x+Math.cos(a)*BALL_R*1.15,sy=b.y+Math.sin(a)*BALL_R*1.15;
    ctx.fillStyle='rgba(255,255,255,'+(bright*0.7).toFixed(2)+')';ctx.beginPath();
    ctx.arc(sx,sy,1.5+bright*2,0,6.28);ctx.fill();
  }}
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,6.28);ctx.stroke();
}

function drawPfx(){for(const q of Game.pfx){const a=1-q.t/q.life;

  else{ctx.globalAlpha=a;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.size*a+0.5,0,6.28);ctx.fill();}}ctx.globalAlpha=1;}

// Plunger power gauge — shared by the in-game LAUNCH hint and the title-screen
// attract demo, so the red escape zone reads identically everywhere. charge is
// the pull 0..1; cx,cy is the gauge centre.
function drawPlungerGauge(cx,cy,charge){
  // Charge ring — grows with the pull (the spring compressing).
  ctx.strokeStyle='rgba(255,210,58,'+(0.3+charge*0.6)+')';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,10+charge*10,-Math.PI/2,-Math.PI/2+Math.PI*2*charge);ctx.stroke();
  // Tick at the pull that gets the ball INTO play — below it the ball rolls
  // back down the lane (arcade soft-plunge feel). Measured per preset on the
  // real launch physics: the spring energy must lift the ball the 743px up
  // the tube and still arc it past the tube mouth into the playfield.
  const thA=-Math.PI/2+Math.PI*2*(PHYS.intoPlay||0.52);
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(thA)*22,cy+Math.sin(thA)*22);
  ctx.lineTo(cx+Math.cos(thA)*26,cy+Math.sin(thA)*26);
  ctx.stroke();
  // GOLD sweet spot — the EXACT-POWER skill-shot band, derived from the real
  // launch physics (tuneLaunch): only this pull range's projectile drops the
  // ball onto the SKILL SHOT target. Too weak: it drops short (or rolls
  // back below the white tick); too strong: it overshoots and the shot is
  // missed — the SKILL SHOT is the launch bonus, nothing else pays.
  // Bright gold while the shot is up for grabs this ball; dimmed once
  // collected (one skill shot per ball — it stays collected on re-launches).
  const ssMin=PHYS.skillShot.min,ssMax=PHYS.skillShot.max;
  const ss0=-Math.PI/2+Math.PI*2*ssMin,ss1=-Math.PI/2+Math.PI*2*ssMax;
  const sk=!Game.skillShotDone;
  ctx.strokeStyle=sk?'rgba(255,215,80,0.85)':'rgba(150,140,110,0.40)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(cx,cy,15,ss0,ss1);ctx.stroke();
  const thS=-Math.PI/2+Math.PI*2*((ssMin+ssMax)/2);
  ctx.strokeStyle=sk?'#ffd95a':'rgba(165,155,125,0.65)';ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(thS)*19,cy+Math.sin(thS)*19);
  ctx.lineTo(cx+Math.cos(thS)*29,cy+Math.sin(thS)*29);
  ctx.stroke();
  ctx.fillStyle=sk?'#ffd95a':'rgba(165,155,125,0.75)';ctx.font='700 8px '+F_MONO;ctx.textAlign='center';
  ctx.fillText('SKILL',cx+Math.cos(thS)*34,cy+Math.sin(thS)*34+3);
}

/* Key-cap hint row — e.g.  [↑↓] SELECT   [ENTER] CONFIRM */
function drawKeyHints(items,y){
  ctx.font='600 13px '+F_MONO;
  const kws=items.map(([k])=>ctx.measureText(k).width+14);
  ctx.font='500 14px '+F_UI;
  const lws=items.map(([,l])=>ctx.measureText(l).width);
  const gap=24;
  const total=items.reduce((a,_,i)=>a+kws[i]+6+lws[i]+gap,0)-gap;
  let x=W/2-total/2;
  for(let i=0;i<items.length;i++){
    const[k,l]=items[i];
    rr(x,y-12,kws[i],22,6);
    ctx.fillStyle='rgba(140,170,230,0.13)';ctx.fill();
    ctx.strokeStyle='rgba(140,170,230,0.35)';ctx.lineWidth=1;rr(x,y-12,kws[i],22,6);ctx.stroke();
    ctx.fillStyle='#9fb4ff';ctx.font='600 13px '+F_MONO;ctx.textAlign='left';
    ctx.fillText(k,x+7,y+5);
    ctx.fillStyle='#6a78a0';ctx.font='500 14px '+F_UI;ctx.textAlign='left';
    ctx.fillText(l,x+kws[i]+6,y+5);
    x+=kws[i]+6+lws[i]+gap;
  }
}

      ['HAPTICS',store.hap?'ON':'OFF'],['TILT',tiltLabel],['PHYSICS',PHYS.label],
      ...(store.physics==='arcade'?[['TABLE ANGLE',''+store.angle+' ('+(700+(store.angle-1)*100)+' px/s²)']]:[]),

    rows.forEach((r,i)=>{const y=optRowY(i),sel=i===optIdx;
      if(sel){ctx.fillStyle='rgba(63,208,255,0.12)';rr(px+70,y-28,pw-140,54,12);ctx.fill();
        ctx.fillStyle='#3fd0ff';rr(px+70,y-28,5,54,3);ctx.fill();
        ctx.strokeStyle='rgba(120,200,255,0.3)';ctx.lineWidth=1.5;rr(px+70,y-28,pw-140,54,12);ctx.stroke();}
      ctx.textAlign='left';ctx.fillStyle=sel?'#ffca6a':'#8fa0c8';ctx.font='600 20px '+F_UI;
      ctx.fillText(r[0],px+96,y+7);
      if(i===rows.length-1){
        // BACK — action button
        ctx.textAlign='center';
        if(sel){ctx.fillStyle='rgba(255,122,42,0.16)';rr(px+pw/2-80,y-18,160,38,19);ctx.fill();}
        ctx.fillStyle=sel?'#ffca6a':'#b7c4e6';ctx.font='600 18px '+F_UI;
        ctx.fillText('←  BACK',px+pw/2,y+6);
      }else{
        ctx.textAlign='right';ctx.font='700 18px '+F_MONO;
        const val=r[1],vw=ctx.measureText(sel?'< '+val+' >':val).width;
        ctx.fillStyle=sel?'rgba(63,208,255,0.16)':'rgba(120,150,210,0.08)';
        rr(px+pw-100-vw-14,y-16,vw+28,32,8);ctx.fill();
        ctx.fillStyle=sel?'#3fd0ff':'#dfe8ff';
        ctx.fillText(sel?'< '+val+' >':val,px+pw-100,y+7);
      }});
    if(optIdx===5){
      const descs={atari:'📺  1980 cartridge feel — floaty, springy, arcade-faithful',
        arcade:'🎯  Real-machine simulation — weighty, precise, pro controls',
        superball:'🔥  Maximum chaos — low gravity, wild bounces, pinball anarchy'};
      ctx.textAlign='center';ctx.font='500 italic 14px '+F_UI;
      ctx.fillStyle='rgba(180,210,255,0.75)';
      ctx.fillText(descs[store.physics]||'',W/2,optRowY(5)+38);
    }
    drawKeyHints([['↑↓','SELECT'],['←→','CHANGE'],['BACKSPACE','BACK']],py+ph-44);
  }else if(state===S.SCORES){
    store.scores.forEach((s,i)=>{const y=py+180+i*60;
      if(i<3){ctx.fillStyle=i===0?'#ffd23a':i===1?'#c8d6e8':'#d08a4a';
        ctx.beginPath();ctx.arc(px+116,y-14,12,0,6.28);ctx.fill();
        ctx.fillStyle='#0d1020';ctx.font='700 13px '+F_MONO;ctx.textAlign='center';
        ctx.fillText(String(i+1),px+116,y-9);}
      ctx.textAlign='left';ctx.fillStyle=i===0?'#ffca6a':'#b7c4e6';ctx.font='600 19px '+F_UI;
      ctx.fillText(store.names[i],px+150,y);
      ctx.textAlign='right';ctx.fillStyle=i===0?'#ffca6a':'#8fa0c8';ctx.font='700 19px '+F_MONO;
      ctx.fillText(String(s).padStart(7,'0'),px+pw-100,y);});
    drawKeyHints([['ENTER','RETURN']],py+ph-44);
  }else if(state===S.HELP){
    const ss=PHYS.skillShot,fmt=p=>{const s=(''+p).replace(/0+$/,'').replace(/\.$/,'');return s.indexOf('.')<0?s+'.0':s;};
    const L=[['FLIPPERS','← → · A D · touch corners'],      ['PLUNGER','HOLD ↓ / S — release to fire'],
      // Plunger meter — read the power ring beside the plunger while you charge:
      // soft zone (ball rolls back), white into-play tick, gold skill-shot band
      ['PLUNGER METER','power ring · white tick = in play · gold = SKILL band'],
      ['PLUNGER ZONES','white tick = in play · below rolls back'],
      ['SKILL SHOT',PHYS.label+' · '+fmt(ss.min)+'–'+fmt(ss.max)+' · +5000 · live till first touch'],
      ['NUDGE','SHIFT+← → ↑ ('+[7,5,3][store.tilt-1]+' fast = TILT!)'],      ['PAUSE','ESC / P'],['SAVE','S while paused'],['MUTE','M'],['BUMPER','100 × value (1-9)'],
      ['DROP TARGET','100 · all 3 = value +1'],['LEFT LANE','100 · drain pays ×1000 (max 4)'],
      ['ATARI LANE','100 · +1 BONUS · 4 = EXTRA BALL'],['SPINNER','1 pt'],
      ['SPECIAL','500 · LIT 1000/2500/5000'],
      ['',''],
      ['DIFFICULTY A','adds 2 drain holes · score rolls at 1M'],['TILT','flippers freeze · no scoring · no bonus']];
    ctx.textAlign='left';let yy=py+148;
    for(const[k,v]of L){if(!k){yy+=10;continue;}
      ctx.fillStyle='#ff8a3a';ctx.font='700 17px '+F_UI;ctx.fillText(k,px+110,yy);
      ctx.fillStyle='#b7c4e6';ctx.font='500 14px '+F_UI;ctx.fillText(v,px+312,yy);yy+=38;}
    drawKeyHints([['ENTER','RETURN']],py+ph-44);
  }
}
function panelTitle(){if(state===S.MENU)return'MAIN MENU';if(state===S.OPTS)return'OPTIONS';if(state===S.SCORES)return'HIGH SCORES';return'HOW TO PLAY';}

function drawPause(){
  ctx.fillStyle='rgba(5,7,16,0.8)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(W/2-190,H/2-54+6,380,108,16);ctx.fill();
  const g=ctx.createLinearGradient(0,H/2-48,0,H/2+54);g.addColorStop(0,'#1a1e33');g.addColorStop(1,'#0d1020');
  ctx.fillStyle=g;rr(W/2-190,H/2-54,380,108,16);ctx.fill();
  ctx.strokeStyle='rgba(140,180,255,0.25)';ctx.lineWidth=1.5;rr(W/2-190,H/2-54,380,108,16);ctx.stroke();
  // "PAUSED" — brief symmetric settle, the same mirrored-animation convention
  // as the GAME OVER score: each letter squashes in (easeOutBack, 0→~1.1→1)
  // staggered by mirror index md=|d-2.5| so pairs (0↔5, 1↔4, 2↔3) settle in
  // lockstep, emanating from the middle outward. Each letter sits at its real
  // proportional advance (measureText), so the centred label never shifts.
  ctx.textAlign='center';ctx.fillStyle='#ffe9c0';ctx.font='800 42px '+F_DISP;
  const pw='PAUSED',pwd=[];let pTot=0;
  for(let i=0;i<pw.length;i++){const w=ctx.measureText(pw[i]).width;pwd.push(w);pTot+=w;}
  const pAge=Game._pauseT?(performance.now()-Game._pauseT)/1000:9;
  let pSx=W/2-pTot/2;
  for(let d=0;d<6;d++){
    const p=Math.min(1,Math.max(0,(pAge-Math.abs(d-2.5)*0.11)/0.4));
    const tt=p-1,cc=1.70158,e=1+tt*tt*((cc+1)*tt+cc);
    const pCx=pSx+pwd[d]/2;
    ctx.save();ctx.translate(pCx,H/2-10);ctx.scale(1,Math.max(0.001,e));
    ctx.fillText(pw[d],0,0);ctx.restore();
    pSx+=pwd[d];
  }
  ctx.fillStyle='#8fa0c8';ctx.font='500 14px '+F_UI;
  ctx.fillText('GAME KEEPS SAVING — AUTO-SAVE EVERY 10s',W/2,H/2+24);
  drawKeyHints([['ESC','RESUME'],['S','SAVE'],['ENTER','MENU'],['M','MUTE']],H/2+58);
}
function drawTally(){
  const t=Game.tally;if(!t)return;
  const cx=PF.x+PF.w/2, cy=PF.y+PF.h*0.5, now=performance.now()/1000;
  // Full-screen darken for clean tally overlay
  const pulse=0.72+0.06*Math.sin(now*3);
  ctx.fillStyle='rgba(4,6,16,'+pulse.toFixed(2)+')';ctx.fillRect(0,0,W,H);
  // "BONUS PAYOUT" header with glow
  ctx.textAlign='center';
  const hdrAlpha=0.75+0.25*Math.sin(now*2.5);
  ctx.globalAlpha=hdrAlpha;
  ctx.fillStyle='#ffd23a';ctx.font='800 30px '+F_DISP;
  ctx.fillText('BONUS PAYOUT',cx,cy-172);ctx.globalAlpha=1;
  // Calculation breakdown — use stored values since Game.leftRoll may have reset
  const lv=Math.min(t.base/1000,4), bm=t.mult;
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(cx-200,cy-146,400,52,12);ctx.fill();
  ctx.fillStyle='#8fb0ff';ctx.font='700 18px '+F_MONO;
  ctx.fillText('LEFT LANE  ×  '+lv+'  =  '+lv*1000, cx, cy-118);
  ctx.fillStyle='#ff7d2a';ctx.font='700 18px '+F_MONO;
  ctx.fillText('BONUS  ×  '+bm+'  =  '+lv*1000*bm, cx, cy-86);
  // Divider line
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx-120,cy-68);ctx.lineTo(cx+120,cy-68);ctx.stroke();
  // Animated score counter with digit roll
  const s=String(Math.floor(t.paid)).padStart(6,'0');
  for(let d=0;d<6;d++){
    const dx=cx-72+d*29;
    const digit=parseInt(s[d]);
    // Digit background
    ctx.fillStyle='rgba(0,0,0,0.5)';rr(dx-10,cy-45,23,44,4);ctx.fill();
    // Rolling digits — show a flash of the previous value for motion feel.
    // All three digit animations use a phase symmetric about the row's centre
    // (md=|d-2.5|), so mirror pairs (0↔5, 1↔4, 2↔3) pulse in lockstep and the
    // ripple emanates from the middle outward instead of sweeping left→right.
    const md=Math.abs(d-2.5);
    const roll=(t.t<0.8)?(Math.sin(now*18+md*3.4)>0?9:0):0;
    if(roll&&t.paid>0){
      ctx.fillStyle='rgba(255,122,42,0.3)';ctx.font='800 34px '+F_MONO;
      ctx.fillText(String((digit+9)%10),dx+2,cy-10);
    }
    // Current digit
    const bright=roll?1:(0.85+0.15*Math.sin(now*3+md*1.4));
    ctx.fillStyle='rgba(255,122,42,'+bright.toFixed(2)+')';ctx.font='800 34px '+F_MONO;
    ctx.fillText(String(digit),dx+2,cy-10);
    // Digit underline glow
    ctx.fillStyle='rgba(255,210,58,'+(0.3+0.3*Math.sin(now*4+md*2)).toFixed(2)+')';
    ctx.fillRect(dx-8,cy+8,20,3);
  }
  // Progress bar under digits
  const frac=t.paid/Math.max(1,t.total);
  ctx.fillStyle='rgba(0,0,0,0.4)';rr(cx-100,cy+22,200,10,5);ctx.fill();
  const pbg=ctx.createLinearGradient(cx-100,0,cx+100,0);
  pbg.addColorStop(0,'#3fd0ff');pbg.addColorStop(0.5,'#ffd23a');pbg.addColorStop(1,'#ff7d2a');
  ctx.fillStyle=pbg;rr(cx-98,cy+24,196*frac,6,3);ctx.fill();
  // "TOTAL" label when complete
  if(t.paid>=t.total&&t.t>0.8){
    ctx.fillStyle='#ffd23a';ctx.font='800 20px '+F_MONO;
    ctx.fillText('TOTAL: '+String(t.paid).padStart(6,'0'),cx,cy+70);
  }
}
function drawGameOver(){
  ctx.fillStyle='rgba(5,7,16,0.9)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='900 56px '+F_DISP;ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillText('GAME OVER',W/2+3,H*0.30+3);
  ctx.fillStyle='#ff7d2a';ctx.fillText('GAME OVER',W/2,H*0.30);
  // Score digits — brief symmetric roll-in: each digit settles in with a
  // slot-reel squash (easeOutBack, 0→~1.1→1) staggered by the mirror index
  // md=|d-2.5|, so mirror pairs (0↔5, 1↔4, 2↔3) animate in lockstep, the
  // ripple emanating from the middle outward — the same mirrored-animation
  // convention as the TALLY digit ripples. Each digit is placed at its real
  // proportional advance (measureText), so the centred layout never shifts.
  ctx.font='800 40px '+F_DISP;ctx.textAlign='center';
  const sc=String(Game.scores[Game.cur]).padStart(6,'0');
  const wds=[];let tot=0;
  for(let i=0;i<6;i++){const w=ctx.measureText(sc[i]).width;wds.push(w);tot+=w;}
  const age=Game._goT?(performance.now()-Game._goT)/1000:9;
  let sx=W/2-tot/2;
  for(let d=0;d<6;d++){
    const p=Math.min(1,Math.max(0,(age-Math.abs(d-2.5)*0.11)/0.4));
    const tt=p-1,cc=1.70158,e=1+tt*tt*((cc+1)*tt+cc);
    const cx=sx+wds[d]/2;
    ctx.save();ctx.translate(cx,H*0.40);ctx.scale(1,Math.max(0.001,e));
    ctx.fillStyle='#ffe9c0';ctx.fillText(sc[d],0,0);ctx.restore();
    sx+=wds[d];
  }
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(W/2-90,H*0.48-22,180,34,17);ctx.fill();
  ctx.fillStyle='#3fd0ff';ctx.font='700 16px '+F_UI;ctx.fillText('RANK: '+Game.rank,W/2,H*0.48+5);
  if(state===S.ENTRY){
    ctx.fillStyle='#ffe9c0';ctx.font='700 22px '+F_UI;ctx.fillText('NEW HIGH SCORE — ENTER INITIALS',W/2,H*0.60);
    const blink=Math.floor(performance.now()/350)%2===0;let x=W/2-64;
    for(let i=0;i<3;i++){
      rr(x,H*0.64-30,44,44,10);
      ctx.fillStyle='rgba(20,26,48,0.9)';ctx.fill();
      ctx.strokeStyle=i===Game.entryBuf&&blink?'#ff7d2a':'rgba(140,180,255,0.4)';ctx.lineWidth=2;
      rr(x,H*0.64-30,44,44,10);ctx.stroke();
      ctx.fillStyle=Game.entryChar[i]===' '?'rgba(140,160,200,0.4)':'#ffe9c0';
      ctx.font='800 24px '+F_DISP;ctx.fillText(Game.entryChar[i],x+22,H*0.64+8);x+=52;}
    drawKeyHints([['A–Z','TYPE'],['ENTER','NEXT'],['ENTER ×3','DONE']],H*0.72);
    if(!Game.entryTimer)Game.entryTimer=performance.now();if(performance.now()-Game.entryTimer>6000)commitEntry();
  }else{ctx.fillStyle='#8fa0c8';ctx.font='500 15px '+F_UI;ctx.fillText('PRESS FIRE FOR TITLE',W/2,H*0.62);}
}
function commitEntry(){if(Game.entryRank>=0){store.names[Game.entryRank]=Game.entryChar.join('');saveStore();}
  Game.entryRank=-1;Game.entryTimer=0;Game._goT=performance.now();state=S.GAMEOVER;}
window.addEventListener('keydown',e=>{if(state!==S.ENTRY)return;
  if(e.key==='Enter'||e.key===' '){if(Game.entryBuf<2)Game.entryBuf++;else commitEntry();Game.entryTimer=performance.now();}
  const k=e.key.toUpperCase();if(k>='A'&&k<='Z'&&k.length===1){Game.entryChar[Game.entryBuf]=k;
    if(Game.entryBuf<2)Game.entryBuf++;Game.entryTimer=performance.now();}});

/* =====================================================================================
   MAIN LOOP
   ===================================================================================== */
let last=0,acc=0;
function frame(now){requestAnimationFrame(frame);if(!last)last=now;let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;padPoll();acc+=dt;const STEP=1/120;
  while(acc>=STEP){tick(STEP);acc-=STEP;}draw();}
function tick(dt){
  if(state===S.TITLE){if(!demoMode||!Game.ball)startDemo();demoStep(dt);}
  if(state===S.PLAY||state===S.LAUNCH){plungerStep(dt);nudgeStep(dt);specialStep(dt);
    if(state===S.PLAY){let n=Math.ceil(dt/SUB_DT);const sub=dt/n;
      for(let i=0;i<n;i++){        if(Game.ball&&Game.ball.live)physStep(sub);else break;}
      // Ball-save grace timer — counts down after launch
      if(Game.ballSaveTimer>0){Game.ballSaveTimer-=dt;if(Game.ballSaveTimer<=0)Game.ballSaveTimer=0;}
      // Skill-shot chance clock — the armed chance resolves on collect,
      // first touch, or this timeout; the clock dies with the chance.
      if(Game.skillShotT>0){Game.skillShotT-=dt;if(Game.skillShotT<=0){Game.skillShotT=0;Game.skillShotReady=false;}}
      if(!Game.skillShotReady)Game.skillShotT=0;
      // Auto-save every 10s as crash fallback
      Game.autoSaveTimer-=dt;
      if(Game.autoSaveTimer<=0){Game.autoSaveTimer=10;saveGame(true);}
      }
    else{
      // LAUNCH — the bats answer the buttons while you aim. Animation only:
      // the ball is not on the playfield yet, so no collision pass runs here.
      flipperAnimate(FL.l,dt);flipperAnimate(FL.r,dt);
      // Solenoid click on each press edge (the contact-driven flip sound can't
      // fire without a ball on the playfield; a tilted machine is dead silent).
      if(input.lFlip&&!Game._lfEdge){Game._lfEdge=true;if(!Game.tilt){AudioSys.flip();haptic(25,0.4);}}
      else if(!input.lFlip)Game._lfEdge=false;
      if(input.rFlip&&!Game._rfEdge){Game._rfEdge=true;if(!Game.tilt){AudioSys.flip();haptic(25,0.4);}}
      else if(!input.rFlip)Game._rfEdge=false;
    }
  }else if(state===S.TALLY){tallyStep(dt);}
  // Particles age in every state (incl. the LAUNCH animation) so the launch
  // trail fades naturally instead of freezing until the ball goes live.
  pfxStep(dt);
  if(Game.shakeT>0)Game.shakeT-=dt;
  if(Game.pfx.length>400)Game.pfx.splice(0,Game.pfx.length-400);
}
touchInit();requestAnimationFrame(frame);

function cleanExit(){try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}}
addEventListener('pagehide',cleanExit);addEventListener('beforeunload',cleanExit);
window.Game=Game;window.S=S;window.stateRef={get:()=>state,set:v=>state=v};
window.launchBall=launchBall;window.uiConfirm=uiConfirm;window.uiMove=uiMove;
window.input=input;window.FL=FL;window.addScoreFlat=addScoreFlat;
initTiltBob();
</script>
