/* V76: Anton by Vernon Adams (SIL OFL 1.1, bundled per the license's terms) rides in as a data-URI so the SKYDRIFT marquee and the canvas banners render in the same heavy condensed display face on EVERY machine — no Impact, no network: the file stays single-file and offline. The face is declared as a weight range (100 900) so the 900 logo and the canvas 'bold' (700) requests all match the single face with NO faux-bold synthesis (the V70–V72 sharpness arc must not be re-fuzzed); glyphs the latin subset lacks (⚠) fall back per-glyph down the stack. */

/* === Mobile landscape rotate prompt (portrait touch only) === */
#rotate-prompt{display:none;position:fixed;inset:0;z-index:99999;background:#05050f;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;font-family:'Courier New',monospace}
#rotate-prompt .icon{font-size:60px;animation:rot-hint 2s ease-in-out infinite}
#rotate-prompt .msg{font-size:16px;letter-spacing:1px;max-width:280px;line-height:1.5}
#rotate-prompt .sub{font-size:12px;color:#9fc2e0}
@keyframes rot-hint{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (hover:none) and (pointer:coarse) and (max-width:767px){
  #rotate-prompt{display:flex!important}
  body>*:not(#rotate-prompt){visibility:hidden}
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05050f;overscroll-behavior:none}
body{font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#fff}
canvas{display:block;cursor:crosshair;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:6px calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));display:flex;justify-content:space-between;color:#fff;font-size:13px;z-index:10;pointer-events:none;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,1px 1px 2px #000}   /* V70: the HUD keeps contrast with a SHARP 1px black outline — the 6px color glow that fuzzed it is gone */
#hud span{margin:0 8px}
.hi{color:#ffcc44}.hw{color:#44ffaa}.hl{color:#ff5577}.hb{color:#55aaff}.hp{color:#ff88ff}.hwpn{color:#ffee44;font-size:10px;letter-spacing:2px;min-width:52px;display:inline-block;text-align:right}
.hwk{color:#9fc2e0;font-size:9px;letter-spacing:1px;margin-left:8px}   /* V100: the DESTROY k/n readout — dimmer than the wave number so the wave stays the headline; the number ticks up per kill */
.hvr{color:#ff8866;font-size:10px;letter-spacing:1px}   /* V31: the BOSS RUSH HUD badge · V70: no glow — the badge inherits the HUD's sharp outline */
.hchg{color:#7df2ff;font-size:10px;letter-spacing:1px}
.hchg.ready{color:#ffd75e}   /* V29: gauge >=75% — the OVERDRIVE tier is armed · V70: color alone carries the tier, no glow */
.hchg.full{color:#ffcc44;animation:bl .5s steps(2,start) infinite}   /* V70: the full-gauge blink stays — the 10px glow is gone */
#hud .hv{color:#55aaff;display:none}
#hud .hv.on{display:inline}

/* Boss health bar */
#bossbar{position:fixed;top:44px;left:50%;transform:translateX(-50%);width:min(520px,72vw);z-index:11;display:none;pointer-events:none}
#bossbar .bbn{text-align:center;font-size:10px;letter-spacing:4px;color:#ff88aa;margin-bottom:3px;animation:bl 0.8s steps(2,start) infinite}   /* V70: boss-name glow removed — the blink still reads as a warning */
.bbw{height:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,120,160,.35);border-radius:4px;overflow:hidden}
#bbf{height:100%;width:100%;background:linear-gradient(90deg,#ff4466,#ffcc44);box-shadow:0 0 10px rgba(255,80,100,.7);transition:width .12s linear}

/* CRT scanline + vignette overlay */
#crt{position:fixed;inset:0;pointer-events:none;z-index:90;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0px,rgba(0,0,0,.12) 1px,transparent 2px,transparent 3px);}   /* V71: scanlines halved (.22→.12) — over large text the 3px stripes shimmered into perceived blur; the texture stays, the moiré goes */
#crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);mix-blend-mode:normal}

#overlay{position:fixed;inset:0;background:rgba(5,5,16,.9);display:none;flex-direction:column;align-items:center;z-index:100;color:#fff;text-align:center;padding:12px;overflow:auto}   /* V71 review: 20→12px — the new menu card ate the zero-overflow headroom on desktop */
#overlay::before,#overlay::after{content:"";display:block;margin:auto}   /* center when short, but never clip the top when content overflows (flex-center + overflow bug) */
#overlay.show{display:flex}
#overlay.title{background:rgba(4,4,14,.46)}   /* V44: lighter dim so the attract-mode demo gameplay shows through — the arcade look */
#overlay.over{background:rgba(5,5,16,.93)}
#overlay.pause{background:rgba(5,5,16,.8)}
#overlay h1{font-size:clamp(28px,6vw,56px);letter-spacing:5px;margin-bottom:16px;line-height:1}   /* V69: clamp() keeps the header proportional and stops the 72px billboard · V78: the cap rises to 56px — the logo is the hero of a title screen — and margin-bottom:16px clears the V77 slab's 12px diagonal extrusion (the slab was overlapping the subtitle) */
.tg{color:#ffd64d;font-family:'Anton',Impact,'Arial Black','DejaVu Sans','Liberation Sans','Noto Sans',sans-serif;font-weight:900;text-transform:uppercase;-webkit-text-stroke:1px rgba(255,248,220,.9);text-shadow:-2px -2px 0 rgba(6,6,18,.92),2px -2px 0 rgba(6,6,18,.92),-2px 2px 0 rgba(6,6,18,.92),2px 2px 0 rgba(6,6,18,.92),1px 2px 0 #2a1e0c,2px 4px 0 #251a0a,3px 6px 0 #201609,4px 8px 0 #1b1207,5px 10px 0 #160e05,6px 12px 0 #120b04;animation:tgp 3.2s ease-in-out infinite;position:relative}   /* V77: the marquee is a TRUE 3D block — the pinned 2px outline stays, but the two timid depth layers become a 6-step DIAGONAL slab (x grows with y: 1,2 → 6,12) shading #2a1e0c→#120b04, so the extrusion reads as the block's side face, not a drop-shadow bar; a 1px light inner rim (-webkit-text-stroke) makes the front face read lit from above. All 0-blur, transform-only float — the V70 sharpness arc survives. · V79: position:relative anchors the ::after shine layer. */
@keyframes tgp{0%,100%{transform:translateY(0) scaleX(.9)}50%{transform:translateY(-2px) scaleX(.9)}}   /* V72: the float condenses the glyphs 10% (Impact-like silhouette) — still transform-only, so it never blurs */
@supports ((-webkit-background-clip:text) or (background-clip:text)){.tg::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;color:transparent;background:linear-gradient(105deg,transparent 0%,transparent 47%,rgba(255,246,205,.85) 50%,transparent 53%,transparent 100%);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;animation:tgs 5s ease-in-out infinite}}   /* V79: the marquee shimmer — a soft warm band sweeps the GLYPH FACES ONLY (background-clip:text clips to the ::after's own text, so the slab and outline stay on the parent), riding a 280%-wide gradient animated purely on background-position: 0-blur, transform-free, the tgp float still drives all motion. @supports guards the degradation path: no clip support = no shine layer, never a transparent-text rectangle. */
@keyframes tgs{0%{background-position:130% 0}60%,100%{background-position:-40% 0}}   /* V79: the sweep crosses the full title then rests ~2s — slow, arcade-marquee, no strobing */
@media (prefers-reduced-motion:reduce){.tg::after,.tg,.ps,.streak,.dlycta,.br,.ag,.nv,.dl,.newhi{animation:none}}   /* V79: motion-sick players see a static gold title — the shine AND the float freeze (the blink is opacity-only, motion-safe, and stays) */
.tr{color:#ff3355;font-family:'Anton',Impact,'Arial Black','DejaVu Sans','Liberation Sans','Noto Sans',sans-serif;font-weight:900;text-transform:uppercase;-webkit-text-stroke:1px rgba(255,180,195,.35);text-shadow:-1px -1px 0 rgba(6,6,18,.9),1px -1px 0 rgba(6,6,18,.9),-1px 1px 0 rgba(6,6,18,.9),1px 1px 0 rgba(6,6,18,.9),1px 2px 0 #3a0a12,2px 4px 0 #32080f,3px 6px 0 #2a060c,4px 8px 0 #22050a}   /* V77: GAME OVER joins the 3D-block treatment — same diagonal-slab recipe as the logo, scaled to its 1px outline (deep red → near-black, the boss-run red against the slate) */

.grade{font-size:clamp(30px,7vw,46px);font-weight:900;font-family:'Anton',Impact,'Arial Black','DejaVu Sans','Liberation Sans','Noto Sans',sans-serif;letter-spacing:4px;line-height:1;margin:4px 0 10px;text-transform:uppercase;-webkit-text-stroke:1px rgba(255,250,220,.25);text-shadow:-1px -1px 0 rgba(6,6,18,.9),1px -1px 0 rgba(6,6,18,.9),-1px 1px 0 rgba(6,6,18,.9),1px 1px 0 rgba(6,6,18,.9),1px 2px 0 #262140,2px 4px 0 #201c38,3px 6px 0 #1a1730,4px 8px 0 #141127}   /* V69: the RANK letter breathes · V70: no glow · V80: joins the block identity — Anton 900 + the same diagonal-slab recipe as .tg/.tr, in a neutral slate so the extrusion reads under every grade color (S gold / A green / B blue / C purple / D grey), plus a faint warm rim */

.ps{font-size:24px;color:#6EE200;letter-spacing:5px;margin-top:6px;font-family:'Anton',Impact,'Arial Black','DejaVu Sans','Liberation Sans','Noto Sans',sans-serif;font-weight:900;text-shadow:-2px -2px 0 rgba(6,6,18,.95),2px -2px 0 rgba(6,6,18,.95),-2px 2px 0 rgba(6,6,18,.95),2px 2px 0 rgba(6,6,18,.95);animation:br 2.8s ease-in-out infinite}   /* V44: the arcade PRESS START beacon · V70: no glow · V78: 1px outline · V81: the green deepens a notch (#6EE200) and the outline thickens to a fully-opaque 2px — the skill's 2px contrast floor, so the beacon stays razor-crisp at full brightness on any panel; the 1↔0 blink becomes a slow 2.8s breathing dim (never disappears) */

.pshint{font-size:9px;color:#7d90aa;letter-spacing:2px;margin:0 0 2px;font-weight:bold}   /* V44: the fine print under PRESS START · V71: brightened · V82: bold for readability at 9px · V85: 2/5→0/3 · V89: 3→2 — fold budget */
.ccols{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;margin-top:3px;align-items:start}   /* V98: column gap 26→14px and top margin 6→3px — at 390–400px the two 1fr columns each gain ~6px, keeping the long key chips (← → ↑ ↓ / WASD) on one line so the sheet doesn't wrap taller */   /* V88: the control sheet is two side-by-side tables — KEYBOARD left, GAMEPAD right — so the sheet scans like a real arcade control card instead of one long wall of rows. align-items:start: the 5-row GAMEPAD table must not stretch to the 10-row KEYBOARD's height (the default stretch left ~140px of dead space under GAMEPAD) */

/* ============ V69: TITLE OVERHAUL — menu column + tabbed info rail ============
   Research: shmup titles (R-Type, Gradius, Ikaruga) keep the first screen to
   logo → menu → footer and push reference content (controls, boards) behind it.
   V69 splits the title into a compact menu column (logo, PRESS START, mode stack)
   and a tabbed info rail (SCORES / DAILY / CONTROLS) that sits beside it on
   desktop and below it on phones — no more one-mile scroll, no lost info. */
.t-shell{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(14px,3vw,34px);width:min(1120px,100%);align-items:start;text-align:center}
.t-main{display:flex;flex-direction:column;align-items:center;min-width:0;background:rgba(4,4,14,.62);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 20px 6px}   /* V71: a dark backing plate gives the gold/cyan title text a consistent floor — it no longer fights the bright attract-demo pixels behind it (high-contrast backgrounds were blurring small text) · V71 review: 18/14→12/10 · V85: 12/10→8/6 — fold budget (the 720p card was ~48px over and the shell's clip was hiding it) */
.t-menu{display:flex;flex-direction:column;align-items:stretch;gap:3px;margin:2px 0 2px;width:min(100%,380px)}   /* V71 review: margin 8→5 to hold the zero-overflow fit · V85: gap 6→4 and margin 5→3 · V89: gap 4→3 (between cells — the ring is absorbed by each cell's own sub) and margin 3→2 — fold budget */
.t-menu button{width:100%;padding:12px 26px;font-size:15px}   /* V69: one vertical stack of full-width mode buttons — the arcade 1P/2P/OPTIONS column, touch-friendly 40px+ targets · V89: 13→12 — fold budget (the ring is absorbed by each cell's sub, not the button padding) */
.t-menu .mwrap:first-child button{padding:14px 32px;font-size:16px}   /* V69 review: the hero keeps real size — START GAME reads as the primary action even in the stack (the old .hero padding was overridden by the uniform stack rule) · V89: 15→14 — fold budget */
.mwrap{display:flex;flex-direction:column;align-items:center;gap:6px}   /* V82: the focus ring (2px outline + 2px offset) extends ~4px below each button — the old 2px gap let the white ring overlap the description text; 8px cleared it with air · V85: 8→6 (2px air) — the menu is the card's tallest column and 10px of its gap budget buys real fold headroom */
.msub{font-size:10px;color:#8fa3bd;letter-spacing:1px;line-height:1.3;font-weight:bold}   /* V69: one human line under each mode button · V71: brightened · V82: bold — the small mode descriptions carry more weight for easier reading */
.t-rail{display:flex;flex-direction:column;min-width:0;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 16px 14px}
/* V74: the two-zone shell is ONE composed card, not two floating boxes. The outer
   panel carries the chrome; the action column is a darker inner zone split from the
   reference rail by a hairline divider; the rail's inner boards lose their own box
   chrome so nothing reads nested/doubled. The base .t-shell/.t-main declarations stay
   untouched (harness-pinned) — these overrides layer the composition on top. */
#overlay .t-shell{background:rgba(10,10,26,.5);border:1px solid rgba(255,255,255,.1);border-radius:14px;gap:0;padding:0;overflow:hidden;align-items:stretch;flex-shrink:0}   /* V85: flex-shrink:0 — the shell is a flex item of the fixed-height overlay, and its own overflow:hidden zeroed its automatic minimum size, so when content outgrew the viewport the shell SHRANK and silently clipped the bottom (the version footer and the rail's boards were cut at 720p) while the overlay's scroll metrics stayed at "fits". With flex-shrink:0 a future overflow scrolls instead of clipping — and the layout QA can finally measure the truth. */
#overlay .t-main{background:rgba(3,3,12,.55);border:0;border-radius:0;border-right:1px solid rgba(255,255,255,.09)}
#overlay .t-rail{background:transparent;border:0;border-radius:0;padding:18px 22px}
#overlay .hs{background:transparent;border:0;padding:0;margin:0;min-width:0}
#overlay .t-rail .box{background:transparent;border:0;padding:0;margin:0;max-width:none}
#overlay .t-main .ver{margin-top:auto}   /* V74 review: the zones stretch to one card height — the SURVIVED / version footer pins to the zone bottom so the space reads as deliberate breathing room, not empty darkness */
#overlay.over .btns{margin:4px 0 8px}   /* V84: the keyboard focus ring (2px outline + 2px offset) extends ~4px below the PLAY AGAIN / MENU / INFO row — but the over screen's SURVIVED footer sits flush below at content height (0 slack, the auto-margin collapses), so the ring was eating the footer text. The row now funds its own clearance, V82-style: 8px below (4px air), with the top margin 8→4px and 2px each reclaimed from .stats/.share above — the card stays exactly the same height. */
@media (max-width:900px){#overlay .t-main{border-right:0}#overlay .t-rail{border-top:1px solid rgba(255,255,255,.09);padding:14px 16px}}   /* V74 review: stacked, the divider moves to the RAIL's top edge — when the short-screen rules hide the rail, the line vanishes with it (a t-main border-bottom would have left a stray double-line at the card edge) */
.tabs{display:flex;gap:6px;justify-content:center;margin:0 0 10px;flex-wrap:wrap}
.tb{padding:7px 18px;font-size:10px;letter-spacing:2px;border-radius:4px;background:rgba(255,255,255,.07);color:#88aacc;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.tb.on{background:linear-gradient(180deg,#ffcc44,#ee8800);color:#1a0800;box-shadow:0 3px 0 #996600}

.tpanel.show{display:block}

.newhi{color:#ffcc44;font-size:18px;font-weight:bold;letter-spacing:3px;margin-bottom:6px;animation:br 1.8s ease-in-out infinite}   /* V70: NEW HIGH SCORE — the 18px glow is gone · V81 review: the 0.5s hard strobe was the harshest blink in the game, on a screen the player stares at — it breathes now too (1.8s, never disappears); it's a celebration, not a warning */
/* initials entry */

.islot .ln{font-size:30px;font-weight:bold;color:#fff;width:44px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:rgba(0,0,0,.4)}   /* V70: the initial letters are clean — the 10px glow is gone */

.rclose{display:none;position:absolute;bottom:8px;right:10px;padding:2px 8px;font-size:10px;border-radius:4px;background:rgba(8,8,22,.9);color:#9db4d0;border:1px solid rgba(255,255,255,.18);z-index:7}   /* V93: the reopened-rail close button — hidden everywhere except the ≤430 full-viewport panel (the rail's absolute positioning is its containing block). Bottom-right: the tabs row owns the panel top, so a top-anchored ✕ overlapped it by 10px. The panel's 44px bottom padding keeps scrolled content clear of it; CONTROLS fits the panel today (no scroll). */

/* Short screens (≤430px tall, touch or not): the rail/boards collapse behind ℹ INFO so the menu and stats always fit the fold — V73 widened this from touch-only to height-only (a 360px-tall mouse window was overflowing 279px; the touch keyboard-hint rule below stays pointer-scoped) */
@media (max-height:430px){

  #overlay.title .t-rail{display:none}        /* V69: short touch screens collapse the info rail to keep the menu in the fold — the ℹ INFO button opens it */

  #infoBtn{display:inline-block}
  #overlay.title .t-rail.show{display:block}
  #overlay.over .t-rail.show{display:block}
  /* V93: the phone-ls reopened rail CANNOT stack below the menu — the menu alone is 341px of a 344px fold (0 slack at rest). So the reopened rail becomes a full-viewport panel, absolutely positioned over the menu (its containing block is the fixed #overlay, OUTSIDE the shell's overflow:hidden, so it can't be clipped) and scrolls inside itself. The shell never grows — the info-open state now reads the same ~3px slack as rest. The rail's own ✕ CLOSE button (added to both the title and over markup) dismisses it, since the menu's ℹ INFO button is covered underneath. */
  #overlay .t-rail.show{position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;overflow-y:auto;background:rgba(8,8,22,.97);padding:14px 16px 44px;border-top:0}   /* V93 review: bottom padding 16→44px — scrolled content must clear the floating bottom-right ✕ CLOSE (z:7), not hide behind it */
  #overlay .t-rail.show .rclose{display:inline-block}   /* V93: the close button only appears on the REOPENED full-viewport panel at ≤430px (hidden at base — desktop's always-visible rail must not carry it) */
  #overlay .t-rail.show .tabs{position:sticky;top:0;z-index:5;background:rgba(8,8,22,.98);padding:2px 0 8px;margin-bottom:2px}   /* V93 review: the tabs stay pinned at the panel top while CONTROLS scrolls beneath them */

  #overlay.over .btns{margin-top:2px;margin-bottom:0}   /* V84: on tiny landscape the SURVIVED footer is folded away — no ring to clear, so the bottom margin drops to keep the fold tight */
  .t-main{padding:4px 10px 0}   /* V71 review: the last few px — a 360px-tall phone sees the whole menu, no scroll · V85: bottom 2→0 — the honest content slack was -5px here; this closes it */
  .ps{margin-top:2px}   /* V91: 3→2 — funds the pill touch-target bump */
  .dif{margin:2px 0 3px}   /* V85: 3→2 — fold budget · V87: bottom 0→3 — with the ≤430 2px ring, 3px gap = 1px air */

  .t-menu{gap:3px;display:grid;grid-template-columns:1fr 1fr;width:min(100%,560px)}   /* V69: on tiny landscape the mode stack becomes a 2-up grid — hero spans the row, four modes fill two columns, the menu fits 360px-tall screens · V85: 4→3 — fold budget */

  .t-menu button{padding:7px 14px;font-size:12px}
  .msub{font-size:7px;line-height:1.25}
  button.kf{outline-width:1px;outline-offset:1px}   /* V87: the fold is too tight at ≤430px to give every ring 4px of clearance, so the ring itself compacts — 1px outline + 1px offset = 2px extent (the skill's small-screen rule), keeping the 20px glow. This frees the SHARE RUN → buttons gap (4px → 2px air), the ▲▼ steppers, and the settings-row ring with zero spacing cost. */
}
/* V92: narrow portrait windows (taller than wide) fold the rail too — the V73 "what can't fit, folds" rule extended to portrait aspect. At 500×700 the title already overflowed the fold by 21px with the rail visible, and every portrait over screen overflowed by 113–124px (the stats card + 268px reference rail simply cannot share a 700–844px tall column). The rail folds behind ℹ INFO exactly like the short-screen rule; real portrait phones never see this (the touch rotate-prompt covers them) — this serves desktop windows and tablets held in portrait. V97 widens the fold from ≤520px to ≤900px so ANY tall screen under 900px wide folds (768×1024 iPad portrait included): the 520<w≤900 portrait band was untested QA territory — at 646×700 the CONTROLS panel overflowed the fold by −459px, reachable only by scrolling the whole overlay (menu scrolls away with it). The reopened rail stays the same full-viewport panel; landscape phone-ls (740×360) and desktop/tablet (≥900 wide) are untouched. */
@media (max-width:900px) and (orientation:portrait){
  #overlay.title .t-rail{display:none}
  #overlay.over .t-rail{display:none}
  #infoBtn{display:inline-block}
  #overlay.title .t-rail.show{display:block}
  #overlay.over .t-rail.show{display:block}
  /* V95: the portrait OVER-screen reopened rail cannot stack below the stats card — at 400–500px wide the card + 268px reference rail overflow the 700–844px fold by −113/−124/−152px. Same V93 treatment: the reopened rail becomes a full-viewport panel, absolutely positioned over the card (its containing block is the fixed #overlay, OUTSIDE the shell's overflow:hidden, so it can't be clipped) and scrolls inside itself. The shell never grows — the over info-open state now reads the same positive slack as rest. The over rail's own ✕ CLOSE (bottom-right) dismisses it, since the card's ℹ INFO button is covered underneath. The TITLE rail at portrait stays KNOWN (the tall full-size menu can't share the column — a separate follow-up). */
  #overlay.over .t-rail.show{position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;overflow-y:auto;background:rgba(8,8,22,.97);padding:14px 16px 44px;border-top:0}   /* V95: same panel recipe as V93 — 44px bottom padding keeps scrolled content clear of the floating ✕ (z:7) */
  #overlay.over .t-rail.show .rclose{display:inline-block}   /* V95: the close button appears on the REOPENED portrait over panel (hidden at base — desktop's always-visible rail must not carry it) */
  /* V96: the portrait TITLE reopened rail gets the same panel — the last KNOWN
  overflow (info-open −692/−648/−541px at 400×800/390×844/500×700: the tall
  full-size menu can't share the column with the rail either). Same V93 recipe:
  the reopened rail becomes a full-viewport panel over the menu (absolute, its
  own scroll, near-opaque backdrop, ✕ CLOSE — the menu's ℹ INFO is covered
  underneath), with the tabs sticky at the panel top. The shell never grows, so
  the title info-open now reads the same positive slack as rest — and
  INFO_OPEN_FLOORS flips from KNOWN baselines to real exact pins (joining the
  over dict and the qa-drift.py guard). */
  #overlay.title .t-rail.show{position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;overflow-y:auto;background:rgba(8,8,22,.97);padding:14px 16px 44px;border-top:0}   /* V96: same panel recipe as V93/V95 */
  #overlay.title .t-rail.show .rclose{display:inline-block}   /* V96: the close button appears on the REOPENED portrait title panel */
  #overlay.title .t-rail.show .tabs{position:sticky;top:0;z-index:5;background:rgba(8,8,22,.98);padding:2px 0 8px;margin-bottom:2px}   /* V96: the title rail HAS tabs (SCORES/DAILY/CONTROLS) — sticky at the panel top while the CONTROLS panel scrolls, exactly like V93's ≤430 panel */
}
/* Very short screens (≤360px tall): shrink the touch buttons so they never crowd the play field */
@media (max-height:360px){
  /* plain px only: #touch's env() padding already insets the padding box the buttons position from */
  #btnFire{width:76px;height:76px;right:16px;bottom:78px;font-size:12px}

<body>
<div id="rotate-prompt">
  <div class="icon">📱</div>

</div>
<canvas id="C"></canvas>

  <div><span class="hi" id="sc">000000</span><span class="hv" id="grz">⚝0</span></div>   <!-- V88: the graze glyph was ✧ (U+2727), which Courier New doesn't ship — it rendered as a tofu box on the HUD. ⚝ (U+269D, outlined star) is in the face and reads as a sparkle. V90: this note was a bare // comment in the HTML BODY — HTML doesn't treat // as a comment, so it leaked onto the HUD as visible text; now a proper HTML comment. -->
  <div><span class="hw" id="wv">1</span><span class="hwk" id="wk"></span><span class="hvr" id="rushTag"></span></div>   <!-- V100: the wave-kills readout — DESTROY k/n makes the majority gate legible (hidden on boss waves, where the boss bar takes over) -->
  <div><span class="hl" id="lv">♥♥♥</span></div>
  <div><span class="hb" id="bm">★★</span></div>
  <div><span class="hwpn" id="wpn">VULCAN</span><span class="hp" id="pw">░░░░░</span><span class="hchg" id="chg">░░░░░</span></div>
</div>
<div id="bossbar"><div class="bbn" id="bbn">DREADNOUGHT</div><div class="bbw"><div id="bbf"></div></div></div>
<div id="msgs"></div>
<div id="overlay" class="show title"></div>
<div id="crt"></div>
<div id="touch">
  <div id="joy"><div id="joyThumb"></div></div>
  <button id="btnFire" class="tbtn">FIRE</button>
  <button id="btnBomb" class="tbtn">BOMB</button>
  <button id="btnWeapon" class="tbtn">WPN</button>
  <button id="btnPause" class="tbtn">II</button>
  <button id="btnSnd" class="tbtn">🔊</button>
</div>
<script>
var C=document.getElementById('C'),X=C.getContext('2d'),W,H;
var DPR=Math.max(1,typeof devicePixelRatio==='number'?devicePixelRatio:1);
function resize(){W=innerWidth;H=innerHeight;C.width=Math.floor(W*DPR);C.height=Math.floor(H*DPR);X.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener('resize',resize);
if(typeof addEventListener==='function')addEventListener('orientationchange',resize);
/* some hosts (iframes/preview panes) size the viewport after load without firing resize;
   poll until we have real dimensions so the game never boots into a 0x0 canvas */
(function(){var tries=0,iv=null;if(typeof setInterval==='function')iv=setInterval(function(){if(W&&H){if(iv!==null&&typeof clearInterval==='function')clearInterval(iv);return;}resize();if(++tries>60&&iv!==null&&typeof clearInterval==='function')clearInterval(iv);},120);})();

var GAME_TITLE='SKYDRIFT';
var HS_KEY='skyDriftHS';
var PLAYER_HIT=14, GRAZE_R=34;   // fairness: small hitbox + graze band
var CHG_MS=1000;                 // V27: charge-to-full time. Charging pauses fire, so 1.0s is the cost the burst must beat.
var PICKUP_MAGNET=90, MAG_FLAT=40, MAG_PULL=2.6;   // V67/V105: R-Type-style pickup magnet — within PICKUP_MAGNET px a pickup drifts toward the ship. V105 buff: reach 70->90px, and the pull is FLAT-FULL (MAG_PULL) inside MAG_FLAT px — anything right next to the ship is sucked in, then falls linearly to 0 at the rim. Max pull 2.6px/step stays below the ship's own 5.6 speed so drops never feel homing.
var RARITY={power:1,shield:1.25,w:1.25,bomb:1.75,life:1.75,mystery:2};   // V68: pickup rarity — bomb/life are the rarer drops, mystery the rarest. The multiplier scales the tile's shadowBlur glow AND gates the extra pulsing halo (>=1.6), so rare drops telegraph "worth dodging for" at a glance; common power keeps the plain glow

/* Overdrive burst tables — measured against a size-44 tank at 60fps in V26 (hold DPS at pw0→5:
   vul 23/23/42/78/90/114, laser 41/41/62/85/124/156, missile 12/12/16/35/45/57). The full-charge
   burst is tuned to ≈3x what holding fire deals during the 1s charge (the lost-damage cost), so
   releasing a full overdrive clearly beats holding — that's the decision. Release fill (0.5–1.0)
   scales the burst linearly. vul = center-cannon damage; the four wing bolts are small
   finishers at 7% of the CENTER each (wings ≈ 22% of the burst, cannon ≥ 75% — the V28
   identity lock makes the vul overdrive ONE tool: a tight boss-killer, not a formation-
   clearer too; the laser owns the line and the missile owns scatter). laser = damage per
   frame of the colossal beam, missile = damage per homing missile.

   V29: TWO release tiers. Releasing at 50–74.99% fires a FAST BURST — a FLAT half-strength
   version of the table (fill fixed at 0.5, independent of the exact gauge) with 32% faster
   projectiles and lighter feel (35ms hit-stop, shake 4). Releasing at >=75% fires the
   OVERDRIVE — fill-scaled (0.75–1.0) heavy hit (70ms hit-stop, shake 7).

   Rate curve (honest): the overdrive segment t∈[0.75,1.0] deals t×base over t seconds =
   base/s flat. The fast band t∈[0.5,0.75) is a flat 0.5×base deal — its rate (0.5/t)×base/s
   peaks at 1.0×base/s right at 0.5s and decays to ~0.67×base/s at 0.74s, so dithering
   mid-fast-band forfeits rate until the 75% line. That's the commitment pressure: tap-release
   early for a quick efficient burst, or commit to the 75% line for the heavy fill-scaled hit. */
var OD_BURST={vul:[46,46,92,184,212,272],laser:[6.5,6.5,10,13.5,19.5,24.5],missile:[3,3,4.6,13.3,18,23.3],spreader:[30,30,60,110,140,170]};
var OD_BOSS=2;   // V99/V108: the vul OVERDRIVE tier (release >= 75%) doubles its center-cannon damage while a boss is alive — the cannon is the designed boss-killer. V99 scoped it to DREADNOUGHT only; V108's audit measured the same grind on the other types (vortex@10: 1.57 full-OD cycles, mother@15: 2.47 at max power, 3.66 mid, 14.6 stock — vs dread's 0.5 after the buff), so the multiplier now applies to EVERY boss type (dread stays the tankiest via T.hp). Scoped hard: the FAST tier stays flat, the wings' 7% ratio scales with the center, no-boss holds are untouched, and the other weapons never change.
var SURGE_HARD=15000;   // V109: the HARD REBUILD-SURGE EXTENSION — the V107 surge runs 12s on EASY/NORMAL but 15s on HARD (the identity marker: SURGE_HARD exists only here). The wave-4 recovery playtest measured HARD's rebuild as ~19% slower than NORMAL with a 1-in-4 death-out (the ×1.35-HP wall outlasts the 12s surge), so the tankiest tier gets +3s of guaranteed-drop rebuild time to close that gap — the surge stays 12s everywhere else, and the drop diet (V108 power-skew) is untouched.
/* V30 SPREADER balance constants: SPR_BOLT is the per-bolt damage table of the lock-on fan
   (N=[1,2,3,3,4,4] bolts at 130ms fire rate — the all-rounder's single-target hold DPS is
   measured to sit between missile and vul so the weakest hold gun keeps the boss-killer
   overdrive). The spreader OVERDRIVE is CHAIN LIGHTNING: the table above is the FIRST-STRIKE
   damage; each subsequent hop deals 60% of the previous, arcing to the nearest unused enemy
   within CHAIN_R px (up to 3+min(pw,3) hops). Single-target it's a solid first hit; in a crowd
   it's the group-killer identity no other overdrive has. Design note: the chain only strikes
   the BOSS when no enemies remain (it's a crowd weapon — the vul/laser stay the boss tools),
   and hops only ever hit ENEMIES (never the boss a second time). */
var SPR_BOLT=[1,1,1,2,2,3],CHAIN_R=240,CHAIN_DECAY=.6;

/* ============ AUDIO (SFX + procedural chiptune) ============ */
var AC=null,MUS={on:false,step:0,nextT:0,timer:null,master:null,music:null,musicFilt:null,low:false,noise:null,track:'title',pending:null,tempo:140,tier:0,pInt:0,shim:0,shimT:0,_shimOn:false};
function initAudio(){
  if(AC)return;

function uid(){return (Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toUpperCase();}
function loadHS(){try{var a=JSON.parse(localStorage.getItem(HS_KEY)||'[]');if(!Array.isArray(a))a=[];var ch=false;for(var i=0;i<a.length;i++){if(!a[i].id){a[i].id=uid();ch=true;}if(!a[i].name)a[i].name='---';}if(ch)saveHS(a);return a;}catch(e){return[];}}
function saveHS(a){try{localStorage.setItem(HS_KEY,JSON.stringify(a.slice(0,5)));}catch(e){}}
function prepHS(score,wave){
  var entry={id:uid(),score:score,wave:wave,date:new Date().toISOString().slice(0,10),name:'---'};
  var list=loadHS().concat([entry]);
  list.sort(function(a,b){return b.score-a.score;});

  var rank=-1;for(var i=0;i<list.length;i++)if(list[i].id===entry.id){rank=i;break;}

}
function commitHS(entry){var a=loadHS();var found=false;for(var i=0;i<a.length;i++)if(a[i].id===entry.id){found=true;break;}if(!found){a.push(entry);a.sort(function(x,y){return y.score-x.score;});saveHS(a);}}

/* ============ V46: DAILY LEADERBOARD ============ */
/* A second high-score table that only accepts DAILY CHALLENGE runs — each entry is stamped
   with the seed + date it was played on, and the board shows only TODAY's seed's entries
   (yesterday's board naturally rolls off at midnight). Storage keeps the top 5 per seed, so
   old records aren't discarded until a better run or a newer seed pushes them out. */
var DL_KEY='skyDriftDaily';
function loadDaily(){try{var a=JSON.parse(localStorage.getItem(DL_KEY)||'[]');if(!Array.isArray(a))a=[];var ch=false;for(var i=0;i<a.length;i++){if(!a[i].id){a[i].id=uid();ch=true;}if(!a[i].name)a[i].name='---';if(typeof a[i].seed!=='number'||!isFinite(a[i].seed)){a[i].seed=0;ch=true;}if(!a[i].date)a[i].date='';}if(ch)saveDaily(a);return a;}catch(e){return[];}}
function saveDaily(a){   // the write boundary enforces top-5-per-seed and bounds history to the 30 most recent seeds (~150 entries max)
  try{
    var srt=a.slice().sort(function(x,y){return y.score-x.score;});
    var out=[],cnt={};for(var i=0;i<srt.length;i++){var s=srt[i].seed;cnt[s]=(cnt[s]||0)+1;if(cnt[s]<=5)out.push(srt[i]);}
    var seeds={},order=[];for(var j=0;j<out.length;j++){if(!seeds[out[j].seed]){seeds[out[j].seed]=true;order.push(out[j].seed);}}
    order.sort(function(a,b){return b-a;});   // seeds are YYYYMMDD — the largest are the most recent
    var keep={};for(var k=0;k<order.length&&k<30;k++)keep[order[k]]=true;
    localStorage.setItem(DL_KEY,JSON.stringify(out.filter(function(e){return keep[e.seed];})));
  }catch(e){}
}
function prepDaily(score,wave,seed){   // qualification vs TODAY's board (same shape as prepHS)
  var entry={id:uid(),score:score,wave:wave,seed:seed||0,date:new Date().toISOString().slice(0,10),name:'---'};
  var list=loadDaily().filter(function(e){return e.seed===entry.seed;}).concat([entry]);
  list.sort(function(a,b){return b.score-a.score;});list=list.slice(0,5);
  var rank=-1;for(var i=0;i<list.length;i++)if(list[i].id===entry.id){rank=i;break;}
  return {entry:entry,qualifies:rank>=0,rank:rank,top:list};
}
function commitDaily(entry){   // insert (if new); the per-seed top-5 + seed bound live in saveDaily
  var a=loadDaily(),found=false;for(var i=0;i<a.length;i++)if(a[i].id===entry.id){found=true;break;}
  if(!found)a.push(entry);
  saveDaily(a);
}
function nameDailyEntry(id,name){var a=loadDaily();for(var i=0;i<a.length;i++)if(a[i].id===id){a[i].name=name;}saveDaily(a);}

  assignFormation:function(){

  spawnBurst:function(){
    if(!this.fmtSet)this.assignFormation();   // safety net: a wave started without waveClear (direct state pokes)
    var f=this.fmt;
    var grp=Math.min(2+Math.ceil(this.wave/2),9);          // density escalates: 3@w1 → 9@w14+
    grp=Math.min(grp,this.waveTarget-this.eSpawned);       // never overshoot the wave's enemy count
    if(grp<=0)return;
    this.fmtY=(this.fmtY||0)+.28;if(this.fmtY>1)this.fmtY-=1;   // each squad sweeps a third of the screen lower
    var y0=60+this.fmtY*(H-120);
    var sm=(1+this.wave*.05)*this.difx.sp,G2=this;
    var sz=ETYPES[0].sz;
    function mk(x,y,vx,vy,mt,ph,ps,st,ti){
      var t=ETYPES[ti],hp=t.hp*G2.difx.hp*G2.waveHpMult();
      G2.enemies.push({x:x,y:y,vx:vx*sm,vy:vy,hp:hp,mhp:hp,sc:Math.round(t.sc*G2.waveScMult()),size:t.sz,c:t.c,sh:t.sh,sho:t.sho,ph:ph,ps:ps||.04+Math.random()*.04,mt:mt,st:st||(1400+Math.random()*1800)*G2.difx.fr,hf:0,eg:0,elite:t.sh==='elite'});
    }
    var i,k=(grp-1)/2,tp=f.tp;
    if(f.id==='v'){                       // chevron fanning back from center, sine wobble
      for(i=0;i<grp;i++)mk(W+sz+Math.abs(i-k)*26,y0+(i-k)*30,-(1+Math.abs(i-k)*.06),0,'sine',i*.5,0,0,tp[i%2]);
    }else if(f.id==='pincer'){            // two columns diving up/down, converging on the player's lane
      for(i=0;i<grp;i++){var j=Math.floor(i/2),top=i%2===0;
        mk(W+40+j*26,top?26+j*34:H-26-j*34,-(1+j*.03),top?.95:-.95,'straight',0,0,550,tp[i%2]);}
    }else if(f.id==='sinewall'){          // vertical wall, shared phase -> undulates in sync
      for(i=0;i<grp;i++)mk(W+sz+(grp-1-i)*8,y0+(i-k)*(H*.62/Math.max(grp,2)),-1,0,'sine',0,.06,0,tp[i%2]);
    }else if(f.id==='dive'){              // diagonal dive sweep, eager fire timers
      for(i=0;i<grp;i++)mk(W+sz+i*20,y0+i*24,-1.15,1.1,'straight',0,0,420,tp[i%2]);
    }else{                                // shield: two staggered rows of heavy/elite, slow
      for(i=0;i<grp;i++){var j2=Math.floor(i/2),row=i%2;
        mk(W+sz+row*30+j2*12,y0+(j2-(grp-1)/4)*34,-.55,0,'straight',0,0,900,(G2.wave>=8&&i%3===2)?5:tp[i%2]);}
    }
    this.eSpawned+=grp;
  },

  bannerFire:function(b,st){   // V75: banners fire on the AUDIO CLOCK — while the music scheduler runs, the announcement snaps to the next 16th-note boundary of the beat grid (the V57 stinger grid) and the fanfare's downbeat lands on that same beat; without a live grid (muted / no audio / harness / suspended context) it fires immediately. The wait is stored as b._at in sim-ms, which the V56 accumulator locks to real time (1.0x), so the banner reveals exactly when the scheduled notes sound.

  bossAt:function(w){var ti=Math.floor(w/5)-1,idx=((ti%3)+3)%3;if(this._bossOrder)idx=this._bossOrder[idx];return BOSS_TYPES[idx];},   // V34/V42: the 5/10/15 rotation, single-sourced — practice modes shuffle it via _bossOrder (campaign keeps the fixed order)
  makeRng:function(seed){   // V43: a mulberry32-style seeded LCG — the shared engine behind the daily seeds (deterministic in tests, and identical for every player on the same day)
    var s=(typeof seed==='number'?seed:Date.now()|0)>>>0;
    return function(){s=(s+0x6D2B79F5)|0;var x=Math.imul(s^(s>>>15),1|s);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296;};},
  dailySeed:function(date){   // V43: the day's seed — a UTC calendar date folded into one integer (YYYYMMDD). UTC so every player worldwide shares the same challenge day. Injectable date for tests
    var d=date||new Date();return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate();},
  seedDate:function(seed){   // V49: turn a YYYYMMDD seed into a human date (20260806 -> 2026-08-06) — players read a date, not a code

  buildDropTable:function(seed,len){   // V43: the day's precomputed power-up layout — one {n,t,e} roll triple per kill slot (n=drop roll, t=normal type roll, e=elite type roll), so the same kills yield the same drops for everyone

  permFor:function(seed){   // V43: the Fisher-Yates permutation of [0,1,2] — the ONE place the boss-order shuffle lives, shared by the run (shuffleBosses) and the title preview (dailyOrderNames) so they can never drift apart. Seeded (makeRng) for determinism; unseeded Math.random in real practice runs
    var p=[0,1,2],r=typeof seed==='number'?this.makeRng(seed):Math.random,i,j,t;

  shootSpreader:function(pw){

  fireOverdrive:function(c){
    // released charge shot — V29: TWO release tiers. FAST BURST (release at 50-74.99%) is a flat
    // half-strength burst with snappier projectiles and lighter feedback; OVERDRIVE (>=75%) is the
    // fill-scaled heavy hit. Both deal ~1.0x the burst table per second of charging, so neither
    // dominates on DPS — the tradeoff is per-hit impact vs. commitment (and mid-charge risk).
    var pw=this.wp[this.wtype],fast=c<.75,fill=fast?.5:c,base=OD_BURST[this.wtype][Math.min(pw,5)];
    this.chg=0;this.hitStop=Math.max(this.hitStop,fast?35:70);this.flash=Math.max(this.flash,fast?.15:.2);this.shake=Math.max(this.shake,fast?4:7);
    sfx(fast?'fast':'charge');   // V59: the beam visuals + stinger carry the mode — no text
    var sx=Math.min(this.px,W-80),sp=fast?1.32:1;   // clamp spawn x (right-edge charges aren't wasted); fast-tier bolts fly 32% quicker
    if(this.wtype==='vul'){            // TIGHT fan: a center cannon (the whole identity — boss-killer) + four small finisher wings
      var bossLive=this.boss&&!this.boss.dead;   // V108: the cannon over-penetrates BOSS armor — every boss type (V99 was dread-only; the audit found vortex/mother at the same grind the dread buff fixed)
      var cd=Math.round(base*fill*(!fast&&bossLive?OD_BOSS:1)),wd=Math.max(3,Math.round(cd*.07));
      for(var k=-2;k<=2;k++)this.bullets.push({x:sx+30,y:this.py,vx:27*sp,vy:k*2.2,d:k===0?cd:wd,c:k===0?'#fff2b0':'#ffcc44',big:true});
    }else if(this.wtype==='laser'){    // one colossal piercing beam — damage per frame it overlaps a target
      this.beams.push({x:sx+30,y:this.py,vx:34*sp,len:300+pw*50,hw:10+pw*2,dmg:base*fill,t:320});
      if(this.beams.length>6)this.beams.shift();
    }else if(this.wtype==='missile'){  // missile: a six-missile volley at once
      var md=Math.round(base*fill);
      for(var i=0;i<6;i++)this.missiles.push({x:sx+16,y:this.py+(i-2.5)*7,vx:4,vy:0,a:0,spd:4,maxsp:(20+pw*2)*sp,dmg:md,pw:pw,t:3000});
      if(this.missiles.length>16)this.missiles.shift();
    }else{                             // spreader: CHAIN LIGHTNING — strike the nearest target, then arc to nearby others (60% decay per hop)
      var dmg=Math.round(base*fill),hops=3+Math.min(pw,3),pts=[],used=[],cur=null,chainDmg=[dmg];
      var sd=1e9,bossFirst=false;
      for(var j=0;j<this.enemies.length;j++){var e=this.enemies[j];var dd=Math.hypot(e.x-this.px-30,e.y-this.py);if(dd<sd){sd=dd;cur=e;}}
      if(!cur&&this.boss&&!this.boss.dead){cur=this.boss;bossFirst=true;}
      if(cur){
        pts.push({x:cur.x,y:cur.y});used.push(cur);
        if(bossFirst){this.hurtBoss(dmg);this.boss.flash=1;this.boom(this.boss.x,this.boss.y,'#7dff9e',10,5);}
        else{cur.hp-=dmg;cur.hf=1;sfx('hit');this.boom(cur.x,cur.y,'#7dff9e',8,4);   // the hit sound plays on the strike — the hops stay quiet so a 6-arc chain doesn't stack noise
          if(cur.hp<=0){var ci=this.enemies.indexOf(cur);if(ci>=0)this.killEnemy(cur,ci);}}
        for(var h=0;h<hops;h++){
          dmg=Math.round(dmg*CHAIN_DECAY);if(dmg<1)break;
          var next=null,nd2=CHAIN_R*CHAIN_R;
          for(var j2=0;j2<this.enemies.length;j2++){var e2=this.enemies[j2];
            if(used.indexOf(e2)>=0)continue;
            var dd2=(e2.x-cur.x)*(e2.x-cur.x)+(e2.y-cur.y)*(e2.y-cur.y);
            if(dd2<nd2){nd2=dd2;next=e2;}}
          if(!next)break;   // no unused target in range — the chain ends; record only real hops
          chainDmg.push(dmg);
          next.hp-=dmg;next.hf=1;this.boom(next.x,next.y,'#7dff9e',7,3);   // visual only — no per-hop sfx
          if(next.hp<=0){var ni=this.enemies.indexOf(next);if(ni>=0)this.killEnemy(next,ni);}
          pts.push({x:next.x,y:next.y});used.push(next);cur=next;
        }
        this.chains.push({pts:pts,t:450,dmg:chainDmg,from:{x:this.px+30,y:this.py}});   // 'from' anchors the strike arc at the cannon
        if(this.chains.length>8)this.chains.shift();
      }
      // V59: the arcing chain visuals carry the moment — no text popup
    }
  },

    // V36: VOID SHATTER — shards drift, spin, fade (~1.1s), and hit like a bullet

      if(!this.pDead&&Math.hypot(s.x-this.px,s.y-this.py)<PLAYER_HIT){

    for(var i=this.powerups.length-1;i>=0;i--){

      // V105: the pull is now FLAT-FULL inside MAG_FLAT px — a drop landing RIGHT NEXT TO the ship
      // gets the full MAG_PULL and is sucked in instead of drifting past (the old linear ramp was
      // barely half-strength at 35px). Past the flat zone it falls off linearly to 0 at the rim
      // (reach 70 -> 90px). The pull is ADDED to the pickup's own drift (vx/vy), never replacing
      // it, so a drop keeps its natural leftward crawl and the magnet only bends the path.
      // Max pull 2.6px/step is well under the ship's 5.6, so nothing feels homing.
      if(!this.pDead){
        var mdx=this.px-p.x,mdy=this.py-p.y,md=Math.hypot(mdx,mdy);   // Math.hypot, matching the collection check below (file convention)
        if(md<PICKUP_MAGNET&&md>0.01){var pull=md<MAG_FLAT?MAG_PULL:MAG_PULL*(1-(md-MAG_FLAT)/(PICKUP_MAGNET-MAG_FLAT));p.x+=mdx/md*pull*dn;p.y+=mdy/md*pull*dn;}   // V105: flat-full close, linear to the rim
      }

        sfx('pow');
        var got=p.type,pc={'power':'#ff8844','shield':'#55aaff','bomb':'#ff5577','life':'#ffcc44','w':'#44ff88','mystery':'#ffd23f'}[got];   // V59: pickups speak through color — a tinted burst + flash replace the name banner; V66: the mystery box bursts GOLD while it rolls
        if(got==='mystery')got=['power','w','shield','bomb','life'][Math.floor(Math.random()*5)];   // V66: Parodius-style — the '?' box rolls a random pickup and applies it (a weapon roll carries its own random wsub)
        var mw=got==='w'&&p.type==='mystery'?['laser','missile','spreader'][Math.floor(Math.random()*3)]:null;   // V66: a mystery-rolled weapon gets a random crystal
        var wtarget=got==='w'?(p.wsub||mw):null;   // a real crystal keeps the weapon it depicts; a mystery-rolled one takes the random draw; a legacy bare 'w' (neither) is null -> cycles below
        if(p.type==='w'&&p.wsub)pc=this.wcol[p.wsub];   // V66 review: a real weapon crystal bursts in ITS weapon color (laser cyan / missile amber / spreader green), so the feedback matches the tile — the generic green was only for legacy bare 'w'
        switch(got){

          case'w':if(wtarget){this.wtype=wtarget;this.wp[wtarget]=Math.min(this.wp[wtarget]+1,5);}   // V66: a weapon crystal SWITCHES to the weapon it depicts (R-Type grants the specific weapon, no blind cycling); +1 power to it
                  else{this.cycleWeapon(1,true);this.wp[this.wtype]=Math.min(this.wp[this.wtype]+1,5);}break;   // legacy bare 'w' (harness/back-compat) still cycles
          case'shield':this.shield=8000;break;

        this.powerups.splice(i,1);this.hud();continue;
      }
      if(p.x<-30||p.y>H+30)this.powerups.splice(i,1);
    }

    for(var i=this.particles.length-1;i>=0;i--){var p=this.particles[i];p.x+=p.vx*dn;p.y+=p.vy*dn;p.vx*=.96;p.vy*=.96;p.vy+=.03*dn;p.life-=p.decay;if(p.life<=0)this.particles.splice(i,1);}
    for(var i=this.shockwaves.length-1;i>=0;i--){var s=this.shockwaves[i];s.r+=(s.max-s.r)*.12*dn;s.life-=.04*dn;if(s.life<=0)this.shockwaves.splice(i,1);}

    for(var i=this.popups.length-1;i>=0;i--){var p=this.popups[i];p.t-=.02*dn;p.y-=.02*dn;if(p.t<=0)this.popups.splice(i,1);}   // V59: every popup is a milestone now (all big) — they fade in ~0.8s (was ~10.4s at 0.0016/step)

    if(this.score>=this.nextLife){this.lives=Math.min(this.lives+1,5);this.nextLife+=30000;this.pop(this.px,this.py-40,'1UP!','#ff88ff',true);sfx('1up');this.hud();}   // V59: the big gold pop carries the milestone — no banner

    }else if(this.hbLow>.01&&performance.now()-this._hbLiveT>300){   // scheduler idle: free-running heartbeat at the same tempo-scaled interval

  hbZoom:function(){return 1+this.hbLow*this.hbEnv*.002;},   // 1-2px zoom (0.2% at peak), gated by the low-life fade

  renderVig:function(){   // red vignette, alpha = smoothed low-life fade x heartbeat pulse

  renderBG:function(){

  drawBoss:function(b){
    if(b.type==='vortex'){this.drawBossVortex(b);return;}
    if(b.type==='mother'){this.drawBossMother(b);return;}
    X.save();X.translate(b.x,b.y);
    var t=b.t*.01,ph=1-b.hp/b.mhp,pi=ph<.33?0:ph<.66?1:2;
    var pal=b.pal||BOSS_PALETTES[0][b.type];
    var hull=pal.hue[pi],dark=pal.dark[pi];
    // engine glow (rear = +x: the fleet faces LEFT toward the player)
    X.save();X.globalCompositeOperation='lighter';
    X.fillStyle=hull;X.globalAlpha=.5+.2*Math.sin(t);
    X.beginPath();X.ellipse(52,-24,11,6,0,0,6.28);X.fill();
    X.beginPath();X.ellipse(52,24,11,6,0,0,6.28);X.fill();
    X.restore();
    // wings (gradient)
    var wg=LG(0,-56,0,-10,hull,dark);
    X.fillStyle=wg;X.strokeStyle='rgba(255,255,255,.85)';X.lineWidth=2;
    X.beginPath();X.moveTo(30,-16);
    X.quadraticCurveTo(36,-40,46,-54);X.lineTo(-2,-42);X.quadraticCurveTo(-16,-28,-22,-14);
    X.closePath();X.fill();X.stroke();
    X.beginPath();X.moveTo(30,16);
    X.quadraticCurveTo(36,40,46,54);X.lineTo(-2,42);X.quadraticCurveTo(-16,28,-22,14);
    X.closePath();X.fill();X.stroke();
    // wing turrets
    X.fillStyle=dark;X.strokeStyle='rgba(255,255,255,.6)';X.lineWidth=1.4;
    X.beginPath();X.arc(18,-34,7,0,6.28);X.fill();X.stroke();
    X.beginPath();X.arc(18,34,7,0,6.28);X.fill();X.stroke();
    // hull plates (layered)
    var hg=X.createLinearGradient(0,-24,0,24);hg.addColorStop(0,hull);hg.addColorStop(.5,hull);hg.addColorStop(1,dark);
    X.fillStyle=hg;X.strokeStyle='rgba(255,255,255,.9)';X.lineWidth=2.5;
    X.beginPath();X.moveTo(-54,0);
    X.quadraticCurveTo(-44,-16,-26,-22);X.lineTo(16,-24);
    X.quadraticCurveTo(42,-20,54,-8);
    X.quadraticCurveTo(56,0,54,8);
    X.quadraticCurveTo(42,20,16,24);X.lineTo(-26,22);
    X.quadraticCurveTo(-44,16,-54,0);
    X.closePath();X.fill();X.stroke();
    // armor seams
    X.strokeStyle='rgba(0,0,0,.35)';X.lineWidth=1.6;
    X.beginPath();X.moveTo(-30,-14);X.lineTo(6,-18);X.stroke();
    X.beginPath();X.moveTo(-30,14);X.lineTo(6,18);X.stroke();
    X.beginPath();X.moveTo(6,-18);X.quadraticCurveTo(30,-14,44,-6);X.stroke();
    X.beginPath();X.moveTo(6,18);X.quadraticCurveTo(30,14,44,6);X.stroke();
    // rivet lights
    X.save();X.globalAlpha=.85;
    X.fillStyle='#ffd25e';X.beginPath();X.arc(-24,-14,1.6,0,6.28);X.fill();
    X.fillStyle='#7df2ff';X.beginPath();X.arc(-24,14,1.6,0,6.28);X.fill();
    X.fillStyle='#ffd25e';X.beginPath();X.arc(24,-12,1.6,0,6.28);X.fill();
    X.fillStyle='#7df2ff';X.beginPath();X.arc(24,12,1.6,0,6.28);X.fill();X.restore();
    // core shield arcs
    X.save();X.globalAlpha=.35+.15*Math.sin(t*2);
    X.strokeStyle=pal.core[pi];X.lineWidth=2;
    X.beginPath();X.arc(0,0,26,0,6.28);X.stroke();
    X.beginPath();X.arc(0,0,30,t,t+4.2);X.stroke();
    X.restore();
    // core (weak point)
    var cg=X.createRadialGradient(0,0,1,0,0,16);
    cg.addColorStop(0,'#fff');cg.addColorStop(.4,pal.core[pi]);cg.addColorStop(1,'rgba(0,0,0,0)');
    X.save();X.globalCompositeOperation='lighter';
    X.fillStyle=cg;X.beginPath();X.arc(0,0,16,0,6.28);X.fill();X.restore();
    if(b.flash>0){X.globalAlpha=Math.max(0,b.flash)*.55;X.fillStyle='#fff';X.beginPath();X.arc(0,0,58,0,6.28);X.fill();X.globalAlpha=1;}
    X.restore();

  drawBossVortex:function(b){
    // a spinning ring-weapon: three rotating arms with turret pods around a shielding core
    X.save();X.translate(b.x,b.y);
    var ph=1-b.hp/b.mhp,pi=ph<.33?0:ph<.66?1:2;
    var pal=b.pal||BOSS_PALETTES[0][b.type];
    var hull=pal.hue[pi],dark=pal.dark[pi];
    X.save();X.globalCompositeOperation='lighter';
    X.rotate(b.rot);
    for(var a=0;a<3;a++){
      X.rotate(2.094);   // fixed 120° steps — arms land at 0°, 120°, 240°
      X.globalAlpha=.8;X.fillStyle=hull;X.fillRect(-54,-6,108,12);
      X.globalAlpha=1;X.fillStyle=dark;X.strokeStyle='rgba(255,255,255,.7)';X.lineWidth=2;
      X.beginPath();X.arc(-44,0,10,0,6.28);X.fill();X.stroke();
      X.fillStyle='#fff';X.beginPath();X.arc(-44,0,4,0,6.28);X.fill();
    }
    X.restore();
    X.save();X.strokeStyle=hull;X.lineWidth=5;X.globalAlpha=.5;X.beginPath();X.arc(0,0,46,0,6.28);X.stroke();X.restore();
    X.fillStyle=hull;X.strokeStyle='rgba(255,255,255,.85)';X.lineWidth=2.5;X.beginPath();X.arc(0,0,24,0,6.28);X.fill();X.stroke();
    X.fillStyle=dark;X.beginPath();X.arc(0,0,16,0,6.28);X.fill();
    // forward wedge (drawn outside the rotating arms) so the spinner also reads as facing the player
    X.fillStyle='#fff';X.globalAlpha=.85;
    X.beginPath();X.moveTo(-58,0);X.lineTo(-45,-8);X.lineTo(-45,8);X.closePath();X.fill();X.globalAlpha=1;
    var cg=X.createRadialGradient(0,0,1,0,0,14);
    cg.addColorStop(0,'#fff');cg.addColorStop(.4,pal.core[pi]);cg.addColorStop(1,'rgba(0,0,0,0)');
    X.save();X.globalCompositeOperation='lighter';X.fillStyle=cg;X.beginPath();X.arc(0,0,14,0,6.28);X.fill();X.restore();
    if(b.flash>0){X.globalAlpha=Math.max(0,b.flash)*.55;X.fillStyle='#fff';X.beginPath();X.arc(0,0,54,0,6.28);X.fill();X.globalAlpha=1;}
    X.restore();

function esc(s){return String(s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function hx(c,a){var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}
function LG(x0,y0,x1,y1,a,b){var g=X.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function RG(x,y,r0,r1,a,b){var g=X.createRadialGradient(x,y,r0,x,y,r1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}

/* V65: the per-type pickup tile silhouette, traced at scale s (the tile fill uses 1, the
   inner bevel reuses it at .72). power = square, w = diamond, shield = hexagon,
   bomb = circle, life = heart — readable by silhouette alone at peripheral vision. */
function tileP(t,s){
  if(t==='w'){X.moveTo(0,-11*s);X.lineTo(11*s,0);X.lineTo(0,11*s);X.lineTo(-11*s,0);X.closePath();}
  else if(t==='shield'){X.moveTo(0,-11*s);X.lineTo(9.53*s,-5.5*s);X.lineTo(9.53*s,5.5*s);X.lineTo(0,11*s);X.lineTo(-9.53*s,5.5*s);X.lineTo(-9.53*s,-5.5*s);X.closePath();}
  else if(t==='bomb'){X.arc(0,0,11*s,0,6.28);}
  else if(t==='life'){X.moveTo(0,6*s);X.bezierCurveTo(-10*s,-2*s,-5*s,-10*s,0,-6*s);X.bezierCurveTo(5*s,-10*s,10*s,-2*s,0,6*s);X.closePath();}
  else if(t==='mystery'){X.moveTo(0,-11*s);X.lineTo(2.9*s,-3.4*s);X.lineTo(10.5*s,-3.4*s);X.lineTo(4.2*s,1.3*s);X.lineTo(6.5*s,9.7*s);X.lineTo(0,5*s);X.lineTo(-6.5*s,9.7*s);X.lineTo(-4.2*s,1.3*s);X.lineTo(-10.5*s,-3.4*s);X.lineTo(-2.9*s,-3.4*s);X.closePath();}   // V66: mystery — a 5-point star (the 'lucky find' silhouette, distinct from every other tile)
  else{if(X.roundRect)X.roundRect(-11*s,-11*s,22*s,22*s,4);else X.rect(-11*s,-11*s,22*s,22*s);X.closePath();}   // power: square (rounded) — the caller already began the path
}

/* ============ GAMEPAD (desktop browsers) ============ */
/* Standard mapping: A fire · B bomb · LB/RB cycle weapon · Start pause/resume (and START on the
   title, like an arcade cab). The left stick (deadzoned) and the d-pad both move the ship — they
   write the same G.keys the keyboard and the touch joystick use, so no gameplay code changed.
   On the TITLE screen the d-pad / left stick move the V44 menu focus ring (menuMove) and START
   activates the focused mode (menuActivate) — edge-triggered, so a held direction nudges once.
   Edge-triggered actions (bomb/weapon/start) fire once per press via a rising-edge mask. */
var GP={prev:0,prevDir:0,on:false};
function gpPoll(){
  if(typeof navigator==='undefined'||!navigator.getGamepads)return;
  var pads=[];try{pads=navigator.getGamepads()||[];}catch(e){return;}
  var pad=null;for(var i=0;i<pads.length;i++){if(pads[i]&&pads[i].connected){pad=pads[i];break;}}
  if(!pad){
    if(GP.on&&G.state==='PLAY'){G.keys['arrowleft']=G.keys['arrowright']=G.keys['arrowup']=G.keys['arrowdown']=false;G.keys[' ']=false;}   // unplug safety: never leave held inputs stuck
    GP.prev=0;GP.prevDir=0;GP.on=false;return;
  }
  GP.on=true;
  var b=function(i){return !!(pad.buttons&&pad.buttons[i]&&pad.buttons[i].pressed);};
  var ax=(pad.axes&&pad.axes[0])||0,ay=(pad.axes&&pad.axes[1])||0,DZ=.15;
  var L=ax<-DZ||b(14),R=ax>DZ||b(15),U=ay<-DZ||b(12),Dn=ay>DZ||b(13);
  if(G.state==='PLAY'){
    G.keys['arrowleft']=L;G.keys['arrowright']=R;G.keys['arrowup']=U;G.keys['arrowdown']=Dn;
    G.keys[' ']=b(0);   // A fires (hold)
  }
  var m=(b(0)?1:0)|(b(1)?2:0)|(b(4)?4:0)|(b(5)?8:0)|(b(9)?16:0);   // A (fire) is level-triggered on PLAY (no edge&1 handler there) — but it confirms on the TITLE like START
  var edge=m&~GP.prev;
  GP.prev=m;
  var dir=(L?1:0)|(R?2:0)|(U?4:0)|(Dn?8:0),dirEdge=dir&~GP.prevDir;   // V45: d-pad/stick rising edge for the title menu (held directions must not churn the focus)
  GP.prevDir=dir;
  if(G.state==='PLAY'){
    if(edge&2)G.bomb();            // B
    if(edge&4)G.cycleWeapon(-1);   // LB
    if(edge&8)G.cycleWeapon(1);    // RB
    if(edge&16)G.pause();          // Start
  }else if(G.state==='PAUSE'){
    if(edge&16)G.resume();         // Start resumes
  }else if(G.state==='TITLE'){
    var dm=((dirEdge&1)||(dirEdge&4)?-1:0)+((dirEdge&2)||(dirEdge&8)?1:0);   // V45: net focus move — LEFT/UP=-1, RIGHT/DOWN=+1; a diagonal still moves once, opposites cancel (keyboard parity)
    if(dm)G.menuMove(dm);
    if(edge&1||edge&16){if(G._menuMoved)G.menuActivate();else G.start();}   // V45: START (or A, arcade-confirm style) runs the focused mode, or starts the campaign by default
  }
}

/* ============ INPUT ============ */
addEventListener('keydown',function(e){
  unlockAudio();   // V47: any keypress unlocks the attract-mode loop (web-audio needs the gesture)
  var k=e.key.toLowerCase();
  G.keys[k]=true;
  if(e.key==='Enter'){
    if(G.state==='TITLE'){if(G._menuMoved)G.menuActivate();else G.start();}   // V44: Enter starts the campaign by default; once you arrow-navigate it activates the focused mode
    else if(G.state==='OVER'){
      if(G.pendActive()){G.confirmInitials();}
      else{G.start();}
    }
  }
  if(G.state==='TITLE'&&!e.repeat){   // V44: arrow-key mode selection on the title screen (arcade-cabinet feel)
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')G.menuMove(-1);
    else if(e.key==='ArrowRight'||e.key==='ArrowDown')G.menuMove(1);
  }
  if(e.key==='p'||e.key==='P'){if(G.state==='PLAY')G.pause();else if(G.state==='PAUSE')G.resume();}
  if(e.key==='m'||e.key==='M'){G.toggleMute();}
  if(e.key==='h'||e.key==='H'){G.toggleHit();}   // V55: H shows/hides the 14px hitbox (the genre's practice toggle)
  if(e.key==='c'||e.key==='C'){G.toggleCrt();}   // V55: C toggles the CRT scanline + vignette overlay
  if(e.key==='r'||e.key==='R'){if(G.state==='PAUSE')G.start();}
  if(e.key==='Escape'){
    if(G.state==='PLAY'||G.state==='PAUSE'){G.toTitle();}
    else if(G.state==='OVER'){
      if(G.pendActive()){G.autoCommit();G.showOver();sfx('sel');}   // ESC cancels the initials editor: keep the score with last-used initials, stay on the stats screen
      else{G.toTitle();}                                                  // (a second ESC — or the MENU button — leaves for the title)
    }
  }
  if(e.key==='x'||e.key==='X'){if(G.state==='PLAY')G.bomb();}
  if(e.key==='q'||e.key==='Q'||e.key==='Tab'){if(G.state==='PLAY'&&!e.repeat){e.preventDefault();G.cycleWeapon(1);}}
  if(e.key==='e'||e.key==='E'){if(G.state==='PLAY'&&!e.repeat)G.cycleWeapon(-1);}
  if(G.state==='OVER'&&G.pendActive()){
    if(e.key==='ArrowLeft'&&!e.repeat)G.iniSel((G._iniIdx+2)%3);     // one press = one slot; holding a cursor key must not churn full overlay re-renders
    if(e.key==='ArrowRight'&&!e.repeat)G.iniSel((G._iniIdx+1)%3);
    if(e.key==='ArrowUp')G.iniShift(G._iniIdx,1);                     // up/down keep repeats so holding scrolls letters A..Z
    if(e.key==='ArrowDown')G.iniShift(G._iniIdx,-1);
  }
  if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault();   // never let the page scroll on game keys
});
addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false;});
(function(){
  function autoPause(){if(G.state==='PLAY')G.pause();}   // never die while alt-tabbed: pause the moment the tab loses focus
  document.addEventListener('visibilitychange',function(){if(document.hidden)autoPause();});
  addEventListener('blur',autoPause);
  addEventListener('pagehide',autoPause);
})();
addEventListener('click',function(e){
  var t=e&&e.target;
  while(t&&t.nodeType===3)t=t.parentNode;   // some mobile browsers deliver the text node inside a button as the tap target — walk up to the element
  if(t&&(t.tagName==='BUTTON'||t.tagName==='A'||t.tagName==='LABEL'||(t.closest&&t.closest('button,a,label'))))return;   // never steal clicks from UI controls (MENU, difficulty, initials…) — they handle themselves
  if(G.state==='TITLE'){G.start();}
  else if(G.state==='OVER'){if(!G.pendActive())G.start();}
});

/* ============ TOUCH CONTROLS (mobile only) ============ */
(function(){
  var isTouch = ('ontouchstart' in window) || (typeof navigator!=='undefined' && navigator.maxTouchPoints>0);
  if(!isTouch) return;
  document.body.classList.add('touch');
  var joy=document.getElementById('joy'),thumb=document.getElementById('joyThumb');
  var joyId=null,jx=0,jy=0,MAX=33,DZ=14;
  function setMove(dx,dy){
    G.keys['arrowleft']=dx<-DZ;G.keys['arrowright']=dx>DZ;
    G.keys['arrowup']=dy<-DZ;G.keys['arrowdown']=dy>DZ;
  }
  function clearMove(){G.keys['arrowleft']=G.keys['arrowright']=G.keys['arrowup']=G.keys['arrowdown']=false;}
  function joyStart(t){joyId=t.identifier;var hw=60;   // clamp spawn so the 120px circle never hangs off-screen on small phones
    jx=Math.min(Math.max(t.clientX,hw),window.innerWidth-hw);jy=Math.min(Math.max(t.clientY,hw),window.innerHeight-hw);
    joy.style.left=(jx-hw)+'px';joy.style.top=(jy-hw)+'px';joy.style.display='block';thumb.style.transform='translate(0,0)';}
  function joyMove(t){var dx=t.clientX-jx,dy=t.clientY-jy,d=Math.hypot(dx,dy);if(d>MAX){dx=dx/d*MAX;dy=dy/d*MAX;}thumb.style.transform='translate('+dx+'px,'+dy+'px)';setMove(dx,dy);}
  function joyEnd(t){if(t.identifier!==joyId)return;joyId=null;joy.style.display='none';clearMove();}
  document.addEventListener('touchstart',function(e){
    if(G.state!=='PLAY')return;
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(joyId===null&&t.clientX<window.innerWidth*.5){joyStart(t);}}
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(joyId===null)return;e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joyId){joyMove(t);}}
  },{passive:false});
  function onEnd(e){for(var i=0;i<e.changedTouches.length;i++){joyEnd(e.changedTouches[i]);}}
  document.addEventListener('touchend',onEnd);
  document.addEventListener('touchcancel',onEnd);
  function hold(id,on,off){
    var el=document.getElementById(id);
    el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();on();},{passive:false});
    el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();off();},{passive:false});
    el.addEventListener('touchcancel',function(e){off();});
  }
  hold('btnFire',function(){G.keys[' ']=true;},function(){G.keys[' ']=false;});
  hold('btnBomb',function(){if(G.state==='PLAY')G.bomb();},function(){});
  hold('btnWeapon',function(){if(G.state==='PLAY')G.cycleWeapon(1);},function(){});
  hold('btnPause',function(){if(G.state==='PLAY')G.pause();else if(G.state==='PAUSE')G.resume();},function(){});
  hold('btnSnd',function(){G.toggleMute();},function(){});
})();

if(!G.crt){var crtEl=document.getElementById('crt');if(crtEl)crtEl.style.display='none';}

G.init();G.showTitle();G.initDemo();

var lastT=0;
function loop(t){var dt=t-lastT;lastT=t;G.update(dt);G.render();if(document.body)document.body.classList.toggle('playing',G.state==='PLAY'||G.state==='PAUSE');requestAnimationFrame(loop);}   // V61: the per-frame dt clamp is GONE — the accumulator catches up stalls at up to 3 ticks/frame until the remainder clears, bounded only by the 500ms backlog cap in update() (a long tab-away still can't replay minutes of sim)
requestAnimationFrame(loop);
