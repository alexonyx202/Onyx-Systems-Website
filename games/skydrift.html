<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050f">
<title>SKYDRIFT — Retro Arcade Shooter (V68)</title>
<style>
/* === Mobile landscape rotate prompt (portrait touch only) === */
#rotate-prompt{display:none;position:fixed;inset:0;z-index:99999;background:#05050f;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;font-family:'Courier New',monospace}
#rotate-prompt .icon{font-size:60px;animation:rot-hint 2s ease-in-out infinite}
#rotate-prompt .msg{font-size:16px;letter-spacing:1px;max-width:280px;line-height:1.5}
#rotate-prompt .sub{font-size:12px;color:#9fc2e0}
@keyframes rot-hint{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (hover:none) and (pointer:coarse) and (max-width:767px){
  #rotate-prompt{display:flex!important}
  body>*:not(#rotate-prompt){visibility:hidden}
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05050f;overscroll-behavior:none}
body{font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#fff}
canvas{display:block;cursor:crosshair;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:6px calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));display:flex;justify-content:space-between;color:#fff;font-size:13px;z-index:10;pointer-events:none;text-shadow:0 0 6px currentColor,1px 1px 2px #000}
#hud span{margin:0 8px}
.hi{color:#ffcc44}.hw{color:#44ffaa}.hl{color:#ff5577}.hb{color:#55aaff}.hp{color:#ff88ff}.hwpn{color:#ffee44;font-size:10px;letter-spacing:2px;min-width:52px;display:inline-block;text-align:right}
.hvr{color:#ff8866;font-size:10px;letter-spacing:1px;text-shadow:0 0 6px rgba(255,80,60,.8)}   /* V31: the BOSS RUSH HUD badge */
.hchg{color:#7df2ff;font-size:10px;letter-spacing:1px;text-shadow:0 0 8px rgba(125,242,255,.7)}
.hchg.ready{color:#ffd75e;text-shadow:0 0 8px rgba(255,215,94,.85)}   /* V29: gauge >=75% — the OVERDRIVE tier is armed */
.hchg.full{color:#ffcc44;animation:bl .5s steps(2,start) infinite;text-shadow:0 0 10px rgba(255,204,68,.95)}
#hud .hv{color:#55aaff;display:none}
#hud .hv.on{display:inline}

/* Boss health bar */
#bossbar{position:fixed;top:44px;left:50%;transform:translateX(-50%);width:min(520px,72vw);z-index:11;display:none;pointer-events:none}
#bossbar .bbn{text-align:center;font-size:10px;letter-spacing:4px;color:#ff88aa;margin-bottom:3px;text-shadow:0 0 8px rgba(255,80,120,.8);animation:bl 0.8s steps(2,start) infinite}
.bbw{height:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,120,160,.35);border-radius:4px;overflow:hidden}
#bbf{height:100%;width:100%;background:linear-gradient(90deg,#ff4466,#ffcc44);box-shadow:0 0 10px rgba(255,80,100,.7);transition:width .12s linear}

/* CRT scanline + vignette overlay */
#crt{position:fixed;inset:0;pointer-events:none;z-index:90;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0px,rgba(0,0,0,.22) 1px,transparent 2px,transparent 3px);}
#crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);mix-blend-mode:normal}

#overlay{position:fixed;inset:0;background:rgba(5,5,16,.9);display:none;flex-direction:column;align-items:center;z-index:100;color:#fff;text-align:center;padding:20px;overflow:auto}
#overlay::before,#overlay::after{content:"";display:block;margin:auto}   /* center when short, but never clip the top when content overflows (flex-center + overflow bug) */
#overlay.show{display:flex}
#overlay.title{background:rgba(4,4,14,.46)}   /* V44: lighter dim so the attract-mode demo gameplay shows through — the arcade look */
#overlay.over{background:rgba(5,5,16,.93)}
#overlay.pause{background:rgba(5,5,16,.8)}
#overlay h1{font-size:min(11vw,72px);letter-spacing:8px;margin-bottom:2px;line-height:1}
.tg{color:#ffcc44;text-shadow:3px 0 #ff2a6d,-3px 0 #05d9e8,0 0 30px rgba(255,200,60,.5);animation:tgp 3.2s ease-in-out infinite}   /* V44: the logo gently floats + the neon glow breathes — arcade marquee feel */
@keyframes tgp{0%,100%{text-shadow:3px 0 #ff2a6d,-3px 0 #05d9e8,0 0 30px rgba(255,200,60,.5);transform:translateY(0)}50%{text-shadow:5px 0 #ff2a6d,-5px 0 #05d9e8,0 0 54px rgba(255,200,60,.95);transform:translateY(-3px)}}
.tr{color:#ff3355;text-shadow:3px 0 #ff2a6d,-3px 0 #ff8800,0 0 30px rgba(255,50,50,.6)}
#overlay h2{font-size:13px;color:#55aaff;letter-spacing:5px;margin-bottom:14px;text-shadow:0 0 10px rgba(85,170,255,.5)}
#overlay .ver{font-size:10px;color:#556677;letter-spacing:3px;margin-top:10px}
#overlay .seed{font-size:11px;color:#ffd75e;letter-spacing:2px;margin-top:6px;text-shadow:0 0 12px rgba(255,215,94,.5)}   /* V43: the daily-challenge seed everyone shares today */
.streak{font-size:12px;color:#ff8844;letter-spacing:2px;margin-top:5px;text-shadow:0 0 12px rgba(255,136,68,.7);animation:bl 1.6s steps(2,start) infinite}   /* V55: the daily-streak flame on the title — shown at 2+ days running */
.setrow{display:flex;gap:8px;justify-content:center;margin:6px 0 2px;flex-wrap:wrap}   /* V55: the settings row — CRT toggle + SOUND TEST */
.ss{padding:6px 14px;font-size:10px;border-radius:4px;letter-spacing:2px;background:rgba(255,255,255,.07);color:#88aacc;box-shadow:0 3px 0 rgba(0,0,0,.4)}   /* V55: small settings button */
.ss:hover{color:#ffcc44}
.share{margin:6px 0 2px}   /* V55: the game-over SHARE RUN row */
.bs{background:linear-gradient(180deg,#44cc88,#228855);color:#fff;box-shadow:0 3px 0 #145530,0 4px 14px rgba(60,220,140,.35)}   /* V55: share button — green, a ready-to-copy action */
.bs.copied{background:linear-gradient(180deg,#7df2ff,#2a7fb8);color:#032a44;box-shadow:0 3px 0 #14456a}   /* V55: copied state — cyan confirmation */
.box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:14px 22px;margin:8px 0;max-width:480px;text-align:left;font-size:11px;line-height:2;color:#9fc2e0}
.box b{color:#ffcc44}
.mission{font-size:11px;color:#9fc2e0;letter-spacing:1px;margin:2px 0 6px;text-shadow:0 0 8px rgba(159,194,224,.25)}
.mission b{color:#ffcc44}
.k{display:inline-block;background:rgba(255,200,60,.15);padding:1px 7px;border-radius:3px;color:#ffcc44;font-weight:bold;font-size:10px}
.panels{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.hs{background:rgba(255,255,255,.04);border:1px solid rgba(255,200,60,.18);border-radius:8px;padding:12px 18px;margin:8px 0;min-width:240px}
.hs h3{color:#ffaa33;font-size:12px;letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 8px rgba(255,170,50,.5)}
.hsrow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.hsrow .rk{color:#55aaff;width:24px}.hsrow .nm{color:#fff;width:44px}.hsrow .sc{color:#ffcc44;font-weight:bold}.hsrow .wv{color:#88aacc;font-size:10px}.hsrow .dt{color:#556677;font-size:10px}
.hscur{background:rgba(255,200,60,.14);border-radius:3px}
.dh{border-color:rgba(255,215,94,.35)}   /* V46: the daily leaderboard panel — sun-gold border to match the DAILY identity */
.dh h3{color:#ffd75e;text-shadow:0 0 8px rgba(255,215,94,.5)}
.empty{color:#556688;font-style:italic;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 16px;margin:6px 0 8px;min-width:320px}
.fleet{background:rgba(255,255,255,.04);border:1px solid rgba(196,107,255,.22);border-radius:8px;padding:10px 18px;margin:6px 0;min-width:320px}
.fleet h3{font-size:11px;color:#c46bff;letter-spacing:2px;margin:0 0 6px;text-shadow:0 0 8px rgba(196,107,255,.5)}
.flr{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:1px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.flr:last-child{border-bottom:none}
.fln{font-weight:bold;min-width:118px}
.flw{color:#8899aa;min-width:52px}
.flk{color:#ccd6e0;flex:1}
.flb{font-weight:bold;min-width:48px;text-align:right;color:#fff}
.fld{font-size:9px;color:#8ad;letter-spacing:1px;margin:1px 0 3px}   /* V42: the per-difficulty BEST label on the fleet ladder */
.st{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:8px 14px}
.sl{color:#556677;font-size:9px;text-transform:uppercase;letter-spacing:1px}
.sv{color:#ffcc44;font-size:20px;font-weight:bold}
.sg{color:#44ff88}
.grade{font-size:54px;font-weight:bold;letter-spacing:4px;line-height:1;margin:4px 0 10px;text-shadow:0 0 26px currentColor}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
button{padding:11px 30px;font-size:13px;font-family:'Courier New',monospace;border:none;border-radius:4px;font-weight:bold;cursor:pointer;letter-spacing:2px;transition:transform .1s,filter .1s,box-shadow .2s;touch-action:manipulation}
button:hover{filter:brightness(1.15)}
button:active{transform:scale(.96)}
.hero{padding:16px 48px;font-size:17px;box-shadow:0 4px 0 #996600,0 6px 26px rgba(255,136,0,.45);animation:hp 1.6s ease-in-out infinite}   /* V44: START GAME is the biggest, warmest action — the primary arcade button */
@keyframes hp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}   /* brightness (not box-shadow) so the .kf focus glow still shows on the hero */
button.kf{outline:2px solid #fff;outline-offset:2px;filter:brightness(1.3);box-shadow:0 0 20px rgba(255,255,255,.4)}   /* V44: keyboard menu focus ring — arrow keys move it like an arcade cabinet */
.bg{background:linear-gradient(180deg,#ffcc44,#ee8800);color:#1a0800;box-shadow:0 3px 0 #996600,0 4px 16px rgba(255,136,0,.35)}
.bn{background:linear-gradient(180deg,#5a7fb0,#335588);color:#eef;box-shadow:0 3px 0 #224466}
.br{background:linear-gradient(180deg,#ff8866,#cc2244);color:#fff;box-shadow:0 3px 0 #7a1030,0 4px 16px rgba(255,60,60,.35);animation:bl .8s steps(2,start) infinite}   /* V31: BOSS RUSH — the practice-mode button pulses crimson */
.ag{background:linear-gradient(180deg,#88e0ff,#2a7fb8);color:#032a44;box-shadow:0 3px 0 #14456a,0 4px 16px rgba(60,180,255,.35);animation:bl .8s steps(2,start) infinite}   /* V33: APEX GAUNTLET — the hardest-boss practice button pulses ice-blue */
.nv{background:linear-gradient(180deg,#ffffff,#ff5ce8);color:#2a0a24;box-shadow:0 3px 0 #8a1a5f,0 4px 16px rgba(255,92,232,.4);animation:bl .8s steps(2,start) infinite}   /* V42: NOVA RUSH — the endgame practice button pulses white-hot magenta */
.dl{background:linear-gradient(180deg,#ffe98a,#ff9d2e);color:#3a2200;box-shadow:0 3px 0 #a35b00,0 4px 16px rgba(255,190,60,.4);animation:bl .8s steps(2,start) infinite}   /* V43: DAILY CHALLENGE — the shared-seed button pulses sun-gold */
.br{background:linear-gradient(180deg,#ff5577,#cc2244);color:#fff;box-shadow:0 3px 0 #771122}
.dif{display:flex;gap:8px;justify-content:center;margin:10px 0 2px}
.dif button{padding:8px 16px;font-size:11px;border-radius:4px;letter-spacing:2px}
.dif .on{background:linear-gradient(180deg,#ffcc44,#ee8800);color:#1a0800;box-shadow:0 3px 0 #996600}
.dif .off{background:rgba(255,255,255,.07);color:#88aacc;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.ps{font-size:22px;color:#7CFC00;letter-spacing:5px;margin-top:10px;text-shadow:0 0 18px rgba(124,252,0,.85);animation:bl 1s steps(2,start) infinite}   /* V44: the arcade PRESS START beacon */
.modes{margin-top:10px;max-width:520px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px 18px}   /* V49: the MODES panel — one human row per mode instead of a caption blob */
.dlycta{font-size:12px;color:#ffd75e;letter-spacing:2px;margin-top:5px;text-shadow:0 0 12px rgba(255,215,94,.7);animation:bl 1.6s steps(2,start) infinite}   /* V50: the empty-board nudge — PLAY TODAY'S RUN in human words, pulsing like an arcade INSERT COIN */
.mhead{font-size:10px;color:#8899aa;letter-spacing:4px;margin-bottom:8px}
.mrow{display:flex;align-items:baseline;gap:10px;font-size:11px;color:#9fc2e0;line-height:2;text-align:left}
.mtag{min-width:112px;font-weight:bold;letter-spacing:1px}
.mdesc{flex:1}
.pshint{font-size:9px;color:#667788;letter-spacing:2px;margin:2px 0 8px}   /* V44: the fine print under PRESS START */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px 20px;margin-top:6px}   /* V44: controls as a compact two-column grid (one column on narrow screens) */
.crow{display:flex;gap:8px;align-items:baseline;font-size:11px;color:#9fc2e0;line-height:2}
.pickleg{font-size:10px;color:#9fc2e0;margin-top:8px;line-height:1.9}
@keyframes bl{50%{opacity:0}}
.newhi{color:#ffcc44;font-size:18px;font-weight:bold;letter-spacing:3px;margin-bottom:6px;text-shadow:0 0 18px rgba(255,200,60,.8);animation:bl 0.5s steps(2,start) infinite}
/* initials entry */
.ie{background:rgba(255,255,255,.05);border:1px solid rgba(255,200,60,.35);border-radius:8px;padding:10px 18px 14px;margin:8px 0}
.iel{color:#ffcc44;font-size:11px;letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 8px rgba(255,200,60,.6)}
.islots{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:8px}
.islot{display:flex;flex-direction:column;align-items:center;gap:3px}
.islot .ln{font-size:30px;font-weight:bold;color:#fff;width:44px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:rgba(0,0,0,.4);text-shadow:0 0 10px rgba(255,200,60,.7)}
.islot.sel .ln{border-color:#ffcc44;box-shadow:0 0 14px rgba(255,200,60,.55)}
.islot button{width:44px;padding:4px 0;font-size:12px;background:rgba(255,200,60,.12);color:#ffcc44;box-shadow:none;border:1px solid rgba(255,200,60,.25);border-radius:4px}
.iekeys{font-size:9px;color:#667788;letter-spacing:1px;margin-bottom:7px;text-shadow:none}
@media (hover:none) and (pointer:coarse){.iekeys{display:none}}   /* touch players use the ▲▼ buttons — no keyboard hints */
#msgs{position:fixed;left:50%;top:50px;transform:translateX(-50%);z-index:20;pointer-events:none;text-align:center}
.m{padding:3px 12px;font-size:13px;font-weight:bold;margin-bottom:4px;animation:mf 1.2s forwards;white-space:nowrap}   /* V59: the banner fade matches the 1.2s removal — no words linger */
@keyframes mf{0%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.9) translateY(-10px)}}
.mw{color:#ff4444;text-shadow:0 0 8px #ff0000}.mb{color:#ffcc44;text-shadow:0 0 8px #ff8800}.mi{color:#55aaff;text-shadow:0 0 8px #0066ff}.mg{color:#44ff88;text-shadow:0 0 8px #00aa44}

/* ============ TOUCH CONTROLS (mobile only) ============ */
#touch{position:fixed;inset:0;z-index:80;pointer-events:none;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}   /* notch/home-bar insets: absolute touch controls are positioned from the padding box */
body.touch.playing #touch{display:block}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);display:none;box-shadow:inset 0 0 18px rgba(0,0,0,.4)}
#joyThumb{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,204,68,.45);border:2px solid #ffcc44;box-shadow:0 0 14px rgba(255,204,68,.6)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);color:#fff;font-family:'Courier New',monospace;font-weight:bold;letter-spacing:1px;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none}
#btnFire{width:88px;height:88px;right:22px;bottom:96px;background:rgba(255,90,90,.16);border-color:rgba(255,120,120,.5);color:#ffcc44;font-size:14px}
#btnBomb{width:62px;height:62px;right:120px;bottom:26px;background:rgba(85,170,255,.16);border-color:rgba(120,190,255,.5);color:#9fd0ff;font-size:12px}
#btnWeapon{width:62px;height:62px;right:22px;bottom:20px;background:rgba(68,255,136,.14);border-color:rgba(120,255,180,.45);color:#8dffb8;font-size:11px}
#btnPause{width:46px;height:46px;right:14px;top:52px;font-size:13px;color:#ffcc44}
#btnSnd{width:46px;height:46px;right:70px;top:52px;font-size:16px;color:#ffcc44}
.tbtn:active{filter:brightness(1.4)}

/* === V20: compact overlays for short landscape screens (≤430px tall) === */
@media (max-height:430px){
  #overlay{padding:8px}
  .modes{padding:6px 10px;margin-top:4px}
  .dlycta{font-size:10px;margin-top:2px}
  .mtag{min-width:84px;font-size:10px}
  .mrow{font-size:10px;line-height:1.7}
  #overlay h1{font-size:min(11vw,34px);letter-spacing:5px}
  #overlay h2{font-size:11px;letter-spacing:4px;margin-bottom:6px}
  .box{padding:7px 12px;margin:5px 0;font-size:10px;line-height:1.7}
  .k{font-size:9px;padding:0 5px}
  .mission{font-size:10px;margin:0 0 2px}
  .panels{gap:10px}
  .hs{padding:6px 10px;margin:5px 0;min-width:210px}
  .hsrow{font-size:10px;padding:1px 0}
  .grade{font-size:32px;margin:0 0 2px}
  .stats{gap:6px 10px;margin:2px 0 2px;min-width:0}
  .st{padding:4px 8px}
  .sl{font-size:8px}
  .sv{font-size:15px}
  .newhi{font-size:13px;margin-bottom:2px}
  .ie{padding:4px 8px;margin:4px 0}
  .iel{font-size:10px;margin-bottom:3px}
  .islot .ln{font-size:20px;width:32px;height:28px}
  .islot button{width:32px;padding:2px 0;font-size:10px}
  .islots{gap:6px}
  .iekeys{font-size:8px}
  .dif{margin:4px 0 0}
  .dif button{padding:6px 12px;font-size:10px}
  .btns{margin-top:2px}
  button{padding:8px 18px;font-size:12px}
  .hero{padding:11px 30px;font-size:15px}
  .ps{font-size:16px;margin-top:4px}
  .pshint{font-size:8px;margin:1px 0 5px}
  .ver{margin-top:2px;font-size:9px}
}
/* Short touch screens: keyboard hints / over-screen leaderboard are irrelevant there — keep the fold tight */
@media (max-height:430px) and (hover:none) and (pointer:coarse){
  #overlay.title .box{display:none}
  #overlay.over .hs{display:none}
}
/* Very short screens (≤360px tall): shrink the touch buttons so they never crowd the play field */
@media (max-height:360px){
  /* plain px only: #touch's env() padding already insets the padding box the buttons position from */
  #btnFire{width:76px;height:76px;right:16px;bottom:78px;font-size:12px}
  #btnBomb{width:54px;height:54px;right:104px;bottom:22px;font-size:11px}
  #btnWeapon{width:54px;height:54px;right:16px;bottom:16px;font-size:10px}
  #btnPause{width:40px;height:40px;right:10px;top:44px;font-size:12px}
  #btnSnd{width:40px;height:40px;right:56px;top:44px;font-size:14px}
}
</style>
</head>
<body>
<div id="rotate-prompt">
  <div class="icon">📱</div>
  <div class="msg">Rotate your phone to play</div>
  <div class="sub">↻ Landscape mode required</div>
</div>
<canvas id="C"></canvas>
<div id="hud">
  <div><span class="hi" id="sc">000000</span><span class="hv" id="grz">✧0</span></div>
  <div><span class="hw" id="wv">1</span><span class="hvr" id="rushTag"></span></div>
  <div><span class="hl" id="lv">♥♥♥</span></div>
  <div><span class="hb" id="bm">★★</span></div>
  <div><span class="hwpn" id="wpn">VULCAN</span><span class="hp" id="pw">░░░░░</span><span class="hchg" id="chg">░░░░░</span></div>
</div>
<div id="bossbar"><div class="bbn" id="bbn">DREADNOUGHT</div><div class="bbw"><div id="bbf"></div></div></div>
<div id="msgs"></div>
<div id="overlay" class="show title"></div>
<div id="crt"></div>
<div id="touch">
  <div id="joy"><div id="joyThumb"></div></div>
  <button id="btnFire" class="tbtn">FIRE</button>
  <button id="btnBomb" class="tbtn">BOMB</button>

function uid(){return (Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toUpperCase();}
function loadHS(){try{var a=JSON.parse(localStorage.getItem(HS_KEY)||'[]');if(!Array.isArray(a))a=[];var ch=false;for(var i=0;i<a.length;i++){if(!a[i].id){a[i].id=uid();ch=true;}if(!a[i].name)a[i].name='---';}if(ch)saveHS(a);return a;}catch(e){return[];}}
function saveHS(a){try{localStorage.setItem(HS_KEY,JSON.stringify(a.slice(0,5)));}catch(e){}}
function prepHS(score,wave){
  var entry={id:uid(),score:score,wave:wave,date:new Date().toISOString().slice(0,10),name:'---'};
  var list=loadHS().concat([entry]);
  list.sort(function(a,b){return b.score-a.score;});
  list=list.slice(0,5);
  var rank=-1;for(var i=0;i<list.length;i++)if(list[i].id===entry.id){rank=i;break;}
  return {entry:entry,qualifies:rank>=0,rank:rank,top:list};
}
function commitHS(entry){var a=loadHS();var found=false;for(var i=0;i<a.length;i++)if(a[i].id===entry.id){found=true;break;}if(!found){a.push(entry);a.sort(function(x,y){return y.score-x.score;});saveHS(a);}}
function nameEntry(id,name){var a=loadHS();for(var i=0;i<a.length;i++)if(a[i].id===id){a[i].name=name;}saveHS(a);}
function recordScore(score,wave,lives,name){var p=prepHS(score,wave);p.entry.name=name||'AAA';commitHS(p.entry);return {qualifies:p.qualifies,rank:p.rank,top:p.top,id:p.entry.id};}

/* ============ V46: DAILY LEADERBOARD ============ */
/* A second high-score table that only accepts DAILY CHALLENGE runs — each entry is stamped
   with the seed + date it was played on, and the board shows only TODAY's seed's entries
   (yesterday's board naturally rolls off at midnight). Storage keeps the top 5 per seed, so
   old records aren't discarded until a better run or a newer seed pushes them out. */
var DL_KEY='skyDriftDaily';
function loadDaily(){try{var a=JSON.parse(localStorage.getItem(DL_KEY)||'[]');if(!Array.isArray(a))a=[];var ch=false;for(var i=0;i<a.length;i++){if(!a[i].id){a[i].id=uid();ch=true;}if(!a[i].name)a[i].name='---';if(typeof a[i].seed!=='number'||!isFinite(a[i].seed)){a[i].seed=0;ch=true;}if(!a[i].date)a[i].date='';}if(ch)saveDaily(a);return a;}catch(e){return[];}}
function saveDaily(a){   // the write boundary enforces top-5-per-seed and bounds history to the 30 most recent seeds (~150 entries max)
  try{
    var srt=a.slice().sort(function(x,y){return y.score-x.score;});
    var out=[],cnt={};for(var i=0;i<srt.length;i++){var s=srt[i].seed;cnt[s]=(cnt[s]||0)+1;if(cnt[s]<=5)out.push(srt[i]);}
    var seeds={},order=[];for(var j=0;j<out.length;j++){if(!seeds[out[j].seed]){seeds[out[j].seed]=true;order.push(out[j].seed);}}
    order.sort(function(a,b){return b-a;});   // seeds are YYYYMMDD — the largest are the most recent
    var keep={};for(var k=0;k<order.length&&k<30;k++)keep[order[k]]=true;
    localStorage.setItem(DL_KEY,JSON.stringify(out.filter(function(e){return keep[e.seed];})));
  }catch(e){}
}
function prepDaily(score,wave,seed){   // qualification vs TODAY's board (same shape as prepHS)
  var entry={id:uid(),score:score,wave:wave,seed:seed||0,date:new Date().toISOString().slice(0,10),name:'---'};
  var list=loadDaily().filter(function(e){return e.seed===entry.seed;}).concat([entry]);
  list.sort(function(a,b){return b.score-a.score;});list=list.slice(0,5);
  var rank=-1;for(var i=0;i<list.length;i++)if(list[i].id===entry.id){rank=i;break;}
  return {entry:entry,qualifies:rank>=0,rank:rank,top:list};
}
function commitDaily(entry){   // insert (if new); the per-seed top-5 + seed bound live in saveDaily
  var a=loadDaily(),found=false;for(var i=0;i<a.length;i++)if(a[i].id===entry.id){found=true;break;}
  if(!found)a.push(entry);
  saveDaily(a);
}
function nameDailyEntry(id,name){var a=loadDaily();for(var i=0;i<a.length;i++)if(a[i].id===id){a[i].name=name;}saveDaily(a);}

  spawnBurst:function(){
    if(!this.fmtSet)this.assignFormation();   // safety net: a wave started without waveClear (direct state pokes)
    var f=this.fmt;
    var grp=Math.min(2+Math.ceil(this.wave/2),9);          // density escalates: 3@w1 → 9@w14+
    grp=Math.min(grp,this.waveTarget-this.eSpawned);       // never overshoot the wave's enemy count
    if(grp<=0)return;
    this.fmtY=(this.fmtY||0)+.28;if(this.fmtY>1)this.fmtY-=1;   // each squad sweeps a third of the screen lower
    var y0=60+this.fmtY*(H-120);
    var sm=(1+this.wave*.05)*this.difx.sp,G2=this;
    var sz=ETYPES[0].sz;
    function mk(x,y,vx,vy,mt,ph,ps,st,ti){
      var t=ETYPES[ti],hp=t.hp*G2.difx.hp*G2.waveHpMult();
      G2.enemies.push({x:x,y:y,vx:vx*sm,vy:vy,hp:hp,mhp:hp,sc:Math.round(t.sc*G2.waveScMult()),size:t.sz,c:t.c,sh:t.sh,sho:t.sho,ph:ph,ps:ps||.04+Math.random()*.04,mt:mt,st:st||(1400+Math.random()*1800)*G2.difx.fr,hf:0,eg:0,elite:t.sh==='elite'});
    }
    var i,k=(grp-1)/2,tp=f.tp;
    if(f.id==='v'){                       // chevron fanning back from center, sine wobble
      for(i=0;i<grp;i++)mk(W+sz+Math.abs(i-k)*26,y0+(i-k)*30,-(1+Math.abs(i-k)*.06),0,'sine',i*.5,0,0,tp[i%2]);
    }else if(f.id==='pincer'){            // two columns diving up/down, converging on the player's lane
      for(i=0;i<grp;i++){var j=Math.floor(i/2),top=i%2===0;
        mk(W+40+j*26,top?26+j*34:H-26-j*34,-(1+j*.03),top?.95:-.95,'straight',0,0,550,tp[i%2]);}
    }else if(f.id==='sinewall'){          // vertical wall, shared phase -> undulates in sync
      for(i=0;i<grp;i++)mk(W+sz+(grp-1-i)*8,y0+(i-k)*(H*.62/Math.max(grp,2)),-1,0,'sine',0,.06,0,tp[i%2]);
    }else if(f.id==='dive'){              // diagonal dive sweep, eager fire timers
      for(i=0;i<grp;i++)mk(W+sz+i*20,y0+i*24,-1.15,1.1,'straight',0,0,420,tp[i%2]);
    }else{                                // shield: two staggered rows of heavy/elite, slow

        mk(W+sz+row*30+j2*12,y0+(j2-(grp-1)/4)*34,-.55,0,'straight',0,0,900,(G2.wave>=8&&i%3===2)?5:tp[i%2]);}
    }
    this.eSpawned+=grp;
  },

  bossAt:function(w){var ti=Math.floor(w/5)-1,idx=((ti%3)+3)%3;if(this._bossOrder)idx=this._bossOrder[idx];return BOSS_TYPES[idx];},   // V34/V42: the 5/10/15 rotation, single-sourced — practice modes shuffle it via _bossOrder (campaign keeps the fixed order)
  makeRng:function(seed){   // V43: a mulberry32-style seeded LCG — the shared engine behind the daily seeds (deterministic in tests, and identical for every player on the same day)
    var s=(typeof seed==='number'?seed:Date.now()|0)>>>0;
    return function(){s=(s+0x6D2B79F5)|0;var x=Math.imul(s^(s>>>15),1|s);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296;};},
  dailySeed:function(date){   // V43: the day's seed — a UTC calendar date folded into one integer (YYYYMMDD). UTC so every player worldwide shares the same challenge day. Injectable date for tests

  seedDate:function(seed){   // V49: turn a YYYYMMDD seed into a human date (20260806 -> 2026-08-06) — players read a date, not a code

  buildDropTable:function(seed,len){   // V43: the day's precomputed power-up layout — one {n,t,e} roll triple per kill slot (n=drop roll, t=normal type roll, e=elite type roll), so the same kills yield the same drops for everyone

  updateBoss:function(dt){

      this.hideBossBar();

        b.downPlayed=true;sfx('down');sfx('vict');musicPlayTier(0);   // explosion boom + triumphant fanfare, then drop the build to calm (before the 'clear' jingle at bossClear)
        var kf=b.fleet||1;this.fleetKills[kf]=(this.fleetKills[kf]||0)+1;   // V37: fleet-ladder kill count
        if(!this.rush&&!this.apex&&!this.nova){var fb=this.loadFB(),cl=performance.now()-(b.stT||performance.now()),dk=this.difKey();if(cl>0&&(!fb[kf][dk]||cl<fb[kf][dk])){fb[kf][dk]=Math.round(cl);this.saveFB(fb);}}   // V37/V42: best clear time per DIFFICULTY, clamped to sane values (practice never pollutes the ladder)
      }

      if(!b._fx){b._fx=1;this.deathFlourish(b);}   // V42: the fleet's signature death flourish (fires exactly once)
      if(b.deadt<1100){
        if(Math.random()<.55)this.boom(b.x+(Math.random()-.5)*90,b.y+(Math.random()-.5)*90,'#ffaa44',6,5);
        if(Math.random()<.3)this.boom(b.x+(Math.random()-.5)*60,b.y+(Math.random()-.5)*60,'#fff',5,3);
        if(bShard&&Math.random()<.4)this.shatter(b.x+(Math.random()-.5)*100,b.y+(Math.random()-.5)*70,bShard,4);   // and keeps shedding during the explosion
        this.shake=Math.max(this.shake,8);this.flash=Math.max(this.flash,.08);

    }

  shoot:function(){

    var rate=this.wtype==='missile'?Math.max(300,540-pw*50):this.wtype==='laser'?110:this.wtype==='spreader'?130:this.power<2?110:80;
    if(now-this.lastShot<rate)return;this.lastShot=now;
    if(this.wtype==='vul')this.shootVulcan(pw);
    else if(this.wtype==='laser')this.shootLaser(pw);
    else if(this.wtype==='missile')this.shootMissile(pw);
    else this.shootSpreader(pw);
    this.shots++;
    this.flashes.push({x:this.px+30,y:this.py,t:70});
    if(this.wtype==='laser')sfx('lshot');
    else if(this.wtype==='missile')sfx('mshoot');
    else if(this.wtype==='spreader')sfx('lock');

  shootVulcan:function(pw){

    if(pw===0){mk(px+30,py,sp,0,1);}
    else if(pw===1){mk(px+30,py-3,sp,0,1);mk(px+30,py+3,sp,0,1);}
    else if(pw===2){mk(px+30,py,sp,0,1);mk(px+26,py-7,sp,-.8,1);mk(px+26,py+7,sp,.8,1);}
    else if(pw===3){mk(px+30,py,sp*1.1,0,2);mk(px+26,py-5,sp,-.5,1);mk(px+26,py+5,sp,.5,1);mk(px+22,py-12,sp*.9,-1.5,1);mk(px+22,py+12,sp*.9,1.5,1);}
    else if(pw===4){mk(px+30,py,sp*1.2,0,3);mk(px+26,py-4,sp,-.3,1);mk(px+26,py+4,sp,.3,1);mk(px+22,py-10,sp*.85,-1.2,1);mk(px+22,py+10,sp*.85,1.2,1);mk(px+18,py-16,sp*.7,-2,1);mk(px+18,py+16,sp*.7,2,1);}
    else{mk(px+30,py,sp*1.3,0,3);mk(px+27,py-4,sp*1.05,-.3,1);mk(px+27,py+4,sp*1.05,.3,1);mk(px+24,py-9,sp*.95,-.8,1);mk(px+24,py+9,sp*.95,.8,1);mk(px+20,py-14,sp*.8,-1.5,1);mk(px+20,py+14,sp*.8,1.5,1);mk(px+16,py-19,sp*.65,-2.1,1);mk(px+16,py+19,sp*.65,2.1,1);}

  shootMissile:function(pw){

  /* V30: SPREADER — the lock-on weapon. A fan of fast tracer bolts, each of which locks the
     nearest enemy AHEAD (lock radius grows with power) and steers toward it with a light turn.
     It is the flexible all-rounder: every bolt finds its own target, so it splits across a crowd
     (group DPS >> single) but converges on one target (single DPS sits between missile and vul —
     the weakest hold gun stays the boss-killer). Per-bolt damage table + fan size below. */
  shootSpreader:function(pw){
    var n=[1,2,3,3,4,4][Math.min(pw,5)],sp=19+Math.min(pw,3),lr=130+pw*55,c='#7dff9e';
    for(var i=0;i<n;i++){
      var dy=(i-(n-1)/2)*10;   // vertical spread across the fan
      this.bullets.push({x:this.px+30,y:this.py+dy,vx:sp,vy:0,d:SPR_BOLT[Math.min(pw,5)],c:c,sp:true,tgt:null,lockR:lr});
    }
    if(this.bullets.length>40)this.bullets.splice(0,this.bullets.length-40);
  },

  fireOverdrive:function(c){
    // released charge shot — V29: TWO release tiers. FAST BURST (release at 50-74.99%) is a flat
    // half-strength burst with snappier projectiles and lighter feedback; OVERDRIVE (>=75%) is the
    // fill-scaled heavy hit. Both deal ~1.0x the burst table per second of charging, so neither
    // dominates on DPS — the tradeoff is per-hit impact vs. commitment (and mid-charge risk).
    var pw=this.wp[this.wtype],fast=c<.75,fill=fast?.5:c,base=OD_BURST[this.wtype][Math.min(pw,5)];
    this.chg=0;this.hitStop=Math.max(this.hitStop,fast?35:70);this.flash=Math.max(this.flash,fast?.15:.2);this.shake=Math.max(this.shake,fast?4:7);
    sfx(fast?'fast':'charge');   // V59: the beam visuals + stinger carry the mode — no text
    var sx=Math.min(this.px,W-80),sp=fast?1.32:1;   // clamp spawn x (right-edge charges aren't wasted); fast-tier bolts fly 32% quicker
    if(this.wtype==='vul'){            // TIGHT fan: a center cannon (the whole identity — boss-killer) + four small finisher wings
      var cd=Math.round(base*fill),wd=Math.max(3,Math.round(cd*.07));
      for(var k=-2;k<=2;k++)this.bullets.push({x:sx+30,y:this.py,vx:27*sp,vy:k*2.2,d:k===0?cd:wd,c:k===0?'#fff2b0':'#ffcc44',big:true});
    }else if(this.wtype==='laser'){    // one colossal piercing beam — damage per frame it overlaps a target
      this.beams.push({x:sx+30,y:this.py,vx:34*sp,len:300+pw*50,hw:10+pw*2,dmg:base*fill,t:320});
      if(this.beams.length>6)this.beams.shift();
    }else if(this.wtype==='missile'){  // missile: a six-missile volley at once
      var md=Math.round(base*fill);
      for(var i=0;i<6;i++)this.missiles.push({x:sx+16,y:this.py+(i-2.5)*7,vx:4,vy:0,a:0,spd:4,maxsp:(20+pw*2)*sp,dmg:md,pw:pw,t:3000});
      if(this.missiles.length>16)this.missiles.shift();
    }else{                             // spreader: CHAIN LIGHTNING — strike the nearest target, then arc to nearby others (60% decay per hop)
      var dmg=Math.round(base*fill),hops=3+Math.min(pw,3),pts=[],used=[],cur=null,chainDmg=[dmg];
      var sd=1e9,bossFirst=false;
      for(var j=0;j<this.enemies.length;j++){var e=this.enemies[j];var dd=Math.hypot(e.x-this.px-30,e.y-this.py);if(dd<sd){sd=dd;cur=e;}}
      if(!cur&&this.boss&&!this.boss.dead){cur=this.boss;bossFirst=true;}
      if(cur){
        pts.push({x:cur.x,y:cur.y});used.push(cur);
        if(bossFirst){this.hurtBoss(dmg);this.boss.flash=1;this.boom(this.boss.x,this.boss.y,'#7dff9e',10,5);}
        else{cur.hp-=dmg;cur.hf=1;sfx('hit');this.boom(cur.x,cur.y,'#7dff9e',8,4);   // the hit sound plays on the strike — the hops stay quiet so a 6-arc chain doesn't stack noise
          if(cur.hp<=0){var ci=this.enemies.indexOf(cur);if(ci>=0)this.killEnemy(cur,ci);}}
        for(var h=0;h<hops;h++){
          dmg=Math.round(dmg*CHAIN_DECAY);if(dmg<1)break;
          var next=null,nd2=CHAIN_R*CHAIN_R;
          for(var j2=0;j2<this.enemies.length;j2++){var e2=this.enemies[j2];
            if(used.indexOf(e2)>=0)continue;
            var dd2=(e2.x-cur.x)*(e2.x-cur.x)+(e2.y-cur.y)*(e2.y-cur.y);
            if(dd2<nd2){nd2=dd2;next=e2;}}
          if(!next)break;   // no unused target in range — the chain ends; record only real hops
          chainDmg.push(dmg);
          next.hp-=dmg;next.hf=1;this.boom(next.x,next.y,'#7dff9e',7,3);   // visual only — no per-hop sfx
          if(next.hp<=0){var ni=this.enemies.indexOf(next);if(ni>=0)this.killEnemy(next,ni);}
          pts.push({x:next.x,y:next.y});used.push(next);cur=next;
        }
        this.chains.push({pts:pts,t:450,dmg:chainDmg,from:{x:this.px+30,y:this.py}});   // 'from' anchors the strike arc at the cannon
        if(this.chains.length>8)this.chains.shift();
      }
      // V59: the arcing chain visuals carry the moment — no text popup
    }
  },

  shatter:function(x,y,c,n){   // V36: VOID SHATTER — spinning violet shards from VOID enemies' deaths (fleet-4 gimmick)

  killEnemy:function(e,i){
    var pts=e.sc*this.combo;
    this.score+=pts;this.kills++;

    if(this.combo===5||this.combo===10)sfx('combo');   // V59: the combo meter + kill flash carry it — no words
    this.boom(e.x,e.y,e.c,26,5);this.boom(e.x,e.y,'#ffcc44',10,3);   // V59: the double-burst + shake + flash replace the +pts float
    if(e.vo)this.shatter(e.x,e.y,e.vo,6);   // V36: killing a VOID droid bursts it into violet shrapnel (danger at close range)
    this.particles.push({x:e.x,y:e.y,vx:0,vy:0,life:.5,decay:.02,size:8,color:'#fff'});
    sfx('boom');this.shake=6;this.flash=.12;this.fc='#fff';this.hitStop=45;
    var dropChance=e.elite?1:.3;
    if(this.dropTable){   // V43: the DAILY challenge consumes the date-seeded drop layout — the same kill order gives every player the same power-ups (campaign/practice keep Math.random below)
      var D=this.dropTable[this.dropIdx++%this.dropTable.length],t;
      if(e.elite){t=D.e<.4?'power':D.e<.75?'w':'shield';}
      else if(D.n<.3){t=D.t<.32?'power':D.t<.6?'w':D.t<.74?'shield':D.t<.84?'bomb':D.t<.92?'life':'mystery';}   // V66: the tail of the roll (~8%) is the mystery box
      if(t)this.powerups.push({x:e.x,y:e.y,vx:-.5,vy:0,type:t,ph:0,wsub:t==='w'?this.wsubRoll(e.elite?D.e:D.t):null});   // V66: weapon crystals carry WHICH weapon — from the SAME roll that decided the type (D.e for elites, D.t for normals), so the daily stays deterministic and the crystal's weapon always follows its type roll
    }
    else if(Math.random()<dropChance){
      var r=Math.random(),t;
      if(e.elite){t=r<.4?'power':r<.75?'w':'shield';}
      else{t=r<.32?'power':r<.6?'w':r<.74?'shield':r<.84?'bomb':r<.92?'life':'mystery';}
      this.powerups.push({x:e.x,y:e.y,vx:-.5,vy:0,type:t,ph:0,wsub:t==='w'?this.wsubRoll(r):null});

  missileBoom:function(m){
    var rad=52+m.pw*8,dmg=m.dmg;
    this.boom(m.x,m.y,'#ffaa33',16,6);this.boom(m.x,m.y,'#fff',8,3);this.boom(m.x,m.y,'#ff6644',12,4);

    sfx('mboom');this.shake=3;
    for(var j=this.enemies.length-1;j>=0;j--){

    this.hbLow+=(hbT-this.hbLow)*Math.min(1,dt*.004);
    if(MUS.step!==this._hbStep){this._hbStep=MUS.step;this._hbLiveT=performance.now();
      if(this.hbLow>.01){var hm=MUS.step%8;if(hm===0)this.hbEnv=1;else if(hm===2)this.hbEnv=Math.max(this.hbEnv,.55);}   // audio live: thump/lub-dub land EXACTLY on the grid
    }else if(this.hbLow>.01&&performance.now()-this._hbLiveT>300){   // scheduler idle: free-running heartbeat at the same tempo-scaled interval
      this.hbT+=dt;
      var hbIv=120/MUS.tempo;   // 8 sixteenths (matches musicStep's s%8===0)
      if(this.hbT>=hbIv){this.hbT-=hbIv;this.hbEnv=1;}
      if(this.hbT>=hbIv*.5&&!this.hbDub){this.hbDub=true;this.hbEnv=Math.max(this.hbEnv,.55);}
      else if(this.hbT<hbIv*.5)this.hbDub=false;
    }
    this.hbEnv=Math.max(0,this.hbEnv-dt*.004);   // ~250ms decay tail
    this.hud();
  },

  waveClear:function(){

    var bfl=this.wave%5===0?this.bossFleet():0;   // V34/35: the warning carries its fleet for the banner tint (V42: config-driven via bossFleet)
    var bF=bfl?BOSS_PALETTES[bfl-1]:null;   // V35: fleet presentation (tag/suf) comes from the palette row
    var sub=bfl?'⚠ '+((bF&&bF.tag)?bF.tag+' BOSS':'BOSS')+' AHEAD ⚠':'FORMATION: '+this.assignFormation().name;

  /* ---------- attract-mode demo (title screen) ---------- */
  initDemo:function(){
    this.demo={x:W*.3,y:H*.5,t:0,fire:0,enemies:[],bullets:[]};
  },
  updateDemo:function(dt){
    if(!this.demo)this.initDemo();
    var d=this.demo;d.t+=dt;
    d.y=H*.5+Math.sin(d.t*.001)*H*.22;d.x=W*.3+Math.sin(d.t*.0007)*W*.06;
    d.fire-=dt;
    for(var i=0;i<this.stars.length;i++){var s=this.stars[i];s.x-=s.sp*dt/16.67;if(s.x<-5)s.x=W+5;}
    this.neb+=dt*.0002;
    if(Math.random()*dt<.9&&d.enemies.length<4){
      var t=ETYPES[Math.floor(Math.random()*3)];
      d.enemies.push({x:W+40,y:60+Math.random()*(H-120),vx:-2.2,hp:1,mhp:1,size:t.sz,c:t.c,sh:t.sh,ph:Math.random()*6.28,ps:.05,st:0,hf:0,eg:0});
    }
    if(d.fire<=0){d.fire=300;if(d.bullets.length<30)d.bullets.push({x:d.x+28,y:d.y,vx:15,vy:0,c:'#55ddff'});}
    for(var i=d.enemies.length-1;i>=0;i--){var e=d.enemies[i];e.ph+=e.ps*dt/16.67;e.x+=e.vx*dt/16.67;e.y+=Math.sin(e.ph)*1.6*dt/16.67;if(e.x<-60)d.enemies.splice(i,1);}
    for(var i=d.bullets.length-1;i>=0;i--){
      var b=d.bullets[i];b.x+=b.vx*dt/16.67;var dead=false;
      for(var j=d.enemies.length-1;j>=0;j--){
        var e=d.enemies[j];
        if(Math.hypot(b.x-e.x,b.y-e.y)<e.size){this.boom(e.x,e.y,e.c,14,3);d.enemies.splice(j,1);dead=true;break;}
      }
      if(dead||b.x>W+20)d.bullets.splice(i,1);
    }
    // decay shared FX so attract-mode explosions never pile up on the title screen
    for(var i=this.particles.length-1;i>=0;i--){var p=this.particles[i];p.x+=p.vx*dt/16.67;p.y+=p.vy*dt/16.67;p.vx*=.96;p.vy*=.96;p.vy+=.03*dt/16.67;p.life-=p.decay*dt/16.67;if(p.life<=0)this.particles.splice(i,1);}
    for(var i=this.shockwaves.length-1;i>=0;i--){var s=this.shockwaves[i];s.r+=(s.max-s.r)*.12*dt/16.67;s.life-=.04*dt/16.67;if(s.life<=0)this.shockwaves.splice(i,1);}
  },

  hbZoom:function(){return 1+this.hbLow*this.hbEnv*.002;},   // 1-2px zoom (0.2% at peak), gated by the low-life fade

  renderBG:function(){

    if(ph<.28){
      var p2=ph/.28,sy=((cycle*577)%Math.max(1,H*.55))+20,ssx=W+140-p2*(W+300),ly=sy+p2*170;

    ng.addColorStop(0,'hsla('+hue+',75%,32%,.17)');ng.addColorStop(1,'transparent');
    X.fillStyle=ng;X.fillRect(0,0,W,H);
    var ng2=GX('bg_neb2_'+hue+'_'+W+'_'+H,function(){var g=X.createRadialGradient(W*.22,H*.72,0,W*.22,H*.72,W*.4);g.addColorStop(0,'hsla('+((hue+150)%360)+',70%,28%,.14)');g.addColorStop(1,'transparent');return g;});   // V56: fixed-position layers — cached by wave hue + size
    X.fillStyle=ng2;X.fillRect(0,0,W,H);
    var ng3=GX('bg_neb3_'+hue+'_'+W+'_'+H,function(){var g=X.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,W*.3);g.addColorStop(0,'hsla('+((hue+60)%360)+',60%,22%,.10)');g.addColorStop(1,'transparent');return g;});

    X.fillStyle=dl;X.fillRect(0,0,W,H);

  drawBeam:function(b){

  drawChain:function(ch){   // V30: lightning — the strike arcs from the cannon, then jagged hops between targets, glowing, fades out
    X.save();X.globalCompositeOperation='lighter';
    var a=Math.max(0,ch.t)/450;
    function seg(p0,p1,jr){   // draw one arc as 3 polylines (glow / mid / core) with a deterministic perpendicular jitter
      var mx=(p0.x+p1.x)/2,my=(p0.y+p1.y)/2,dx=p1.x-p0.x,dy=p1.y-p0.y,len=Math.hypot(dx,dy)||1;
      var px=-dy/len,py=dx/len,h=(Math.sin(jr*12.9898)*43758.5453%1)*jr-.5;   // deterministic — the bolt must not flicker
      var jx=mx+px*h*26,jy=my+py*h*26;
      X.beginPath();X.moveTo(p0.x,p0.y);X.lineTo(jx,jy);X.lineTo(p1.x,p1.y);
      X.globalAlpha=.18*a;X.strokeStyle='#7dff9e';X.lineWidth=6;X.stroke();
      X.globalAlpha=.5*a;X.lineWidth=2;X.stroke();
      X.globalAlpha=.9*a;X.strokeStyle='#fff';X.lineWidth=1;X.stroke();
    }
    if(ch.from&&ch.pts.length)seg(ch.from,ch.pts[0],1);   // muzzle arc: cannon -> first strike
    for(var k=0;k<ch.pts.length-1;k++)seg(ch.pts[k],ch.pts[k+1],k+2);
    for(var k=0;k<ch.pts.length;k++){var p=ch.pts[k];X.globalAlpha=.8*a;X.fillStyle='#fff';X.beginPath();X.arc(p.x,p.y,2.5,0,6.28);X.fill();}

  drawP:function(p){
    X.save();X.translate(p.x,p.y);var pulse=1+Math.sin(p.ph)*.12;X.scale(pulse,pulse);X.rotate(p.ph*.5);
    var cs={power:'#ff8844',shield:'#55aaff',bomb:'#ff5577',life:'#ffcc44',w:'#44ff88',mystery:'#ffd23f'},c=p.type==='w'?(this.wcol[p.wsub]||'#44ff88'):cs[p.type];   // V62: the tile keeps its type color; V64: each white pictogram depicts what the pickup DOES; V65: the TILE silhouette is per-type too; V66: a weapon crystal tints with the weapon it grants (laser cyan / missile amber / spreader green — the R-Type color-coded crystal convention, so the tile color already tells you WHICH weapon), and the mystery box is gold
    X.save();X.fillStyle=c;X.strokeStyle='#fff';X.lineWidth=2;
    if((RARITY[p.type]||1)>=1.6){X.save();X.globalAlpha=.34+.2*Math.sin(p.ph*2.2);X.beginPath();tileP(p.type,1.3);X.fill();X.restore();}   // V68: rarity halo — bomb/life/mystery pulse a silhouette BEHIND the tile at 2.2x the tile's own pulse, so the rare drops read at a glance; the icon shapes are untouched (V68 review: alpha raised from .22+.14 to .34+.2 — the first pass capped at .36 and was nearly invisible next to the shadow boost)
    X.shadowColor=c;X.shadowBlur=12*(RARITY[p.type]||1);X.beginPath();tileP(p.type,1);X.fill();X.stroke();X.restore();   // V68: the glow's strength scales with rarity (power 12, shield/w 15, bomb/life 21, mystery 24)
    X.strokeStyle='rgba(0,0,0,.22)';X.lineWidth=1;X.beginPath();tileP(p.type,.72);X.stroke();   // V64: subtle inner bevel — V65: it follows the silhouette (was a fixed inset square)
    X.strokeStyle='#fff';X.fillStyle='#fff';X.lineWidth=2;X.lineJoin='round';X.lineCap='round';
    if(p.type!=='power'&&p.type!=='mystery')X.scale(.84,.84);   // V65: non-square tiles have a smaller inscribed area — shrink the pictogram so it sits cleanly inside (the square power tile keeps full size; the mystery star uses the 5-point spikes for reach)
    if(p.type==='power'){          // lightning bolt: +1 power (fills the power gauge)
      X.beginPath();X.moveTo(2,-8);X.lineTo(-4,0);X.lineTo(-1,0);X.lineTo(-2,8);X.lineTo(4,-1);X.lineTo(1,-1);X.closePath();X.fill();
    }else if(p.type==='w'){        // V66: a weapon CRYSTAL — the pictogram shows the EXACT weapon you'll get (R-Type grants specific weapons, not a blind cycle). The wsub travels on the pickup from the drop roll; a legacy bare 'w' still draws the generic spark + dot.
      if(p.wsub==='laser'){        // laser: a beam with a guide
        X.beginPath();X.moveTo(-1,-7);X.lineTo(2,-7);X.lineTo(2,7);X.lineTo(-1,7);X.closePath();X.fill();
        X.fillRect(-5,-2,2.5,4);   // beam guide
      }else if(p.wsub==='missile'){// missile: body + fins
        X.beginPath();X.moveTo(6,-1.6);X.lineTo(-3,-1.6);X.lineTo(-5,0);X.lineTo(-3,1.6);X.lineTo(6,1.6);X.closePath();X.fill();
        X.beginPath();X.moveTo(6,-1.6);X.lineTo(8,-4.5);X.lineTo(5,0);X.closePath();X.fill();
        X.beginPath();X.moveTo(6,1.6);X.lineTo(8,4.5);X.lineTo(5,0);X.closePath();X.fill();
      }else if(p.wsub==='spreader'){// spreader: three diverging streams
        X.beginPath();X.moveTo(-6,-1.2);X.lineTo(6,-5);X.stroke();
        X.beginPath();X.moveTo(-6,1.2);X.lineTo(6,5);X.stroke();
        X.beginPath();X.moveTo(-6,0);X.lineTo(6,0);X.stroke();
      }else if(p.wsub==='vul'){    // vulcan: three stacked bullets
        X.fillRect(-3,-6,3,3);X.fillRect(0,-6,3,3);X.fillRect(-1.5,2,3,3);
      }else{                       // legacy bare 'w': four-point spark + center dot (V64 tell)
        X.beginPath();X.moveTo(0,-8);X.quadraticCurveTo(1.5,-1.5,7,0);X.quadraticCurveTo(1.5,1.5,0,8);X.quadraticCurveTo(-1.5,1.5,-7,0);X.quadraticCurveTo(-1.5,-1.5,0,-8);X.closePath();X.fill();
        X.beginPath();X.arc(0,0,1.6,0,6.28);X.fill();   // center dot
      }
    }else if(p.type==='shield'){   // shield: the bubble the ship gains
      X.beginPath();X.moveTo(0,7);X.lineTo(-6,3);X.lineTo(-6,-3);X.quadraticCurveTo(-6,-8,0,-7);X.quadraticCurveTo(6,-8,6,-3);X.lineTo(6,3);X.closePath();X.fill();
      X.lineWidth=1.4;X.beginPath();X.moveTo(-3,-2);X.lineTo(3,-2);X.stroke();X.lineWidth=2;   // inner ridge
    }else if(p.type==='bomb'){     // bomb: sphere + cap + fuse + spark (with a gloss highlight)
      X.beginPath();X.arc(0,4,5.2,0,6.28);X.fill();
      X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.arc(-2,1.8,1.5,0,6.28);X.fill();X.fillStyle='#fff';
      X.fillRect(-1.8,-0.8,3.6,2.4);
      X.beginPath();X.moveTo(0,-1.2);X.lineTo(0,-5);X.stroke();
      X.beginPath();X.arc(0,-6.2,1.5,0,6.28);X.fill();
    }else if(p.type==='life'){     // heart: +1 life — matches the HUD hearts (rounder lobes, deeper top dip)
      X.beginPath();X.moveTo(0,6);X.bezierCurveTo(-9,-3,-3,-9,0,-5);X.bezierCurveTo(3,-9,9,-3,0,6);X.closePath();X.fill();
    }else if(p.type==='mystery'){  // V66: mystery box — a drawn white '?' (curl opening at the BOTTOM + connecting stem + dot; no font dependence) that rolls a random pickup on collection (Parodius-style), plus a twinkle corner
      X.beginPath();X.arc(0,-1.2,3.6,2.2,1.15);X.stroke();   // the '?' curl — clockwise 2.2->1.15 rad leaves the opening at the bottom (the old .15->5.9 left it on the right and read as an O-with-notch)
      X.beginPath();X.moveTo(1.47,2.09);X.lineTo(0.3,3.4);X.stroke();   // stem, continuing from the curl's end toward the dot
      X.beginPath();X.arc(0,4.9,.95,0,6.28);X.fill();        // dot
      X.beginPath();X.moveTo(-7,-6);X.lineTo(-4.5,-8.5);X.stroke();X.moveTo(-4.5,-6);X.lineTo(-7,-8.5);X.stroke();   // twinkle starlet
    }else{ /* unknown type: bare tile — visible as missing, never mislabeled */ }
    X.restore();
  }
};

/* per-weapon power routes through wp[wtype] so each weapon keeps its own level */
Object.defineProperty(G,'power',{
  get:function(){return this.wp[this.wtype]||0;},
  set:function(v){this.wp[this.wtype]=v;}
});

function esc(s){return String(s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function hx(c,a){var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}
function LG(x0,y0,x1,y1,a,b){var g=X.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function RG(x,y,r0,r1,a,b){var g=X.createRadialGradient(x,y,r0,x,y,r1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
var GCACHE={};
function GX(key,make){if(!GCACHE[key])GCACHE[key]=make();return GCACHE[key];}
/* V65: the per-type pickup tile silhouette, traced at scale s (the tile fill uses 1, the
   inner bevel reuses it at .72). power = square, w = diamond, shield = hexagon,
   bomb = circle, life = heart — readable by silhouette alone at peripheral vision. */
function tileP(t,s){
  if(t==='w'){X.moveTo(0,-11*s);X.lineTo(11*s,0);X.lineTo(0,11*s);X.lineTo(-11*s,0);X.closePath();}
  else if(t==='shield'){X.moveTo(0,-11*s);X.lineTo(9.53*s,-5.5*s);X.lineTo(9.53*s,5.5*s);X.lineTo(0,11*s);X.lineTo(-9.53*s,5.5*s);X.lineTo(-9.53*s,-5.5*s);X.closePath();}
  else if(t==='bomb'){X.arc(0,0,11*s,0,6.28);}
  else if(t==='life'){X.moveTo(0,6*s);X.bezierCurveTo(-10*s,-2*s,-5*s,-10*s,0,-6*s);X.bezierCurveTo(5*s,-10*s,10*s,-2*s,0,6*s);X.closePath();}
  else if(t==='mystery'){X.moveTo(0,-11*s);X.lineTo(2.9*s,-3.4*s);X.lineTo(10.5*s,-3.4*s);X.lineTo(4.2*s,1.3*s);X.lineTo(6.5*s,9.7*s);X.lineTo(0,5*s);X.lineTo(-6.5*s,9.7*s);X.lineTo(-4.2*s,1.3*s);X.lineTo(-10.5*s,-3.4*s);X.lineTo(-2.9*s,-3.4*s);X.closePath();}   // V66: mystery — a 5-point star (the 'lucky find' silhouette, distinct from every other tile)
  else{if(X.roundRect)X.roundRect(-11*s,-11*s,22*s,22*s,4);else X.rect(-11*s,-11*s,22*s,22*s);X.closePath();}   // power: square (rounded) — the caller already began the path
}

/* ============ GAMEPAD (desktop browsers) ============ */
/* Standard mapping: A fire · B bomb · LB/RB cycle weapon · Start pause/resume (and START on the
   title, like an arcade cab). The left stick (deadzoned) and the d-pad both move the ship — they
   write the same G.keys the keyboard and the touch joystick use, so no gameplay code changed.
   On the TITLE screen the d-pad / left stick move the V44 menu focus ring (menuMove) and START
   activates the focused mode (menuActivate) — edge-triggered, so a held direction nudges once.
   Edge-triggered actions (bomb/weapon/start) fire once per press via a rising-edge mask. */
var GP={prev:0,prevDir:0,on:false};
function gpPoll(){
  if(typeof navigator==='undefined'||!navigator.getGamepads)return;
  var pads=[];try{pads=navigator.getGamepads()||[];}catch(e){return;}
  var pad=null;for(var i=0;i<pads.length;i++){if(pads[i]&&pads[i].connected){pad=pads[i];break;}}
  if(!pad){
    if(GP.on&&G.state==='PLAY'){G.keys['arrowleft']=G.keys['arrowright']=G.keys['arrowup']=G.keys['arrowdown']=false;G.keys[' ']=false;}   // unplug safety: never leave held inputs stuck
    GP.prev=0;GP.prevDir=0;GP.on=false;return;
  }
  GP.on=true;
  var b=function(i){return !!(pad.buttons&&pad.buttons[i]&&pad.buttons[i].pressed);};
  var ax=(pad.axes&&pad.axes[0])||0,ay=(pad.axes&&pad.axes[1])||0,DZ=.15;
  var L=ax<-DZ||b(14),R=ax>DZ||b(15),U=ay<-DZ||b(12),Dn=ay>DZ||b(13);
  if(G.state==='PLAY'){
    G.keys['arrowleft']=L;G.keys['arrowright']=R;G.keys['arrowup']=U;G.keys['arrowdown']=Dn;
    G.keys[' ']=b(0);   // A fires (hold)
  }
  var m=(b(0)?1:0)|(b(1)?2:0)|(b(4)?4:0)|(b(5)?8:0)|(b(9)?16:0);   // A (fire) is level-triggered on PLAY (no edge&1 handler there) — but it confirms on the TITLE like START
  var edge=m&~GP.prev;
  GP.prev=m;
  var dir=(L?1:0)|(R?2:0)|(U?4:0)|(Dn?8:0),dirEdge=dir&~GP.prevDir;   // V45: d-pad/stick rising edge for the title menu (held directions must not churn the focus)
  GP.prevDir=dir;
  if(G.state==='PLAY'){
    if(edge&2)G.bomb();            // B
    if(edge&4)G.cycleWeapon(-1);   // LB
    if(edge&8)G.cycleWeapon(1);    // RB
    if(edge&16)G.pause();          // Start
  }else if(G.state==='PAUSE'){
    if(edge&16)G.resume();         // Start resumes
  }else if(G.state==='TITLE'){
    var dm=((dirEdge&1)||(dirEdge&4)?-1:0)+((dirEdge&2)||(dirEdge&8)?1:0);   // V45: net focus move — LEFT/UP=-1, RIGHT/DOWN=+1; a diagonal still moves once, opposites cancel (keyboard parity)
    if(dm)G.menuMove(dm);
    if(edge&1||edge&16){if(G._menuMoved)G.menuActivate();else G.start();}   // V45: START (or A, arcade-confirm style) runs the focused mode, or starts the campaign by default
  }
}

/* ============ INPUT ============ */
addEventListener('keydown',function(e){
  unlockAudio();   // V47: any keypress unlocks the attract-mode loop (web-audio needs the gesture)
  var k=e.key.toLowerCase();
  G.keys[k]=true;
  if(e.key==='Enter'){
    if(G.state==='TITLE'){if(G._menuMoved)G.menuActivate();else G.start();}   // V44: Enter starts the campaign by default; once you arrow-navigate it activates the focused mode
    else if(G.state==='OVER'){
      if(G.pendActive()){G.confirmInitials();}
      else{G.start();}
    }
  }
  if(G.state==='TITLE'&&!e.repeat){   // V44: arrow-key mode selection on the title screen (arcade-cabinet feel)
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')G.menuMove(-1);
    else if(e.key==='ArrowRight'||e.key==='ArrowDown')G.menuMove(1);
  }
  if(e.key==='p'||e.key==='P'){if(G.state==='PLAY')G.pause();else if(G.state==='PAUSE')G.resume();}
  if(e.key==='m'||e.key==='M'){G.toggleMute();}
  if(e.key==='h'||e.key==='H'){G.toggleHit();}   // V55: H shows/hides the 14px hitbox (the genre's practice toggle)
  if(e.key==='c'||e.key==='C'){G.toggleCrt();}   // V55: C toggles the CRT scanline + vignette overlay
  if(e.key==='r'||e.key==='R'){if(G.state==='PAUSE')G.start();}
  if(e.key==='Escape'){
    if(G.state==='PLAY'||G.state==='PAUSE'){G.toTitle();}
    else if(G.state==='OVER'){
      if(G.pendActive()){G.autoCommit();G.showOver();sfx('sel');}   // ESC cancels the initials editor: keep the score with last-used initials, stay on the stats screen
      else{G.toTitle();}                                                  // (a second ESC — or the MENU button — leaves for the title)
    }
  }
  if(e.key==='x'||e.key==='X'){if(G.state==='PLAY')G.bomb();}
  if(e.key==='q'||e.key==='Q'||e.key==='Tab'){if(G.state==='PLAY'&&!e.repeat){e.preventDefault();G.cycleWeapon(1);}}
  if(e.key==='e'||e.key==='E'){if(G.state==='PLAY'&&!e.repeat)G.cycleWeapon(-1);}
  if(G.state==='OVER'&&G.pendActive()){
    if(e.key==='ArrowLeft'&&!e.repeat)G.iniSel((G._iniIdx+2)%3);     // one press = one slot; holding a cursor key must not churn full overlay re-renders
    if(e.key==='ArrowRight'&&!e.repeat)G.iniSel((G._iniIdx+1)%3);
    if(e.key==='ArrowUp')G.iniShift(G._iniIdx,1);                     // up/down keep repeats so holding scrolls letters A..Z
    if(e.key==='ArrowDown')G.iniShift(G._iniIdx,-1);
  }
  if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault();   // never let the page scroll on game keys
});
addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false;});
(function(){
  function autoPause(){if(G.state==='PLAY')G.pause();}   // never die while alt-tabbed: pause the moment the tab loses focus
  document.addEventListener('visibilitychange',function(){if(document.hidden)autoPause();});
  addEventListener('blur',autoPause);
  addEventListener('pagehide',autoPause);
})();
addEventListener('click',function(e){
  var t=e&&e.target;
  while(t&&t.nodeType===3)t=t.parentNode;   // some mobile browsers deliver the text node inside a button as the tap target — walk up to the element
  if(t&&(t.tagName==='BUTTON'||t.tagName==='A'||t.tagName==='LABEL'||(t.closest&&t.closest('button,a,label'))))return;   // never steal clicks from UI controls (MENU, difficulty, initials…) — they handle themselves
  if(G.state==='TITLE'){G.start();}
  else if(G.state==='OVER'){if(!G.pendActive())G.start();}
});

/* ============ TOUCH CONTROLS (mobile only) ============ */
(function(){
  var isTouch = ('ontouchstart' in window) || (typeof navigator!=='undefined' && navigator.maxTouchPoints>0);
  if(!isTouch) return;
  document.body.classList.add('touch');
  var joy=document.getElementById('joy'),thumb=document.getElementById('joyThumb');
  var joyId=null,jx=0,jy=0,MAX=33,DZ=14;
  function setMove(dx,dy){
    G.keys['arrowleft']=dx<-DZ;G.keys['arrowright']=dx>DZ;
    G.keys['arrowup']=dy<-DZ;G.keys['arrowdown']=dy>DZ;
  }
  function clearMove(){G.keys['arrowleft']=G.keys['arrowright']=G.keys['arrowup']=G.keys['arrowdown']=false;}
  function joyStart(t){joyId=t.identifier;var hw=60;   // clamp spawn so the 120px circle never hangs off-screen on small phones
    jx=Math.min(Math.max(t.clientX,hw),window.innerWidth-hw);jy=Math.min(Math.max(t.clientY,hw),window.innerHeight-hw);
    joy.style.left=(jx-hw)+'px';joy.style.top=(jy-hw)+'px';joy.style.display='block';thumb.style.transform='translate(0,0)';}
  function joyMove(t){var dx=t.clientX-jx,dy=t.clientY-jy,d=Math.hypot(dx,dy);if(d>MAX){dx=dx/d*MAX;dy=dy/d*MAX;}thumb.style.transform='translate('+dx+'px,'+dy+'px)';setMove(dx,dy);}
  function joyEnd(t){if(t.identifier!==joyId)return;joyId=null;joy.style.display='none';clearMove();}
  document.addEventListener('touchstart',function(e){
    if(G.state!=='PLAY')return;
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(joyId===null&&t.clientX<window.innerWidth*.5){joyStart(t);}}
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(joyId===null)return;e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joyId){joyMove(t);}}
  },{passive:false});
  function onEnd(e){for(var i=0;i<e.changedTouches.length;i++){joyEnd(e.changedTouches[i]);}}
  document.addEventListener('touchend',onEnd);
  document.addEventListener('touchcancel',onEnd);
  function hold(id,on,off){
    var el=document.getElementById(id);
    el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();on();},{passive:false});
    el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();off();},{passive:false});
    el.addEventListener('touchcancel',function(e){off();});
  }
  hold('btnFire',function(){G.keys[' ']=true;},function(){G.keys[' ']=false;});
  hold('btnBomb',function(){if(G.state==='PLAY')G.bomb();},function(){});
  hold('btnWeapon',function(){if(G.state==='PLAY')G.cycleWeapon(1);},function(){});
  hold('btnPause',function(){if(G.state==='PLAY')G.pause();else if(G.state==='PAUSE')G.resume();},function(){});
  hold('btnSnd',function(){G.toggleMute();},function(){});
})();

/* ============ BOOT ============ */
try{G.dif=(localStorage.getItem('skyDriftDif')||'N');}catch(e){}
try{G.muted=localStorage.getItem('skyDriftMuted')==='1';}catch(e){}
try{G._lastName=localStorage.getItem('skyDriftName')||'AAA';}catch(e){}
try{G.showHit=localStorage.getItem('skyDriftHit')==='1';}catch(e){}   // V55: the H-key hitbox toggle persists
try{G.crt=localStorage.getItem('skyDriftCrt')!=='0';}catch(e){}   // V55: the CRT scanline/vignette overlay persists (default ON)
if(!G.crt){var crtEl=document.getElementById('crt');if(crtEl)crtEl.style.display='none';}
if(G.muted&&MUS.master)MUS.master.gain.value=0;
G.init();G.showTitle();G.initDemo();

var lastT=0;
function loop(t){var dt=t-lastT;lastT=t;G.update(dt);G.render();if(document.body)document.body.classList.toggle('playing',G.state==='PLAY'||G.state==='PAUSE');requestAnimationFrame(loop);}   // V61: the per-frame dt clamp is GONE — the accumulator catches up stalls at up to 3 ticks/frame until the remainder clears, bounded only by the 500ms backlog cap in update() (a long tab-away still can't replay minutes of sim)
requestAnimationFrame(loop);
