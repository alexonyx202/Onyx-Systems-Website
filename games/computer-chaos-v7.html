/* ---------------- UPDATE (dt-based, 60 Hz fixed step) ---------------- */
function update(s,dt){
  if(s.paused) return;
  if(s.phase==='countdown'){
    s.count-=dt;
    if(s.count>0){
      var n=Math.ceil(s.count/0.7);
      if(n!==s._lastCount){ s._lastCount=n; SFX.tick(); }
      return;
    }
    s.phase='play'; SFX.go(); addFlash('#22d3ee',0.25);
    return;
  }
  if(s.phase!=='play') return;

  /* end conditions (top of update: stop the sim immediately once the shift is over) */
  if(s.lives<=0){ persistEnd(s); return; }
  /* ⏱️ post-bell overtime (arcade only): finish the order already on the bench, up to 10s */
  if(s.timeLeft<=0){
    if(modeRules(s).overtime){
      if(s.queue.length===0){ persistEnd(s); s.overtime=false; return; }   // nothing left to finish — clock out now
      if(!s.overtime){
        s.overtime=true; s.oTimer=modeRules(s).overtime;
        popup(W/2,H/2-84,'⏱️','#facc15'); addFlash('#facc15',0.25); SFX.ach();
      } else {
        s.oTimer-=dt;
        if(s.oTimer<=0){ persistEnd(s); s.overtime=false; return; }   // grace ran out
      }
    } else {
      persistEnd(s); return;
    }
  }

  if(hitStop>0){ hitStop-=dt; return; }

  /* timers */
  if(s.powerupTimer>0){
    s.powerupTimer-=dt;
    if(s.powerupTimer<=0){ s.powerup=null; s.wrenchHint=0; }   // hot 🔧 window ends quietly — NEVER auto-fires (can't eat an order)
  }
  if(s.wrenchHint>0) s.wrenchHint-=dt;
  if(s.chaosTimer>0){ s.chaosTimer-=dt;
    if(s.chaosTimer<=0){ s.chaos=null; s.smudge=null; s.inputFreeze=0; s.contam=null; s.contamTimer=0; s.cableLock=null; s.cableTimer=0; } }
  if(s.contamTimer>0){ s.contamTimer-=dt; if(s.contamTimer<=0){ s.contam=null; } }
  if(s.cableTimer>0){ s.cableTimer-=dt; if(s.cableTimer<=0){ s.cableLock=null; } }
  if(s.chaosCooldown>0) s.chaosCooldown-=dt;

  /* 🎒 supply shortage: the stocked-out code rotates while the boss is active */
  if(s.boss&&s.boss.def.gimmick==='stock'){
    s.stockTimer-=dt;
    if(s.stockTimer<=0){
      s.stock=PART_CODES[Math.floor(Math.random()*PART_CODES.length)];
      s.stockTimer=8;
    }
  } else if(!s.boss){ s.stock=null; }

  /* 🌡️ meltdown heat bar — climbs for the whole wave (active until the wave is defeated) */
  if(s.boss&&s.boss.def.gimmick==='heat'){
    s.heat+=4.5*dt;
    if(s.heat>=100){ s.heatLevel++; s.heat=0; popup(W/2,H/2-80,'🌡️ HOT','#ef4444'); SFX.chaos(); addTrauma(0.4); }
  }

  /* patron patience meters — decay faster for harder orders + impatient bosses */
  if(modeRules(s).patrons) for(var qi=0;qi<s.queue.length;qi++){
    var qo=s.queue[qi];
    var dec=(BALANCE.patienceBase+qo.diff*BALANCE.patiencePerDiff)*(s.boss?s.boss.def.patienceMul:1)*(modeRules(s).patienceMul||1)*dt;   // 🧘 relaxed: patrons 30% more patient (decay ×0.7)
    qo.patron.pat=Math.max(0,qo.patron.pat-dec);
    if(qo.patron.pat<=0){
      /* patron storms off: -1 life, the order is lost (🛡️ absorbed under no-fail grace) */
      if(s.graceTimer>0){ shieldHit(s,W/2,H/2-70); }
      else {
        s.lives--; s.combo=0;
        popup(W/2,H/2-70,'💨','#94a3b8'); burst(W/2,H/2-30,'#94a3b8',14);
        addFlash('#ef4444',0.28); addHitStop(0.07); addTrauma(0.45); SFX.junk();
      }
      s.queue.splice(qi,1); qi--;
      if(s.boss&&s.boss.def.gimmick==='queue'){ fillQueue(s); fillQueue(s); }   // 🛒 queue overflow: refill hard to the wave's 3-order cap
      else fillQueue(s);
      s._ordersDirty=true;
      if(s.lives<=0){ persistEnd(s); return; }
    }
  }
  /* refresh patience bars/moods ~4×/sec (live drain without per-frame DOM churn) */
  s._patT+=dt;
  if(s._patT>=0.25){ s._patT=0; s._ordersDirty=true; }
  if(s.comboTimer>0){ s.comboTimer-=dt; if(s.comboTimer<=0) s.combo=0; }
  if(s.graceTimer>0) s.graceTimer-=dt;    // 🛡️ shield countdown (absorbed hits refresh it)
  if(s.flashTimer>0) s.flashTimer-=dt;
  if(s.goFlash>0) s.goFlash-=dt;
  trauma=Math.max(0,trauma-dt*1.4);
  if(s.inputFreeze>0) s.inputFreeze-=dt;

  /* daily shift: scheduled chaos (deterministic per day, no RNG) */
  if(s.daily&&s.dailySeq&&s.dailySeq.length){
    var elapsed=GAME_TIME-s.timeLeft;
    if(elapsed>=s.dailySeq[0].at){ triggerChaos(s,s.dailySeq.shift().chaos); }
  }

  /* movement */
  var spd=s.player.speed*(s.powerup==='coffee'?0.45:1);
  var dir=0;
  if(s.keys['left']) dir=-1;               // remappable keys (KEY_DEFAULTS)
  if(s.keys['right']) dir=1;
  if(padBtn(14)) dir=-1;                   // 🎮 D-pad left — crisp, like keys
  if(padBtn(15)) dir=1;                    // 🎮 D-pad right
  if(s.chaos==='cat') dir*=-1;
  var gx=padX();                           // 🎮 left stick, -1..1 (deadzone + scaled)
  if(s.inputFreeze<=0){
    if(dir!==0){ s.player.targetX=null; s.player.targetY=null; /* keys/D-pad: crisp, no lag */
      s.player.x=Math.max(s.player.w/2, Math.min(W-s.player.w/2, s.player.x+dir*spd*dt));
      if(ctrlMode==='lift'||ctrlMode==='lifthold') s.player.y+=(TRAY_Y-s.player.y)*Math.min(1,dt*DRAG_LERP); /* tray back to the bench */
      s.padSmooth=0;
    }
    else if(gx!==0){ /* 🎮 left stick: analog, same drag-style lag smoothing */
      s.player.targetX=null; s.player.targetY=null;   /* stick wins over stale finger targets */
      s.padSmooth+=(gx-s.padSmooth)*Math.min(1,dt*DRAG_LERP);
      s.player.x=Math.max(s.player.w/2, Math.min(W-s.player.w/2, s.player.x+s.padSmooth*spd*dt));
      if(ctrlMode==='lift'||ctrlMode==='lifthold') s.player.y+=(TRAY_Y-s.player.y)*Math.min(1,dt*DRAG_LERP);
    }
    else if(Math.abs(s.padSmooth)>0.001&&s.player.targetX==null){ /* released stick glides to a stop (a fresh finger grab wins) */
      s.padSmooth+=(0-s.padSmooth)*Math.min(1,dt*DRAG_LERP);
      s.player.x=Math.max(s.player.w/2, Math.min(W-s.player.w/2, s.player.x+s.padSmooth*spd*dt));
      if(ctrlMode==='lift'||ctrlMode==='lifthold') s.player.y+=(TRAY_Y-s.player.y)*Math.min(1,dt*DRAG_LERP);
    }
    else if(ctrlMode==='drag'||ctrlMode==='lift'||ctrlMode==='lifthold'){ /* ✋/☝️/✊ follow: 1:1 target, slight lag smoothing */
      if(s.player.targetX!=null) s.player.x+=(s.player.targetX-s.player.x)*Math.min(1,dt*DRAG_LERP);
      if((ctrlMode==='lift'||ctrlMode==='lifthold')&&s.player.targetY!=null) s.player.y+=(s.player.targetY-s.player.y)*Math.min(1,dt*DRAG_LERP);
    }
  }
  s.player.sx+=(1-s.player.sx)*0.14; s.player.sy+=(1-s.player.sy)*0.14;

  /* drag-aid trail history (aiming aid; skipped under reduced motion) */
  if(!REDUCED&&(ctrlMode==='drag'||ctrlMode==='lift'||ctrlMode==='lifthold')&&s.player.targetX!=null) trailPush(s.player.x,s.player.y);
  else trailClear();

  /* spawning */
  s.spawnTimer-=dt;
  if(s.spawnTimer<=0){
    spawnItem(s);
    if(s.level>=4&&Math.random()<0.25) spawnItem(s);
    s.spawnTimer=spawnInterval(s);
  }

  /* magnet pulls needed parts toward the tray */
  if(s.powerup==='magnet'){
    var need=nextNeeded(s);
    for(var i=0;i<s.items.length;i++){ var mi=s.items[i];
      if(mi.type==='good'&&mi.code===need){
        var dx=s.player.x-mi.x; mi.x+=Math.max(-140,Math.min(140,dx*2.2))*dt;
      } }
  }

  var py=s.player.y;
  for(i=s.items.length-1;i>=0;i--){
    var it=s.items[i];
    it.y+=it.speed*dt;
    it.scale=Math.min(1,it.scale+dt*4);
    var hit=Math.abs(it.x-s.player.x)<s.player.w/2+CATCH_X && Math.abs(it.y-py)<CATCH_Y;
    if(hit){
      s.items.splice(i,1);
      var contaminated=s.contam&&it.type==='good'&&it.code===s.contam;      // 🫗 toxic part
      var stockedOut=s.stock&&it.type==='good'&&it.code===s.stock;           // 🎒 out of stock
      /* 🌡️ meltdown: ANY caught cooling part pushes the heat bar down (correct or not) */
      if(s.boss&&s.boss.def.gimmick==='heat'&&(it.code==='fan'||it.code==='paste'||it.code==='heatsink')){
        s.heat=Math.max(0,s.heat-22);
        popup(it.x,py-24,'❄️','#7dd3fc');
      }
      if(it.type==='good'&&!contaminated&&!stockedOut){
        var q=orderForCode(s,it.code);
        if(q){
          /* correct part — deposit into the matching order */
          q.c.push(it.code);
          patienceBonus(q,8);                    // happy patron: +8 patience
          var gained=10*s.level+Math.min(s.combo,20)*5;   // ×20 is the max multiplier (bar, display, AND score all agree)
          s.score+=gained;
          s.combo++; s.comboTimer=2.5;
          s.bestComboRun=Math.max(s.bestComboRun,s.combo);
          burst(it.x,py,'#22c55e',14); popup(it.x,py-24,'+'+gained+(s.combo>1?' ×'+Math.min(s.combo,20):''),'#4ade80');   // ×N shows WHY it pays more (capped at the ×20 max)
          s.player.sx=1.28; s.player.sy=0.74; addTrauma(0.08);
          SFX.catchGood(s.combo);
          if(TUT_ON&&tutStep===0) advanceTut();   // 🎓 lesson 1 done: caught a part
          if(s.combo===5) checkAch(s,'c5');
          if(s.combo===10){ checkAch(s,'c10'); popup(W/2,H/2-60,'🔥','#fb923c'); }
          s._ordersDirty=true;
          if(q.c.length===q.p.length){
            var oi=-1;
            for(var oi2=0;oi2<s.queue.length;oi2++){ if(s.queue[oi2]===q){ oi=oi2; break; } }
            completeOrder(s,oi);
          }
        } else {
          /* wrong part — score penalty only (fair, V1 rules) */
          s.score=Math.max(0,s.score-5);
          s.combo=0;
          burst(it.x,py,'#ef4444',10); popup(it.x,py-24,'−5','#f87171');
          s.player.sx=1.22; s.player.sy=0.8; addTrauma(0.2);
          SFX.wrong();
          if(!s.daily&&!s.chaos&&!TUT_ON&&s.chaosCooldown<=0&&Math.random()<0.22) triggerChaos(s);   // 🎓 no chaos while the tutorial is coaching
        }
      } else if(it.type==='junk'||contaminated){
        /* 🛡️ no-fail grace absorbs the hit — no life loss, no combo reset, soft feedback */
        if(s.graceTimer>0){ shieldHit(s,it.x,py); }
        else {
          s.lives--; s.combo=0;
          for(var pj=0;pj<s.queue.length;pj++) patienceBonus(s.queue[pj],-10);   // disappointed patrons
          burst(it.x,py,'#ea580c',16); popup(it.x,py-24,'💥','#fb923c');
          addFlash('#ea580c',0.28); addHitStop(0.08); addTrauma(0.5);
          SFX.junk();
          if(!s.daily&&!s.chaos&&!TUT_ON&&s.chaosCooldown<=0&&Math.random()<0.3) triggerChaos(s);   // 🎓 calm first shift (absorbed hits never escalate)
        }
        if(s.lives<=0){ persistEnd(s); return; }
      } else if(stockedOut){
        /* 🎒 out of stock: the part can't be used — gentle rejection, no life loss */
        s.combo=0;
        burst(it.x,py,'#94a3b8',8); popup(it.x,py-24,'🎒','#94a3b8');
        addTrauma(0.1); SFX.wrong();
      } else {
        /* powerup */
        if(it.emoji==='☕'){
          s.powerup='coffee'; s.powerupTimer=POWER_KEYS.coffee; checkAch(s,'coffee');
          popup(it.x,py-24,'SLOW','#fbbf24');
          burst(it.x,py,'#facc15',12); addTrauma(0.15); SFX.power();
        } else if(it.emoji==='🧲'){
          s.powerup='magnet'; s.powerupTimer=POWER_KEYS.magnet; checkAch(s,'magnet');
          popup(it.x,py-24,'PULL','#7dd3fc');
          burst(it.x,py,'#facc15',12); addTrauma(0.15); SFX.power();
        } else {
          /* 🔧 wrench: catching it SKIPS the front order instantly — the order
             resets the moment it lands (no dead wait). It then stays HOT for a
             short window: a 2nd finger (or right-click) skips ONE more order.
             The window never auto-fires, so it can't eat an order you're
             actively filling. */
          SFX.power();                 // pickup chime leads, then the skip's order chime
          useWrench(s,py);
          if(s.queue.length){ s.powerup='wrench'; s.powerupTimer=POWER_KEYS.wrench; s.wrenchHint=POWER_KEYS.wrench; }
          burst(it.x,py,'#facc15',12); addTrauma(0.15);
        }
      }
    } else if(it.y>H+40){ s.items.splice(i,1); }
  }

  /* particles / popups / rings */
  for(i=0;i<MAX_P;i++){ var p=PARTICLES[i]; if(!p.active) continue;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.life-=dt; if(p.life<=0) p.active=false; }
  for(i=0;i<MAX_POP;i++){ var po=POPUPS[i]; if(!po.active) continue;
    po.y-=36*dt; po.life-=dt; po.scale=Math.min(1,po.scale+dt*6); if(po.life<=0) po.active=false; }
  for(i=0;i<MAX_RING;i++){ var rg=RINGS[i]; if(!rg.active) continue;
    rg.r+=rg.vr*dt; rg.life-=dt; if(rg.life<=0) rg.active=false; }

  /* achievements for score/lives */
  if(s.score>=1000) checkAch(s,'s1k');
  if(s.daily&&!s._dailyReached&&s.score>=s.dailyTarget){   // 🌍 world target reached!
    s._dailyReached=true;
    popup(W/2,H/2-90,'🌍 TARGET!','#22c55e');
    ring(W/2,H/2-40,'#22c55e'); burst(W/2,H/2-40,'#22c55e',20);
    addFlash('#22c55e',0.25); addTrauma(0.3); SFX.newbest();
  }
  if(s.chaos&&s.chaosTimer>0&&!s._chaosSurvived){ s._chaosSurvived=s.chaos; }
  if(!s.chaos&&s._chaosSurvived){ checkAch(s,'chaos'); s._chaosSurvived=null; }

  /* last-5-seconds urgency ticks */
  if(s.timeLeft<=5.5&&s.timeLeft>0){
    var whole=Math.ceil(s.timeLeft);
    if(whole!==s._lastTick){ s._lastTick=whole; SFX.tick(); addFlash('#ef4444',0.1); }
  }

}

/* ---------------- RENDER ---------------- */
function hexA(hex,a){
  var n=parseInt(hex.slice(1),16); var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function drawBadge(x,y,emoji,bg,border,scale){
  var r=22*scale;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle=border; ctx.lineWidth=2.5; ctx.stroke();
  ctx.font=(24*scale)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(emoji,x,y+1*scale);
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function rrect(c,x,y,w,h,r){ if(c.roundRect){ c.roundRect(x,y,w,h,r); } else { c.rect(x,y,w,h); } }
function draw(s){
  var now=performance.now();   // one clock read per frame — animations share it (low-end friendly)
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  /* trauma shake (positional + slight rotation) */
  var ox=0,oy=0,rot=0;
  if(trauma>0&&!REDUCED){
    var t=trauma*trauma;
    ox=(Math.random()*2-1)*10*t; oy=(Math.random()*2-1)*10*t; rot=(Math.random()*2-1)*0.02*t;
  }
  ctx.save();
  ctx.translate(W/2+ox,H/2+oy); ctx.rotate(rot); ctx.translate(-W/2,-H/2);

  var flip=s.chaos==='surge';
  if(flip){ ctx.translate(0,H); ctx.scale(1,-1); }

  ctx.drawImage(bgCanvas,0,0,W,H);

  /* ambient dust (wordless background life) */
  if(!REDUCED){
    ctx.fillStyle='rgba(103,232,249,0.5)';
    for(var d=0;d<MAX_DUST;d++){
      var du=dust[d];
      var y=(du.y+now*0.01*du.s)%H;
      var x=(du.x+Math.sin(now*0.0004+du.ph)*14+W)%W;
      ctx.globalAlpha=0.08+0.08*Math.sin(now*0.001+du.ph);
      ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;
  }

  /* coffee chaos smudge (vision obscured) */
  if(s.smudge){
    ctx.fillStyle='rgba(120,80,30,0.16)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(120,80,30,0.22)';
    ctx.beginPath(); ctx.arc(s.smudge.x1,s.smudge.y1,s.smudge.r1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s.smudge.x2,s.smudge.y2,s.smudge.r2,0,Math.PI*2); ctx.fill();
  }

  /* items with spawn pop-in + soft shadows; catchable parts wear a halo (the primary
     target pulses strongest) and truly wrong parts sit slightly dim, so the eye
     locks onto what to catch — in multi-order modes every open slot is catchable */
  var needNow=nextNeeded(s);
  var catchable={};
  for(var qi=0;qi<s.queue.length;qi++){ var cq=s.queue[qi]; var cn=nextNeededOf(cq); if(cn) catchable[cn]=1; }
  for(var i=0;i<s.items.length;i++){
    var it=s.items[i];
    ctx.globalAlpha=Math.min(1,it.scale+0.25);
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(it.x,it.y+18*it.scale,12*it.scale,4*it.scale,0,0,Math.PI*2); ctx.fill();
    var bg,br;
    var bad=it.type==='good'&&(it.code===s.contam||it.code===s.stock);   // 🫗 toxic / 🎒 out of stock
    var isNeed=it.type==='good'&&it.code===needNow&&!bad;                 // 🎯 the primary catch target
    var isCat=it.type==='good'&&catchable[it.code]&&!bad&&!isNeed;        // an open order's slot
    if(bad){ bg=CONTAM_BG; br=CONTAM_BORDER; }
    else if(it.type==='good'){ bg=GOOD_BG; br=isNeed?'#22d3ee':(isCat?'#67e8f9':GOOD_BORDER); }
    else if(it.type==='junk'){ bg=JUNK_BG; br=JUNK_BORDER; }
    else { bg=POW_BG; br=POW_BORDER; }
    if(isNeed){   // pulsing halo ring on the primary target (static under reduced motion)
      var hp=REDUCED?0.55:(0.45+0.35*Math.abs(Math.sin(now/130)));   // stronger pulse: 0.45→0.80 so the target pops mid-action
      ctx.fillStyle='rgba(34,211,238,'+hp+')';
      ctx.beginPath(); ctx.arc(it.x,it.y,30*it.scale,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#22d3ee'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(it.x,it.y,26*it.scale,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(34,211,238,'+hp+')';
      ctx.beginPath(); ctx.arc(it.x,it.y,22*it.scale,0,Math.PI*2); ctx.stroke();
    }
    else if(isCat){   // secondary slots: a steady soft ring, no pulse
      ctx.strokeStyle='rgba(103,232,249,0.8)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(it.x,it.y,24*it.scale,0,Math.PI*2); ctx.stroke();
    }
    else if(it.type==='junk'){   // 🚫 hazard glow so the dodge reads instantly (static under reduced motion)
      var jp=REDUCED?0.16:(0.12+0.10*Math.abs(Math.sin(now/90)));
      ctx.fillStyle='rgba(234,88,12,'+jp+')';
      ctx.beginPath(); ctx.arc(it.x,it.y,30*it.scale,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(234,88,12,0.6)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(it.x,it.y,27*it.scale,0,Math.PI*2); ctx.stroke();
    }
    if(it.type==='good'&&!bad&&!isNeed&&!isCat) ctx.globalAlpha*=0.62;   // truly wrong parts recede harder (clearer 'not now'); hazards (bad) stay full-alpha like junk
    drawBadge(it.x,it.y,it.emoji,bg,br,it.scale);
    if(bad){   // tiny warning marker so a bad part is unmistakable
      ctx.fillStyle='#ef4444';
      ctx.beginPath(); ctx.arc(it.x+16*it.scale,it.y-14*it.scale,4*it.scale,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(it.x+16*it.scale,it.y-14*it.scale,4*it.scale,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  /* 🔌 dead PSU: lights flicker (dark pulses over the whole bench) — constant during 🌡️ meltdown */
  if(s.chaos==='deadpsu'||(s.boss&&s.boss.def.id==='melt')){
    var flick=(REDUCED)?0.12:(0.12+0.16*Math.abs(Math.sin(now/70)));
    ctx.fillStyle='rgba(5,8,18,'+flick+')'; ctx.fillRect(0,0,W,H);
  }

  /* 🛒🌡️🎒 boss wave banner: emoji + defeat progress (wordless) — the bar fills as the
     wave's order quota (s.boss.quota) is completed; gold pulse on the final order */
  if(s.boss){
    var bf=Math.max(0,Math.min(1,s.bossTotal/s.boss.quota));   // wave defeat progress: quota completed
    var bUrg=bf>=1-1/s.boss.quota&&!REDUCED;   // one order away: gold pulse — finish it for the clear bonus
    ctx.fillStyle='rgba(11,14,26,0.78)'; rr(W/2-96,8,192,28,13); ctx.fill();
    ctx.strokeStyle=bUrg?(Math.sin(now*0.02)>0?'#facc15':'#fb923c'):'#fb923c';
    ctx.lineWidth=bUrg?2:1.5; rr(W/2-96,8,192,28,13); ctx.stroke();
    ctx.font='bold 15px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=bUrg?(Math.sin(now*0.02)>0?'#fde68a':'#fdba74'):'#fdba74';
    ctx.fillText(s.boss.def.emoji+' WAVE '+s.bossTotal+'/'+s.boss.quota,W/2,22);
    ctx.fillStyle='#2a3358'; ctx.fillRect(W/2-76,42,152,8);
    ctx.fillStyle=bUrg?(Math.sin(now*0.02)>0?'#facc15':'#fb923c'):'#fb923c';
    ctx.fillRect(W/2-76,42,Math.round(152*bf),8);
    /* 🌡️ meltdown cooling bar (left side — keeps clear of the chaos chip) */
    if(s.boss.def.gimmick==='heat'){
      ctx.fillStyle='rgba(11,14,26,0.78)'; rr(8,44,96,20,10); ctx.fill();
      ctx.font='12px system-ui'; ctx.fillStyle='#fca5a5';
      ctx.fillText('🌡️ '+Math.round(s.heat),60,54);
      ctx.fillStyle='#7f1d1d'; ctx.fillRect(16,60,80,5);
      ctx.fillStyle='#ef4444'; ctx.fillRect(16,60,Math.round(80*Math.min(1,s.heat/100)),5);
    }
    /* 🎒 supply shortage chip */
    if(s.boss.def.gimmick==='stock'&&s.stock){
      ctx.fillStyle='rgba(11,14,26,0.78)'; rr(8,70,96,20,10); ctx.fill();
      ctx.font='12px system-ui'; ctx.fillStyle='#fbbf24';
      ctx.fillText('📦 '+PART_EMOJI[s.stock],60,80);
    }
  }

  /* ☝️ lift tether: faint vertical line from the touch point up to the floating tray
     (reduced-motion gated) — anchored at the FINGER's column (s.touchX, which tracks the
     raw pointer even while the tray lags it), so it always reads as coming from the touch */
  if(!REDUCED&&(ctrlMode==='lift'||ctrlMode==='lifthold')&&s.touchY!=null){
    ctx.strokeStyle='rgba(34,211,238,0.16)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(s.touchX,s.player.y); ctx.lineTo(s.touchX,s.touchY); ctx.stroke();
    /* small anchor dot at the touch point */
    ctx.fillStyle='rgba(34,211,238,0.25)';
    ctx.beginPath(); ctx.arc(s.touchX,s.touchY,3,0,Math.PI*2); ctx.fill();
  }

  /* drag-aid: faint vertical guide under the finger + fading tray trail (reduced-motion gated) */
  if(!REDUCED&&(ctrlMode==='drag'||ctrlMode==='lift'||ctrlMode==='lifthold')){
    if(s.player.targetX!=null){
      var gx=s.player.targetX;
      ctx.strokeStyle='rgba(34,211,238,0.14)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,s.player.y); ctx.stroke();
      /* catch-point marker where the guide meets the tray (aiming aid) */
      ctx.fillStyle='rgba(34,211,238,0.22)';
      ctx.beginPath(); ctx.arc(gx,s.player.y,3,0,Math.PI*2); ctx.fill();
    }
    if(trailLen>1){
      ctx.strokeStyle='#22d3ee'; ctx.lineWidth=1.5;
      for(var tk=1;tk<trailLen;tk++){
        ctx.globalAlpha=0.24*(tk/trailLen);
        var i0=(trailHead-trailLen+tk-1+MAX_TRAIL)%MAX_TRAIL;
        var i1=(trailHead-trailLen+tk+MAX_TRAIL)%MAX_TRAIL;
        ctx.beginPath(); ctx.moveTo(TRAIL_PTS[i0].x,TRAIL_PTS[i0].y); ctx.lineTo(TRAIL_PTS[i1].x,TRAIL_PTS[i1].y); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  }

  /* ⏱️ overtime marker — pulsing clock above the bench while the grace period runs */
  if(s.overtime){
    ctx.globalAlpha=REDUCED?0.55:(0.4+0.35*Math.sin(now/140));
    ctx.font='26px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⏱️',W/2,26);
    ctx.globalAlpha=1;
  }

  /* ===== the tech: workbench tray that leans into the catch (fun, high-quality rig) ===== */
  var px=s.player.x, py=s.player.y;
  var TPH='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
  /* the nearest in-flight part (drives the lean + anticipation glow) */
  var ni=null, niD=1e9;
  for(i=0;i<s.items.length;i++){ var ci=s.items[i];
    if(ci.y>py-110&&ci.y<py+14){
      var dd=Math.abs(ci.x-px);
      if(dd<niD){ niD=dd; ni=ci; } } }
  var near=!!ni;
  /* lean: tilt toward the catch target, plus a nudge into motion (reads as reaching) */
  var lean=0;
  if(ni&&ni.y>py-60) lean+=Math.max(-1,Math.min(1,(ni.x-px)/42))*0.18;
  var mvx=s.player.x-(s.player._lx!=null?s.player._lx:s.player.x);
  s.player._lx=s.player.x;
  lean+=Math.max(-1,Math.min(1,mvx/46))*0.05;
  /* idle bob — a tiny breathing hop (none under reduced motion) */
  var bob=REDUCED?0:Math.sin(now/340)*1.7;
  /* anticipation glow under the bench when a part is close (steady under reduced motion) */
  var pulse=REDUCED?0.16:(0.12+0.10*Math.sin(now/160));
  if(near){
    var g=ctx.createRadialGradient(px,py+4,4,px,py+4,56);
    g.addColorStop(0,'rgba(34,211,238,'+pulse+')');
    g.addColorStop(1,'rgba(34,211,238,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(px,py+4,56,16,0,0,Math.PI*2); ctx.fill();
  }
  /* soft drop-shadow below the tray — sinks as the tray floats higher above the bench,
     so ☝️/✊ lift reads as genuinely hovering. Drawn OUTSIDE the squash transform so it
     stays stable while the tray body squashes on a catch. */
  var hover=Math.max(0,TRAY_Y-py);
  var shOff=9+Math.min(10,hover*0.05);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(px,py+shOff,s.player.w/2+9,5.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(px,py+shOff-3,s.player.w/2+3,4,0,0,Math.PI*2); ctx.fill();
  ctx.save();
  ctx.translate(px,py+bob);
  ctx.rotate(lean);
  ctx.scale(s.player.sx,s.player.sy);
  /* rim glow behind the tech so he pops off the playfield (gradient cached — it's static) */
  if(!RIM_GLOW){ RIM_GLOW=ctx.createRadialGradient(0,-22,2,0,-22,34);
    RIM_GLOW.addColorStop(0,'rgba(165,180,203,0.38)'); RIM_GLOW.addColorStop(1,'rgba(165,180,203,0)'); }
  ctx.fillStyle=RIM_GLOW;
  ctx.beginPath(); ctx.arc(0,-22,34,0,Math.PI*2); ctx.fill();
  ctx.font='30px '+TPH;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🧑\u200d🔧',0,-22);
  /* twin sparks orbiting the tech — a lively 'powered' read (none under reduced motion) */
  if(!REDUCED){
    var tS=now/230;
    ctx.fillStyle='rgba(103,232,249,0.85)';
    for(var kS=0;kS<2;kS++){
      var aS=tS+kS*Math.PI;
      ctx.beginPath(); ctx.arc(Math.cos(aS)*23,Math.sin(aS)*7-9,1.7,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='rgba(250,204,21,0.7)';
    ctx.beginPath(); ctx.arc(Math.cos(-tS*1.3)*18,Math.sin(-tS*1.3)*5-6,1.2,0,Math.PI*2); ctx.fill();
  }
  /* workbench tray: rounded metallic bench with a glowing cyan rail */
  var w2=s.player.w/2;
  var lg=ctx.createLinearGradient(0,-10,0,10);
  lg.addColorStop(0,'#6b7d9e'); lg.addColorStop(0.45,'#45577a'); lg.addColorStop(1,'#2a3a5c');
  ctx.fillStyle=lg;
  rrect(ctx,-w2,-10,s.player.w,20,8);
  ctx.fill();
  ctx.strokeStyle='rgba(165,180,203,0.45)'; ctx.lineWidth=1.4;
  rrect(ctx,-w2+0.7,-10+0.7,s.player.w-1.4,20-1.4,8);
  ctx.stroke();
  /* rim light along the catching surface */
  ctx.fillStyle='rgba(203,213,225,0.6)';
  rrect(ctx,-w2+3,-10,s.player.w-6,2.6,2);
  ctx.fill();
  /* soft glow bed under the LED rail */
  ctx.fillStyle='rgba(103,232,249,'+(near?0.28:0.13)+')';
  rrect(ctx,-w2+3,3.6,s.player.w-6,5.4,3);
  ctx.fill();
  /* front LED rail — brightens as a part nears */
  ctx.fillStyle=near?'#a5f3fc':'#22d3ee';
  rrect(ctx,-w2+5,4.6,s.player.w-10,3,1.5);
  ctx.fill();
  /* end caps + screw dots */
  ctx.fillStyle='#111d38';
  rrect(ctx,-w2+1,-9,4.5,18,2.2);
  ctx.fill();
  rrect(ctx,w2-5.5,-9,4.5,18,2.2);
  ctx.fill();
  ctx.fillStyle='rgba(226,232,240,0.6)';
  ctx.beginPath(); ctx.arc(-w2+8.5,0,1.3,0,Math.PI*2); ctx.arc(w2-8.5,0,1.3,0,Math.PI*2); ctx.fill();
  ctx.restore();

  /* ×N combo counter beside the bench — the chain is readable right where your eyes are
     (the HUD pill stays, this is the on-playfield read). Pops on each catch via the
     comboTimer reset (2.5s → ~2.3s); static under reduced motion. */
  if(s.combo>1&&s.phase==='play'){
    var cp=REDUCED?0:Math.max(0,(s.comboTimer-2.2)/0.3);   // fresh-catch pop: 1 → 0 as the timer settles
    var cs=1+0.3*cp, cxB=px+w2+20, cyB=py-8;
    if(cxB+26>W-4) cxB=px-w2-20;                             // flip to the other side near the right wall
    ctx.save(); ctx.translate(cxB,cyB); ctx.scale(cs,cs);
    ctx.globalAlpha=0.9;
    ctx.fillStyle='rgba(11,14,26,0.78)';
    rrect(ctx,-20,-13,40,26,8); ctx.fill();
    ctx.strokeStyle='rgba(250,204,21,0.55)'; ctx.lineWidth=1.2;
    rrect(ctx,-20,-13,40,26,8); ctx.stroke();
    ctx.font='bold 15px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#facc15'; ctx.fillText('×'+Math.min(s.combo,20),0,1);   // bench ×N also caps at the ×20 max
    ctx.restore();
  }

  /* 🛡️ no-fail grace: a cyan countdown halo around the tech (static ring under reduced motion) */
  if(s.graceTimer>0&&s.phase==='play'){
    ctx.strokeStyle='rgba(125,211,252,0.16)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(px,py+2,34,0,Math.PI*2); ctx.stroke();
    if(!REDUCED){
      ctx.strokeStyle='rgba(125,211,252,0.85)';
      ctx.beginPath(); ctx.arc(px,py+2,34,-Math.PI/2,-Math.PI/2+Math.max(0,Math.min(1,s.graceTimer/GRACE_SEC))*Math.PI*2); ctx.stroke();
    }
  }

  /* particles */
  for(i=0;i<MAX_P;i++){ var p=PARTICLES[i]; if(!p.active) continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;

  /* score popups */
  for(i=0;i<MAX_POP;i++){ var po=POPUPS[i]; if(!po.active) continue;
    ctx.globalAlpha=Math.max(0,po.life/po.max);
    ctx.font='bold '+(15+9*po.scale)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillText(po.txt,po.x+1,po.y+1);
    ctx.fillStyle=po.color; ctx.fillText(po.txt,po.x,po.y);
    ctx.globalAlpha=1; }

  /* rings */
  for(i=0;i<MAX_RING;i++){ var rg=RINGS[i]; if(!rg.active) continue;
    ctx.globalAlpha=Math.max(0,rg.life/rg.max);
    ctx.strokeStyle=rg.color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha=1;

  if(flip) ctx.restore(); // undo surge flip
  ctx.restore();          // undo shake

  /* countdown numbers */
  if(s.phase==='countdown'){
    var n=Math.ceil(s.count/0.7);
    var frac=(s.count%0.7)/0.7;
    ctx.font='bold 64px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillText(String(n),W/2+3,H/2+3);
    ctx.fillStyle='#22d3ee';
    ctx.globalAlpha=0.5+0.5*(1-frac);
    ctx.fillText(String(n),W/2,H/2);
    ctx.globalAlpha=1;
  }

  /* daily shift world target (🌍) with live progress — hidden during a boss wave */
  if(s.daily&&!s.boss){
    var df=Math.min(1,s.score/s.dailyTarget);
    var reached=s.score>=s.dailyTarget;
    ctx.fillStyle='rgba(11,14,26,0.72)'; rr(W/2-76,8,152,28,14); ctx.fill();
    ctx.font='bold 13px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=reached?'#22c55e':'#facc15';
    ctx.fillText('🌍 '+s.dailyTarget+(reached?' ✓':''),W/2,22);
    ctx.fillStyle='#2a3358'; ctx.fillRect(W/2-60,40,120,5);
    ctx.fillStyle=reached?'#22c55e':'#facc15'; ctx.fillRect(W/2-60,40,Math.round(120*df),5);
  }

  /* powerup indicator (wordless) */
  if(s.powerup&&s.powerupTimer>0){
    var icon=s.powerup==='coffee'?'☕':'🧲';
    var frac2=Math.max(0,s.powerupTimer/POWER_KEYS[s.powerup]);
    ctx.fillStyle='rgba(11,14,26,0.7)'; ctx.beginPath(); ctx.arc(30,H-30,16,0,Math.PI*2); ctx.fill();
    ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(icon,30,H-30);
    ctx.strokeStyle='#334155'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(30,H-30,22,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#facc15'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(30,H-30,22,-Math.PI/2,-Math.PI/2+Math.PI*2*frac2); ctx.stroke();
  }

  /* dual-touch teaching chip: a 2nd finger fires the armed 🔧 (pulses while fresh) */
  if(s.wrenchHint>0&&s.powerup==='wrench'&&!s.paused){
    var hf=Math.max(0,Math.min(1,s.wrenchHint/POWER_KEYS.wrench));
    var pulse=REDUCED?1:(0.5+0.5*Math.sin(now/150));  // reduced motion: steady, no pulse
    ctx.globalAlpha=(0.55+0.3*pulse)*Math.min(1,hf*2+0.2);
    ctx.fillStyle='#161b2e'; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(W/2-64,H-104,128,24,12); else ctx.rect(W/2-64,H-104,128,24);
    ctx.fill();
    ctx.strokeStyle='#a855f7'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.font='bold 13px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#e9d5ff'; ctx.fillText('🖐️ 2nd finger 🔧',W/2,H-92);
    ctx.globalAlpha=1;
  }

  /* chaos indicator chip (wordless) */
  if(s.chaos){
    var cd=CHAOS_DEF[s.chaos];
    var cfrac=Math.max(0,s.chaosTimer/cd.dur);
    ctx.fillStyle='rgba(11,14,26,0.75)';
    ctx.beginPath(); ctx.arc(W-30,44,18,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#334155'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(W-30,44,24,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=cd.color; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(W-30,44,24,Math.PI/2,Math.PI/2+Math.PI*2*cfrac); ctx.stroke();
    ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(cd.emoji,W-30,44);
    ctx.strokeStyle=hexA(cd.color,0.5+0.3*Math.sin(now*0.008));
    ctx.lineWidth=3; ctx.strokeRect(3,3,W-6,H-6);
    ctx.fillStyle=hexA(cd.color,0.05); ctx.fillRect(0,0,W,H);
  }

  /* screen-space vignette: subtle edge darkening, one prerendered blit */
  ctx.drawImage(vigCanvas,0,0);

  /* flash tint */
  if(s.flashTimer>0){
    ctx.fillStyle=hexA(s.flashColor,Math.min(0.45,(s.flashTimer/0.4)*0.45));
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------------- LOOP (fixed timestep accumulator) ---------------- */
function frame(now){
  raf=requestAnimationFrame(frame);
  if(!S) return;
  pollGamepad();                                // 🎮 read the pad once per frame
  var st=padBtn(9);                             // Start: begin shift / pause / replay
  if(st&&!padStartPrev&&performance.now()>=padGraceUntil){
    if(S.phase==='menu') startGame();
    else if(S.phase==='end') startGame(S.daily);
    else togglePause();
  }
  padStartPrev=st;
  if(S.paused){ last=now; draw(S); return; }
  var dt=now-last; last=now;
  if(dt>250) dt=250;                 // tab was backgrounded — don't spiral
  acc+=dt;
  var steps=0;
  while(acc>=STEP*1000&&steps<4){ update(S,STEP); acc-=STEP*1000; steps++; }
  if(steps===4) acc=0;
  if(S._ordersDirty){ S._ordersDirty=false; renderOrders(S); }   // 🧾 dirty-flag flush: one DOM write per frame, not per update step (queue only mutates in update, which doesn't run while paused)
  draw(S);
  syncHud(S);
  if(S.phase==='play'){
    if(S.lives<=0) return endGame(S,'The bench eats another tech.');
    if(S.timeLeft<=0&&!S.overtime) return endGame(S,'Shift complete — clock out!');   // ⏱️ overtime holds the end
  }
}
function loop(){ last=performance.now(); raf=requestAnimationFrame(frame); }

/* ---------------- GAME FLOW ---------------- */
function startGame(daily,seedCode){
  audioInit();
  var sp=seedCode?parseSeedCode(seedCode):null;
  if(sp){ mode=sp.mode; lsSet('cc7_mode',mode); clearSeedRng(); setSeedRng(sp.seed); } else clearSeedRng();
  if(timerInt) clearInterval(timerInt);
  if(raf) cancelAnimationFrame(raf);
  loadProfile(daily?'daily':mode);  // each game mode keeps its own control prefs
  clearPointers();              // stale fingers from a previous shift must not steer the new tray
  S=freshState();
  if(graceOn()) S.graceTimer=GRACE_SEC;    // 🛡️ shift-start protection when the grace setting is on
  setBodyLock(true);
  S.phase='countdown'; S.count=2.1; S._lastCount=0;
  S.mode=daily?'daily':mode;   // the ladder this run reports into
  S.seedCode=sp?encodeSeedCode(sp.mode,sp.seed):null;   // 🔗 shareable code — Play Again replays the exact same shift
  if(daily){
    var p=planForDay();
    S.daily=true; S.dailyTarget=p.target; S.dailySeq=p.seq.slice(); S._dailyReached=false;
    S.best=bestForMode('daily');
  }
  S.timeLeft=modeRules(S).timer;   // ⚡ arcade / 🛠️ pro / 🧘 relaxed / daily: 60s (daily set first)
  fillQueue(S);
  for(var i=0;i<4;i++){ spawnItem(S); S.items[S.items.length-1].y=-34-i*90; }
  FX.reset();   // 🎆 one call clears every FX pool + screen-fx state (was hand-rolled loops)
  el['pause-btn'].style.display='block';
  hideOverlay();
  maybeStartTut();   // 🎓 first-run tutorial rides along on the first shift
  SFX.start();
  if(musicOn&&!muted) startMusic();
  timerInt=setInterval(function(){
    if(S&&S.phase==='play'&&!S.paused){ S.timeLeft-=1; if(S.timeLeft<=0) S.timeLeft=0; }
  },1000);
  last=performance.now(); acc=0;
  loop();
}
function endGame(s,reason){
  if(S.phase!=='play') return;
  clearSeedRng();   // 🔗 seeded runs: hand Math.random back to the host so normal play is fresh again
  S.phase='end';
  setBodyLock(false);
  if(s.timeLeft<=0&&s.lives>=LIVES&&!graceOn()) checkAch(s,'flush');   // 🛡️ the no-fail assist doesn't earn the flawless-life trophy
  if(s.newBest&&!s.daily) checkAch(s,'best');   // 'best' trophy = any mode's ladder beaten (each ladder is its own best)
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  stopMusic();
  el['pause-btn'].style.display='none';
  s.timeLeft=Math.max(0,s.timeLeft);
  if(s.score>s.best) s.best=s.score;
  if(s.newBest) SFX.newbest(); else SFX.gameover();
  showEnd(s,reason);
}

  get dailyLeft(){ return S&&S.daily&&S.dailySeq?S.dailySeq.length:0; },
  get dailyPlan(){ return planForDay(); },
  startDaily:function(){ startGame(true); },
  _updateStreak:function(beaten){ return updateDailyStreak(beaten); },
  _fireNextChaos:function(){ if(S&&S.daily&&S.dailySeq&&S.dailySeq.length){ var e=S.dailySeq.shift(); triggerChaos(S,e.chaos); return e.chaos; } return null; },
  /* 🔗 seed-code debug surface (harness): deterministic shareable runs */
  _seedCode:function(m,s){ return encodeSeedCode(m,s); },
  _parseSeed:function(c){ return parseSeedCode(c); },
  _seedStream:function(seed,n){ var r=seedStream(seed),a=[]; for(var i=0;i<(n||5);i++) a.push(r()); return a; },
  _playSeed:function(code){ var p=parseSeedCode(code); if(!p) return null; mode=p.mode; lsSet('cc7_mode',mode); startGame(false, code); return p; },
  get seedActive(){ return !!_seedRng; },
  /* 🎆 FX probe: live active counts (harness proves the pools really fill during play) */
  _fxProbe:function(){ return { p:FX.particles.filter(function(x){ return x.active; }).length, pop:FX.popups.filter(function(x){ return x.active; }).length, r:FX.rings.filter(function(x){ return x.active; }).length }; } };
/* ---- touch-safety: iOS pinch-zoom guard + mid-shift scroll lock ---- */
function setBodyLock(on){ try{ document.documentElement.classList.toggle('game-locked',on); document.body.classList.toggle('game-locked',on); }catch(e){} }
/* If the frame loop ever throws mid-shift, release the scroll lock so the page
   can't stay permanently stuck overflow:hidden (the end screen then still shows). */
try{ window.addEventListener('error',function(){ setBodyLock(false); clearSeedRng(); });
     window.addEventListener('unhandledrejection',function(){ setBodyLock(false); clearSeedRng(); }); }catch(e){}
try{ document.addEventListener('gesturestart',function(e){ e.preventDefault(); }); }catch(e){}
try{ document.addEventListener('gesturechange',function(e){ e.preventDefault(); }); }catch(e){}
el['mute-btn'].addEventListener('click',function(){ audioInit(); toggleMute(); });
el['music-btn'].addEventListener('click',function(){ audioInit(); toggleMusic(); });
el['pause-btn'].addEventListener('click',function(){ togglePause(); });
el['music-btn'].style.opacity=musicOn?'1':'0.35';
el['mute-btn'].textContent=muted?'🔇':'🔊';
S=freshState();
el['best-val'].textContent=bestForMode(mode);   // top-bar 🏆 shows the selected mode's own ladder
showMenu();
loop();
})();
</script>
