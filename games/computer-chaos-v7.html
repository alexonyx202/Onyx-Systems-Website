<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Computer Chaos 7</title>
<style>
/* Portrait-first on mobile: this is a vertical falling-parts game — the layout
   (HUD top, canvas, tray, controls) stacks naturally in portrait and is played
   one-thumbed. No rotate prompt: a phone held normally just plays. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b0e1a; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#e2e8f0; overscroll-behavior:none; }  /* no pull-to-refresh / rubber-band chaining */
  body { touch-action:manipulation; }   /* no double-tap zoom anywhere; inner scrollables keep scrolling */
  html.game-locked, body.game-locked { overflow:hidden; }  /* mid-shift: the page can't scroll under your thumb (inner lists still scroll) */
  #game-wrap { user-select:none; padding:1rem 0; max-width:520px; margin:0 auto;
    padding:max(1rem,env(safe-area-inset-top)) max(env(safe-area-inset-right),0px) max(1rem,env(safe-area-inset-bottom)) max(env(safe-area-inset-left),0px); }  /* notch/Home-Indicator clearance (env()=0 without a notch) */
  #ui-bar { display:flex; justify-content:space-between; align-items:center; max-width:520px; margin:0 auto 8px; gap:6px; flex-wrap:wrap; }
  .stat { font-size:14px; font-weight:600; color:#e2e8f0; background:#161b2e; border:1px solid #2a3358; border-radius:10px; padding:4px 10px; white-space:nowrap; }
  .stat span { color:#22d3ee; }
  .stat.hi span { color:#facc15; }
  .stat.low { border-color:#ef4444; color:#fca5a5; animation:lowpulse 0.7s ease-in-out infinite; }
  @keyframes lowpulse { 50% { box-shadow:0 0 10px rgba(239,68,68,0.5); } }
  #combo-box { max-width:520px; margin:6px auto 0; height:18px; display:flex; align-items:center; gap:8px; }
  .stat.ot { color:#facc15; animation:otpulse 0.7s ease-in-out infinite; }
  .stat.grace { border-color:#7dd3fc; box-shadow:0 0 12px rgba(125,211,252,0.45); }
  @keyframes otpulse { 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.22) } }
  @media (prefers-reduced-motion: reduce){ .stat.ot { animation:none; } }
  #combo-bar { flex:1; height:8px; background:#161b2e; border-radius:6px; overflow:hidden; border:1px solid #2a3358; transition:box-shadow .2s; }
  #combo-bar.hot { box-shadow:0 0 12px rgba(168,85,247,0.8); }
  #combo-bar.expiring { box-shadow:0 0 12px rgba(239,68,68,0.85); animation:combowarn 0.35s ease-in-out infinite; }
  @keyframes combowarn { 0%,100%{ transform:scale(1); filter:brightness(1); } 50%{ transform:scale(1.06); filter:brightness(1.5); } }
  @media (prefers-reduced-motion: reduce){ #combo-bar.expiring { animation:none; } }
  #combo-fill { height:100%; width:0%; background:linear-gradient(90deg,#a855f7,#22d3ee); transition:width 0.15s; }
  #combo-bar.expiring #combo-fill { background:linear-gradient(90deg,#ef4444,#a855f7); }
  #combo-num { font-size:12px; font-weight:800; color:#facc15; min-width:34px; text-align:right; }
  #order-box { max-width:520px; margin:8px auto 0; background:#161b2e; border-radius:12px; border:1px solid #2a3358; padding:8px 12px; display:flex; flex-direction:column; gap:4px; }
  #order-items { display:flex; flex-direction:column; gap:4px; }
  .order-row { display:flex; align-items:center; gap:8px; }
  .order-patron { font-size:20px; line-height:1; width:24px; text-align:center; flex:none; }
  .order-mood { font-size:13px; width:20px; text-align:center; flex:none; }
  .order-patience { width:56px; height:9px; background:#0f1424; border:1px solid #2a3358; border-radius:5px; overflow:hidden; flex:none; }
  .order-patience i { display:block; height:100%; border-radius:4px; transition:width .25s, background .25s; }
  .order-items { display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; }
  .order-item { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:2px solid #3b4a7a; background:#1b2240; transition:all 0.2s; flex:none; }
  .order-item.done { border-color:#22c55e; background:#14321f; transform:scale(0.92); }
  .order-item.locked { border-color:#f59e0b; box-shadow:0 0 8px rgba(245,158,11,0.5); }
  #canvas-container { position:relative; width:100%; max-width:520px; margin:0 auto; }
  canvas { display:block; width:100%; border-radius:14px; border:2px solid #22d3ee; touch-action:none; box-shadow:0 0 24px rgba(34,211,238,0.25), inset 0 0 60px rgba(10,14,26,0.6); }
  /* ---- 🎓 first-run tutorial: wordless, skippable, reduced-motion gated ---- */
  #tut-card { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:4;
    display:none; align-items:center; gap:9px; max-width:calc(100% - 108px);
    background:rgba(11,15,28,0.93); border:1px solid #2a3358; border-radius:12px;
    padding:6px 8px 6px 10px; box-shadow:0 6px 22px rgba(0,0,0,0.5); cursor:pointer;
    user-select:none; -webkit-user-select:none; }
  .tut-stage { position:relative; width:100px; height:48px; flex:0 0 auto; overflow:hidden;
    border-radius:8px; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.09); }
  .tut-tray { position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:54px; height:5px;
    border-radius:3px; background:#22d3ee; box-shadow:0 0 10px rgba(34,211,238,0.7); }
  .tut-fall { position:absolute; top:-4px; left:50%; margin-left:-10px; font-size:20px; animation:tut-fall 1.5s ease-in infinite; }
  .tut-slide { position:absolute; bottom:9px; left:50%; margin-left:-11px; font-size:19px; animation:tut-slide 1.5s ease-in-out infinite; }
  .tut-x { position:absolute; top:4px; left:50%; margin-left:-8px; font-size:17px; color:#f87171; animation:tut-x 1.5s ease-in-out infinite; }
  .tut-dodge { position:absolute; bottom:4px; left:50%; width:54px; height:5px; border-radius:3px;
    background:#22d3ee; box-shadow:0 0 10px rgba(34,211,238,0.7); animation:tut-dodge 1.5s ease-in-out infinite; }
  .tut-ring { position:absolute; top:4px; right:2px; width:30px; height:30px; border-radius:50%;
    border:2px solid #a855f7; animation:tut-ring 1.1s ease-out infinite; }
  .tut-wrench { position:absolute; top:8px; right:6px; font-size:24px; filter:drop-shadow(0 0 7px rgba(168,85,247,0.9)); animation:tut-wrench 1.1s ease-in-out infinite; }
  .tut-tap { position:absolute; bottom:9px; font-size:19px; animation:tut-tap 1.1s ease-in-out infinite; }
  .tut-tap2 { left:16px; animation-delay:0.22s; }
  .tut-side { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .tut-dots { display:flex; gap:4px; }
  .tut-dot { width:6px; height:6px; border-radius:50%; background:#334155; transition:background .25s, transform .25s; }
  .tut-dot.on { background:#22d3ee; transform:scale(1.3); box-shadow:0 0 7px rgba(34,211,238,0.85); }
  #tut-skip { background:rgba(255,255,255,0.06); border:1px solid #334155; color:#94a3b8; font-size:15px;
    border-radius:8px; padding:1px 8px; cursor:pointer; line-height:1.5; transition:all .2s; }
  #tut-skip:hover { border-color:#22d3ee; color:#e2e8f0; }
  @keyframes tut-fall { 0%{ transform:translateY(-4px); opacity:0; } 12%{ opacity:1; } 88%{ opacity:1; } 100%{ transform:translateY(36px); opacity:0.4; } }
  @keyframes tut-slide { 0%,100%{ transform:translateX(-17px); } 50%{ transform:translateX(17px); } }
  @keyframes tut-x { 0%,52%{ transform:scale(0.4); opacity:0; } 68%,100%{ transform:scale(1.2); opacity:1; } }
  @keyframes tut-dodge { 0%,100%{ transform:translateX(17px); } 50%{ transform:translateX(-17px); } }
  @keyframes tut-tap { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  @keyframes tut-wrench { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }
  @keyframes tut-ring { 0%{ transform:scale(0.45); opacity:0.9; } 100%{ transform:scale(1.3); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ #tut-card .tut-anim { animation:none !important; } }
  #pause-btn, #mute-btn, #music-btn { position:absolute; z-index:6; background:rgba(22,27,46,0.8); color:#94a3b8; border:1px solid #2a3358; border-radius:11px; width:44px; height:44px; cursor:pointer; font-size:17px; line-height:1; }
  #pause-btn { top:8px; left:8px; display:none; }
  #mute-btn { top:8px; right:8px; }
  #music-btn { top:60px; right:8px; }
  #pause-btn:hover, #mute-btn:hover, #music-btn:hover { color:#e2e8f0; border-color:#22d3ee; }
  /* full-viewport modal on EVERY screen (not just landscape): the canvas is 520×440 on desktop and
     scales to ~300px tall on portrait phones, which would crush the title screen into a tiny scrolly
     window. fixed + inset:0 gives every overlay the whole window; #ov-wrap's auto margins center the
     content when short and scroll it from the top when tall. */
  #msg-overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; border-radius:0;
    background:radial-gradient(ellipse 130% 100% at 50% 18%, #141a33 0%, #0b0e1a 52%, #070910 100%); z-index:5; text-align:center; padding:18px; overflow:auto; }
  #ov-wrap { margin:auto; width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; z-index:1; }  /* auto margins: centers when short, scrolls from top when tall; 560px cap keeps the full-screen modal a tidy centered column on desktop; z-index:1 (flex-item stacking) lifts the content above the ambient starfield/aurora layers below */
  /* ambient backdrop: a slow-drifting starfield + breathing aurora behind every overlay.
     Pure CSS, transform/opacity only (compositor-friendly, never adds scrollable overflow),
     reduced-motion-gated. The pseudos paint above the overlay's own gradient but below
     #ov-wrap (z-index:1), so every menu and sub-screen sits on the same quiet night sky. */
  #msg-overlay::before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle 1px at 23px 41px, rgba(165,243,252,0.95), transparent),
      radial-gradient(circle 1px at 87px 19px, rgba(226,232,255,0.75), transparent),
      radial-gradient(circle 1.5px at 141px 93px, rgba(125,211,252,0.55), transparent),
      radial-gradient(circle 1px at 181px 47px, rgba(226,232,255,0.65), transparent),
      radial-gradient(circle 1px at 58px 128px, rgba(255,255,255,0.5), transparent),
      radial-gradient(circle 1px at 217px 136px, rgba(165,243,252,0.5), transparent),
      radial-gradient(circle 1px at 121px 165px, rgba(226,232,255,0.45), transparent),
      radial-gradient(circle 1px at 249px 79px, rgba(255,255,255,0.4), transparent),
      radial-gradient(circle 1px at 305px 121px, rgba(125,211,252,0.5), transparent),
      radial-gradient(circle 1px at 333px 41px, rgba(226,232,255,0.6), transparent),
      radial-gradient(circle 1.5px at 273px 201px, rgba(165,243,252,0.45), transparent),
      radial-gradient(circle 1px at 23px 209px, rgba(226,232,255,0.55), transparent),
      radial-gradient(circle 1px at 159px 241px, rgba(255,255,255,0.4), transparent),
      radial-gradient(circle 1px at 346px 177px, rgba(125,211,252,0.5), transparent);
    background-size: 380px 270px;
    opacity:.55;
    animation: stars-drift 16s ease-in-out infinite alternate;
  }
  #msg-overlay::after {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 65% 50% at 16% 10%, rgba(56,189,248,0.12), transparent 72%),
      radial-gradient(ellipse 60% 45% at 84% 80%, rgba(168,85,247,0.12), transparent 72%),
      radial-gradient(ellipse 50% 40% at 68% 28%, rgba(34,211,238,0.08), transparent 70%);
    animation: aurora-drift 34s ease-in-out infinite alternate;
  }
  @keyframes stars-drift { from { opacity:.35; transform:translate(0,0); } to { opacity:.75; transform:translate(-16px,-10px); } }
  @keyframes aurora-drift { from { transform:translate(0,0) scale(1); } to { transform:translate(2.5%,-1.5%) scale(1.05); } }
  @media (prefers-reduced-motion: reduce){
    #msg-overlay::before, #msg-overlay::after { animation:none; }
    #msg-overlay::before { opacity:.5; }
    #msg-overlay::after { opacity:.13; }
  }
  #msg-title { font-size:30px; font-weight:800; color:#22d3ee; margin-bottom:8px; text-shadow:0 0 18px rgba(34,211,238,0.6); }
  #msg-sub { font-size:14px; color:#94a3b8; margin-bottom:16px; padding:0 8px; line-height:1.5; }
  #msg-stats { font-size:15px; color:#e2e8f0; margin-bottom:6px; font-weight:700; }
  #msg-stats2 { font-size:13px; color:#94a3b8; margin-bottom:14px; }
  #new-best { display:none; font-size:15px; font-weight:800; color:#facc15; margin-bottom:10px; letter-spacing:1px; text-shadow:0 0 14px rgba(250,204,21,0.7); animation:bestpop 0.5s ease-out infinite alternate; }
  @keyframes bestpop { from{transform:scale(1)} to{transform:scale(1.08)} }
  /* ===== title screen hero ===== */
  .menu-hero { width:100%; display:flex; flex-direction:column; align-items:center; margin-bottom:6px; }
  .hero-field { position:relative; width:100%; height:86px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .hero-emoji { position:absolute; top:-18px; font-size:20px; opacity:0; animation:menu-fall linear infinite; pointer-events:none; z-index:0; }
  @keyframes menu-fall { 0%{ transform:translateY(0) rotate(-8deg); opacity:0 } 14%{ opacity:0.34 } 82%{ opacity:0.34 } 100%{ transform:translateY(110px) rotate(10deg); opacity:0 } }
  @media (prefers-reduced-motion: reduce){ .hero-emoji { display:none; } }
  .wordmark { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; line-height:1.02; }
  .wm-top { font-size:16px; font-weight:800; color:#a78bfa; letter-spacing:9px; padding-left:9px; text-shadow:0 0 14px rgba(167,139,250,0.5); }
  .wm-bot { font-size:52px; font-weight:900; letter-spacing:3px; padding-left:3px; color:#22d3ee;
    background:linear-gradient(180deg,#a5f3fc 0%,#22d3ee 55%,#a855f7 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px rgba(34,211,238,0.55)); }
  .tagline { font-size:12px; color:#7c8db5; letter-spacing:2px; text-transform:uppercase; margin-top:2px; }

  /* ===== mode cards — the three ways to play (one-tap launch, Fitts-friendly) ===== */
  #mode-cards { display:flex; gap:10px; margin:8px 0 2px; width:min(340px,92%); }
  .mode-card { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:#12172b; border:1.5px solid #2a3358; border-radius:16px; padding:10px 4px 9px; cursor:pointer;
    transition:all .18s; min-width:0; }
  .mode-card:hover { border-color:#22d3ee; transform:translateY(-2px); box-shadow:0 6px 18px rgba(34,211,238,0.22); }
  .mode-card:active { transform:translateY(0) scale(0.97); }
  .mode-card.active { border-color:transparent; background:linear-gradient(160deg,#1b2a52,#12172b 70%);
    box-shadow:0 0 0 1.5px #22d3ee, 0 6px 22px rgba(34,211,238,0.35); }
  .mc-emoji { font-size:26px; line-height:1.15; }
  .mc-name { font-size:13px; font-weight:800; color:#e2e8f0; letter-spacing:0.3px; }
  .mc-tag { font-size:9.5px; font-weight:700; color:#7c8db5; letter-spacing:0.3px; text-align:center; line-height:1.25; }
  .mc-best { font-size:9px; font-weight:800; color:#facc15; letter-spacing:0.3px; margin-top:1px;
    background:rgba(250,204,21,0.10); border:1px solid rgba(250,204,21,0.28); border-radius:999px; padding:1px 8px; line-height:1.5; }
  .mc-best.zero { color:#5b6b92; background:rgba(91,107,146,0.10); border-color:rgba(91,107,146,0.28); }
  .mode-card.active .mc-name { color:#a5f3fc; }
  .mode-card.active .mc-tag { color:#94a3b8; }
  .mode-card.active .mc-best { color:#fde68a; border-color:rgba(250,204,21,0.45); }
  .mc-play { position:absolute; top:-8px; right:-8px; font-size:12px; background:#22d3ee; color:#06121a;
    border-radius:999px; padding:2px 7px; font-weight:900; box-shadow:0 2px 8px rgba(34,211,238,0.5); }
  .mc-pro-new { position:absolute; top:-8px; left:-8px; font-size:9px; font-weight:900; letter-spacing:0.5px;
    background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; border-radius:999px; padding:2px 8px;
    box-shadow:0 2px 8px rgba(245,158,11,0.5); animation:bestpop 0.5s ease-out infinite alternate; }
  @media (prefers-reduced-motion: reduce){ .mc-pro-new { animation:none; } }
  .mode-hint { font-size:10.5px; color:#5b6b92; letter-spacing:1.2px; text-transform:uppercase; margin:3px 0 0; }

  /* ===== 🎚️ per-mode difficulty — Gentle / Standard / Challenging (menu row + per-card badge) ===== */
  #diff-row { display:flex; align-items:center; gap:8px; margin:4px 0 2px; width:min(340px,92%); }
  .diff-seg { display:flex; background:#0d1224; border:1px solid #2a3358; border-radius:999px; padding:2px; flex:1; min-width:0; }
  .diff-seg-btn { flex:1; font-size:10px; font-weight:800; color:#7c8db5; background:transparent; border:0;
    border-radius:999px; padding:5px 4px; cursor:pointer; transition:all .15s; letter-spacing:0.3px; }
  .diff-seg-btn:hover { color:#e2e8f0; }
  .diff-seg-btn.active { background:#22d3ee; color:#06121a; box-shadow:0 2px 8px rgba(34,211,238,0.35); }
  .diff-for { font-size:9.5px; font-weight:700; color:#5b6b92; white-space:nowrap; }
  .mc-diff { margin-top:2px; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; line-height:1.5;
    background:rgba(126,231,168,0.12); border:1px solid rgba(126,231,168,0.30); color:#7ee7a8; border-radius:999px;
    padding:1px 7px; cursor:pointer; transition:all .15s; }
  .mc-diff:hover { transform:translateY(-1px); box-shadow:0 2px 8px rgba(126,231,168,0.25); }
  .mc-diff.d-standard { background:rgba(34,211,238,0.12); border-color:rgba(34,211,238,0.30); color:#7dd3fc; }
  .mc-diff.d-standard:hover { box-shadow:0 2px 8px rgba(34,211,238,0.25); }
  .mc-diff.d-hard { background:rgba(251,146,60,0.12); border-color:rgba(251,146,60,0.32); color:#fdba74; }
  .mc-diff.d-hard:hover { box-shadow:0 2px 8px rgba(251,146,60,0.25); }
  .order-row.arcade-row { justify-content:center; }
  .order-row.arcade-row .order-items { width:auto; }
  #ctrl-row { display:flex; gap:8px; margin:0 0 14px; }
  .ctrl-btn { background:#161b2e; color:#cbd5e1; border:1px solid #2a3358; border-radius:10px; padding:11px 16px; font-size:13px; font-weight:700; cursor:pointer; min-height:42px; }
  .ctrl-btn.active { background:linear-gradient(135deg,#22d3ee,#a855f7); color:#06121a; border-color:transparent; }
  #lift-row { width:100%; max-width:300px; margin:0 0 14px; display:flex; align-items:center; gap:10px; transition:opacity .25s; }
  #lift-row.off { opacity:0.45; }
  #lift-label { font-size:12px; color:#94a3b8; white-space:nowrap; }
  #lift-val { color:#facc15; font-weight:800; margin-left:4px; }
  #lift-slider { flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:#2a3358; outline:none; cursor:pointer; }
  #lift-slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#22d3ee,#a855f7); border:2px solid #06121a; cursor:pointer; }
  #lift-slider::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#22d3ee,#a855f7); border:2px solid #06121a; cursor:pointer; }
  /* ===== controls screen — grouped like the Tips screen (Tray move / Lift height) ===== */
  .ctrl-group { width:100%; max-width:430px; margin:0 0 12px; }
  .ctrl-head { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase;
    color:#22d3ee; margin-bottom:6px; }
  .ctrl-head::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, rgba(34,211,238,0.4), transparent); }
  .ctrl-head.ch-move { color:#a78bfa; } .ctrl-head.ch-move::after { background:linear-gradient(90deg, rgba(167,139,250,0.4), transparent); }
  .ctrl-head.ch-lift { color:#fbbf24; } .ctrl-head.ch-lift::after { background:linear-gradient(90deg, rgba(251,191,36,0.4), transparent); }
  .ctrl-row-tip { display:flex; align-items:flex-start; gap:8px; background:#12172b; border:1px solid #2a3358; border-left:3px solid #f59e0b;
    border-radius:10px; padding:7px 10px; margin:0 0 12px; text-align:left; transition:border-color .15s, transform .15s, background .15s; }
  .ctrl-row-tip:hover { border-color:#f59e0b; background:#161c33; transform:translateY(-1px); }
  .ctrl-row-tip .t-emoji { font-size:16px; line-height:1.3; flex:none; }
  .ctrl-row-tip .t-txt { font-size:11.5px; line-height:1.4; color:#cbd5e1; }
  .ctrl-row-tip .t-txt b { color:#e2e8f0; }
  #ctrl-footer { display:flex; align-items:center; justify-content:center; gap:10px; font-size:11px; color:#64748b;
    margin:0 0 12px; letter-spacing:0.3px; }
  #ctrl-footer .sep { opacity:0.5; }

function yesterdayKey(){ var d=_todayOverride?new Date(_todayOverride+'T12:00:00'):new Date(); d.setDate(d.getDate()-1); return dateKey(d); }

function planForDay(){
  var rng=mulberry32(hashStr('cc7daily-'+todayKey()));
  var target=500+Math.floor(rng()*13)*50;   // 🌍 world target 500..1100 (steps of 50)
  /* only TIMED chaos in the daily plan (instant events would flash and vanish) */
  var keys=Object.keys(CHAOS_DEF).filter(function(k){ return CHAOS_DEF[k].dur>0; }), i, j;
  for(i=keys.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); var t=keys[i]; keys[i]=keys[j]; keys[j]=t; }
  var picks=keys.slice(0,3);                // 3 unique chaos patterns, seeded per day
  var times=[14+rng()*8, 30+rng()*8, 46+rng()*8].sort(function(a,b){ return a-b; });
  var seq=[];
  for(i=0;i<3;i++) seq.push({at:Math.round(times[i]), chaos:picks[i]});

}
function dailyStreak(){ return parseInt(lsGet('cc7_daily_streak','0'),10)||0; }

  if(!beaten) return dailyStreak();
  var today=todayKey();
  if(lsGet('cc7_daily_last','')===today) return dailyStreak(); // already counted today
  var streak=(lsGet('cc7_daily_last','')===yesterdayKey())?dailyStreak()+1:1;
  lsSet('cc7_daily_streak',streak); lsSet('cc7_daily_last',today);
  var best=parseInt(lsGet('cc7_daily_beststreak','0'),10)||0;
  if(streak>best) lsSet('cc7_daily_beststreak',streak);

}

/* ---------------- SEED CODES (shareable deterministic runs) ----------------
   Any run can be a seed code: CC-XXXXX encodes mode + seed. Pasted into the 🔗 Seeds
   screen (or the end screen), it replays that EXACT shift — same chaos, same spawns,
   same bosses — for everyone. Determinism = a mulberry32 stream swapped in as
   Math.random for the run's duration (captured at boot, restored on end), so every
   existing Math.random() call site participates without being touched. */
var _hostRandom=Math.random;                       // the host RNG at boot (native in a browser; the harness LCG in tests)
var _seedRng=null;                                 // active seeded stream during a seeded run, else null
var SEED_ALPH='0123456789ABCDEFGHJKMNPQRSTVWXYZ';   // Crockford base32: 32 unambiguous chars (no I/L/O/U)
var SEED_MODES=['arcade','pro','relaxed'];         // 🌞 daily stays date-seeded (its date IS the code)
function encodeSeedCode(mode,seed){
  var m=SEED_MODES.indexOf(mode); if(m<0) return null;
  var s=((seed|0)%32768+32768)%32768;              // 3 chars of seed → 32^3 = 32768 unique runs per mode
  var v=[m,(s>>10)&31,(s>>5)&31,s&31];
  var c=(v[0]+2*v[1]+3*v[2]+4*v[3])%32;            // weighted checksum — also catches transposed chars when pasting
  return 'CC-'+SEED_ALPH.charAt(m)+SEED_ALPH.charAt(v[1])+SEED_ALPH.charAt(v[2])+SEED_ALPH.charAt(v[3])+SEED_ALPH.charAt(c);
}
function parseSeedCode(code){
  if(!code) return null;
  var s=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.slice(0,2)==='CC') s=s.slice(2);
  if(s.length!==5) return null;
  var v=[];
  for(var i=0;i<5;i++){ var p=SEED_ALPH.indexOf(s.charAt(i)); if(p<0) return null; v.push(p); }
  if((v[0]+2*v[1]+3*v[2]+4*v[3])%32!==v[4]) return null; // weighted checksum mismatch → typo or transposition
  if(v[0]>=SEED_MODES.length) return null;
  return {mode:SEED_MODES[v[0]], seed:(v[1]<<10)|(v[2]<<5)|v[3]};
}
function seedStream(seed){ return mulberry32(hashStr('cc7seed-'+seed)); }
function setSeedRng(seed){ _seedRng=seedStream(seed); Math.random=function(){ return _seedRng(); }; }
function clearSeedRng(){ _seedRng=null; Math.random=_hostRandom; }
function copyText(t,btn){

     so the UI must never wait on it (and a sync textarea fallback always runs) */
  if(btn){ btn.textContent='copied ✓'; btn.classList.add('copied'); setTimeout(function(){ btn.textContent='copy'; btn.classList.remove('copied'); },1400); }

}

var AC=null, master=null, sfxGain=null;

    master=AC.createGain(); master.gain.value=0.35; master.connect(AC.destination);
    sfxGain=AC.createGain(); sfxGain.gain.value=1; sfxGain.connect(master);

}
var SFX={

     calling the bare tone/noise/schedule names, which are thin aliases below — so no
     call site changes and the pinned fanfare/thud strings stay byte-identical. */
  tone:function(freq,dur,type,vol,slideTo,delay){
    if(!AC||muted) return;
    var t0=AC.currentTime+(delay||0);
    var o=AC.createOscillator(), g=AC.createGain();

    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(vol||0.18,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(sfxGain);
    o.start(t0); o.stop(t0+dur+0.03);
  },
  noise:function(dur,vol,freq,type){
    if(!AC||muted) return;
    var t=AC.currentTime, n=Math.floor(AC.sampleRate*(dur||0.18));
    var buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);

    var g=AC.createGain(); g.gain.setValueAtTime(vol||0.22,t);

    }

  order:function(){ schedule([523,659,784,1047],0,0.18,'triangle',0.22); },

    else { schedule([392,523,466,622,523,699],0,0.08,'square',0.18); noise(0.25,0.15,900,'bandpass'); }   // 🛒 frantic staccato bustle

    if(s.score>prev){ lsSet('cc7_daily_best',s.score); s.newBest=true; }
    updateDailyStreak(s.score>=s.dailyTarget);
    if(s.score>=s.dailyTarget) checkAch(s,'daily');
    var st=dailyStreak();
    if(st>=3) checkAch(s,'d3');
    if(st>=7) checkAch(s,'d7');
    return;
  }
  var ladder=s.mode||mode;                       // this run's own ladder (arcade/pro/relaxed)
  var pm=parseInt(lsGet('cc7_best_'+ladder,'0'),10)||0;
  if(s.score>pm){ lsSet('cc7_best_'+ladder,s.score); s.newBest=true; }   // 🏅 per-mode best
  totalOrders+=s.orders; runsPlayed++;
  bestCombo=Math.max(bestCombo,s.bestComboRun);
  lsSet('cc7_total',totalOrders); lsSet('cc7_runs',runsPlayed); lsSet('cc7_bestcombo',bestCombo);
  if(s.score>bestScore){ bestScore=s.score; lsSet('cc7_best',bestScore); }   // overall best stays the max across all modes
}

/* ---------------- ORDER SYSTEM (multi-order queue + patrons) ---------------- */
function queueCap(s){   /* how many orders are on the bench at once */
  var rules=modeRules(s);
  if(rules.queueCap!=='level') return rules.queueCap;   // ⚡ arcade: always a single order
  if(s.boss) return s.boss.def.orders;
  return s.level>=9?2:1;
}
function fillQueue(s){
  while(s.queue.length<queueCap(s)){
    var t=pickOrderTemplate(s);
    var o={p:t.parts.slice(), c:[], patron:freshPatron(), reward:t.reward, diff:t.diff};
    /* 🌡️ meltdown: heat-relevant parts cool the bar (fan/paste/heatsink) */
    o.coolParts=t.parts.filter(function(x){ return x==='fan'||x==='paste'||x==='heatsink'; }).length>0;
    s.queue.push(o);
  }
  s._ordersDirty=true;
}
function nextNeeded(s){
  for(var i=0;i<s.queue.length;i++){ var q=s.queue[i]; if(q.c.length<q.p.length) return q.p[q.c.length]; }
  return null;
}
function nextNeededOf(q){ return q.c.length<q.p.length?q.p[q.c.length]:null; }
function orderForCode(s,code){
  /* first order whose next needed part matches (skipping a 🔀-locked slot) */
  for(var i=0;i<s.queue.length;i++){ var q=s.queue[i];
    var n=nextNeededOf(q);
    if(n===code&&!(s.cableLock&&s.cableLock.oi===i&&s.cableLock.si===q.c.length)) return q;
  }
  return null;
}
function patienceBonus(q,amount){
  q.patron.pat=Math.max(0,Math.min(100,q.patron.pat+amount));
}
function tipFor(q){ return q.patron.pat>80?q.reward:(q.patron.pat>50?Math.floor(q.reward/2):0); }
function levelFor(s){ return 1+Math.floor(s.orders/(modeRules(s).levelDiv||3)); }   // 🧘 relaxed: 5 orders/level — gentler curve
function shieldHit(s,x,y){
  /* 🛡️ no-fail grace: absorb the hit — fresh shield, no life loss, no combo reset */
  s.graceTimer=GRACE_SEC;
  burst(x,y,'#7dd3fc',10); popup(x,y-24,'🛡️','#7dd3fc'); ring(x,y,'#7dd3fc'); SFX.shield();
}
function renderOrders(s){
  var h='';
  var patrons=modeRules(s).patrons;
  for(var i=0;i<s.queue.length;i++){
    var q=s.queue[i], n=nextNeededOf(q);
    var bar=q.patron.pat>60?'#22c55e':(q.patron.pat>30?'#facc15':'#ef4444');
    var mood=patronMood(q.patron);
    var locked=s.cableLock&&s.cableLock.oi===i?s.cableLock.si:-1;
    var items='';
    for(var k=0;k<q.p.length;k++){
      var cls='order-item'+(k<q.c.length?' done':'')+(k===locked?' locked':'');
      items+='<div class="'+cls+'"'+(k===locked?' title="🔒"':'')+'>'+
        '<span style="font-size:16px;line-height:1">'+(k===locked?'🔒':PART_EMOJI[q.p[k]])+'</span></div>';
    }
    /* ⚡ arcade: a bare job row — the order itself, no patron personality */
    if(!patrons){
      h+='<div class="order-row arcade-row"><div class="order-items">'+items+'</div></div>';
      continue;
    }
    h+='<div class="order-row">'+
      '<span class="order-patron">'+q.patron.av+'</span>'+
      '<span class="order-mood">'+mood+'</span>'+
      '<div class="order-patience"><i style="width:'+Math.round(q.patron.pat)+'%;background:'+bar+'"></i></div>'+
      '<div class="order-items">'+items+'</div>'+
      '</div>';
  }
  el['order-items'].innerHTML=h;
}
function completeOrder(s,oi){
  var q=s.queue[oi];
  var rules=modeRules(s);
  var reward=q.reward*Math.max(1,1+Math.floor((s.level-1)/3));   // reward scales with level bands
  var tip=rules.patrons?tipFor(q):0;                              // ⚡ arcade: flat reward, no tips
  var total=reward+tip;
  s.score+=total;
  s.orders++; s.level=levelFor(s);
  var py=TRAY_Y-20;
  if(tip>=q.reward){ popup(W/2,py-30,'💖 +'+total,'#f472b6'); burst(W/2,py,'#f472b6',16); }
  else popup(W/2,py-30,'+'+total,'#22d3ee');
  ring(W/2,py,'#22d3ee'); burst(W/2,py,'#22d3ee',20);
  addFlash(tip>0?'#f472b6':'#22c55e',0.22); addHitStop(0.06); addTrauma(0.3);
  SFX.order();

  s.queue.splice(oi,1);
  checkAch(s,'first');
  if(s.orders>=8) checkAch(s,'o8');
  if(s.level!==1&&(s.orders%3===0)){
    addFlash('#22d3ee',0.3); popup(W/2,H/2-70,'LEVEL '+s.level,'#a855f7');
    if(s.orders%6!==0) SFX.level();   // 🔕 on a boss beat the wave stinger owns the moment (level jingle would stack)
    addTrauma(0.2);
    if(s.level>=5) checkAch(s,'lv5');
  }
  if(s.boss){ s.bossTotal++; defeatBossIfReady(s); }
  else if(modeRules(s).bosses&&s.orders%6===0) startBoss(s);    // 🛒🌡️🎒 wave every 6 orders — fires ~45s in, leaving real runway before the bell
  if(s.overtime){ /* shift's over — finish this order, then clock out (no refill) */ }
  else fillQueue(s);
}

/* ---------------- ITEMS ---------------- */
function weightedPartCode(s){
  var rules=modeRules(s);
  var list=PARTS, total=PART_WEIGHT_TOTAL;
  if(rules.catalog){  // ⚡ arcade / 🧘 relaxed: weighted over the curated catalog only
    var wt=0, subset=[];
    for(var a=0;a<PARTS.length;a++){ if(rules.catalog.indexOf(PARTS[a][0])>=0){ subset.push(PARTS[a]); wt+=PARTS[a][3]; } }
    list=subset; total=wt;
  }
  /* 🎒 supply shortage: the stocked-out code never drops */
  /* 🌡️ meltdown: only core parts drop */
  var r=Math.random()*total;
  for(var i=0;i<list.length;i++){
    var c=list[i][0];
    if(s.stock===c) continue;
    if(s.boss&&s.boss.def.coreOnly&&list[i][2]!=='core') continue;
    r-=list[i][3];
    if(r<=0) return c;
  }
  return list.length?list[0][0]:'screw';
}
function orderPool(s){
  /* 🎯 order-gated drops: the ONLY good parts that fall are ones the current queue
     can actually use (union of all orders' remaining parts). No more useless
     duplicates — every good catch is progress on an open order (Overcooked model). */
  var pool=[], seen={};
  for(var oi=0;oi<s.queue.length;oi++){
    var q=s.queue[oi];
    for(var pi=q.c.length;pi<q.p.length;pi++){
      var c=q.p[pi];
      if(!seen[c]){ seen[c]=1; pool.push(c); }
    }
  }
  return pool;
}
function pickDistinct(list,last){
  /* bag-style no-repeat: prefer any entry that isn't the last one drawn */
  if(!list.length) return null;
  var alt=list.filter(function(x){ return x!==last; });
  return (alt.length?alt:list)[Math.floor(Math.random()*(alt.length?alt.length:list.length))];
}
function earlyEase(s){
  /* 🛹 early-shift grace (arcade-only): fewer junk + a slower line for the first levels,
     fading out by level 6 — keeps slow/novice players under the 15% death floor without
     touching mid/late pacing. Pro/daily/relaxed don't set it → ease 1. */
  var e=modeRules(s).earlyEase||0;
  if(!e) return 1;
  return 1 - e*Math.max(0,(6-s.level))/5;   // level 1 → 1−e … level ≥6 → exactly 1.0
}
function spawnItem(s){
  var rules=modeRules(s);
  /* 🚦 readability: when the bench is already full, skip the spawn this tick — the
     field stays readable (5–8 objects ideal; the 42 hard cap is the engine safety net) */
  if(s.items.length>=MAX_VIS_ITEMS) return;
  var needed=nextNeeded(s);
  var junkOn=0; for(var jx=0;jx<s.items.length;jx++){ if(s.items[jx].type==='junk') junkOn++; }
  var junkP=Math.min(BALANCE.junkCap, BALANCE.junkBase+s.level*BALANCE.junkPerLevel)+(s.boss?s.boss.def.junkAdd:0);   // 📊 BALANCE table: gentler junk ceiling (26%→20%)
  if(junkOn>=3) junkP=0;                                // never more than ~3 junk on screen at once
  junkP*=rules.junkMul;                      // relaxed: rare junk; daily is uniform
  junkP*=earlyEase(s);                        // 🛹 arcade early grace: fewer junk at the start (fades by level 6)
  var isPow=Math.random()<0.06;
  var isBad=!isPow&&Math.random()<junkP;
  var isNeeded=!isPow&&!isBad&&(Math.random()<0.72||s.noNeeded>=5);   // needed-part pity: never drought past ~5 good drops
  s.noNeeded=isNeeded?0:(s.noNeeded+1);
  var emoji,type,code;
  if(isPow){ emoji=pickDistinct(POWERUPS,s.lastJunk); type='powerup'; code=null; s.lastJunk=emoji; }
  else if(isBad){ emoji=pickDistinct(JUNK,s.lastJunk); type='junk'; code=null; s.lastJunk=emoji; }
  else if(isNeeded&&needed&&needed!==s.stock){ code=needed; emoji=PART_EMOJI[needed]; type='good'; s.lastPart=code; }
  else {
    /* 🎯 order-gated pool: a good drop is a part some open order still needs.
       Light = parts on screen <2×; when everything's already doubled we still
       drop from the pool (a 3rd copy stays useful for orders that need a part
       twice) — the catalog fallback only fires when the pool is empty. */
    var pool=orderPool(s);
    if(pool.length){
      /* 🌡️ meltdown coreOnly: filler drops are core-only (the needed part still
         falls — orders may legitimately ask for anything, same as before) */
      if(s.boss&&s.boss.def.coreOnly) pool=pool.filter(function(c){ return PART[c].group==='core'; });
      var onScreen={};
      for(var cx=0;cx<s.items.length;cx++){ var it=s.items[cx]; if(it.type==='good'&&it.code) onScreen[it.code]=(onScreen[it.code]||0)+1; }
      var light=pool.filter(function(c){ return (onScreen[c]||0)<2; });
      code=pickDistinct(light.length?light:pool, s.lastPart);
    }
    if(!code) code=weightedPartCode(s);
    emoji=PART_EMOJI[code]; type='good'; s.lastPart=code;
  }
  if(s.items.length>42) s.items.shift(); // hard cap
  var speed=(1.5+Math.random()*BALANCE.speedRand)*BALANCE.speedBaseMul*rules.speedMul+Math.min(s.level,BALANCE.speedPlateau)*BALANCE.speedPerLevel;   // 📊 BALANCE table: speed plateau at level 15 — the 110px dodge window must stay ≥ a human reaction+travel budget (~445ms) in any longer mode
  if(s.chaos==='deadpsu') speed*=1.25;                       // 🔌 dead PSU: everything falls faster
  if(s.boss) speed*=s.boss.def.speedMul;                      // boss wave pacing
  if(s.heatLevel>0) speed*=(1+0.12*s.heatLevel);              // 🌡️ cooling failure ramp
  s.items.push({x:28+Math.random()*(W-56), y:-34, emoji:emoji, type:type, code:code,
    speed:speed, scale:0.2, rot:(Math.random()-0.5)*0.4});
}
function spawnInterval(s){
  var iv=Math.max(BALANCE.spawnFloor, BALANCE.spawnBase-s.level*BALANCE.spawnPerLevel);
  iv*=modeRules(s).spawnMul||1;         // per-mode pacing: arcade 0.94 fast · pro/daily 1.0 (probe-fairest) · relaxed 1.4 zen
  iv*=(1+(1-earlyEase(s))*0.5);         // 🛹 arcade early grace: gentler line at the start (half the junk strength)
  if(s.chaos==='coffee') iv*=1.25;      // spilled coffee slows the line
  if(s.boss&&s.boss.def.id==='school') iv*=0.72;   // 🎒 back-to-school: high part volume
  return iv;
}

/* ---------------- CHAOS (all 10 events; instant ones fire and clear) ---------------- */
function chaosPick(s,forced){
  if(forced) return forced;
  var rules=modeRules(s);
  if(s.boss){ var b=s.boss.def.bias; return b[Math.floor(Math.random()*b.length)]; }   // boss chaos bias
  var keys=rules.chaos||Object.keys(CHAOS_DEF);   // ⚡ arcade: only its 4 classics · 🧘 relaxed: none
  if(!keys.length) return null;
  return keys[Math.floor(Math.random()*keys.length)];
}
function applyChaosEffect(s,pick){
  var cd=CHAOS_DEF[pick];
  s.inputFreeze=(pick==='static')?cd.dur:0;
  s.smudge=(pick==='coffee')?{x1:60+Math.random()*200,y1:60+Math.random()*160,r1:50+Math.random()*40,
    x2:300+Math.random()*160,y2:120+Math.random()*140,r2:40+Math.random()*40}:null;
  if(pick==='wrongpart'){
    /* 🔄 wrong part installed: every order's caught progress resets to 0 */
    for(var i=0;i<s.queue.length;i++) s.queue[i].c=[];
    s.cableLock=null; s.cableTimer=0;   // a reset invalidates any 🔀 locked slot
    popup(W/2,H/2-60,'🔄','#f472b6'); ring(W/2,H/2-30,'#f472b6'); burst(W/2,H/2-30,'#f472b6',16);
    addFlash('#f472b6',0.28); addTrauma(0.4); SFX.wrong();
  }
  if(pick==='angry'){
    /* 😡 angry customer: -40% of remaining patience, all patrons */
    for(var j=0;j<s.queue.length;j++) s.queue[j].patron.pat=Math.floor(s.queue[j].patron.pat*0.6);
    popup(W/2,H/2-60,'💢','#fb7185'); addFlash('#fb7185',0.25); addTrauma(0.3); SFX.junk();
  }
  if(pick==='bios'){
    /* 🔔 BIOS beep hell: rapid beeps + shake */
    SFX.bios(); addTrauma(0.6);
  }
  if(pick==='liquid'){
    /* 🫗 mystery liquid: a random GOOD code is toxic for the event's duration */
    var pool=s.queue.length?nextNeeded(s):PART_CODES[Math.floor(Math.random()*PART_CODES.length)];
    s.contam=pool||'screw'; s.contamTimer=cd.dur;
    popup(W/2,H/2-60,'🫗','#34d399'); addFlash('#34d399',0.2); SFX.power();
  }
  if(pick==='cable'){
    /* 🔀 cable spaghetti: one next-needed slot is locked (can't deposit) */
    if(s.queue.length){
      var oi=Math.floor(Math.random()*s.queue.length), q=s.queue[oi];
      if(nextNeededOf(q)!=null){ s.cableLock={oi:oi, si:q.c.length}; s.cableTimer=cd.dur; }
    }
    popup(W/2,H/2-60,'🔀','#60a5fa'); addFlash('#60a5fa',0.2); SFX.wrong();
  }
}
function triggerChaos(s,key){
  var rules=modeRules(s);
  if(rules.chaos&&rules.chaos.indexOf(key)<0) return;   // forced chaos is still mode-gated
  var pick=chaosPick(s,key);
  if(!pick||!CHAOS_DEF[pick]) return;      // 🧘 relaxed never rolls chaos; arcade only its 4
  var cd=CHAOS_DEF[pick];
  s.chaosCooldown=s.boss?5:7;
  if(cd.dur>0){
    s.chaos=pick; s.chaosTimer=cd.dur;                 // timed event
  }
  applyChaosEffect(s,pick);
  if(cd.dur>0){ popup(W/2,H/2-60,cd.emoji,cd.color); ring(W/2,H/2-30,cd.color); }   // timed events announce at center too
  addFlash('#facc15',0.3); addTrauma(0.5);
  if(pick!=='bios') SFX.chaos();
}

/* ---------------- BOSS WAVES (every 6 orders; unseen boss picked first) ---------------- */
function defeatBossIfReady(s){
  /* 🛒🌡️🎒 completing the wave's scaled order quota (s.boss.quota) DEFEATS the boss:
     the wave ends on the spot (banner/gimmicks stop, normal pacing resumes) with the
     clear bonus, celebration, career credit and trophies landing live at the defeat.
     The end screen is left to report the shift event — never a boss headline. */
  if(!s.boss) return;
  if(s.bossTotal>=s.boss.quota){
    if(!BOSSCLEAR[s.boss.def.id]){ BOSSCLEAR[s.boss.def.id]=true; try{ lsSet('cc7_bosses',JSON.stringify(Object.keys(BOSSCLEAR))); }catch(e){} }
    endBoss(s);   // defeat: clear bonus + celebration + wave ends
  }
}
function startBoss(s){
  var def=bossFor();
  s.wavesFought++;                                   // this run's wave number (1, 2, 3…)
  var quota=def.orders+Math.min(s.wavesFought-1,3);  // 🛒🌡️🎒 later waves demand MORE completions (+1 per wave, cap +3); the clear bonus (300+100×quota) grows with it
  s.boss={def:def, quota:quota}; s.bossTimer=0; s.bossTotal=0;    // a discrete fight: complete the (scaled) quota to defeat it (no separate timer)
  s.heat=0; s.heatLevel=0; s.stockTimer=1; s.stock=null;
  /* clear any stale chaos and start the wave clean */
  s.chaos=null; s.chaosTimer=0; s.smudge=null; s.inputFreeze=0; s.contam=null; s.cableLock=null;
  popup(W/2,H/2-104,def.emoji,'#fb923c');   // above the LEVEL popup (boss fires on a level-up order)
  ring(W/2,H/2-30,'#fb923c'); burst(W/2,H/2-30,'#fb923c',24);
  addFlash('#fb923c',0.3); addHitStop(0.08); addTrauma(0.5);
  SFX.boss(def.id);
  /* 🌡️ meltdown: deadpsu flicker is CONSTANT (boss-inherent) + bios beeps on top */
  if(def.id==='melt'){ triggerChaos(s,'bios'); }
  else triggerChaos(s,def.bias[0]);
  fillQueue(s);
}
function endBoss(s){
  if(!s.boss) return;
  var bonus=300+100*s.bossTotal;
  s.score+=bonus;
  s.wavesCleared++;                         // 🛒 one more wave defeated this run
  popup(W/2,H/2-70,'Boss ✓ +'+bonus,'#facc15');
  ring(W/2,H/2-30,'#facc15'); burst(W/2,H/2-30,'#facc15',26);
  addFlash('#facc15',0.3); addTrauma(0.4); SFX.newbest();
  checkAch(s,'boss');
  if(BOSSCLEAR['rush']&&BOSSCLEAR['melt']&&BOSSCLEAR['school']) checkAch(s,'boss3');
  s.boss=null; s.bossTimer=0; s.bossTotal=0; s.heat=0; s.heatLevel=0; s.stock=null; s.cableLock=null; s.contam=null;
  s.chaos=null; s.chaosTimer=0; s.smudge=null;
  fillQueue(s);
}

ACH.forEach(function(a){ ACH_TROPHY[a[0]]=a[1]; });

/* ---------------- INPUT ---------------- */
/* Dual-touch: the FIRST pointer down controls the tray; any additional pointer
   (2nd finger anywhere on the board, or right-click on desktop) fires the
   active 🔧 wrench skip. Roles are tracked per pointerId so fingers never
   fight each other. */
var pointerRoles={};            // pointerId -> 'primary' | 'secondary'
function pointerCount(){ var n=0; for(var k in pointerRoles) n++; return n; }
function clearPointers(){ pointerRoles={}; }
function primaryId(){
  for(var k in pointerRoles){ if(pointerRoles[k]==='primary') return k; }
  return null;
}
/* ---------------- REMAPPABLE KEYBOARD (persisted cc7_keys) ---------------- */
var KEY_DEFAULTS={
  left:['ArrowLeft','a','A'],
  right:['ArrowRight','d','D'],
  pause:['p','P','Escape'],
  mute:['m','M'],
  music:['n','N'],
  start:[' ','Enter']
};
var KEY_LABELS={left:'⬅️ Move left', right:'➡️ Move right', pause:'⏸ Pause', mute:'🔇 Mute', music:'🎵 Music', start:'▶️ Start'};
var keymap={}, keyCapture=null;   // keyCapture: action being remapped on the Keys screen
(function loadKeymap(){
  var saved=null;
  try{ saved=JSON.parse(lsGet('cc7_keys','')||'null'); }catch(e){}
  for(var a in KEY_DEFAULTS){
    keymap[a]=(saved&&Array.isArray(saved[a])&&saved[a].length)?saved[a].filter(function(k){ return typeof k==='string'&&k; }):KEY_DEFAULTS[a].slice();
    if(!keymap[a].length) keymap[a]=KEY_DEFAULTS[a].slice();
  }
})();
function saveKeymap(){ try{ lsSet('cc7_keys', JSON.stringify(keymap)); }catch(e){} }
function setKey(act,k){ if(!KEY_DEFAULTS[act]||typeof k!=='string'||!k) return; keymap[act]=[k]; saveKeymap(); }
function resetKeys(){ for(var a in KEY_DEFAULTS) keymap[a]=KEY_DEFAULTS[a].slice(); saveKeymap(); }
function keyAction(k){
  for(var a in keymap){ var arr=keymap[a];
    for(var i=0;i<arr.length;i++){ var b=arr[i];
      if(k===b||(k&&k.length===1&&b&&b.length===1&&k.toLowerCase()===b.toLowerCase())) return a;  // letters: case-insensitive
    }
  }

}
function handleKeyDown(e){
  var k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','A','d','D'].indexOf(k)>=0) e.preventDefault();
  audioInit();

    e.preventDefault();

  if(S.phase==='menu'&&act==='start'){ startGame(); return; }

}
function handleKeyUp(e){ var act=keyAction(e.key); if(S&&(act==='left'||act==='right')) S.keys[act]=false; }
function clampLiftY(y){ return Math.max(LIFT_MIN, Math.min(TRAY_Y, y)); }
function useWrench(s,py){
  /* shared 🔧 skip: instant-completes the FRONT order (no tip — it was rushed) */
  var q=s.queue[0];
  var bonus2=20*s.level+(q?q.reward:0);
  s.score+=bonus2; s.orders++; s.level=levelFor(s);
  s.powerup=null; s.powerupTimer=0; s.wrenchHint=0;
  checkAch(s,'wrench');
  popup(W/2,py-44,'ORDER +'+bonus2,'#a855f7');
  ring(W/2,py,'#a855f7'); burst(W/2,py,'#a855f7',18);
  addFlash('#a855f7',0.22); addHitStop(0.06); addTrauma(0.25);
  SFX.order();
  if(s.queue.length) s.queue.splice(0,1);
  if(s.boss){ s.bossTotal++; defeatBossIfReady(s); }
  else if(modeRules(s).bosses&&s.orders%6===0) startBoss(s);    // wave milestone matches completeOrder (order 6)
  if(s.overtime){ /* shift's over — the skip finished it; clock out (no refill) */ }
  else fillQueue(s);
  if(s.orders>=8) checkAch(s,'o8');
  if(s.level!==1&&(s.orders%3===0)){
    addFlash('#22d3ee',0.3); popup(W/2,H/2-70,'LEVEL '+s.level,'#a855f7');
    if(s.orders%6!==0) SFX.level();   // 🔕 boss beat → wave stinger only (useWrench path: boss already fired above)
    if(s.level>=5) checkAch(s,'lv5');
  }
}
function fireSecondFinger(x,y,rect){
  /* 2nd finger anywhere fires the active power-up. ☕/🧲 are passive buffs —
     only the 🔧 (instant use) can be triggered, right where the finger lands. */
  if(!S||S.phase!=='play'||S.paused||S.powerup!=='wrench') return;
  useWrench(S,S.player.y);   // tray line for the ORDER popup/ring
  if(TUT_ON&&tutStep===2) advanceTut();   // 🎓 lesson 3 done: 2nd finger fired the 🔧
  if(rect){
    var px=Math.max(30,Math.min(W-30,(x-rect.left)/rect.width*W));
    var pxy=Math.max(30,Math.min(H-30,(y-rect.top)/rect.height*H));
    popup(px,pxy-24,'🔧','#a855f7'); burst(px,pxy,'#a855f7',10);
  }
}
function handlePointer(clientX,clientY,isDown,pointerId){
  if(!S||S.phase!=='play'||S.paused||S.inputFreeze>0) return; // static chaos freezes the tray too
  // (during a freeze any stale targetX/targetY is intentional: on thaw the tray glides
  //   to the last finger position until the next pointermove)
  var rect=canvas.getBoundingClientRect();   // single layout read per pointer event
  var px=(clientX-rect.left)/rect.width*W;
  var py=(clientY-rect.top)/rect.height*H;
  S.touchX=px; S.touchY=py;   // ☝️ tether anchor: the primary finger's live position
  var x=Math.max(S.player.w/2, Math.min(W-S.player.w/2, px));
  if(ctrlMode==='drag'){
    if(isDown) S.player.x=x;   // ✋ instant grab on touch-down (1:1 tap)
    S.player.targetX=x;        // tray target tracks the finger 1:1; x eases after it
  } else if(ctrlMode==='lift'||ctrlMode==='lifthold'){
    var ly=clampLiftY(py-liftOffset);  // ☝️ tray floats offset above the finger
    if(isDown){
      S.player.x=x; S.player.y=ly;     // instant grab (x + height)
      S.player.targetX=x; S.player.targetY=ly;
      S.holdActive=true; S.holdUnparked=false; S.holdX=px; S.holdY=py;  // ✊ parked until a real drag
    } else if(ctrlMode==='lifthold'&&S.holdActive&&!S.holdUnparked){
      if(Math.abs(px-S.holdX)+Math.abs(py-S.holdY)>HOLD_DRAG){ S.holdUnparked=true; S.player.targetX=x; S.player.targetY=ly; }
      /* else: parked — small jitter doesn't move the tray (one-handed rest) */
    } else {
      S.player.targetX=x; S.player.targetY=ly;
    }
  } else {
    S.player.x=x;              // 👆 snap mode: instant placement
  }
}

window.addEventListener('keydown',handleKeyDown);
window.addEventListener('keyup',handleKeyUp);
canvas.addEventListener('pointermove',function(e){
  /* only the primary finger steers the tray — 2nd fingers never fight it */
  if(pointerRoles[e.pointerId]!=='primary') return;
  handlePointer(e.clientX,e.clientY,false,e.pointerId);
});
canvas.addEventListener('pointerdown',function(e){
  audioInit();
  if(pointerRoles[e.pointerId]) return;            // already tracked (safety)
  if(!primaryId()){
    pointerRoles[e.pointerId]='primary';           // first finger = tray
    try{ if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId); }catch(err){}
    handlePointer(e.clientX,e.clientY,true,e.pointerId);
  } else {
    pointerRoles[e.pointerId]='secondary';         // any extra finger = 🔧 wrench
    var r2=canvas.getBoundingClientRect();
    fireSecondFinger(e.clientX,e.clientY,r2);
  }
});
function promoteNextPointer(){
  /* if a second finger is still down, promote it to tray control */
  for(var k in pointerRoles){ pointerRoles[k]='primary'; break; }
}
canvas.addEventListener('pointerup',function(e){
  if(pointerRoles[e.pointerId]!=='primary'){ delete pointerRoles[e.pointerId]; return; }
  delete pointerRoles[e.pointerId];
  if(S){ S.holdActive=false; S.touchX=null; S.touchY=null; }    // ✊ release ends the parked hold + tether
  promoteNextPointer();
});
canvas.addEventListener('pointercancel',function(e){
  if(S){ S.holdActive=false; S.touchX=null; S.touchY=null; }
  if(pointerRoles[e.pointerId]==='primary'){ delete pointerRoles[e.pointerId]; promoteNextPointer(); }
  else delete pointerRoles[e.pointerId];
});
canvas.addEventListener('contextmenu',function(e){ if(S&&S.phase==='play'&&!S.paused) e.preventDefault(); });

/* ---------------- GAMEPAD (polled once per frame; left stick = analog tray) ---------------- */
var padState=null, padStartPrev=false, padOverride=null, padGraceUntil=performance.now()+1000;  // padOverride: debug/test hook; grace: held Start at boot won't skip the menu
function pollGamepad(){
  if(padOverride){ padState=padOverride; return; }   // injected pad wins (harness/live debug)
  var gp=null;
  try{ if(navigator&&navigator.getGamepads){ var gps=navigator.getGamepads(); if(gps&&gps[0]) gp=gps[0]; } }catch(e){}
  padState=gp;
}
function padBtn(i){
  return !!(padState&&padState.buttons&&padState.buttons[i]&&padState.buttons[i].pressed);
}
function padX(){
  if(!padState||!padState.axes) return 0;
  var ax=padState.axes[0];
  if(typeof ax!=='number') return 0;
  if(Math.abs(ax)<0.2) return 0;                         // deadzone: ignore stick drift
  return (ax<0?-1:1)*Math.min(1,(Math.abs(ax)-0.2)/0.8); // scale 0.2..1 → 0..1 (analog)
}

function togglePause(){
  if(!S||S.phase!=='play') return;
  S.paused=!S.paused;
  if(S.paused){ stopMusic(); showPause(); }
  else { startMusic(); hideOverlay(); last=performance.now(); if(TUT_ON) scheduleTutAdvance(); }
}
/* auto-pause when tab hidden / window blurred */
function autoPause(){
  if(S&&S.phase==='play'&&!S.paused){ S.paused=true; stopMusic(); showPause(); }
}
document.addEventListener('visibilitychange',function(){ if(document.hidden) autoPause(); });
window.addEventListener('blur',autoPause);

/* Three animated lessons over the first shift: 👆 catch a part, 🧦 dodge junk,
   👆👆 2nd finger fires the 🔧. Advances on the taught action, a card tap, or ~8s;
   ⏭ skips forever. Flag: cc7_tut. Reduced-motion: static demos via CSS. */
var TUT_ON=false, tutStep=0, tutTimer=null, TUT_SEC=8;
function tutStageHtml(k){
  if(k===2) return '<span class="tut-anim tut-fall">🧦</span><span class="tut-anim tut-x">✖</span><span class="tut-anim tut-dodge"></span>';
  if(k===3) return '<span class="tut-anim tut-fall" style="left:32%">🔧</span><span class="tut-anim tut-ring"></span><span class="tut-anim tut-wrench" style="right:2px">🔧</span><span class="tut-anim tut-tap" style="left:2px">👆</span><span class="tut-anim tut-tap tut-tap2">👆</span>';
  return '<span class="tut-anim tut-fall" id="tut-part">⌨️</span><span class="tut-anim tut-slide">👆</span><span class="tut-tray"></span>';
}
function renderTut(step){
  var dots=''; for(var i=0;i<3;i++) dots+='<span class="tut-dot'+(i===step?' on':'')+'"></span>';
  el['tut-card'].innerHTML='<div class="tut-stage">'+tutStageHtml(step+1)+'</div>'+
    '<div class="tut-side"><div class="tut-dots">'+dots+'</div>'+
    '<button id="tut-skip" title="Skip the intro">⏭</button></div>';
  el['tut-card'].style.display='flex';
  if(step===0){ var tp=document.getElementById('tut-part'); if(tp){ var nc=S&&S.queue[0]?nextNeededOf(S.queue[0]):null; tp.textContent=PART_EMOJI[nc]||'⌨️'; } }   // demo the LIVE needed part
  scheduleTutAdvance();
  document.getElementById('tut-skip').addEventListener('click',function(ev){ ev.stopPropagation(); endTut(); });
}
function scheduleTutAdvance(){ clearTutTimer(); tutTimer=setTimeout(function(){ if(TUT_ON) advanceTut(); },TUT_SEC*1000); }
function advanceTut(){ if(!TUT_ON) return; if(tutStep<2){ tutStep++; renderTut(tutStep); } else endTut(); }
function clearTutTimer(){ if(tutTimer){ clearTimeout(tutTimer); tutTimer=null; } }
function endTut(){ TUT_ON=false; clearTutTimer(); el['tut-card'].style.display='none'; try{ lsSet('cc7_tut','1'); }catch(e){} }
function maybeStartTut(){
  if(lsGet('cc7_tut','0')==='1'){ TUT_ON=false; el['tut-card'].style.display='none'; return; }
  TUT_ON=true; renderTut(tutStep);   // resumes from the lesson they were on (survives menu trips)
}

function wireCtrlRow(root){
  root.querySelectorAll('.ctrl-btn').forEach(function(b){
    b.addEventListener('click',function(){
      ctrlMode=b.getAttribute('data-ctrl');

      if(S){ S.player.targetX=null; S.player.targetY=null; }  // drop stale drag/lift targets
      root.querySelectorAll('.ctrl-btn').forEach(function(x){ x.classList.toggle('active',x===b); });
      var lrs=root.querySelectorAll('#lift-row'), lr=lrs&&lrs[0]; if(lr) lr.classList.toggle('off',ctrlMode!=='lift'&&ctrlMode!=='lifthold');

function wireLiftRow(root){
  var slds=root.querySelectorAll('#lift-slider'), sld=slds&&slds[0]; if(!sld) return;
  var vals=root.querySelectorAll('#lift-val'), val=vals&&vals[0];
  sld.addEventListener('input',function(){
    liftOffset=Math.max(0,Math.min(180,parseInt(sld.value,10)||0));

function launchMode(m){   // one-tap card launch — also reloads THIS mode's saved difficulty (the global may hold another mode's)
  if(!MODE_DEF[m]) return;
  mode=m; lsSet('cc7_mode',m);
  loadProfile(m);          // swap to this mode's saved controls
  difficulty=diffFor(mode);
  audioInit();
  if(m==='pro'&&lsGet('cc7_pro_tips','0')!=='1'){
    /* 🛠️ first Pro shift: show the Tips screen BEFORE the shift — Pro adds patrons,
       chaos, and boss waves, so a brand-new player reads the playbook first, taps
       Back to the menu, and taps Pro again to actually start (flag set → next tap plays). */
    lsSet('cc7_pro_tips','1');
    showTips(true);   // true = gate mode: Back returns to the menu, no shift starts
    return;
  }
  startGame();
}
