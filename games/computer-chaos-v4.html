<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Computer Chaos 4</title>
<style>
/* === Mobile landscape rotate prompt (portrait touch only) === */
#rotate-prompt{display:none;position:fixed;inset:0;z-index:99999;background:#05050f;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;font-family:'Courier New',monospace}
#rotate-prompt .icon{font-size:60px;animation:rot-hint 2s ease-in-out infinite}
#rotate-prompt .msg{font-size:16px;letter-spacing:1px;max-width:280px;line-height:1.5}
#rotate-prompt .sub{font-size:12px;color:#9fc2e0}
@keyframes rot-hint{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (hover:none) and (pointer:coarse) and (max-width:767px){
  #rotate-prompt{display:flex!important}
  body>*:not(#rotate-prompt){visibility:hidden}
}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b0e1a; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#e2e8f0;
    /* reserve iOS Safari's landscape Call/Locate bar so it never covers content */
    padding-bottom:env(safe-area-inset-bottom,0);
    padding-bottom:constant(safe-area-inset-bottom); }
  #game-wrap { user-select:none; padding:1rem 0; max-width:520px; margin:0 auto; }
  #ui-bar { display:flex; justify-content:space-between; align-items:center; max-width:520px; margin:0 auto 8px; gap:6px; flex-wrap:wrap; }
  .stat { font-size:14px; font-weight:600; color:#e2e8f0; background:#161b2e; border:1px solid #2a3358; border-radius:10px; padding:4px 10px; }
  .stat span { color:#22d3ee; }
  .stat.hi span { color:#facc15; }
  #combo-box { max-width:520px; margin:6px auto 0; height:18px; display:flex; align-items:center; gap:8px; }
  #combo-bar { flex:1; height:8px; background:#161b2e; border-radius:6px; overflow:hidden; border:1px solid #2a3358; }
  #combo-fill { height:100%; width:0%; background:linear-gradient(90deg,#a855f7,#22d3ee); transition:width 0.15s; }
  #order-box { max-width:520px; margin:8px auto 0; background:#161b2e; border-radius:12px; border:1px solid #2a3358; padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #order-items { display:flex; gap:6px; flex-wrap:wrap; }
  .order-item { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:9px; border:2px solid #3b4a7a; background:#1b2240; transition:all 0.2s; }
  .order-item.done { border-color:#22c55e; background:#14321f; }
  #canvas-container { position:relative; width:100%; max-width:520px; margin:0 auto; }
  canvas { display:block; width:100%; border-radius:14px; border:2px solid #22d3ee; touch-action:none; box-shadow:0 0 24px rgba(34,211,238,0.25), inset 0 0 60px rgba(10,14,26,0.6); }
  #msg-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:14px; background:rgba(11,14,26,0.92); z-index:5; text-align:center; }
  #msg-title { font-size:30px; font-weight:800; color:#22d3ee; margin-bottom:8px; text-shadow:0 0 18px rgba(34,211,238,0.6); }
  #msg-sub { font-size:14px; color:#94a3b8; margin-bottom:22px; padding:0 16px; line-height:1.5; }
  #msg-btn { background:linear-gradient(135deg,#22d3ee,#a855f7); color:#06121a; border:none; border-radius:12px; padding:12px 30px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 4px 18px rgba(34,211,238,0.4); }
  #msg-btn:hover { filter:brightness(1.1); }
  #controls-hint { max-width:520px; margin:8px auto 0; font-size:12px; color:#64748b; text-align:center; }
  #mute-btn { position:absolute; top:8px; right:8px; z-index:6; background:rgba(22,27,46,0.8); color:#94a3b8; border:1px solid #2a3358; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<div id="rotate-prompt">
  <div class="icon">📱</div>
  <div class="msg">Rotate your phone to landscape to play</div>
  <div class="sub">↻ Turn your device for the full screen</div>
</div>
<div id="game-wrap">
  <div id="ui-bar">
    <div class="stat">💰 <span id="score-val">0</span></div>
    <div class="stat">📦 <span id="orders-val">0</span></div>
    <div class="stat">⏱ <span id="time-val">60</span></div>
    <div class="stat hi">❤️ <span id="lives-val">❤️❤️❤️❤️❤️</span></div>
  </div>
  <div id="combo-box"><div id="combo-bar"><div id="combo-fill"></div></div></div>
  <div id="order-box"><div id="order-items"></div></div>
  <div id="canvas-container">
    <canvas id="game"></canvas>
    <button id="mute-btn" title="Mute (M)">🔊</button>
    <div id="msg-overlay">
      <div id="msg-title">Computer Chaos</div>
      <div id="msg-sub">Catch the falling parts to fill each repair order. Dodge the junk!<br>← → or A / D to move · ☕ slows time · M mutes</div>
      <button id="msg-btn">Start Shift</button>
    </div>
  </div>
  <div id="controls-hint">← → / A D move · catch parts · avoid junk · survive chaos</div>
</div>
<script>
(function(){
  const W=520, H=440;
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const DPR=Math.min(2, window.devicePixelRatio||1);
  canvas.width=W*DPR; canvas.height=H*DPR; ctx.scale(DPR,DPR);

  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- prerendered background (V3 neon framework) ----
  const bgCanvas=document.createElement('canvas'); bgCanvas.width=W; bgCanvas.height=H;
  const b=bgCanvas.getContext('2d');
  (function(){
    const g=b.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0b1020'); g.addColorStop(1,'#101732'); b.fillStyle=g; b.fillRect(0,0,W,H);
    b.fillStyle='#1b2238';
    for(let x=22;x<W;x+=44) for(let y=22;y<H;y+=44){ b.beginPath(); b.arc(x,y,2,0,Math.PI*2); b.fill(); }
    b.fillStyle='#1b2238'; b.fillRect(0,H-40,W,40);
    b.strokeStyle='#22d3ee'; b.lineWidth=2.5; b.beginPath(); b.moveTo(0,H-40); b.lineTo(W,H-40); b.stroke();
    b.fillStyle='rgba(34,197,94,0.12)'; for(let x=10;x<W;x+=24) b.fillRect(x,H-38,12,2);
  })();

  // ---- audio engine (V3 procedural, no files) ----
  const Audio={ ctx:null, master:null, muted:false,
    init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.master=this.ctx.createGain(); this.master.gain.value=0.35; this.master.connect(this.ctx.destination); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
    tone(freq,dur,type='sine',vol=0.18,slideTo=null){ if(!this.ctx||this.muted) return; const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02); },
    noise(dur=0.18,vol=0.25){ if(!this.ctx||this.muted) return; const t=this.ctx.currentTime, buf=this.ctx.createBuffer(1,Math.floor(this.ctx.sampleRate*dur),this.ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const src=this.ctx.createBufferSource(); src.buffer=buf; const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1000; const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur+0.02); },
    correct(combo){ const base=440+Math.min(combo,12)*40; this.tone(base,0.12,'triangle',0.2,base*1.5); },
    wrong(){ this.tone(180,0.18,'sawtooth',0.18,90); },
    junk(){ this.noise(0.22,0.25); this.tone(120,0.2,'square',0.12,70); },
    power(){ this.tone(660,0.1,'square',0.18); const self=this; setTimeout(()=>self.tone(990,0.15,'square',0.18),90); },
    order(){ const self=this; [523,659,784,1047].forEach((f,i)=>setTimeout(()=>self.tone(f,0.18,'triangle',0.2),i*70)); },
    chaos(){ this.tone(300,0.4,'sawtooth',0.2,80); this.noise(0.3,0.15); },
    gameover(){ const self=this; [392,330,262,196].forEach((f,i)=>setTimeout(()=>self.tone(f,0.3,'sine',0.2),i*160)); },
  };

  // ---- item sets (V1 wordless emoji) ----
  const GOOD=['⌨️','🖥️','🖱️','🔋','💾'];
  const JUNK=['🍌','🧦','🐱','📎','🪲'];
  const POWERUPS=['☕','🔧'];
  const GOOD_BG='#ede9fe', GOOD_BORDER='#7c3aed';
  const JUNK_BG='#ffedd5', JUNK_BORDER='#ea580c';
  const POW_BG='#fef9c3', POW_BORDER='#ca8a04';

  const el={ score:document.getElementById('score-val'), orders:document.getElementById('orders-val'), time:document.getElementById('time-val'), lives:document.getElementById('lives-val'), orderItems:document.getElementById('order-items'), comboFill:document.getElementById('combo-fill'), msgOverlay:document.getElementById('msg-overlay'), msgTitle:document.getElementById('msg-title'), msgSub:document.getElementById('msg-sub'), msgBtn:document.getElementById('msg-btn'), muteBtn:document.getElementById('mute-btn') };

  let S=null, raf=null, timerInt=null;
  let trauma=0;
  function addTrauma(a){ if(!REDUCED) trauma=Math.min(1,trauma+a); }

  function freshState(){
    let best=0; try{ best=parseInt(localStorage.getItem('cc4_best')||'0',10)||0; }catch(e){}
    return { player:{x:W/2,w:64,h:38,speed:8}, items:[], score:0, lives:5, orders:0, timeLeft:60, order:[], caught:[], keys:{}, level:1, powerup:null, powerupTimer:0, chaos:null, chaosTimer:0, flashColor:'#22d3ee', flashTimer:0, combo:0, comboTimer:0, spawnTimer:30, started:false, running:false, best:best };
  }

  function newOrder(s){
    const len=Math.min(2+Math.floor(s.level*0.3),4);
    s.order=Array.from({length:len},()=>GOOD[Math.floor(Math.random()*GOOD.length)]);
    s.caught=[];
    renderOrder(s);
  }
  function renderOrder(s){
    el.orderItems.innerHTML=s.order.map((e,i)=>`<div class="order-item${i<s.caught.length?' done':''}"><span style="font-size:20px;line-height:1">${e}</span></div>`).join('');
  }

  function spawnItem(s){
    const needed=s.order[s.caught.length];
    const isPow=Math.random()<0.07;
    const isBad=!isPow && Math.random()<0.18;
    const isNeeded=!isPow && !isBad && Math.random()<0.65;
    let emoji,type;
    if(isPow){ emoji=POWERUPS[Math.floor(Math.random()*POWERUPS.length)]; type='powerup'; }
    else if(isBad){ emoji=JUNK[Math.floor(Math.random()*JUNK.length)]; type='junk'; }
    else if(isNeeded && needed){ emoji=needed; type='good'; }
    else { emoji=GOOD[Math.floor(Math.random()*GOOD.length)]; type='good'; }
    s.items.push({ x:28+Math.random()*(W-56), y:-34, emoji, type, speed:1.5+Math.random()*1.0+s.level*0.15 });
  }

  let particles=[];
  function addParticles(x,y,color){ for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*2.5; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color}); } }
  function updateParticles(){ for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.03; if(p.life<=0) particles.splice(i,1); } }

  function triggerChaos(s){ s.chaos=Math.random()<0.5?'cat':'surge'; s.chaosTimer=120; s.flashColor='#facc15'; s.flashTimer=40; addTrauma(0.4); Audio.chaos(); }

  function update(s){
    if(s.powerupTimer>0){ s.powerupTimer--; if(!s.powerupTimer) s.powerup=null; }
    if(s.chaosTimer>0){ s.chaosTimer--; if(!s.chaosTimer) s.chaos=null; }
    if(s.flashTimer>0) s.flashTimer--;
    if(s.comboTimer>0){ s.comboTimer--; if(!s.comboTimer) s.combo=0; }
    let spd=s.player.speed*(s.powerup==='coffee'?0.45:1);
    let dir=0;
    if(s.keys['ArrowLeft']||s.keys['a']||s.keys['A']) dir=-1;
    if(s.keys['ArrowRight']||s.keys['d']||s.keys['D']) dir=1;
    if(s.chaos==='cat') dir*=-1;
    s.player.x=Math.max(s.player.w/2, Math.min(W-s.player.w/2, s.player.x+dir*spd));
    if(--s.spawnTimer<=0){ spawnItem(s); s.spawnTimer=Math.max(18,42-s.level*2); }
    const py=H-60;
    for(let i=s.items.length-1;i>=0;i--){
      const it=s.items[i]; it.y+=it.speed;
      const hit=Math.abs(it.x-s.player.x)<s.player.w/2+12 && Math.abs(it.y-py)<28;
      if(hit){
        s.items.splice(i,1);
        if(it.type==='good'){
          if(it.emoji===s.order[s.caught.length]){
            s.caught.push(it.emoji); s.score+=10*s.level; addParticles(it.x,py,'#22c55e'); Audio.correct(s.combo);
            s.combo++; s.comboTimer=120; el.comboFill.style.width=Math.min(100,s.combo*12)+'%';
            if(s.caught.length===s.order.length){ s.score+=20*s.level; s.orders++; s.level=1+Math.floor(s.orders/4); s.flashColor='#22c55e'; s.flashTimer=40; addTrauma(0.3); Audio.order(); newOrder(s); }
            else renderOrder(s);
          } else {
            s.lives--; s.flashColor='#ea580c'; s.flashTimer=40; addTrauma(0.2); Audio.wrong(); s.combo=0; el.comboFill.style.width='0%';
            if(!s.chaos && Math.random()<0.4) triggerChaos(s);
          }
        } else if(it.type==='junk'){
          s.lives--; addParticles(it.x,py,'#ea580c'); s.flashColor='#ea580c'; s.flashTimer=40; addTrauma(0.3); Audio.junk(); s.combo=0; el.comboFill.style.width='0%';
          if(!s.chaos && Math.random()<0.4) triggerChaos(s);
        } else {
          if(it.emoji==='☕'){ s.powerup='coffee'; s.powerupTimer=360; s.flashColor='#facc15'; s.flashTimer=30; }
          else { s.score+=20*s.level; s.orders++; s.level=1+Math.floor(s.orders/4); s.flashColor='#22c55e'; s.flashTimer=40; Audio.order(); newOrder(s); }
          addParticles(it.x,py,'#facc15'); addTrauma(0.2); Audio.power();
        }
      } else if(it.y>H+40){ s.items.splice(i,1); }
    }
    updateParticles();
  }

  function drawBadge(x,y,emoji,bg,border){
    ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
    ctx.strokeStyle=border; ctx.lineWidth=2.5; ctx.stroke();
    ctx.font='24px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(emoji,x,y);
  }

  function hexA(hex,a){ const n=parseInt(hex.slice(1),16); const r=(n>>16)&255, g=(n>>8)&255, bl=n&255; return `rgba(${r},${g},${bl},${a})`; }

  function draw(s){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    let sh=0; if(!REDUCED){ sh=trauma*trauma*8; }
    if(sh>0) ctx.translate((Math.random()*2-1)*sh,(Math.random()*2-1)*sh);
    const flip=s.chaos==='surge';
    if(flip){ ctx.translate(0,H); ctx.scale(1,-1); }
    ctx.drawImage(bgCanvas,0,0,W,H);
    s.items.forEach(it=>{ if(it.type==='good') drawBadge(it.x,it.y,it.emoji,GOOD_BG,GOOD_BORDER); else if(it.type==='junk') drawBadge(it.x,it.y,it.emoji,JUNK_BG,JUNK_BORDER); else drawBadge(it.x,it.y,it.emoji,POW_BG,POW_BORDER); });
    const px=s.player.x, py=H-60;
    ctx.fillStyle='#334155'; ctx.fillRect(px-s.player.w/2, py-6, s.player.w, 16);
    ctx.fillStyle='#22d3ee'; ctx.fillRect(px-s.player.w/2+6, py+9, s.player.w-12, 3);
    ctx.font='24px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🧑\u200d🔧', px, py-6);
    particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha=1;
    ctx.restore();
    if(s.flashTimer>0){ ctx.fillStyle=hexA(s.flashColor,(s.flashTimer/40)*0.45); ctx.fillRect(0,0,W,H); }
  }

  function syncHud(s){
    el.score.textContent=s.score; el.orders.textContent=s.orders; el.time.textContent=Math.max(0,s.timeLeft);
    el.lives.textContent=('❤️'.repeat(Math.max(0,s.lives))||'·');
  }

  function loop(s){
    update(s); draw(s); syncHud(s);
    trauma=Math.max(0,trauma-0.02);
    if(s.lives<=0) return endGame(s,'Out of lives');
    if(s.timeLeft<=0) return endGame(s,"Time's up");
    raf=requestAnimationFrame(()=>loop(s));
  }

  function startGame(){
    Audio.init();
    S=freshState(); particles=[]; trauma=0;
    newOrder(S);
    for(let i=0;i<4;i++){ spawnItem(S); S.items[S.items.length-1].y=-34-i*90; }
    S.running=true; S.started=true;
    el.msgOverlay.style.display='none';
    timerInt=setInterval(()=>{ S.timeLeft--; if(S.timeLeft<=0) clearInterval(timerInt); },1000);
    raf=requestAnimationFrame(()=>loop(S));
  }

  function endGame(s,reason){
    S.running=false; if(timerInt) clearInterval(timerInt);
    if(raf) cancelAnimationFrame(raf);
    Audio.gameover();
    let best=s.best; try{ if(s.score>best){ best=s.score; localStorage.setItem('cc4_best',String(best)); } }catch(e){}
    el.msgTitle.textContent='Computer Chaos';
    el.msgSub.innerHTML=`${reason}<br>Score ${s.score} · Orders ${s.orders} · Best ${best}`;
    el.msgBtn.textContent='Play again';
    el.msgOverlay.style.display='flex';
  }

  window.addEventListener('keydown',e=>{ if(!S||!S.started) return; S.keys[e.key]=true; if(e.key==='m'||e.key==='M') toggleMute(); if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key===' ') e.preventDefault(); });
  window.addEventListener('keyup',e=>{ if(!S) return; S.keys[e.key]=false; });
  function pointerMove(clientX){ if(!S||!S.running) return; const rect=canvas.getBoundingClientRect(); const x=(clientX-rect.left)/rect.width*W; S.player.x=Math.max(S.player.w/2, Math.min(W-S.player.w/2, x)); }
  canvas.addEventListener('pointermove',e=>pointerMove(e.clientX));
  canvas.addEventListener('pointerdown',e=>{ Audio.init(); pointerMove(e.clientX); });

  function toggleMute(){ Audio.muted=!Audio.muted; el.muteBtn.textContent=Audio.muted?'🔇':'🔊'; }
  el.muteBtn.addEventListener('click',()=>{ Audio.init(); toggleMute(); });
  el.msgBtn.addEventListener('click',()=>{ Audio.init(); startGame(); });

  // initial HUD (pre-start)
  S=freshState(); syncHud(S); renderOrder(S);

  // clean exit: tear down orientation lock / fullscreen / overflow so returning to the hub is never stuck in landscape
  function cleanExit(){try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}document.body.style.overflow='';document.documentElement.style.overflow='';}
  window.addEventListener('pagehide',cleanExit);window.addEventListener('beforeunload',cleanExit);

  // Android: on first user gesture, go fullscreen + lock landscape. iOS Safari ignores this (no-op).
  function goFullscreenLandscape(){
    try{ var el=document.documentElement;
      if(el.requestFullscreen){ el.requestFullscreen().then(function(){ try{ if(screen.orientation&&screen.orientation.lock) return screen.orientation.lock('landscape'); }catch(e){} }).catch(function(){}); }
      else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
    }catch(e){}
  }
  function firstGesture(){ goFullscreenLandscape(); window.removeEventListener('pointerdown',firstGesture); window.removeEventListener('touchstart',firstGesture); window.removeEventListener('keydown',firstGesture); }
  window.addEventListener('pointerdown',firstGesture,{once:true,passive:true});
  window.addEventListener('touchstart',firstGesture,{once:true,passive:true});
  window.addEventListener('keydown',firstGesture,{once:true});
})();
</script>
</body>
</html>
