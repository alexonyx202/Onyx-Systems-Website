<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGO CHASER // DATA-MAN</title>
<style>
  :root{
    --neon-cyan:#2bd1ff; --neon-green:#39ff14; --neon-purple:#b14aff;
    --bg:#05060a; --panel:#0b0f1a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:#cfe9ff;
    font-family:"Courier New",ui-monospace,monospace;display:flex;
    align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;}
  .frame{position:relative;padding:14px;border:1px solid #16324a;border-radius:10px;
    background:linear-gradient(180deg,#070b14,#04060c);box-shadow:0 0 40px #05203a inset,0 0 30px #0a2a44;}
  /* CRT scanline + flicker overlay */
  .crt{position:absolute;inset:0;pointer-events:none;border-radius:10px;mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.35) 3px,rgba(0,0,0,0) 4px);
    animation:flick 6s infinite;}
  @keyframes flick{0%,100%{opacity:.55}50%{opacity:.4}97%{opacity:.7}}
  canvas{display:block;border-radius:6px;background:#04060c;image-rendering:pixelated;}
  .hud{width:200px;font-size:12px;line-height:1.7;}
  .hud h1{font-size:18px;letter-spacing:2px;color:var(--neon-cyan);
    text-shadow:0 0 8px var(--neon-cyan);margin-bottom:8px;}
  .bar{height:12px;border:1px solid #1c4a5e;border-radius:6px;overflow:hidden;background:#06121c;}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon-green),var(--neon-cyan));
    box-shadow:0 0 10px var(--neon-green);transition:width .1s;}
  .legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .key{color:#7fd3ff;}
  .hint{margin-top:10px;color:#5e86a0;font-size:11px;}
  /* Brand font: Serpentine Bold (supplied woff2). Falls back gracefully until present. */
  @font-face{ font-family:'Serpentine'; src:url('Serpentine-Bold.woff2') format('woff2'); font-weight:bold; font-display:swap; }
  .onyx-brand{ font-family:'Serpentine','Oswald','Arial Narrow',sans-serif; font-weight:bold; }
</style>
</head>
<body>
  <div class="frame">
    <canvas id="game" width="532" height="588"></canvas>
    <div class="crt"></div>
  </div>
  <div class="hud">
    <h1>ALGO CHASER</h1>
    <div>SCORE <b id="score">0</b></div>
    <div>LIVES <b id="lives">3</b></div>
    <div style="margin:8px 0 2px;">PROCESSING</div>
    <div class="bar"><i id="proc"></i></div>
    <div class="legend" style="margin-top:12px;">
      <div><span style="background:#2bd1ff"></span>Data Packet (you)</div>
      <div><span style="background:#ff3b3b"></span>The Bug — erratic</div>
      <div><span style="background:#ff5bd0"></span>Firewall — predicts</div>
      <div><span style="background:#29f0ff"></span>Botnet — duplicates</div>
      <div><span style="background:#ff9f1c"></span>Legacy — blocks</div>
      <div><span style="background:#b14aff"></span>Root Access (power)</div>
    </div>
    <div class="hint">
      MOVE: <span class="key">WASD / Arrows</span><br>
      EAT corrupted procs while ROOT ACCESS is hot.<br>
      <span class="key">R</span> restart &nbsp; <span class="key">P</span> pause
    </div>
  </div>

<script>
/* =========================================================================
   ALGO CHASER  —  a Pac-Man clone themed around Computers / Data / AI
   Single-file, dependency-free, iframe-ready. (HTML5 Canvas)
   Player  = "Data Packet" (blue hexagon, glowing, blinking)
   Ghosts  = "Corrupted Processes" with 4 distinct AI behaviors.
   ========================================================================= */

const TS = 28, COLS = 19, ROWS = 21;
const W = COLS * TS, H = ROWS * TS;
const DIRS = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
const rev = d => ({x:-d.x, y:-d.y});
const clampX = x => Math.max(1, Math.min(COLS-2, x));
const clampY = y => Math.max(1, Math.min(ROWS-2, y));
const centerX = (COLS-1)/2, centerY = (ROWS-1)/2;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const elScore = document.getElementById('score');
const elLives = document.getElementById('lives');
const elProc  = document.getElementById('proc');

/* ---- Self-contained 8-bit audio engine (WebAudio, no asset files) -------- */
const audio = (()=>{
  let ctx=null, master=null, wakaT=false;
  function ensure(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;                          // headless / unsupported -> silent
    try{ ctx = new AC(); master = ctx.createGain(); master.gain.value=0.16;
         master.connect(ctx.destination); }catch(e){ ctx=null; }
  }
  function audible(){ ensure(); return !!ctx; }
  function tone(freq,dur,type='square',vol=1,slideTo=null){
    if(!audible()) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,ctx.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,ctx.currentTime+dur);
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+dur+0.02);
  }
  function noise(dur,vol=0.6){
    if(!audible()) return;
    const n=(ctx.sampleRate*dur)|0, buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource(); s.buffer=buf; const g=ctx.createGain();
    g.gain.value=vol; s.connect(g); g.connect(master); s.start();
  }
  return {
    resume(){ if(audible() && ctx.state==='suspended') ctx.resume(); },
    start(){ if(!audible()) return;            // boot jingle arpeggio
      [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'square',0.8),i*90)); },
    waka(){ if(!audible()) return; const f=wakaT?220:330; wakaT=!wakaT; tone(f,0.06,'square',0.5); },
    root(){ if(!audible()) return;             // modem dial-up sweep
      tone(300,0.5,'sawtooth',0.7,1800);
      setTimeout(()=>tone(1800,0.2,'square',0.5,600),260); },
    eat(){ if(!audible()) return; noise(0.18,0.7); tone(180,0.18,'square',0.6,60); },
    die(){ if(!audible()) return;
      [400,300,200,120].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'sawtooth',0.7),i*120)); }
  };
})();

/* ---- Maze: a "circuit board" lattice (guaranteed fully connected) -------- */
let maze;
function buildMaze(){
  const m = [];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++){
      let wall = true;
      if(r===0||r===ROWS-1||c===0||c===COLS-1) wall = true;       // border
      else if(r%2===1) wall = false;                              // horizontal trace
      else if(c%2===0) wall = false;                              // vertical trace
      row.push(wall ? '#' : '.');
    }
    m.push(row);
  }
  // Root Access power-ups in the four corners
  m[1][1]='o'; m[1][COLS-2]='o'; m[ROWS-2][1]='o'; m[ROWS-2][COLS-2]='o';
  return m;
}
const isWall = (x,y) => (x<0||y<0||x>=COLS||y>=ROWS) ? true : maze[y][x]==='#';

/* ---- Entities ------------------------------------------------------------ */
const SPAWN = {
  player:  {x:9,  y:19},
  bug:     {x:9,  y:9,  scatter:{x:1, y:1}},
  firewall:{x:10, y:9,  scatter:{x:COLS-2, y:1}},
  botnet:  {x:9,  y:11, scatter:{x:1, y:ROWS-2}},
  legacy:  {x:10, y:11, scatter:{x:COLS-2, y:ROWS-2}},
};
const COLORS = {bug:'#ff3b3b', firewall:'#ff5bd0', botnet:'#29f0ff', legacy:'#ff9f1c'};

let player, ghosts, score, lives, processing, dotsLeft, state;
let mode, modeTimer, frightTimer, ghostCombo, botTimer, paused;

function reset(){
  maze = buildMaze();
  dotsLeft = maze.flat().filter(c=>c==='.'||c==='o').length;
  score = 0; lives = 3; processing = 0;
  mode = 'chase'; modeTimer = 420;
  frightTimer = 0; ghostCombo = 200; botTimer = 900;
  paused = false; state = 'play';
  audio.start();
  player = mkEnt(SPAWN.player, 2);
  ghosts = [
    mkGhost('bug',     SPAWN.bug,     2),
    mkGhost('firewall',SPAWN.firewall,2),
    mkGhost('botnet',  SPAWN.botnet,  2),
    mkGhost('legacy',  SPAWN.legacy,  1),   // legacy is SLOW
  ];
}
function mkEnt(s, speed){return {gridX:s.x,gridY:s.y,offset:0,dir:{x:0,y:0},desired:{x:0,y:0},speed,px:0,py:0};}
function mkGhost(type,s,speed){const g=mkEnt(s,speed);g.type=type;g.color=COLORS[type];g.scatter=s.scatter;g.frightened=false;return g;}

/* ---- Movement core: tile-locked, speed divides TS so centers align ------- */
function stepEntity(e, decide){
  if(e.offset===0){
    decide(e);
    if(isWall(e.gridX+e.dir.x, e.gridY+e.dir.y)) e.dir = {x:0,y:0};
  }
  if(e.dir.x || e.dir.y){
    e.offset += e.speed;
    if(e.offset >= TS){ e.offset -= TS; e.gridX += e.dir.x; e.gridY += e.dir.y; }
  }
  e.px = e.gridX*TS + TS/2 + e.dir.x*e.offset;
  e.py = e.gridY*TS + TS/2 + e.dir.y*e.offset;
}

function decidePlayer(e){
  if((e.desired.x||e.desired.y) && !isWall(e.gridX+e.desired.x, e.gridY+e.desired.y))
    e.dir = e.desired;            // accept buffered input (reversal allowed at center)
}

function validDirs(x,y,cur,allowRev){
  let opts=[];
  for(const d of DIRS){
    if(isWall(x+d.x,y+d.y)) continue;
    if(!allowRev && d.x===-cur.x && d.y===-cur.y) continue;   // no 180° unless allowed
    opts.push(d);
  }
  if(opts.length===0){ const r=rev(cur); if(!isWall(x+r.x,y+r.y)) opts.push(r); }
  return opts;
}

/* BFS distance field from a goal tile -> pick the option that minimises it. */
function distField(goal){
  const dist = Array.from({length:ROWS},()=>new Array(COLS).fill(Infinity));
  const q=[[goal.x,goal.y]]; dist[goal.y][goal.x]=0; let h=0;
  while(h<q.length){
    const [x,y]=q[h++];
    for(const d of DIRS){
      const nx=x+d.x, ny=y+d.y;
      if(!isWall(nx,ny) && dist[ny][nx]===Infinity){ dist[ny][nx]=dist[y][x]+1; q.push([nx,ny]); }
    }
  }
  return dist;
}

function ghostGoal(g){
  if(mode==='scatter') return g.scatter;                 // retreat to home corner
  const p = player;
  switch(g.type){
    case 'firewall':   // PREDICTS: aim 4 tiles ahead of the player's heading
      return {x:clampX(p.gridX+p.dir.x*4), y:clampY(p.gridY+p.dir.y*4)};
    case 'botnet':     // FLANKS: target the player's mirror across maze center
      return {x:clampX(2*centerX-p.gridX), y:clampY(2*centerY-p.gridY)};
    case 'legacy':     // BLOCKS: chase when far, peel off to corner when close
      return Math.hypot(g.gridX-p.gridX, g.gridY-p.gridY) > 6
             ? {x:p.gridX, y:p.gridY} : g.scatter;
    default: return {x:p.gridX, y:p.gridY};
  }
}

function decideGhost(g){
  const allowRev = g.frightened || g.type==='bug';
  const options = validDirs(g.gridX, g.gridY, g.dir, allowRev);
  if(!options.length) return;
  let nd;
  if(g.frightened){
    nd = options[(Math.random()*options.length)|0];                 // flee randomly
  } else if(g.type==='bug'){
    nd = options[(Math.random()*options.length)|0];                 // ERRATIC
    if(Math.random()<0.12) nd = rev(g.dir);                         // sudden crash/reverse
  } else {
    const field = distField(ghostGoal(g));
    let best=options[0], bestD=Infinity;
    for(const d of options){
      const dd = field[g.gridY+d.y][g.gridX+d.x];
      if(dd < bestD){ bestD=dd; best=d; }
    }
    nd = best;
  }
  if(nd) g.dir = nd;
}

/* ---- Power-ups / eating -------------------------------------------------- */
function activateFright(){
  frightTimer = 420;
  ghostCombo = 200;
  ghosts.forEach(g=>{ g.frightened=true; g.dir=rev(g.dir); });
}
function eatGhost(g){
  score += ghostCombo; ghostCombo *= 2; audio.eat();
  // Garbage-collect: respawn at home, clear frightened
  g.gridX=SPAWN[g.type].x; g.gridY=SPAWN[g.type].y; g.offset=0;
  g.dir={x:0,y:0}; g.frightened=false;
}

/* ---- Main update --------------------------------------------------------- */
function update(){
  if(state!=='play' || paused) return;

  modeTimer--; if(modeTimer<=0){ mode = mode==='chase'?'scatter':'chase'; modeTimer=420; }
  if(frightTimer>0){ frightTimer--; if(frightTimer<=0) ghosts.forEach(g=>g.frightened=false); }

  stepEntity(player, decidePlayer);
  ghosts.forEach(g=>stepEntity(g, decideGhost));

  // Botnet duplication (swarm behaviour)
  botTimer--; if(botTimer<=0){ botTimer=900; duplicateBotnet(); }

  // Collect bits / root access under the player's current tile
  const t = maze[player.gridY][player.gridX];
  if(t==='.'){ maze[player.gridY][player.gridX]=' '; score+=10; dotsLeft--;
               processing=Math.min(100,processing+2); audio.waka(); }
  else if(t==='o'){ maze[player.gridY][player.gridX]=' '; score+=50; activateFright();
               processing=Math.min(100,processing+10); audio.root(); }

  // Collisions
  for(const g of ghosts){
    if(Math.abs(g.px-player.px)<TS*0.5 && Math.abs(g.py-player.py)<TS*0.5){
      if(g.frightened) eatGhost(g);
      else { lives--; audio.die(); if(lives<=0){ state='over'; } else respawn(); break; }
    }
  }

  if(dotsLeft<=0) state='win';
  elScore.textContent=score; elLives.textContent=lives; elProc.style.width=processing+'%';
}

function duplicateBotnet(){
  const bot = ghosts.find(g=>g.type==='botnet');
  if(!bot) return;
  const extras = ghosts.filter(g=>g.type==='botnet').length;
  if(extras>=4) return;                       // cap the swarm
  const clone = mkGhost('botnet', {x:bot.gridX,y:bot.gridY,scatter:SPAWN.botnet.scatter}, 2);
  clone.frightened = frightTimer>0;
  ghosts.push(clone);
}
function respawn(){
  player.gridX=SPAWN.player.x; player.gridY=SPAWN.player.y; player.offset=0; player.dir={x:0,y:0};
  ghosts.forEach(g=>{ g.gridX=SPAWN[g.type].x; g.gridY=SPAWN[g.type].y; g.offset=0;
                      g.dir={x:0,y:0}; g.frightened=false; });
  frightTimer=0;
}

/* ---- Render -------------------------------------------------------------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  // maze
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const ch=maze[r][c], x=c*TS, y=r*TS;
    if(ch==='#'){
      ctx.fillStyle='#08161e';
      ctx.fillRect(x+2,y+2,TS-4,TS-4);
      ctx.strokeStyle='#0bd6c0'; ctx.lineWidth=2;
      ctx.shadowColor='#0bd6c0'; ctx.shadowBlur=8;
      ctx.strokeRect(x+3,y+3,TS-6,TS-6);
      ctx.shadowBlur=0;
    } else if(ch==='.'){
      ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=6;
      ctx.fillRect(x+TS/2-2,y+TS/2-2,4,4); ctx.shadowBlur=0;
    } else if(ch==='o'){
      const p=0.5+0.5*Math.sin(Date.now()/150);
      ctx.fillStyle='#b14aff'; ctx.shadowColor='#b14aff'; ctx.shadowBlur=14*p+4;
      ctx.beginPath(); ctx.arc(x+TS/2,y+TS/2,5+p*2,0,7); ctx.fill(); ctx.shadowBlur=0;
    }
  }
  drawPlayer();
  ghosts.forEach(drawGhost);
  if(state!=='play') drawBanner();
}
function drawPlayer(){
  const x=player.px, y=player.py, s=TS*0.42;
  const blink = (Math.floor(Date.now()/300)%2)===0;
  ctx.save(); ctx.translate(x,y);
  ctx.shadowColor='#2bd1ff'; ctx.shadowBlur=14;
  ctx.fillStyle = blink ? '#2bd1ff' : '#1a8fc4';
  ctx.beginPath();
  for(let i=0;i<6;i++){ const a=Math.PI/3*i-Math.PI/6; const px=Math.cos(a)*s, py=Math.sin(a)*s;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#dffaff';
  ctx.fillRect(-2,-2,4,4);                 // blinking core
  ctx.restore();
}
function drawGhost(g){
  const x=g.px, y=g.py, w=TS*0.7, h=TS*0.8;
  let col = g.frightened ? '#1b3bff' : g.color;
  if(g.frightened && frightTimer<120 && ((frightTimer>>3)&1)) col='#9fb4ff';
  ctx.save(); ctx.translate(x,y);
  ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(-w/2,-h/2+4);
  ctx.arc(0,-h/2+4,w/2-2,Math.PI,0);          // rounded top
  ctx.lineTo(w/2,h/2-4);
  for(let i=0;i<3;i++){ const bx=w/2 - (i*2+1)*(w/6);
    ctx.lineTo(bx, h/2-4 - (i%2?6:0)); }
  ctx.lineTo(-w/2,h/2-4);
  ctx.closePath(); ctx.fill();
  // eyes
  ctx.shadowBlur=0; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-5,-h/4,4,0,7); ctx.arc(5,-h/4,4,0,7); ctx.fill();
  ctx.fillStyle = g.frightened ? '#ff5bd0' : '#04121c';
  ctx.beginPath(); ctx.arc(-5+g.dir.x*2,-h/4+g.dir.y*2,2,0,7);
  ctx.arc(5+g.dir.x*2,-h/4+g.dir.y*2,2,0,7); ctx.fill();
  ctx.restore();
}
function drawBanner(){
  ctx.fillStyle='rgba(2,4,10,.78)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.fillStyle='#2bd1ff'; ctx.shadowColor='#2bd1ff'; ctx.shadowBlur=16;
  ctx.font='bold 34px Courier New';
  ctx.fillText(state==='win'?'SYSTEM PURGED':'KERNEL PANIC', W/2, H/2-10);
  ctx.shadowBlur=0; ctx.fillStyle='#9fd6ff'; ctx.font='14px Courier New';
  ctx.fillText(state==='win'?'All data recovered. Press R.':'Process terminated. Press R.', W/2, H/2+20);
  // ONYX SYSTEMS brand band (Serpentine Bold when supplied; fallback otherwise)
  ctx.fillStyle='#7fd3ff'; ctx.shadowColor='#0a2a44'; ctx.shadowBlur=6;
  ctx.font="bold 16px 'Serpentine','Oswald','Arial Narrow',sans-serif";
  ctx.fillText('ONYX SYSTEMS', W/2, H-26);
  ctx.shadowBlur=0;
}

/* ---- Loop & input -------------------------------------------------------- */
function loop(){ update(); draw(); requestAnimationFrame(loop); }
const KEYMAP={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
              w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
addEventListener('keydown',e=>{
  audio.resume();
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(KEYMAP[k]){ player.desired=KEYMAP[k]; e.preventDefault(); }
  if(k==='r') reset();
  if(k==='p') paused=!paused;
});
reset();
loop();
</script>
</body>
</html>
