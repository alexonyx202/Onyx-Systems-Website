<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON BREAKER — Retro Arcade Remix</title>
<meta name="description" content="A classic Breakout x Arkanoid remix. Neon, juicy, addictive.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;height:100dvh;background:#02030a;overflow:hidden;
    font-family:'Press Start 2P','Courier New',monospace;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;border-radius:8px;background:#05060f;touch-action:none;cursor:crosshair;

      0 24px 60px rgba(0,0,0,.8);}
  .hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:9px;color:#3d4a6b;

</head>
<body>
<div id="wrap"><canvas id="game" role="img" aria-label="Neon Breaker: a Breakout and Arkanoid remix arcade game"></canvas></div>
<div class="hint" id="hint">MOUSE / TOUCH / ARROWS &nbsp;•&nbsp; SPACE LAUNCH &nbsp;•&nbsp; P PAUSE &nbsp;•&nbsp; GAMEPAD OK</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   NEON BREAKER — a Breakout × Arkanoid remix
   Single-file HTML5 arcade game. All graphics procedural.
   ═══════════════════════════════════════════════════════════ */
/* Adaptive layout: landscape uses the classic 960x720 design space; portrait
   (phones) uses a taller playfield. Gameplay geometry is derived in applyLayout(). */
const DW = 960, DH = 720, TAU = Math.PI * 2;
let W = 960, H = 720, HUD = 64, PORTRAIT = false, MENU_S = 1;
let BRICK_W = 68, BRICK_H = 26, PITCH_X = 72, PITCH_Y = 30, BX0 = 48, BY0 = 86;
let PADDLE_Y = 686, PADDLE_H = 14, BALL_R = 7.5, WALL_TOP = 68, CAP_S = 16;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

/* ---------- utilities ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('nb_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nb_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('nb_' + k); } catch (e) {} }
};

/* ---------- config ---------- */
const DIFFS = [
  { name: 'EASY',   ball: 360, paddle: 140, lives: 5, mult: 0.8 },
  { name: 'NORMAL', ball: 430, paddle: 118, lives: 4, mult: 1.0 },
  { name: 'HARD',   ball: 500, paddle: 104, lives: 3, mult: 1.25 },
  { name: 'INSANE', ball: 570, paddle: 92,  lives: 2, mult: 1.6 }
];
const OPTS = Object.assign({ sound: true, music: true, crt: true, legend: true, checklist: true, autopause: true, keys: true, feast: false, layout: 'CLASSIC' }, store.get('opts', {}));
if (typeof OPTS.feast === 'boolean') OPTS.feast = { CLASSIC: false, ARKANOID: OPTS.feast, REMIX: OPTS.feast, CH: false };
if (typeof OPTS.keys === 'boolean') OPTS.keys = { CLASSIC: OPTS.keys, ARKANOID: OPTS.keys, REMIX: OPTS.keys, CH: OPTS.keys };
if (typeof OPTS.autopause === 'boolean') OPTS.autopause = { CLASSIC: OPTS.autopause, ARKANOID: OPTS.autopause, REMIX: OPTS.autopause, CH: OPTS.autopause };
if (typeof OPTS.sound === 'boolean') OPTS.sound = { CLASSIC: OPTS.sound, ARKANOID: OPTS.sound, REMIX: OPTS.sound, CH: OPTS.sound };
if (typeof OPTS.music === 'boolean') OPTS.music = { CLASSIC: OPTS.music, ARKANOID: OPTS.music, REMIX: OPTS.music, CH: OPTS.music };
if (typeof OPTS.crt === 'boolean') OPTS.crt = { CLASSIC: OPTS.crt, ARKANOID: OPTS.crt, REMIX: OPTS.crt, CH: OPTS.crt };
const saveOpts = () => store.set('opts', OPTS);

/* ---------- controls: remappable keyboard + gamepad bindings (per-mode) ---------- */
const KEY_ACTIONS = ['moveL', 'moveR', 'launch', 'pause', 'confirm', 'back'];
const PAD_ACTIONS = ['launch', 'confirm', 'pause', 'back'];
const MODE_IDS = ['CLASSIC', 'ARKANOID', 'REMIX', 'CH'];
const DEFAULT_BINDS = {
  moveL: ['ArrowLeft', 'KeyA'], moveR: ['ArrowRight', 'KeyD'],
  launch: ['Space'], pause: ['KeyP', 'Escape'],
  confirm: ['Enter', 'NumpadEnter'], back: ['Escape', 'Backspace']
};
const DEFAULT_PADB = { launch: [0], confirm: [0], pause: [9], back: [1, 8] }; // A / A / START / B+VIEW
const KEY_NAMES = {
  moveL: 'MOVE LEFT', moveR: 'MOVE RIGHT', launch: 'LAUNCH BALL',
  pause: 'PAUSE', confirm: 'CONFIRM', back: 'BACK'
};
const PAD_LABELS = ['A', 'B', 'X', 'Y', 'LB', 'RB', 'LT', 'RT', 'VIEW', 'START', 'LS', 'RS', 'D-UP', 'D-DOWN', 'D-LEFT', 'D-RIGHT'];
const QUICK_KEYS = ['KeyM', 'KeyS', 'KeyC']; // fixed quick toggles — never rebindable
/* Keyboard layout presets. Bindings use physical key codes (event.code), so AZERTY
   keeps the same physical keys as QWERTY — only the on-screen labels change. */
const KEY_LAYOUTS = {
  CLASSIC: { name: 'QWERTY', binds: DEFAULT_BINDS },
  LEFTY: {
    name: 'LEFT-HANDED',
    binds: {
      moveL: ['ArrowLeft', 'Comma'], moveR: ['ArrowRight', 'Period'],
      launch: ['Enter', 'Space'], pause: ['KeyP', 'Escape'],
      confirm: ['Enter'], back: ['Escape', 'Backspace']
    }
  },
  AZERTY: { name: 'AZERTY', binds: DEFAULT_BINDS, azerty: true }
};
/* physical key -> AZERTY legend, so the HUD/how-to show what the player sees on the key */
const AZERTY_LABELS = { KeyA: 'Q', KeyQ: 'A', KeyW: 'Z', KeyZ: 'W', KeyM: ',', Comma: '?', Period: ';', Semicolon: 'M', Quote: '%', BracketLeft: '^', BracketRight: '$', Backslash: '*', Slash: '!', Digit1: '&', Digit2: 'É', Digit3: '"', Digit4: "'", Digit5: '(', Digit6: '-', Digit7: 'È', Digit8: '_', Digit9: 'Ç', Digit0: 'À' };
/* each mode keeps its own layout preset, so ARKANOID can be LEFT-HANDED while REMIX is AZERTY */
if (typeof OPTS.layout === 'string') OPTS.layout = { CLASSIC: OPTS.layout, ARKANOID: OPTS.layout, REMIX: OPTS.layout, CH: OPTS.layout };
function layoutOf(m) { return OPTS.layout[(m || Game.mode)] || 'CLASSIC'; }
function layoutName(m) { return (KEY_LAYOUTS[layoutOf(m)] || KEY_LAYOUTS.CLASSIC).name; }
/* cycle mode `m`'s layout preset (dir +1 / -1) and apply it, overwriting that mode's binds */
function cycleLayout(m, dir) {
  const ids = ['CLASSIC', 'LEFTY', 'AZERTY'];
  let i = ids.indexOf(OPTS.layout[m]);
  if (i === -1) i = 0;
  OPTS.layout[m] = ids[(i + dir + ids.length) % ids.length];
  const L = KEY_LAYOUTS[OPTS.layout[m]];
  for (const k in DEFAULT_BINDS) BINDS[m][k] = (L.binds[k] || DEFAULT_BINDS[k]).slice();
  saveOpts(); saveBinds();
}
/* BINDS / PADB are per-mode objects; legacy flat saves migrate to every mode */
let BINDS = {}, PADB = {};
{
  const sb = store.get('binds', {}), sp = store.get('padb', {});
  for (const m of MODE_IDS) {
    BINDS[m] = {}; PADB[m] = {};
    const src = (sb[m] && typeof sb[m] === 'object' && !Array.isArray(sb[m])) ? sb[m] : sb;
    const pSrc = (sp[m] && typeof sp[m] === 'object' && !Array.isArray(sp[m])) ? sp[m] : sp;
    for (const k in DEFAULT_BINDS) BINDS[m][k] = (Array.isArray(src[k]) && src[k].length) ? src[k].slice() : DEFAULT_BINDS[k].slice();
    for (const k in DEFAULT_PADB) PADB[m][k] = (Array.isArray(pSrc[k]) && pSrc[k].length) ? pSrc[k].slice() : DEFAULT_PADB[k].slice();
  }
}
const saveBinds = () => { store.set('binds', BINDS); store.set('padb', PADB); refreshHint(); };
/* the current (or last-played) mode's bindings */
const curBinds = () => BINDS[Game.mode] || BINDS.CLASSIC;
const curPadb = () => PADB[Game.mode] || PADB.CLASSIC;
/* every keyboard action a key currently maps to (shared keys -> multiple actions) */
function actionsFor(code) { const b = curBinds(); return KEY_ACTIONS.filter(a => b[a].includes(code)); }
/* is any bound key for action `a` held right now? (paddle movement) */
function held(a) { const b = curBinds(); return b[a].some(k => keys[k]); }
/* short display label for a key code or pad button number (mode picks the layout) */
function keyLabel(code, mode) {
  if (typeof code === 'number') return PAD_LABELS[code] || 'BTN' + code;
  if (layoutOf(mode) === 'AZERTY' && AZERTY_LABELS[code]) return AZERTY_LABELS[code];
  const m = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Space: 'SPACE', Enter: 'ENTER', NumpadEnter: 'ENTER', Escape: 'ESC', Backspace: 'BKSP', Tab: 'TAB', ShiftLeft: 'SHIFT', ControlLeft: 'CTRL', AltLeft: 'ALT', Backquote: '`', Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/' };
  if (m[code]) return m[code];
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'NUM' + code.slice(6);
  return code;
}
/* reset one mode's binds (or every mode when m is omitted) to the stock defaults */
function resetBinds(m) {
  const modes = m ? [m] : MODE_IDS;
  for (const mm of modes) {
    for (const k in DEFAULT_BINDS) BINDS[mm][k] = DEFAULT_BINDS[k].slice();
    for (const k in DEFAULT_PADB) PADB[mm][k] = DEFAULT_PADB[k].slice();
  }
  saveBinds(); refreshHint(); playSfx('uiSel');
}
/* Keep the title-screen hint in sync with the live bindings. */
function refreshHint() {
  const h = document.getElementById('hint');
  if (!h) return;
  const b = curBinds();
  h.innerHTML = 'MOUSE / TOUCH / ' + keyLabel(b.moveL[0]) + ' ' + keyLabel(b.moveR[0]) +
    ' &nbsp;•&nbsp; ' + keyLabel(b.launch[0]) + ' LAUNCH &nbsp;•&nbsp; ' +
    keyLabel(b.pause[0]) + ' PAUSE &nbsp;•&nbsp; GAMEPAD OK';
}
/* Every OPTIONS toggle is per-mode now, so each can be on for ARKANOID but off
   for REMIX; the helpers read the current (or last-played) mode's setting. */
const feastOn = () => !!(OPTS.feast && OPTS.feast[Game.mode]);
const keysOn = () => !!(OPTS.keys && OPTS.keys[Game.mode]);
const autoPauseOn = () => !!(OPTS.autopause && OPTS.autopause[Game.mode]);
const soundOn = () => !!(OPTS.sound && OPTS.sound[Game.mode]);
const musicOn = () => !!(OPTS.music && OPTS.music[Game.mode]);
const crtOn = () => !!(OPTS.crt && OPTS.crt[Game.mode]);

/* ---------- adaptive layout ---------- */
function applyLayout(forcePortrait) {
  PORTRAIT = forcePortrait !== undefined ? !!forcePortrait : (window.innerHeight > window.innerWidth);
  W = PORTRAIT ? 540 : DW;
  H = PORTRAIT ? 960 : DH;
  HUD = PORTRAIT ? 84 : 64;
  const mx = W * 0.05;
  PITCH_X = (W - mx * 2) / COLS;
  BRICK_W = PITCH_X - 4;
  PITCH_Y = PORTRAIT ? 34 : 30;
  BRICK_H = PITCH_Y - 4;
  BX0 = mx;
  BY0 = HUD + 20;
  PADDLE_Y = H - 34;
  PADDLE_H = PORTRAIT ? 18 : 14;
  BALL_R = PORTRAIT ? 9.5 : 7.5;
  WALL_TOP = HUD + 4;
  CAP_S = PORTRAIT ? 20 : 16;
  MENU_S = W / DW;
  if (Game && Game.paddle) { Game.paddle.y = PADDLE_Y; Game.paddle.h = PADDLE_H; }
  if (Object.keys(BRICK_GRADS).length) for (const k in BRICK_GRADS) delete BRICK_GRADS[k];
}
/* Draw menu screens in the 960x720 design space, scaled + centered to the
   current canvas. Identity in landscape, so desktop rendering is unchanged. */
function menuView(fn) {
  Bg.draw(ctx, perfT);
  const rw = W, rh = H;
  W = DW; H = DH;
  ctx.save();
  ctx.translate(rw / 2, rh / 2);
  ctx.scale(MENU_S, MENU_S);
  ctx.translate(-DW / 2, -DH / 2);
  fn();
  ctx.restore();
  W = rw; H = rh;
}
function toDesign(p) {
  return { x: (p.x - W / 2) / MENU_S + DW / 2, y: (p.y - H / 2) / MENU_S + DH / 2 };
}

/* ---------- input ---------- */
const keys = {};
/* transient one-line message on menu screens (e.g. the P-key party toggle) */
let menuMsg = null;
const ptr = { x: W / 2, y: H - 60, down: false, moved: false };
/* last input driving the paddle: 'key' | 'pad' | 'ptr' | 'none'.
   Pointer hover only takes over when the pointer is the active input, so a
   keyboard player never gets yanked toward the cursor. */
let paddleInput = 'none';
function ptrToCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code) || actionsFor(e.code).length) e.preventDefault();
  unlockAudio();
  onKeyDown(e.code, e.repeat);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('pointermove', e => {
  lastInputT = perfT;
  const p = ptrToCanvas(e); ptr.x = p.x; ptr.y = p.y; ptr.moved = true; paddleInput = 'ptr';
});
window.addEventListener('pointerdown', e => {
  unlockAudio();
  const p = ptrToCanvas(e); ptr.x = p.x; ptr.y = p.y; ptr.down = true; paddleInput = 'ptr';
  onPointerDown();
});
window.addEventListener('pointerup', () => { ptr.down = false; });
window.addEventListener('blur', () => { if (Game.screen === 'playing' && autoPauseOn()) pauseGame(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- gamepad ---------- */
const Gamepad = { idx: null, active: false, prev: {} };
let padDir = 0;
let fakePad = null; // test hook: { buttons:[{pressed}], axes:[x,y] }
window.addEventListener('gamepadconnected', e => { Gamepad.idx = e.gamepad.index; Gamepad.active = true; });
window.addEventListener('gamepaddisconnected', e => { if (e.gamepad.index === Gamepad.idx) { Gamepad.active = false; Gamepad.idx = null; } });
function pollGamepad() {
  let gp = fakePad;
  if (!gp) {
    if (Gamepad.active) gp = (navigator.getGamepads && navigator.getGamepads()[Gamepad.idx]) || null;
    if (!gp) {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < pads.length; i++) {
        if (pads[i] && pads[i].connected) { Gamepad.idx = i; Gamepad.active = true; gp = pads[i]; break; }
      }
    }
  }
  if (!gp || !gp.buttons || !gp.buttons.length) return;
  const b = gp.buttons;
  /* bind-capture mode: keyboard rows ignore the pad, pad rows grab the next button */
  if (Ctl.bind) {
    if (!Ctl.bind.pad) return;
    for (let btn = 0; btn < 18; btn++) {
      const pressed = !!(b[btn] && b[btn].pressed);
      const was = !!Gamepad.prev['c' + btn];
      if (pressed && !was) capturePad(btn);
      Gamepad.prev['c' + btn] = pressed;
    }
    return;
  }
  /* attract mode: any pad button press ends the demo */
  if (Demo.active) {
    for (let btn = 0; btn < 18; btn++) {
      const pressed = !!(b[btn] && b[btn].pressed);
      const was = !!Gamepad.prev['dm' + btn];
      if (pressed && !was && Demo.phase === 'playing') startDemoFade();
      Gamepad.prev['dm' + btn] = pressed;
    }
    return;
  }
  // stick with hysteresis: engages past 0.45, stays engaged until back under 0.22 (no flicker)
  const ax = gp.axes ? gp.axes[0] : 0;
  const padL = (ax < -0.45 || (Gamepad.axL && ax < -0.22)) || (b[14] && b[14].pressed);
  const padR = (ax > 0.45 || (Gamepad.axR && ax > 0.22)) || (b[15] && b[15].pressed);
  Gamepad.axL = ax < -0.45; Gamepad.axR = ax > 0.45;
  padDir = (padR ? 1 : 0) - (padL ? 1 : 0);
  /* remappable pad actions: launch / confirm / pause / back */
  const pb = curPadb();
  for (const act of PAD_ACTIONS) {
    for (const btn of pb[act]) {
      const pressed = !!(b[btn] && b[btn].pressed);
      const was = !!Gamepad.prev[act + ':' + btn];
      // on mode-select the X/Y/B buttons are the fixed quick-toggle shortcuts, not actions
      if (pressed && !was && !(Game.screen === 'modeselect' && (btn === 1 || btn === 2 || btn === 3))) handleAction([act], null, false, true);
      Gamepad.prev[act + ':' + btn] = pressed;
    }
  }
  /* fixed d-pad navigation (menus) */
  for (const [btn, code] of [[12, 'ArrowUp'], [13, 'ArrowDown'], [14, 'ArrowLeft'], [15, 'ArrowRight']]) {
    const pressed = !!(b[btn] && b[btn].pressed);
    const was = !!Gamepad.prev['d' + btn];
    if (pressed && !was) onKeyDown(code, false);
    Gamepad.prev['d' + btn] = pressed;
  }
  /* options + controls: LB/RB switch the mode tab (bumpers = category navigation) */
  if (Game.screen === 'options' || Game.screen === 'controls') {
    const lbEdge = !!(b[4] && b[4].pressed) && !Gamepad.prev['o4'];
    const rbEdge = !!(b[5] && b[5].pressed) && !Gamepad.prev['o5'];
    const xEdge = !!(b[2] && b[2].pressed) && !Gamepad.prev['ox'];
    Gamepad.prev['o4'] = !!(b[4] && b[4].pressed);
    Gamepad.prev['o5'] = !!(b[5] && b[5].pressed);
    Gamepad.prev['ox'] = !!(b[2] && b[2].pressed);
    if (lbEdge) onKeyDown('ArrowLeft', false);
    if (rbEdge) onKeyDown('ArrowRight', false);
    if (xEdge && Game.screen === 'options') onKeyDown('KeyX', false); // X clears the tab's mode
  }
  /* title shortcut: Y opens CONTROLS so pad players can remap before starting */
  if (Game.screen === 'title') {
    const yEdge = !!(b[3] && b[3].pressed) && !Gamepad.prev['t3'];
    Gamepad.prev['t3'] = !!(b[3] && b[3].pressed);
    if (yEdge) onKeyDown('KeyC', false);
  }
  /* mode-select shortcuts: X = KEYS, Y = PARTY, B = AUTO-PAUSE, Y+X/B = RESET */
  if (Game.screen === 'modeselect') {
    const yHeld = !!(b[3] && b[3].pressed);
    const xEdge = !!(b[2] && b[2].pressed) && !Gamepad.prev['m2'];
    const bEdge = !!(b[1] && b[1].pressed) && !Gamepad.prev['m1'];
    const yEdge = !!(b[3] && b[3].pressed) && !Gamepad.prev['m3'];
    const rbEdge = !!(b[5] && b[5].pressed) && !Gamepad.prev['m5'];
    Gamepad.prev['m1'] = !!(b[1] && b[1].pressed);
    Gamepad.prev['m2'] = !!(b[2] && b[2].pressed);
    Gamepad.prev['m3'] = !!(b[3] && b[3].pressed);
    Gamepad.prev['m5'] = !!(b[5] && b[5].pressed);
    if (xEdge && yHeld) onKeyDown('PadReset', false);
    else if (xEdge) onKeyDown('KeyK', false);
    if (bEdge && yHeld) onKeyDown('PadReset', false);
    else if (bEdge) onKeyDown('KeyA', false);
    if (yEdge) onKeyDown('KeyP', false);
    if (rbEdge) onKeyDown('KeyR', false);
    const lbEdge = !!(b[4] && b[4].pressed) && !Gamepad.prev['m4'];
    Gamepad.prev['m4'] = !!(b[4] && b[4].pressed);
    if (lbEdge && Menu.sel === 1) onKeyDown('KeyS', false);
  }
}

/* ---------- audio engine ---------- */
let AC = null, masterGain = null, sfxGain = null, musicGain = null, musicFilt = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.5; masterGain.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(masterGain);
    musicGain = AC.createGain(); musicGain.gain.value = 0.5; musicGain.connect(masterGain);
    musicFilt = AC.createBiquadFilter(); musicFilt.type = 'lowpass'; musicFilt.frequency.value = 18000; musicFilt.connect(musicGain);
    const len = AC.sampleRate * 1;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function unlockAudio() { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, dur, type, vol, slide, delay, dest) {
  if (!AC || !soundOn()) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(28, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}
function noiseHit(dur, vol, freq, delay, q) {
  if (!AC || !soundOn() || !noiseBuf) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = freq || 1000; flt.Q.value = q || 0.8;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(flt); flt.connect(g); g.connect(sfxGain);
    s.start(t0); s.stop(t0 + dur + 0.03);
  } catch (e) {}
}
function playSfx(name) {

/* ---------- chiptune music sequencer ---------- */
const Music = {
  playing: false, step: 0, bar: 0, nextT: 0, timer: null, bpm: 140, pitch: 0,
  roots: [45, 41, 48, 43], scale: [0, 2, 3, 5, 7, 9, 10, 12, 14, 15, 17, 19, 21, 22, 24, 26],
  pat: [0, 3, 7, 10, 12, 10, 7, 3, 0, 3, 7, 10, 12, 15, 12, 10],
  /* DOH enrage loop: when the boss is wounded the music leaps to a faster,
     darker, driving cycle (Am-F-G-E with an 8th-note bass and a 16th-note
     saw riff) and drops back to the level tempo the moment it dies. */
  enraged: false, baseBpm: 0, enrageAt: 0,
  rageRoots: [45, 41, 43, 40], ragePat: [0, 3, 5, 7, 8, 7, 5, 3, 0, 3, 5, 7, 10, 8, 7, 5],
  start() {
    if (!AC || this.playing || !musicOn()) return;
    this.playing = true; this.step = 0; this.bar = 0; this.nextT = AC.currentTime + 0.08;
    this.timer = setInterval(() => this.schedule(), 90);
  },
  stop() { this.playing = false; if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  schedule() {
    if (!AC || !this.playing) return;
    /* the enrage sting arms a delayed switch: the aggressive loop drops in a
       beat after the riser, so the drum fill leads into it */
    if (this.enrageAt && AC.currentTime >= this.enrageAt) {
      this.enrageAt = 0;
      this.bpm = clamp((this.baseBpm || 140) + 28, 100, 210);
      this.enraged = true;
    }
    const spb = 60 / this.bpm / 4; // 16th notes
    const en = this.enraged;
    const roots = en ? this.rageRoots : this.roots;
    const pat = en ? this.ragePat : this.pat;
    while (this.nextT < AC.currentTime + 0.18) {
      const s = this.step, bar = this.bar % 4, root = roots[bar];
      const t = this.nextT;
      if (s % 2 === 0 || en) {
        // bass: on the beat — plus a staccato sawtooth stab on every off-beat when enraged
        const off = en && s % 2 === 1;
        const bassM = root + this.pitch - 12;
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = off ? 'sawtooth' : 'triangle';
        o.frequency.value = this.mtof(bassM);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(off ? 0.12 : 0.16, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (off ? spb * 0.4 : spb * 1.7));
        o.connect(g); g.connect(musicFilt || musicGain); o.start(t); o.stop(t + spb * 2);
      }
      if (en || s % 2 === 1) {
        // melody: a driving 16th-note riff when enraged, harsher and staccato
        const note = this.scale[pat[s]] + root + 12 + this.pitch;
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = en ? 'sawtooth' : 'square';
        o.frequency.value = this.mtof(note);
        const v = en ? 0.07 : 0.05 + (pat[s] === 12 ? 0.02 : 0);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(v, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + spb * (en ? 0.5 : 0.9));
        o.connect(g); g.connect(musicFilt || musicGain); o.start(t); o.stop(t + spb);
      }
      if ((en ? s % 2 === 0 : s % 4 === 2) && noiseBuf) {
        // hats: a steadier, brighter pulse when enraged
        const snd = AC.createBufferSource(); snd.buffer = noiseBuf;
        const g = AC.createGain(); g.gain.setValueAtTime(en ? 0.032 : 0.022, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
        const flt = AC.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.value = 6000;
        snd.connect(flt); flt.connect(g); g.connect(musicFilt || musicGain);
        snd.start(t); snd.stop(t + 0.05);
      }
      this.step = (this.step + 1) % 16;
      if (this.step === 0) this.bar++;
      this.nextT += spb;
    }
  },
  setBpm(b) { this.bpm = clamp(b, 100, 210); this.enraged = false; this.enrageAt = 0; },
  setPitch(n) { this.pitch = clamp(n, -5, 9); },
  /* Low-pass duck: when the game pauses or the player is on their last life
     the music pulls back behind a muffling filter sweep, then opens back up. */
  duck(on) {
    if (!musicFilt || !AC) return;
    const t = AC.currentTime;
    musicFilt.frequency.cancelScheduledValues(t);
    musicFilt.frequency.setValueAtTime(musicFilt.frequency.value || 18000, t);
    musicFilt.frequency.exponentialRampToValueAtTime(on ? 750 : 18000, t + 0.4);
  },
  enrage(on) {
    if (on && !this.enraged) { this.baseBpm = this.bpm; this.bpm = clamp(this.bpm + 28, 100, 210); this.enraged = true; }
    else if (!on) {

      if (this.enraged) { this.bpm = this.baseBpm || 140; this.enraged = false; }
    }
  },
  /* The wound sting: a rising noise sweep with an accelerating snare fill,
     resolving into a kick as the aggressive loop drops in. The loop switch is
     armed on the scheduler clock so it lands a beat after the fill. */
  sting() {
    if (!AC) return;
    if (!this.enraged) this.baseBpm = this.bpm;
    const riser = 0.55, t0 = AC.currentTime + 0.02;
    this.enrageAt = t0 + riser;
    if (!musicOn() || !this.playing) return;
    if (noiseBuf) {
      const snd = AC.createBufferSource(); snd.buffer = noiseBuf;
      const flt = AC.createBiquadFilter(); flt.type = 'bandpass'; flt.Q.value = 1.4;
      flt.frequency.setValueAtTime(350, t0);
      flt.frequency.exponentialRampToValueAtTime(5200, t0 + riser);
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + riser * 0.8);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + riser + 0.1);
      snd.connect(flt); flt.connect(g); g.connect(musicFilt || musicGain);
      snd.start(t0); snd.stop(t0 + riser + 0.15);
      const hits = [0, 0.12, 0.22, 0.3, 0.36, 0.41, 0.45, 0.49];
      hits.forEach((dt, i) => {
        const t = t0 + dt;
        const s2 = AC.createBufferSource(); s2.buffer = noiseBuf;
        const f2 = AC.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = 3200;
        const g2 = AC.createGain();
        g2.gain.setValueAtTime(0.03 + (i / hits.length) * 0.1, t);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
        s2.connect(f2); f2.connect(g2); g2.connect(musicFilt || musicGain);
        s2.start(t); s2.stop(t + 0.07);
      });
    }
    // kick: a thump right as the aggressive loop lands
    const k = AC.createOscillator(); k.type = 'sine';
    k.frequency.setValueAtTime(160, t0 + riser);
    k.frequency.exponentialRampToValueAtTime(50, t0 + riser + 0.14);
    const kg = AC.createGain();
    kg.gain.setValueAtTime(0.0001, t0 + riser);
    kg.gain.exponentialRampToValueAtTime(0.32, t0 + riser + 0.02);
    kg.gain.exponentialRampToValueAtTime(0.0001, t0 + riser + 0.22);
    k.connect(kg); kg.connect(musicFilt || musicGain);
    k.start(t0 + riser); k.stop(t0 + riser + 0.25);
  }
};
function refreshMusic() {
  if (!musicOn()) Music.stop();
  else if (AC && !Music.playing) Music.start();
}
/* Keep the music duck in sync with the moment: muffled while paused or on the
   last life, open everywhere else. */

  Music.duck(Game.screen === 'paused' || (Game.screen === 'playing' && Game.lives === 0));

const Particles = { list: [], max: 420,
  spawn(o) {
    if (this.list.length > this.max) this.list.shift();
    this.list.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, max: 1, size: 3, color: '#fff', shape: 'rect', rot: 0, vr: 0, fade: true }, o));
  },
  burst(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(spd * 0.25, spd);
      this.spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - rand(0, 40), g: 320, life: rand(0.4, 0.9), max: 0.9, size: rand(2, 5), color, shape: 'rect', rot: rand(0, TAU), vr: rand(-8, 8) });
    }
  },
  spark(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(40, 220);
      this.spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0, life: rand(0.2, 0.5), max: 0.5, size: rand(1.5, 3), color, shape: 'spark' });
    }
  },
  ring(x, y, color, size) {
    this.spawn({ x, y, vx: 0, vy: 0, g: 0, life: 0.45, max: 0.45, size, color, shape: 'ring' });
  },
  confetti(x, y, n) {
    const cols = ['#29d8ff', '#ff3d5e', '#ffd23d', '#3dff8f', '#c77dff'];
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI, 0), v = rand(120, 380);
      this.spawn({ x: x + rand(-30, 30), y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 420, life: rand(1, 2.2), max: 2.2, size: rand(3, 6), color: pick(cols), shape: 'rect', rot: rand(0, TAU), vr: rand(-10, 10) });
    }
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt;
      if (p.life <= 0) { this.list.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.shape === 'rect') p.rot += p.vr * dt;
    }
  },
  draw(ctx) {
    for (const p of this.list) {
      const a = p.fade ? clamp(p.life / p.max, 0, 1) : 1;
      ctx.globalAlpha = a;

  }
};

  ctx.fillRect(x + 2, y + 2, w - 4, 3);

  const s = w / 68, cx = x + 2 + 32 * s, cy = y + 2 + 11;
  if (type === 'X') { // gold V emblem — indestructible
    ctx.fillStyle = '#4a3100';
    ctx.strokeStyle = 'rgba(255,243,199,0.92)';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(cx - 10.5 * s, cy - 3.5); ctx.lineTo(cx, cy + 9.5); ctx.lineTo(cx + 10.5 * s, cy - 3.5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (type === 'S' || type === 'T') { // damage chevrons — extra hits
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    if (type === 'S') { ctx.moveTo(cx - 24 * s, cy - 5); ctx.lineTo(cx - 14 * s, cy + 1); ctx.lineTo(cx - 4 * s, cy - 4); }
    else {
      ctx.moveTo(cx - 26 * s, cy - 4); ctx.lineTo(cx - 16 * s, cy + 2); ctx.lineTo(cx - 6 * s, cy - 4);
      ctx.moveTo(cx + 4 * s, cy + 4); ctx.lineTo(cx + 14 * s, cy - 1); ctx.lineTo(cx + 24 * s, cy + 5);
    }
    ctx.stroke();
  } else if (type === 'b') { // bomb fuse
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, 6 * s, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.arc(cx, cy, 3.4 * s, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#111'; ctx.beginPath(); ctx.moveTo(cx + s, cy - 7); ctx.lineTo(cx + 4.5 * s, cy - 1); ctx.stroke();
  } else if (type === '?') { // mystery mark
    ctx.font = 'bold ' + Math.round(17 * s) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(30,12,60,0.9)'; ctx.lineWidth = 2.5 * s;
    ctx.strokeText('?', cx, cy);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('?', cx, cy);
  } else if (type === 'D') { // diamond gem
    ctx.fillStyle = '#0e2f5c';
    ctx.strokeStyle = 'rgba(190,235,255,0.95)'; ctx.lineWidth = 1.3 * s;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.lineTo(cx + Math.cos(a) * 6 * s, cy + Math.sin(a) * 6 * s);
      ctx.lineTo(cx + Math.cos(a + Math.PI / 4) * 2.4 * s, cy + Math.sin(a + Math.PI / 4) * 2.4 * s);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
/* Gold (indestructible) brick emblem: a bold 'V' with a dark bronze body and a
   bright edge, so it stays readable through the gold flash. */
function drawGoldEmblem(bs) {
  ctx.save();
  ctx.translate(BRICK_W / 2, BRICK_H / 2);
  ctx.fillStyle = '#4a3100';
  ctx.strokeStyle = 'rgba(255,243,199,0.92)';
  ctx.lineWidth = 1.5 * bs;
  ctx.beginPath();
  ctx.moveTo(-10.5 * bs, -3.5 * bs);
  ctx.lineTo(0, 9.5 * bs);
  ctx.lineTo(10.5 * bs, -3.5 * bs);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

/* ---------- power-up glyph icons ---------- */
/* Every capsule gets a vector glyph that reads as its effect, drawn the same
   way in-game, in the how-to legend, and on HUD chips so they always match. */
function capArrow(x1, y1, x2, y2, headEnd) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  const tipX = headEnd ? x2 : x1, tipY = headEnd ? y2 : y1;
  const hl = ctx.lineWidth * 2.4;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - Math.cos(a - 0.45) * hl, tipY - Math.sin(a - 0.45) * hl);
  ctx.lineTo(tipX - Math.cos(a + 0.45) * hl, tipY - Math.sin(a + 0.45) * hl);
  ctx.closePath(); ctx.fill();
}
function capHeart(r) {
  ctx.beginPath();
  ctx.moveTo(0, 0.9 * r);
  ctx.bezierCurveTo(-1.35 * r, 0.05 * r, -0.85 * r, -1.05 * r, 0, -0.4 * r);
  ctx.bezierCurveTo(0.85 * r, -1.05 * r, 1.35 * r, 0.05 * r, 0, 0.9 * r);
  ctx.fill();
}
function drawCapIcon(id, x, y, s, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1.1, s * 0.09);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const u = s / 12;
  switch (id) {
    case 'E': // expand: arrows outward
      capArrow(-2 * u, 0, -5.2 * u, 0, false); capArrow(2 * u, 0, 5.2 * u, 0, true);
      break;
    case 'R': // reduce: arrows inward
      capArrow(-5.2 * u, 0, -1.8 * u, 0, true); capArrow(5.2 * u, 0, 1.8 * u, 0, true);
      break;
    case 'S': // split: one ball becomes three
      ctx.beginPath(); ctx.arc(0, -1.6 * u, 2.5 * u, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-3.1 * u, 2.6 * u, 1.7 * u, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(3.1 * u, 2.6 * u, 1.7 * u, 0, TAU); ctx.fill();
      break;
    case 'L': // laser: crosshair over a bolt
      ctx.beginPath(); ctx.arc(0, 0, 3.3 * u, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -2.4 * u); ctx.lineTo(0, 2.4 * u); ctx.moveTo(-2.4 * u, 0); ctx.lineTo(2.4 * u, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 1 * u, 0, TAU); ctx.fill();
      break;
    case 'C': // catch: ball resting on the paddle
      ctx.fillRect(-4.6 * u, 2.2 * u, 9.2 * u, 2.2 * u);
      ctx.beginPath(); ctx.arc(0, -0.9 * u, 2.6 * u, 0, TAU); ctx.fill();
      break;
    case 'M': // mega ball: big ball with halo
      ctx.beginPath(); ctx.arc(0, 0, 3.8 * u, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(0, 0, 4.9 * u, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      break;
    case 'P': // pierce: arrow through the ball
      ctx.beginPath(); ctx.arc(0, 0, 3 * u, 0, TAU); ctx.fill();
      capArrow(-5.4 * u, 0, 5.4 * u, 0, true);
      break;
    case 'WARP': // warp: spiral portal
      ctx.beginPath(); ctx.arc(0, 0, 4.6 * u, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 20; i++) {
        const a = i / 20 * Math.PI * 2;
        const r = (1.4 + a * 0.68) * u;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      break;
    case 'B': // break: explosion star
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        const r = i % 2 === 0 ? 4.4 * u : 1.9 * u;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      break;
    case 'W': // slow: double chevron down
      ctx.beginPath();
      ctx.moveTo(-3.2 * u, -2.6 * u); ctx.lineTo(0, 0.4 * u); ctx.lineTo(3.2 * u, -2.6 * u);
      ctx.moveTo(-3.2 * u, 0.8 * u); ctx.lineTo(0, 3.8 * u); ctx.lineTo(3.2 * u, 0.8 * u);
      ctx.stroke();
      break;
    case '2': // 2x score: two sparkle stars — no numerals, reads as double
      const spark = (sx, r) => {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          const rad = i % 2 === 0 ? r : r * 0.4;
          const px = sx + Math.cos(a) * rad, py = Math.sin(a) * rad;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
      };
      spark(-2.5 * u, 2.6 * u); spark(2.5 * u, 2.6 * u);
      break;
    case 'I': // 1up: heart
      capHeart(3.4 * u);
      break;
    case 'F': // fast: lightning bolt
      ctx.beginPath();
      ctx.moveTo(1.2 * u, -4.6 * u); ctx.lineTo(-1.9 * u, 0.5 * u); ctx.lineTo(-0.3 * u, 0.5 * u);
      ctx.lineTo(-1.2 * u, 4.6 * u); ctx.lineTo(1.9 * u, -0.5 * u); ctx.lineTo(0.3 * u, -0.5 * u);
      ctx.closePath(); ctx.fill();
      break;
    case 'D': // disrupt: zigzag
      ctx.beginPath();
      ctx.moveTo(-4.6 * u, 3.1 * u); ctx.lineTo(-1.6 * u, -1.3 * u);
      ctx.lineTo(1.2 * u, 1.3 * u); ctx.lineTo(4.6 * u, -3.1 * u);
      ctx.stroke();
      break;
    default:
      ctx.font = Math.round(s * 0.55) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(id, 0, 1);
      break;
  }
  ctx.restore();
}

/* ---------- procedural REMIX generator ---------- */
function genRemixMap(level) {
  const rows = Math.min(5 + Math.ceil(level / 1.4), 12);
  const colors = ['C', 'B', 'G', 'Y', 'O', 'R'];
  const g = [];
  for (let i = 0; i < rows; i++) {
    let row = new Array(COLS).fill('.');
    const solid = i % 3 === 0;
    for (let c = 0; c < COLS; c++) {
      if (!solid && c % 2 === i % 2) continue;
      row[c] = colors[(i + Math.floor(level / 3)) % colors.length];
    }
    if (level >= 3 && Math.random() < Math.min(0.3, (level - 2) * 0.07)) {
      const c = randi(0, COLS - 1); if (row[c] !== '.') row[c] = 'S';
    }
    if (level >= 5 && Math.random() < Math.min(0.25, (level - 4) * 0.06)) {
      const c = randi(0, COLS - 1); if (row[c] !== '.') row[c] = 'T';
    }
    g.push(row.join(''));
  }
  if (level >= 5) {
    const c = randi(0, COLS - 1);
    for (let i = 0; i < rows; i++) if (g[i][c] === '.') g[i] = g[i].slice(0, c) + 'X' + g[i].slice(c + 1);
  }
  if (level >= 4) {
    const n = Math.min(2 + Math.floor(level / 2), 6);
    for (let k = 0; k < n; k++) {
      const r = randi(0, rows - 1), c = randi(0, COLS - 1);
      if (g[r][c] !== '.') g[r] = g[r].slice(0, c) + 'b' + g[r].slice(c + 1);
    }
  }
  if (level >= 3) {
    const r = randi(0, rows - 1), c = randi(0, COLS - 1);
    if (g[r][c] !== '.') g[r] = g[r].slice(0, c) + '?' + g[r].slice(c + 1);
  }
  if (level >= 2) {
    const n = Game.obj && Game.obj.type === 'gems' ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const r = randi(0, rows - 1), c = randi(0, COLS - 1);
      if (g[r][c] !== '.') g[r] = g[r].slice(0, c) + 'D' + g[r].slice(c + 1);
    }
  }
  while (g.length < ROWS) g.push('............');
  return g;
}

/* Power-up preview: when a capsule gets close to the paddle, a little popup

function drawCapPreview() {
  const PROX = 130, SIZE = 10, ICON = 18, PAD = 10, GAP = 7, HGT = 36;
  for (const c of Game.capsules) {
    const d = PADDLE_Y - c.y;
    if (d < -CAP_S || d > PROX) continue;
    const a = clamp(1 - d / PROX, 0, 1);
    const pop = 1 + (1 - a) * 0.12;
    const name = c.name;
    const textW = name.length * SIZE;
    const w = PAD * 2 + ICON + GAP + textW;
    const px = clamp(c.x, w / 2 + 4, W - w / 2 - 4);
    const py = PADDLE_Y - HGT - 14;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(px, py);
    ctx.scale(pop, pop);
    ctx.shadowColor = c.color;

    ctx.fillStyle = c.good ? 'rgba(5,17,13,0.92)' : 'rgba(20,5,10,0.92)';
    rr(-w / 2, -HGT / 2, w, HGT, 9); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = c.color; ctx.lineWidth = 2;
    rr(-w / 2, -HGT / 2, w, HGT, 9); ctx.stroke();

    rr(-w / 2 + 3, -HGT / 2 + 3, w - 6, HGT - 6, 7); ctx.stroke();

    drawText(name, -w / 2 + PAD + ICON + GAP + textW / 2, 0.5, SIZE, c.good ? '#d9ffe9' : '#ffdce5', {});

    ctx.beginPath();
    ctx.moveTo(-5, HGT / 2 + 3); ctx.lineTo(0, HGT / 2 + 9); ctx.lineTo(5, HGT / 2 + 3);

/* ---------- level flow ---------- */
function setObjective() {
  const lv = Game.level;
  if (Game.mode !== 'REMIX') { Game.obj = null; return; }
  const r = Math.random();
  if (lv < 2) Game.obj = null;
  else if (r < 0.4) Game.obj = { type: 'speed', txt: 'FAST & FURIOUS: CLEAR IN ' + (28 + lv * 2) + 's!', bonus: 2000 };
  else if (r < 0.7) Game.obj = { type: 'perfect', txt: 'NO DROPPED BALLS!', bonus: 3000 };
  else Game.obj = { type: 'gems', txt: 'HUNT DOWN 2 DIAMONDS!', bonus: 2500, need: 2 };
  Game.objDone = false;
}
function startLevel() {
  Game.levelTime = 0; Game.combo = 0; Game.comboT = 0; Game.mult = 1; Game.ramp = 0; Game.warpT = 0;
  Game.stageStartScore = Game.score;
  Game.fireT = 0; Game.x2T = 0; Game.slowT = 0; Game.fastT = 0; Game.megaT = 0; Game.disruptT = 0;
  Game.laserAmmo = 0; Game.laserCd = 0; Game.bolts = []; Game.capsules = []; Game.challengeTimer = 0;
  Game.capCount = 0;
  Game.capNext = capQuota();
  Game.paddle.catchT = 0; Game.paddle.x = W / 2; Game.paddle.vx = 0;
  Game.paddle.tw = DIFFS[Game.diff].paddle * (Game.mode === 'REMIX' ? clamp(Math.pow(0.96, Math.floor((Game.level - 1) / 4)), 0.74, 1) : 1);
  Game.paddle.w = Game.paddle.tw;
  setObjective();
  let map;
  if (Game.mode === 'CLASSIC') map = CLASSIC_MAPS[(Game.level - 1) % CLASSIC_MAPS.length];
  else if (Game.mode === 'ARKANOID') map = ARKANOID_MAPS[(Game.level - 1) % ARKANOID_MAPS.length];
  else if (Game.mode === 'REMIX') map = genRemixMap(Game.level);
  else map = CHALLENGE_MAPS[CHALLENGES[Game.challengeIdx].map];
  buildLevel(map);
  /* reaching a stage (even via warp) adds it to the stage-select pool */
  if (Game.mode === 'ARKANOID') {
    const prog = ARK_PROG();
    if (Game.level > prog.reached) { prog.reached = Math.min(Game.level, ARKANOID_MAPS.length); saveArkProg(prog); }
  }
  /* DOH boss round: remember the core count so the second phase can trigger.
     The mystery weak points are its hearts — destroy them all to end the fight,
     and every core still standing pays out on the BOSS DOWN banner. */
  if (Game.mode === 'ARKANOID' && Game.level === ARKANOID_MAPS.length) {
    Game.bossTotal = Game.destructible; Game.bossWounded = false;
    Game.bossHearts = Game.bricks.filter(b => b.heart).length;
    Game.bossDead = false; Game.bossBonus = 0; Game.bossCoresLeft = 0;
    Game.bossBeamY = Game.bricks.length ? Math.max(...Game.bricks.map(b => b.y + b.h)) : WALL_TOP;
  } else { Game.bossTotal = 0; Game.bossWounded = false; Game.bossHearts = 0; }
  Game.beams = [];
  Game.belchCd = 0;
  Game.belchMax = 0;
  Game.baseSpeed = DIFFS[Game.diff].ball * (Game.mode === 'CH' ? CHALLENGES[Game.challengeIdx].speedMul : 1);
  if (Game.mode === 'REMIX') Game.baseSpeed *= 1 + Math.min((Game.level - 1) * 0.035, 0.62);
  /* Taito's Arkanoid runs the ball a little faster every level — a gentle ramp
     that crests at +60% by the 33rd stage, so the campaign escalates to the boss. */
  if (Game.mode === 'ARKANOID') Game.baseSpeed *= 1 + Math.min((Game.level - 1) * 0.02, 0.6);
  Game.ballSpeed = Game.baseSpeed;
  Game.balls = [makeBall(true)];
  Game.introT = 1.7; Game.introPhase = 'ready';
  Game.clearing = 0; Game.chainT = 0; Game.clearPending = false; Game.objDone = false;
  Game.lostThisLevel = false;
  if (Game.level === 5) unlockAchievement('level5');
  if (Game.mode === 'CH' && CHALLENGES[Game.challengeIdx].timer > 0) Game.challengeTimer = CHALLENGES[Game.challengeIdx].timer;
  Music.setBpm(140 + Math.min(Game.level * 3, 40));
  Music.setPitch(stagePitch());
}
/* Per-level pitch: the loop climbs a semitone every four stages so each stage
   has its own flavor, cresting at a fifth on the final boss. CLASSIC stays put —
   authentic 1976 Breakout, and its speed never ramps. */
function stagePitch() {
  if (Game.mode === 'CLASSIC' || Game.mode === 'CH') return 0;
  return Math.min(Math.floor((Game.level - 1) / 4), 7);
}
function startRun() {
  Game.score = 0; Game.combo = 0; Game.comboT = 0; Game.mult = 1; Game.maxCombo = 0;
  Game.extras = 0; Game.level = 1; Game.time = 0;
  Game.stats = { bricks: 0, maxCombo: 0, hits: 0, shots: 0, gems: 0, bestChain: 0 };
  Game.score100k = false; Game.lostThisLevel = false;

  if (Game.chainT > 0) { Game.clearPending = true; return; }

}
function beginClearCelebration() {
  Game.clearPending = false; Game.chainT = 0;
  if (!Game.lostThisLevel) unlockAchievement('perfect');
  if (Game.mode === 'REMIX' && Game.obj && !Game.objDone) {
    if (Game.obj.type === 'speed') addScore(Game.obj.bonus, W / 2, H * 0.4, '#ffd23b');
    else addScore(Math.floor(Game.obj.bonus / 2), W / 2, H * 0.4, '#ffd23b');
    Game.objDone = true;
  }
  Game.clearing = 1.1;
  Game.capsules = [];
  Game.bolts = [];
  Game.beams = [];

    playSfx('win');
    unlockAchievement('boss');
    if (Game.bossBonus > 0) addScore(Game.bossBonus, W / 2, H * 0.42 + 78, '#ffd23b');

/* ARKANOID campaign progress: per-stage best scores (points earned during that

const ARK_PROG = () => store.get('ark_prog', { best: {}, reached: 1 });
const saveArkProg = p => store.set('ark_prog', p);
function recordStageClear() {
  const st = Game.level;
  const prog = ARK_PROG();
  const pts = Game.score - Game.stageStartScore;
  if (pts > (prog.best[st] || 0)) prog.best[st] = pts;
  if (st >= prog.reached) prog.reached = Math.min(st + 1, ARKANOID_MAPS.length);
  saveArkProg(prog);
}
function finishLevel() {
  const bonus = Game.lives * 250 + (Game.levelTime < 60 ? Math.floor((60 - Game.levelTime) * 20) : 0);
  addScore(bonus, W / 2, H * 0.42, '#3dff8f');
  if (Game.mode === 'CH') { showVictory(); return; }
  if (Game.mode === 'CLASSIC') {
    if (Game.level >= CLASSIC_MAPS.length) { showVictory(); return; }
    Game.level++; startLevel(); return;
  }
  if (Game.mode === 'ARKANOID') {
    recordStageClear();
    if (Game.level >= ARKANOID_MAPS.length) { showVictory(); return; }
    Game.level++; startLevel(); return;
  }
  Game.level++;
  startLevel();
}

/* Let a bomb chain's blast particles (burst life 0.4-0.9s) play out before the
   LEVEL CLEAR celebration starts, so the banner doesn't cut the chain's climax. */
const CHAIN_CLEAR_DELAY = 0.8;

/* ---------- power-ups ---------- */
/* Next capsule quota: kills needed before a capsule pays out. REMIX tightens on
   HARD/INSANE so high difficulty stays skill-driven; ARKANOID keeps the
   authentic ~7-13 rhythm on every difficulty. */
function capQuota() {
  const diffAdj = Game.mode === 'REMIX' ? (Game.diff >= 2 ? (Game.diff - 1) * 2 : 0) : 0;
  return Game.mode === 'ARKANOID' ? 7 + randi(0, 6)
    : Game.mode === 'REMIX' ? 6 + randi(0, 6) + Math.min(4, Math.floor(Game.level / 4)) + diffAdj
    : 1;
}
function dropCapsule(x, y, forced) {
  if (Game.mode === 'CLASSIC' || Game.mode === 'CH') return;
  if (feastOn()) {
    // CAPSULE PARTY: the old generous per-brick odds, no one-at-a-time cap —
    // a pure arcade power-up feast for casual rounds.
    const p = forced ? 1 : (Game.mode === 'ARKANOID' ? 0.24 : Math.min(0.2 + Game.level * 0.004, 0.3));
    if (Math.random() > p) return;
  } else if (!forced) {
    // Arkanoid-authentic scarcity: only one capsule may be falling at a time,
    // and a fresh one only appears after a random run of brick kills (a quota,
    // like the original), not a flat per-brick chance — so levels never become
    // power-up storms. Mystery (?) bricks always pay out and ignore the cap.
    if (Game.capsules.length > 0) return;
    Game.capCount++;
    if (Game.capCount < Game.capNext) return;
    Game.capCount = 0;
    Game.capNext = capQuota();
  }
  /* hidden WARP: a rare portal capsule in ARKANOID / REMIX, mostly from mystery
     bricks — skips ahead WARP_SKIP levels when caught. It's a secret, not part
     of the 13-capsule set, so the cheat-sheet collection stays at 13. */
  if (Game.mode === 'ARKANOID' || Game.mode === 'REMIX') {
    const warpP = forced ? 0.09 : 0.025;
    if (Math.random() < warpP) {
      Game.capsules.push({ x, y, id: 'WARP', warp: true, color: '#c77dff', name: 'WARP', good: true, vy: 150, seed: randi(0, 999) });
      return;
    }
  }
  let tot = 0; for (const k in CAP_WEIGHTS) tot += CAP_WEIGHTS[k];
  let r = Math.random() * tot, id = 'E';
  for (const k in CAP_WEIGHTS) { r -= CAP_WEIGHTS[k]; if (r <= 0) { id = k; break; } }
  const info = CAPSULE_INFO.find(c => c.id === id);
  Game.capsules.push({ x, y, id, color: info.color, name: info.name, good: info.good, vy: 150, seed: randi(0, 999) });
}
/* Hidden WARP capsule: freezes the action in a portal flash, then jumps ahead
   WARP_SKIP levels (clamped to the last map in ARKANOID's short campaign). */
const WARP_SKIP = 3, WARP_TIME = 1.15;
function triggerWarp(c) {
  Game.warpT = WARP_TIME;
  Game.warpNext = Math.min(Game.level + WARP_SKIP, Game.mode === 'ARKANOID' ? ARKANOID_MAPS.length : 9999);
  Game.capsules = [];
  Game.bolts = [];
  Game.beams = [];
  playSfx('warp');
  Flash.set(0.7, '#c77dff');
  Particles.ring(Game.paddle.x, Game.paddle.y - 60, '#c77dff', 70);
  Particles.confetti(Game.paddle.x, Game.paddle.y - 60, 12);
  unlockAchievement('warp');
}
function applyPower(id) {
  // capsule cheat sheet tracking — skipped during the attract demo (no real unlocks)
  if (Demo.active) {
    PWR.recent[id] = perfT;
  } else {
    PWR.caps[id] = (PWR.caps[id] || 0) + 1;
    PWR.recent[id] = perfT;
    if (!PWR.unlocked && ALL_CAPS.every(c => PWR.caps[c] > 0)) {
      PWR.unlocked = true;
      savePWR();
      CheatReveal.t = 4.2;
      playSfx('cheat');
      Particles.confetti(rand(0, W), rand(-20, 40), 14);
      Particles.confetti(rand(0, W), rand(-20, 40), 14);
      Particles.confetti(rand(0, W), rand(-20, 40), 14);
    } else {
      savePWR();
    }
  }
  const p = Game.paddle;
  switch (id) {
    case 'E': p.tw = clamp(p.tw * 1.35, 70, 220); Texts.add(p.x, p.y - 40, 'BIG PADDLE!', '#3dff8f', 14, { glow: true }); break;
    case 'R': p.tw = clamp(p.tw * 0.7, 48, 220); Texts.add(p.x, p.y - 40, 'TINY PADDLE!', '#ff3d5e', 14, { glow: true }); break;
    case 'S': {
      const src = Game.balls.find(b => !b.serve) || Game.balls[0];
      const sp = Game.ballSpeed;
      for (let i = 0; i < 2; i++) {
        const nb = makeBall(false);
        nb.x = src.x; nb.y = src.y; nb.serve = false;
        let a;
        if (src.serve) a = -Math.PI / 2 + (i === 0 ? -0.5 : 0.5);
        else a = Math.atan2(src.vy, src.vx) + (i === 0 ? 0.6 : -0.6);
        nb.vx = Math.cos(a) * sp; nb.vy = Math.sin(a) * sp;
        Game.balls.push(nb);
      }
      if (src.serve) { src.serve = false; src.vx = 0; src.vy = -sp; }
      Texts.add(p.x, p.y - 40, 'BALL PARTY!', '#ffd23b', 14, { glow: true });
      unlockAchievement('multiball');
      break;
    }
    case 'L': Game.laserAmmo = Math.max(Game.laserAmmo, 24); Texts.add(p.x, p.y - 40, 'PEW PEW!', '#29d8ff', 14, { glow: true }); unlockAchievement('laser'); break;
    case 'C': p.catchT = 12; Texts.add(p.x, p.y - 40, 'STICKY!', '#29d8ff', 14, { glow: true }); unlockAchievement('catch'); break;
    case 'M': Game.megaT = 10; Texts.add(p.x, p.y - 40, 'MEGA BALL!', '#ff9a3d', 14, { glow: true }); playSfx('fire'); break;
    case 'P': Game.fireT = 8; Game.megaT = 0; Texts.add(p.x, p.y - 40, 'PIERCING!', '#ff5a5a', 14, { glow: true }); unlockAchievement('fireball'); playSfx('fire'); break;
    case 'B': blastBreak(); break;
    case 'W': Game.slowT = 10; Game.fastT = 0; Texts.add(p.x, p.y - 40, 'EASY RIDER!', '#8fb6ff', 14, { glow: true }); break;
    case 'F': Game.fastT = 10; Game.slowT = 0; Game.fireT = 0; Texts.add(p.x, p.y - 40, 'FULL THROTTLE!', '#ff6a3d', 14, { glow: true }); break;
    case 'D': Game.disruptT = 8; Texts.add(p.x, p.y - 40, 'DISRUPTED!', '#ff3d9e', 14, { glow: true }); playSfx('chain'); break;
    case '2': Game.x2T = 12; Texts.add(p.x, p.y - 40, 'DOUBLE SCORE!', '#ffd23b', 14, { glow: true }); break;
    case 'I': Game.lives++; syncMusicDuck(); Texts.add(p.x, p.y - 40, 'EXTRA GUY!', '#3dff8f', 16, { glow: true }); playSfx('extra'); unlockAchievement('extra-life'); break;
  }
}
function blastBreak() {
  const p = Game.paddle;
  const rad = PITCH_X * 2.6;
  let hit = 0;
  for (const b of Game.bricks.slice()) {
    if (b.dead || b.type === 'X') continue;
    const cx = b.x + BRICK_W / 2, cy = b.y + BRICK_H / 2;
    if (Math.hypot(cx - p.x, cy - (p.y - 140)) < rad) {
      b.hp = 0; destroyBrick(b, 1); hit++;
    }
  }
  if (hit > 0) {
    Texts.add(p.x, p.y - 40, 'KABOOM!', '#c77dff', 15, { glow: true });
    Particles.ring(p.x, p.y - 140, '#c77dff', rad);
    playSfx('chain'); Flash.set(0.3, '#c77dff');
  }
}

/* ---------- brick destruction ---------- */
/* DOH boss second phase: once half the core bricks are gone the armor cracks —
   the surviving cores writhe and flash red on a heartbeat that speeds up as the
   boss takes more damage. Purely visual — grid collisions stay put. */
function checkBossPhase() {
  if (Game.mode !== 'ARKANOID' || Game.level !== ARKANOID_MAPS.length || Game.bossWounded || Game.bossTotal <= 0) return;
  if (Game.destructible <= Game.bossTotal * 0.5) {
    Game.bossWounded = true;
    Music.sting(); // riser + drum fill, then the aggressive loop drops in
    playSfx('bomb');
    Flash.set(0.5, '#ff3d5e');
    Texts.add(W / 2, H * 0.35, 'THE BOSS IS WOUNDED!', '#ff3d5e', 18, { glow: 14 });
  }
}
/* DOH's kill switch: its mystery weak points are hearts. Destroy the last heart
   and the boss falls — the cores still standing shatter on the spot (they
   become the CORE BONUS tally, not normal brick points), and the celebration
   pays BOSS_CORE_BONUS per core left standing. */
function killBoss() {
  if (Game.bossDead) return;
  Game.bossDead = true;

  Game.bossCoresLeft = Game.destructible;
  Game.bossBonus = Game.bossCoresLeft * BOSS_CORE_BONUS;
  Game.beams = [];

  Flash.set(0.55, '#ff3d5e');
  Particles.ring(W / 2, H * 0.35, '#ff3d5e', 150);
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      const b = Game.grid[gy][gx];
      if (!b || b.dead || b.type === 'X') continue;
      b.dead = true; Game.grid[gy][gx] = null;
      Game.destructible--; Game.stats.bricks++;
      breakFeedback(b.x + BRICK_W / 2, b.y + BRICK_H / 2, BRICK_COLORS[b.type], b.type === 'b' || b.type === 'D');
    }
  }
  checkLevelClear();
}
function destroyBrick(b, chainLevel) {
  if (b.dead) return;
  b.dead = true; Game.grid[b.gy][b.gx] = null;
  Game.destructible--; Game.stats.bricks++;
  checkBossPhase();
  const col = BRICK_COLORS[b.type];
  const big = b.type === 'b' || b.type === 'D';
  breakFeedback(b.x + BRICK_W / 2, b.y + BRICK_H / 2, col, big);
  let pts = b.pts;
  if (b.type === 'D') { Game.stats.gems++; pts = 1000; if (Game.obj && Game.obj.type === 'gems' && !Game.objDone) { Game.obj.need--; if (Game.obj.need <= 0) { Game.objDone = true; Texts.add(W / 2, H * 0.4, 'GOAL HIT +' + Game.obj.bonus + '!', '#ffd23b', 15, { glow: true }); } } playSfx('gem'); }
  else if (b.type === 'b') { playSfx('bomb'); Flash.set(0.4, '#ff5a5a'); explodeBomb(b.gx, b.gy, 1); }
  else if (b.type === '?') {
    dropCapsule(b.x + BRICK_W / 2, b.y + BRICK_H / 2, true);
    playSfx('cap');

    if (Game.bossHearts > 0) {

  }
  else { playSfx('break'); dropCapsule(b.x + BRICK_W / 2, b.y + BRICK_H / 2, false); }
  bumpCombo(b.x + BRICK_W / 2, b.y + BRICK_H / 2);
  addScore(pts, b.x + BRICK_W / 2, b.y + BRICK_H / 2, col);

}
function explodeBomb(gx, gy, depth) {
  if (depth > 12) return;
  Game.chainT = Math.max(Game.chainT, CHAIN_CLEAR_DELAY);
  let exploded = 0;
  const proc = new Set();
  const stack = [[gx, gy]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    const key = cx + ',' + cy;
    if (proc.has(key)) continue; proc.add(key);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nb = getBrickAt(cx + dx, cy + dy);
      if (!nb || nb.dead || nb.type === 'X') continue;
      nb.hp--;
      if (nb.hp <= 0) {
        nb.dead = true; Game.grid[nb.gy][nb.gx] = null;
        Game.destructible--; Game.stats.bricks++;
        checkBossPhase();
        if (nb.type === '?' && Game.bossHearts > 0) {
          Game.bossHearts--;
          if (Game.bossHearts <= 0) killBoss();
        }
        exploded++;
        const col = BRICK_COLORS[nb.type];
        Particles.burst(nb.x + BRICK_W / 2, nb.y + BRICK_H / 2, col, 12, 180);
        if (nb.type === 'b') stack.push([nb.gx, nb.gy]);
        else { playSfx('chain'); dropCapsule(nb.x + BRICK_W / 2, nb.y + BRICK_H / 2, false); }
        addScore(nb.pts, nb.x + BRICK_W / 2, nb.y + BRICK_H / 2, col);
        bumpCombo(nb.x + BRICK_W / 2, nb.y + BRICK_H / 2);
        if (nb.type === 'D') {
          Game.stats.gems++;
          addScore(500, nb.x, nb.y);
          if (Game.obj && Game.obj.type === 'gems' && !Game.objDone) {
            Game.obj.need--;
            if (Game.obj.need <= 0) {
              Game.objDone = true;
              Texts.add(W / 2, H * 0.4, 'GOAL HIT +' + Game.obj.bonus + '!', '#ffd23b', 15, { glow: true });
            }
          }
        }
      } else { nb.flash = 0.3; Particles.spark(nb.x + BRICK_W / 2, nb.y + BRICK_H / 2, '#ffffff', 4); }
    }
  }
  if (exploded >= 5) unlockAchievement('chain');
  checkLevelClear();
}

/* ---------- ball hit processing ---------- */
function hitBrick(ball, b) {
  ball.hitBrick = true;
  const col = BRICK_COLORS[b.type];
  if (b.type === 'X') { Particles.spark(ball.x, ball.y, '#ffd23b', 6); playSfx('gold'); return; }
  if (b.type === '?' && !b.heart && b.hp === 1 && b.maxHp === 1) {
    const nc = pick(['C', 'B', 'G', 'Y', 'O', 'R']);
    b.type = nc; b.pts = brickPts(nc, b.gy);
    b.flash = 0.4; Particles.spark(ball.x, ball.y, '#c77dff', 8); playSfx('steel'); return;
  }
  b.hp--; b.flash = 0.25;
  if (b.hp <= 0) {
    destroyBrick(b, 1);
  } else {
    Particles.spark(ball.x, ball.y, col, 5);
    playSfx('steel');
  }
  Game.stats.hits++;
}

/* ---------- physics update ---------- */
let perfT = 0, realDt = 0.016;
function updatePaddle(dt) {
  const p = Game.paddle;
  const kSpeed = 720;
  let dir = 0, mL = false, mR = false;
  if (Demo.active) {
    /* attract-mode AI: track the live ball with a human-ish drift; the shared
       velocity ramp below keeps the motion smooth like a real player's */
    const live = Game.balls.find(b => !b.serve) || Game.balls[0];
    const goal = live.x + Math.sin(perfT * 0.6) * 26 + Math.sin(perfT * 1.9) * 10;
    if (Math.abs(p.x - goal) > 12) dir = goal > p.x ? 1 : -1;
  } else {
    mL = keysOn() && held('moveL'); mR = keysOn() && held('moveR');
    if (mL) dir -= 1;
    if (mR) dir += 1;
    if (padDir < 0) dir -= 1;
    if (padDir > 0) dir += 1;
  }
  const xMin = p.w / 2 + 8, xMax = W - p.w / 2 - 8;
  if (dir) {
    /* keyboard / gamepad: velocity ramp integrated per frame — smooth, no teleports */
    paddleInput = (mL || mR) ? 'key' : 'pad';
    p.vx = lerp(p.vx, dir * kSpeed, 1 - Math.pow(0.0001, dt));
    p.x += p.vx * dt;
  } else if (ptr.down || (ptr.moved && paddleInput === 'ptr')) {
    /* pointer: near-1:1 tracking, speed-capped so a far cursor glides over a
       few frames instead of teleporting. vx is the real per-frame motion,
       which feeds the launch angle. */
    paddleInput = 'ptr';
    const nx = clamp(ptr.x, xMin, xMax);
    const step = clamp(nx - p.x, -2600 * dt, 2600 * dt);
    p.x += step;
    p.vx = step / Math.max(dt, 0.001);
  } else {
    /* idle: ease the last velocity to zero, stay put — no cursor yank */
    p.vx = lerp(p.vx, 0, 1 - Math.pow(0.001, dt));
  }
  p.x = clamp(p.x, xMin, xMax);
  p.w = lerp(p.w, p.tw, 1 - Math.pow(0.0005, dt));
  p.squash = Math.max(0, p.squash - dt * 3);
  p.flash = Math.max(0, p.flash - dt * 3);
  p.catchT = Math.max(0, p.catchT - dt);
}
/* DOH enrage: once its armor cracks, every paddle hit makes the boss belch a
   one-brick-wide beam down the board. It telegraphs a glowing column, then
   sweeps to the floor — stand in its column when it reaches the paddle and you
   get zapped. Only a couple may be live at once. */
const BEAM_MAX = 2, BOSS_CORE_BONUS = 500;
/* Difficulty scales the enrage beam itself: EASY telegraphs long and sweeps
   slowly, INSANE warns for barely a blink and drops the beam at full speed.
   Each beam captures its own warn/speed at spawn so nothing drifts mid-flight. */
const BEAM_DIFF = [
  { warn: 0.7, speed: 1150 },  // EASY
  { warn: 0.5, speed: 1500 },  // NORMAL
  { warn: 0.42, speed: 1750 }, // HARD
  { warn: 0.35, speed: 2050 }  // INSANE
];
/* Mercy rule: at low combo the boss needs a beat between belches, so a
   struggling player never faces two beams at once. The cooldown eases along a
   smooth curve — each brick chained at low combo visibly calms the boss, and
   the decay levels off toward the BEAM_MAX cap on a hot streak. Difficulty
   scales the whole curve: EASY is gentle, INSANE keeps the pressure on. */
const BELCH_DIFF_MUL = [1.35, 1.0, 0.8, 0.6];
function belchCooldown() {
  const c = Game.combo;
  return (0.35 + 1.15 * Math.exp(-c / 8.75)) * (BELCH_DIFF_MUL[Game.diff] || 1);
}
function bossBelch(hitX) {
  if (!Game.bossWounded || Game.clearing > 0 || Game.clearPending || Game.warpT > 0 || Game.introT > 0) return;
  if (Game.belchCd > 0 || Game.beams.length >= BEAM_MAX) return;
  const x = clamp(hitX + (Math.random() - 0.5) * 60, BX0 + PITCH_X / 2, BX0 + (COLS - 1) * PITCH_X + PITCH_X / 2);
  const bd = BEAM_DIFF[Game.diff] || BEAM_DIFF[1];
  Game.beams.push({ x, y: Game.bossBeamY, y0: Game.bossBeamY, w: PITCH_X, warn: bd.warn, warnT: bd.warn, spd: bd.speed, vy: 0, hit: false, seed: randi(0, 999) });
  Game.belchCd = belchCooldown();
  Game.belchMax = Game.belchCd;
  playSfx('warn');
}
function updateBeams(dt) {
  const p = Game.paddle;
  for (let i = Game.beams.length - 1; i >= 0; i--) {
    const bm = Game.beams[i];
    if (bm.warn > 0) {
      bm.warn -= dt;
      if (bm.warn <= 0) { bm.warn = 0; bm.vy = bm.spd; playSfx('zap'); }
      continue;
    }
    bm.y += bm.vy * dt;
    if (!bm.hit && Math.abs(bm.x - p.x) < (bm.w / 2 + p.w / 2) &&
        bm.y >= p.y - p.h / 2 - 24 && bm.y <= p.y + p.h / 2 + 24) {
      bm.hit = true;
      zapPaddle();
    }
    if (bm.y > H + 80) Game.beams.splice(i, 1);
  }
}
function zapPaddle() {
  if (Game.clearing > 0 || Game.clearPending || Game.warpT > 0 || Game.introT > 0 || Demo.active) return;
  playSfx('zap');
  Flash.set(0.35, '#29d8ff');
  Particles.spark(Game.paddle.x, Game.paddle.y - 10, '#29d8ff', 14);
  Texts.add(Game.paddle.x, Game.paddle.y - 48, 'ZAPPED!', '#29d8ff', 16, { glow: true });
  loseLife();
}
function updateBalls(dt) {
  const target = Game.ballSpeed;
  for (const b of Game.balls) {
    if (b.dead) continue;
    if (b.serve) {
      b.x = Game.paddle.x;
      b.y = PADDLE_Y - BALL_R * 2.7;
      continue;
    }
    const sp = Math.hypot(b.vx, b.vy) || 1;
    /* trail length tracks ball speed so a fast ball reads visually */
    b.hist.push({ x: b.x, y: b.y });
    if (b.hist.length > clamp(6 + Math.floor(sp / 55), 6, 15)) b.hist.shift();
    const k = lerp(1, target / sp, Math.min(1, dt * 2));
    b.vx *= k; b.vy *= k;
    if (Game.disruptT > 0) {
      const wob = Math.sin(perfT * 6.5 + b.seed * 13) * 0.55;
      const a = Math.atan2(b.vy, b.vx) + wob * dt * 2.4;
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
    }
    const steps = clamp(Math.ceil(sp * dt / 7), 1, 5);
    const sdt = dt / steps;
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * sdt; b.y += b.vy * sdt;
      b.hitBrick = false;
      // walls
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); playSfx('wall'); }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); playSfx('wall'); }
      if (b.y - b.r < WALL_TOP) { b.y = WALL_TOP + b.r; b.vy = Math.abs(b.vy); playSfx('wall'); }
      // paddle
      const p = Game.paddle;
      if (b.vy > 0 && b.y + b.r >= p.y - p.h / 2 && b.y - b.r <= p.y + p.h / 2 + 6 &&
          Math.abs(b.x - p.x) <= p.w / 2 + b.r) {
        if (Game.paddle.catchT > 0) {
          b.serve = true; b.vx = 0; b.vy = 0; b.hist.length = 0;
          playSfx('catch');
          continue;
        }
        const t = clamp((b.x - p.x) / (p.w / 2), -1, 1);
        const ang = t * 1.2 - Math.PI / 2;
        b.vx = Math.cos(ang) * target;
        b.vy = Math.sin(ang) * target;
        b.y = p.y - p.h / 2 - b.r;
        p.squash = 1; p.flash = 0.4;
        if (Game.mode === 'ARKANOID' || Game.mode === 'REMIX') Game.ramp = Math.min(Game.ramp + 0.008, 0.12);
        Game.comboT = 3;
        playSfx('bounce');
        if (b.fire) Particles.spark(b.x, b.y, '#ff9a3d', 3);
        bossBelch(b.x);
      }
      // bricks
      if (!b.hitBrick) {
        const gx = Math.floor((b.x - BX0) / PITCH_X), gy = Math.floor((b.y - BY0) / PITCH_Y);
        if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
          const bri = Game.grid[gy][gx];
          if (bri && !bri.dead) {
            const overlapX = (bri.w / 2 + b.r) - Math.abs(b.x - (bri.x + bri.w / 2));
            const overlapY = (bri.h / 2 + b.r) - Math.abs(b.y - (bri.y + bri.h / 2));
            if (overlapX > 0 && overlapY > 0) {
              if (b.fire) {
                hitBrick(b, bri);
              } else if (overlapX < overlapY) {
                b.vx = b.x < bri.x + bri.w / 2 ? -Math.abs(b.vx) : Math.abs(b.vx);
                hitBrick(b, bri);
              } else {
                b.vy = b.y < bri.y + bri.h / 2 ? -Math.abs(b.vy) : Math.abs(b.vy);
                hitBrick(b, bri);
              }
            }
          }
        }
      }
      // below screen
      if (b.y > H + 40) { b.dead = true; break; }
    }
  }
  Game.balls = Game.balls.filter(b => !b.dead);
  if (!Game.balls.length) {
    if (Game.clearing > 0 || Game.clearPending || Game.warpT > 0) Game.balls = [makeBall(true)];
    else loseLife();
  }
}
function updateCapsules(dt) {
  const p = Game.paddle;
  for (let i = Game.capsules.length - 1; i >= 0; i--) {
    const c = Game.capsules[i];
    c.y += c.vy * dt;
    if (c.y > H + 20) { Game.capsules.splice(i, 1); continue; }
    if (c.y + CAP_S / 2 >= p.y - p.h / 2 && c.y - CAP_S / 2 <= p.y + p.h / 2 &&
        Math.abs(c.x - p.x) <= p.w / 2 + CAP_S / 2) {
      Game.capsules.splice(i, 1);
      if (c.warp) { triggerWarp(c); continue; }
      applyPower(c.id);
      if (c.good) playSfx('cap'); else playSfx('badcap');
      Particles.ring(c.x, c.y, c.color, 30);
    }
  }
}
function updateLasers(dt) {
  const p = Game.paddle;
  if (Game.laserAmmo > 0) {
    Game.laserCd -= dt;
    if (Game.laserCd <= 0) {
      Game.laserCd = 0.42;
      Game.bolts.push({ x: p.x - p.w / 2 + 4, y: p.y - p.h / 2 });
      Game.bolts.push({ x: p.x + p.w / 2 - 4, y: p.y - p.h / 2 });
      Game.laserAmmo--;
      playSfx('laser');
    }
  }
  for (let i = Game.bolts.length - 1; i >= 0; i--) {
    const l = Game.bolts[i];
    l.y -= 560 * dt;
    if (l.y < WALL_TOP - 6) { Game.bolts.splice(i, 1); continue; }
    const gx = Math.floor((l.x - BX0) / PITCH_X), gy = Math.floor((l.y - BY0) / PITCH_Y);
    if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
      const b = Game.grid[gy][gx];
      if (b && !b.dead && b.type !== 'X' && Math.abs(l.x - (b.x + b.w / 2)) < b.w / 2 + 2 &&
          l.y >= b.y && l.y <= b.y + b.h) {
        if (b.type === '?' && !b.heart && b.hp === 1 && b.maxHp === 1) { b.type = pick(['C', 'B', 'G', 'Y', 'O', 'R']); b.pts = brickPts(b.type, b.gy); b.flash = 0.4; }
        else {
          b.hp--; b.flash = 0.25;
          if (b.hp <= 0) destroyBrick(b, 1);
          else Particles.spark(l.x, l.y, '#8fb6ff', 4);
        }
        playSfx('steel');
      }
    }
  }
}
function updateTimers(dt) {
  Game.belchCd = Math.max(0, Game.belchCd - dt);
  Game.fireT = Math.max(0, Game.fireT - dt);
  Game.x2T = Math.max(0, Game.x2T - dt);
  Game.slowT = Math.max(0, Game.slowT - dt);
  Game.fastT = Math.max(0, Game.fastT - dt);
  Game.megaT = Math.max(0, Game.megaT - dt);
  Game.disruptT = Math.max(0, Game.disruptT - dt);
  Game.comboT = Math.max(0, Game.comboT - dt);
  if (Game.comboT <= 0) { Game.combo = 0; Game.mult = 1; }
  if (Game.combo > 0 && Game.comboT < 0.5) { /* warn soon */ }
  const base = Game.baseSpeed;
  let spd = base;
  if (Game.slowT > 0) spd *= 0.66;
  else if (Game.fastT > 0) spd *= 1.32;
  if (Game.fireT > 0 || Game.megaT > 0) spd *= 1.1;
  /* In-level tension ramp (the Ricochet / DX-Ball feel): paddle hits creep the
     ball toward +12% within a level, then reset on a new level or a lost ball.
     CLASSIC stays constant-speed — authentic 1976 Breakout. */
  spd *= 1 + Game.ramp;
  Game.ballSpeed = lerp(Game.ballSpeed, spd, Math.min(1, dt * 3));
  for (const b of Game.balls) b.fire = Game.fireT > 0 || Game.megaT > 0;
}
function loseLife() {
  if (Demo.active) { startDemoFade(); return; } // attract demo ends instead of game over
  Game.lives--;
  syncMusicDuck(); // dropping to the last life pulls the music back
  Game.lostThisLevel = true;
  Game.combo = 0; Game.comboT = 0; Game.mult = 1; Game.ramp = 0;
  Game.balls = [makeBall(true)];
  if (Game.obj && Game.obj.type === 'perfect') Game.objDone = true;
  if (Game.lives < 0) {
    showGameOver();
    return;
  }
  playSfx('life');
  Hitstop.trigger(0.12); Flash.set(0.5, '#ff3d5e');
  Slowmo.set(0.5, 0.35);
  Texts.add(W / 2, H * 0.45, 'OUCH! BALL LOST!', '#ff3d5e', 22, { glow: true });
}

/* ---------- main gameplay update ---------- */
function updateGameplay(dt) {
  if (Game.screen === 'paused' || Game.screen === 'gameover' || Game.screen === 'victory') return;
  const gdt = dt;
  Game.time += gdt;
  Game.levelTime += gdt;
  if (Game.mode === 'CH' && CHALLENGES[Game.challengeIdx].timer > 0) {
    Game.challengeTimer -= gdt;
    if (Game.challengeTimer <= 0 && Game.clearing === 0 && !Game.clearPending) {
      Game.challengeTimer = 0;
      Game.lives = -1;
      showGameOver();
      return;
    }
  }
  if (Game.introT > 0) {
    Game.introT -= gdt;
    if (Game.introT <= 0.85 && Game.introPhase === 'ready') Game.introPhase = 'go';
    if (Game.introT <= 0) Game.introT = 0;
  }
  /* attract mode: auto-launch once READY ends, and re-serve after a catch,
     with a short beat so it reads as intentional */
  if (Demo.active && Game.introT <= 0) {
    Demo.relaunch -= gdt;
    for (const b of Game.balls) {
      if (b.serve) {
        if (Demo.relaunch <= 0) { Demo.relaunch = 0.35; launchBall(b); }
        break;
      }
    }
  }
  if (Game.warpT > 0) {
    /* portal freeze: the action holds while the warp flash plays out */
    Game.warpT -= gdt;
    if (Game.warpT <= 0) {
      Game.warpT = 0;
      Game.level = Game.warpNext;
      addScore(WARP_SKIP * 500, W / 2, H * 0.42, '#c77dff');
      startLevel();
    }
  } else {
    updatePaddle(gdt);
    updateBalls(gdt);
    updateCapsules(gdt);
    updateLasers(gdt);
    updateBeams(gdt);
    updateTimers(gdt);
  }
  if (Game.chainT > 0 && Game.warpT <= 0) {
    Game.chainT -= gdt;
    if (Game.chainT <= 0) {
      Game.chainT = 0;
      if (Game.clearPending) { Game.clearPending = false; beginClearCelebration(); }
    }
  }
  if (Game.clearing > 0 && Game.warpT <= 0) {
    Game.clearing -= gdt;
    if (Game.clearing <= 0) finishLevel();
  }
}

/* ---------- HUD ---------- */
function drawHUD() {
  if (Game.mode === 'CLASSIC') {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, HUD);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
    ctx.strokeRect(1, HUD - 1, W - 2, 1);
    drawText('SCORE ' + String(Game.score).padStart(6, '0'), 8, 14, 11, '#ffffff', { align: 'left' });

/* ---------- gameplay render ---------- */
/* DOH's enrage beams: a telegraphing column that glows, then an electric sweep
   that races down the board. Drawn in front of the paddle so being caught under
   the column is unmistakable. */
function drawBeams() {
  for (const bm of Game.beams) {
    const x0 = bm.x - bm.w / 2, x1 = bm.x + bm.w / 2, py = Game.paddle.y;
    if (bm.warn > 0) {
      const a = 0.5 + 0.5 * Math.sin(perfT * 16 + bm.seed);
      ctx.fillStyle = 'rgba(41,216,255,' + (0.05 + 0.08 * a).toFixed(3) + ')';
      ctx.fillRect(x0, bm.y0, bm.w, H - bm.y0);
      ctx.strokeStyle = 'rgba(120,235,255,' + (0.35 + 0.4 * a).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 9]);
      ctx.strokeRect(x0 + 1, bm.y0 + 1, bm.w - 2, H - bm.y0 - 2);
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffd23b';
      ctx.beginPath(); ctx.arc(bm.x, bm.y0 + 12, 5, 0, TAU); ctx.fill();
      /* paddle-row danger line: a solid glowing bar at the exact row the beam
         will cross — always visible, pulsing faster as the beam is about to
         fire so the dodge moment reads at a glance */
      const wl = bm.warn / (bm.warnT || 0.5);
      const fa = 0.62 + 0.38 * Math.abs(Math.sin(perfT * (8 + (1 - wl) * 26) + bm.seed * 3));
      ctx.shadowColor = 'rgba(120,235,255,0.9)'; ctx.shadowBlur = 9;
      ctx.fillStyle = 'rgba(120,235,255,' + fa.toFixed(3) + ')';
      ctx.fillRect(x0 - 3, py - 3, bm.w + 6, 6);
      ctx.fillStyle = 'rgba(230,254,255,' + fa.toFixed(3) + ')';
      ctx.fillRect(bm.x - 2, py - 5, 4, 10);
      ctx.shadowBlur = 0;
    } else {
      const a = clamp((bm.y - bm.y0) / 240, 0, 1);
      const grad = ctx.createLinearGradient(0, bm.y0, 0, bm.y);
      grad.addColorStop(0, 'rgba(41,216,255,0)');
      grad.addColorStop(1, 'rgba(120,235,255,' + (0.16 + 0.3 * a).toFixed(3) + ')');
      ctx.fillStyle = grad;
      ctx.fillRect(x0, bm.y0, bm.w, bm.y - bm.y0);
      ctx.fillStyle = 'rgba(200,250,255,0.95)';
      ctx.fillRect(bm.x - 3, bm.y - 22, 6, 22);
      ctx.strokeStyle = 'rgba(190,250,255,0.95)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x0, bm.y); ctx.lineTo(x1, bm.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(180,245,255,' + (0.25 + 0.25 * Math.sin(perfT * 40 + bm.seed)).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) {
        const yy = bm.y0 + (bm.y - bm.y0) * (i / 6);
        const xx = bm.x + Math.sin(perfT * 60 + bm.seed + i * 2.2) * (i % 2 ? 8 : -8);
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
      /* as the leading edge closes on the paddle, the row line flashes hard —
         the exact dodge moment at a glance */
      const d = py - bm.y;
      if (d > -14 && d < 130) {
        const close = 1 - clamp(d / 130, 0, 1);
        const fa2 = 0.5 + 0.5 * clamp(0.35 + close * 0.65, 0, 1) * Math.abs(Math.sin(perfT * 30 + bm.seed));
        ctx.shadowColor = 'rgba(120,235,255,0.9)'; ctx.shadowBlur = 9;
        ctx.fillStyle = 'rgba(120,235,255,' + fa2.toFixed(3) + ')';
        ctx.fillRect(x0 - 3, py - 3, bm.w + 6, 6);
        ctx.fillStyle = 'rgba(230,254,255,' + fa2.toFixed(3) + ')';
        ctx.fillRect(bm.x - 2, py - 5, 4, 10);
        ctx.shadowBlur = 0;
      }
    }
  }
}
function drawGameplay() {
  if (Game.mode === 'CLASSIC') {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
    ctx.strokeRect(2, WALL_TOP - 2, W - 4, H - WALL_TOP - 2);
  } else {
    Bg.draw(ctx, perfT);
  }
  for (const b of Game.bricks) if (!b.dead) drawBrick(b);
  for (const c of Game.capsules) drawCapsule(c);
  for (const l of Game.bolts) drawLaser(l);
  drawPaddle();
  for (const b of Game.balls) drawBall(b);
  drawBeams();
  drawCapPreview();
  Particles.draw(ctx);
  Texts.draw(ctx);
  drawHUD();
  // intro banner
  if (Game.introT > 0) {
    const a = Game.introT > 1.3 ? (1.7 - Game.introT) / 0.4 : clamp(Game.introT / 0.5, 0, 1);
    ctx.fillStyle = 'rgba(3,5,14,' + a * 0.55 + ')';
    ctx.fillRect(0, 0, W, H);
    const txt = Game.introPhase === 'ready' ? 'READY' : 'GO!';
    const scale = Game.introPhase === 'go' ? 1 + (1 - clamp(Game.introT / 0.85, 0, 1)) * 0.5 : 1;
    ctx.save(); ctx.translate(W / 2, H * 0.42); ctx.scale(scale, scale);
    drawText(txt, 0, 0, 54, Game.introPhase === 'go' ? '#3dff8f' : '#29d8ff', { glow: 20 });
    ctx.restore();
    if (Game.introPhase === 'ready') {
      if (Game.mode === 'ARKANOID' && Game.level === ARKANOID_MAPS.length) {
        drawText('DOH — THE BOSS!', W / 2, H * 0.42 + 60, 17, '#ff3d5e', { glow: 16 });
        drawText('AIM FOR THE MYSTERY WEAK POINTS!', W / 2, H * 0.42 + 90, 10, '#ffd23b', { glow: 8 });
        drawText('CORES LEFT STANDING = BONUS POINTS', W / 2, H * 0.42 + 112, 10, '#3dff8f', { glow: 8 });
      } else {
        drawText('LEVEL ' + Game.level, W / 2, H * 0.42 + 60, 15, '#ffffff', { glow: 10 });
        if (Game.obj && !Game.objDone) drawText(Game.obj.txt, W / 2, H * 0.42 + 90, 11, '#ffd23b', { glow: 8 });
      }
    }
  }
  // WARP portal: swirling ring + banner while the warp plays out
  if (Game.warpT > 0) {
    const wt = 1 - Game.warpT / WARP_TIME;
    const wcx = Game.paddle.x, wcy = Game.paddle.y - 46;
    ctx.save();
    ctx.translate(wcx, wcy);
    ctx.rotate(perfT * 3 + wt * 6);
    ctx.strokeStyle = 'rgba(199,125,255,' + (0.5 + 0.3 * Math.sin(perfT * 9)) + ')';
    ctx.lineWidth = 3;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.arc(0, 0, 20 + k * 11 + Math.sin(perfT * 6 + k) * 2, 0, TAU); ctx.stroke();
    }
    ctx.beginPath();
    for (let i = 0; i <= 26; i++) {
      const aa = i / 26 * Math.PI * 2;
      const r2 = 9 + aa * 1.5;
      const px = Math.cos(aa) * r2, py = Math.sin(aa) * r2;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(W / 2, H * 0.4); ctx.scale(1 + wt * 0.25, 1 + wt * 0.25);
    drawText('WARP AHEAD!', 0, 0, 40, '#c77dff', { glow: 26 });
    ctx.restore();
    drawText('SKIPPING ' + WARP_SKIP + ' LEVELS', W / 2, H * 0.4 + 52, 12, '#ffffff', { glow: 8 });
  }
  // level clear banner
  if (Game.clearing > 0) {
    const a = clamp(Game.clearing / 0.4, 0, 1);
    const isBoss = Game.mode === 'ARKANOID' && Game.level === ARKANOID_MAPS.length;
    ctx.save(); ctx.translate(W / 2, H * 0.42); ctx.scale(1.15, 1.15);
    ctx.globalAlpha = a;
    drawText(isBoss ? 'BOSS DOWN!' : 'LEVEL DOWN!', 0, 0, 40, isBoss ? '#ff3d5e' : '#3dff8f', { glow: isBoss ? 30 : 24 });
    /* boss payout: a quick count-up tally of the cores-left-standing bonus */
    if (isBoss && Game.bossBonus > 0) {
      const p = clamp(1 - Game.clearing / 1.1, 0, 1);
      const shown = Math.round(Game.bossBonus * (1 - Math.pow(1 - p, 3)));
      drawText('CORE BONUS', 0, 46, 13, '#ffd23b', { glow: 10 });
      drawText('+' + shown.toLocaleString('en-US'), 0, 70, 24, '#3dff8f', { glow: 14 });
      drawText(Game.bossCoresLeft + ' CORES LEFT STANDING × ' + BOSS_CORE_BONUS, 0, 94, 10, '#ffffff', { glow: 6 });
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
  // red danger edge on last life
  if (Game.lives === 0 && Game.screen === 'playing') {
    const a = 0.16 + 0.1 * Math.sin(perfT * 6);
    const g = ctx.createLinearGradient(0, H - 90, 0, H);
    g.addColorStop(0, 'rgba(255,61,94,0)'); g.addColorStop(1, 'rgba(255,61,94,' + a + ')');
    ctx.fillStyle = g; ctx.fillRect(0, H - 90, W, 90);
  }
  // flash + CRT
  if (Flash.v > 0) { ctx.fillStyle = Flash.color; ctx.globalAlpha = Flash.v; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (crtOn()) CRT.draw(ctx, perfT);
}
