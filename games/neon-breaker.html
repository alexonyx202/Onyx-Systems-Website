  drawText('ALL 13 COLLECTED - HOW-TO NOTES UNLOCKED!', cx, cy + 4, 10, '#fff2b0', { glow: 8 });

  const N = CAPSULE_INFO.length, size = 24, gap = 34;

  const off = ((TOTAL - CheatReveal.t) * 64) % span;

/* ---------- input dispatch ---------- */
let musicStarted = false;
/* Quick-flip one per-mode setting for the highlighted mode row (P/K/A keys).
   `explain` appends a one-line what-it-does to the ON toast, so e.g. PARTY
   tells players what it actually is the moment they flip it. */
function flipMode(key, label, cols, sfxOn, explain) {
  const m = MODE_INFO[Menu.sel].id;
  OPTS[key][m] = !OPTS[key][m];
  const on = OPTS[key][m];
  saveOpts();
  playSfx(on ? sfxOn : 'uiBack');
  menuMsg = { text: m + ': ' + label + ' ' + (on ? 'ON!' : 'OFF') + (on && explain ? ' — ' + explain : ''), col: on ? cols.on : cols.off, until: perfT + 1.6 };
}
/* Reset a highlighted mode's three quick toggles to defaults: PARTY off, KEYS on, PAUSE on.
   Triggered by HOLD P + K/A on the keyboard (Y + X/B on the pad). */
function resetModeDefaults() {
  const m = MODE_INFO[Menu.sel].id;
  OPTS.feast[m] = false; OPTS.keys[m] = true; OPTS.autopause[m] = true;
  saveOpts();
  playSfx('uiSel');
  menuMsg = { text: m + ': DEFAULTS SET!', col: '#3dff8f', until: perfT + 1.6 };
}
/* Reset a highlighted mode's CONTROLS — keyboard + pad binds and the layout
   preset — back to stock, the counterpart to the CUSTOM tag. R on the keyboard,
   RB on the pad. Only offered when the mode actually carries custom controls. */
function resetModeControls() {
  const m = MODE_INFO[Menu.sel].id;
  resetBinds(m); // restores BINDS[m] + PADB[m], saves + refreshes the hint
  OPTS.layout[m] = 'CLASSIC';
  saveOpts();
  menuMsg = { text: m + ': CONTROLS RESET!', col: '#3dff8f', until: perfT + 1.6 };
}
/* Screen-level dispatch. `acts` is the list of actions the pressed key maps to
   (a shared key like ESC can be pause AND back); `fromPad` marks pad input so
   the pad's START confirms in menus while the keyboard's ESC still backs out. */
function handleAction(acts, code, rep, fromPad) {
  const has = n => acts.includes(n);
  switch (Game.screen) {
    case 'title':
      if (has('confirm') || has('launch') || (fromPad && has('pause'))) { playSfx('uiSel'); startModeSelect(); }
      else if (code === 'KeyC') { playSfx('uiSel'); openControls('title'); }
      break;
    case 'modeselect':
      if (code === 'ArrowUp') { Menu.move(-1); if (Menu.sel <= 2) Game.selMode = Menu.sel; }
      else if (code === 'ArrowDown') { Menu.move(1); if (Menu.sel <= 2) Game.selMode = Menu.sel; }
      else if (code === 'ArrowLeft' || code === 'ArrowRight') {
        if (Menu.sel <= 2) { Game.diff = clamp(Game.diff + (code === 'ArrowRight' ? 1 : -1), 0, 3); playSfx('uiMove'); }
      }
      else if ((code === 'KeyK' || code === 'KeyA') && Menu.sel <= 2 && keys.KeyP && !rep) resetModeDefaults();
      else if (code === 'KeyP' && Menu.sel <= 2 && !rep) flipMode('feast', 'PARTY', { on: '#ffd23b', off: '#8fb6ff' }, 'cap', 'WILD DROPS');
      else if (code === 'KeyK' && Menu.sel <= 2 && !rep) flipMode('keys', 'KEYS', { on: '#3dff8f', off: '#8fb6ff' }, 'uiSel');
      else if (code === 'KeyA' && Menu.sel <= 2 && !rep) flipMode('autopause', 'AUTO-PAUSE', { on: '#29d8ff', off: '#8fb6ff' }, 'uiSel');
      else if (code === 'PadReset' && Menu.sel <= 2) resetModeDefaults();
      else if (code === 'KeyR' && Menu.sel <= 2 && !rep && modeCustom(MODE_INFO[Menu.sel].id)) resetModeControls();
      else if (code === 'KeyS' && Menu.sel === 1 && !rep) openStages();
      else if (has('confirm') || (fromPad && has('pause'))) Menu.enter();
      else if (has('back') || has('pause')) setScreen('title');
      break;
    case 'stages':
      if (code === 'ArrowUp') stageMove(0, -1);
      else if (code === 'ArrowDown') stageMove(0, 1);
      else if (code === 'ArrowLeft') stageMove(-1, 0);
      else if (code === 'ArrowRight') stageMove(1, 0);
      else if (has('confirm') || has('launch') || (fromPad && has('pause'))) playStage(StageSel.cursor + 1);
      else if (has('back') || has('pause')) setScreen('modeselect');
      break;
    case 'challenges': case 'scoremenu':
      if (code === 'ArrowUp') Menu.move(-1);
      else if (code === 'ArrowDown') Menu.move(1);
      else if (code === 'ArrowLeft' || code === 'ArrowRight' || has('confirm') || (fromPad && has('pause'))) Menu.enter();
      else if (has('back') || has('pause')) setScreen('modeselect');
      break;
    case 'options':
      if (code === 'ArrowUp') Menu.move(-1);
      else if (code === 'ArrowDown') Menu.move(1);
      else if (code === 'ArrowLeft' || code === 'ArrowRight') {
        // switch the mode tab — every per-mode row refreshes to the new mode
        optTab = (optTab + (code === 'ArrowRight' ? 1 : -1) + MODE_META.length) % MODE_META.length;
        Menu.items.forEach(i => { if (i && i.refresh) i.refresh(); });
        playSfx('uiMove');
      }
      else if (code === 'KeyR') {
        const it = Menu.items[Menu.sel];
        if (it && it.resetAll) { it.resetAll(); saveOpts(); playSfx('uiBack'); } // zero every mode for this row
      }
      else if (code === 'KeyX' && !has('confirm') && !has('back')) clearModeCustom(); // wipe the tab's mode
      else if (has('confirm') || (fromPad && has('pause'))) Menu.enter();
      else if (has('back') || has('pause')) setScreen('modeselect');
      break;
    case 'controls':
      if (Ctl.bind) return; // capture mode handled in onKeyDown / pollGamepad
      if (code === 'ArrowUp') Ctl.move(-1);
      else if (code === 'ArrowDown') Ctl.move(1);
      else if ((code === 'ArrowLeft' || code === 'ArrowRight') && !has('confirm') && !has('back')) {
        const cr = Ctl.rows[Ctl.sel];
        if (cr && cr.copy) {
          // on the COPY row, < > picks the source mode instead of the tab
          const opts = MODE_META.map(m => m.id).filter(id => id !== ctlMode());
          const i = opts.indexOf(cr.src);
          cr.src = opts[(i + (code === 'ArrowRight' ? 1 : -1) + opts.length) % opts.length];
        } else {
          // switch which mode's bindings you're editing (skip when the key is confirm/back)
          ctlTab = (ctlTab + (code === 'ArrowRight' ? 1 : -1) + MODE_META.length) % MODE_META.length;
          const cpy = Ctl.rows.find(x => x.copy);
          if (cpy) { const o2 = MODE_META.map(m => m.id).filter(id => id !== ctlMode()); if (o2.indexOf(cpy.src) < 0) cpy.src = o2[0]; }
        }
        playSfx('uiMove');
      }
      else if (code === 'KeyR') resetBinds(ctlMode());
      else if (has('confirm') || (fromPad && has('pause'))) Ctl.enter();
      else if (has('back') || has('pause')) setScreen(Ctl.from === 'title' ? 'title' : 'options');
      break;
    case 'scores':
      if (has('back') || has('pause') || has('confirm')) setScreen('scoremenu');
      break;
    case 'howto':
      if (has('back') || has('pause') || has('confirm') || has('launch')) setScreen('modeselect');
      break;
    case 'playing':
      if (has('pause') || has('back')) pauseGame();
      else if (has('launch') || has('confirm')) Game.balls.forEach(b => { if (b.serve) launchBall(b); });
      else if (code === 'KeyM') { OPTS.music[Game.mode] = !OPTS.music[Game.mode]; saveOpts(); refreshMusic(); }
      else if (code === 'KeyS') { OPTS.sound[Game.mode] = !OPTS.sound[Game.mode]; saveOpts(); if (OPTS.sound[Game.mode]) playSfx('uiSel'); }
      else if (code === 'KeyC') { OPTS.crt[Game.mode] = !OPTS.crt[Game.mode]; saveOpts(); playSfx('uiMove'); }
      break;
    case 'paused':
      if (has('pause') || has('back')) resumeGame();
      else if (code === 'KeyM') { OPTS.music[Game.mode] = !OPTS.music[Game.mode]; saveOpts(); refreshMusic(); }
      else if (code === 'KeyS') { OPTS.sound[Game.mode] = !OPTS.sound[Game.mode]; saveOpts(); if (OPTS.sound[Game.mode]) playSfx('uiSel'); }
      else if (code === 'KeyC') { OPTS.crt[Game.mode] = !OPTS.crt[Game.mode]; saveOpts(); playSfx('uiMove'); }
      else if (code === 'ArrowUp') Menu.move(-1);
      else if (code === 'ArrowDown') Menu.move(1);
      else if (has('confirm') || has('launch') || (fromPad && has('pause'))) Menu.enter();
      break;
    case 'gameover': case 'victory':
      if (code === 'ArrowUp') Menu.move(-1);
      else if (code === 'ArrowDown') Menu.move(1);
      else if (has('confirm') || has('launch') || (fromPad && has('pause'))) Menu.enter();
      break;
  }
}
function onKeyDown(code, rep) {
  if (!musicStarted) { musicStarted = true; refreshMusic(); }
  lastInputT = perfT;
  if (Demo.active) { if (Demo.phase === 'playing') startDemoFade(); return; }
  if (Ctl.bind) { captureKey(code, rep); return; }
  if (Init.active) { initialsKey(code); return; }
  handleAction(actionsFor(code), code, rep, false);
}
function onPointerDown() {
  if (!musicStarted) { musicStarted = true; refreshMusic(); }
  lastInputT = perfT;
  if (Demo.active) { if (Demo.phase === 'playing') startDemoFade(); return; }
  if (Init.active) return;
  switch (Game.screen) {
    case 'title': playSfx('uiSel'); startModeSelect(); break;
    case 'modeselect': {
      const d = toDesign(ptr);
      const dy = 150 + 7 * 46 + 50;
      if (d.y > dy - 20 && d.y < dy + 18 && d.x > DW / 2 - 190 && d.x < DW / 2 + 190) {
        if (d.x < DW / 2) { Game.diff = clamp(Game.diff - 1, 0, 3); playSfx('uiMove'); }
        else { Game.diff = clamp(Game.diff + 1, 0, 3); playSfx('uiMove'); }
        return;
      }
      if (Menu.sel === 1 && d.y > 596 && d.y < 656) { openStages(); return; } // stage map tap -> stage select
      Menu.hover(); Menu.enter();
      break;
    }
    case 'stages': {
      const d = toDesign(ptr);
      const c = stageHit(d.x, d.y);
      if (c >= 0) playStage(c + 1);
      break;
    }
    case 'challenges': case 'options': case 'scoremenu': case 'paused': case 'gameover': case 'victory':
      Menu.hover(); Menu.enter();
      break;
    case 'scores': setScreen('scoremenu'); break;
    case 'howto': setScreen('modeselect'); break;
    case 'playing':
      if (ptr.x > W - 48 && ptr.y < HUD) { pauseGame(); break; }
      Game.balls.forEach(b => { if (b.serve) launchBall(b); });
      break;
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  realDt = clamp((now - last) / 1000, 0.001, 0.05);
  last = now;
  perfT += realDt;
  pollGamepad();
  const dt = realDt * timeScale();
  Particles.update(dt);
  Texts.update(dt);
  Flash.update(realDt);
  /* attract mode: idle countdown on the title, play clock + exit while live */
  if (Game.screen === 'title' && !Demo.active) {
    if (perfT - lastInputT < 2) Demo.t = 0;
    else { Demo.t += realDt; if (Demo.t >= DEMO_IDLE) startDemo(); }
  } else if (Game.screen === 'demo' && Demo.phase === 'playing') {
    Demo.playT += realDt;
    if (Demo.playT >= DEMO_MAX) startDemoFade();
  }
  if (Game.screen === 'playing' || (Game.screen === 'demo' && Demo.phase === 'playing')) updateGameplay(dt);
  if (MENU_SCREENS.includes(Game.screen)) Menu.hover();
  if (Init.active) updateInitials(dt);
  if (AchToast.t > 0) AchToast.t -= realDt;
  if (CheatReveal.t > 0) CheatReveal.t -= realDt;
  if (++lastResizeCheck > 90) { lastResizeCheck = 0; if (!canvas.style.width || canvas.style.width === '0px') resize(); }
  ctx.save();
  switch (Game.screen) {
    case 'title': menuView(() => drawTitle()); break;
    case 'modeselect': menuView(() => drawModeSelect()); break;
    case 'stages': menuView(() => drawStages()); break;
    case 'challenges': menuView(() => drawChallenges()); break;
    case 'howto': menuView(() => drawHowTo()); break;
    case 'options': menuView(() => drawOptions()); break;
    case 'controls': menuView(() => drawControls()); break;
    case 'scoremenu': menuView(() => drawScoreMenu()); break;
    case 'scores': menuView(() => drawScores()); break;
    case 'playing': drawGameplay(); break;
    case 'demo': drawGameplay(); break;
    case 'paused': drawPaused(); break;
    case 'gameover': menuView(() => drawGameOver()); break;
    case 'victory': menuView(() => drawVictory()); break;
  }
  /* attract mode: black fade out of the demo, then the title returns */
  if (Game.screen === 'demo' && Demo.phase === 'fading') {
    Demo.fadeT += realDt;
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(Demo.fadeT / DEMO_FADE, 1).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    if (Demo.fadeT >= DEMO_FADE) endDemo();
  }
  ctx.restore();
  if (crtOn() && Game.screen !== 'playing') CRT.draw(ctx, perfT);
  drawAchToast();
  drawCheatReveal();
}

/* ---------- resize & init ---------- */
let lastResizeCheck = 0;
let builtW = 0, builtH = 0;
function resize(forcePortrait) {
  const prevPortrait = PORTRAIT;
  applyLayout(forcePortrait);
  const flipped = PORTRAIT !== prevPortrait;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (W !== builtW || H !== builtH) { Bg.build(); CRT.build(); builtW = W; builtH = H; }
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  if (!(s > 0)) return;
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  if (flipped && (Game.screen === 'playing' || Game.screen === 'paused')) startLevel();
}
function init() {
  const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (rm) { for (const k in OPTS.crt) OPTS.crt[k] = false; }
  resize();
  const his = [store.get('hi_CLASSIC', 0), store.get('hi_ARKANOID', 0), store.get('hi_REMIX', 0), store.get('hi_CH', 0)];
  for (let i = 0; i < 6; i++) { const b = store.get('best_ch' + i, null); if (b) his.push(b.score); }
  Game.hi = Math.max(0, ...his);
  Game.selMode = 0;
  refreshHint();
  setScreen('title');
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => resize());
window.addEventListener('load', () => resize());

/* ---------- debug / test API ---------- */
window.NB = {
  get state() { return { screen: Game.screen, score: Game.score, lives: Game.lives, level: Game.level, mode: Game.mode, combo: Game.combo, mult: Game.mult }; },
  screen: s => setScreen(s),
  start: m => { Game.mode = m; Game.challengeIdx = 0; startRun(); setScreen('playing'); },
  launch: () => Game.balls.forEach(b => { if (b.serve) launchBall(b); }),
  cheat: () => { Game.lives = 99; },
  clear: () => { for (const b of Game.bricks.slice()) if (!b.dead && b.type !== 'X') { b.hp = 0; destroyBrick(b, 1); } },
  ptr: (x, y, type) => {
    const r = canvas.getBoundingClientRect();
    window.dispatchEvent(new PointerEvent(type || 'pointerdown', {
      clientX: r.left + x * r.width / W, clientY: r.top + y * r.height / H, bubbles: true
    }));
  },
  key: c => onKeyDown(c),
  die: () => { Game.lives = 0; Game.balls = []; loseLife(); },
  cap: id => { const info = CAPSULE_INFO.find(c => c.id === id); if (info) Game.capsules.push({ x: Game.paddle.x, y: PADDLE_Y - 30, id, color: info.color, name: info.name, good: info.good, vy: 300, seed: randi(0, 999) }); },
  probe: () => ({ capsules: Game.capsules.length, bolts: Game.bolts.length, fireT: Game.fireT, megaT: Game.megaT, disruptT: Game.disruptT, slowT: Game.slowT, catchT: Game.paddle.catchT, laserAmmo: Game.laserAmmo, clearing: Game.clearing, chainT: Game.chainT, pending: Game.clearPending, lives: Game.lives, level: Game.level, mode: Game.mode, top: Game.classicTopRow, rows: Game.classicRows, bricks: Game.bricks.length, score: Game.score, mult: Game.mult, combo: Game.combo, balls: Game.balls.length }),
  portrait: p => { resize(!!p); return { W, H, portrait: PORTRAIT }; },
  layout: () => ({ W, H, portrait: PORTRAIT, menuS: MENU_S, paddleY: PADDLE_Y, ballR: BALL_R }),
  pad: (buttons, axes) => {
    const b = new Array(16).fill(null);
    (buttons || []).forEach(i => { b[i] = { pressed: true }; });
    fakePad = { buttons: b, axes: axes || [0, 0] };
    pollGamepad();
    return { padDir, screen: Game.screen };
  }
};
init();
</script>
