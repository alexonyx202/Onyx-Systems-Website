<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SKYDRIFT — Retro Arcade Shooter</title>
<style>
/* === Mobile landscape rotate prompt (portrait touch only) === */
#rotate-prompt{display:none;position:fixed;inset:0;z-index:99999;background:#05050f;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;font-family:'Courier New',monospace}
#rotate-prompt .icon{font-size:60px;animation:rot-hint 2s ease-in-out infinite}
#rotate-prompt .msg{font-size:16px;letter-spacing:1px;max-width:280px;line-height:1.5}
#rotate-prompt .sub{font-size:12px;color:#9fc2e0}
@keyframes rot-hint{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (hover:none) and (pointer:coarse){
  #rotate-prompt{display:flex!important}
  body>*:not(#rotate-prompt){visibility:hidden}
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05050f}
body{font-family:'Courier New',monospace;user-select:none;color:#fff}
canvas{display:block;cursor:crosshair;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:6px 16px;display:flex;justify-content:space-between;color:#fff;font-size:13px;z-index:10;pointer-events:none;text-shadow:0 0 6px currentColor,1px 1px 2px #000}
#hud span{margin:0 8px}
.hi{color:#ffcc44}.hw{color:#44ffaa}.hl{color:#ff5577}.hb{color:#55aaff}.hp{color:#ff88ff}

/* CRT scanline + vignette overlay */
#crt{position:fixed;inset:0;pointer-events:none;z-index:90;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0px,rgba(0,0,0,.22) 1px,transparent 2px,transparent 3px);}
#crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);mix-blend-mode:normal}

#overlay{position:fixed;inset:0;background:rgba(5,5,16,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center;padding:20px;overflow:auto}
#overlay.show{display:flex}
#overlay.title{background:rgba(5,5,16,.55)}
#overlay.over{background:rgba(5,5,16,.92)}
#overlay h1{font-size:min(11vw,72px);letter-spacing:8px;margin-bottom:2px;line-height:1}
.tg{color:#ffcc44;text-shadow:3px 0 #ff2a6d,-3px 0 #05d9e8,0 0 30px rgba(255,200,60,.5)}
.tr{color:#ff3355;text-shadow:3px 0 #ff2a6d,-3px 0 #ff8800,0 0 30px rgba(255,50,50,.6)}
#overlay h2{font-size:13px;color:#55aaff;letter-spacing:5px;margin-bottom:16px;text-shadow:0 0 10px rgba(85,170,255,.5)}
.box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:14px 22px;margin:8px 0;max-width:480px;text-align:left;font-size:11px;line-height:2;color:#9fc2e0}
.box b{color:#ffcc44}
.k{display:inline-block;background:rgba(255,200,60,.15);padding:1px 7px;border-radius:3px;color:#ffcc44;font-weight:bold;font-size:10px}
.panels{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.hs{background:rgba(255,255,255,.04);border:1px solid rgba(255,200,60,.18);border-radius:8px;padding:12px 18px;margin:8px 0;min-width:240px}
.hs h3{color:#ffaa33;font-size:12px;letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 8px rgba(255,170,50,.5)}
.hsrow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.hsrow .rk{color:#55aaff;width:24px}.hsrow .sc{color:#ffcc44;font-weight:bold}.hsrow .wv{color:#88aacc;font-size:10px}.hsrow .dt{color:#556677;font-size:10px}
.hscur{background:rgba(255,200,60,.12);border-radius:3px;color:#fff!important}
.empty{color:#556688;font-style:italic;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 16px;margin:6px 0 14px;min-width:320px}
.st{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:8px 14px}
.sl{color:#556677;font-size:9px;text-transform:uppercase;letter-spacing:1px}
.sv{color:#ffcc44;font-size:20px;font-weight:bold}
.sg{color:#44ff88}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
button{padding:11px 30px;font-size:13px;font-family:'Courier New',monospace;border:none;border-radius:4px;font-weight:bold;cursor:pointer;letter-spacing:2px;transition:transform .1s}
button:active{transform:scale(.96)}
.bg{background:linear-gradient(180deg,#ffcc44,#ee8800);color:#1a0800;box-shadow:0 3px 0 #996600,0 4px 16px rgba(255,136,0,.35)}
.bn{background:linear-gradient(180deg,#5a7fb0,#335588);color:#eef;box-shadow:0 3px 0 #224466}
.blink{animation:bl 1s steps(2,start) infinite;color:#7CFC00;text-shadow:0 0 12px rgba(124,252,0,.6);letter-spacing:3px;font-size:14px;margin-top:6px}
@keyframes bl{50%{opacity:0}}
.newhi{color:#ffcc44;font-size:18px;font-weight:bold;letter-spacing:3px;margin-bottom:6px;text-shadow:0 0 18px rgba(255,200,60,.8);animation:bl 0.5s steps(2,start) infinite}
#msgs{position:fixed;left:50%;top:50px;transform:translateX(-50%);z-index:20;pointer-events:none;text-align:center}
.m{padding:3px 12px;font-size:13px;font-weight:bold;margin-bottom:4px;animation:mf 1.5s forwards;white-space:nowrap}
@keyframes mf{0%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.9) translateY(-10px)}}
.mw{color:#ff4444;text-shadow:0 0 8px #ff0000}.mb{color:#ffcc44;text-shadow:0 0 8px #ff8800}.mi{color:#55aaff;text-shadow:0 0 8px #0066ff}

/* ============ TOUCH CONTROLS (mobile only) ============ */
#touch{position:fixed;inset:0;z-index:80;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);display:none;box-shadow:inset 0 0 18px rgba(0,0,0,.4)}
#joyThumb{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,204,68,.45);border:2px solid #ffcc44;box-shadow:0 0 14px rgba(255,204,68,.6)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);color:#fff;font-family:'Courier New',monospace;font-weight:bold;letter-spacing:1px;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none}
#btnFire{width:88px;height:88px;right:22px;bottom:96px;background:rgba(255,90,90,.16);border-color:rgba(255,120,120,.5);color:#ffcc44;font-size:14px}
#btnBomb{width:62px;height:62px;right:120px;bottom:26px;background:rgba(85,170,255,.16);border-color:rgba(120,190,255,.5);color:#9fd0ff;font-size:12px}
#btnPause{width:46px;height:46px;right:14px;top:52px;font-size:13px;color:#ffcc44}
.tbtn:active{filter:brightness(1.4)}
</style>
</head>
<body>
<div id="rotate-prompt">
  <div class="icon">📱</div>
  <div class="msg">Rotate your phone to landscape to play</div>
  <div class="sub">↻ Turn your device for the full screen</div>
</div>
<canvas id="C"></canvas>
<div id="hud">
  <div><span class="hi" id="sc">000000</span></div>
  <div><span class="hw" id="wv">1</span></div>
  <div><span class="hl" id="lv">♥♥♥</span></div>
  <div><span class="hb" id="bm">★★</span></div>
  <div><span class="hp" id="pw">░░░░</span></div>
</div>
<div id="msgs"></div>
<div id="overlay" class="show title"></div>
<div id="crt"></div>
<div id="touch">
  <div id="joy"><div id="joyThumb"></div></div>
  <button id="btnFire" class="tbtn">FIRE</button>
  <button id="btnBomb" class="tbtn">BOMB</button>
  <button id="btnPause" class="tbtn">II</button>
</div>
<script>
var C=document.getElementById('C'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

var GAME_TITLE='SKYDRIFT';

/* ============ AUDIO ============ */
var AC=null;
function initAudio(){if(!AC)try{AC=new(AudioContext||webkitAudioContext)();if(AC.resume)AC.resume();}catch(e){}}
function sfx(t){if(!AC)return;var n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);switch(t){case'shoot':o.type='square';o.frequency.setValueAtTime(1400,n);o.frequency.exponentialRampToValueAtTime(600,n+.05);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.07);o.start(n);o.stop(n+.07);break;case'hit':o.type='square';o.frequency.setValueAtTime(260,n);o.frequency.exponentialRampToValueAtTime(100,n+.08);g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.001,n+.1);o.start(n);o.stop(n+.1);break;case'boom':o.type='sawtooth';o.frequency.setValueAtTime(140,n);o.frequency.exponentialRampToValueAtTime(25,n+.35);g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.001,n+.4);o.start(n);o.stop(n+.4);break;case'pow':o.type='sine';o.frequency.setValueAtTime(660,n);o.frequency.exponentialRampToValueAtTime(1320,n+.12);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.18);o.start(n);o.stop(n+.18);break;case'dmg':o.type='sawtooth';o.frequency.setValueAtTime(350,n);o.frequency.exponentialRampToValueAtTime(40,n+.25);g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.start(n);o.stop(n+.3);break;case'bomb':o.type='sawtooth';o.frequency.setValueAtTime(180,n);o.frequency.exponentialRampToValueAtTime(18,n+.55);g.gain.setValueAtTime(.22,n);g.gain.exponentialRampToValueAtTime(.001,n+.6);o.start(n);o.stop(n+.6);break;case'wave':o.type='sine';o.frequency.setValueAtTime(440,n);o.frequency.linearRampToValueAtTime(880,n+.25);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.start(n);o.stop(n+.3);break;case'resp':o.type='sine';o.frequency.setValueAtTime(220,n);o.frequency.linearRampToValueAtTime(880,n+.4);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.45);o.start(n);o.stop(n+.45);break;
case'jingle':var mel=[523,659,784,1047];for(var i=0;i<4;i++){var oo=AC.createOscillator(),gg=AC.createGain();oo.connect(gg);gg.connect(AC.destination);oo.type='triangle';oo.frequency.setValueAtTime(mel[i],n+i*.11);gg.gain.setValueAtTime(.0001,n+i*.11);gg.gain.exponentialRampToValueAtTime(.08,n+i*.11+.01);gg.gain.exponentialRampToValueAtTime(.001,n+i*.11+.12);oo.start(n+i*.11);oo.stop(n+i*.11+.13);}break;
case'over':var mel2=[784,659,523,392];for(var i=0;i<4;i++){var oo=AC.createOscillator(),gg=AC.createGain();oo.connect(gg);gg.connect(AC.destination);oo.type='sawtooth';oo.frequency.setValueAtTime(mel2[i],n+i*.16);gg.gain.setValueAtTime(.0001,n+i*.16);gg.gain.exponentialRampToValueAtTime(.09,n+i*.16+.01);gg.gain.exponentialRampToValueAtTime(.001,n+i*.16+.2);oo.start(n+i*.16);oo.stop(n+i*.16+.21);}break;}}

/* ============ HIGH SCORES ============ */
var HS_KEY='skyDriftHS';
function loadHS(){try{var a=JSON.parse(localStorage.getItem(HS_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}}
function saveHS(a){try{localStorage.setItem(HS_KEY,JSON.stringify(a.slice(0,5)));}catch(e){}}
function recordScore(score,wave,lives){
  var list=loadHS();var date=new Date().toISOString().slice(0,10);
  var entry={score:score,wave:wave,date:date};
  list.push(entry);list.sort(function(a,b){return b.score-a.score;});
  list=list.slice(0,5);
  var rank=list.indexOf(entry);var qualifies=rank>=0&&list.length>0&&list[0].score===score&&(rank===0||true);
  // qualifies only if it made the top 5
  qualifies = rank>=0;
  saveHS(list);
  return {qualifies:qualifies,rank:rank<0?-1:rank,top:list};
}

/* ============ GAME ============ */
var G={
  state:'TITLE',score:0,lives:3,wave:1,power:0,bombs:2,shield:0,inv:0,combo:1,comboT:0,maxCombo:1,shake:0,flash:0,fc:'#fff',
  px:0,py:0,pvx:0,pvy:0,pDead:false,pRespT:0,pVis:true,
  waveT:0,wavePause:0,eSpawned:0,
  enemies:[],bullets:[],eBullets:[],particles:[],powerups:[],stars:[],trail:[],shockwaves:[],banner:null,neb:0,
  keys:{},lastShot:0,
  _hs:-1,_hl:-1,_hw:-1,_hb:-1,_hp:-1,

  init:function(){
    this.stars=[];
    for(var i=0;i<220;i++){
      var layer=Math.random()<.25?2:Math.random()<.5?1:0; // 0 far,1 mid,2 near
      this.stars.push({x:Math.random()*W,y:Math.random()*H,s:layer===2?2:layer===1?1.4:1,sp:.15+layer*.55+Math.random()*.2,layer:layer});
    }
  },

  start:function(level){
    initAudio();if(level)this.wave=level;
    this.state='PLAY';this.score=0;this.lives=3;this.wave=this.wave||1;this.power=0;this.bombs=2;
    this.shield=0;this.inv=2000;this.combo=1;this.comboT=0;this.maxCombo=1;this.shake=0;this.flash=0;
    this.px=120;this.py=H/2;this.pvx=0;this.pvy=0;this.pDead=false;this.pRespT=0;this.pVis=true;
    this.enemies=[];this.bullets=[];this.eBullets=[];this.particles=[];this.powerups=[];this.trail=[];this.shockwaves=[];
    this.waveT=0;this.wavePause=0;this.eSpawned=0;this.neb=0;
    this._hs=-1;this._hl=-1;this._hw=-1;this._hb=-1;this._hp=-1;
    this.banner={text:'GET READY',t:1400,sub:'WAVE 1'};
    sfx('jingle');
    this.hideOverlay();this.init();this.hud();
  },

  respawn:function(){
    this.pDead=true;this.pRespT=1500;this.inv=2500;this.pVis=false;
    sfx('dmg');this.shake=12;this.flash=.4;this.fc='#ff3333';
    this.boom(this.px,this.py,'#4488ff',35,6);this.boom(this.px,this.py,'#ffcc44',20,4);this.boom(this.px,this.py,'#fff',10,3);
    if(this.power>0)this.power--;this.combo=1;this.trail=[];
  },

  end:function(){
    this.state='OVER';
    var rr=recordScore(this.score,this.wave,this.lives);
    this.showOver(rr);
  },

  toTitle:function(){this.state='TITLE';this.showTitle();},

  showTitle:function(){
    for(var k in this.keys)this.keys[k]=false;
    var hs=loadHS();var rows='';
    if(hs.length===0){rows='<div class="empty">— NO SCORES YET —</div>';}
    else{for(var i=0;i<hs.length;i++){rows+='<div class="hsrow"><span class="rk">'+(i+1)+'.</span><span class="sc">'+String(hs[i].score).padStart(6,'0')+'</span><span class="wv">W'+hs[i].wave+'</span><span class="dt">'+hs[i].date+'</span></div>';}}
    var o=document.getElementById('overlay');o.className='show title';
    o.innerHTML='<h1 class="tg">'+GAME_TITLE+'</h1><h2>◆ RETRO ARCADE SHOOTER ◆</h2>'+
      '<div class="panels">'+
      '<div class="box"><b>⚡ CONTROLS</b><br>'+
      '<span class="k">←→↑↓</span> or <span class="k">WASD</span> Move &nbsp; <span class="k">SPACE</span>/<span class="k">Z</span> Fire<br>'+
      '<span class="k">X</span> Bomb &nbsp; <span class="k">P</span> Pause &nbsp; <span class="k">ESC</span> Menu<br><br>'+
      '<b>🎯 MISSION</b><br>Destroy drones → collect power-ups → survive!<br>'+
      '<span style="color:#ff8844">●</span> Power &nbsp;<span style="color:#55aaff">●</span> Shield &nbsp;<span style="color:#ff5577">●</span> Bomb &nbsp;<span style="color:#ffcc44">●</span> Life</div>'+
      '<div class="hs"><h3>★ TOP SCORES ★</h3>'+rows+'</div>'+
      '</div>'+
      '<div class="btns"><button class="bg" onclick="G.start()">START GAME</button></div>'+
      '<div class="blink">PRESS ENTER OR CLICK TO START</div>';
  },

  showOver:function(rr){
    for(var k in this.keys)this.keys[k]=false;
    var hs=loadHS();var rows='';var curScore=this.score;
    for(var i=0;i<hs.length;i++){
      var isCur=(hs[i].score===curScore&&i===rr.rank);
      rows+='<div class="hsrow'+(isCur?' hscur':'')+'"><span class="rk">'+(i+1)+'.</span><span class="sc">'+String(hs[i].score).padStart(6,'0')+'</span><span class="wv">W'+hs[i].wave+'</span><span class="dt">'+hs[i].date+'</span></div>';
    }
    var newhi = rr.qualifies ? '<div class="newhi">★ NEW HIGH SCORE! ★</div>' : '';
    var o=document.getElementById('overlay');o.className='show over';
    o.innerHTML='<h1 class="tr">GAME OVER</h1>'+
      newhi+
      '<div class="stats"><div class="st"><div class="sl">Score</div><div class="sv">'+this.score.toLocaleString()+'</div></div>'+
      '<div class="st"><div class="sl">Wave</div><div class="sv sg">'+this.wave+'</div></div>'+
      '<div class="st"><div class="sl">Max Combo</div><div class="sv">x'+this.maxCombo+'</div></div></div>'+
      '<div class="hs"><h3>★ TOP SCORES ★</h3>'+rows+'</div>'+
      '<div class="btns"><button class="bg" onclick="G.start()">PLAY AGAIN</button><button class="bn" onclick="G.toTitle()">MENU</button></div>';
    try{sfx('over');}catch(e){}
  },

  hideOverlay:function(){document.getElementById('overlay').className='';},

  msg:function(t,c){var d=document.createElement('div');d.className='m m'+c;d.textContent=t;document.getElementById('msgs').appendChild(d);setTimeout(function(){if(d&&d.remove)d.remove();},1500);},

  hud:function(){
    if(this.score!==this._hs){this._hs=this.score;document.getElementById('sc').textContent=String(this.score).padStart(6,'0');}
    if(this.lives!==this._hl){this._hl=this.lives;var s='';for(var i=0;i<this.lives;i++)s+='♥';document.getElementById('lv').textContent=s||'—';}
    if(this.wave!==this._hw){this._hw=this.wave;document.getElementById('wv').textContent=this.wave;}
    if(this.bombs!==this._hb){this._hb=this.bombs;var s='';for(var i=0;i<this.bombs;i++)s+='★';document.getElementById('bm').textContent=s||'—';}
    if(this.power!==this._hp){this._hp=this.power;var s='';for(var i=0;i<4;i++)s+=(i<this.power?'█':'░');document.getElementById('pw').textContent=s;}
  },

  boom:function(x,y,c,n,sp){
    for(var i=0;i<n;i++){var a=Math.random()*6.28,ss=sp*(.3+Math.random()*.7);this.particles.push({x:x,y:y,vx:Math.cos(a)*ss,vy:Math.sin(a)*ss,life:1,decay:.012+Math.random()*.025,size:2+Math.random()*4,color:c});}
    this.shockwaves.push({x:x,y:y,r:4,max:(sp*8)+18,life:1,color:c});
  },

  spawnE:function(){
    var types=[{hp:1,spd:3,sc:100,sz:22,c:'#ff6644',sh:'scout'},{hp:2,spd:2.2,sc:200,sz:28,c:'#ff4488',sh:'fighter'},{hp:3,spd:1.5,sc:300,sz:34,c:'#aa44ff',sh:'heavy'},{hp:1,spd:4,sc:250,sz:20,c:'#ffaa00',sh:'sniper'},{hp:2,spd:1.8,sc:280,sz:30,c:'#44ddff',sh:'bomber'},{hp:5,spd:1.4,sc:500,sz:40,c:'#ff44aa',sh:'elite'}];
    var mt=Math.min(types.length,1+Math.floor(this.wave/2));
    var t=types[Math.floor(Math.random()*mt)];
    var y=40+Math.random()*(H-80);var sm=1+this.wave*.06;
    this.enemies.push({x:W+t.sz+20,y:y,vx:-t.spd*sm,vy:0,hp:t.hp,mhp:t.hp,sc:t.sc,size:t.sz,c:t.c,sh:t.sh,ph:Math.random()*6.28,ps:.04+Math.random()*.04,mt:Math.random()>.4?'sine':'straight',st:800+Math.random()*2000,hf:0,eg:0});
    this.eSpawned++;
  },

  shoot:function(){
    if(this.pDead)return;var now=performance.now(),rate=this.power<2?110:80;
    if(now-this.lastShot<rate)return;this.lastShot=now;
    var sp=16,px=this.px,py=this.py;
    if(this.power===0){this.bullets.push({x:px+28,y:py,vx:sp,vy:0,d:1});}
    else if(this.power===1){this.bullets.push({x:px+28,y:py-3,vx:sp,vy:0,d:1});this.bullets.push({x:px+28,y:py+3,vx:sp,vy:0,d:1});}
    else if(this.power===2){this.bullets.push({x:px+28,y:py,vx:sp,vy:0,d:1});this.bullets.push({x:px+26,y:py-7,vx:sp,vy:-.8,d:1});this.bullets.push({x:px+26,y:py+7,vx:sp,vy:.8,d:1});}

    X.fillStyle='#fff';X.font='bold 12px Courier New';X.textAlign='center';X.textBaseline='middle';X.fillText(ls[p.type],0,1);
    X.restore();
  }
};

addEventListener('keydown',function(e){G.keys[e.key.toLowerCase()]=true;
  if(e.key==='Enter'){if(G.state==='TITLE'||G.state==='OVER'){G.start();}}
  if(e.key==='p'||e.key==='P'){if(G.state==='PLAY')G.state='PAUSE';else if(G.state==='PAUSE')G.state='PLAY';}
  if(e.key==='Escape'){if(G.state==='PLAY'||G.state==='PAUSE'){G.toTitle();}}
  if(e.key==='x'||e.key==='X'){if(G.state==='PLAY')G.bomb();}
  if(e.key===' ')e.preventDefault();
});
addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false;});
addEventListener('click',function(){if(G.state==='TITLE'||G.state==='OVER'){G.start();}});

/* ============ TOUCH CONTROLS (mobile only) ============ */
(function(){
  var isTouch = ('ontouchstart' in window) || (typeof navigator!=='undefined' && navigator.maxTouchPoints>0);
  if(!isTouch) return;                       // desktop: do nothing, game unchanged
  document.body.classList.add('touch');
  var joy=document.getElementById('joy'), thumb=document.getElementById('joyThumb');
  var joyId=null, jx=0, jy=0, MAX=33, DZ=14;
  function setMove(dx,dy){
    G.keys['arrowleft']=dx<-DZ; G.keys['arrowright']=dx>DZ;
    G.keys['arrowup']=dy<-DZ; G.keys['arrowdown']=dy>DZ;
  }
  function clearMove(){ G.keys['arrowleft']=G.keys['arrowright']=G.keys['arrowup']=G.keys['arrowdown']=false; }
  function joyStart(t){ joyId=t.identifier; jx=t.clientX; jy=t.clientY; joy.style.left=(jx-60)+'px'; joy.style.top=(jy-60)+'px'; joy.style.display='block'; thumb.style.transform='translate(0,0)'; }
  function joyMove(t){ var dx=t.clientX-jx, dy=t.clientY-jy, d=Math.hypot(dx,dy); if(d>MAX){ dx=dx/d*MAX; dy=dy/d*MAX; } thumb.style.transform='translate('+dx+'px,'+dy+'px)'; setMove(dx,dy); }
  function joyEnd(t){ if(t.identifier!==joyId)return; joyId=null; joy.style.display='none'; clearMove(); }
  document.addEventListener('touchstart',function(e){
    if(G.state!=='PLAY')return;
    for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; if(joyId===null && t.clientX < window.innerWidth*0.5){ joyStart(t); } }
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(joyId===null)return; e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; if(t.identifier===joyId){ joyMove(t); } }
  },{passive:false});
  function onEnd(e){ for(var i=0;i<e.changedTouches.length;i++){ joyEnd(e.changedTouches[i]); } }
  document.addEventListener('touchend',onEnd);
  document.addEventListener('touchcancel',onEnd);
  function hold(id,on,off){ var el=document.getElementById(id);
    el.addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); on(); },{passive:false});
    el.addEventListener('touchend',function(e){ e.preventDefault(); e.stopPropagation(); off(); },{passive:false});
    el.addEventListener('touchcancel',function(e){ off(); });
  }
  hold('btnFire', function(){ G.keys[' ']=true; }, function(){ G.keys[' ']=false; });
  hold('btnBomb', function(){ if(G.state==='PLAY') G.bomb(); }, function(){});
  hold('btnPause', function(){ if(G.state==='PLAY') G.state='PAUSE'; else if(G.state==='PAUSE') G.state='PLAY'; }, function(){});
})();

G.init();G.showTitle();

var lastT=0;
function loop(t){var dt=Math.min(t-lastT,50);lastT=t;G.update(dt);G.render();if(document.body)document.body.classList.toggle('playing',G.state==='PLAY'||G.state==='PAUSE');requestAnimationFrame(loop);}
requestAnimationFrame(loop);
