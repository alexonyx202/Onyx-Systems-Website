  .arcade-hub .game-card .hp-title{font-family:var(--brand-font,Oswald,"Segoe UI",sans-serif);font-weight:700;font-size:16px;line-height:1.05;color:var(--copper-2);text-shadow:0 0 12px rgba(194,112,61,.55)}

<script>
function esc(s){return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function renderGames(list){
  var grid=document.getElementById('gameGrid');
  if(!list||!list.length){document.getElementById('empty').style.display='block';return;}
  grid.innerHTML=list.map(function(g){
    var panel='<span class="hover-panel">'+
        '<span class="hp-title">'+esc(g.title)+'</span>'+
        '<span class="hp-desc">'+esc(g.desc||'')+'</span>'+
        '<span class="hp-tag">'+esc(g.tagline||'')+'</span>'+
      '</span>';
    return '<a class="game-card" href="'+esc(g.file)+'">'+ 
      '<span class="gcab-wrap">'+
        '<img class="gcab" src="'+esc(g.cabinet||g.thumb||'')+'" alt="'+esc(g.title)+'" loading="lazy">'+
        panel+
      '</span>'+
      '<span class="gfoot">'+
        '<span class="gtag">'+esc(g.tagline||'Play now')+'</span>'+
        '<span class="gbtn">▶ Play</span>'+
      '</span></a>';
  }).join('');
}
// Try local manifest, fall back to inline so the hub never breaks offline
var MANIFEST=[{"file":"wargames-v3.html","title":"WarGames: Missile Defense","tagline":"Defend NORAD, Moscow & Beijing from incoming ICBMs.","desc":"A retro Missile Command clone inspired by the 1983 film. Pick your threat level, read the defense briefing, then survive 12 escalating waves with radar sweep and WebAudio sound — no downloads.","thumb":"assets/wargames-thumbnail.webp","cabinet":"assets/cabinet-wargames.webp"},{"file":"disk-defrag.html","title":"Disk Defrag","tagline":"The ultimate sector clean-up.","desc":"A puzzle game about rearranging data blocks. Clear the disk before the system crashes.","thumb":"assets/disk-defrag-thumb.webp","cabinet":"assets/cabinet-disk-defrag.webp"},{"file":"drone-hunt-v4.html","title":"Drone Hunt","tagline":"Sectors must be cleared.","desc":"An arcade shooter where you hunt down rogue drones in a neon cityscape.","thumb":"assets/drone-hunt-thumb.webp","cabinet":"assets/cabinet-drone-hunt.webp"},{"file":"computer-chaos-v7.html","title":"Computer Chaos","tagline":"Pure digital mayhem.","desc":"A fast-paced arcade survival game. Evade system errors and clear the waves.","thumb":"assets/computer-chaos-thumb.webp","cabinet":"assets/cabinet-computer-chaos.webp"},{"file":"skydrift.html","title":"SKYDRIFT","tagline":"Side-scrolling space shooter. A boss every 5 waves.","desc":"An R-Type-inspired side-scrolling space shooter. Grab weapon and power pickups, charge two-tier overdrives, and fight a boss every 5 waves — five enemy fleets, to wave 100+. No downloads.","thumb":"assets/skydrift-thumb.webp","cabinet":"assets/cabinet-skydrift.webp"},{"file":"bit-byte.html","title":"BIT-BYTE","tagline":"The maze of data.","desc":"Navigate the complex data mazes and collect bytes while avoiding the system guards.","thumb":"assets/cabinet-bit-byte.webp","cabinet":"assets/cabinet-bit-byte.webp"},{"file":"bug-swarm.html","title":"BUG SWARM","tagline":"Mainframe defense. Wipe out the digital pest infestation.","desc":"A Galaga-style fixed shooter. Defend the core from waves of viruses, rootkits, and tractor-beam spiders. CRT filter, retro scaling, adaptive boss AI, and high-score table. No downloads.","thumb":"assets/cabinet-bug-swarm.webp","cabinet":"assets/cabinet-bug-swarm.webp"},{"file":"data-break.html","title":"DATA BREAK","tagline":"Pilot a tech ship. Shatter corrupted data blocks. Purge the system.","desc":"A fast-paced tech-themed brick breaker. Pilot a maintenance ship, launch Data Scrubbers, and purge corrupted data from an overloaded system. Eight corrupted bosses, multiple ships, power-ups, and endless mode. No downloads.","thumb":"assets/cabinet-data-break.webp","cabinet":"assets/cabinet-data-break.webp"},{"file":"neon-pilot.html","title":"NEON PILOT","tagline":"Further into the neon world. 5 eras. 2 visual styles.","desc":"A retro arcade side-scroller spanning 5 neon eras (1984-3001). Switch between Neon glow and Vector wireframe styles. 8-way movement, tracer bullets, formations, hidden targets, bosses, and adaptive AI demo mode. No downloads.","thumb":"assets/cabinet-neon-pilot.webp","cabinet":"assets/cabinet-neon-pilot.webp"},{"file":"technobonk.html","title":"TECHNOBONK","tagline":"Survive. Evolve. Bonk. Neon-drenched arcade survival.","desc":"A Vampire Survivors-style auto-attack survival game. 4 unique classes, 15+ upgrades, procedurally scaling waves, boss encounters, persistent stats/achievements, minimap radar, and synthwave soundtrack. No downloads.","thumb":"assets/cabinet-technobonk.webp","cabinet":"assets/cabinet-technobonk.webp"},{"file":"stack-overflow.html","title":"STACK OVERFLOW","tagline":"System Stack Climber","desc":"Scale the system stack in this high-intensity climber. Dodge overflows and reach the peak.","thumb":"assets/cabinet-stack-overflow.webp","cabinet":"assets/cabinet-stack-overflow.webp"},{"file":"cyber-dash.html","title":"CYBER DASH","tagline":"Outrun the Mainframe","desc":"An endless synthwave runner. Outrun the mainframe, slide under laser gates, and harvest the grid.","thumb":"assets/cabinet-cyber-dash.webp","cabinet":"assets/cabinet-cyber-dash.webp"},{"file":"neon-breaker.html","title":"NEON BREAKER","tagline":"Retro Arcade Remix","desc":"A classic Breakout x Arkanoid remix. Neon, juicy, and addictive block-shattering action.","thumb":"assets/cabinet-neon-breaker.webp","cabinet":"assets/cabinet-neon-breaker.webp"},{"file":"byte-bird.html","title":"BYTE BIRD","tagline":"Cartoon Tech Arcade","desc":"Fly a little bot through the server maze. Grab batteries, dodge viruses, and chase the high score.","thumb":"assets/cabinet-byte-bird.webp","cabinet":"assets/cabinet-byte-bird.webp"},{"file":"glitch-bug.html","title":"GLITCH BUG","tagline":"Retro Bug Hunt","desc":"A Centipede/Millipede remix. Exterminate the digital pest infestation in the data field.","thumb":"assets/cabinet-glitch-bug.webp","cabinet":"assets/cabinet-glitch-bug.webp"},{"file":"data-router.html","title":"DATA ROUTER","tagline":"Route the Packet","desc":"Hop a lone data packet across busy traffic and bus lanes to the CPU cores before time runs out.","thumb":"assets/cabinet-data-router.webp","cabinet":"assets/cabinet-data-router.webp"},{"file":"port-mapper.html","title":"PORT MAPPER","tagline":"Open Every Port","desc":"Hop across an isometric pyramid of network ports and flip them to OPEN.","thumb":"assets/cabinet-port-mapper.webp","cabinet":"assets/cabinet-port-mapper.webp"},{"file":"barrel-fishing.html","title":"BARREL FISHING","tagline":"Shoot fish in a barrel... from inside the barrel.","desc":"You are the barrel. Ride the river downstream, slingshot leaping fish out of the sky, restock at the banks, dodge chompers and driftwood, and land THE BIG ONE through the rapids. N64-flavored pixels, WebAudio synth, gamepad ready. No downloads.","thumb":"assets/cabinet-barrel-fishing.webp","cabinet":"assets/cabinet-barrel-fishing.webp"}];
fetch('games.json').then(function(r){return r.ok?r.json():Promise.reject();}).then(function(d){renderGames(d.games||MANIFEST);}).catch(function(){renderGames(MANIFEST);});

</script>

    if(b&&/^\d{8}$/.test(b)&&window.self===window.top&&window.sessionStorage){
      var key='onyxBust'+location.pathname;
      var age=Math.floor((Date.now()-Date.UTC(+b.slice(0,4),+b.slice(4,6)-1,+b.slice(6,8)))/86400000);
      if(age>2&&sessionStorage.getItem(key)!=='1'){sessionStorage.setItem(key,'1');location.replace(location.pathname+'?cb='+Date.now());}
    }
  }catch(e){}
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).catch(function(){});});
  }
})();
</script>
