<style>
  :root{
    --onyx:#16161A; --onyx-2:#1f1f25; --ink:#0e0e12;
    --copper:#C2703D; --copper-2:#E8B06A; --copper-deep:#9A5326; --cream:#F7F4EF; --paper:#FBF8F2;
    --paper-2:#F1ECE2; --muted:#6B635A; --line:#e4ddd0;
    --ok:#3fae6b; --shadow:0 18px 50px rgba(14,14,18,.16); --radius:18px;
    --brand-font:'SerpentineBold','SerpentineStandIn','Oswald',"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--onyx);line-height:1.6;-webkit-font-smoothing:antialiased}
  header.site{position:sticky;top:0;z-index:40;background:rgba(22,22,26,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;max-width:1080px;margin:0 auto;padding-left:20px;padding-right:20px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .brand .logo{height:38px;width:auto}
  .brand .word{font-family:var(--brand-font);font-weight:700;font-size:19px;color:var(--cream);letter-spacing:.06em;text-transform:uppercase}
  .nav a.back{color:var(--copper-2);font-weight:600;text-decoration:none;font-size:15px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .sec-head{text-align:center;margin:48px 0 28px}
  .eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700;color:var(--copper-deep)}
  .sec-head h1{font-family:var(--brand-font);font-style:normal;font-weight:700;font-size:clamp(30px,5vw,46px);color:var(--onyx);margin-top:6px}
  .sec-head p{color:var(--muted);max-width:640px;margin:12px auto 0}
  footer.site{background:var(--ink);color:#cfc9c0;padding:40px 0 26px;margin-top:20px}
  footer .cols{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px}
  footer a{color:var(--copper-2);text-decoration:none}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  body{background:#0a0612;color:#f7f4ef}
  body::before{content:"";position:fixed;inset:0;z-index:-2;background:
    radial-gradient(120% 70% at 50% 0%,#3a1052 0%,transparent 55%),
    radial-gradient(120% 80% at 50% 120%,#2a0b3f 0%,#0a0612 60%),
    linear-gradient(180deg,#120726,#1a0b2e 55%,#06030d)}
  body::after{content:"";position:fixed;left:-50%;right:-50%;top:-10%;bottom:-10%;height:auto;z-index:-1;opacity:.55;background-image:linear-gradient(90deg,rgba(194,112,61,.5) 1px,transparent 1px),linear-gradient(0deg,rgba(120,80,255,.4) 1px,transparent 1px);background-size:46px 46px;transform:perspective(320px) rotateX(60deg);transform-origin:50% 100%;animation:arcadeGrid 6s linear infinite;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
  @keyframes arcadeGrid{from{background-position:0 0}to{background-position:0 46px}}
  .arcade-hub{position:relative;z-index:2;width:100%;max-width:1480px;margin:64px auto;min-height:88vh;display:flex;flex-direction:column;background:#0a0612;overflow:hidden;border:1.5px solid rgba(194,112,61,.55);border-radius:var(--r-lg);box-shadow:var(--shadow),0 0 0 1px rgba(194,112,61,.30) inset,0 0 22px 2px rgba(194,112,61,.30),0 0 40px 6px rgba(194,112,61,.16);padding:48px clamp(20px,4vw,56px)}
  .arcade-hub .arcade-bg{position:absolute;inset:0;z-index:0;opacity:.3;background-size:cover;background-position:center;mix-blend-mode:screen;background-image:url('../assets/img/arcade/bg-wireframe.jpg')}
  .arcade-hub .wrap{position:relative;z-index:2}
  .arcade-hub .scanlines{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.07;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
  .arcade-hub::after{content:"";position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;z-index:0;opacity:.5;background-image:linear-gradient(90deg,rgba(194,112,61,.5) 1px,transparent 1px),linear-gradient(0deg,rgba(120,80,255,.4) 1px,transparent 1px);background-size:46px 46px;transform:perspective(320px) rotateX(68deg);transform-origin:50% 100%;animation:arcadeGrid 6s linear infinite;mask-image:linear-gradient(180deg,transparent,#000 40%);-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%)}
  .arcade-hub .sec-head{text-align:center;position:relative}
  .arcade-hub .sec-head::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,94%);height:160%;z-index:-1;background:radial-gradient(closest-side,rgba(10,6,18,.85),transparent)}
  .arcade-hub .sec-head .eyebrow{color:var(--copper-2);text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .arcade-hub .sec-head h1{display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-family:var(--brand-font);font-style:normal;font-weight:700;font-size:clamp(34px,6vw,56px);letter-spacing:.04em;text-shadow:0 0 1px #0a0612,0 0 2px #0a0612,0 3px 10px rgba(0,0,0,.85),0 0 18px rgba(194,112,61,.55)}
  .arcade-hub .sec-head p{color:#f1e9df;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.85);max-width:640px;margin:12px auto 0}
  .arcade-logo{height:clamp(52px,9vw,72px);width:clamp(52px,9vw,72px);object-fit:contain;filter:drop-shadow(0 0 16px rgba(194,112,61,.7))}
  .arcade-hub .games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;max-width:1480px;width:100%;margin:18px auto 0;padding:0}
  /* ---- ARCADE cabinet cards (v5): full cabinet image on TOP, tagline + Play BELOW (no overlap) ---- */
  .arcade-hub .game-card{
    position:relative;display:flex;flex-direction:column;      /* image block + footer stacked in normal flow */
    border-radius:14px;overflow:hidden;text-decoration:none;
    background:#0a0612;box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .arcade-hub .game-card:hover{transform:translateY(-6px);box-shadow:0 22px 46px rgba(194,112,61,.45)}
  /* Image block keeps the cabinet aspect ratio; footer flows underneath, never overlapping */
  .arcade-hub .game-card .gcab-wrap{
    position:relative;display:block;width:100%;
    aspect-ratio:576/768;background:#0a0612;overflow:hidden;
  }
  .arcade-hub .game-card .gcab{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;
    display:block;z-index:1;transition:transform .35s ease,filter .35s ease;
  }
  .arcade-hub .game-card:hover .gcab{transform:scale(1.05);filter:saturate(1.08) contrast(1.04)}
  .arcade-hub .game-card .gcab::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
  /* Footer below the image: tagline + Play button stacked and centered */
  .arcade-hub .game-card .gfoot{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    padding:12px 10px 14px;text-align:center;
  }
  .arcade-hub .game-card .gtag{
    font-size:11px;font-weight:600;line-height:1.2;color:var(--copper-2);
    text-shadow:0 1px 2px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .arcade-hub .game-card .gbtn{
    background:linear-gradient(180deg,var(--copper-2),var(--copper));color:#231a10;
    font-weight:800;font-size:12px;letter-spacing:.04em;padding:4px 14px;border-radius:999px;
    box-shadow:0 3px 0 rgba(120,60,20,.6);transition:background .2s ease;
  }
  .arcade-hub .game-card:hover .gbtn{background:linear-gradient(180deg,#ffd79a,var(--copper-2))}
  .arcade-hub .gdesc{display:none}
  /* Featured flag pinned OVER the cabinet image (lives inside .gcab-wrap) */
  .arcade-hub .game-card .flag{
    position:absolute;top:3%;left:4%;z-index:5;background:var(--copper);color:#fff;
    font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    padding:3px 8px;border-radius:999px;box-shadow:0 3px 10px rgba(154,83,38,.5);
  }
  /* ---- HERO-ON-HOVER overlay: slide-up panel revealing title/desc/tagline (NEVER Play; Play stays below) ---- */
  .arcade-hub .game-card .hover-panel{
    position:absolute;left:0;right:0;bottom:0;height:74%;z-index:2;pointer-events:none;
    display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px 14px 16px;text-align:left;
    background:linear-gradient(to top,rgba(8,6,14,.95) 35%,rgba(8,6,14,.8) 60%,rgba(8,6,14,0) 100%);
    transform:translateY(101%);opacity:0;
    transition:transform .24s cubic-bezier(.22,1,.36,1),opacity .2s ease;transition-delay:.12s;
  }
  @media (hover:hover) and (pointer:fine){
    .arcade-hub .game-card:hover .hover-panel,
    .arcade-hub .game-card:focus-within .hover-panel{transform:translateY(0);opacity:1;transition-delay:.22s}
  }
  .arcade-hub .game-card.expanded .hover-panel{transform:translateY(0);opacity:1}
  .arcade-hub .game-card .hp-title{font-family:var(--brand-font,Oswald,"Segoe UI",sans-serif);font-weight:700;font-size:16px;line-height:1.05;color:var(--copper-2);text-shadow:0 0 12px rgba(194,112,61,.55)}
  .arcade-hub .game-card .hp-desc{font-size:11.5px;line-height:1.35;color:#ece6df;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .arcade-hub .game-card .hp-tag{font-size:10.5px;font-weight:600;color:#b9a7c9;font-style:italic}
  @media (prefers-reduced-motion:reduce){.arcade-hub .game-card .hover-panel{transition:opacity .2s ease;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.arcade-hub .game-card,.arcade-hub .game-card .gcab{transition:none;transform:none}}
  @media (max-width:1024px){.arcade-hub .games-grid{gap:18px}}
  @media (max-width:640px){.arcade-hub .games-grid{gap:14px;padding:0 16px}}

  @media (prefers-reduced-motion:reduce){body::after{animation:none}}
</style>
</head>
<body class="cabinet">
<header class="site">
  <nav class="nav">
    <a class="brand" href="../index.html">
      <img class="logo" src="../assets/img/brand/onyxsystems-logo.png" alt="Onyx Systems">
      <span class="word">ONYX SYSTEMS</span>
    </a>
    <a class="back" href="../index.html">← Back to site</a>
  </nav>
</header>

<main class="wrap arcade-hub">
  <div class="arcade-bg"></div>
  <div class="scanlines"></div>
  <div class="sec-head">
    <div class="eyebrow">Onyx Arena presents</div>
    <h1><img class="arcade-logo" src="../assets/img/brand/onyx-arena-logo.jpg" alt="Onyx Arena">ARCADE</h1>
    <p>No downloads. No installs. No accounts. Just press start and play — a little something to break up your day while you're here.</p>
  </div>
  <div class="games-grid" id="gameGrid"></div>
  <div class="empty" id="empty" style="display:none">More games coming soon — check back!</div>
</main>

<footer class="site">
  <div class="cols">
    <div>Onyx Systems · Lake City, FL · (386) 755-7772</div>
    <div><a href="../index.html">onyxpc.us</a></div>
  </div>
</footer>

<script>
function esc(s){return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function renderGames(list){
  var grid=document.getElementById('gameGrid');
  if(!list||!list.length){document.getElementById('empty').style.display='block';return;}
  list.sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0);});
  grid.innerHTML=list.map(function(g){
    var panel='<span class="hover-panel">'+
        '<span class="hp-title">'+esc(g.title)+'</span>'+
        '<span class="hp-desc">'+esc(g.desc||'')+'</span>'+
        '<span class="hp-tag">'+esc(g.tagline||'')+'</span>'+
      '</span>';
    return '<a class="game-card" href="'+esc(g.file)+'">'+ 
      '<span class="gcab-wrap">'+
        '<img class="gcab" src="'+esc(g.cabinet||g.thumb||'')+'" alt="'+esc(g.title)+'" loading="lazy">'+
        (g.featured?'<span class="flag">Featured</span>':'')+
        panel+
      '</span>'+
      '<span class="gfoot">'+
        '<span class="gtag">'+esc(g.tagline||'Play now')+'</span>'+
        '<span class="gbtn">▶ Play</span>'+
      '</span></a>';
  }).join('');
}
// Try local manifest, fall back to inline so the hub never breaks offline
var MANIFEST=[{"file":"wargames-v3.html","title":"WarGames: Missile Defense","tagline":"Defend NORAD, Moscow & Beijing from incoming ICBMs.","desc":"A retro Missile Command clone inspired by the 1983 film. Pick your threat level, read the defense briefing, then survive 12 escalating waves with radar sweep and WebAudio sound \u2014 no downloads.","thumb":"assets/wargames-thumbnail.webp","cabinet":"assets/cabinet-wargames.webp","featured":true},{"file":"disk-defrag.html","title":"Disk Defrag","tagline":"Defragment the drive. Clear the lines.","desc":"A disk-defragmenter-themed Tetris with a Win95-meets-cyber-dark aesthetic. SRS rotation, 7-bag, ghost, hold, T-spin/B2B scoring, sound toggle, and a top-5 high-score table. No downloads.","thumb":"assets/disk-defrag-thumb.webp","cabinet":"assets/cabinet-disk-defrag.webp","featured":false},{"file":"drone-hunt-v4.html","title":"Drone Hunt","tagline":"Laser rifle. Drones. Don't hit the birds.","desc":"A top-down laser-rifle shooter. Click to fire a green beam from your rifle, destroy inbound drones, protect the birds, and down the boss drone every 5th wave. No downloads.","thumb":"assets/drone-hunt-thumb.webp","cabinet":"assets/cabinet-drone-hunt.webp","featured":false},{"file":"computer-chaos-v4.html","title":"Computer Chaos","tagline":"Catch the parts. Fill the orders. Beat the clock.","desc":"A catch-and-sort repair-tech game. Catch good parts to fill orders, dodge junk, survive chaos events \u2014 5 lives, 60-second rounds. No downloads.","thumb":"assets/computer-chaos-thumb.webp","cabinet":"assets/cabinet-computer-chaos.webp","featured":false},{"file":"skydrift-v1.html","title":"SKYDRIFT","tagline":"Neon bolts, drones and a high-score table.","desc":"A neon retro arcade side-scroller. Fly an 8-direction ship, power-scaled bolt patterns, bombs, 6 drone types, combo x10, and a top-5 high-score table. No downloads.","thumb":"assets/skydrift-thumb.webp","cabinet":"assets/cabinet-skydrift.webp","featured":false}];
fetch('games.json').then(function(r){return r.ok?r.json():Promise.reject();}).then(function(d){renderGames(d.games||MANIFEST);}).catch(function(){renderGames(MANIFEST);});
document.addEventListener('click',function(e){var c=e.target.closest('.game-card');if(c&&window.matchMedia('(hover:none)').matches){e.preventDefault();c.classList.toggle('expanded');}});
</script>
</body>
</html>
