<!DOCTYPE html>
<html lang="en">

<title>RALLY Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060e'/%3E%3Ctext x='2' y='12' font-size='11' font-family='monospace' fill='%23ffd94a'%3EZ%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#05060e;overflow:hidden;
  font-family:'Cascadia Mono','SF Mono',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body{padding-bottom:env(safe-area-inset-bottom,0)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
/* ---------- rotate prompt (phones portrait only) ---------- */
#rotate-prompt{display:none;position:fixed;inset:0;z-index:99999;background:#05060e;color:#fff;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;
  font-family:'Cascadia Mono','SF Mono',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace}
#rotate-prompt .icon{font-size:60px;animation:rot-hint 2s ease-in-out infinite}
#rotate-prompt .msg{font-size:16px;letter-spacing:1px;max-width:280px;line-height:1.5}
#rotate-prompt .sub{font-size:12px;color:#7fa8d0}
@keyframes rot-hint{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (hover:none) and (pointer:coarse) and (max-width:767px){
  #rotate-prompt{display:flex!important}
  #C{visibility:hidden}
}
/* ---------- touch controls ---------- */
#touchUI{position:fixed;inset:auto 0 0 0;z-index:500;display:none;justify-content:space-between;
  align-items:flex-end;padding:0 14px calc(10px + env(safe-area-inset-bottom,0));pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(0,229,255,.35))}
#touchUI .pad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;pointer-events:auto}
#touchUI .tbtn{background:linear-gradient(180deg,rgba(20,30,60,.55),rgba(8,10,24,.7));
  border:1px solid rgba(0,229,255,.55);border-radius:10px;box-shadow:0 0 10px rgba(0,229,255,.18),inset 0 0 8px rgba(0,229,255,.08);
  color:#9ff6ff;display:flex;align-items:center;justify-content:center;font-size:22px;
  -webkit-tap-highlight-color:transparent}
#touchUI .tbtn:active{background:rgba(0,229,255,.35);box-shadow:0 0 14px rgba(0,229,255,.5)}
#touchUI .smoke{pointer-events:auto;width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,20,70,.5),rgba(40,6,26,.6));
  border:1px solid rgba(255,46,151,.6);box-shadow:0 0 12px rgba(255,46,151,.3),inset 0 0 10px rgba(255,46,151,.15);
  color:#ffd9ee;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;letter-spacing:1px;
  -webkit-tap-highlight-color:transparent}
#touchUI .smoke:active{background:rgba(255,46,151,.45);box-shadow:0 0 18px rgba(255,46,151,.6)}
@media (hover:none) and (pointer:coarse){ #touchUI{display:flex} }
</style>
</head>

/* Power-up: a PWR cell briefly appears on a road cell, refills the tank, then vanishes.
   FIRST/INTERVAL are PRO-difficulty baselines; powerupTiming() scales them per difficulty+round.
   Timed against the ~59s ARCADE tank (2.7/s drain): the first cell lands at ~24% of the tank
   (a real mid-round pit stop, not an ignored early slot), and a 14s interval keeps a live cell
   within reach through the danger zone; DUR gives ~10s to make the 9+ tile detour. */
const POWERUP={FIRST:14000,INTERVAL:14000,DUR:10000,SCORE:500};

   each maze layout; these are farthest-point spreads computed from the ROM mazes,
   so every sector has a designed, well-spread course. */

  [[2,2],[20,4],[30,15],[9,17],[22,29],[7,37],[31,39],[18,45],[4,55],[29,55]],
  [[2,2],[21,3],[11,13],[31,14],[2,24],[21,25],[10,34],[19,45],[2,52],[30,55]],
  [[23,2],[2,3],[11,14],[31,14],[2,23],[21,24],[11,34],[29,36],[31,54],[2,55]]
];

// Level table from the original ROM mapping: [topCars,bottomCars,mazeIdx(1-4),challenge]
function levelSpec(n){
  const t=[[0,3],[0,4],[3,5],[0,5],[1,5],[2,5],[3,5],
           [3,5],[3,5],[3,5],[3,5],[3,5],[3,5],[3,5],[3,5]];
  const i=Math.min(n,15)-1;
  const challenge=(n===3||(n>3&&(n-3)%4===0));
  const maze=((n-1)%15)+1;
  let m;
  if(maze<=3)m=1;else if(maze<=7)m=2;else if(maze<=11)m=3;else m=4;
  return{top:t[i][0],bottom:t[i][1],maze:m,challenge};
}

/* ================= INPUT ================= */
const Input={keys:{},seq:{},touch:{left:false,right:false,up:false,down:false,smoke:false},
  gamepad:{left:false,right:false,up:false,down:false,smoke:false,start:false},
  stamp(name){this.seq[name]=++INPUT_SEQ.n;},
  dir(){ // returns current desired dir or null — LAST-press-wins across all devices
    const held=[];
    const add=(name,names)=>{for(const n of names)if(this.keys[n])held.push({name,seq:this.seq[n]||0});};
    add('left',['arrowleft','a']);add('right',['arrowright','d']);
    add('up',['arrowup','w']);add('down',['arrowdown','s']);
    const t=this.touch,g=this.gamepad;
    if(t.left)held.push({name:'left',seq:this.seq['tleft']||0});
    if(t.right)held.push({name:'right',seq:this.seq['tright']||0});
    if(t.up)held.push({name:'up',seq:this.seq['tup']||0});
    if(t.down)held.push({name:'down',seq:this.seq['tdown']||0});
    if(g.left)held.push({name:'left',seq:this.seq['gleft']||0});
    if(g.right)held.push({name:'right',seq:this.seq['gright']||0});
    if(g.up)held.push({name:'up',seq:this.seq['gup']||0});
    if(g.down)held.push({name:'down',seq:this.seq['gdown']||0});
    if(!held.length)return null;
    held.sort((a,b)=>b.seq-a.seq);
    return held[0].name;}
};

const AudioSys={
  ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  beep(f,dur,type='square',vol=0.08,slide=0){
    if(!this.on||!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;
    if(slide)o.frequency.linearRampToValueAtTime(f+slide,this.ctx.currentTime+dur);
    g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start();o.stop(this.ctx.currentTime+dur);}
};

/* Rally-X's iconic looping BGM, approximated with a square-wave sequencer */
const BGM={step:0,timer:null,
  // main riff (semitone offsets from base), -1 = rest
  seq:[0,-1,4,-1,7,-1,4,-1,0,-1,4,7,12,-1,7,-1],
  bass:[-24,-24,-17,-17,-19,-19,-12,-12],
  start(){this.stop();
    this.timer=setInterval(()=>{
      if(!AudioSys.on||!AudioSys.ctx)return;
      if(Game.state!==State.PLAY&&Game.state!==State.BONUS)return;
      const s=this.seq[this.step%this.seq.length];
      const b=this.bass[Math.floor(this.step/2)%this.bass.length];
      if(s>=0)AudioSys.beep(330*Math.pow(2,s/12),0.09,'square',0.03);
      if(this.step%2===0&&b>=-24)AudioSys.beep(165*Math.pow(2,(b+24)/12),0.11,'triangle',0.05);
      this.step++;
    },150);},
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null;}}
};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function isRoad(m,c,r){ // maze lookup with solid border
  if(r<0||r>=ROWS||c<0||c>=COLS)return false;
  return m[r][c]!=='X';
}
function roadAtPx(m,x,y){return isRoad(m,Math.floor(x/TILE),Math.floor(y/TILE));}

/* ================= ENTITIES ================= */
class Car{
  constructor(maze){this.maze=maze;this.x=0;this.y=0;this.dir='up';this.speed=1.9;
    this.stun=0;this.spin=0;this.alive=true;this.px=0;this.py=0;}
  get cx(){return Math.floor(this.x/TILE);} get cy(){return Math.floor(this.y/TILE);}
  setTile(c,r){this.x=c*TILE+TILE/2;this.y=r*TILE+TILE/2;}
  tryTurn(nd){ // axis-change turns snap the car to the lane centerline (original feel)
    if(nd===this.dir)return true; // already heading that way — never re-snap (keeps cars moving!)
    const cx=this.cx,cy=this.cy,midX=cx*TILE+TILE/2,midY=cy*TILE+TILE/2;
    const nearX=Math.abs(this.x-midX)<=TURN_SNAP,nearY=Math.abs(this.y-midY)<=TURN_SNAP;
    if((nd==='left'||nd==='right')&&!nearY)return false;
    if((nd==='up'||nd==='down')&&!nearX)return false;
    const dc={left:-1,right:1,up:0,down:0}[nd],dr={left:0,right:0,up:-1,down:1}[nd];
    if(!isRoad(this.maze,cx+dc,cy+dr))return false;
    // also verify there is room to actually move one sub-step that way
    const HB=6;
    if(nd==='left' && !isRoad(this.maze,Math.floor((this.x-HB-2)/TILE),cy))return false;
    if(nd==='right'&& !isRoad(this.maze,Math.floor((this.x+HB+2)/TILE),cy))return false;
    if(nd==='up'   && !isRoad(this.maze,cx,Math.floor((this.y-HB-2)/TILE)))return false;
    if(nd==='down' && !isRoad(this.maze,cx,Math.floor((this.y+HB+2)/TILE)))return false;
    if((nd==='left'||nd==='right')){this.y=midY;this.x=midX;}
    else {this.x=midX;this.y=midY;}
    this.dir=nd;return true;}
  step(dt,speedMul=1){
    if(this.frozen)return;
    if(this.stun>0){this.stun-=dt;return;}
    // Car hitbox: 12x12 centered. Move in small sub-steps and test the hitbox
    // against wall tiles each time — no speed can tunnel through a wall.
    const HB=6;                       // half-width of hitbox
    const v=this.speed*speedMul*(dt/FIXED_DT);
    const d=this.dir;
    let remaining=Math.abs(v);
    const sx=(d==='left'?-1:d==='right'?1:0), sy=(d==='up'?-1:d==='down'?1:0);
    while(remaining>0){
      const s=Math.min(remaining,4);  // sub-step <= 4px, always < TILE
      remaining-=s;
      const nx=this.x+sx*s, ny=this.y+sy*s;
      // corners of the proposed hitbox
      const l=nx-HB,r=nx+HB,t=ny-HB,b=ny+HB;
      const c0=Math.floor(l/TILE),c1=Math.floor(r/TILE);
      const r0=Math.floor(t/TILE),r1=Math.floor(b/TILE);
      let blocked=false;
      for(let rr=r0;rr<=r1&&!blocked;rr++)
        for(let cc=c0;cc<=c1;cc++)
          if(!isRoad(this.maze,cc,rr)){blocked=true;break;}
      if(blocked){
        // snap flush against the wall edge we hit
        if(sx<0)this.x=(c0+1)*TILE+HB;
        else if(sx>0)this.x=c1*TILE-HB-0.01;
        else if(sy<0)this.y=(r0+1)*TILE+HB;
        else if(sy>0)this.y=r1*TILE-HB-0.01;
        break;
      }
      this.x=nx;this.y=ny;
    }
    // safety clamp: the outer road lanes (row 0/55, col 0/33) are drivable in the
    // original — only keep the car inside the maze bounds, never past the edge.
    this.x=clamp(this.x,HB,COLS*TILE-HB);
    this.y=clamp(this.y,HB,ROWS*TILE-HB);
  }
}

class Player extends Car{
  constructor(maze){super(maze);this.smoke=[];this.smokeCd=0;this.pendingDir=null;this.pendingT=0;this.smokeHeld=false;}
  puff(){ // one trail puff at the car — cheap, can never zero the tank
    this.smoke.push({x:this.x,y:this.y,life:1400,max:1400,seed:Math.random()*Math.PI*2,
      vx:(Math.random()*2-1)*0.3,vy:(Math.random()*2-1)*0.3});
    Game.fuel=Math.max(0,Game.fuel-SMOKE_COST);
  }
  update(dt,input){
    // smoke: holding the button streams a continuous drifting trail
    this.smokeCd-=dt;
    if(this.smokeHeld&&Game.fuel>=SMOKE_COST&&this.smokeCd<=0){
      this.smokeCd=SMOKE_TRAIL_MS;
      this.puff();
    }
    for(let i=this.smoke.length-1;i>=0;i--){
      const s=this.smoke[i];
      s.life-=dt;
      s.x+=s.vx*dt/16.6;s.y+=s.vy*dt/16.6;
      if(s.life<=0)this.smoke.splice(i,1);
    }
    // turn buffering: a direction pressed early is retried until it becomes
    // possible at the next intersection (fixes "imprecise" cornering)
    const want=input.dir();
    if(want){
      if(this.tryTurn(want)){this.pendingDir=null;this.pendingT=0;}
      else{this.pendingDir=want;this.pendingT=TURN_BUFFER_MS;}
    }else if(this.pendingDir){
      this.pendingT-=dt;
      if(this.pendingT<=0)this.pendingDir=null;
      else if(this.tryTurn(this.pendingDir))this.pendingDir=null;
    }
  }
  dropSmoke(){ // instant puff + sound on the button's rising edge
    if(Game.fuel<SMOKE_COST)return false;
    this.smokeCd=SMOKE_TRAIL_MS;
    this.puff();
    AudioSys.beep(220,0.15,'sawtooth',0.06,-80);
    Game.emit(this.x,this.y,5,CYBER.neonCyan,1.1,'smoke');
    return true;}
}

const SMOKE_COST=0.6;       // fuel per trail puff (~8.6/sec while held)
const SMOKE_TRAIL_MS=70;    // ms between trail puffs while held

class Enemy extends Car{
  constructor(maze,top,idx){super(maze);this.top=top;this.chase=true;this.idx=idx||0;
    this.tc=16;this.tr=40;this.retargetT=0;}
  /* pick a committed target cell around the player — formation offsets rotated
     to the player's heading herd the pack: one cuts ahead, others flank, later
     ones come from behind (faithful to the arcade cars boxing you in). */
  setTarget(player,dt){
    this.retargetT-=dt;
    if(this.retargetT>0)return;
    this.retargetT=550+Math.random()*450;
    const fwd={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[player.dir]||[0,-1];
    const side=[fwd[1],-fwd[0]]; // left normal of the player's heading
    const offs=[[0,-2],[-2,-1],[2,-1],[0,2],[1,2],[-1,2]];
    const o=offs[this.idx%offs.length];
    let tc=0,tr=0,ok=false;
    for(const s of [1,0.5,0]){ // shrink toward the player if offset lands on a wall
      tc=player.cx+Math.round(fwd[0]*o[0]*s)+Math.round(side[0]*o[1]*s);
      tr=player.cy+Math.round(fwd[1]*o[0]*s)+Math.round(side[1]*o[1]*s);
      if(isRoad(this.maze,tc,tr)){ok=true;break;}
    }
    if(!ok){tc=player.cx;tr=player.cy;}
    this.tc=tc;this.tr=tr;
  }
  update(dt,player,others,rocks){
    if(this.stun>0){this.stun-=dt;this.spin+=dt;return;}
    if(!player)return; /* challenge round: cars frozen while fuel lasts */
    this.setTarget(player,dt);
    const cx=this.cx,cy=this.cy;
    const dirs=[];
    const opp={left:'right',right:'left',up:'down',down:'up'}[this.dir];
    for(const d of ['left','right','up','down']){
      if(d===opp)continue;
      const dc={left:-1,right:1}[d]||0,dr={up:-1,down:1}[d]||0;
      if(isRoad(this.maze,cx+dc,cy+dr))dirs.push(d);
    }
    if(dirs.length===0){ // dead end: reverse
      const dc={left:-1,right:1}[opp]||0,dr={up:-1,down:1}[opp]||0;
      if(isRoad(this.maze,cx+dc,cy+dr))this.tryTurn(opp)||(()=>{this.dir=opp;})();
      return;
    }
    // steer toward the committed target: min manhattan distance with a strong
    // straight preference — decisions stay stable between retargets, so the
    // pack sweeps corners smoothly instead of flapping direction every frame.
    let best=null,bd=1e9;
    for(const d of dirs){
      const dc={left:-1,right:1}[d]||0,dr={up:-1,down:1}[d]||0;
      const dist=Math.abs(this.tc-(cx+dc))+Math.abs(this.tr-(cy+dr));
      const straight=d===this.dir?-0.9:0;
      if(dist+straight<bd){bd=dist+straight;best=d;}
    }
    if(best)this.tryTurn(best);
  }
}

  plume(x,y,n,sizeMul){

        color:'#151826',kind:'plume'});

  /* tire skid streaks at a crash site: dark dashes along the car's heading */
  dropSkids(x,y,dir){
    const ang=dir==='up'?-Math.PI/2:dir==='down'?Math.PI/2:dir==='left'?Math.PI:0;
    const ca=Math.cos(ang),sa=Math.sin(ang),px=Math.cos(ang+Math.PI/2),py=Math.sin(ang+Math.PI/2);

      const back=-10-Math.random()*36, off=Math.random()*16-8;

  },
  shake(a){this.trauma=Math.min(1,this.trauma+a);},
  updateFX(dt){
    // hit-stop: brief freeze-frame on death
    if(this.hitStopT>0){this.hitStopT-=dt;return;}
    // trauma-based screen shake (smooth sine, decays on its own)
    if(this.trauma>0){
      this.trauma=Math.max(0,this.trauma-FX.SHAKE_DECAY*dt/1000);
      const s=this.trauma*this.trauma;

      this.shakeX=(Math.sin(t*41.3)*0.6+Math.sin(t*17.7)*0.4)*FX.SHAKE_MAX*s;

  resize(){

    const s=Math.min(v.width/(SCREEN_W+8),v.height/(SCREEN_H+8));

    this.canvas.style.width=this.canvas.width+'px';this.canvas.style.height=this.canvas.height+'px';

  anyKey(e){
    AudioSys.init();
    const k=e.key.toLowerCase();
    if(k==='p'&&this.state===State.PLAY){this.setState(State.PAUSED);return;}
    if(k==='p'&&this.state===State.PAUSED){this.setState(State.PLAY);return;}
    switch(this.state){
      case State.TITLE: if(k==='enter'||k===' '||Input.gamepad.start)this.setState(State.MENU); break;
      case State.MENU:
        if(k==='arrowup'||k==='w'){this.menuIdx=(this.menuIdx+3)%4;AudioSys.beep(500,.05);}
        else if(k==='arrowdown'||k==='s'){this.menuIdx=(this.menuIdx+1)%4;AudioSys.beep(500,.05);}
        else if(k==='enter'||k===' '){
          AudioSys.beep(700,.08);
          if(this.menuIdx===0){this.newGame();}
          else if(this.menuIdx===1)this.setState(State.DIFF);
          else if(this.menuIdx===2)this.setState(State.HOWTO);
          else {this.scoresScroll=0;this.setState(State.SCORES);}
        }break;
      case State.DIFF:
        if(k==='arrowup'||k==='w'||k==='arrowleft'||k==='a')this.diffIdx=(this.diffIdx+2)%3;
        else if(k==='arrowdown'||k==='s'||k==='arrowright'||k==='d')this.diffIdx=(this.diffIdx+1)%3;
        else if(k==='enter'||k===' '){this.diff=this.diffIdx;this.menuIdx=0;AudioSys.beep(700,.08);this.setState(State.MENU);}
        else if(k==='escape')this.setState(State.MENU);
        break;
      case State.HOWTO:case State.SCORES:
        if(k==='enter'||k===' '||k==='escape'){this.menuIdx=0;this.setState(State.MENU);}break;
      case State.PAUSED:
        if(k==='enter'||k===' ')this.setState(State.PLAY);

  toTitle(){BGM.stop();this.menuIdx=0;this.setState(State.TITLE);this.startDemo();},

  newGame(){
    this.score=0;this.lives=3;this.round=1;this.extraAt=20000;
    this.diff=this.diffIdx;
    this.startRound(true);
  },
  /* PWR cell cadence: harder difficulty + later rounds respawn the cell sooner so fuel pressure stays fair */
  powerupTiming(){
    const mul=this.DIFFS[this.demo?1:this.diff].fuelMul; // 1.35 rookie / 1.0 pro+arcade (original balance)
    const roundT=Math.max(0.75,1-(this.round-1)*0.025);   // slight speed-up on later sectors
    return {first:Math.round(POWERUP.FIRST*mul*roundT),interval:Math.round(POWERUP.INTERVAL*mul*roundT)};
  },
  setupRound(){ // shared by real play and attract-mode demo
    const spec=levelSpec(this.round);
    const D=this.DIFFS[this.demo?1:this.diff];
    this.maze=MAZES[spec.maze-1];
    this.spec=spec;
    this.challenge=spec.challenge;
    this.flagsLeft=10;this.flagVal=100;this.doubled=false;this.specialTaken=false;
    this.outOfFuelMsg=false;this.fuelOutT=0;this.lowFuelWarnT=0;
    this.powerup=null;this.powerupCd=this.powerupTiming().first;
    this.fuelMax=Math.round(100*D.fuelMul);this.fuel=this.fuelMax;
    // fixed flag positions per maze (faithful table spots); special flag rotates per round
    this.flags=FLAG_TABLE[spec.maze-1].map(([c,r],i)=>({c,r,taken:false,special:i===((this.round-1)%10)}));
    // rocks: deterministic per round, never on a flag or in the start strip
    this.rocks=[];
    let seed=(this.round*7919+13)>>>0;
    const rnd=()=>{seed=(Math.imul(seed,1103515245)+12345)>>>0;return seed/4294967296;}; // [0,1)
    const rockCand=[];
    for(let r=3;r<ROWS-3;r++)for(let c=3;c<COLS-3;c++)
      if(isRoad(this.maze,c,r)&&!(Math.abs(r-51)<6&&Math.abs(c-16)<8)
        // never on a flag OR beside one, so a rock can't seal a flag pocket
        &&!this.flags.some(f=>Math.abs(f.c-c)<=1&&Math.abs(f.r-r)<=1))rockCand.push([c,r]);
    for(let i=0;i<8&&rockCand.length;i++){
      const idx=Math.floor(rnd()*rockCand.length)%rockCand.length;
      const[c,r]=rockCand.splice(idx,1)[0];
      this.rocks.push({c,r});
    }
    // entities
    this.player=new Player(this.maze);
    this.player.setTile(16,51);this.player.dir='up';
    this.enemies=[];
    for(let i=0;i<spec.bottom;i++){
      const e=new Enemy(this.maze,false,i);
      e.setTile(12+i*2,53);e.dir=i%2?'left':'right';
      e.speed=(1.5*D.spdMul+this.round*0.02)*(this.demo?1.18:1); // demo pack keeps pace → real chase
      e.top=false;this.enemies.push(e);
    }
    for(let i=0;i<spec.top;i++){
      const e=new Enemy(this.maze,true,i+spec.bottom);
      e.setTile(14+i*2,2);e.dir='down';e.speed=(1.45*D.spdMul+this.round*0.02)*(this.demo?1.18:1);
      e.top=true;this.enemies.push(e);
    }
    this.playT=0;
  },
  startRound(newLife){
    this.demo=false;
    this.setupRound();
    this.setState(State.READY);this.readyT=2000;
    BGM.start();
  },
  startDemo(){ // attract mode: the game plays itself behind the title screen
    this.demo=true;
    this.round=this.demoRound;
    this.setupRound();
    this.setState(State.TITLE);
    this.demoWait=0;this.demoTarget=null;this.demoStep=null;this.demoRt=0;
    this.demoFlag=null;this.demoSlowT=0;this.demoScore=0;
  },

  tick(dt){
    this.stateT+=dt;
    this.updateFX(dt);
    pollPad();
    if(Input.gamepad.start){
      if(this.state===State.TITLE){this.setState(State.MENU);Input.gamepad.start=false;}
      else if(this.state===State.PLAY){this.setState(State.PAUSED);Input.gamepad.start=false;}
      else if(this.state===State.PAUSED){this.setState(State.PLAY);Input.gamepad.start=false;}
    }
    // smoke: held across keyboard/touch/gamepad → continuous trail; rising edge = instant puff + beep
    if(this.state===State.PLAY&&this.player){
      const held=Input.keys[' ']||Input.touch.smoke||Input.gamepad.smoke;
      const p=this.player;
      if(held&&!p.smokeHeld)p.dropSmoke();
      p.smokeHeld=held;
    }

    switch(this.state){
      case State.TITLE:this.updateDemo(dt);break;
      case State.READY:
        this.readyT-=dt;if(this.readyT<=0)this.setState(this.challenge?State.BONUS:State.PLAY);
        break;
      case State.PLAY:case State.BONUS:this.updatePlay(dt);break;
      case State.DYING:
        if(this.stateT>1800){
          this.lives--;
          if(this.lives<=0){this.endGame();}
          else this.startRound(false);
        }break;
      case State.STAGECLEAR:
        if(this.stateT>2200){this.round++;this.startRound(false);}break;
    }
  },

  updatePlay(dt){
    this.playT=(this.playT||0)+dt;
    const p=this.player;
    p.update(dt,Input);
    const frozen=this.state===State.BONUS&&this.fuel>0;
    for(const e of this.enemies)e.frozen=frozen;
    const aggro=this.playT>1200&&!frozen;
    for(const e of this.enemies)e.update(dt,aggro?p:null,this.enemies,this.rocks);
    // ambient sparks from scrap piles
    for(const rk of this.rocks){
      const key=rk.c+','+rk.r;
      this.rockSparkT[key]=(this.rockSparkT[key]||Math.random()*FX.ROCK_SPARK_CD)-dt;
      if(this.rockSparkT[key]<=0){
        this.rockSparkT[key]=FX.ROCK_SPARK_CD*(0.5+Math.random());
        this.emit(rk.c*TILE+8+(Math.random()*10-5),rk.r*TILE+8+(Math.random()*10-5),
          2,CYBER.neonRed,0.9,'rock');
      }
    }
    // power drain — out of fuel stops the car, then the life is lost (original behavior)
    this.fuel-=dt*0.0027*this.DIFFS[this.diff].fuelMul*(this.fuel>20?1:0.25); // ~60s full tank, like the original
    // low-fuel warning chime — cabinet-style repeating alarm while the tank is under 25%.
    // In the challenge round fuel IS the freeze timer, so it gets a distinct urgent
    // rising chirp (higher pitch, faster cadence) instead of the normal fuel drone.
    if(this.fuel>0&&this.fuel<this.fuelMax*0.25){
      this.lowFuelWarnT=(this.lowFuelWarnT||0)-dt;
      if(this.lowFuelWarnT<=0){
        this.lowFuelWarnT=this.challenge?1100:1600;
        if(this.challenge){
          AudioSys.beep(1046,.08,'square',.07);
          setTimeout(()=>AudioSys.beep(1318,.08,'square',.07),90);
          setTimeout(()=>AudioSys.beep(1568,.1,'square',.07),180);
        }else{
          AudioSys.beep(880,.09,'square',.07);setTimeout(()=>AudioSys.beep(660,.12,'square',.07),110);
        }
      }
    }
    if(this.fuel<=0){
      this.fuel=0;
      if(!this.outOfFuelMsg){this.outOfFuelMsg=true;AudioSys.beep(120,0.5,'sawtooth',0.07);this.fuelOutT=900;}
      else this.fuelOutT-=dt;
      if(this.fuelOutT<=0){this.kill(this.player.x,this.player.y);return;}
    }
    p.step(dt,this.fuel>0?1:0);
    for(const e of this.enemies)e.step(dt);

    // smoke stun / rock stun (enemies pass through each other, like the original)
    for(const e of this.enemies){
      if(e.stun>0)continue;
      for(const s of p.smoke)
        if(Math.abs(e.x-s.x)<12&&Math.abs(e.y-s.y)<12){e.stun=1500;AudioSys.beep(140,.12,'square',.05);
          this.emit(e.x,e.y,FX.SMOKE_BURST,CYBER.neonCyan,1.4,'smoke');this.shake(0.15);}
      for(const rk of this.rocks)
        if(Math.abs(e.x-(rk.c*TILE+8))<10&&Math.abs(e.y-(rk.r*TILE+8))<10)e.stun=1500;
    }
    // flag pickup
    for(const f of this.flags){
      if(f.taken)continue;
      if(Math.abs(p.x-(f.c*TILE+8))<10&&Math.abs(p.y-(f.r*TILE+8))<10){
        f.taken=true;this.flagsLeft--;
        const wasSpecial=f.special&&!this.specialTaken;
        let v=this.flagVal*(this.doubled&&!wasSpecial?2:1); // S flag itself pays face value
        this.addScore(v);
        AudioSys.beep(600+ (10-this.flagsLeft)*40,.09,'square',.07);
        const fx=f.c*TILE+8, fy=f.r*TILE+8;
        this.emit(fx,fy,FX.FLAG_BURST,wasSpecial?'#fff3a0':CYBER.neonYellow,1.6,'flag');
        this.addFloater(fx,fy-8,'+'+v,wasSpecial?'#fff3a0':CYBER.neonYellow,wasSpecial);
        this.shake(wasSpecial?0.5:0.25);
        if(wasSpecial){this.specialTaken=true;this.doubled=true;
          AudioSys.beep(900,.2,'square',.08,300);
          this.addFloater(this.camX+VIEW_W*TILE/2,this.camY+VIEW_H*TILE*0.3,'DOUBLE SCORE!',CYBER.neonYellow,true);}
        if(this.flagVal<1000)this.flagVal+=100;
        if(this.flagsLeft===0){this.stageClear();return;}
      }
    }
    // PWR cell: appears briefly, refills the tank, then vanishes
    if(this.powerup){
      this.powerup.t+=dt;
      if(this.powerup.t>POWERUP.DUR){this.powerup=null;this.powerupCd=this.powerupTiming().interval;}
      else if(Math.abs(p.x-(this.powerup.c*TILE+8))<10&&Math.abs(p.y-(this.powerup.r*TILE+8))<10){
        const fx=this.powerup.c*TILE+8,fy=this.powerup.r*TILE+8;
        this.powerup=null;this.powerupCd=this.powerupTiming().interval;
        this.fuel=this.fuelMax;
        this.addScore(POWERUP.SCORE); // the cell pays like a mid-value flag
        this.emit(fx,fy,FX.POWERUP_BURST,CYBER.neonGreen,1.7,'powerup');
        this.addFloater(fx,fy-8,'+'+POWERUP.SCORE+' PWR',CYBER.neonGreen,true);
        this.shake(0.35);
        AudioSys.beep(760,.12,'square',.08);setTimeout(()=>AudioSys.beep(1140,.14,'square',.08),110);
      }
    }else{
      this.powerupCd-=dt;
      if(this.powerupCd<=0){
        const cand=[];
        for(let r=3;r<ROWS-3;r++)for(let c=3;c<COLS-3;c++)
          if(isRoad(this.maze,c,r)&&Math.abs(r-p.cy)+Math.abs(c-p.cx)>9)cand.push([c,r]);
        if(cand.length){
          const[c,r]=cand[Math.floor(Math.random()*cand.length)%cand.length];
          this.powerup={c,r,t:0};
        }
        this.powerupCd=this.powerupTiming().interval;
      }
    }
    if(this.playT>1200){
      // rock collision (player dies)
      for(const rk of this.rocks)
        if(Math.abs(p.x-(rk.c*TILE+8))<9&&Math.abs(p.y-(rk.r*TILE+8))<9){this.kill(p.x,p.y);return;}
      // enemy collision
      for(const e of this.enemies){
        if(e.stun>0)continue;
        if(Math.abs(p.x-e.x)<11&&Math.abs(p.y-e.y)<11){this.kill(e.x,e.y);return;}
      }
    }
  },

  updateDemo(dt){ // attract mode: a demo driver collects flags while enemies chase
    this.playT=(this.playT||0)+dt;
    const p=this.player;
    // ambient sparks from scrap piles
    for(const rk of this.rocks){
      const key=rk.c+','+rk.r;
      this.rockSparkT[key]=(this.rockSparkT[key]||Math.random()*FX.ROCK_SPARK_CD)-dt;
      if(this.rockSparkT[key]<=0){
        this.rockSparkT[key]=FX.ROCK_SPARK_CD*(0.5+Math.random());
        this.emit(rk.c*TILE+8+(Math.random()*10-5),rk.r*TILE+8+(Math.random()*10-5),
          2,CYBER.neonRed,0.9,'rock');
      }
    }
    // smoke trail: decay + drift so the trail fades like in real play
    for(let i=p.smoke.length-1;i>=0;i--){
      const s=p.smoke[i];
      s.life-=dt;s.x+=s.vx*dt/16.6;s.y+=s.vy*dt/16.6;
      if(s.life<=0)p.smoke.splice(i,1);
    }
    // smoke and scrap piles affect pursuers — the same visible reactions real play has
    for(const e of this.enemies){
      if(e.stun>0)continue;
      for(const s of p.smoke)
        if(Math.abs(e.x-s.x)<12&&Math.abs(e.y-s.y)<12){e.stun=1500;AudioSys.beep(140,.12,'square',.05);
          this.emit(e.x,e.y,FX.SMOKE_BURST,CYBER.neonCyan,1.4,'smoke');this.shake(0.15);}
      for(const rk of this.rocks)
        if(Math.abs(e.x-(rk.c*TILE+8))<10&&Math.abs(e.y-(rk.r*TILE+8))<10)e.stun=1500;
    }
    // demo crash: occasionally the pack catches the car — play the death beat,
    // then restart the round, like the original arcade attract loop
    if(this.demoDeadT>0){
      this.demoDeadT-=dt;
      for(const e of this.enemies){e.update(dt,p,this.enemies,this.rocks);e.step(dt);}
      // smoldering wreck: keep the plume alive through the whole beat
      if(this.demoWreck){
        this.demoPlumeT-=dt;
        if(this.demoPlumeT<=0){
          this.demoPlumeT=140;
          this.plume(this.demoWreck.x+(Math.random()*14-7),this.demoWreck.y+(Math.random()*14-7),2,0.7);
        }
      }
      if(this.demoDeadT<=0){
        const spec=levelSpec(this.round);
        let bi=0,ti=0;
        for(const e of this.enemies){
          if(e.top){e.setTile(14+ti*2,2);e.dir='down';ti++;}
          else{e.setTile(12+bi*2,53);e.dir=bi%2?'left':'right';bi++;}
        }
        this.player.setTile(16,51);this.player.dir='up';this.player.smoke=[];this.player.smokeCd=0;
        for(const f of this.flags)f.taken=false;this.flagsLeft=10;
        this.demoFlag=null;this.demoStep=null;this.demoRt=0;this.demoWait=0;
        this.demoWreck=null;this.skids=[]; // wreck clears as the round restarts
        this.demoScore=0; // new attract run — the score starts over, like the cabinet
        this.demoDeadT=0; // exact zero — the draw gate tests <=0, negatives hide the car
      }
      return;
    }
    this.demoDeathCd=(this.demoDeathCd||0)-dt;
    if(this.playT>5000&&this.demoDeathCd<=0){
      let hit=null;
      for(const rk of this.rocks)
        if(Math.abs(p.x-(rk.c*TILE+8))<9&&Math.abs(p.y-(rk.r*TILE+8))<9){hit='rock';break;}
      if(!hit)for(const e of this.enemies){
        if(e.stun>0)continue;
        if(Math.abs(p.x-e.x)<11&&Math.abs(p.y-e.y)<11){hit='enemy';break;}
      }
      if(hit){ // crash + respawn beat (occasional — 60–120s between demo deaths)
        this.demoDeathCd=60000+Math.random()*60000;
        this.demoDeadT=1900;
        this.emit(p.x,p.y,FX.KILL_BURST,CYBER.neonMagenta,2.4,'death');
        this.emit(p.x,p.y,14,CYBER.neonYellow,1.2,'death');
        this.dropSkids(p.x,p.y,p.dir);           // tire streaks at the wreck
        this.plume(p.x,p.y,10,1);                // initial smoke cloud
        this.demoWreck={x:p.x,y:p.y};this.demoPlumeT=0; // smolder for the rest of the beat
        this.shake(1);this.flashA=0.45;this.redFlashA=0.55;this.hitStopT=FX.HITSTOP_MS;
        AudioSys.beep(90,.7,'sawtooth',.09,-50);
      }
    }
    // committed flag + short BFS re-step: the flag never changes mid-route (a
    // timer made the car reverse as a different flag became "nearest"), but the
    // next path cell is recomputed from the current position every ~200ms or on
    // arrival, so the car always has a direction and never stalls at a node.
    this.demoRt=(this.demoRt||0)-dt;
    const arrived=this.demoStep&&p.cx===this.demoStep.c&&p.cy===this.demoStep.r;
    // a rock cell is not drivable — the demo routes around scrap piles
    const demoRoad=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS&&this.maze[r][c]!=='X'
      &&!this.rocks.some(rk=>rk.c===c&&rk.r===r);
    if(!this.demoFlag||this.demoFlag.taken){
      const m=this.maze;
      const road=demoRoad;
      let tf=null,bd=1e9;
      for(const f of this.flags){
        if(f.taken)continue;
        const d=Math.abs(f.c-p.cx)+Math.abs(f.r-p.cy);
        if(d<bd){bd=d;tf=f;}
      }
      this.demoFlag=tf;this.demoTarget=tf?{c:tf.c,r:tf.r}:null;
    }
    if((arrived||this.demoRt<=0||!this.demoStep)&&this.demoFlag&&!this.demoFlag.taken){
      this.demoRt=200;
      const tf=this.demoFlag,m=this.maze;
      const road=demoRoad;
      const start=p.cx+','+p.cy;
      let step=null;
      const prev={},seen=new Set([start]),q=[{c:p.cx,r:p.cy}];
      let found=null;
      while(q.length){
        const cur=q.shift();
        if(cur.c===tf.c&&cur.r===tf.r){found=cur;break;}
        for(const[dc,dr]of[[0,-1],[0,1],[-1,0],[1,0]]){
          const nc=cur.c+dc,nr=cur.r+dr,k=nc+','+nr;
          if(road(nc,nr)&&!seen.has(k)){seen.add(k);prev[k]=cur.c+','+cur.r;q.push({c:nc,r:nr});}
        }
      }
      if(found){
        let k=found.c+','+found.r;
        while(prev[k]!==undefined&&prev[k]!==start)k=prev[k];
        const kp=k.split(',').map(Number);
        step={c:kp[0],r:kp[1]};
      }
      this.demoStep=step;
    }
    // steer toward the next path cell (coast through corners, like a real driver)
    let turning=false;
    if(this.demoStep){
      const dc=this.demoStep.c-p.cx,dr=this.demoStep.r-p.cy;
      const want=dc===1?'right':dc===-1?'left':dr===1?'down':dr===-1?'up':null;
      if(want&&want!==p.dir){turning=true;if(!p.tryTurn(want))turning=false;}
    }
    // nearest pursuer — drives the smoke defense
    let threat=1e9;
    for(const e of this.enemies){
      if(e.stun>0)continue;
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<threat)threat=d;
    }
    // steady, slightly slower than the pack: they keep pace and pressure the
    // car, which escapes by cornering and laying smoke — the classic arcade look
    p.smokeCd-=dt;                                               // (demo has no p.update — keep the trail ticking)
    if(threat<64&&p.smokeCd<=0)p.dropSmoke();                    // shake the tail with smoke
    p.step(dt,0.87*(turning?0.9:1));
    for(const e of this.enemies){e.update(dt,p,this.enemies,this.rocks);e.step(dt);}
    // collect flags (juice only — attract mode scores nothing)
    for(const f of this.flags){
      if(f.taken)continue;
      if(Math.abs(p.x-(f.c*TILE+8))<10&&Math.abs(p.y-(f.r*TILE+8))<10){
        const v=Math.min(1000,100*(10-this.flagsLeft+1)); // 100..1000 ramp, same as real play
        f.taken=true;this.flagsLeft--;
        const fx=f.c*TILE+8,fy=f.r*TILE+8;
        this.emit(fx,fy,FX.FLAG_BURST,f.special?'#fff3a0':CYBER.neonYellow,1.6,'flag');
        this.addFloater(fx,fy-8,'+'+v,f.special?'#fff3a0':CYBER.neonYellow,f.special);
        this.demoScore+=v; // attract-run score — ticks up like the cabinet
        this.shake(0.2);
        AudioSys.beep(600+(10-this.flagsLeft)*40,.06,'square',.04);
      }
    }
    // all flags taken → next demo sector after a beat
    if(this.flagsLeft<=0){
      this.demoWait+=dt;
      if(this.demoWait>1600){
        this.demoWait=0;
        this.demoRound=this.demoRound%8+1;
        this.startDemo();
      }
    }
  },

  addScore(v){
    this.score+=v;
    if(this.score>=this.extraAt){this.lives++;this.extraAt+=20000;AudioSys.beep(1000,.25,'square',.09,400);}
  },
  kill(ix,iy){
    if(this.state!==State.PLAY&&this.state!==State.BONUS)return;
    const px=ix!=null?ix:this.player.x, py=iy!=null?iy:this.player.y;
    this.emit(px,py,FX.KILL_BURST,CYBER.neonMagenta,2.4,'death');
    this.emit(px,py,14,CYBER.neonYellow,1.2,'death');
    this.shake(1);this.flashA=0.45;
    this.hitStopT=FX.HITSTOP_MS;
    this.setState(State.DYING);AudioSys.beep(90,.7,'sawtooth',.09,-50);BGM.stop();
  },
  stageClear(){
    // fuel bonus: 10 pts per sliver
    const bonus=Math.floor(this.fuel)*10;
    this.fuelBonus=bonus;this.addScore(bonus);
    // neon confetti burst across the screen
    const cx=this.camX+VIEW_W*TILE/2, cy=this.camY+VIEW_H*TILE/2;
    for(let i=0;i<FX.CLEAR_BURST;i++){
      if(this.particles.length>=FX.MAX_PARTICLES)break;
      const a=Math.random()*Math.PI*2, s=1.5+Math.random()*2.2;
      this.particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.6,life:900+Math.random()*500,max:1400,
        size:1.5+Math.random()*2,color:[CYBER.neonCyan,CYBER.neonMagenta,CYBER.neonPurple,CYBER.neonYellow,CYBER.neonGreen][i%5],kind:'confetti'});
    }
    this.addFloater(cx,cy-10,'FUEL BONUS +'+bonus,CYBER.neonGreen,false);
    this.shake(0.6);this.flashA=0.2;
    this.setState(State.STAGECLEAR);BGM.stop();
    AudioSys.beep(700,.15,'square',.08);setTimeout(()=>AudioSys.beep(900,.15,'square',.08),160);
    setTimeout(()=>AudioSys.beep(1200,.2,'square',.09),320);
  },
  endGame(){
    BGM.stop();
    this.highScores.push({score:this.score,round:this.round,diff:this.DIFFS[this.diff].name,date:new Date().toISOString().slice(0,10)});
    this.highScores.sort((a,b)=>b.score-a.score);
    this.highScores=this.highScores.slice(0,10);
    try{localStorage.setItem('rallyz_scores',JSON.stringify(this.highScores));}catch(e){}
    this.setState(State.GAMEOVER);
  },

/* ================= RENDERING ================= */
  render(){
    const x=this.ctx,S=this.scale;
    x.setTransform(S,0,0,S,0,0);
    x.fillStyle='#000';x.fillRect(0,0,SCREEN_W,SCREEN_H);
    switch(this.state){
      case State.TITLE:this.drawTitle(x);break;
      case State.MENU:this.drawMenu(x);break;
      case State.DIFF:this.drawDiff(x);break;
      case State.HOWTO:this.drawHowto(x);break;
      case State.SCORES:this.drawScores(x);break;
      case State.GAMEOVER:this.drawGameOver(x);break;
      default:this.drawWorld(x);
    }
    // CRT finish: scanlines + vignette
    x.save();
    x.globalAlpha=CYBER.scanAlpha;
    x.fillStyle='#000';
    for(let y=0;y<SCREEN_H;y+=2)x.fillRect(0,y,SCREEN_W,1);
    x.globalAlpha=1;
    const vg=x.createRadialGradient(SCREEN_W/2,SCREEN_H/2,SCREEN_H*0.42,SCREEN_W/2,SCREEN_H/2,SCREEN_H*0.85);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,10,.28)');
    x.fillStyle=vg;x.fillRect(0,0,SCREEN_W,SCREEN_H);
    x.restore();
  },

  /* auto-fit a centered label to a max width so text never overflows its frame */
  textFit(x,text,cx,y,base,maxW,minS,bold){
    const F='"Cascadia Mono","SF Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace';
    let fs=base;

  drawWorld(x){
    const th=this.themeFor(this.round);
    const p=this.player;

    const tx=p?p.x:COLS*TILE/2, ty=p?p.y:ROWS*TILE/2;

    this.camY=clamp(ty-(this.demo?VIEW_H*TILE*0.62:VIEW_H*TILE/2),0,ROWS*TILE-VIEW_H*TILE);

    if(!this.demo){
    // neon score bar

    x.fillStyle=CYBER.bg;x.fillRect(this.camX,this.camY,VIEW_W*TILE,VIEW_H*TILE);

      const wx=((st.x-this.camX*st.par)%(COLS*TILE)+COLS*TILE)%(COLS*TILE);
      const wy=((st.y-this.camY*st.par)%(ROWS*TILE)+ROWS*TILE)%(ROWS*TILE);
      if(wx<this.camX||wx>this.camX+VIEW_W*TILE||wy<this.camY||wy>this.camY+VIEW_H*TILE)continue;
      const tw=0.35+0.65*Math.abs(Math.sin(performance.now()/900*st.tw+st.ph));
      x.fillStyle='rgba(190,215,255,'+(0.5*tw*st.s).toFixed(2)+')';
      x.fillRect(wx,wy,st.s,st.s);
    }
    // roads: asphalt with faint neon grid
    const c0=Math.floor(this.camX/TILE),r0=Math.floor(this.camY/TILE);
    for(let r=r0;r<=r0+VIEW_H;r++)for(let c=c0;c<=c0+VIEW_W;c++){

    x.stroke();
    // walls: beveled neon-edged blocks
    for(let r=r0;r<=r0+VIEW_H;r++)for(let c=c0;c<=c0+VIEW_W;c++){
      if(c<0||c>=COLS||r<0||r>=ROWS)continue;

      g.addColorStop(0,'rgba(90,120,255,.28)');g.addColorStop(.35,'rgba(30,40,110,.12)');g.addColorStop(1,'rgba(0,0,0,.35)');
      x.fillStyle=g;x.fillRect(px,py,TILE,TILE);

      x.fill();
      x.shadowBlur=0;
      x.fillStyle='rgba(230,248,255,.85)';
      x.beginPath();

      x.fill();
      x.globalAlpha=1;
    }
    // tire skid streaks at crash sites (world space, under the cars)
    for(const s of this.skids){
      const a=Math.pow(s.life/s.max,1.4)*0.5;
      x.globalAlpha=a;
      x.fillStyle='#0b0d1c';
      x.save();x.translate(s.x,s.y);x.rotate(s.rot);

    // particles (world space)
    for(const pt of this.particles){

        const r=pt.size*(2.4-a*1.3), al=a*a*0.55;
        const g=x.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,r);
        g.addColorStop(0,'rgba(38,42,64,'+al.toFixed(3)+')');

    x.fillStyle='rgba(0,229,255,.12)';x.fillRect(rx+2,ry+2,rw-4,1);
    // radar map scaled to fit (height adapts so the gauge + info block always fits)

    x.strokeStyle='rgba(0,229,255,.25)';x.strokeRect(mx+.5,my+.5,COLS*TILE*sc-1,ROWS*TILE*sc-1);
    // radar grid
    x.strokeStyle='rgba(0,229,255,.06)';x.lineWidth=1;x.beginPath();
    for(let i=1;i<8;i++){x.moveTo(mx+i*(COLS*TILE*sc)/8,my);x.lineTo(mx+i*(COLS*TILE*sc)/8,my+ROWS*TILE*sc);}
    for(let i=1;i<8;i++){x.moveTo(mx,my+i*(ROWS*TILE*sc)/8);x.lineTo(mx+COLS*TILE*sc,my+i*(ROWS*TILE*sc)/8);}
    x.stroke();
    const blink=Math.floor(performance.now()/250)%2; // 4Hz strobe clock
    for(const f of this.flags){

      if(this.fuel/this.fuelMax<0.25){

          x.fillRect(cxr-2.5,cyr-2.5,5,5);x.shadowBlur=0;

        }else{
          x.fillStyle='rgba(60,255,138,.22)';x.fillRect(cxr-1,cyr-1,2,2);
        }
      }else{
        x.fillStyle=blink?'#3cff8a':'#b8ffdd';
        x.fillRect(cxr-1,cyr-1,2,2);
      }
    }
    if(p&&blink){x.fillStyle='#fff';x.fillRect(mx+p.x*sc-1.5,my+p.y*sc-1.5,3,3);}
    // power (fuel) gauge: segmented LEDs on a dark slot track
    const fy=my+ROWS*TILE*sc+9;
    x.fillStyle='rgba(0,229,255,.10)';x.fillRect(rx+4,my+ROWS*TILE*sc+4,rw-8,1); // section divider
    x.fillStyle='#8fd3ff';x.font='bold 10px "Cascadia Mono","SF Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace';
    x.fillText('PWR',rx+8,fy);
    const bw=rw-16,frac=clamp(this.fuel/this.fuelMax,0,1);
    const segs=16,sw=(bw-2*(segs-1))/segs,lit=Math.ceil(frac*segs);

    for(let i=0;i<segs;i++){
      const on=i<lit&&!flash;
      x.fillStyle=on?(low?CYBER.neonRed:CYBER.player):'rgba(10,16,40,.9)';
      if(on){x.shadowColor=x.fillStyle;x.shadowBlur=4;}

      x.shadowBlur=0;
    }
    // strobe: the LOW POWER text lights on the opposite phase of the gauge (the

      x.scale(0.55,0.55);

      x.restore();
    }

    x.fillStyle='#8fa6d6';x.fillText('SECTOR '+String(this.round).padStart(2,'0'),rx+8,fy+62);
    }

    // overlays during play states

    if(this.state===State.READY){
      x.fillStyle='rgba(2,3,10,.6)';x.fillRect(0,26,VIEW_W*TILE,VIEW_H*TILE);
      x.font='bold 22px "Cascadia Mono","SF Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace';
      x.shadowColor=this.challenge?CYBER.neonMagenta:CYBER.neonCyan;x.shadowBlur=6;
      x.fillStyle=this.challenge?CYBER.neonMagenta:CYBER.neonYellow;
      x.fillText(this.challenge?'CHARGE STAGE':'SECTOR '+this.round,VIEW_W*TILE/2,SCREEN_H/2-8);
      x.shadowBlur=0;
      x.font='bold 12px "Cascadia Mono","SF Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace';x.fillStyle='#eef4ff';

      x.fillText('PAUSED',SCREEN_W/2,SCREEN_H/2-12);x.shadowBlur=0;
      x.font='12px "Cascadia Mono","SF Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace';x.fillStyle='#b9c6e8';
      x.fillText('ENTER / P RESUME \u00b7 ESC QUIT',SCREEN_W/2,SCREEN_H/2+16);

  },
  drawCar(x,car,body,dark,spinning,spinPhase,trim){
    /* slim cyber rally racer: thin pod body + top-down tires that FIT the
       16px lanes (total width ~14px). Neon bead tires, roof lightbar,
       fog-lamp bumper, rear wing, roll-cage windshield. `trim` (defaults to
       body) recolors the accent strips for distinct liveries. */
    x.save();

    x.rotate(ang);

    x.globalAlpha=1;

    // TOP-DOWN TIRES — wide flat footprints with tread, tucked to lane width
    const tire=(tx,ty)=>{
      x.fillStyle='#0d1016';
      rr(tx-2.9,ty-2.4,5.8,4.8,1.8);x.fill();
      // crown/shoulder light on both long edges — reads as a top surface
      x.fillStyle='rgba(255,255,255,.10)';
      rr(tx-2.9,ty-2.4,5.8,1.0,1.8);x.fill();
      rr(tx-2.9,ty+1.4,5.8,1.0,1.8);x.fill();
      // circumferential tread grooves + block dashes (top-down tread)
      x.fillStyle='rgba(0,0,0,.55)';
      x.fillRect(tx-2.9,ty-.9,5.8,.45);x.fillRect(tx-2.9,ty+.45,5.8,.45);
      x.fillStyle='rgba(255,255,255,.06)';
      for(let i=-1;i<=1;i++){x.fillRect(tx+i*1.5-.28,ty-1.5,.55,.55);x.fillRect(tx+i*1.5-.28,ty+.95,.55,.55);}
    };
    tire(4.6,-4.4);tire(4.6,4.4);tire(-5.3,-4.4);tire(-5.3,4.4);
    // dark fender flares over each tire's outer edge (ties them to the pod)

    rr(1.7,-6.9,5.8,2.0,1.5);x.fill(); rr(1.7,4.9,5.8,2.0,1.5);x.fill();
    rr(-8.2,-6.9,5.8,2.0,1.5);x.fill(); rr(-8.2,4.9,5.8,2.0,1.5);x.fill();
    // neon bead rings around each tire's top-down footprint (trim accent)

    // main hull — thin angular rally pod
    x.fillStyle=body;
    x.beginPath();

    x.lineTo(0.7,-3.9);

    x.lineTo(-2.9,-3.3);

    x.lineTo(-1.7,3.1);
    x.lineTo(0.7,3.9);
    x.lineTo(4.8,2.6);
    x.closePath();x.fill();
    // neon light-bleed along the hull silhouette
    x.strokeStyle=body;x.lineWidth=.7;x.shadowColor=body;x.shadowBlur=5;
    x.stroke();x.shadowBlur=0;
    // hood: highlight + vents + twin racing stripes
    x.fillStyle='rgba(255,255,255,.22)';
    x.fillRect(0.5,-2.9,3.3,.85);

    x.fillStyle=trimC;   // livery racing stripes

    x.fillRect(-3.0,-4.3,2.2,.35);      // scoop neon lip
    x.shadowBlur=0;
    // rear wing with endplates + struts
    x.fillStyle=dark;
    rr(-9.9,-4.1,2.6,.68,0);x.fill();            // wing plane
    x.fillStyle='rgba(0,0,0,.45)';
    x.fillRect(-9.9,-4.45,.4,1.4);x.fillRect(-7.3,-4.45,.4,1.4); // endplates
    x.fillRect(-9.2,-3.45,.45,.95);x.fillRect(-8.1,-3.45,.45,.95); // struts
    x.fillStyle=trimC;x.shadowColor=trimC;x.shadowBlur=5;
    x.fillRect(-9.9,-4.2,2.6,.3);       // wing neon edge
    x.shadowBlur=0;
    // rear tail light bar
    x.fillStyle='rgba(255,70,70,.85)';x.shadowColor='#ff4646';x.shadowBlur=4;
    x.fillRect(-7.6,-2.1,.7,4.2);x.shadowBlur=0;
    // side intakes + neon side skirts
    x.fillStyle='rgba(0,0,0,.5)';
    x.fillRect(-4.4,-2.8,2.2,.8);x.fillRect(-4.4,2.0,2.2,.8);
    x.fillStyle=trimC;x.shadowColor=trimC;x.shadowBlur=5;
    x.fillRect(-6.8,-2.2,.6,4.4);
    x.fillRect(2.6,-2.8,.5,5.6);
    x.shadowBlur=0;
    // fog-lamp bumper pod on the nose (Group-B signature)
    x.fillStyle='#0c0e14';
    rr(4.8,-2.2,2.2,4.4,1);x.fill();
    x.fillStyle=trimC;x.shadowColor=trimC;x.shadowBlur=5;
    x.fillRect(5.05,-2.0,.4,4.0);x.shadowBlur=0;   // bumper neon strip
    x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=5;
    x.fillRect(5.6,-1.55,1.05,1.15);x.fillRect(5.6,.4,1.05,1.15);  // twin headlights
    x.fillStyle='#ffd76a';
    x.fillRect(5.6,-.55,1.05,1.15);                          // center fog lamp
    x.shadowBlur=0;
    // headlight cone
    x.save();
    x.translate(7.0,0);
    const cone=x.createLinearGradient(0,0,6.5,0);
    cone.addColorStop(0,'rgba(255,255,255,.28)');cone.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=cone;
    x.beginPath();x.moveTo(0,-2.1);x.lineTo(6.5,-3.1);x.lineTo(6.5,3.1);x.lineTo(0,2.1);x.closePath();x.fill();
    x.restore();
    // rear engine block + twin exhaust wash (flickering)
    x.fillStyle='#0c0e14';
    x.fillRect(-7.9,-2.6,1.15,5.2);
    const pulse=.5+.5*Math.sin(now/80+car.x);
    const eg=x.createLinearGradient(-7.7,0,-12,0);
    eg.addColorStop(0,body);eg.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=.35+.55*pulse;
    x.fillStyle=eg;
    x.fillRect(-12,-2.1,4.3,4.2);
    x.fillStyle='#fff';x.fillRect(-8.2,-1.4,1.15,1.0);x.fillRect(-8.2,.4,1.15,1.0);
    x.globalAlpha=1;
    x.restore();
  },
  drawFlag(x,fx,fy,special){
    /* golden tribute to the original yellow flags — crisp, no halo bleed */
    const gold='#ffd94a', hot=special?'#fff3a0':'#ffdf66';
    const now=performance.now();
    x.save();
    x.fillStyle='#8a6d2a';           // brass pole
    x.fillRect(fx-1,fy-7,2,13);
    // blinking lamp (bright core only — no glow bleed)
    x.fillStyle=Math.floor(now/(special?150:220))%2?'#fff':hot;
    x.beginPath();x.arc(fx,fy-7,2.4,0,7);x.fill();
    // golden pennant with highlight
    x.fillStyle=hot;
    x.beginPath();x.moveTo(fx+2,fy-7);x.lineTo(fx+7.5,fy-4.6);x.lineTo(fx+2,fy-2.2);x.closePath();x.fill();
    x.fillStyle='rgba(255,255,255,.4)';
    x.beginPath();x.moveTo(fx+2.3,fy-6.6);x.lineTo(fx+6,fy-5);x.lineTo(fx+2.3,fy-3.4);x.closePath();x.fill();
    if(special){
      x.fillStyle='#3a2c00';x.font='bold 7px monospace';x.fillText('S',fx+2.5,fy-4);
    }
    x.restore();
  },
  drawPowerup(x,fx,fy,t){
    /* PWR cell: glowing fuel canister — refills the tank */
    x.save();x.translate(fx,fy);
    const now=performance.now();
    const pulse=.5+.5*Math.sin(now/180+fx);
    // green glow pool
    const g=x.createRadialGradient(0,0,1,0,0,9);
    g.addColorStop(0,CYBER.neonGreen);g.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=.35+.25*pulse;
    x.fillStyle=g;x.beginPath();x.arc(0,0,9,0,7);x.fill();
    x.globalAlpha=1;
    // canister body
    x.fillStyle='#0d1220';
    x.beginPath();
    if(x.roundRect)x.roundRect(-4,-6,8,13,2.5);else x.rect(-4,-6,8,13);
    x.fill();
    x.strokeStyle='rgba(120,170,255,.4)';x.lineWidth=.8;x.stroke();
    // sloshing neon fuel
    const frac=.55+.3*pulse, lh=11*frac;
    const lg=x.createLinearGradient(0,5,0,5-lh);
    lg.addColorStop(0,'rgba(60,255,138,.95)');lg.addColorStop(1,'rgba(160,255,220,.95)');
    x.fillStyle=lg;x.shadowColor=CYBER.neonGreen;x.shadowBlur=5;
    x.fillRect(-3.4,5-lh,6.8,lh);
    x.shadowBlur=0;
    // top cap + blinking lamp
    x.fillStyle='#3a3f5e';x.fillRect(-4.4,-7,8.8,1.6);
    x.fillStyle=Math.floor(now/160)%2?'#fff':'#aaffdd';
    x.shadowColor=CYBER.neonGreen;x.shadowBlur=6;
    x.beginPath();x.arc(0,-8,1.8,0,7);x.fill();
    x.shadowBlur=0;
    // remaining-life arc (shrinks as the cell fades)
    const ft=clamp(1-t/POWERUP.DUR,0,1);
    x.strokeStyle=CYBER.neonGreen;x.lineWidth=1;
    x.globalAlpha=.5+.5*pulse;
    x.beginPath();x.arc(0,0,7.5,-Math.PI/2,-Math.PI/2+ft*Math.PI*2);x.stroke();
    x.globalAlpha=1;
    x.restore();
  },
  drawRock(x,rx,ry){
    /* cyber scrap pile: angular debris, chevrons, energy core — no ring */
    x.save();x.translate(rx,ry);
    const now=performance.now();
    const pulse=.5+.5*Math.sin(now/280+rx);
    // angular scrap body (fixed irregular octoid per-position)
    const seed=Math.floor(rx*13.37+ry*7.77);
    const rnd=i=>{const s=(seed*9301+i*49297)%233280;return s/233280;};
    x.fillStyle='#1a1b2c';
    x.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4, rad=5.5+rnd(i)*2.5-1;
      i?x.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):x.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);
    }
    x.closePath();x.fill();
    x.strokeStyle='rgba(120,130,185,.5)';x.lineWidth=.8;x.stroke();
    // lit top-left facet
    x.fillStyle='#3a3f5e';
    x.beginPath();
    for(let i=6;i<10;i++){
      const a=i*Math.PI/4, rad=4.6+rnd(i+8)*1.4-0.7;
      i===6?x.moveTo(Math.cos(a)*rad,Math.sin(a)*rad):x.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
    }
    x.closePath();x.fill();
    // hazard chevrons
    x.strokeStyle=CYBER.neonRed;x.lineWidth=1.1;
    x.shadowColor=CYBER.neonRed;x.shadowBlur=4;
    x.beginPath();
    x.moveTo(-4.8,3.6);x.lineTo(-2.8,1.4);x.lineTo(-0.8,3.6);
    x.moveTo(1.4,3.9);x.lineTo(3.4,1.7);x.lineTo(5.4,3.9);
    x.stroke();x.shadowBlur=0;
    // glowing energy core
    x.fillStyle='rgba(255,110,60,'+(0.55+0.45*pulse).toFixed(3)+')';
    x.shadowColor=CYBER.neonRed;x.shadowBlur=6+5*pulse;
    x.beginPath();x.arc(1.2,-1.2,1.9,0,7);x.fill();
    x.fillStyle='rgba(255,225,190,.9)';
    x.beginPath();x.arc(1.2,-1.2,.8,0,7);x.fill();
    x.shadowBlur=0;
    x.restore();
  }
};

/* ===== global text contrast: dark outline behind every fillText ===== */
(()=>{
  const orig=CanvasRenderingContext2D.prototype.fillText;
  CanvasRenderingContext2D.prototype.fillText=function(t,x,y,maxW){
    const fs=parseFloat(this.font)||12;
    if(!this._skipOutline){
      const lw=Math.max(1,Math.min(5,Math.round(fs*0.13)));
      this.save();
      this.lineJoin='round';
      this.lineWidth=lw;
      this.strokeStyle='rgba(0,0,0,.82)';
      this.shadowBlur=0; // keep the outline clean; glow comes from the fill pass
      this.strokeText(t,x,y,maxW);
      this.restore();
    }
    return orig.call(this,t,x,y,maxW);
  };
})();

/* ================= BOOT ================= */
window.addEventListener('load',()=>{
  Game.init();
  // tap anywhere on title/menus = confirm (mobile)
  document.getElementById('wrap').addEventListener('pointerdown',()=>{
    AudioSys.init();
    Game._tapPending=false;
    if(Game.state===State.TITLE){Game.setState(State.MENU);AudioSys.beep(700,.08);}
    else if(Game.state===State.MENU)Game.newGame();
    else if(Game.state===State.GAMEOVER)Game.toTitle();
    else if(Game.state===State.HOWTO||Game.state===State.SCORES)Game.setState(State.MENU);
    else if(Game.state===State.DIFF){Game.diff=Game.diffIdx;Game.setState(State.MENU);}
  });
});

/* mobile baseline: visualViewport resize handled in init; clean exit */
function cleanExit(){
  try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
  document.body.style.overflow='';document.documentElement.style.overflow='';
}
window.addEventListener('pagehide',cleanExit);
window.addEventListener('beforeunload',cleanExit);
