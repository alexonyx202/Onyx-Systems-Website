      // Sawtooth carrier with a square LFO warble (two-tone alarm) plus a
      // square tremolo on the gain (choppy, digital). sirenCorrupt() glitches
      // it while the viruses are frightened.

        sirenOsc = actx.createOscillator();
        sirenOsc.type = 'sawtooth';

        sirenLFO = actx.createOscillator(); sirenLFO.type = 'square';
        sirenLFO.frequency.value = 1.6;
        sirenLfoGain = actx.createGain(); sirenLfoGain.gain.value = 55;
        sirenLFO.connect(sirenLfoGain); sirenLfoGain.connect(sirenOsc.frequency);
        // amplitude tremolo: square LFO into the gain (digital flutter)
        sirenGain = actx.createGain(); sirenGain.gain.value = 0.05;
        sirenTrem = actx.createOscillator(); sirenTrem.type = 'square';
        sirenTrem.frequency.value = 2.2;
        sirenTremGain = actx.createGain(); sirenTremGain.gain.value = 0.018;
        sirenTrem.connect(sirenTremGain); sirenTremGain.connect(sirenGain.gain);
        sirenOsc.connect(sirenGain); sirenGain.connect(master);
        sirenOsc.start(t0); sirenLFO.start(t0); sirenTrem.start(t0);
      },
      stopSiren() {
        try {
          if (sirenOsc) sirenOsc.stop();
          if (sirenLFO) sirenLFO.stop();
          if (sirenTrem) sirenTrem.stop();
        } catch (e) {}
        if (corruptInt) { clearInterval(corruptInt); corruptInt = null; }
        corrupt = false;
        sirenOsc = sirenLFO = sirenLfoGain = sirenGain = sirenTrem = sirenTremGain = null;
      },

      // Corrupt the siren while the viruses are frightened: random pitch
      // jolts, gain stutter, and bursts of static. Safe to call every frame —
      // only transitions do work. No-ops when the siren isn't running.
      sirenCorrupt(on) {
        const want = !!on;
        if (want === corrupt) return;
        // Guard BEFORE flipping the flag: if corruption is requested while the
        // siren is down, leave the flag clean — otherwise a later startSiren()
        // would see corrupt=true, hit the early-return, and the interval would
        // never start (the siren stays normal for the whole fright).
        if (want && (!actx || !sirenOsc)) return;
        corrupt = want;

          corruptInt = setInterval(() => {
            if (!actx || !sirenOsc || muted) return;

            sirenOsc.frequency.setTargetAtTime(sirenFreq * (0.5 + Math.random() * 0.35), t0, 0.03);

            sirenGain.gain.setTargetAtTime(0.015 + Math.random() * 0.05, t0, 0.02);
            // occasional static pops
            if (Math.random() < 0.45) staticBurst(0.045, 0.05, t0);
          }, 110);
        } else {
          if (corruptInt) { clearInterval(corruptInt); corruptInt = null; }
          if (sirenOsc && sirenGain) {
            const t0 = actx.currentTime;
            sirenOsc.frequency.setTargetAtTime(sirenFreq, t0, 0.06);
            sirenGain.gain.setTargetAtTime(0.05, t0, 0.06);

  }

  // engine records each board clear (campaign runs only) and fires

  const BT_KEY = 'bitbyte.besttimes';
  function loadBestTimes() {
    const arr = new Array(10).fill(null);
    try {
      const raw = localStorage.getItem(BT_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') {
          for (let i = 0; i < 10; i++) {
            const v = obj[i];
            if (typeof v === 'number' && isFinite(v) && v > 0 && v < 3600) arr[i] = v;
          }

  }

        if (o.presets && typeof o.presets === 'object') {

          d.presets = { classic: o.preset, craze: o.preset };

        for (const c of ['classic', 'craze']) {

  // ---- Difficulty presets (start screen) -------------------------------
  // EASY / NORMAL / HARD bake the per-campaign ghost-speed + release
  // percents; CUSTOM means the player tuned the DIFFICULTY page themselves
  // (the stored percents are then the source of truth). Cycling a preset on
  // the start-screen strip applies + persists it instantly, and a slider
  // tweak on the pause DIFFICULTY page flips the preset back to CUSTOM so

  // — loadOpts applies the baked preset's percents at boot, and a const in

  const PRESET_ORDER = ['EASY', 'NORMAL', 'HARD', 'CUSTOM'];

  }

  // player to confirm them on the ENTER YOUR INITIALS screen.
  let lastInitials = 'AAA';

  const SCAN_URL = '';   // TODO: set your deployed URL, e.g. 'https://site/games/bit-byte/'

    switch (ev) {

  // ---- Layout-proof key matching (the full-keyboard audit) --------------
  // isEnter is the template. Arrow keys and Space are universal (every layout
  // reports the same e.key value, and numpad navigation with NumLock OFF also
  // reports the arrow key values), and Escape is identical in key and code on
  // every layout — those need nothing. But LETTER and DIGIT bindings are
  // layout-sensitive: on AZERTY/QWERTZ/Dvorak the printed character on a

  //   * keyDigit() — top-row digits by key AND physical DigitN code. Numpad

  //   * isSpace() — ' ' (or legacy 'Spacebar') by key, 'Space' by code.
  function dirFrom(e) {

    if (e.key === 'ArrowDown' || e.code === 'ArrowDown') return 'DOWN';
    if (e.key === 'ArrowLeft' || e.code === 'ArrowLeft') return 'LEFT';
    if (e.key === 'ArrowRight' || e.code === 'ArrowRight') return 'RIGHT';
    if (e.key === 'w' || e.key === 'W' || e.code === 'KeyW') return 'UP';
    if (e.key === 's' || e.key === 'S' || e.code === 'KeyS') return 'DOWN';
    if (e.key === 'a' || e.key === 'A' || e.code === 'KeyA') return 'LEFT';

  }

  let pauseSel = 0;        // pause-menu row on the CURRENT page
  let pausePage = 0;       // 0 = main (RESUME/REBOOT/QUIT/SOUND & DISPLAY),

  // treats the deferred call as user-activated (sticky gesture).
  let audioKicked = false;

        if (introPending && Audio.canPlay() && game.state === 'ready') { Audio.intro(); introPending = false; }

  }
  function safeAudio(fn) { try { fn(); } catch (e) { /* never let audio break input */ } }

  // score into the HUD. PRACTICE has no high score (it's pressure-free), so
  // the HUD high starts at 0 and can never be written.
  function beginRun() {
    // The difficulty strip (menuSel 3) is a tuning row, not a game mode —
    // starting from it falls back to the last highlighted campaign.
    if (game.menuSel === 3) game.menuSel = 0;
    // A fresh run supersedes the saved CONTINUE checkpoint (the new run's own
    // deaths/clears will re-arm it).
    savedRun = null; clearSavedRun();

  }

  // Snapshot the live run for the title-screen CONTINUE row. Only captures
  // real campaign/practice runs (the attract demo and pure menu states are
  // guarded by the engine's snapshot()), and only from a live run state.
  function captureRun() {
    if (game.attract) return;
    const snap = game.snapshot();
    if (!snap) return;
    savedRun = snap;
    saveRun(snap);
  }
  // Resume the saved run. Consumes the checkpoint (arcade insert-coin
  // semantics — one continue per run; the next death/clear re-arms it).
  function continueRun() {
    if (!savedRun) return;
    if (!game.resume(savedRun)) { savedRun = null; clearSavedRun(); return; }
    savedRun = null; clearSavedRun();   // consumed — a fresh checkpoint re-arms
    game.highScore = game.mode === 'practice' ? 0 : loadHS(game.mode);
    prevState = game.state;
    readyBuffer = null;
    kickAudio();
    prewarm();
  }

  // P mid-run opens a five-page PCB panel instead of silently freezing:
  // page 0 = RESUME / REBOOT / QUIT TO TITLE / SOUND & DISPLAY / HOW TO
  // PLAY / RESET HIGH SCORES, page 1 = the SOUND & DISPLAY options (MUTE /
  // SIREN / CRT EFFECT / BRIGHTNESS / DIFFICULTY / BACK), page 2 = the HOW
  // TO PLAY quick-start card, page 3 = the DIFFICULTY page (per-campaign
  // ghost-speed + release sliders and the virus-retreat toggle), page 4 =
  // the RESET HIGH SCORES confirm (ERASE / CANCEL, then a WIPED confirmation
  // with BACK). The sim stops stepping while paused; the renderer draws the
  // panel (its own wall-time blink) and main.js drives the selection +
  // option values.
  const RUN_STATES = ['ready', 'play', 'death', 'intermission'];
  // Rows on the CURRENT page: 6 on the main page, 6 on the options and
  // difficulty pages, 1 on the help card (its BACK row), 2 on the reset
  // confirm (ERASE / CANCEL) — 1 on its WIPED confirmation (BACK).
  function pauseRows() {
    if (pausePage === 0) return 6;

    if (paused) { paused = false; pausePage = 0; pauseResetDone = false; return; }
    if (RUN_STATES.indexOf(game.state) >= 0) { pauseSel = 0; pausePage = 0; pauseResetDone = false; pauseReason = 'player'; paused = true; gpHoldB = null; }
  }
  function pauseMove(d) {
    pauseSel = Math.max(0, Math.min(pauseRows() - 1, pauseSel + d));
  }

  // 50..150). No-op on the main/help pages.
  function pauseToggleValue(d) {
    if (!paused) return;

      else if (pauseSel === 1) setOpt({ siren: !opts.siren });
      else if (pauseSel === 2) setOpt({ crt: !opts.crt });
      else if (pauseSel === 3) setOpt({ brightness: (opts.brightness + d + 3) % 3 });

  function wipeHighScores() {

    // guard uses the same value), not a second copy here.
    if (game.state === 'gameover' && game.pendingInitials && game.pendingInitialsTimer > 0) {
      game.pendingInitialsTimer = 0;
      game.beginInitials(game.pendingInitialsLetters);
      kickAudio();
      return true;
    }
    return false;
  }

  // ---- Attract mode (classic arcade-cabinet demo) -----------------------
  // After ATTRACT_DELAY seconds idle on the start screen, the game plays
  // itself (ghostless AI, muted) until any input returns to the menu.
  // ?attract=N overrides the delay (QA / demos).
  const ATTRACT_DELAY = Math.max(1, parseInt(new URLSearchParams(location.search).get('attract'), 10) || 30);
  let idleTime = 0;
  function startAttractDemo() {
    game.startAttract(); prevState = game.state;
    prewarm();   // build the demo board's maze cache before the first frame
  }
  function resetIdle() { idleTime = 0; }
  // Any input exits the demo and lands back on the menu; the same gesture
  // still works afterwards (Enter starts a run, arrows move the selection).
  function exitAttract() {
    if (game.attract) { game.stopAttract(); prevState = game.state; }
    resetIdle();
  }

  window.addEventListener('keydown', (e) => {
    exitAttract();   // first: any key aborts the attract demo
    // ---- Pause menu: Up/Down (or W/S) select, Left/Right (or A/D) change a
    // value on the options page, Enter/Space/1-N activate, P or ESC backs out
    // or resumes. Intercepts steering so the menu owns the keys while the
    // sim is frozen.
    if (paused) {
      const d = dirFrom(e);
      if (d === 'UP' || d === 'DOWN') { pauseMove(d === 'DOWN' ? 1 : -1); kickAudio(); e.preventDefault(); return; }
      if (d === 'LEFT' || d === 'RIGHT') { if (pausePage === 1 || pausePage === 3) { pauseToggleValue(d === 'RIGHT' ? 1 : -1); kickAudio(); } e.preventDefault(); return; }
      if (isEnter(e) || isSpace(e)) { kickAudio(); pauseActivate(); e.preventDefault(); return; }
      // digit shortcuts: 1-6 on the main/options pages, 1 on the help/reset pages
      const num = keyDigit(e);
      if (num !== null && num >= 1 && num <= pauseRows()) { pauseSel = num - 1; kickAudio(); pauseActivate(); e.preventDefault(); return; }
      // M still mutes from the pause menu (the menu is modal, not the sound).
      if (e.key === 'm' || e.key === 'M' || e.code === 'KeyM') { kickAudio(); setOpt({ muted: !opts.muted }); e.preventDefault(); return; }
      // P / ESC back out or resume (Escape's key+code are identical on every
      // layout, so a plain key check is safe there).
      if (e.key === 'p' || e.key === 'P' || e.code === 'KeyP' || e.key === 'Escape') { kickAudio(); pauseEsc(); e.preventDefault(); return; }
      e.preventDefault();
      return;
    }
    // ESC leaves PRACTICE MODE back to the menu (its REBOOT button does too).
    // Escape is universal: key and code are 'Escape' on every layout.
    if (e.key === 'Escape') {
      if (game.practice) { game.stopPractice(); prevState = game.state; }
      e.preventDefault();
      return;
    }
    // Arcade ENTER YOUR INITIALS: Up/Down cycle the letter, Left/Right move
    // the slot, ENTER / SPACE confirm (joystick + keyboard — authentic).
    if (game.state === 'initials') {
      const d = dirFrom(e);
      if (d === 'UP' || d === 'DOWN') { game.initialsCycle(d === 'UP' ? 1 : -1); e.preventDefault(); }
      else if (d === 'LEFT' || d === 'RIGHT') { game.initialsMove(d === 'LEFT' ? -1 : 1); e.preventDefault(); }
      else if (isEnter(e) || isSpace(e)) { kickAudio(); confirmInitials(); e.preventDefault(); }
      kickAudio();
      return;
    }
    if (game.state === 'title') {
      // mode-select menu: arrows / 1-N move the highlight, ENTER / SPACE
      // start. The 3rd strip is the DIFFICULTY preset row — on it, LEFT/
      // RIGHT (and ENTER) cycle EASY/NORMAL/HARD/CUSTOM instead of starting
      // or switching modes. When a saved run exists, a 5th row (CONTINUE)
      // appears below it (menuSel 4) and resumes the run on ENTER.
      const menuMax = savedRun ? 4 : 3;   // CONTINUE row only when a run is saved
      const d = dirFrom(e);
      if (d === 'LEFT' || d === 'RIGHT') {
        if (game.menuSel === 3) cyclePreset(d === 'LEFT' ? -1 : 1);   // strip: cycle the preset
        else game.menuSelect(d === 'LEFT' ? -1 : 1);
        kickAudio(); e.preventDefault(); return;
      }
      if (d === 'UP' || d === 'DOWN') {
        // Up/Down step through the entries (cards <-> practice <-> difficulty <-> continue)
        game.menuSel = d === 'DOWN' ? Math.min(menuMax, game.menuSel + 1) : Math.max(0, game.menuSel - 1);
        kickAudio(); e.preventDefault(); return;
      }
      const num = keyDigit(e);
      if (num !== null && num >= 1 && num <= menuMax + 1) { game.menuSel = num - 1; kickAudio(); e.preventDefault(); return; }
      if (isEnter(e) || isSpace(e)) {
        if (game.menuSel === 3) cyclePreset(1);   // Enter on the strip cycles the preset
        else if (game.menuSel === 4) continueRun();   // Enter on CONTINUE resumes the saved run
        else beginRun();
        kickAudio(); e.preventDefault(); return;
      }
    }
    // S on the GAME-OVER screen = share the score card to the clipboard.
    // Checked before the steering block because S is also a steering key
    // (dirFrom maps it to DOWN) — on the game-over screen steering is dead
    // (the beat-skip lives on the arrows), so S is free for sharing.
    if (game.state === 'gameover' && (e.key === 's' || e.key === 'S' || e.code === 'KeyS')) {
      kickAudio(); shareScoreCard(); e.preventDefault(); return;
    }
    // Steering (play/ready): ONE shared mapping — dirFrom matches arrows by
    // key+code and WASD by key AND physical code, so steering works on every
    // layout (AZERTY players get native ZQSD) through the same code path as
    // the menus. A lone layout-specific key with no matching code (e.g. 'z'
    // on KeyZ) steers nothing.
    const dir = dirFrom(e);
    if (dir) {
      // A direction during the qualifying game-over beat skips ahead to the
      // initials prompt (skilled players); otherwise queue the turn.
      if (!skipGameOverBeat() && !e.repeat) game.setInput(dir);
      kickAudio();                                   // audio unlock deferred
      e.preventDefault();
    } else if (isEnter(e)) {
      if (game.state === 'title') { kickAudio(); beginRun(); }
      else if (game.state === 'gameover') {
        // Enter during the beat skips to initials; after the beat (or for a
        // non-qualifying score) it returns to the menu as before.
        if (!skipGameOverBeat()) { kickAudio(); game.showTitle(); }
      }
    } else if (isSpace(e)) {         // Space also starts / returns to title
      if (game.state === 'title') { kickAudio(); beginRun(); }
      else if (game.state === 'gameover') {
        if (!skipGameOverBeat()) { kickAudio(); game.showTitle(); }
      }
      else e.preventDefault();
    } else if (e.key === 'm' || e.key === 'M' || e.code === 'KeyM') {
      kickAudio(); setOpt({ muted: !opts.muted });
    } else if (e.key === 'p' || e.key === 'P' || e.code === 'KeyP') {
      pauseToggle();
    }
  });
  // Blur path: desktop only. On touch devices blur fires for non-user
  // reasons (notification shade, address bar, pull-to-refresh) and would
  // yank a player out of a live run; tab-hide below still covers mobile.
  window.addEventListener('blur', () => { Audio.stopSiren(); if (!isTouch) autoPause(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) autoPause();   // tab switched away / minimized
  });

  // ---- Steering (shared by keyboard, swipe, and D-pad) ----
  // Buffers a direction during 'ready' so the first swipe/tap pre-steers the
  // moment play begins (Pac starts stationary, so a tap that's invalid now
  // would otherwise be lost).
  let readyBuffer = null;
  function steer(dir) {
    kickAudio();                          // deferred; never blocks input
    // Joystick / D-pad direction during the qualifying game-over beat skips
    // straight to the initials prompt (skilled players on touch). Also stops
    // the hold-to-repeat so a held stick doesn't keep re-firing a no-op on
    // the initials screen.
    if (skipGameOverBeat()) { setRepeat(null); return; }
    if (game.state === 'ready') { readyBuffer = dir; return; }
    if (game.state === 'play' && readyBuffer) { game.setInput(readyBuffer); readyBuffer = null; }
    if (game.state === 'play') game.setInput(dir);
  }
  // apply buffered steer when play starts
  const _origUpdate = game.update.bind(game);
  game.update = function (dt) {
    if (readyBuffer && game.state === 'play') { game.setInput(readyBuffer); readyBuffer = null; }
    return _origUpdate(dt);
  };

  // ---- Touch controls (visible only on touch / small screens) ----
  if (isTouch) {
    document.body.classList.add('touch');
    fit(); // re-fit now that the D-pad reserves vertical space
  }
  const canvasEl = canvas;

  // ---- Haptics (Android vibrate; iOS ignores gracefully) ----
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) { /* never break input */ } }

  // Cancel a touch only when the browser lets us. Some touchstart/move events
  // arrive non-cancelable (e.g. a scroll already in progress); calling
  // preventDefault() on those logs a console warning, so guard every call.
  // touch-action: none on the canvas/D-pad does the real scroll suppression.
  const noScroll = (e) => { if (e.cancelable) e.preventDefault(); };

  // ---- Hold-to-steer repeat -------------------------------------------
  // A single tap only queues ONE turn. Holding a D-pad button or dragging the
  // joystick re-issues the direction every 110ms so Pac turns at EVERY open
  // junction while held — the classic "keep holding the direction" feel that
  // makes mobile play feel like the arcade stick. Engine setInput is
  // idempotent (the bots already re-issue every frame), so repeat is safe.
  let repeatDir = null, repeatTimer = null;
  function setRepeat(dir) {
    if (repeatDir === dir) return;
    repeatDir = dir;
    if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
    if (dir) {
      steer(dir);                                  // immediate first press
      repeatTimer = setInterval(() => steer(dir), 110);
    }
  }

  // ---- Tap / click the canvas to start from the menu (mobile-friendly) ----
  // Also unlocks audio on any canvas interaction (first tap on a fresh page).
  // A tap inside a mode card plays that mode directly; a tap anywhere else
  // starts the currently-highlighted mode.
  function canvasStart(ev) {
    exitAttract();   // a tap/click aborts the attract demo
    kickAudio();
    // Pause menu: a click/tap on a row activates it. Uses ABSOLUTE canvas
    // coords (the panel draws over the HUD, after the maze translate).
    if (paused) {
      if (ev && typeof ev.clientX === 'number') {
        const rect = canvas.getBoundingClientRect();
        const sx = (ev.clientX - rect.left) / (rect.width / BBR.CANVAS_W);
        const sy = (ev.clientY - rect.top) / (rect.height / BBR.CANVAS_H);
        const rows = renderer.pauseMenuRects();
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h) { pauseSel = i; pauseActivate(); return; }
        }
      }
      return;
    }
    if (game.state === 'title') {
      if (ev && typeof ev.clientX === 'number') {
        const rect = canvas.getBoundingClientRect();
        const sx = (ev.clientX - rect.left) / (rect.width / BBR.CANVAS_W);
        const sy = (ev.clientY - rect.top) / (rect.height / BBR.CANVAS_H) - BBR.PREPAD;
        const cards = renderer.menuCards();
        for (let i = 0; i < cards.length; i++) {
          const c = cards[i];
          if (sx >= c.x && sx <= c.x + c.w && sy >= c.y && sy <= c.y + c.h) {
            if (c.mode === 'continue') {
              // tap the CONTINUE row: resumes the saved run directly
              game.menuSel = i; continueRun();
              return;
            }
            if (c.mode === 'difficulty') {
              // tap the difficulty strip: first tap selects it, a repeat tap
              // cycles the preset (it never starts a run)
              if (game.menuSel === 3) cyclePreset(1);
              else game.menuSel = 3;
              return;
            }
            game.menuSel = i; break;
          }
        }
      }
      beginRun();
    }
    else if (game.state === 'gameover') {
      // A tap on the SHARE chip copies the score card; any other tap quits
      // to the menu (the pre-existing gesture, unchanged).
      if (ev && typeof ev.clientX === 'number') {
        const rect = canvas.getBoundingClientRect();
        const sx = (ev.clientX - rect.left) / (rect.width / BBR.CANVAS_W);
        const sy = (ev.clientY - rect.top) / (rect.height / BBR.CANVAS_H);
        const chip = renderer.shareChipRect();
        if (chip && sx >= chip.x && sx <= chip.x + chip.w && sy >= chip.y && sy <= chip.y + chip.h) {
          shareScoreCard(); return;
        }
      }
      game.showTitle();
    }
  }

  // ---- SHARE SCORE CARD (game over) ------------------------------------
  // Copies a compact score card (mode, score, level, board, and a link back
  // to this campaign) to the clipboard — the share-a-score-card quick win.
  // The clipboard API is async and needs a secure context; execCommand is the
  // universal fallback (still works on http:// and file://).
  function shareScoreCard() {
    if (game.state !== 'gameover') return;
    const modeLabel = game.mode === 'craze' ? 'MAZE CRAZE' : (game.mode === 'practice' ? 'PRACTICE' : 'CLASSIC');
    const boardName = String(BB.BOARD_NAMES[game.mazeIndex] || ('BOARD ' + (game.mazeIndex + 1)));
    const url = (SCAN_URL || location.href) + (location.search ? '&' : '?') + 'mode=' + game.mode;
    const card = [
      'BIT-BYTE.EXE — ' + modeLabel,
      'SCORE ' + String(game.score).padStart(6, '0'),
      'LEVEL ' + game.level + ' · ' + boardName,
      url
    ].join('\n');
    copyToClipboard(card, (ok) => { renderer.copiedFlash = ok ? Date.now() : -1; });
  }
  function copyToClipboard(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => legacyCopy(text, done));
    } else legacyCopy(text, done);
  }
  function legacyCopy(text, done) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(!!ok);
    } catch (e) { done(false); }
  }

  if (isTouch) {
    // ---- Floating virtual joystick -----------------------------------
    // Touch anywhere on the playfield: a stick appears under the thumb and the
    // steering direction is ABSOLUTE from the touch origin (never incremental),
    // so holding one direction keeps steering through every intersection via
    // setRepeat. Releasing stops. A quick tap with no drag = canvasStart.
    const joy = document.getElementById('joy');
    const DEAD = 16, RADIUS = 34, TAP_PX = 14, TAP_MS = 300;
    let joyId = null, joyOX = 0, joyOY = 0, joyT = 0;
    // Two-finger swipe-down = QUIT TO TITLE (the touch equivalent of the pad's
    // HOLD B). The floating joystick tracks only the FIRST touch; a second
    // finger on the canvas is otherwise a no-op, so this gesture cannot
    // conflict with single-thumb steering. The tracked finger must travel
    // QUIT_SWIPE_PX downward — far beyond thumb jitter — and fires once.
    let secondTouch = null;                 // { id, y0, maxDown }
    const QUIT_SWIPE_PX = 60;
    function joyPlace(t) {
      joyId = t.identifier; joyOX = t.clientX; joyOY = t.clientY; joyT = Date.now();
      joy.style.left = t.clientX + 'px';
      joy.style.top = t.clientY + 'px';
      joy.querySelector('.joy-nub').style.transform = 'translate(0px,0px)';
      joy.classList.add('active');
    }
    function joyMove(t) {
      if (t.identifier !== joyId) return;
      const dx = t.clientX - joyOX, dy = t.clientY - joyOY;
      const mag = Math.hypot(dx, dy);
      const c = mag > RADIUS ? RADIUS / mag : 1;
      joy.querySelector('.joy-nub').style.transform = 'translate(' + (dx * c) + 'px,' + (dy * c) + 'px)';
      if (mag < DEAD) { setRepeat(null); return; } // neutral zone under the thumb
      if (Math.abs(dx) > Math.abs(dy)) setRepeat(dx > 0 ? 'RIGHT' : 'LEFT');
      else setRepeat(dy > 0 ? 'DOWN' : 'UP');
    }
    function joyLift() {
      setRepeat(null);
      joy.classList.remove('active');
      joyId = null;
    }
    canvasEl.addEventListener('touchstart', (e) => {
      exitAttract();   // touch aborts the attract demo
      const t = e.changedTouches[0];
      joyPlace(t);
      kickAudio();
      noScroll(e);
      // Swipe-quit finger: with two fingers down it's any finger that ISN'T the
      // joystick's (the stick was just re-homed to changedTouches[0]).
      if (e.touches.length >= 2) {
        for (const tt of e.touches) {
          if (tt.identifier !== joyId) { secondTouch = { id: tt.identifier, y0: tt.clientY, maxDown: 0 }; break; }
        }
      }
    }, { passive: false });
    canvasEl.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) joyMove(e.changedTouches[i]);
      // Two-finger swipe-down = QUIT TO TITLE: the tracked finger must travel
      // QUIT_SWIPE_PX down (steering stays with the joystick finger). Fires
      // once, then the tracking clears so a continued swipe can't re-trigger.
      if (secondTouch) {
        for (const t of e.changedTouches) {
          if (t.identifier === secondTouch.id) {
            const down = t.clientY - secondTouch.y0;
            if (down > secondTouch.maxDown) secondTouch.maxDown = down;
            if (secondTouch.maxDown >= QUIT_SWIPE_PX) {
              secondTouch = null;
              joyLift();
              quitToTitle();
            }
          }
        }
      }
      noScroll(e);
    }, { passive: false });
    canvasEl.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joyId) {
          const dx = t.clientX - joyOX, dy = t.clientY - joyOY;
          const tap = (Date.now() - joyT) < TAP_MS && Math.hypot(dx, dy) < TAP_PX;
          joyLift();
          if (tap) canvasStart(t);
        }
        if (secondTouch && t.identifier === secondTouch.id) secondTouch = null;
      }
      // A second finger still down keeps the stick live (two-thumb play):
      // re-home it under the remaining touch (it becomes the stick, so the
      // swipe tracking clears with it).
      if (!joyId && e.touches.length > 0) { joyPlace(e.touches[0]); secondTouch = null; }
      noScroll(e);
    }, { passive: false });
    canvasEl.addEventListener('touchcancel', (e) => { secondTouch = null; joyLift(); }, { passive: false });

    // ---- D-pad: press = steer, HOLD = repeat (auto-turn at every junction) ----
    document.querySelectorAll('#dpad button[data-dir]').forEach((btn) => {
      const dir = btn.dataset.dir;
      const down = (e) => {
        exitAttract(); noScroll(e); buzz(8); btn.classList.add('held');
        // On the arcade initials screen the D-pad drives the letter entry
        // (Up/Down cycle, Left/Right move slots) instead of steering.
        if (game.state === 'initials') {
          if (dir === 'UP' || dir === 'DOWN') game.initialsCycle(dir === 'UP' ? 1 : -1);
          else game.initialsMove(dir === 'LEFT' ? -1 : 1);
          return;
        }
        // Pause menu: Up/Down move the selection, Left/Right change the
        // value on the options page (steering is frozen).
        if (paused) {
          if (dir === 'UP' || dir === 'DOWN') pauseMove(dir === 'DOWN' ? 1 : -1);
          else if (dir === 'LEFT' || dir === 'RIGHT') { if (pausePage === 1 || pausePage === 3) pauseToggleValue(dir === 'RIGHT' ? 1 : -1); }
          return;
        }
        setRepeat(dir);
      };
      const up = (e) => { noScroll(e); btn.classList.remove('held'); if (repeatDir === dir) setRepeat(null); };
      btn.addEventListener('touchstart', down, { passive: false });
      btn.addEventListener('touchend', up, { passive: false });
      btn.addEventListener('touchcancel', up, { passive: false });
      btn.addEventListener('mousedown', down);              // desktop fallback
    });
    window.addEventListener('mouseup', () => {
      document.querySelectorAll('#dpad button.held').forEach(b => b.classList.remove('held'));
      setRepeat(null);
    });
    window.addEventListener('blur', () => setRepeat(null)); // stuck-repeat guard

    // D-pad center = thumb-reachable PAUSE (the button you need mid-chase)
    const dpadPause = document.getElementById('btnDpadPause');
    if (dpadPause) {
      const dpadCenter = (e) => {
        exitAttract(); noScroll(e); buzz(20);
        // D-pad center = the OK button on the initials screen (mobile flow).
        if (game.state === 'initials') { confirmInitials(); return; }
        // Center during the qualifying game-over beat skips ahead to the
        // initials prompt (the touch confirm key).
        if (skipGameOverBeat()) return;
        // Pause menu: center = OK on the highlighted row.
        if (paused) { pauseActivate(); return; }
        pauseToggle();
      };
      dpadPause.addEventListener('touchstart', dpadCenter, { passive: false });
      dpadPause.addEventListener('click', dpadCenter);
    }

    // System buttons (any press also aborts the attract demo)
    document.getElementById('btnMute').addEventListener('click', (e) => { exitAttract(); e.preventDefault(); setOpt({ muted: !opts.muted }); });
    document.getElementById('btnPause').addEventListener('click', (e) => { exitAttract(); e.preventDefault(); pauseToggle(); });
    document.getElementById('btnReboot').addEventListener('click', (e) => {
      exitAttract(); e.preventDefault();
      // From the pause menu the REBOOT button is a shortcut to the menu's
      // REBOOT row (mobile players don't have to reach the panel row). On the
      // OPTIONS page it first steps back to the main page — otherwise the
      // forced sel=1 would hit SIREN's toggle on page 1 instead of rebooting.
      if (paused) { pausePage = 0; pauseSel = 1; pauseActivate(); return; }
      if (game.practice) game.stopPractice();
      else if (game.state === 'gameover') reboot();
    });
  }

  // Mouse users can also click the canvas to start / return to title
  canvas.addEventListener('click', canvasStart);

  // Bail to the main menu from anywhere — the single quit path shared by the
  // pause QUIT TO TITLE row, the gamepad HOLD-B shortcut, and the touch
  // two-finger swipe. Mirrors the pause row exactly: close any pause panel,
  // exit practice (showTitle -> setMode leaves practice), show the title, sync
  // prevState so transition cues fire once, and reset the attract idle clock.
  function quitToTitle() {
    if (paused) { paused = false; pausePage = 0; pauseResetDone = false; }
    // Quitting mid-run preserves the run for the title's CONTINUE row — the
    // last checkpoint (death/clear) becomes the resume point. captureRun()
    // grabs the CURRENT live state (a fresh checkpoint supersedes the old).
    if (!game.attract && RUN_STATES.indexOf(game.state) >= 0) captureRun();
    game.showTitle();
    prevState = game.state;
    readyBuffer = null;
    resetIdle();
  }

  function reboot() {
    // Reboot keeps the CURRENT mode: a CRAZE player stays on the craze
    // campaign, a CLASSIC player on the classic one. A previous version
    // hardcoded classic board 0 but left game.mode untouched — a craze
    // player got a blue classic maze for level 1, then jumped to the PCB
    // boards on level 2 (desynced mode vs board). Preserve the per-mode
    // high score too (not the classic one captured at page load).
    const hi = Math.max(loadHS(game.mode), game.highScore);
    game.setMode(game.mode);   // mode's board 0 + clean run state
    game.highScore = hi;
    game.state = 'ready'; game.readyTimer = 1.2;
    if (renderer && renderer.resetCaches) renderer.resetCaches();
    prewarm();
    readyBuffer = null;
    introPending = true; // re-arm intro for the reboot
  }

  // ---- Gamepad (joystick) support --------------------------------------
  // Standard-mapping gamepads (xbox/ps layout) drive EVERYTHING: steering
  // (left stick or D-pad, hold-to-steer like touch), the mode menu, the
  // initials entry, and all five pause pages. Polled every frame (the
  // Gamepad API's events are unreliable cross-browser; polling is the
  // standard approach) with edge detection so a held button never
  // auto-repeats a menu step — but steering uses the same hold-to-repeat as
  // the touch D-pad for that arcade-stick feel. Stick axes are normalized
  // with a dead zone so a resting stick never drifts Pac.
  const GP_DEAD = 0.28;        // stick dead zone (fraction of full tilt)
  let gpPrevButtons = [];      // last frame's button-pressed set (edge detect)
  let gpPrevDir = null;        // last frame's dominant direction
  let gpHoldB = null;          // button-1 hold start time (HOLD B = QUIT TO TITLE)
  let gpRepeatDir = null;      // held steering direction (hold-to-repeat)

  // Standard-mapping button indices: 0=A(bottom) 1=B(right) 2=X(left) 3=Y
  // 9=START 12=D-padUp 13=D-padDown 14=D-padLeft 15=D-padRight
  function gpBtn(gp, i) { const b = gp && gp.buttons; return !!(b && b[i] && b[i].pressed); }
  // Dominant direction from the left stick + D-pad (axis 0/1 = stick X/Y,
  // positive Y is DOWN per spec). Dead-zone filtered; stick wins on tilt,
  // D-pad buttons win when pressed (they're digital, so no drift).
  function gpDir(gp) {
    if (!gp) return null;
    const ax = gp.axes || [];
    const x = ax[0] || 0, y = ax[1] || 0;
    let dir = null;
    if (Math.abs(x) > GP_DEAD || Math.abs(y) > GP_DEAD) {
      dir = Math.abs(x) > Math.abs(y) ? (x > 0 ? 'RIGHT' : 'LEFT') : (y > 0 ? 'DOWN' : 'UP');
    }
    if (gpBtn(gp, 12)) dir = 'UP';
    else if (gpBtn(gp, 13)) dir = 'DOWN';
    else if (gpBtn(gp, 14)) dir = 'LEFT';
    else if (gpBtn(gp, 15)) dir = 'RIGHT';
    return dir;
  }
  function gpConnected() {
    try {
      const list = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < list.length; i++) if (list[i] && list[i].connected) return true;
    } catch (e) { /* API blocked/unavailable — gamepad just doesn't work */ }
    return false;
  }

  function pollGamepad() {
    let gp = null;
    try {
      const list = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < list.length; i++) { if (list[i] && list[i].connected) { gp = list[i]; break; } }
    } catch (e) { return; }
    if (!gp) {
      // disconnected: stop any held repeat so Pac doesn't keep steering
      if (gpRepeatDir) { setRepeat(null); gpRepeatDir = null; }
      gpHoldB = null;
      gpPrevButtons = []; gpPrevDir = null;
      game.gamepadConnected = false;
      return;
    }
    game.gamepadConnected = true;

    const dir = gpDir(gp);
    const dirEdge = dir !== null && dir !== gpPrevDir;
    const btn = (i) => gpBtn(gp, i);
    const edge = (i) => btn(i) && !gpPrevButtons[i];   // pressed this frame, not last
    // First frame this pad was seen: seed the edge state WITHOUT firing
    // anything, so a pad that connects with a button already held doesn't
    // trigger a phantom press (same on reconnect — disconnect resets prev).
    if (gpPrevButtons.length !== gp.buttons.length) {
      gpPrevButtons = gp.buttons.map(b => !!(b && b.pressed)); gpPrevDir = dir;
      return;
    }
    const any = dirEdge || edge(0) || edge(1) || edge(2) || edge(3) || edge(9);
    if (any) {
      exitAttract();
      // Deferred audio unlock — gated on REAL input (not on pad connect):
      // kickAudio latches audioKicked, so an unlock attempt with no user
      // gesture (e.g. a pad connected before the first keypress) would
      // poison audio for the whole session.
      kickAudio();
    }
    // Mute (X button) is shared by every screen except initials — keyboard M
    // doesn't work there either. Handled once, before the per-state routing.
    if (edge(2) && game.state !== 'initials') setOpt({ muted: !opts.muted });

    // HOLD-B = QUIT TO TITLE — a live-run shortcut beyond the pause panel. B is
    // unused during play (it's the pause-menu BACK button), and the 0.9s hold
    // guard makes accidental taps harmless, so a quick tap never abandons the
    // run. Skipped while the pause menu is open (B there = BACK), and on the
    // title / game-over / initials screens (they have their own A/START exits).
    if (btn(1)) {
      if (gpHoldB === null) gpHoldB = performance.now();
      else if (!paused && RUN_STATES.indexOf(game.state) >= 0 && performance.now() - gpHoldB >= 900) {
        gpHoldB = null;
        quitToTitle();
      }
    } else {
      gpHoldB = null;
    }

    // ---- pause menu (all five pages) ----
    if (paused) {
      setRepeat(null); gpRepeatDir = null;   // a held stick must not keep steering into the frozen sim
      if (dirEdge) {
        if (dir === 'UP') pauseMove(-1);
        else if (dir === 'DOWN') pauseMove(1);
        else if (dir === 'LEFT' || dir === 'RIGHT') { if (pausePage === 1 || pausePage === 3) pauseToggleValue(dir === 'RIGHT' ? 1 : -1); }
      }
      if (edge(0) || edge(9)) pauseActivate();          // A / START = OK
      if (edge(1)) pauseEsc();                          // B = back / resume
      gpPrevButtons = gp.buttons.map(b => !!(b && b.pressed)); gpPrevDir = dir;
      return;
    }
    // ---- game-over screen: any direction or A/START skips a qualifying
    // GAME OVER beat straight to initials; otherwise A / START returns to
    // the menu (keyboard Enter) ----
    if (game.state === 'gameover') {
      if ((dirEdge || edge(0) || edge(9)) && skipGameOverBeat()) {
        gpPrevButtons = gp.buttons.map(b => !!(b && b.pressed)); gpPrevDir = dir;
        return;
      }
      if (edge(0) || edge(9)) { game.showTitle(); prevState = game.state; }
      gpPrevButtons = gp.buttons.map(b => !!(b && b.pressed)); gpPrevDir = dir;
      return;
    }
    // ---- initials entry ----
    if (game.state === 'initials') {
      if (dirEdge) {
        if (dir === 'UP') game.initialsCycle(1);
        else if (dir === 'DOWN') game.initialsCycle(-1);
        else if (dir === 'LEFT') game.initialsMove(-1);
        else if (dir === 'RIGHT') game.initialsMove(1);
      }
      if (edge(0) || edge(9)) confirmInitials();        // A / START = confirm
      gpPrevButtons = gp.buttons.map(b => !!(b && b.pressed)); gpPrevDir = dir;
      return;
    }
    // ---- mode menu ----
    if (game.state === 'title') {
      const menuMax = savedRun ? 4 : 3;   // CONTINUE row only when a run is saved
      if (dirEdge) {
        if (dir === 'LEFT') { if (game.menuSel === 3) cyclePreset(-1); else game.menuSelect(-1); }
        else if (dir === 'RIGHT') { if (game.menuSel === 3) cyclePreset(1); else game.menuSelect(1); }
        else if (dir === 'UP') game.menuSel = Math.max(0, game.menuSel - 1);
        else if (dir === 'DOWN') game.menuSel = Math.min(menuMax, game.menuSel + 1);
      }
      // A/START = play (or cycle the strip, or resume the saved run)
      if (edge(0) || edge(9)) {
        if (game.menuSel === 3) cyclePreset(1);
        else if (game.menuSel === 4) continueRun();
        else beginRun();
      }
      gpPrevButtons = gp.buttons.map(b => !!(b && b.pressed)); gpPrevDir = dir;
      return;
    }
    // ---- gameplay: hold-to-steer (arcade-stick feel) ----
    if (dir) {
      if (dir !== gpRepeatDir) { gpRepeatDir = dir; setRepeat(dir); }
    } else if (gpRepeatDir) {
      gpRepeatDir = null; setRepeat(null);
    }
    if (edge(9)) pauseToggle();                         // START = pause
    gpPrevButtons = gp.buttons.map(b => !!(b && b.pressed)); gpPrevDir = dir;
  }

  // ---------- Game loop (fixed timestep) ----------
  // The ONLY thing that matters for "never freeze": requestAnimationFrame is
  // ALWAYS re-armed, even if anything inside the frame throws. So the loop is
  // wrapped in try/catch and rAF is scheduled in a `finally` — there is no
  // code path that can permanently stop the animation.
  const STEP = 1 / 60;
  const MAX_CATCHUP = 5;   // cap sim sub-steps per frame: prevents the
                           // death-spiral where one stall triggers many
                           // catch-up updates (the visible "lag"/stutter).
  let acc = 0, last = performance.now();
  let wasSirenOn = false;
  let loopErrShown = false;

  function frame(now) {
    let stopped = false;
    try {
      pollGamepad();              // joystick drives menus + steering every frame
      let dt = (now - last) / 1000; last = now;
      if (dt > 0.25) dt = 0.25;   // hard clamp after tab switch / long frame —
                                  // never fast-forward the simulation
      if (!paused) {
        acc += dt;
        let steps = 0;
        while (acc >= STEP && steps < MAX_CATCHUP) {
          game.update(STEP);
          acc -= STEP; steps++;
        }
        if (acc > STEP) acc = 0;   // drop any leftover backlog (anti-spiral)
      }
      // Attract idle timer: only counts while sitting on the start screen;
      // any gameplay (demo or real) resets it. The remaining seconds are
      // published to the game so the menu can show the blinking INSERT COIN
      // countdown during the last 3s before the demo.
      if (!paused && game.state === 'title') {
        idleTime += dt;
        game.attractCountdown = Math.max(0, ATTRACT_DELAY - idleTime);
        if (idleTime >= ATTRACT_DELAY) { idleTime = 0; game.attractCountdown = 0; startAttractDemo(); }
      } else {
        idleTime = 0;
        game.attractCountdown = 0;
      }
      // The qualifying game-over beat + abandon guard live in the ENGINE's
      // update(); main.js only publishes the renderer flag from the engine's
      // state so draw() paints the blinking NEW HIGH SCORE! mid-beat.
      renderer.gameoverInitialsPending = !!game.pendingInitials && game.state === 'gameover' && game.pendingInitialsTimer > 0;
      renderer.paused = paused;      // the renderer draws the pause panel
      renderer.continueInfo = savedRun;   // title CONTINUE row (menuSel 4) + its card
      game.continueInfo = savedRun;   // engine-side mirror (QA + tap hit-tests)
      renderer.pauseReason = pauseReason;   // 'player' vs 'auto' (blur/hidden)
      renderer.pauseSel = pauseSel;
      renderer.pausePage = pausePage;
      renderer.pauseResetDone = pauseResetDone;
      renderer.pauseOpts = opts;
      syncPresetLabel();                    // strip + DIFF chip follow the active campaign
      renderer.draw(game, paused ? 0 : dt);

      // one-shot cues on state transitions (only when audio is actually available;
      // a deferred jingle fires on first unlock, see keydown handler). The
      // attract demo is silent.
      if (game.state !== prevState) {
        if (game.state === 'ready' && prevState !== 'death' && !game.attract && Audio.canPlay()) Audio.intro();
        prevState = game.state;
      }

      // manage siren based on mode (never during the attract demo, and a
      // real pause menu silences the alarm while the sim is halted; the
      // SIREN option + MUTE gate it too)
      const wantSiren = (game.state === 'play' || game.state === 'ready') && !game.attract && !paused && opts.siren && !opts.muted;
      if (wantSiren && !wasSirenOn) { Audio.startSiren(); wasSirenOn = true; }
      else if (!wantSiren && wasSirenOn) { Audio.stopSiren(); wasSirenOn = false; }
      // while the viruses are frightened, the siren corrupts (pitch jolts /
      // stutter / static). Asserted every frame so it self-heals after a
      // siren restart (blur, mute, death) mid-fright.
      Audio.sirenCorrupt(game.state === 'play' && game.frightenedTimer > 0);

      // Game-over bookkeeping (once per game-over): persist the per-mode
      // high AND record the final score into the top-10 table (the attract
      // demo flashes it between loops). A fresh run resets the one-shot flag.
      // If the score makes the table, the arcade ENTER YOUR INITIALS screen
      // pauses the game first; the table insert waits for the player's
      // confirmation so their 3 letters ride along with the entry.
      if (game.state === 'ready') scoreboardRecorded = false;
      if (game.state === 'gameover' && !scoreboardRecorded) {
        scoreboardRecorded = true;
        // The leaderboard records BASE (unscaled) scores — game.baseScore is
        // the exact sum of arcade pickups, so EASY and HARD players compete on
        // equal footing even though the HUD shows scaled points. The persisted
        // per-mode best + the start-screen cards use the same base currency.
        if (game.baseScore > loadHS(game.mode)) {
          localStorage.setItem(HS_KEYS[game.mode], String(game.baseScore));
          if (game.highScores) game.highScores[game.mode] = game.baseScore;
        }
        const list = loadScoreboard();
        const entry = { score: game.baseScore, mode: game.mode, level: game.level, initials: 'AAA', id: newEntryId() };
        // Per-campaign qualification: the split table shows each mode's OWN
        // top-5 column, so a score must place in ITS mode's column (beat the
        // 5th place, or the column has room) AND survive the combined top-10
        // slice — otherwise the initials screen would announce a rank whose
        // entry never appears in the table. Rank is also per-column, so the
        // announced #N matches the row the entry lands on.
        const mine = list.filter(e => e.mode === game.mode);
        const qualifies = game.baseScore > 0 &&
          (mine.length < 5 || game.baseScore > mine[4].score) &&
          (list.length < 10 || game.baseScore > list[list.length - 1].score);
        if (qualifies) {
          pendingInitialsEntry = entry;   // id rides along; glow fires on confirm
          game.initialsRank = 1 + mine.filter(e => e.score > game.baseScore).length;
          // Classic arcade beat: GAME OVER shows first; the ENGINE's guard
          // fires beginInitials after PENDING_INITIALS_DELAY so the player
          // SEES the game-over screen before the ENTER YOUR INITIALS prompt.
          game.armPendingInitials(lastInitials);
        } else {
          list.push(entry);
          list.sort((a, b) => b.score - a.score);
          game.scoreboard = list.slice(0, 10);
          saveScoreboard(game.scoreboard);
          // REC glow on the fresh row — but only if it actually survived the
          // top-10 slice (a score below a full table's 10th gets trimmed right
          // back out, so a dangling glowId would waste the next table's glow).
          if (game.scoreboard.some(e => e.id === entry.id)) game.scoreboardGlowId = entry.id;
        }
      }
    } catch (err) {
      // An exception here (audio, render, whatever) must NEVER stop the loop.
      // Log once, keep going.
      if (!loopErrShown) { console.error('[Bit-Byte] frame error (loop continues):', err); loopErrShown = true; }
      stopped = true; // something broke; reset loop state defensively
    } finally {
      requestAnimationFrame(frame); // <-- ALWAYS re-arm, even on error
    }
    if (stopped) { acc = 0; last = performance.now(); }
  }
  requestAnimationFrame(frame);

  // exposed for debugging / QA (startAttractDemo lets harnesses jump straight
  // into the demo instead of idling ATTRACT_DELAY seconds; opts lets harnesses
  // assert the persisted sound/display settings)
  window.__bitbyte = { game, renderer, Audio, startAttractDemo, opts };

  // allow ?maze=N to start on a specific maze (for visual QA) — sets the
  // owning mode too, so the board's cycle/colors stay consistent.
  const qp = new URLSearchParams(location.search);
  const mq = parseInt(qp.get('maze'), 10);
  if (!isNaN(mq) && mq >= 0 && mq < BB.MAZE_COLORS.length) {
    game.setMode(mq >= 7 ? 'craze' : 'classic');
    game.mazeIndex = mq; game.loadMaze(mq); game.initEntities();
    game.state = 'ready'; game.readyTimer = 0.4;
    prewarm();
  }
})();
</script>
</body>
