/* =====================================================================
   BIT-BYTE — Core Simulation Engine (DOM-free, unit-testable)
   Faithful Pac-Man / Ms. Pac-Man mechanics.
   Tile coordinates: col 0..27, row 0..30 (31x28 playfield).
   Entity positions stored in TILE UNITS (1 tile = 1.0). Renderer scales.
   ===================================================================== */
(function (root) {
  'use strict';

  const DIRS = {
    UP:    { x: 0,  y: -1, name: 'UP' },
    DOWN:  { x: 0,  y: 1,  name: 'DOWN' },
    LEFT:  { x: -1, y: 0,  name: 'LEFT' },
    RIGHT: { x: 1,  y: 0,  name: 'RIGHT' },
    NONE:  { x: 0,  y: 0,  name: 'NONE' }
  };
  const OPP = { UP: 'DOWN', DOWN: 'UP', LEFT: 'RIGHT', RIGHT: 'LEFT', NONE: 'NONE' };
  const DIR4 = [DIRS.UP, DIRS.LEFT, DIRS.DOWN, DIRS.RIGHT];
  const WRAP = c => ((c % 28) + 28) % 28;
  // Signed shortest-delta across the horizontal wrap seam. Normal moves have
  // |d|<=1 so the result is unchanged; only the tunnel seam (d = ±27) becomes
  // ∓1, so an entity exits one edge and re-enters the other over a 1-tile gap
  // instead of sliding across the whole playfield. Fixes the "ghost appears
  // across screen" glitch when Pac and a ghost share the tunnel path.
  const WRAP_delta = d => { d = ((d % 28) + 28) % 28; return d > 14 ? d - 28 : d; };
  const key = (c, r) => c + ',' + r;
  // Shared ghost/Pac collision radius (0.35 tile — the arcade only kills on
  // actual sprite overlap, letting you graze on corners). Used by BOTH the
  // real play collision and the attract chase act so they can't drift apart.
  const COLLIDE_R = 0.35;
  // Qualifying game-over beat: a table-worthy run holds GAME OVER for this
  // long (the classic arcade beat) before the ENTER YOUR INITIALS prompt
  // opens. Lives HERE with the abandon guard so the flow is unit-testable;
  // main.js arms it via armPendingInitials() and clears its entry object on
  // the 'abandonInitials' event.
  const PENDING_INITIALS_DELAY = 2.2;

  // ---- Per-level difficulty (tiles/sec + fright seconds) ----------------
  // Arcade-authentic speed bands (Pac-Man Dossier): the ghosts run ~0.5 t/s
  // slower than Pac on levels 1-4, level up to his speed by L5-20, and
  // OVERTAKE him from L21+ (Pac drops to 9.0, ghosts stay 9.5) — the arcade's
  // end-game wall. Tunnel speed slows everyone in the warp corridors; eyes
  // (returning ghosts) sprint at 2x. Blue time shrinks in steps: 6s on L1,
  // 5s L2, 4s L3-4, 3s L5-6, 2s L7+.
  //
  // The TUNNEL band is the Dossier's own table (percent of base speed):
  //   L1 40% (4.0 t/s) · L2-4 45% (4.5) · L5-20 50% (5.0) · 21+ 50% (5.0).
  // Note the 21+ row: the arcade HOLDS the tunnel at 50% even though Pac
  // slows back to 90% — the crawl does not get harsher at the end-game wall.
  // (A previous pass dropped it to 45% there, slower than the arcade.)
  function speedForLevel(level) {
    const l = Math.min(Math.max(1, level), 30);
    let pac, ghost, fright, tunnel;
    if (l === 1) { pac = 8.0; ghost = 7.5; fright = 5.0; tunnel = 4.0; }
    else if (l <= 4) { pac = 9.0; ghost = 8.5; fright = 5.5; tunnel = 4.5; }
    else if (l <= 20) { pac = 10.0; ghost = 9.5; fright = 6.0; tunnel = 5.0; }
    else { pac = 9.0; ghost = 9.5; fright = 5.5; tunnel = 5.0; }
    const FRIGHT_DUR = [6, 5, 4, 4, 3, 3, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2];
    // Blinky's Cruise-Elroy boosts (absolute t/s over the level's ghost speed,
    // arcade: L1 +1.0/+2.0, L2-4 +1.0/+1.5, L5+ +0.5/+1.0).
    const elroy = l === 1 ? [1.0, 2.0] : l <= 4 ? [1.0, 1.5] : [0.5, 1.0];
    return {
      pac, ghost, fright, tunnel,
      eyes: 16.0,
      frightDur: FRIGHT_DUR[Math.min(l - 1, FRIGHT_DUR.length - 1)],
      elroy
    };
  }

  // ---- Game modes --------------------------------------------------------

  const MODE_BOARDS = {

  // same speed every loop. Each board assigns the autopilot a PERSONALITY —
  // the strategy it demonstrates that act:

  const MODE_SCATTER = {

  const DEFAULT_DIFFICULTY = {

    releaseCraze: 1,    // MAZE CRAZE pellet-release threshold multiplier

  // ---- Scatter/chase schedule per level (Pac-Man Dossier) ----------------
  // L1:   7/20/7/20/5/20/5 then infinite chase.

  // The 1/60s scatter is a one-frame blip — ghosts flash to their corners,
  // then the final infinite chase begins (authentic arcade behavior).
  function modeScheduleForLevel(level) {
    if (level === 1) return [['scatter', 7], ['chase', 20], ['scatter', 7], ['chase', 20], ['scatter', 5], ['chase', 20], ['scatter', 5], ['chase', 1e9]];
    if (level <= 4) return [['scatter', 7], ['chase', 20], ['scatter', 7], ['chase', 20], ['scatter', 5], ['chase', 1033], ['scatter', 1 / 60], ['chase', 1e9]];
    return [['scatter', 5], ['chase', 20], ['scatter', 5], ['chase', 20], ['scatter', 5], ['chase', 1037], ['scatter', 1 / 60], ['chase', 1e9]];
  }

  // Prize table is THE single source of truth: the renderer's fruit label
  // (drawBonus) references this exact export, so the displayed value can
  // never drift from what the engine actually awards.
  const FRUIT_SCORES = [100, 300, 500, 700, 1000, 2000, 3000, 5000];

  // level 4 NIC+ROM, then wraps (8 upgrades, 2 per level). ONE source of truth
  // for the spawn type AND the renderer's HUD icon — the renderer imports this
  // exact export so the icon can never drift from what actually spawns.
  function fruitTypeFor(level, stage) {

  let MAZES, MAZE_COLORS, PAC_SPAWNS;

  class Maze {
    constructor(layout) {
      this.grid = layout.map(r => r.split(''));
      this.rows = this.grid.length;
      this.cols = this.grid[0].length;
      this.pellets = new Map();
      this.doorCells = new Set();
      this.houseTiles = new Set();   // gate + interior box (non-'#')
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          const ch = this.grid[r][c];
          if (ch === '.') this.pellets.set(key(c, r), 'dot');
          else if (ch === '@' || ch === 'o') this.pellets.set(key(c, r), 'energizer');
          else if (ch === '-') this.doorCells.add(key(c, r));
          // House block = door row 12 through the box bottom at row 16. The
          // corridor BELOW the pen (row 17) is a normal Pac corridor (and the
          // bonus fruit spawns there) — a previous pass used rows 12-18,
          // which wrongly sealed off row 17 and broke the authentic boards.
          if ((ch === ' ' || ch === '-') && r >= 12 && r <= 16 && c >= 10 && c <= 17)
            this.houseTiles.add(key(c, r));
        }
      }
      this.totalPellets = this.pellets.size;
      this.pelletsLeft = this.pellets.size;
      // Tunnel (warp) tiles: on rows whose outer wall is OPEN at both edges,
      // the 5 tiles at each end form the slow tunnel corridor. Both Pac and the
      // ghosts drop to the arcade tunnel speed there (and the seam wraps).
      this.tunnelTiles = new Set();
      for (let r = 0; r < this.rows; r++) {
        const chL = this.grid[r][0], chR = this.grid[r][this.cols - 1];
        if (chL !== '#' && chL !== '-' && chR !== '#' && chR !== '-') {
          for (let c = 0; c <= 4; c++) this.tunnelTiles.add(key(c, r));
          for (let c = this.cols - 5; c < this.cols; c++) this.tunnelTiles.add(key(c, r));
        }
      }
      // Fruit/bonus spawn tile: the corridor DIRECTLY BELOW the monster pen
      // (arcade behavior — the fruit appears below the house). (14,17) is a
      // passable, reachable corridor tile on every one of the 7 boards.
      this.bonusTile = { col: 14, row: 17 };
    }
    isWall(c, r) {                       // raw: '#' and gate '-'
      c = WRAP(c);
      if (r < 0 || r >= this.rows) return true;
      const ch = this.grid[r][c];
      return ch === '#' || ch === '-';
    }
    isGhostWall(c, r) {                 // '#' only (gate passable for ghosts)
      c = WRAP(c);
      if (r < 0 || r >= this.rows) return true;
      return this.grid[r][c] === '#';
    }
    isPacWall(c, r) {                   // '#', gate, or house box
      c = WRAP(c);
      if (r < 0 || r >= this.rows) return true;
      const ch = this.grid[r][c];
      if (ch === '#' || ch === '-') return true;
      return this.houseTiles.has(key(c, r));
    }
    isHouseTile(c, r) { return this.houseTiles.has(key(WRAP(c), r)); }
    isDoor(c, r) { return this.doorCells.has(key(WRAP(c), r)); }
    isInBox(c, r) { return c >= 11 && c <= 16 && r >= 13 && r <= 15; }
    eatPellet(c, r) {
      const k = key(WRAP(c), r);
      if (this.pellets.has(k)) {
        const t = this.pellets.get(k);
        this.pellets.delete(k);
        this.pelletsLeft--;
        return t;
      }
      return null;
    }
  }

  class Entity {
    constructor(col, row, dir) {
      this.col = col; this.row = row; this.dir = dir;
      this.nextCol = col + dir.x; this.nextRow = row + dir.y;
      this.progress = 0; this.speed = 8;
      this.px = col + 0.5; this.py = row + 0.5;
    }
    setTile(c, r, dir) {
      this.col = c; this.row = r; this.dir = dir;
      this.nextCol = WRAP(c + dir.x); this.nextRow = r + dir.y;
      this.progress = 0; this.px = c + 0.5; this.py = r + 0.5;
    }
  }

  function ghostTarget(g, pac, blinky, globalMode) {
    if (g.mode === 'eyes') return { col: 13, row: 14 };
    // Exit target must be the CORRIDOR tile ABOVE the real gate opening
    // (cols 14/15 of row 12 are the only passable gap). The classic (13,11)
    // is a wall here, so targeting it made leaving/returning ghosts
    // oscillate inside the box — the "anomaly in the pen". (14,11) routes
    // them cleanly out through the opening column.
    if (g.inHouse || g.leaving || g.maze.isInBox(g.col, g.row)) return { col: 14, row: 11 };
    // SCATTER: every ghost heads for its own corner. (A previous version
    // ignored globalMode entirely and always used the chase targets, so
    // scatter phases played identically to chase — ghosts never spread out.)
    // The MAZE CRAZE rogue (Blinky) is exempt: he hunts through every phase.
    if (globalMode === 'scatter' && !g.rogue) return g.scatterCorner;
    const p = { col: pac.col, row: pac.row }, pd = pac.dir;
    switch (g.id) {
      case 'blinky': return p;
      case 'pinky':  return { col: p.col + pd.x * 4, row: p.row + pd.y * 4 };
      case 'inky': {
        const a = { col: p.col + pd.x * 2, row: p.row + pd.y * 2 };
        return { col: a.col + (a.col - blinky.col), row: a.row + (a.row - blinky.row) };
      }
      case 'clyde': {
        const d = Math.hypot(g.col - p.col, g.row - p.row);
        return d > 8 ? p : g.scatterCorner;
      }
    }
    return p;
  }

  function dist2(a, b) { const dx = a.col - b.col, dy = a.row - b.row; return dx * dx + dy * dy; }

  function chooseDir(e, target, isGhost, maze, frightened) {
    const canEnterHouse = e.mode === 'eyes' || e.mode === 'retreat' || e.leaving || e.inHouse;
    const opts = [];
    for (const d of [DIRS.UP, DIRS.LEFT, DIRS.DOWN, DIRS.RIGHT]) {
      const nc = WRAP(e.col + d.x), nr = e.row + d.y;
      let blocked;
      if (isGhost) {
        blocked = maze.isGhostWall(nc, nr) ||
          (maze.isHouseTile(nc, nr) && !canEnterHouse);
      } else blocked = maze.isPacWall(nc, nr);
      if (blocked) continue;
      if (d.name === OPP[e.dir.name]) continue;
      opts.push({ d, nc, nr });
    }
    if (opts.length === 0) {
      const d = DIRS[OPP[e.dir.name]];
      return { d, nc: WRAP(e.col + d.x), nr: e.row + d.y };
    }
    if (frightened) {
      const pick = opts[Math.floor(Math.random() * opts.length)];
      return { d: pick.d, nc: pick.nc, nr: pick.nr };
    }
    let best = opts[0], bestD = Infinity;
    for (const o of opts) {
      const dd = dist2({ col: o.nc, row: o.nr }, target);
      if (dd < bestD) { bestD = dd; best = o; }
    }
    return { d: best.d, nc: best.nc, nr: best.nr };
  }

  // ---- BFS autopilot bot -------------------------------------------------
  // The attract demo's autopilot, extracted into a standalone, reusable
  // pathfinder (engine has no DOM, so this runs in Node, the browser, and any
  // bot harness). Find the NEAREST tile matching a predicate via BFS on the
  // 28x31 grid (~868 nodes — trivial) and return the FIRST STEP direction
  // toward it. A Manhattan greedy stalls on wall-blocked targets (oscillates
  // in local minima); a real BFS never does.
  //
  //   steer(pac, maze, targetFn?) -> a DIR object or null
  //     pac     : entity with { col, row } tile coords
  //     maze    : Maze instance (isPacWall + cols)
  //     targetFn: (c, r) => bool; default = any pellet
  //     returns : the direction to take next, or null when no target exists /
  //               none is reachable. Does NOT mutate anything.
  class Bot {
    constructor() {
      // scratch buffers, sized to the 31x28 playfield; reused across steers
      this._v = new Uint8Array(31 * 28);
      this._p = new Int32Array(31 * 28);
      this._q = new Int32Array(31 * 28);
    }
    // First-step extraction shared by every steering strategy: walk the parent
    // chain (this._p) back from `found` to the tile adjacent to `start` and
    // return that DIR. When standing ON the target already, keep moving via any
    // open way (the bot never parks on a pellet — it sweeps through the field).
    _firstStep(maze, start, found) {
      const C = maze.cols, P = this._p;
      if (found !== start) {
        let first = found;
        while (P[first] !== start) first = P[first];
        const fc = first % C, fr = (first / C) | 0;
        for (const d of DIR4) {
          if (WRAP((start % C) + d.x) === fc && ((start / C) | 0) + d.y === fr) return d;
        }
      }
      const sc = start % C, sr = (start / C) | 0;
      for (const d of DIR4) if (!maze.isPacWall(WRAP(sc + d.x), sr + d.y)) return d;
      return null;
    }
    steer(pac, maze, targetFn) {
      const isTarget = targetFn || ((c, r) => maze.pellets.has(c + ',' + r));
      const C = maze.cols;
      const V = this._v, P = this._p, Q = this._q;
      V.fill(0);
      const start = pac.row * C + WRAP(pac.col);
      let head = 0, tail = 0;
      V[start] = 1; P[start] = -1; Q[tail++] = start;
      let found = -1;
      while (head < tail) {
        const cur = Q[head++];
        const cc = cur % C, cr = (cur / C) | 0;
        if (isTarget(cc, cr)) { found = cur; break; }
        for (let d = 0; d < 4; d++) {
          const nc = WRAP(cc + DIR4[d].x), nr = cr + DIR4[d].y;
          if (maze.isPacWall(nc, nr)) continue;
          const ni = nr * C + nc;
          if (V[ni]) continue;
          V[ni] = 1; P[ni] = cur; Q[tail++] = ni;
        }
      }
      if (found === -1) return null;
      return this._firstStep(maze, start, found);
    }
    // NEAREST target (default). farthestTarget picks the FARTHEST matching
    // tile — a BFS visits nodes in nondecreasing depth, so the LAST target
    // dequeued is the farthest one. steerFar returns the first step toward it.
    // NOTE: callers must NOT re-pick this every frame — as Pac moves, the
    // farthest tile can flip between two far pellets, and the bot ping-pongs
    // on the seam forever (the SWEEP deadlock). Pick ONCE (a sticky target),
    // then BFS to that exact tile until it is eaten.
    farthestTarget(pac, maze, targetFn) {
      const isTarget = targetFn || ((c, r) => maze.pellets.has(c + ',' + r));
      const C = maze.cols;
      const V = this._v, P = this._p, Q = this._q;
      V.fill(0);
      const start = pac.row * C + WRAP(pac.col);
      let head = 0, tail = 0;
      V[start] = 1; P[start] = -1; Q[tail++] = start;
      let best = -1;
      while (head < tail) {
        const cur = Q[head++];
        const cc = cur % C, cr = (cur / C) | 0;
        if (isTarget(cc, cr)) best = cur;   // last match = farthest
        for (let d = 0; d < 4; d++) {
          const nc = WRAP(cc + DIR4[d].x), nr = cr + DIR4[d].y;
          if (maze.isPacWall(nc, nr)) continue;
          const ni = nr * C + nc;
          if (V[ni]) continue;
          V[ni] = 1; P[ni] = cur; Q[tail++] = ni;
        }
      }
      if (best === -1) return null;
      return { col: best % C, row: (best / C) | 0 };
    }
    steerFar(pac, maze, targetFn) {
      const t = this.farthestTarget(pac, maze, targetFn);
      if (!t) return null;
      return this.steer(pac, maze, (c, r) => c === t.col && r === t.row);
    }
    // EVASION: the reachable tile farthest from any threat. A multi-source BFS
    // stamps every tile's distance to the nearest threat (in _p, an Int32Array
    // — -1 = unreachable; distances can exceed 255, so a Uint8 sentinel would
    // be wrong). NOTE: like farthestTarget, callers must hold this tile as a
    // STICKY flee target — re-picking every frame oscillates A->B->A straight
    // through the converging threats (the flee deadlock).
    farthestFrom(pac, maze, threats) {
      const C = maze.cols;
      const D = this._p, Q = this._q;
      D.fill(-1);
      let head = 0, tail = 0;
      for (const t of threats) {
        const tc = WRAP(t.col), tr = t.row;
        if (maze.isPacWall(tc, tr)) continue;
        const ti = tr * C + tc;
        if (D[ti] !== -1) continue;
        D[ti] = 0; Q[tail++] = ti;
      }
      while (head < tail) {
        const cur = Q[head++];
        const cc = cur % C, cr = (cur / C) | 0;
        const nd = D[cur] + 1;
        for (let d = 0; d < 4; d++) {
          const nc = WRAP(cc + DIR4[d].x), nr = cr + DIR4[d].y;
          if (maze.isPacWall(nc, nr)) continue;
          const ni = nr * C + nc;
          if (D[ni] !== -1) continue;
          D[ni] = nd; Q[tail++] = ni;
        }
      }
      let best = -1, bestD = -1;
      for (let i = 0; i < D.length; i++) {
        if (D[i] !== -1 && D[i] > bestD) { bestD = D[i]; best = i; }
      }
      if (best < 0) return null;
      return { col: best % C, row: (best / C) | 0 };
    }
    steerAway(pac, maze, threats) {
      const t = this.farthestFrom(pac, maze, threats);
      if (!t) return null;
      return this.steer(pac, maze, (c, r) => c === t.col && r === t.row);
    }
    // ESCAPE step: take the single SAFEST step — the open neighbor with the
    // largest distance to the nearest threat (multi-source BFS field). Unlike
    // steerAway (a full path that can lead Pac THROUGH the converging threats
    // and die en route), the greedy one-step never commits a route across a
    // threat, so it cannot suicide on the way to a "safe" tile. Tie-breaks
    // prefer the current heading so equal options don't jitter. Returns null
    // when no step widens the gap (cornered — the caller resumes normal play).
    steerEscape(pac, maze, threats) {
      const C = maze.cols;
      const D = this._p, Q = this._q;
      D.fill(-1);
      let head = 0, tail = 0;
      for (const t of threats) {
        const tc = WRAP(t.col), tr = t.row;
        if (maze.isPacWall(tc, tr)) continue;
        const ti = tr * C + tc;
        if (D[ti] !== -1) continue;
        D[ti] = 0; Q[tail++] = ti;
      }
      while (head < tail) {
        const cur = Q[head++];
        const cc = cur % C, cr = (cur / C) | 0;
        const nd = D[cur] + 1;
        for (let d = 0; d < 4; d++) {
          const nc = WRAP(cc + DIR4[d].x), nr = cr + DIR4[d].y;
          if (maze.isPacWall(nc, nr)) continue;
          const ni = nr * C + nc;
          if (D[ni] !== -1) continue;
          D[ni] = nd; Q[tail++] = ni;
        }
      }
      const pc = WRAP(pac.col), pr = pac.row;
      const curD = D[pr * C + pc];
      if (curD < 0) return null;                 // unreachable from threats — nothing to dodge
      const curName = pac.dir ? pac.dir.name : null;
      const cands = [];
      for (const d of DIR4) {
        const nc = WRAP(pc + d.x), nr = pr + d.y;
        if (maze.isPacWall(nc, nr)) continue;
        const dd = D[nr * C + nc];
        if (dd < 0) continue;
        cands.push({ d, dd, head: d.name === curName });
      }
      if (!cands.length) return null;
      cands.sort((a, b) => (b.dd - a.dd) || (b.head - a.head));
      const best = cands[0];
      // Commit only if the step widens the gap — or Pac is standing ON a
      // threat (curD 0, cornered — any step is better) — or it holds the
      // current heading on a plateau (keep running straight). Never walk
      // INTO the threat.
      if (best.dd > curD || curD === 0) return best.d;
      if (best.dd === curD && best.head) return best.d;
      return null;
    }
  }

  class Game {
    constructor(opts = {}) {
      this.onEvent = opts.onEvent || (() => {});
      // Deep-link run presets (?mode=&preset=&lives=&seed=): startLives
      // overrides the default 3 lives for every fresh run in this session
      // (challenge links), and startBoardOffset makes startGame()/start-
      // Practice() begin on a deterministic board inside the campaign (the
      // seed's job — same seed = same opening board, the daily-challenge
      // property). main.js parses the URL params and passes them in.
      this.startLives = Math.max(1, Math.min(9, opts.lives || 3));
      this.startBoardOffset = Math.max(0, Math.floor(opts.startBoardOffset || 0));
      this.mode = 'classic';          // 'classic' | 'craze' | 'practice' (V19 mode select)
      // Player difficulty tuning (persisted by main.js in bitbyte.options,
      // synced onto this object by applyOpts): per-campaign ghost-speed and
      // pellet-release multipliers (1.0 = arcade) + the arcade "viruses
      // retreat to the pen when Pac dies" toggle.
      this.difficulty = Object.assign({}, DEFAULT_DIFFICULTY, opts.difficulty || {});
      this.menuSel = 0;               // start-screen selection: 0 classic, 1 craze, 2 practice
      this.practice = false;          // GHOSTLESS practice mode (no viruses, no pressure)
      this.bot = new Bot();           // the BFS autopilot (attract demo + bots)
      this.modeBoards = MODE_BOARDS.classic;
      this.mazeIndex = 0;
      this.loadMaze(0);
      this.score = 0;
      this.baseScore = 0;         // unscaled pickup sum — the leaderboard's record currency
      this.highScore = opts.highScore || 0;
      this.lives = 3;
      this.level = 1;
      this.state = 'title';           // V19: the title state renders the mode menu
      this.attract = false;           // attract-mode (arcade demo) flag
      this.attractPersonality = 'EAT'; // current demo act's strategy (ATTRACT_SCRIPT)
      this._sweepTarget = null;        // SWEEP act's sticky farthest-pellet tile
                                       // (re-picking it every frame oscillates)
      this.attractBoard = 0;          // board counter for the demo cycle
      this.attractPhase = 0;          // 0 = solo act (ghostless), 1 = chase act (vs viruses)
      this.attractDeathTimer = 0;     // death-beat pause used by the chase act
      this.attractCountdown = 0;      // seconds left before the demo (set by main.js)
      this.attractScoreboardTimer = 0; // seconds the HIGH SCORE TABLE shows between demo loops
      this.scoreboardGlowId = null;    // id of the newest scoreboard entry (set by main.js);
                                       // the renderer glows that row in the table for a few seconds
      // Speedrun clocks + per-board best clear times (indexed by maze 0-9).
      // runTime is the whole run's wall clock; levelTime is the CURRENT
      // board's attempt clock. bestTimes holds each board's fastest clear
      // (seconds) and is seeded by main.js from localStorage — the engine
      // records on clear and fires 'levelclear' so main.js can persist it.
      // Practice + attract can never record (their times aren't comparable).
      this.runTime = 0;
      this.levelTime = 0;
      this.bestTimes = (opts.bestTimes && opts.bestTimes.slice(0, 10)) || new Array(10).fill(null);
      this.lastClear = null;          // { board, time, newBest } from the most recent clear
      // Arcade initials entry (after a top-10 game-over): three letter slots
      // the player cycles with Up/Down and moves with Left/Right. main.js
      // decides whether the score qualifies (it owns the scoreboard) and
      // calls beginInitials(); the confirm path attaches the initials to the
      // recorded entry.
      this.initials = ['A', 'A', 'A'];
      this.initialsSlot = 0;
      this.initialsRank = 0;         // 1-based table position (set by main.js)
      // Qualifying game-over beat: when armed, the engine holds GAME OVER for
      // PENDING_INITIALS_DELAY then opens the initials prompt; leaving the
      // game-over screen abandons the entry (see update()'s guard). The
      // renderer reads these to flash NEW HIGH SCORE! during the beat.
      this.pendingInitials = false;
      this.pendingInitialsTimer = 0;
      this.pendingInitialsLetters = 'AAA';
      this.readyTimer = 1.2;
      // Staggered pen-release schedule. Lives on the Game (NOT rebuilt by
      // initEntities) so it PERSISTS across deaths/respawn — otherwise a quick
      // death resets the timers and ghosts get trapped in the pen forever
      // (the "anomaly in the pen"). After the first death the timers read <=0,
      // so on every subsequent respawn the penned ghosts re-emerge immediately.
      // Release schedule lives on the Game (NOT rebuilt by initEntities) so it
      // PERSISTS across deaths/respawn — otherwise a quick death resets the
      // timers and ghosts get trapped in the pen forever. The TIMER is a slow
      // fallback for idle play; the primary trigger is the arcade pellet count
      // (see updateReleases). Per-mode: craze uses quicker fallback timers.
      this.releaseTimers = releaseTimersFor(this.mode);
      this.modePhase = 0; this.modeTimer = 0; this.globalMode = 'scatter';
      this.frightenedTimer = 0; this.ghostCombo = 0;
      this.extraLifeGiven = false;
      this.bonus = null; this.bonusTimer = 0; this.bonusStage = 0;
      this.intermissionTimer = 0; this.deathTimer = 0;
      // Per-level speed table (applied again in initEntities after respawns).
      this.stats = speedForLevel(this.level);
      this.initEntities();
    }

    loadMaze(i) { this.maze = new Maze(MAZES[i % MAZES.length]); this.mazeIndex = i % MAZES.length; }

    initEntities() {
      const m = this.maze;
      this.stats = speedForLevel(this.level);
      const sp = (PAC_SPAWNS && PAC_SPAWNS[this.mazeIndex]) || { c: 13, r: 23 };
      this.pac = new Entity(sp.c, sp.r, DIRS.LEFT);
      this.pac.speed = this.stats.pac; this.pac.queued = DIRS.LEFT;
      this.pac.dead = false; this.pac.mouth = 0;

      const mk = (id, col, row, dir, color, corner, inHouse) => {
        const g = new Entity(col, row, dir);
        g.id = id; g.color = color; g.scatterCorner = corner;
        g.inHouse = inHouse; g.released = !inHouse;
        g.mode = 'normal'; g.frightened = false; g.leaving = false;
        g.speed = this.stats.ghost * this.ghostSpeedMul(); g.maze = m;
        // MAZE CRAZE only: Blinky is the ROGUE virus — he ignores scatter and
        // hunts through every phase. Classic keeps its faithful behavior.
        g.rogue = (this.mode === 'craze' && id === 'blinky');
        return g;
      };
      // Per-mode scatter corners (craze aims at the PCB power rails).
      const corners = MODE_SCATTER[this.mode] || MODE_SCATTER.classic;
      const TR = corners.TR, TL = corners.TL,
            BR = corners.BR, BL = corners.BL;
      this.ghosts = [
        // Blinky starts OUTSIDE the pen (on the house ledge) per classic Pac-Man.
        mk('blinky', 13, 11, DIRS.LEFT, '#ff0000', TR, false),
        // Penned ghosts occupy DISTINCT tiles so they never overlap/clip:
        // pinky center, inky left, clyde right of the house.
        mk('pinky',  13, 14, DIRS.UP,    '#ffb8ff', TL, true),
        mk('inky',   11, 14, DIRS.DOWN,  '#00ffff', BR, true),
        mk('clyde',  15, 14, DIRS.DOWN,  '#ffb852', BL, true)
      ];
      this.blinky = this.ghosts[0];
      // PRACTICE MODE is ghostless: no viruses spawn on any board, and every
      // respawn/board-advance during a practice run stays virus-free.
      if (this.practice) this.ghosts = [];
      m.eatPellet(sp.c, sp.r); m.eatPellet(13, 11);
      this.ghostCombo = 0;
    }

    setInput(dir) {
      const d = DIRS[dir]; if (!d) return;
      const cur = this.pac.dir.name;
      // Instant 180° reverse (allowed mid-tile, classic Pac-Man feel).
      // NOTE: the row swap MUST assign row = nextRow (a previous pass wrote
      // `nextRow = nextRow`, a no-op) — with that bug a vertical reverse left
      // Pac's tile unchanged while progress was mirrored, so he visually
      // snapped to his old tile centre and briefly rendered off-lane.
      if (this.state === 'play' && d.name === OPP[cur] && cur !== 'NONE') {
        const oc = this.pac.col, or = this.pac.row;
        this.pac.col = this.pac.nextCol; this.pac.row = this.pac.nextRow;
        this.pac.nextCol = oc; this.pac.nextRow = or;
        this.pac.progress = 1 - this.pac.progress;
        this.pac.dir = d;
        this.pac.queued = d;
        return;
      }
      // Queue the desired direction. The render-loop caller already ignores
      // OS key auto-repeat (e.repeat), so a held key won't stomp a freshly
      // tapped perpendicular turn. Do NOT block re-affirming the current
      // direction here — bots/AI legitimately re-issue it every frame.
      this.pac.queued = d;
    }

    startPlay() { this.state = 'play'; this.readyTimer = 0; this.modePhase = 0; this.modeTimer = 0; this.globalMode = 'scatter'; this.frightenedTimer = 0; }

    // ---- Title / startup screen ----------------------------------------
    // The game boots into 'title'. Simulation is frozen; ENTER / tap / click
    // starts a fresh run. After a game over, ENTER returns here (the hub).
    showTitle() {
      this.state = 'title';
      this.readyTimer = 1.2;     // re-used: time spent on READY banner before play
      this.menuSel = 0;          // back to the top of the mode menu
      this.setMode('classic');   // classic board 0 = the menu's default backdrop
    }
    // Start a fresh run in the mode currently highlighted on the start screen.
    startGame() {
      // menuSel 3 = the DIFFICULTY preset strip, menuSel 4 = the CONTINUE
      // row (both tuning/flow rows, not game modes) — starting from either
      // falls back to the first campaign (main.js intercepts menuSel 4 and
      // resumes a saved run before ever calling here).
      if (this.menuSel >= 3) this.menuSel = 0;
      if (this.menuSel === 2) return this.startPractice();
      this.setMode(this.menuSel === 1 ? 'craze' : 'classic');
      // Deep-link seed: start on a deterministic board inside the campaign
      // (offset % board count), so the same seed always opens the same maze.
      this.applyStartBoard();
      this.state = 'ready'; this.readyTimer = 1.2;
      this.onEvent('start');
      return this.mode;
    }
    // Jump the (just-initialized) run to the seeded opening board, if any.
    applyStartBoard() {
      if (!this.startBoardOffset) return;
      const boards = this.modeBoards;
      const mi = boards[this.startBoardOffset % boards.length];
      this.mazeIndex = mi; this.loadMaze(mi); this.initEntities();
    }

    // ---- CONTINUE / resume-last-run --------------------------------------
    // The engine owns the RUN STATE; main.js owns the persistence. snapshot()
    // captures a live run (mode, board, level, lives, score, run clock) so
    // the title screen can offer a CONTINUE row; resume() restores it. The
    // resumed board restarts FRESH (full pellets) with the run clock ticking
    // on — arcade-continue semantics, so a speedrun's time stays honest.
    snapshot() {
      if (this.attract) return null;
      if (this.state !== 'ready' && this.state !== 'play' &&
          this.state !== 'death' && this.state !== 'intermission') return null;
      return {
        mode: this.mode,
        mazeIndex: this.mazeIndex,
        level: this.level,
        lives: this.lives,
        score: this.score,
        baseScore: this.baseScore,
        runTime: this.runTime,
        levelTime: this.levelTime
      };
    }
    // Restore a snapshot produced by snapshot(). Returns true on success.
    resume(snap) {
      if (!snap || typeof snap !== 'object') return false;
      if (snap.mode !== 'classic' && snap.mode !== 'craze' && snap.mode !== 'practice') return false;
      const mi = Math.max(0, Math.min(MAZES.length - 1, snap.mazeIndex | 0));
      if (snap.mode !== 'practice' && MODE_BOARDS[snap.mode].indexOf(mi) < 0) return false;
      this.setMode(snap.mode);             // clean run state (+ practice flag, pen)
      this.mazeIndex = mi; this.loadMaze(mi);
      this.level = Math.max(1, Math.min(99, snap.level | 0));
      this.lives = Math.max(1, Math.min(9, snap.lives | 0));
      this.score = Math.max(0, snap.score | 0);
      this.baseScore = Math.max(0, snap.baseScore | 0);
      this.runTime = Math.max(0, +snap.runTime || 0);   // keep sub-second precision (speedrun timers)
      this.levelTime = Math.max(0, +snap.levelTime || 0);
      // A restored score that already crossed the (current-difficulty)
      // extra-life line must not re-grant on the next pickup.
      this.extraLifeGiven = this.score >= this.extraLifeAt();
      this.initEntities();
      this.state = 'ready'; this.readyTimer = 1.2;
      this.onEvent('resume');
      return true;
    }

    // ---- PRACTICE MODE (ghostless) ---------------------------------------
    // A pressure-free mode for learning maze layouts: no viruses anywhere, no
    // lives to lose, no high-score to protect. Spans ALL 10 boards (both
    // campaigns); boards advance on clear like normal play (intermissions
    // included). Scores still count up on screen but can never grant extra
    // lives or touch the persisted high score (addScore guards).
    startPractice() {
      this.practice = true;
      this.mode = 'practice';
      this.modeBoards = MODE_BOARDS.practice;
      // A deep-link seed picks the opening practice board too (offset into
      // the all-10 board list), so a challenge link lands on the same maze.
      this.mazeIndex = this.modeBoards[(this.startBoardOffset || 0) % this.modeBoards.length];
      this.loadMaze(this.mazeIndex);
      this.score = 0; this.baseScore = 0; this.lives = this.startLives; this.level = 1;
      this.highScore = 0;
      this.extraLifeGiven = false;
      this.bonus = null; this.bonusStage = 0;
      this.frightenedTimer = 0; this.ghostCombo = 0;
      this.releaseTimers = releaseTimersFor('classic');
      this.initEntities();   // practice flag empties the viruses
      this.runTime = 0; this.levelTime = 0; this.lastClear = null;  // fresh clock
      this.state = 'ready'; this.readyTimer = 1.2;
      this.onEvent('start');
      return this.mode;
    }
    stopPractice() {
      this.practice = false;
      this.showTitle();      // back to the mode menu
    }

    // Switch campaign mode (classic = 7 arcade boards, craze = 3 PCB boards),
    // loading the mode's first board and a clean run state. Always leaves
    // practice mode (any normal campaign start is virus-ful) — EXCEPT a direct
    // setMode('practice'), which must route through startPractice() so the
    // GHOSTLESS flag is set BEFORE initEntities runs (a previous version set
    // practice=false here, so a practice restart spawned all 4 viruses — the
    // "practice has ghosts" bug).
    setMode(mode) {
      if (mode === 'practice') return this.startPractice();
      this.initialsRank = 0;   // a fresh run forgets the previous record rank
      this.practice = false;
      this.mode = MODE_BOARDS[mode] ? mode : 'classic';
      this.modeBoards = MODE_BOARDS[this.mode];
      this.mazeIndex = this.modeBoards[0];
      this.loadMaze(this.mazeIndex);
      this.score = 0; this.baseScore = 0; this.lives = this.startLives; this.level = 1;
      this.initEntities();
      this.releaseTimers = releaseTimersFor(this.mode);
      this.bonus = null; this.bonusStage = 0; this.frightenedTimer = 0; this.ghostCombo = 0;
      this.extraLifeGiven = false;
      this.runTime = 0; this.levelTime = 0; this.lastClear = null;  // fresh speedrun clock
      return this.mode;
    }

    // Difficulty multipliers for the CURRENT mode. Attract + practice stay
    // neutral (1.0) so the demo always showcases arcade pacing and practice
    // has no viruses to tune.
    ghostSpeedMul() {
      if (this.attract || this.practice) return 1;
      return this.mode === 'craze'
        ? (this.difficulty.ghostSpeedCraze || 1)
        : (this.difficulty.ghostSpeed || 1);
    }
    releaseMul() {
      if (this.attract || this.practice) return 1;
      return this.mode === 'craze'
        ? (this.difficulty.releaseCraze || 1)
        : (this.difficulty.release || 1);
    }
    // Re-apply the current speed multiplier to the LIVE viruses (called by
    // main.js when the player changes a DIFFICULTY slider mid-run, and at
    // boot when the persisted options are loaded).
    applyDifficultySpeeds() {
      const mul = this.ghostSpeedMul();
      for (const g of this.ghosts) if (g) g.speed = this.stats.ghost * mul;
    }
    // Score scale for the CURRENT campaign: the difficulty knobs (ghost
    // speed + pellet release) compose into a pressure multiplier — faster
    // viruses and earlier releases pay more per data bit and per eaten
    // virus, so the DIFFICULTY sliders matter for the scoreboard (NORMAL
    // 100/100 = 1.0x). Bonus fruit scales too (prize x scoreMul) and the
    // extra-life threshold is scaled (extraLifeAt). addScore() takes BASE
    // (unscaled) values, banks them in baseScore for the leaderboard, and
    // converts to the SCALED HUD score. Attract + practice stay neutral
    // (1.0) — the demo is a showcase and practice scores don't count anyway.
    scoreMul() {
      if (this.attract || this.practice) return 1;
      const d = this.difficulty || {};
      const speed = (this.mode === 'craze' ? d.ghostSpeedCraze : d.ghostSpeed) || 1;
      const release = (this.mode === 'craze' ? d.releaseCraze : d.release) || 1;
      // pressure = speed / release (faster + earlier = harder); clamped so a
      // 50/150% slider extreme can't leave the sane 0.4x..2.5x band.
      return Math.round(Math.max(0.4, Math.min(2.5, speed / Math.max(0.1, release))) * 100) / 100;
    }
    // Score at which the next extra life is granted, scaled by the campaign's
    // difficulty multiplier — a HARD run (1.57x) needs 15,700 SCALED points,
    // which is the same 10,000 BASE of pickups as NORMAL, and EASY (0.69x)
    // needs 6,900. So extra lives arrive at the same BASE pace on every
    // difficulty instead of harder runs earning them faster. The threshold
    // follows the CURRENT difficulty at grant time — flipping down to EASY
    // late in a run could farm the life, a deliberate self-inflicted choice
    // consistent with how scoring itself works.
    extraLifeAt() {
      return Math.round(10000 * this.scoreMul());
    }

    // Move the start-screen selection (wraps: classic <-> craze).
    menuSelect(d) {
      const keys = Object.keys(MODE_BOARDS);
      this.menuSel = (this.menuSel + d + keys.length) % keys.length;
    }

    // ---- Attract mode (classic arcade-cabinet demo) ---------------------
    // After ~30s idle on the start screen the game plays itself, muted, until
    // ANY input returns to the mode menu. TWO ACTS alternate board-to-board:
    //   phase 0 SOLO  — ghostless AI Pac clears the board (pure eating).
    //   phase 1 CHASE — the autopilot Pac vs the real virus AI: scatter/chase
    //                   waves, pen releases, frightened blue time — the full
    //                   simulation. If the viruses catch Pac he respawns in
    //                   place (after a brief death beat) and the demo carries
    //                   on; it never game-overs. The demo must never corrupt
    //                   the real high score or grant extra lives (addScore).
    // Each board also assigns an AI PERSONALITY (ATTRACT_SCRIPT: EAT / CHASE /
    // SWEEP / POWER / FRUIT / EVADE) and steps the level every 3 boards, so
    // the loop reads as an AI showcase instead of the same route at the same
    // speed every time.
    startAttract() {
      this.attract = true;
      this.attractBoard = 0;
      this.score = 0;
      this.baseScore = 0;
      this.level = 1;
      this.mode = 'classic';       // neutral ghost config for the demo
      // Reset the speedrun clocks: the demo's HUD would otherwise show the
      // previous real run's frozen TIME/BEST (the timer block freezes them
      // while attract). The demo never records, so zero is honest.
      this.runTime = 0; this.levelTime = 0; this.lastClear = null;
      this.state = 'attract';
      this.setupAttractRun();      // board 0 loaded behind the opening table
      // Classic-cabinet opening: flash the real HIGH SCORE TABLE for a few
      // seconds BEFORE the first demo board plays (and again after each full
      // 10-board loop — see attractNextBoard).
      this.attractScoreboardTimer = 5;
    }
    setupAttractRun() {
      // Cycle every maze so the demo shows off all 10 boards.
      this.loadMaze(this.attractBoard % MAZES.length);
      // DEMO SCRIPT: assign this board's AI personality and step the level up
      // every 3 boards (before initEntities, so the speeds it builds use the
      // escalated level). Without this the demo played the same nearest-pellet
      // route at level-1 speed every loop — the "repetitive attract" look.
      this.attractPersonality = ATTRACT_SCRIPT[this.attractBoard % ATTRACT_SCRIPT_LEN];
      this.level = 1 + Math.floor((this.attractBoard % MAZES.length) / 3);
      this.initEntities();
      this.attractPhase = this.attractBoard % 2;   // even boards = solo act
      if (this.attractPhase === 0) this.ghosts = []; // solo act is ghostless
      this.frightenedTimer = 0; this.bonus = null; this.bonusStage = 0;
      this.extraLifeGiven = false;
      this.pac.dead = false; this.attractDeathTimer = 0;
      this._sweepTarget = null;                       // fresh SWEEP target per board
      this.releaseTimers = releaseTimersFor('classic');  // fresh pen per board
      // A fresh board = a fresh LEVEL start: reset the scatter/chase schedule
      // (startPlay() does the same). Without this, the modePhase/modeTimer
      // from the PREVIOUS board leak in (often deep into a long chase phase),
      // so later demo loops play without the opening scatter and destabilize
      // the chase acts.
      this.modePhase = 0; this.modeTimer = 0; this.globalMode = 'scatter';
    }
    stopAttract() {
      this.attract = false;
      this.showTitle();            // back to the mode menu
    }
    updateAttract(dt) {
      // HIGH SCORE TABLE between loops: the sim is frozen while it flashes
      // (the renderer draws the panel); when it expires the demo resumes.
      if (this.attractScoreboardTimer > 0) {
        this.attractScoreboardTimer -= dt;
        if (this.attractScoreboardTimer <= 0) {
          this.attractScoreboardTimer = 0;
          this.setupAttractRun();   // fresh board under the resumed demo
        }
        return;
      }
      // Death beat: freeze the sim for a beat, then respawn in place.
      if (this.attractDeathTimer > 0) {
        this.attractDeathTimer -= dt;
        if (this.attractDeathTimer <= 0) this.attractRespawn();
        return;
      }
      if (this.attractPhase === 1) {
        // CHASE ACT: full simulation — waves, releases, ghost AI, collisions.
        this.updateModeSchedule(dt);
        if (this.frightenedTimer > 0) { this.frightenedTimer -= dt; if (this.frightenedTimer <= 0) this.endFrighten(); }
        this.updateReleases(dt);
        this.updateBonus(dt);
        this.aiSteer();
        this.stepPac(dt);
        for (const g of this.ghosts) this.stepGhost(g, dt);
        this.attractCollide();
        if (this.maze.pelletsLeft <= 0) this.attractNextBoard();
      } else {
        // SOLO ACT: ghostless, pure eating.
        this.aiSteer();
        this.updateBonus(dt);
        this.stepPac(dt);
        if (this.maze.pelletsLeft <= 0) this.attractNextBoard();
      }
    }
    // Chase-act collision: frightened viruses are edible (scored), normal
    // ones catch Pac -> a brief death beat, then an in-place respawn. Never
    // decrements lives and never reaches game-over.
    attractCollide() {
      const R = COLLIDE_R;   // shared with checkCollisions — one radius to tune
      for (const g of this.ghosts) {
        if (Math.abs(g.px - this.pac.px) < R && Math.abs(g.py - this.pac.py) < R) {
          if (g.mode === 'frightened') this.eatGhost(g);
          else if (g.mode === 'normal') {
            this.pac.dead = true;
            this.attractDeathTimer = 0.9;
            return;
          }
        }
      }
    }
    attractRespawn() {
      // Reset Pac + the viruses to their spawn tiles; the board keeps its
      // eaten-pellet progress, and the demo stays in attract.
      this.initEntities();
      this.pac.dead = false;
      this.attractDeathTimer = 0;
      this.frightenedTimer = 0;
    }
    attractNextBoard() {
      this.attractBoard = (this.attractBoard + 1) % MAZES.length;
      // A full 10-board loop completed: flash the HIGH SCORE TABLE again
      // (classic cabinets show their scoreboard between attract loops), then
      // the demo wraps back to board 0 when the table clears. NOTE: during
      // the wrap table the loaded maze intentionally LAGS attractBoard (board
      // 9's state stays frozen under the panel) — the timer expiry's
      // setupAttractRun() loads board 0 fresh, so this is deliberate.
      if (this.attractBoard === 0) { this.attractScoreboardTimer = 5; return; }
      this.setupAttractRun();      // loop seamlessly onto the next act/board
    }
    aiSteer() {
      // The attract demo's autopilot: delegate to the standalone Bot (BB.Bot),
      // steering by the CURRENT board's demo personality (ATTRACT_SCRIPT) so
      // the attract loop reads as an AI showcase — varied routes, energizer
      // power plays, frightened-virus hunts, near-miss evasion — instead of
      // the same nearest-pellet path on every board. Practice mode (and any
      // external bot harness) uses the plain pellet bot.
      let d = null;
      if (this.attract) d = this.attractSteer();
      else d = this.bot.steer(this.pac, this.maze);
      this.pac.queued = d || DIRS.NONE;
    }
    // Shared near-miss dash for the EVADE + POWER acts. When a normal virus
    // gets within `trigger` tiles, take the single safest step away (Bot.
    // steerEscape) — a greedy one-step that never plans a route across the
    // converging viruses (full-path flee dies en route to its "safe" tile).
    // Returns a flee dir, or null to keep normal play.
    evadeSteer(p, trigger) {
      const thr = trigger || 6;
      const threats = [];
      let closest = Infinity;
      for (const g of (this.ghosts || [])) {
        if (g.mode === 'normal' && g.released && !g.inHouse) {
          const dd = Math.hypot(g.col - p.col, g.row - p.row);
          if (dd < closest) closest = dd;
          threats.push(g);
        }
      }
      if (!threats.length || closest > thr) return null;
      return this.bot.steerEscape(p, this.maze, threats);
    }

    // The current act's strategy. Every personality falls back to the plain
    // pellet bot, so every board still fully clears and the demo loops.
    attractSteer() {
      const p = this.pac, m = this.maze;
      const gs = this.ghosts || [];
      switch (this.attractPersonality) {
        case 'SWEEP': {
          // Farthest remaining pellet -> long, visibly different routes. The
          // target is STICKY: picked once and path-followed until eaten (or
          // unreachable). Re-picking the farthest pellet every frame makes the
          // target flip between two far pellets as Pac moves, and he ping-pongs
          // on the seam forever (the SWEEP deadlock).
          const st = this._sweepTarget;
          const keep = st && m.pellets.has(st.col + ',' + st.row) && !m.isPacWall(st.col, st.row);
          if (!keep) {
            this._sweepTarget = this.bot.farthestTarget(p, m) || null;
          }
          const t = keep ? st : this._sweepTarget;
          if (t) {
            const d = this.bot.steer(p, m, (c, r) => c === t.col && r === t.row);
            if (d) return d;
          }
          break;
        }
        case 'FRUIT': {
          // Bonus run: chase the upgrade while it's up, else eat normally.
          if (this.bonus) {
            const b = this.bonus;
            const d = this.bot.steer(p, m, (c, r) => c === b.col && r === b.row);
            if (d) return d;
          }
          break;
        }
        case 'POWER': {
          // Power play: while a virus is blue, HUNT the nearest frightened one
          // (the demo's most dramatic moment); otherwise rush the nearest
          // energizer; otherwise eat.
          if (this.frightenedTimer > 0) {
            let fg = null, bd = Infinity;
            for (const g of gs) {
              if (g.mode === 'frightened' && g.released) {
                const dd = Math.hypot(g.col - p.col, g.row - p.row);
                if (dd < bd) { bd = dd; fg = g; }
              }
            }
            if (fg) {
              const d = this.bot.steer(p, m, (c, r) => c === fg.col && r === fg.row);
              if (d) return d;
            }
          }
          // Not blue: dash for the nearest energizer — but juke away when a
          // normal virus is on top of him instead of charging through it
          // (near-miss drama without the death spiral).
          const d = this.evadeSteer(p, 4);
          if (d) return d;
          const d2 = this.bot.steer(p, m, (c, r) => m.pellets.get(c + ',' + r) === 'energizer');
          if (d2) return d2;
          break;
        }
        case 'EVADE': {
          // Near-miss dodging: flee (sticky) when a normal virus is close,
          // otherwise keep eating.
          const d = this.evadeSteer(p, 7);
          if (d) return d;
          break;
        }
        default: break;   // 'EAT' / 'CHASE': plain pellet run
      }
      return this.bot.steer(p, m);
    }

    // ---- Arcade initials entry -------------------------------------------
    // Arm the qualifying game-over beat (main.js bookkeeping calls this when
    // a score makes the table): the engine holds GAME OVER for the beat, then
    // opens the initials prompt seeded with the player's last-used letters.
    armPendingInitials(letters) {
      this.pendingInitials = true;
      this.pendingInitialsTimer = PENDING_INITIALS_DELAY;
      this.pendingInitialsLetters = String(letters || 'AAA').slice(0, 3).toUpperCase();
    }
    // The classic "ENTER YOUR INITIALS" screen between a qualifying game-over
    // and the scoreboard insert. The sim is frozen while it shows.
    beginInitials(initialLetters) {
      this.initials = String(initialLetters || 'AAA').slice(0, 3).toUpperCase().split('');
      this.initialsSlot = 0;
      this.state = 'initials';
    }
    // Cycle the letter in the CURRENT slot (Up/Down; wraps A<->Z).
    initialsCycle(d) {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const cur = letters.indexOf(this.initials[this.initialsSlot]);
      const nxt = ((cur + d) % 26 + 26) % 26;
      this.initials[this.initialsSlot] = letters[nxt];
    }
    // Move the active slot (Left/Right; clamps 0..2).
    initialsMove(d) {
      this.initialsSlot = Math.max(0, Math.min(2, this.initialsSlot + d));
    }
    // Confirm — main.js attaches the initials to the pending entry and calls
    // this to return to the normal game-over screen. Nothing is pending
    // anymore: the beat can't re-fire and the flash flag drops.
    finishInitials() {
      this.state = 'gameover';
      this.pendingInitials = false;
      this.pendingInitialsTimer = 0;
    }

    update(dt) {
      // Speedrun clock — real time while a run is live (READY / play / death /
      // intermission). Frozen on the title screen, during the attract demo, and
      // while the initials entry / game-over screens show.
      if (!this.attract && this.state !== 'title' && this.state !== 'gameover' && this.state !== 'initials') {
        this.runTime += dt;
        this.levelTime += dt;
      }
      // ---- Qualifying game-over beat + ABANDON GUARD ----
      // A table-worthy run shows GAME OVER for PENDING_INITIALS_DELAY (the
      // classic beat), then opens ENTER YOUR INITIALS. Leaving the game-over
      // screen — showTitle, a reboot, any state change away from gameover /
      // initials — ABANDONS the pending entry: flag + timer clear and the
      // beat can NEVER re-fire on a later game-over. main.js is notified via
      // 'abandonInitials' so it drops its entry object (score/id/initials).
      // NOTE: the timer decrements per update() call (STEP); under sustained
      // heavy frame drops the beat may stretch slightly past 2.2s wall-clock
      // — a deliberate, harmless stretch for a visual beat (don't "fix" it).
      if (this.pendingInitials) {
        if (this.state !== 'gameover' && this.state !== 'initials') {
          this.pendingInitials = false;
          this.pendingInitialsTimer = 0;
          this.onEvent('abandonInitials');
        } else if (this.state === 'gameover' && this.pendingInitialsTimer > 0) {
          this.pendingInitialsTimer -= dt;
          if (this.pendingInitialsTimer <= 0) {
            this.pendingInitialsTimer = 0;
            this.beginInitials(this.pendingInitialsLetters);
          }
        }
      }
      if (this.state === 'title') return;   // frozen until the player starts
      if (this.state === 'attract') { this.updateAttract(dt); return; }
      if (this.state === 'initials') return; // frozen during the arcade initials entry
      if (this.state === 'ready') { this.readyTimer -= dt; if (this.readyTimer <= 0) this.startPlay(); return; }
      if (this.state === 'death') {
        this.deathTimer -= dt;
        // The viruses flagged by killPac dash back to the pen during the
        // death beat. With RETREAT ON that is every virus out of the pen
        // (arcade behavior); with it OFF only FRIGHTENED (blue) ones flee —
        // normal viruses freeze where the collision happened, so the easier
        // mode still never strands an edible virus beside Pac's respawn.
        // Only retreat-mode viruses step here — the rest of the sim stays
        // frozen.
        if (this.deathTimer > 0)
          for (const g of this.ghosts) if (g.mode === 'retreat') this.stepGhost(g, dt);
        if (this.deathTimer <= 0) this.respawn();
        return;
      }
      if (this.state === 'intermission') { this.intermissionTimer -= dt; if (this.intermissionTimer <= 0) this.advanceLevel(); return; }
      if (this.state !== 'play') return;

      this.updateModeSchedule(dt);
      if (this.frightenedTimer > 0) { this.frightenedTimer -= dt; if (this.frightenedTimer <= 0) this.endFrighten(); }
      this.updateReleases(dt);
      this.updateBonus(dt);
      this.stepPac(dt);
      for (const g of this.ghosts) this.stepGhost(g, dt);
      this.checkCollisions();

      if (this.maze.pelletsLeft <= 0) {
        // A board was just cleared: record its speedrun time (campaign runs
        // only), then either show the intermission cutscene or advance on.
        this.recordClear();
        if (this.level % 2 === 0 && this.level < 14) this.startIntermission();
        else this.nextLevel();
      }
    }

    // Record the just-cleared board's time into the per-board best-times table
    // (campaign runs only — practice and the attract demo never touch it). The
    // board is identified by its global maze index, so a classic and a craze
    // campaign share the same maze's leaderboard. Fires 'levelclear' so main.js
    // can persist the table; lastClear feeds the intermission's NEW RECORD line.
    recordClear() {
      if (this.attract || this.practice) {
        // Gated runs must NOT replay the previous campaign's clear line —
        // practice boards advance with intermissions, and drawIntermission
        // reads lastClear unconditionally, so a stale lastClear would show a
        // wrong "BOARD CLEARED" claim on a practice board clear.
        this.lastClear = null;
        return;
      }
      const board = this.mazeIndex;
      const prev = this.bestTimes[board];
      // prev is null when the board has no record yet. NOTE: a bare `!(prev
      // >= 0)` is WRONG here — `null >= 0` coerces to true in JS, so a fresh
      // board never registered a first best. Explicit null check required.
      const newBest = prev == null || this.levelTime < prev;
      if (newBest) this.bestTimes[board] = this.levelTime;
      this.lastClear = { board, time: this.levelTime, newBest };
      this.onEvent('levelclear', this.lastClear);
    }

    updateModeSchedule(dt) {
      const sched = modeScheduleForLevel(this.level);
      if (this.modePhase >= sched.length) return;
      const [mode, dur] = sched[this.modePhase];
      if (this.globalMode !== mode) { this.globalMode = mode; this.modeTimer = dur; }
      // startPlay() leaves modeTimer 0; arm the opening phase (scatter) here or
      // the first frame immediately advances past it (ghosts started in chase).
      else if (this.modeTimer === 0) { this.modeTimer = dur; }
      this.modeTimer -= dt;
      if (this.modeTimer <= 0 && this.modePhase < sched.length - 1) {
        this.modePhase++;
        this.globalMode = sched[this.modePhase][0];
        this.modeTimer = sched[this.modePhase][1];
        for (const g of this.ghosts) if (g.mode === 'normal') this.reverseGhost(g);
      }
    }

    reverseGhost(g) {
      const oc = g.col, or = g.row;
      g.col = g.nextCol; g.row = g.nextRow;
      g.nextCol = oc; g.nextRow = or;
      g.progress = 1 - g.progress;
      g.dir = DIRS[OPP[g.dir.name]];
    }

    updateReleases(dt) {
      // Only ONE ghost may transit the house exit at a time. Releasing all of
      // them simultaneously (e.g. right after a respawn, when every release
      // timer reads <=0) makes them converge on the single 2-wide door and
      // stack on the same pixel (the "ghosts overlapping in the pen" anomaly).
      // So a parked ghost may only begin leaving once the shaft is clear. The
      // flag is kept LIVE inside the loop, so the very frame one ghost starts
      // leaving, the others are held until it has cleared the box.
      //
      // Release pacing is arcade-authentic: Pinky leaves immediately; Inky
      // once ~30 pellets are eaten (level-scaled); Clyde once ~60 are eaten.
      // The timer is only a slow fallback so a timid player isn't punished.
      const eaten = this.maze.totalPellets - this.maze.pelletsLeft;
      const lvl = Math.max(1, this.level);
      // Per-mode release pacing: craze pressures earlier (~40% fewer pellets).
      const rel = MODE_RELEASE[this.mode] || MODE_RELEASE.classic;
      // Player difficulty: the release slider scales the arcade pellet counts
      // (below 100% = viruses emerge sooner = rougher; above = later = easier).
      // relMul is floored so a 0/negative override (e.g. a hand-set
      // difficulty object) can't turn the timer decrement below into ±Infinity.
      const relMul = Math.max(0.1, this.releaseMul() || 0.1);
      const inkyAt = Math.max(1, Math.round(rel.inky(lvl) * relMul));
      const clydeAt = Math.max(1, Math.round(rel.clyde(lvl) * relMul));
      let someoneLeaving = this.ghosts.some(g => g.leaving);
      for (const g of this.ghosts) {
        if (g.released) continue;
        const t = this.releaseTimers[g.id] || 0;
        // The idle fallback timer follows the same knob — a later-release
        // setting also slows the timer so it can't leak viruses out early.
        this.releaseTimers[g.id] = t - dt / relMul;
        const pelletUp = (g.id === 'clyde' && eaten >= clydeAt) || (g.id === 'inky' && eaten >= inkyAt);
        const timerUp = t <= 0;
        if ((pelletUp || timerUp) && !someoneLeaving) {
          g.released = true; g.inHouse = false; g.leaving = true;
          someoneLeaving = true; // lock the shaft for the rest of this frame
        }
      }
    }

    updateBonus(dt) {
      if (this.bonus) {
        this.bonusTimer -= dt;
        this.bonus.timer = this.bonusTimer; // keep object timer in sync for renderer
        if (this.bonusTimer <= 0) this.bonus = null;
      } else if ((this.state === 'play' || this.state === 'attract') && this.bonusStage < 2) {
        // Spawn the fruit the first time eaten CROSSES the arcade pellet
        // threshold for this board (classic 70/170, Ms 64/172-174...). Use >=
        // (not ==) so a fast frame that eats 2+ pellets and jumps PAST the
        // exact integer still triggers the fruit; bonusStage guards against
        // double-spawns.
        const eaten = this.maze.totalPellets - this.maze.pelletsLeft;
        const thresholds = FRUIT_RELEASE[this.mazeIndex % FRUIT_RELEASE.length];
        if (eaten >= thresholds[this.bonusStage]) {
          // Type advances up the upgrade ladder as the RUN progresses so later
          // boards aren't stuck on RAM/CPU: level 1 spawns RAM+CPU, level 2
          // GPU+HDD, level 3 SSD+PSU, level 4 NIC+ROM, then wraps. The renderer
          // already indexes FRUIT_ITEMS/FRUIT_SCORES with a modulo, so a wrap
          // here is safe. (A past version used `type: this.bonusStage`, which
          // capped the ladder at CPU and, with bonusStage never reset per level,
          // meant boards after the first never spawned ANY fruit.)
          const type = fruitTypeFor(this.level, this.bonusStage);
          this.bonus = { col: this.maze.bonusTile.col, row: this.maze.bonusTile.row, type, timer: 9 };
          this.bonusTimer = 9; this.bonusStage++;
          this.onEvent('bonus');
        }
      }
    }

    stepPac(dt) {
      const p = this.pac, m = this.maze;
      // --- Instant perpendicular turns (no grid-lock lag) --------------------
      // OLD behaviour: a queued perpendicular turn only committed at an exact
      // tile centre, so for the first half of every tile (progress 0..0.5) the
      // press was ignored and Pac travelled up to a full tile before turning ->
      // a 16-83ms "delay between movements" the user kept feeling. v11 only
      // fixed the LATE press (progress>0.5 corner-cut); the EARLY half was
      // still dead. Fix: commit a perpendicular turn the instant it is open,
      // snapping Pac to the NEAREST edge of his current tile and redirecting.
      // This keeps grid-aligned collisions/eating intact (Pac is still always
      // exactly on a tile centre when he crosses), it just removes the wait.
      // --- Start-from-rest: apply the queued direction instantly -------------
      // When Pac is STOPPED (dir NONE — a dead-end wall stopped him, or he
      // hasn't started yet), a queued input used to be ignored until the
      // tile-crossing loop below saw progress reach 1.0 — but progress only
      // advances at speed*dt while he's moving, so a press sat dead for a
      // full tile-time (~125ms at 8 t/s): "controls not responsive". Fix:
      // if he's parked and the queued direction is open, start moving on the
      // very next frame (progress stays 0 — he begins from his tile centre).
      if (p.dir.name === 'NONE' && p.queued.name !== 'NONE' &&
          !m.isPacWall(WRAP(p.col + p.queued.x), p.row + p.queued.y)) {
        p.dir = p.queued;
        p.nextCol = WRAP(p.col + p.queued.x);
        p.nextRow = p.row + p.queued.y;
        p.progress = 0;
      }
      if (p.dir.name !== 'NONE' && p.queued.name !== 'NONE' && p.queued.name !== p.dir.name) {
        // Perpendicular turn, snapped to a tile centre so the redirect is
        // immediate (never a full-tile wait). Two critical correctness rules:
        //  1. The turn tile is checked relative to the tile Pac will actually
        //     COMMIT at. A past bug checked it relative to the tile he is
        //     LEAVING, so on a 1-wide corner (e.g. going RIGHT with the UP
        //     corridor only above the current tile) he committed at the next
        //     tile, aimed into a WALL and walked into it — the corner glitch.
        //  2. progress NEVER goes negative. A negative progress rendered Pac
        //     off-lane (dipped into the neighbouring corridor / wall block)
        //     right at corners, which also misaligned ghost collisions.
        if (p.progress >= 0.5) {
          // He's past the centre — commit the turn at the NEXT tile centre.
          const nc = WRAP(p.nextCol), nr = p.nextRow;
          if (!m.isPacWall(WRAP(nc + p.queued.x), nr + p.queued.y)) {
            p.col = nc; p.row = nr; p.progress = 0;
            p.dir = p.queued;
            p.nextCol = WRAP(nc + p.queued.x); p.nextRow = nr + p.queued.y;
          }
        } else {
          // Before the centre — turn at the CURRENT tile centre.
          if (!m.isPacWall(WRAP(p.col + p.queued.x), p.row + p.queued.y)) {
            p.progress = 0;
            p.dir = p.queued;
            p.nextCol = WRAP(p.col + p.queued.x); p.nextRow = p.row + p.queued.y;
          }
        }
      }
      // Tunnel slowdown applies to Pac too (arcade: everyone crawls in the
      // warp corridors) — but ONLY while traveling ALONG the tunnel (dir.x).
      // The tunnel is a HORIZONTAL corridor; the Ms. Pac-Man boards route
      // vertical lanes straight through the marked tunnel columns (cols
      // 3/4/23/24), so crossing a tunnel row vertically is just crossing the
      // row — never entering the tunnel. Slowing there made Pac visibly crawl
      // for no reason (the "phantom tunnel slowdown" bug). Standing still on
      // a tunnel tile (dir NONE) isn't traveling it either.
      const pspd = (p.dir.x !== 0 && m.tunnelTiles.has(key(p.col, p.row))) ? this.stats.tunnel : p.speed;
      p.progress += pspd * dt;
      let safety = 0;
      while (p.progress >= 1 && safety++ < 8) {
        p.progress -= 1;
        p.col = WRAP(p.nextCol); p.row = p.nextRow;
        const q = p.queued;
        const qc = WRAP(p.col + q.x), qr = p.row + q.y;
        if (q.name !== 'NONE' && !m.isPacWall(qc, qr)) p.dir = q;
        else if (m.isPacWall(WRAP(p.col + p.dir.x), p.row + p.dir.y)) p.dir = DIRS.NONE;
        p.nextCol = WRAP(p.col + p.dir.x); p.nextRow = p.row + p.dir.y;
        if (p.dir.name === 'NONE') { p.progress = 0; p.nextCol = p.col; p.nextRow = p.row; break; }
      }
      // --- Eat whatever is on Pac's CURRENT tile (every frame) ----------------
      // Previously eating only happened inside the tile-crossing loop above, so
      // a bonus/energizer sitting on the tile Pac is ALREADY on (he reversed
      // onto it, or parked there) was never consumed -> "pass over it, never
      // collects". Eating on the current tile every frame fixes that and also
      // guarantees the energizer always registers the instant Pac reaches it.
      this.eatAtPacTile();
      p.px = p.col + 0.5 + WRAP_delta(p.nextCol - p.col) * p.progress;
      p.py = p.row + 0.5 + (p.nextRow - p.row) * p.progress;
      if (p.px < -0.5) p.px += 28; if (p.px > 28.5) p.px -= 28;
    }

    eatAtPacTile() {
      const p = this.pac, m = this.maze;
      const ate = m.eatPellet(p.col, p.row);
      // BASE (unscaled) arcade values: data bits are 10, antivirus pills 50.
      // addScore() applies the campaign's difficulty multiplier to the HUD
      // score and banks the unscaled value in baseScore for the leaderboard.
      if (ate === 'dot') { this.addScore(10); this.onEvent('chomp'); }
      else if (ate === 'energizer') { this.addScore(50); this.onEvent('chomp'); this.startFrighten(); }
      if (this.bonus && this.bonus.col === p.col && this.bonus.row === p.row) this.eatBonus();
    }

    stepGhost(g, dt) {
      const m = this.maze;
      if (!g.released) {
        // Parked in the pen. Each penned ghost sits at its own distinct spawn
        // tile (cols 11/13/15) so they never stack or clip through each other.
        // (Classic behavior: ghosts hold position until released, then exit.)
        g.progress = 0; g.dir = DIRS.UP;
        g.px = g.col + 0.5;
        g.py = g.row + 0.5;
        return;
      }
      let spd = g.mode === 'frightened' ? this.stats.fright * this.ghostSpeedMul()
        : (g.mode === 'eyes' || g.mode === 'retreat') ? this.stats.eyes : g.speed;
      // Blinky's Cruise Elroy: as the maze empties he speeds up (arcade: boost
      // at 20 pellets remaining, bigger at 10) — the end-of-level squeeze.
      if (g.id === 'blinky' && g.mode === 'normal' && g.released && !g.inHouse && !g.leaving) {
        const left = m.pelletsLeft;
        if (left <= 20) spd += this.stats.elroy[left <= 10 ? 1 : 0];
      }
      // Tunnel slowdown (arcade: the warp corridors are slow for everyone)
      // — horizontal-only, matching Pac: a ghost crawls only while traveling
      // ALONG the tunnel, not when a vertical lane crosses a tunnel row
      // through a marked column (see stepPac — same rule, same reason).
      if (g.dir.x !== 0 && m.tunnelTiles.has(key(g.col, g.row))) spd = this.stats.tunnel;
      g.progress += spd * dt;
      let safety = 0;
      while (g.progress >= 1 && safety++ < 8) {
        g.progress -= 1;

      ctx.fillRect(px, py, pw, ph);
      this.drawChipFrame(ctx, px, py, pw, ph, '#7df9ff');
      if (blink) {
        ctx.fillStyle = '#ffe600';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText('▶ HOW TO PLAY ◀', cx, py + 30);
      }
      ctx.fillStyle = 'rgba(125,249,255,0.8)';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('THE BASICS · ANY MODE', cx, py + 50);
      // -- left column: per-mode controls (keyboard + mouse + touch) --
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText('CONTROLS', px + 30, py + 78);
      const rows = [
        ['MOVE', 'ARROWS/WASD · DRAG · D-PAD'],
        ['PAUSE', 'P / ESC · D-PAD CENTER'],
        ['MUTE', 'M · MUTE BUTTON'],
        ['CONFIRM', 'ENTER / SPACE / TAP'],
        ['REBOOT', 'ENTER · REBOOT BUTTON'],
        ['PAD', 'STICK MOVE · A OK · B BACK']
      ];
      rows.forEach((r, i) => {
        const y = py + 100 + i * 24;
        ctx.fillStyle = 'rgba(125,249,255,0.9)';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.fillText(r[0], px + 30, y);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '12px "Courier New", monospace';
        ctx.fillText(r[1], px + 122, y);
      });
      // -- right column: goals shared by every mode --
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText('THE GOAL', px + 330, py + 78);
      const goal = [
        'EAT EVERY DATA BIT TO CLEAR THE',
        'BOARD. DODGE THE VIRUSES — OR',
        'HUNT THEM WHILE THEY ARE BLUE.',
        'GRAB THE RAM / CPU / GPU FOR',
        'BONUS POINTS. NO TIME LIMIT,',
        'JUST CLEAR THE BOARD AND GO!'  ];
      goal.forEach((g, i) => {
        ctx.fillStyle = i === goal.length - 1 ? '#ffe600' : 'rgba(255,255,255,0.85)';
        ctx.font = (i === goal.length - 1 ? 'bold 12px ' : '12px ') + '"Courier New", monospace';
        ctx.fillText(g, px + 330, py + 100 + i * 24);
      });
      // mode chips row
      ctx.textAlign = 'center';
      const modes = [['CLASSIC', '7 ARCADE BOARDS'], ['MAZE CRAZE', '3 PCB BOARDS'], ['PRACTICE', 'GHOSTLESS · FREE']];
      modes.forEach((m, i) => {
        const mx = px + 96 + i * 176;
        ctx.fillStyle = 'rgba(125,249,255,0.10)';
        ctx.fillRect(mx - 72, py + 258, 144, 30);
        ctx.strokeStyle = 'rgba(125,249,255,0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(mx - 72, py + 258, 144, 30);
        ctx.fillStyle = '#7df9ff';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.fillText(m[0], mx, py + 269);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '10px monospace';
        ctx.fillText(m[1], mx, py + 283);
      });
      this.drawPauseRow(ctx, px, py, pw, py + 322, 'BACK', null, c, 0);
    }

    drawPauseOptions(ctx, game, c, blink) {
      const pw = 460, ph = 320, px = (CANVAS_W - pw) / 2, py = PREPAD + 196;
      const cx = CANVAS_W / 2;
      ctx.fillStyle = 'rgba(6,12,24,0.94)';
      ctx.fillRect(px, py, pw, ph);
      this.drawChipFrame(ctx, px, py, pw, ph, '#7df9ff');
      if (blink) {
        ctx.fillStyle = '#ffe600';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText('▶ SOUND & DISPLAY ◀', cx, py + 30);
      }
      ctx.fillStyle = 'rgba(125,249,255,0.8)';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('SETTINGS · WHILE PAUSED', cx, py + 50);
      const val = this.pauseOpts || { muted: false, siren: true, crt: true, brightness: 1, ghostSpeed: 100, ghostSpeedCraze: 100, release: 100, releaseCraze: 100, retreat: true };
      const rows = [
        { label: 'MUTE', value: val.muted ? 'ON' : 'OFF' },
        { label: 'SIREN', value: val.siren ? 'ON' : 'OFF' },
        { label: 'CRT EFFECT', value: val.crt ? 'ON' : 'OFF' },
        { label: 'BRIGHTNESS', value: ['DIM', 'NORM', 'BRIGHT'][val.brightness] || 'NORM' },
        { label: 'DIFFICULTY', value: null },
        { label: 'BACK', value: null }
      ];
      rows.forEach((r, i) => this.drawPauseRow(ctx, px, py, pw, py + 78 + i * 34, r.label, r.value, c, i));
      ctx.fillStyle = 'rgba(207,233,255,0.6)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEFT/RIGHT (OR ENTER) CHANGE · ESC BACK', cx, py + 282);
    }

    // ---- DIFFICULTY page (pause page 3) --------------------------------
    // Per-campaign tuning, persisted in bitbyte.options exactly like the
    // sound & display options: CLASSIC + MAZE CRAZE virus-speed sliders
    // (50-150% of the arcade speed) and the same two pellet-release sliders
    // (below 100% = viruses emerge sooner = rougher; above = later =
    // easier), plus the arcade GHOST RETREAT toggle (viruses dash home when
    // Pac dies; with it OFF only FRIGHTENED blue viruses still flee, so an
    // edible virus is never frozen beside Pac's respawn). Slider rows draw a
    // live track; every change applies to the CURRENT run instantly (main.js
    // re-tunes the live viruses) and survives reloads.
    drawPauseDifficulty(ctx, game, c, blink) {
      const pw = 460, ph = 320, px = (CANVAS_W - pw) / 2, py = PREPAD + 196;
      const cx = CANVAS_W / 2;
      ctx.fillStyle = 'rgba(6,12,24,0.94)';
      ctx.fillRect(px, py, pw, ph);
      this.drawChipFrame(ctx, px, py, pw, ph, '#40ff70');
      if (blink) {
        ctx.fillStyle = '#ffe600';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText('▶ DIFFICULTY ◀', cx, py + 30);
      }
      ctx.fillStyle = 'rgba(64,255,112,0.8)';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('PICK YOUR FIGHT · PER CAMPAIGN', cx, py + 50);
      const val = this.pauseOpts || { muted: false, siren: true, crt: true, brightness: 1, ghostSpeed: 100, ghostSpeedCraze: 100, release: 100, releaseCraze: 100, retreat: true };
      // Each slider row shows the campaign's CURRENT preset next to its
      // percent, so the tuning page reads "105% · HARD" — and the moment a
      // slider is touched that campaign's preset flips to CUSTOM here.
      const pp = val.presets || { classic: 'NORMAL', craze: 'NORMAL' };
      const rows = [
        { label: 'CLASSIC GHOST SPEED', value: val.ghostSpeed + '% · ' + pp.classic, track: (val.ghostSpeed - 50) / 100 },
        { label: 'MAZE CRAZE GHOST SPEED', value: val.ghostSpeedCraze + '% · ' + pp.craze, track: (val.ghostSpeedCraze - 50) / 100 },
        { label: 'CLASSIC RELEASE', value: val.release + '% · ' + pp.classic, track: (val.release - 50) / 100 },
        { label: 'MAZE CRAZE RELEASE', value: val.releaseCraze + '% · ' + pp.craze, track: (val.releaseCraze - 50) / 100 },
        { label: 'RETREAT AFTER DEATH', value: val.retreat ? 'ON' : 'OFF' },
        { label: 'BACK', value: null }
      ];
      rows.forEach((r, i) => this.drawPauseRow(ctx, px, py, pw, py + 78 + i * 34, r.label, r.value, c, i, r.track));
      ctx.fillStyle = 'rgba(207,233,255,0.6)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEFT/RIGHT CHANGE · BELOW 100% IS ROUGHER · ESC BACK', cx, py + 282);
    }

    // ---- RESET HIGH SCORES page (pause page 4) ---------------------------
    // A destructive-action confirm, reached from the main page's 6th row: a
    // red-chip warning with ERASE / CANCEL rows. ERASE wipes the leaderboard
    // table, its one-time seed marker, both legacy per-mode highs, and the
    // speedrun best-times (main.js wipeHighScores) and flips this page to a
    // WIPED confirmation with a single BACK row. Red highlights on the
    // destructive rows so wiping never reads as a harmless toggle.
    drawPauseReset(ctx, game, c, blink) {
      const pw = 460, ph = 320, px = (CANVAS_W - pw) / 2, py = PREPAD + 196;
      const cx = CANVAS_W / 2;
      ctx.fillStyle = 'rgba(6,12,24,0.94)';
      ctx.fillRect(px, py, pw, ph);
      this.drawChipFrame(ctx, px, py, pw, ph, '#ff6b6b');
      if (blink) {
        ctx.fillStyle = '#ff6b6b';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText('▶ ERASE HIGH SCORES ◀', cx, py + 30);
      }
      if (this.pauseResetDone) {
        // WIPED confirmation: the cabinet is clean; BACK returns to the menu
        ctx.fillStyle = 'rgba(80,255,140,0.95)';
        ctx.font = 'bold 21px "Courier New", monospace';
        ctx.fillText('✔ ALL HIGH SCORES WIPED', cx, py + 84);
        ctx.fillStyle = 'rgba(207,233,255,0.7)';
        ctx.font = '12px monospace';
        ctx.fillText('THE CABINET IS CLEAN · A FRESH TABLE', cx, py + 116);
        ctx.fillText('BEGINS WITH YOUR NEXT GAME', cx, py + 134);
        this.drawPauseRow(ctx, px, py, pw, py + 228, 'BACK', null, c, 0);
        ctx.fillStyle = 'rgba(207,233,255,0.6)';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ENTER OR ESC RETURNS TO THE MENU', cx, py + 282);
        return;
      }
      ctx.fillStyle = 'rgba(255,107,107,0.85)';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('DESTRUCTIVE · NO UNDO', cx, py + 50);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '12px monospace';
      ctx.fillText('WIPES THE TABLE, BOTH CAMPAIGN HIGHS,', cx, py + 78);
      ctx.fillText('AND EVERY BEST TIME.', cx, py + 96);
      ctx.fillText('NO WAY BACK.', cx, py + 114);
      this.drawPauseRow(ctx, px, py, pw, py + 172, 'ERASE HIGH SCORES', null, c, 0, null, true);
      this.drawPauseRow(ctx, px, py, pw, py + 206, 'CANCEL', null, c, 1);
      ctx.fillStyle = 'rgba(207,233,255,0.6)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('UP/DOWN SELECT · ENTER CONFIRMS · ESC BACK', cx, py + 282);
    }

    // One selectable pause row: label (+ a right-aligned current value on the
    // options page). The active row glows cyan with a ▶ marker. A `track`
    // value (0..1) draws a mini slider bar + nub (difficulty sliders).
    drawPauseRow(ctx, px, py, pw, cy, label, value, c, i, track, danger) {
      const active = i === this.pauseSel;
      const pulse = 0.75 + 0.25 * Math.sin(c * 5 + i);
      // A `danger` row (destructive action) highlights RED instead of cyan
      // so wiping scores never reads as a harmless toggle.
      const acc = danger ? '255,107,107' : '125,249,255';
      if (active) {
