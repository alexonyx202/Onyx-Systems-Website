  ctx.beginPath(); ctx.arc(0, 0, size * 0.5, 0, Math.PI*2); ctx.stroke();

  // Center
  ctx.fillStyle = '#aaa';
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();

  // HP bar
  const barW = 50, barH = 4;
  ctx.fillStyle = '#333';
  ctx.fillRect(-barW/2, -size - 12, barW, barH);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-barW/2, -size - 12, barW * (b.hp / b.maxHp), barH);

  ctx.restore();
}

function drawFormationShipVector(ctx, s) {
  if (!s.alive) return;
  const sp = screenPos(s.x, s.y);
  if (sp.x < -30 || sp.x > G.w + 30 || sp.y < -30 || sp.y > G.h + 30) return;

  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.moveTo(8, 0); ctx.lineTo(-5, -4);
  ctx.lineTo(-3, 0); ctx.lineTo(-5, 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawBulletsVector(ctx) {
  // Bullets are small solid dots — clearly smaller than the ships so the
  // two never get confused (the old 3px squares/outlined circles were nearly
  // the same footprint as a small enemy).
  //
  // Player vs enemy fire is kept distinct: your shots are small, bright
  // white dots; incoming enemy fire is a touch larger and dimmer, so it
  // reads as a different threat at a glance (mirroring neon mode's red).
  for (const b of G.bullets) {
    const sp = screenPos(b.x, b.y);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 2, 0, Math.PI*2); ctx.fill();
  }
  for (const b of G.enemyBullets) {
    const sp = screenPos(b.x, b.y);
    ctx.fillStyle = '#9aa0b5';
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 3, 0, Math.PI*2); ctx.fill();
  }
}

function drawParticlesVector(ctx) {
  for (const p of G.particles) {
    const sp = screenPos(p.x, p.y);
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(sp.x - p.size/2, sp.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawTurretsVector(ctx) {
  for (const t of G.turrets) {
    if (!t.alive) continue;
    const sp = screenPos(t.x, t.y);
    if (sp.x < -20 || sp.x > G.w + 20 || sp.y < -20 || sp.y > G.h + 20) continue;

    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#333';
    ctx.fillRect(-6, -4, 12, 8);
    ctx.strokeRect(-6, -4, 12, 8);
    ctx.fillStyle = '#666';
    ctx.fillRect(-2, -8, 4, 6);
    ctx.restore();
  }
}

function drawHiddenTargetsVector(ctx) {
  for (const t of G.hiddenTargets) {
    if (!t.alive) continue;
    const sp = screenPos(t.x, t.y);
    const near = Math.abs(sp.x - G.w/2) < 300 && Math.abs(sp.y - G.h/2) < 250;
    if (near) {
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 4 + Math.sin(G.frame * 0.1) * 1.5, 0, Math.PI*2); ctx.stroke();
    }
  }
}

function drawPowerUpsVector(ctx) {
  for (const pu of G.powerUps) {
    const sp = screenPos(pu.x, pu.y);
    if (sp.x < -40 || sp.x > G.w + 40 || sp.y < -40 || sp.y > G.h + 40) continue;
    const alpha = Math.min(1, pu.life / 2);
    ctx.globalAlpha = alpha;
    const s = 6 + Math.sin(pu.pulse) * 2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    // Diamond shape
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y - s);
    ctx.lineTo(sp.x + s, sp.y);
    ctx.lineTo(sp.x, sp.y + s);
    ctx.lineTo(sp.x - s, sp.y);
    ctx.closePath();
    ctx.stroke();
    // Type-specific inner mark
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = alpha * 0.7;
    if (pu.type === 'extralife') {
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 3, 0, Math.PI*2); ctx.fill();
    } else if (pu.type === 'shield') {
      ctx.fillRect(sp.x - 2, sp.y - 2, 4, 4);
    } else {
      ctx.fillRect(sp.x - 1, sp.y - 3, 2, 6);
    }
    ctx.globalAlpha = 1;
  }
}

function drawFloatingTextsVector(ctx) {
  for (const ft of G.floatingTexts) {
    const sp = screenPos(ft.x, ft.y);
    const alpha = ft.life / ft.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, sp.x, sp.y);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  STYLE-DISPATCHING WRAPPERS
// ============================================================
// These replace the direct draw calls in render()
function drawBackgroundDispatch(ctx) {
  if (G.style === 'neon') drawBackground(ctx);
  else drawBackgroundVector(ctx);
}
function drawPlayerDispatch(ctx) {
  if (G.style === 'neon') drawPlayer(ctx);
  else drawPlayerVector(ctx);
}
function drawEnemyDispatch(ctx, e) {
  if (G.style === 'neon') drawEnemy(ctx, e);
  else drawEnemyVector(ctx, e);
}
function drawBossDispatch(ctx, b) {
  if (G.style === 'neon') drawBoss(ctx, b);
  else drawBossVector(ctx, b);
}
function drawFormationShipDispatch(ctx, s) {
  if (G.style === 'neon') drawFormationShip(ctx, s);
  else drawFormationShipVector(ctx, s);
}
function drawBulletsDispatch(ctx) {
  if (G.style === 'neon') drawBullets(ctx);
  else drawBulletsVector(ctx);
}
function drawParticlesDispatch(ctx) {
  if (G.style === 'neon') drawParticles(ctx);
  else drawParticlesVector(ctx);
}
function drawTurretsDispatch(ctx) {
  if (G.style === 'neon') drawTurrets(ctx);
  else drawTurretsVector(ctx);
}
function drawHiddenTargetsDispatch(ctx) {
  if (G.style === 'neon') drawHiddenTargets(ctx);
  else drawHiddenTargetsVector(ctx);
}
function drawFloatingTextsDispatch(ctx) {
  if (G.style === 'neon') drawFloatingTexts(ctx);
  else drawFloatingTextsVector(ctx);
}
function drawPowerUpsDispatch(ctx) {
  if (G.style === 'neon') drawPowerUps(ctx);
  else drawPowerUpsVector(ctx);
}

// ============================================================
//  UPDATE
// ============================================================
function update() {
  G.frame++;
  G.screenShake = Math.max(0, G.screenShake - G.dt * 2.2);
  G.screenFlash = Math.max(0, G.screenFlash - G.dt * 2.5);

  // Attractor mode: idle timer on title screen
  if (G.state === 'title') {
    if (!G.aiDemo) {
      G.aiIdleTimer += G.dt;
      // Update the title prompt to show countdown
      const remaining = Math.ceil(G.aiIdleTimeout - G.aiIdleTimer);
      const prompt = document.querySelector('.title-prompt');
      if (prompt && remaining > 0 && remaining <= 5) {
        prompt.textContent = '▶ DEMO IN ' + remaining + '... ◀';
      } else if (prompt && remaining <= 0) {
        prompt.textContent = '▶ DEMO PLAYING... ◀';
      }

      if (G.aiIdleTimer >= G.aiIdleTimeout) {
        startDemo();
        // Reset title prompt for next time
        if (prompt) prompt.textContent = '▶ PRESS ENTER OR TAP TO START ◀';
      }
    }
    return;
  }

  if (G.state === 'paused') return;
  if (G.state === 'gameover') {
    // If in demo and game over, restart demo after a moment
    if (G.aiDemo && G.frame % 120 === 0) {
      // Clean up and restart
      document.getElementById('gameover-screen').classList.remove('active');
      startDemo();
    }
    return;
  }
  if (G.state === 'highscores') return;

  if (G.state === 'stageIntro') {
    G.introTimer -= G.dt;
    if (G.introTimer <= 0) {
      document.getElementById('stage-intro').classList.remove('active');
      G.state = 'playing';
      document.getElementById('hud').classList.add('active');
      updateTouchVisibility();
    }
    return;
  }

  if (G.state !== 'playing') return;

  // Hit-stop: freeze the world for a beat after kills (classic arcade juice)
  if (G.hitStop > 0) {
    G.hitStop -= G.dt;
    return;
  }

  // Run AI if in demo mode or autopilot mode
  if (G.aiDemo || G.autopilot) {
    updateAI();
  }

  // Player
  playerUpdate(G.player);

  // Spawn enemies
  if (!G.bossActive && !G.formationActive && G.enemies.length < MAX_ENEMIES) {
    if (G.frame % Math.max(1, Math.floor(30 / (G.loop + 1))) === 0) {
      G.enemies.push(createEnemy(G.stage, G.loop));
    }
  }

  // Formation spawning (every ~30 seconds)
  if (!G.bossActive && !G.formationActive) {
    G.formationTimer += G.dt;
    if (G.formationTimer > 25 + G.loop * 2) {
      G.formationTimer = 0;
      if (Math.random() < 0.3) {
        spawnFormation(G.stage);
      }
    }
  }

  // Update enemies
  for (const e of G.enemies) enemyUpdate(e);
  G.enemies = G.enemies.filter(e => e.alive);

  // Update formation ships
  if (G.formationActive) {
    for (const s of G.formationShips) {
      if (!s.alive) continue;
      s.x = wrapX(s.x + s.vx);
      s.y = wrapY(s.y + s.vy);

      // Check bullet collision
      for (const b of G.bullets) {
        if (b.type !== 'player') continue;
        if (wrapDist(b, s) < 10) {
          b.life = -1;
          s.alive = false;
          addScore(s.score);
          addShake(0.3);
          addHitStop(0.04);
          spawnParticles(s.x, s.y, 15, '#ff0', 3, 0.5);
          spawnSmokeDebris(s.x, s.y, 5, '#444');
          playSound('explode');
          spawnFloatingText(s.x, s.y, '+' + s.score, '#ff0');
          maybeDropPowerUp(s.x, s.y, 0.05);
          break;
        }
      }

      // Player collision
      if (G.player.alive && G.player.invincible <= 0 && wrapDist(s, G.player) < PLAYER_RADIUS + 8) {
        playerHit();
      }
    }

    // Check if formation passed
    const relY = ((G.formationShips[0]?.y || 0) - G.player.y);
    if (relY > DRAW_RADIUS) {
      G.formationActive = false;
      G.formationShips = [];
    }
  }

  // Update boss
  if (G.bossActive && G.boss) {
    bossUpdate(G.boss);
  }

  // Update power-up drops (before bullet collision so a shield pickup
  // on the same frame protects against incoming fire).
  for (const pu of G.powerUps) {
    pu.y += pu.vy;
    pu.life -= G.dt;
    pu.pulse += G.dt * 3;
    if (G.player.alive && wrapDist(pu, G.player) < 25) {
      pu.life = -1;
      collectPowerUp(pu);
    }
  }
  G.powerUps = G.powerUps.filter(pu => pu.life > 0);

  // Update bullets
  for (const b of G.bullets) {
    b.x = wrapX(b.x + b.vx);
    b.y = wrapY(b.y + b.vy);
    b.life -= G.dt;
  }
  G.bullets = G.bullets.filter(b => b.life > 0);

  for (const b of G.enemyBullets) {
    b.x = wrapX(b.x + b.vx);
    b.y = wrapY(b.y + b.vy);
    b.life -= G.dt;

    // Homing
    if (b.homing && G.player.alive) {
      const dx = ((G.player.x - b.x) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
      const dy = ((G.player.y - b.y) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
      const ang = Math.atan2(dy, dx);
      const current = Math.atan2(b.vy, b.vx);
      const diff = ang - current;
      const turn = clamp(diff, -0.03, 0.03);
      const spd = Math.hypot(b.vx, b.vy);
      const newAng = current + turn;
      b.vx = Math.cos(newAng) * spd;
      b.vy = Math.sin(newAng) * spd;
    }

    // Hit player
    if (G.player.alive && G.player.invincible <= 0) {
      if (wrapDist(b, G.player) < PLAYER_RADIUS + 5) {
        b.life = -1;
        playerHit();
      }
    }

    // Can destroy enemy bullets with player bullets
    for (const pb of G.bullets) {
      if (pb.type !== 'player') continue;
      if (wrapDist(pb, b) < 8) {
        b.life = -1;
        pb.life = -1;
        spawnParticles(b.x, b.y, 5, '#fff', 2, 0.3);
        addScore(10);
        break;
      }
    }
  }
  G.enemyBullets = G.enemyBullets.filter(b => b.life > 0);

  // Bullet-enemy collision
  for (const b of G.bullets) {
    if (b.type !== 'player' || b.life <= 0) continue;

    // Check enemies
    for (const e of G.enemies) {
      if (!e.alive) continue;
      if (wrapDist(b, e) < 12) {
        b.life = -1;
        e.hp--;
        e.hitFlash = 0.1;
        playSound('hit');
        if (e.hp <= 0) {
          e.alive = false;
          addScore(e.score);
          G.enemiesDestroyed++;
          addShake(0.38);
          addHitStop(0.05);
          spawnParticles(e.x, e.y, 20, e.color, 3, 0.6);
          spawnSmokeDebris(e.x, e.y, 6 + (e.isSilver ? 4 : 0), '#444');
          playSound('explode');
          spawnFloatingText(e.x, e.y, '+' + e.score, e.color);
          maybeDropPowerUp(e.x, e.y, e.isSilver ? 0.08 : 0);
        }
        break;
      }
    }

    // Check turrets
    for (const t of G.turrets) {
      if (!t.alive) continue;
      if (wrapDist(b, t) < 12) {
        b.life = -1;
        t.hp--;
        t.hitFlash = 0.1;
        playSound('hit');
        if (t.hp <= 0) {
          t.alive = false;
          addScore(t.score);
          addShake(0.4);
          addHitStop(0.06);
          spawnParticles(t.x, t.y, 15, '#f80', 3, 0.5);
          spawnSmokeDebris(t.x, t.y, 5, '#333');
          playSound('explode');
          spawnFloatingText(t.x, t.y, '+' + t.score, '#f80');
          maybeDropPowerUp(t.x, t.y, 0.03);
        }
        break;
      }
    }

    // Check boss
    if (G.boss && G.boss.alive && wrapDist(b, G.boss) < 35) {
      b.life = -1;
      G.boss.hp--;
      G.boss.hitFlash = 0.1;
      playSound('hit');
      spawnParticles(b.x, b.y, 8, '#f0f', 2, 0.3);
      if (G.boss.hp <= 0) {
        G.boss.alive = false;
        G.bossActive = false;
        G.enemiesDestroyed = 0; // prevent checkStageProgress from respawning the boss
        addScore(G.boss.score);
        spawnParticles(G.boss.x, G.boss.y, 60, '#f0f', 6, 1.0);
        spawnSmokeDebris(G.boss.x, G.boss.y, 20, '#222');
        playSound('explode');
        addShake(1.0);
        G.hitStop = 0.2;
        addFlash('#ff40ff', 0.35);
        spawnFloatingText(G.boss.x, G.boss.y - 30, '+' + G.boss.score, '#f0f');
        // Boss always drops a power-up
        maybeDropPowerUp(G.boss.x, G.boss.y, 0.88);
        // Clear stage
        setTimeout(() => {
          if (G.state === 'playing') advanceStage();
        }, 500);
      }
    }

    // Check hidden targets
    for (const t of G.hiddenTargets) {
      if (!t.alive) continue;
      if (wrapDist(b, t) < 8) {
        b.life = -1;
        t.alive = false;
        addScore(t.score);
        addShake(0.5);
        addHitStop(0.09);
        spawnParticles(t.x, t.y, 25, '#ff0', 4, 0.7);
        spawnSmokeDebris(t.x, t.y, 8, '#333');
        playSound('powerup');
        spawnFloatingText(t.x, t.y, '+' + t.score + ' TARGET!', '#ff0');
        maybeDropPowerUp(t.x, t.y, 0.10);
        break;
      }
    }
  }

  // Update particles
  for (const p of G.particles) {
    p.x = wrapX(p.x + p.vx);
    p.y = wrapY(p.y + p.vy);
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= G.dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);

  // Update floating texts
  for (const ft of G.floatingTexts) {
    ft.y -= 30 * G.dt;
    ft.life -= G.dt;
  }
  G.floatingTexts = G.floatingTexts.filter(ft => ft.life > 0);

  // Update turret firing
  for (const t of G.turrets) {
    if (!t.alive) continue;
    t.fireTimer -= G.dt * 60;
    if (t.fireTimer <= 0 && wrapDist(t, G.player) < 350) {
      t.fireTimer = rand(80, 150);
      const dx = ((G.player.x - t.x) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
      const dy = ((G.player.y - t.y) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
      const ang = Math.atan2(dy, dx);
      G.enemyBullets.push({
        x: t.x, y: t.y,
        vx: Math.cos(ang) * ENEMY_BULLET_SPEED * 0.8,
        vy: Math.sin(ang) * ENEMY_BULLET_SPEED * 0.8,
        life: 3, color: '#f80',
      });
    }
  }

  // Check stage progress
  checkStageProgress();

  updateHUD();
}

// ============================================================
//  RENDER LOOP
// ============================================================
function render() {
  const ctx = G.ctx;
  ctx.save();

  // Screen shake (trauma-style: quadratic falloff, subtle rotation)
  if (G.screenShake > 0) {
    const amp = G.screenShake * G.screenShake;
    const sx = (Math.random() - 0.5) * amp * 26;
    const sy = (Math.random() - 0.5) * amp * 26;
    ctx.translate(sx, sy);
    ctx.translate(G.w / 2, G.h / 2);
    ctx.rotate((Math.random() - 0.5) * amp * 0.02);
    ctx.translate(-G.w / 2, -G.h / 2);
  }

  drawBackgroundDispatch(ctx);

  if (G.state === 'playing' || G.state === 'paused' || G.state === 'stageIntro' || G.state === 'gameover') {
    // Draw turrets
    drawTurretsDispatch(ctx);

    // Draw hidden targets
    drawHiddenTargetsDispatch(ctx);

    // Draw formation ships
    for (const s of G.formationShips) drawFormationShipDispatch(ctx, s);

    // Draw enemies
    for (const e of G.enemies) drawEnemyDispatch(ctx, e);

    // Draw boss
    drawBossDispatch(ctx, G.boss);

    // Draw bullets
    drawBulletsDispatch(ctx);

    // Draw player
    drawPlayerDispatch(ctx);

    // Draw particles
    drawParticlesDispatch(ctx);

    // Draw floating texts
    drawFloatingTextsDispatch(ctx);

    // Draw power-ups
    drawPowerUpsDispatch(ctx);

    if (G.style === 'neon') {
      // Scanline overlay
      ctx.fillStyle = 'rgba(0,0,0,0.03)';
      for (let y = 0; y < G.h; y += 3) {
        ctx.fillRect(0, y, G.w, 1);
      }

      // Vignette
      const vignette = ctx.createRadialGradient(G.w/2, G.h/2, G.h*0.3, G.w/2, G.h/2, G.h*0.7);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, G.w, G.h);
    }

    // Hit flash overlay (player hit: red, boss death: magenta)
    if (G.screenFlash > 0) {
      ctx.fillStyle = G.flashColor;
      ctx.globalAlpha = Math.min(0.5, G.screenFlash * 1.7);
      ctx.fillRect(-32, -32, G.w + 64, G.h + 64);
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();

  // DEMO watermark in attractor mode
  if (G.aiDemo) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▶ DEMO MODE ◀', G.w/2, G.h - 12);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '10px "Courier New", monospace';
    ctx.fillText('PRESS ANY KEY TO PLAY', G.w/2, G.h - 2);
    ctx.restore();
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
function gameLoop(timestamp) {
  if (!G.lastTime) G.lastTime = timestamp;
  G.dt = Math.min((timestamp - G.lastTime) / 1000, 0.05);
  G.lastTime = timestamp;

  update();
  render();
  musicTick();

  requestAnimationFrame(gameLoop);
}

// ============================================================
//  UI UPDATES
// ============================================================
function updateHUD() {
  document.getElementById('hud-score').textContent = G.score.toLocaleString();
  document.getElementById('hud-hi').textContent = G.highScore.toLocaleString();
  document.getElementById('hud-stage').textContent = G.stage + (G.loop > 0 ? '-' + (G.loop+1) : '');
  let livesStr = '';
  for (let i = 0; i < G.lives; i++) livesStr += '●';
  if (G.lives === 0) livesStr = '—';
  document.getElementById('hud-lives').textContent = livesStr || '—';

  // Pause state
  if (G.state === 'paused') {
    document.getElementById('pause-overlay').classList.add('active');
  } else {
    document.getElementById('pause-overlay').classList.remove('active');
  }
}

// ============================================================
//  INPUT
// ============================================================
document.addEventListener('keydown', e => {
  // Any keypress during demo exits back to title
  if (G.aiDemo) {
    endDemo();
    G.keys = {};
    return;
  }

  G.keys[e.code] = true;

  if (e.code === 'Enter' || e.code === 'Space') {
    if (G.state === 'title') {
      e.preventDefault();
      startGame();
      return;
    }
  }

  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (G.state === 'playing') {
      G.state = 'paused';
      updateHUD();
      suspendAudio();
    } else if (G.state === 'paused') {
      G.state = 'playing';
      updateHUD();
      document.getElementById('pause-overlay').classList.remove('active');
      resumeAudio();
    }
  }

  if (e.code === 'KeyM') {
    setMuted(!G.muted);
  }
});

document.addEventListener('keyup', e => {
  G.keys[e.code] = false;
});

// Touch input
let touchIdentifier = null;
G.touchDir = null;
G.touchFiring = false;

const dpad = document.getElementById('touch-dpad');
dpad.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchIdentifier = t.identifier;
  updateTouchDir(t);
}, {passive: false});

dpad.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchIdentifier) {
      updateTouchDir(t);
    }
  }
}, {passive: false});

dpad.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchIdentifier) {
      G.touchDir = null;
      touchIdentifier = null;
    }
  }
}, {passive: false});

dpad.addEventListener('touchcancel', e => {
  G.touchDir = null;
  touchIdentifier = null;
});

function updateTouchDir(touch) {
  const rect = dpad.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = touch.clientX - cx;
  const dy = touch.clientY - cy;
  const d = Math.hypot(dx, dy);

  if (d < 15) {
    G.touchDir = null;
    return;
  }

  // Pure 8-way directions
  const dir = angleToDir(Math.atan2(dy, dx));
  const vec = DIR_VECTORS[dir];
  G.touchDir = { x: vec.x, y: vec.y };
}

const fireBtn = document.getElementById('touch-fire');
fireBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  G.touchFiring = true;
  fireBtn.classList.add('pressed');
}, {passive: false});
fireBtn.addEventListener('touchend', e => {
  e.preventDefault();
  G.touchFiring = false;
  fireBtn.classList.remove('pressed');
}, {passive: false});
fireBtn.addEventListener('touchcancel', e => {
  G.touchFiring = false;
  fireBtn.classList.remove('pressed');
});

// ============================================================
//  AI ATTRACTOR MODE
// ============================================================
function startDemo() {
  if (G.aiDemo) return;
  G.aiDemo = true;
  G.aiTarget = null;
  G.aiMoveTimer = 0;
  G.aiShootTimer = 0;
  G.aiDodgeTimer = 0;
  G.aiDodgeDir = 0;
  G.aiLastDir = 0;
  G.aiDirChangeTimer = 0;

  // Start a hidden game (Easy for longer demo)
  const savedDiff = G.difficulty;
  G.difficulty = 'easy';
  startGame();
  G.difficulty = savedDiff;

  // Hide the title screen overlay
  document.getElementById('title-screen').classList.remove('active');

  // Clear any held keys
  G.keys = {};
  G.touchDir = null;
  G.touchFiring = false;

  // Attach demo-exit listeners for touch/click
  G._demoExit = function(e) { endDemo(); };
  document.addEventListener('touchstart', G._demoExit, {once: true});
  document.addEventListener('click', G._demoExit, {once: true});
}

function endDemo() {
  if (!G.aiDemo) return;
  G.aiDemo = false;
  G.aiTarget = null;
  G.keys = {}; // Clear any AI-held keys

  // Remove demo-exit listeners
  if (G._demoExit) {
    document.removeEventListener('touchstart', G._demoExit);
    document.removeEventListener('click', G._demoExit);
    G._demoExit = null;
  }

  // Reset game state
  stopMusic();
  resumeAudio();
  G.state = 'title';
  document.getElementById('hud').classList.remove('active');
  document.getElementById('stage-intro').classList.remove('active');
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('hs-screen').classList.remove('active');
  document.getElementById('pause-overlay').classList.remove('active');
  document.getElementById('title-screen').classList.add('active');
  updateTouchVisibility();
  updateHUD();

  // Reset idle timer and title prompt so the attractor doesn't restart
  // before the player has a chance to act.
  G.aiIdleTimer = 0;
  const prompt = document.querySelector('.title-prompt');
  if (prompt) prompt.textContent = '▶ PRESS ENTER OR TAP TO START ◀';
}

function aiMoveDir(dir, fire) {
  const vec = DIR_VECTORS[dir];
  G.keys = {};
  if (vec.y < 0) G.keys['ArrowUp'] = true;
  if (vec.y > 0) G.keys['ArrowDown'] = true;
  if (vec.x < 0) G.keys['ArrowLeft'] = true;
  if (vec.x > 0) G.keys['ArrowRight'] = true;
  if (fire) G.keys['Space'] = true;
}

// Find the most dangerous incoming bullet using closest-approach prediction
function aiFindDanger(p) {
  let worst = null, worstScore = 0;
  // Player's own velocity (so a bullet the ship is flying INTO counts as danger)
  const pv = DIR_VECTORS[p.dir];
  const pvx = pv.x * p.speed * 60, pvy = pv.y * p.speed * 60;
  for (const b of G.enemyBullets) {
    const r0x = ((b.x - p.x) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
    const r0y = ((b.y - p.y) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
    const rvx = b.vx * 60 - pvx, rvy = b.vy * 60 - pvy; // relative px/second
    const spd2 = (rvx * rvx + rvy * rvy) || 1;
    // Time of closest approach of the bullet relative to the player (seconds)
    const tca = clamp(-(r0x * rvx + r0y * rvy) / spd2, 0, 1.2);
    const cdist = Math.hypot(r0x + rvx * tca, r0y + rvy * tca);
    const curD = Math.hypot(r0x, r0y);
    if (tca <= 1.1 && cdist < 42 && curD < 260) {
      const score = 1000 - cdist * 6 - tca * 300;
      if (score > worstScore) { worstScore = score; worst = { b, tca, cdist }; }
    }
  }
  return worst;
}

// Pick the dodging direction (perpendicular to the bullet) with the most clearance
function aiDodgeDir(p, danger) {
  const bulletAngle = Math.atan2(danger.b.vy, danger.b.vx);
  const opts = [bulletAngle + Math.PI/2, bulletAngle - Math.PI/2];
  const look = 0.35; // seconds of dodging to predict ahead
  const spd = p.speed * 60; // px/second
  const scored = opts.map(a => {
    const dir = angleToDir(a);
    const vec = DIR_VECTORS[dir];
    const fx = wrapX(p.x + vec.x * spd * look);
    const fy = wrapY(p.y + vec.y * spd * look);
    // How far the future position is from the danger bullet's future position
    let score = wrapDist({x: fx, y: fy}, {x: danger.b.x + danger.b.vx * 60 * look, y: danger.b.y + danger.b.vy * 60 * look});
    // Plus clearance from every other bullet
    let minClear = 999;
    for (const ob of G.enemyBullets) {
      const d = wrapDist({x: fx, y: fy}, {x: ob.x + ob.vx * 60 * look, y: ob.y + ob.vy * 60 * look});
      if (d < minClear) minClear = d;
    }
    score += minClear * 0.6;
    return { dir, score };
  });
  const best = scored[0].score >= scored[1].score ? scored[0] : scored[1];
  // Hysteresis: don't flip sides unless the other side is clearly better
  const cur = scored.find(s => s.dir === G.aiDodgeDir) || best;
  if (best.score > cur.score * 1.25) return best.dir;
  return cur.dir;
}

// Choose what the AI hunts: bonus formation > revealed hidden target > enemy > hidden hunt
function aiPickTarget(p) {
  // 1. Bonus formation — high value and it flies away, so chase it now
  // (but only if it's reasonably close; don't abandon a fight to cross the map)
  if (G.formationActive) {
    let best = null, bestD = Infinity;
    for (const s of G.formationShips) {
      if (!s.alive) continue;
      const d = wrapDist(p, s);
      if (d < bestD) { bestD = d; best = s; }
    }
    if (best && bestD < 700) return { type: 'formation', obj: best, dist: bestD };
  }

  // How close is the nearest regular enemy? (affects hidden-target greed)
  let nearEnemy = Infinity;
  for (const e of G.enemies) {
    if (!e.alive) continue;
    const d = wrapDist(p, e);
    if (d < nearEnemy) nearEnemy = d;
  }

  // 2. A hidden target shimmering within view (unless swarmed by enemies)
  if (nearEnemy > 120) {
    let best = null, bestD = Infinity;
    for (const t of G.hiddenTargets) {
      if (!t.alive) continue;
      const d = wrapDist(p, t);
      if (d < 450 && d < bestD) { bestD = d; best = t; }
    }
    if (best) return { type: 'hidden', obj: best, dist: bestD };
  }

  // 3. Nearest enemy
  let best = null, bestD = Infinity;
  for (const e of G.enemies) {
    if (!e.alive) continue;
    const d = wrapDist(p, e);
    if (d < bestD) { bestD = d; best = e; }
  }
  if (best) return { type: 'enemy', obj: best, dist: bestD };

  // 4. Hunt the nearest hidden target when the sky is clear
  for (const t of G.hiddenTargets) {
    if (!t.alive) continue;
    const d = wrapDist(p, t);
    if (d < bestD) { bestD = d; best = t; }
  }
  if (best) return { type: 'hidden', obj: best, dist: bestD };

  return null;
}

function updateAI() {
  if (!G.aiDemo && !G.autopilot) return;
  if (!G.player || !G.player.alive) {
    // Player is dead or respawning — just wait
    G.aiTarget = null;
    G.keys = {};
    return;
  }

  const p = G.player;

  // --- Aggressive predictive bullet dodging ---
  const danger = aiFindDanger(p);
  if (danger) {
    G.aiDodgeTimer = 0.3;
    G.aiDodgeDir = aiDodgeDir(p, danger);
  }
  if (G.aiDodgeTimer > 0) {
    G.aiDodgeTimer -= G.dt;
    aiMoveDir(G.aiDodgeDir, true);
    return;
  }

  // --- Hunt the best available target ---
  const tgt = aiPickTarget(p);
  if (tgt) {
    const dx = ((tgt.obj.x - p.x) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
    const dy = ((tgt.obj.y - p.y) % WORLD_SIZE + WORLD_SIZE*1.5) % WORLD_SIZE - WORLD_SIZE/2;
    const dist = Math.hypot(dx, dy);
    const dir = angleToDir(Math.atan2(dy, dx));

    G.aiDirChangeTimer -= G.dt;
    if (dir !== G.aiLastDir || G.aiDirChangeTimer <= 0) {
      G.aiLastDir = dir;
      G.aiDirChangeTimer = 0.5;
    }

    // Approach and fire
    aiMoveDir(G.aiLastDir, true);

    // Keep a firing standoff so it doesn't ram ships. Hidden targets are
    // stationary and don't collide, so fly straight through them firing.
    const standoff = tgt.type === 'hidden' ? 0 : 80;
    if (dist < standoff) {
      aiMoveDir((G.aiLastDir + 4) % 8, true); // reverse out
    }
  } else {
    // Nothing to hunt — wander around
    G.aiDirChangeTimer -= G.dt;
    if (G.aiDirChangeTimer <= 0) {
      G.aiLastDir = randInt(0, 7);
      G.aiDirChangeTimer = rand(0.5, 2);
    }
    aiMoveDir(G.aiLastDir, true);
  }
}

// Handle touch start on title screen

// ============================================================
//  INIT
// ============================================================
function init() {
  // Restore persisted settings (sound + haptics, independently) before audio init reads them
  try { G.muted = localStorage.getItem('neonpilot_muted') === '1'; } catch (e) { /* storage blocked */ }
  try { G.hapticsOn = localStorage.getItem('neonpilot_haptics') !== '0'; } catch (e) { /* storage blocked */ }
  setMuted(G.muted); // sync gain state + button label
  setHaptics(G.hapticsOn); // sync button label

  const canvas = document.getElementById('game');
  G.canvas = canvas;
  G.ctx = canvas.getContext('2d');

  resize();
  window.addEventListener('resize', resize);

  // Generate stars for space stage
  for (let i = 0; i < 200; i++) {
    G.stars.push({
      x: rand(0, WORLD_SIZE),
      y: rand(0, WORLD_SIZE),
      size: rand(0.5, 2),
      brightness: rand(0.2, 1),
    });
  }

  // Show high score on title
  const scores = getHighScores();
  if (scores.length > 0) {
    G.highScore = scores[0].score;
  }

  updateHUD();

  // Auto-start support (for screenshots / attract demos via query params)
  const qp = new URLSearchParams(location.search);
  if (qp.get('style')) G.style = qp.get('style') === 'vector' ? 'vector' : 'neon';
  if (qp.get('diff') && ['easy','normal','hard'].includes(qp.get('diff'))) G.difficulty = qp.get('diff');
  if (qp.get('autostart')) {
    if (qp.get('autopilot')) {
      // Real game with AI flying the ship (clean gameplay screenshots)
      setTimeout(() => {
        startGame();
        G.autopilot = true;
      }, 250);
    } else {
      setTimeout(() => startDemo(), 250);
    }
  }

  gameLoop(0);
}

function resize() {
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  const ratio = 4/3;

  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }

  G.w = Math.floor(w);
  G.h = Math.floor(h);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.canvas.style.width = G.w + 'px';
  G.canvas.style.height = G.h + 'px';
  G.canvas.width = Math.floor(G.w * dpr);
  G.canvas.height = Math.floor(G.h * dpr);
  // Refresh touch-control visibility on resize (hybrid laptops crossing width threshold)
  if (typeof updateTouchVisibility === 'function') updateTouchVisibility();
  // Scale the drawing context so the game fills the whole canvas (fixes
  // the game rendering at half size inside the backing buffer).
  G.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G.ctx.imageSmoothingEnabled = false;

  updateTouchVisibility();
}

// Real touch-device detection: show onscreen controls ONLY for the mobile version.
// Primary signal = coarse pointer (finger) — true on phones/tablets, false on desktops
// even touchscreen laptops (whose primary pointer is a mouse/trackpad).
function isTouchDevice() {
  if (window.matchMedia) {
    if (window.matchMedia('(pointer: coarse)').matches) return true;
    // Hybrid touchscreen laptops: only treat as mobile in a narrow layout
    if (window.matchMedia('(any-pointer: coarse)').matches && window.innerWidth <= 768) return true;
  }
  // Legacy fallback for browsers without matchMedia
  return ('ontouchstart' in window) && window.innerWidth <= 768;
}

function updateTouchVisibility() {
  const el = document.getElementById('touch-controls');
  if (isTouchDevice()) {
    el.classList.toggle('active', G.state === 'playing');
  } else {
    el.classList.remove('active');
  }
}

// Init on load
window.addEventListener('load', init);
</script>
