<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>NEON PILOT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Neon';src:local('Arial Black');font-weight:900}
@font-face{font-family:'Display';src:local('Courier New');font-weight:700}
body{
  background:radial-gradient(ellipse at center,#0a0a1c 0%,#05050f 70%,#030308 100%);
  color:#fff;
  font-family:'Courier New',monospace;
  overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;
  width:100vw;height:100vh;display:flex;
  align-items:center;justify-content:center;
}
canvas{display:block;background:#08081a;border-radius:4px;box-shadow:0 0 50px rgba(0,200,255,.07)}
#ui-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:10;
  display:flex;align-items:center;justify-content:center;
}
/* Only ACTIVE overlays intercept pointer/touch events. Inactive panels must
   never sit above the touch controls and eat input (the title screen fades
   via opacity, so it needs visibility:hidden to stay non-targetable). */
#ui-overlay>*{pointer-events:none}
#ui-overlay>.active{pointer-events:auto}

/* Title Screen */
#title-screen{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2em;text-align:center;
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(10,10,40,.95)0%,rgba(5,5,15,.98)70%,#05050f 100%);
  opacity:0;visibility:hidden;
  transition:opacity .4s, visibility 0s .4s;
}
#title-screen.active{
  opacity:1;visibility:visible;
  transition:opacity .4s, visibility 0s;
}
.title-logo{
  font-family:'Arial Black',sans-serif;
  font-size:clamp(2.5rem,12vw,7rem);font-weight:900;
  letter-spacing:.15em;
  background:linear-gradient(180deg,#0ff 0%,#0af 40%,#08f 70%,#06f 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
  animation:logoGlow 3s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 30px rgba(0,200,255,.3))}
  50%{filter:drop-shadow(0 0 60px rgba(0,200,255,.6))}
}
.title-sub{
  font-size:clamp(.7rem,2vw,1rem);letter-spacing:.5em;
  color:rgba(0,255,255,.5);text-transform:uppercase;margin-top:-1em;
}
.title-prompt{
  font-size:clamp(.8rem,1.5vw,1.1rem);
  color:#0ff;text-shadow:0 0 10px rgba(0,255,255,.5);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* Style Selector */
.style-selector{
  display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;
}
.style-btn{
  padding:.6em 1.8em;border:2px solid rgba(0,255,255,.3);
  border-radius:4px;background:rgba(0,255,255,.05);
  color:#0ff;font-family:inherit;font-size:clamp(.65rem,1.1vw,.85rem);
  cursor:pointer;transition:all .2s;text-transform:uppercase;
  letter-spacing:.1em;
}
.style-btn:hover{border-color:#0ff;background:rgba(0,255,255,.15);box-shadow:0 0 15px rgba(0,255,255,.2);}
.style-btn.selected{border-color:#0ff;background:rgba(0,255,255,.2);box-shadow:0 0 20px rgba(0,255,255,.3);}

/* Difficulty Select */
.diff-selector{
  display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;
}
.diff-btn{
  padding:.6em 1.5em;border:2px solid rgba(0,255,255,.3);
  border-radius:4px;background:rgba(0,255,255,.05);
  color:#0ff;font-family:inherit;font-size:clamp(.7rem,1.2vw,.9rem);
  cursor:pointer;transition:all .2s;text-transform:uppercase;
  letter-spacing:.1em;
}
.diff-btn:hover{border-color:#0ff;background:rgba(0,255,255,.15);box-shadow:0 0 15px rgba(0,255,255,.2);}
.diff-btn.selected{border-color:#0ff;background:rgba(0,255,255,.2);box-shadow:0 0 20px rgba(0,255,255,.3);}

/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:5;
  padding:.6em 1em;display:flex;justify-content:space-between;
  align-items:flex-start;
  font-size:clamp(.6rem,1.2vw,.85rem);
  pointer-events:none;opacity:0;transition:opacity .3s;
  visibility:hidden;
}
#hud.active{opacity:1;visibility:visible}
#hud>*{pointer-events:auto}
.hud-left,.hud-right{display:flex;gap:1.5em;flex-wrap:wrap}
.hud-label{color:rgba(255,255,255,.4);font-size:.7em;letter-spacing:.1em;text-transform:uppercase;}
.hud-value{color:var(--hud-accent,#0ff);text-shadow:0 0 8px rgba(var(--hud-accent-rgb,0,255,255),.4);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.3em;}
.hud-group{display:flex;flex-direction:column;gap:.1em}
.hud-right .hud-group{text-align:right}

/* Lock-on missile indicator — amber so it reads apart from the cyan HUD */
#hud-missile{align-items:flex-end}
.missile-value{color:#ffd23f;text-shadow:0 0 8px rgba(255,210,63,.5);font-size:1.02em;letter-spacing:.04em;transition:color .12s, text-shadow .12s}
.missile-value.ready{color:#ffd23f;text-shadow:0 0 10px rgba(255,210,63,.7)}
.missile-value.recharge{color:rgba(255,210,63,.45);text-shadow:none}
.missile-value.max{color:rgba(255,210,63,.55);text-shadow:0 0 6px rgba(255,210,63,.25)}
.missile-pips{display:flex;gap:.35em;justify-content:flex-end;margin-top:.15em}
.missile-pip{
  width:7px;height:7px;transform:rotate(45deg);
  background:rgba(255,210,63,.1);
  border:1px solid rgba(255,210,63,.35);
  transition:background .12s, box-shadow .12s, border-color .12s;
}
.missile-pip.lit{
  background:#ffd23f;border-color:#ffe98a;
  box-shadow:0 0 8px rgba(255,210,63,.9);
}
.missile-meter{
  width:46px;height:3px;margin-top:.28em;
  background:rgba(255,210,63,.16);
  border-radius:2px;overflow:hidden;
}
.missile-meter-fill{
  display:block;height:100%;width:100%;
  background:#ffd23f;
  box-shadow:0 0 6px rgba(255,210,63,.8);
  transition:width .06s linear;
}
.hud-pause{
  background:rgba(0,255,255,.1);border:1px solid rgba(0,255,255,.3);
  border-radius:4px;color:#0ff;padding:.3em .8em;
  font-family:inherit;font-size:.8em;cursor:pointer;
  transition:all .2s;letter-spacing:.1em;
}
.hud-pause:hover{background:rgba(0,255,255,.2);border-color:#0ff;}

/* Pause Overlay */
#pause-overlay{
  position:absolute;inset:0;z-index:15;
  background:rgba(5,5,15,.85);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:2em;
}
#pause-overlay.active{display:flex}
.pause-title{font-size:clamp(1.5rem,5vw,3rem);color:#0ff;text-shadow:0 0 20px rgba(0,255,255,.5);letter-spacing:.2em;text-transform:uppercase;font-family:'Arial Black',sans-serif;}
.pause-btns{display:flex;gap:1em;flex-wrap:wrap;justify-content:center;}
.pause-btn{
  padding:.7em 2em;border:2px solid rgba(0,255,255,.3);
  border-radius:4px;background:rgba(0,255,255,.05);
  color:#0ff;font-family:inherit;font-size:clamp(.7rem,1.2vw,.9rem);
  cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.1em;
}
.pause-btn:hover{border-color:#0ff;background:rgba(0,255,255,.15);box-shadow:0 0 15px rgba(0,255,255,.2);}

/* Game Over */
#gameover-screen{
  position:absolute;inset:0;z-index:15;
  background:radial-gradient(ellipse at center,rgba(20,5,30,.95)0%,rgba(5,5,15,.98)70%,#05050f 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;
  padding:2em;
}
#gameover-screen.active{display:flex}
.go-title{font-size:clamp(2rem,6vw,4rem);color:#f0f;text-shadow:0 0 16px rgba(255,0,255,.45);letter-spacing:.15em;text-transform:uppercase;font-family:'Arial Black',sans-serif;}
.go-score{font-size:clamp(1.2rem,3vw,2rem);color:#ff0;text-shadow:0 0 15px rgba(255,255,0,.4);}
.go-label{color:rgba(255,255,255,.4);font-size:.8em;text-transform:uppercase;letter-spacing:.15em;}
.go-high{color:#0ff;text-shadow:0 0 10px rgba(0,255,255,.4);font-size:1.1em;}
.name-entry{display:flex;gap:.5em;align-items:center;}
.name-entry input{
  background:rgba(0,255,255,.05);border:2px solid rgba(0,255,255,.3);
  border-radius:4px;color:#0ff;padding:.5em 1em;
  font-family:inherit;font-size:1.2em;width:8em;text-align:center;
  text-transform:uppercase;letter-spacing:.3em;outline:none;
}
.name-entry input:focus{border-color:#0ff;box-shadow:0 0 15px rgba(0,255,255,.2);}
.name-entry button{
  padding:.5em 1.5em;border:2px solid rgba(0,255,255,.3);
  border-radius:4px;background:rgba(0,255,255,.1);
  color:#0ff;font-family:inherit;font-size:1em;cursor:pointer;transition:all .2s;
  text-transform:uppercase;letter-spacing:.1em;
}
.name-entry button:hover{background:rgba(0,255,255,.2);border-color:#0ff;}

/* High Score Table */
#hs-screen{
  position:absolute;inset:0;z-index:15;
  background:radial-gradient(ellipse at center,rgba(5,5,30,.95)0%,rgba(5,5,15,.98)70%,#05050f 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:1em;
  padding:2em;
}
#hs-screen.active{display:flex}
.hs-title{font-size:clamp(1.5rem,4vw,2.5rem);color:#0ff;text-shadow:0 0 20px rgba(0,255,255,.4);letter-spacing:.2em;text-transform:uppercase;font-family:'Arial Black',sans-serif;}
.hs-table{width:100%;max-width:400px;border-collapse:collapse;font-size:clamp(.65rem,1.2vw,.85rem);}
.hs-table th{color:rgba(0,255,255,.5);border-bottom:1px solid rgba(0,255,255,.2);padding:.3em .8em;text-align:left;text-transform:uppercase;letter-spacing:.1em;font-weight:400;}
.hs-table td{padding:.3em .8em;border-bottom:1px solid rgba(255,255,255,.05);}
.hs-table tr:first-child td{color:#ff0;text-shadow:0 0 10px rgba(255,255,0,.3);}
.hs-rank{color:rgba(255,255,255,.3);width:2em;text-align:right;}
.hs-name{color:#0ff;letter-spacing:.2em;}
.hs-score{text-align:right;color:#fff;font-variant-numeric:tabular-nums;}
.hs-stage{text-align:right;color:rgba(255,255,255,.3);}
.hs-back{
  margin-top:1em;padding:.6em 2em;border:2px solid rgba(0,255,255,.3);
  border-radius:4px;background:rgba(0,255,255,.05);
  color:#0ff;font-family:inherit;font-size:clamp(.7rem,1.2vw,.9rem);
  cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.1em;
}
.hs-back:hover{border-color:#0ff;background:rgba(0,255,255,.15);box-shadow:0 0 15px rgba(0,255,255,.2);}

/* Stage Intro */
#stage-intro{
  position:absolute;inset:0;z-index:12;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,5,15,.8);
}
#stage-intro.active{display:flex}
.stage-text{
  font-family:'Arial Black',sans-serif;
  font-size:clamp(2rem,8vw,5rem);letter-spacing:.15em;
  text-shadow:0 0 16px currentColor;
}
.stage-sub{font-size:clamp(.7rem,1.5vw,1rem);color:rgba(255,255,255,.5);letter-spacing:.3em;margin-top:.5em;text-transform:uppercase;}

/* Mobile controls — thumb-sized zones anchored to the viewport bottom corners.
   On landscape phones they sit inside the letterbox bars (off the playfield);
   on portrait they hug the canvas bottom corners. */
#touch-controls{
  position:fixed;bottom:0;left:0;right:0;z-index:8;
  display:none;justify-content:space-between;align-items:flex-end;
  padding:1.2em;
  padding-bottom:max(1.2em, env(safe-area-inset-bottom, 0px));
  pointer-events:none;
}
#touch-controls.active{display:flex}
.touch-zone{
  pointer-events:auto;position:relative;
  width:clamp(110px, 26vmin, 160px);
  height:clamp(110px, 26vmin, 160px);
}
.touch-dpad{
  width:100%;height:100%;
  border-radius:50%;background:rgba(0,255,255,.06);
  border:2px solid rgba(0,255,255,.15);position:relative;
  touch-action:none;
}
.touch-dpad-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:24px;height:24px;border-radius:50%;
  background:rgba(0,255,255,.2);box-shadow:0 0 10px rgba(0,255,255,.2);
}
.touch-dpad-arrow{
  position:absolute;width:18px;height:18px;
  border-top:2px solid rgba(0,255,255,.3);
  border-right:2px solid rgba(0,255,255,.3);
}
.touch-fire{
  width:100%;height:100%;border-radius:50%;
  border:3px solid rgba(255,0,100,.4);
  background:rgba(255,0,100,.08);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2em;color:rgba(255,0,100,.6);
  text-transform:uppercase;letter-spacing:.1em;
  touch-action:none;cursor:pointer;transition:all .1s;
}
.touch-fire:active,.touch-fire.pressed{
  background:rgba(255,0,100,.2);
  border-color:rgba(255,0,100,.7);
  box-shadow:0 0 20px rgba(255,0,100,.3);
}

/* Landscape: snugger padding so zones stay clear of the playfield in the side bars */
@media (orientation:landscape){
  #touch-controls{
    padding:.8em;
    padding-bottom:max(.8em, env(safe-area-inset-bottom, 0px));
    padding-left:max(.8em, env(safe-area-inset-left, 0px));
    padding-right:max(.8em, env(safe-area-inset-right, 0px));
  }
  .touch-zone{width:clamp(92px, 22vmin, 140px);height:clamp(92px, 22vmin, 140px);}
}
</style>
</head>
<body>

<!-- UI Overlay Layer -->
<div id="ui-overlay">

  <!-- Title Screen -->
  <div id="title-screen" class="active">
    <div class="title-logo">NEON PILOT</div>
    <div class="title-sub">Further Into The Neon World</div>
    <div class="style-selector">
      <span class="hud-label" style="margin-right:.5em;align-self:center;">Style</span>
      <button class="style-btn selected" data-style="neon">Neon</button>
      <button class="style-btn" data-style="vector">Vector</button>
    </div>
    <div class="diff-selector">
      <button class="diff-btn" data-diff="easy">Easy</button>
      <button class="diff-btn selected" data-diff="normal">Normal</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>
    <div class="title-prompt">▶ PRESS ENTER OR TAP TO START ◀</div>
  </div>

  <!-- Stage Intro -->
  <div id="stage-intro">
    <div class="stage-text" id="stage-text-main"></div>
    <div class="stage-sub" id="stage-text-sub"></div>
  </div>

  <!-- Pause -->
  <div id="pause-overlay">
    <div class="pause-title">⏸ PAUSED</div>
    <div class="pause-btns">
      <button class="pause-btn" id="resume-btn">▶ Resume</button>
      <button class="pause-btn" id="sound-btn">♪ Sound: On</button>
      <button class="pause-btn" id="haptics-btn">📳 Haptics: On</button>
      <button class="pause-btn" id="quit-btn">✕ Quit</button>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameover-screen">
    <div class="go-title">GAME OVER</div>
    <div class="go-score" id="go-score"></div>
    <div class="go-label" id="go-newhs" style="color:#0ff;display:none;">NEW HIGH SCORE!</div>
    <div class="name-entry" id="name-entry">
      <input type="text" id="name-input" maxlength="3" placeholder="AAA" autocomplete="off">
      <button id="name-submit">OK</button>
    </div>
    <div style="display:flex;gap:1em;flex-wrap:wrap;justify-content:center;margin-top:1em;">
      <button class="pause-btn" id="restart-btn">↻ Play Again</button>
      <button class="pause-btn" id="hs-btn">🏆 High Scores</button>
      <button class="pause-btn" id="menu-btn">⌂ Title</button>
    </div>
  </div>

  <!-- High Scores -->
  <div id="hs-screen">
    <div class="hs-title">🏆 HIGH SCORES</div>
    <div id="hs-table-container"></div>
    <button class="hs-back" id="hs-back-btn">← Back</button>
  </div>

</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-left">
    <div class="hud-group"><span class="hud-label">Score</span><span class="hud-value" id="hud-score">0</span></div>
    <div class="hud-group"><span class="hud-label">Hi</span><span class="hud-value" id="hud-hi">0</span></div>
    <div class="hud-group"><span class="hud-label">Stage</span><span class="hud-value" id="hud-stage">1</span></div>
  </div>
  <div class="hud-right">
    <div class="hud-group"><span class="hud-label">Lives</span><span class="hud-value" id="hud-lives">●●●</span></div>
    <div class="hud-group" id="hud-missile">
      <span class="hud-label">Missiles</span>
      <span class="hud-value missile-value ready" id="hud-missile-value">READY</span>
      <span class="missile-pips">
        <span class="missile-pip" id="hud-missile-pip-0"></span>
        <span class="missile-pip" id="hud-missile-pip-1"></span>
      </span>
      <span class="missile-meter"><span class="missile-meter-fill" id="hud-missile-fill"></span></span>
    </div>
    <div><button class="hud-pause" id="hud-pause-btn">⏸</button></div>
  </div>
</div>

<!-- Touch Controls -->
<div id="touch-controls">
  <div class="touch-zone">
    <div class="touch-dpad" id="touch-dpad">
      <div class="touch-dpad-center"></div>
    </div>
  </div>
  <div class="touch-zone">
    <div class="touch-fire" id="touch-missile" style="border-color:rgba(255,210,63,.4);background:rgba(255,210,63,.08);color:rgba(255,210,63,.7)">MISSILE</div>
  </div>
  <div class="touch-zone">
    <div class="touch-fire" id="touch-fire">FIRE</div>
  </div>
</div>

<canvas id="game"></canvas>

<script>
// ============================================================
//  NEON PILOT — A modern Time Pilot '84 tribute
//  Art direction derived from the original Konami 1984 ROMs
//  (sprites decoded from the tp84 set): swept-wing jets,
//  hexagonal silver craft, and the giant fortress boss.
// ============================================================

// --- Constants ---
const WORLD_SIZE = 4096;
const PLAYER_RADIUS = 10;
const BULLET_SPEED = 7.5;         // player tracer speed
const MISSILE_SPEED = 9.5;        // lock-on smart missile speed (TP84 button 2)
const MAX_MISSILES = 2;           // arcade cap: 2 smart missiles on screen
const MISSILE_COOLDOWN = 14;      // frames between smart-missile launches
const ENEMY_BULLET_SPEED = 3.2;   // enemy shot speed
const MAX_ENEMIES = 12;
const DRAW_RADIUS = 420;          // how far around the player the world is simulated

// Neon glow scale — the arcade glow was tuned way down (was overpowering).
// Raise GLOW toward 1 for heavier halos, lower toward 0 for a cleaner look.
const GLOW = 0.55;
// Glow blur, scaled by GLOW and the adaptive-quality glow multiplier (G.glowMul)
function gb(n) { return Math.max(0, Math.round(n * GLOW * (G.glowMul || 1))); }

// --- Eras (art + music driven by the original game's structure) ---
const STAGES = [
  {
    id: 1, name: '1984', sub: 'NEON METROPOLIS',
    accent: '#0ff', accent2: '#f0f',
    enemyColors: ['#35e0ff', '#ff4fc0', '#ffe23f'],
    bgTop: '#0b1030', bgBottom: '#04060f',
    target: 24,
  },
  {
    id: 2, name: '1999', sub: 'NEON WASTELAND',
    accent: '#ff7a2f', accent2: '#ffd23f',
    enemyColors: ['#ff8a3f', '#ffd23f', '#ff5fc0'],
    bgTop: '#1a0b05', bgBottom: '#070302',
    target: 26,
  },
  {
    id: 3, name: '2000', sub: 'NEON DEPTHS',
    accent: '#1fe3ff', accent2: '#1fff9f',
    enemyColors: ['#1fe3ff', '#3f8fff', '#3fffaf'],
    bgTop: '#031020', bgBottom: '#010509',
    target: 28,
  },
  {
    id: 4, name: '2001', sub: 'ALTER FORTRESS',
    accent: '#ff4ff0', accent2: '#0ff',
    enemyColors: ['#ff4ff0', '#3ff3ff', '#ffe23f'],
    bgTop: '#0d0218', bgBottom: '#030108',
    target: 30, // boss stage
  },
  {
    id: 5, name: '3001', sub: 'CYBER NEXUS',
    accent: '#2bff8f', accent2: '#ff3f9f',
    enemyColors: ['#2bff8f', '#ff3f9f', '#c4ff5f'],
    bgTop: '#02100a', bgBottom: '#01040a',
    target: 30, // boss stage (loop 2+)
  },
];

// --- Game State ---
const G = {
  canvas: null, ctx: null,
  state: 'title', // title | stageIntro | warp | playing | paused | gameover | highscores
  score: 0, highScore: 0, lives: 3, stage: 1, loop: 0,
  difficulty: 'normal',
  style: 'neon', // 'neon' | 'vector'
  frame: 0, dt: 0, lastTime: 0,
  screenShake: 0, hitStop: 0, screenFlash: 0, flashColor: '#ff4040',
  flashAlpha: 0,

  player: null,
  bullets: [],
  missiles: [],
  enemyBullets: [],
  enemies: [],
  waves: [],
  particles: [],
  shockwaves: [],
  floatingTexts: [],

  enemiesDestroyed: 0, enemiesForBoss: 30, targetCount: 24,
  bossActive: false, boss: null, bossSummonTimer: 0,
  formationTimer: 0, formationActive: false, formationShips: [], formationEntry: 0, formationBonus: 1000,
  turrets: [],
  hiddenTargets: [],
  powerUps: [],
  stars: [],

  keys: {},
  paused: false,

  introTimer: 0, introStage: 0,

  // Warp tunnel sequence state
  warp: null,

  extraLifeThreshold: 20000, nextExtraLife: 20000,

  w: 800, h: 600, scale: 1,

  // Adaptive quality: 0 full, 1 reduced, 2 minimal
  quality: 0, glowMul: 1, maxDpr: 2, renderScale: 1,
  avgWork: 8, qCooldown: 0,

  // Attract / AI
  aiDemo: false, autopilot: false,
  aiIdleTimer: 0, aiIdleTimeout: 10,
  aiTarget: null, aiMoveTimer: 0, aiShootTimer: 0,
  aiDodgeDir: 0, aiDodgeTimer: 0, aiLastDir: 0, aiDirChangeTimer: 0,

// ============================================================
//  AUDIO — synthesized per-era soundtrack + arcade SFX
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let masterGain = null, sfxGain = null, musicGain = null;
const music = { playing: false, step: 0, nextTime: 0 };

const MUSIC = {
  1: { // 1984 Metropolis — Am · F · C · G, driving synthwave
    bpm: 132, wave: 'square', leadWave: 'triangle',
    roots: [45, 41, 48, 43],
    chords: [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]],
  },
  2: { // 1999 Wasteland — Dm · Bb · F · C, punchy
    bpm: 146, wave: 'sawtooth', leadWave: 'square',
    roots: [38, 34, 41, 48],
    chords: [[50, 53, 57], [46, 50, 53], [53, 57, 60], [55, 60, 64]],
  },
  3: { // 2000 Depths — Am · G · Em · Am, moody
    bpm: 100, wave: 'triangle', leadWave: 'sine',
    roots: [45, 43, 40, 45],
    chords: [[57, 60, 64], [55, 59, 62], [52, 55, 59], [57, 60, 64]],
  },
  4: { // 2001 Fortress — Fm · B tritone, alien
    bpm: 150, wave: 'sawtooth', leadWave: 'square',
    roots: [41, 47, 41, 47],
    chords: [[53, 56, 60], [59, 63, 66], [53, 56, 60], [59, 63, 66]],
  },
  5: { // 3001 Nexus — Em · F · G · Em darksynth
    bpm: 160, wave: 'sawtooth', leadWave: 'square',
    roots: [40, 41, 43, 40],
    chords: [[52, 55, 59], [53, 56, 60], [55, 59, 62], [52, 55, 59]],
  },
};

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioCtx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = G.muted ? 0 : 0.8;
    masterGain.connect(audioCtx.destination);
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.55;
    musicGain.connect(masterGain);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 1.25;
    sfxGain.connect(masterGain);
  }
}

function setMuted(m) {
  G.muted = m;
  try { localStorage.setItem('neonpilot_muted', m ? '1' : '0'); } catch (e) {}
  if (masterGain) masterGain.gain.value = m ? 0 : 0.8;
  const btn = document.getElementById('sound-btn');
  if (btn) btn.textContent = '♪ Sound: ' + (m ? 'Off' : 'On');
}

function setHaptics(on) {
  G.hapticsOn = on;
  try { localStorage.setItem('neonpilot_haptics', on ? '1' : '0'); } catch (e) {}
  const btn = document.getElementById('haptics-btn');
  if (btn) btn.textContent = '📳 Haptics: ' + (on ? 'On' : 'Off');
}

function suspendAudio() { if (audioCtx && audioCtx.state === 'running') audioCtx.suspend(); }
function resumeAudio() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }

function midiToFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }

function tone(midi, t, dur, type, vol, bus, pan) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = midiToFreq(midi);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let node = g;
  if (pan && audioCtx.createStereoPanner) {
    const p = audioCtx.createStereoPanner();
    p.pan.value = pan;
    g.connect(p); node = p;
  }
  osc.connect(g);
  node.connect(bus || musicGain);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

// Noise burst helper for hats/snares/explosions
function noise(t, dur, vol, type, freq, bus) {
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  const f = audioCtx.createBiquadFilter();
  f.type = type || 'lowpass';
  f.frequency.value = freq || 4000;
  src.connect(f); f.connect(g); g.connect(bus || musicGain);
  src.start(t);
}

function playMusicStep(M, step, t) {
  const stepDur = 60 / M.bpm / 2;
  const bar = Math.floor(step / 8) % 4;
  const root = M.roots[bar];
  const chord = M.chords[bar];
  const beat = Math.floor(step / 2) % 4; // quarter notes

  // Driving bass on every 8th (octave bounce)
  tone(root + (step % 2 === 0 ? 0 : 12), t, stepDur * 0.9, M.wave, 0.13, musicGain, 0);
  // Lead arpeggio
  const leadIdx = (step % 8 === 6 || step % 8 === 7) ? 2 : (step % 4 === 3 ? 1 : step % 3);
  tone(chord[leadIdx] + 12, t, stepDur * 0.7, M.leadWave, 0.055, musicGain, 0);
  // Chord stab at bar start
  if (step % 8 === 0) for (const n of chord) tone(n, t, stepDur * 2.6, 'sine', 0.04, musicGain, 0);

  // Percussion — hats on offbeats, snare-ish on 2 & 4, kick on 1 & 3
  const kickBeat = beat % 2 === 0;
  if (kickBeat) noise(t, 0.12, 0.10, 'lowpass', 130, musicGain);
  if (beat === 1 || beat === 3) noise(t, 0.06, 0.05, 'highpass', 7000, musicGain);
  if (step % 2 === 1) noise(t, 0.03, 0.028, 'highpass', 9000, musicGain);
}

function musicTick() {
  if (!music.playing || !audioCtx) return;
  const M = MUSIC[getStageIndex() + 1];
  const stepDur = 60 / M.bpm / 2;
  while (music.nextTime < audioCtx.currentTime + 0.24) {
    playMusicStep(M, music.step, music.nextTime);
    music.nextTime += stepDur;
    music.step = (music.step + 1) % 32;
  }
}

function startMusic(delay) {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  music.playing = true;
  music.step = 0;
  music.nextTime = audioCtx.currentTime + (delay || 0.06);
}

function stopMusic() { music.playing = false; }

// The iconic time-warp jingle + engine roar
function playTimeWarp() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + 0.02;
  const sweep = audioCtx.createOscillator();
  const sg = audioCtx.createGain();
  sweep.type = 'sawtooth';
  sweep.frequency.setValueAtTime(1600, t0);
  sweep.frequency.exponentialRampToValueAtTime(90, t0 + 0.55);
  sweep.frequency.exponentialRampToValueAtTime(1900, t0 + 1.25);
  sg.gain.setValueAtTime(0.0001, t0);
  sg.gain.linearRampToValueAtTime(0.16, t0 + 0.07);
  sg.gain.setValueAtTime(0.16, t0 + 1.05);
  sg.gain.exponentialRampToValueAtTime(0.001, t0 + 1.5);
  sweep.connect(sg); sg.connect(masterGain);
  sweep.start(t0); sweep.stop(t0 + 1.6);
  noise(t0 + 0.5, 0.8, 0.12, 'bandpass', 1200, masterGain);

  const arp = [60, 64, 67, 72, 76, 79, 84, 88];
  arp.forEach((n, i) => tone(n, t0 + 0.6 + i * 0.08, 0.3, 'square', 0.09, sfxGain, (i % 2 ? 0.3 : -0.3)));
  tone(91, t0 + 1.3, 0.7, 'sine', 0.12, sfxGain, 0);
}

function playSound(type, pan) {
  try {
    initAudio();
    if (!masterGain) return;
    const t = audioCtx.currentTime;
    const p = (typeof pan === 'number' && !isNaN(pan)) ? clamp(pan, -1, 1) : 0;
    switch (type) {
      case 'shoot': {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(990, t);
        osc.frequency.exponentialRampToValueAtTime(260, t + 0.07);
        g.gain.setValueAtTime(0.09, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
        let node = g;
        if (audioCtx.createStereoPanner) { const sp = audioCtx.createStereoPanner(); sp.pan.value = p; g.connect(sp); node = sp; }
        osc.connect(g); node.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.08);
        break;
      }
      case 'zap': { // enemy fire
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(90, t + 0.12);
        g.gain.setValueAtTime(0.07, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.13);
        break;
      }
      case 'hit': { // bullet impact on enemy
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(70, t + 0.05);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.06);
        break;
      }
      case 'explode': { // layered: low boom + noise crack
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, t);
        osc.frequency.exponentialRampToValueAtTime(28, t + 0.35);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.36);
        noise(t, 0.3, 0.16, 'lowpass', 1800, sfxGain);
        break;
      }
      case 'bigboom': { // boss death
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(20, t + 0.8);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.85);
        noise(t, 0.7, 0.25, 'lowpass', 900, sfxGain);
        break;
      }
      case 'powerup':
        [523, 659, 784].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.value = f;
          g.gain.setValueAtTime(0.14, t + i * 0.07);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.22);
          osc.connect(g); g.connect(sfxGain);
          osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.25);
        });
        break;
      case 'shieldbreak': {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(700, t);
        osc.frequency.exponentialRampToValueAtTime(180, t + 0.2);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.25);
        noise(t, 0.15, 0.1, 'highpass', 4000, sfxGain);
        break;
      }
      case 'boss': { // alarm
        for (let i = 0; i < 3; i++) {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.value = i % 2 ? 118 : 158;
          g.gain.setValueAtTime(0.09, t + i * 0.18);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.18 + 0.16);
          osc.connect(g); g.connect(sfxGain);
          osc.start(t + i * 0.18); osc.stop(t + i * 0.18 + 0.18);
        }
        break;
      }
      case 'extralife':
        [440, 554, 659, 880].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.value = f;
          g.gain.setValueAtTime(0.16, t + i * 0.11);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.11 + 0.3);
          osc.connect(g); g.connect(sfxGain);
          osc.start(t + i * 0.11); osc.stop(t + i * 0.11 + 0.32);
        });
        break;
      case 'fanfare': // formation clear / hidden target
        [66, 73, 78, 85].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'square'; osc.frequency.value = midiToFreq(f);
          g.gain.setValueAtTime(0.1, t + i * 0.06);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.2);
          osc.connect(g); g.connect(sfxGain);
          osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.22);
        });
        break;
      case 'gameover': {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(38, t + 1.1);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t); osc.stop(t + 1.15);
        break;
      }
      case 'playerhit': {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(45, t + 0.3);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.35);
        noise(t, 0.25, 0.14, 'lowpass', 1200, sfxGain);
        break;
      }
    }
  } catch (e) {}
}

function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function wrapX(x) { return ((x % WORLD_SIZE) + WORLD_SIZE) % WORLD_SIZE; }
function wrapY(y) { return ((y % WORLD_SIZE) + WORLD_SIZE) % WORLD_SIZE; }
function wrapDist(a, b) {
  let dx = Math.abs(a.x - b.x); if (dx > WORLD_SIZE / 2) dx = WORLD_SIZE - dx;
  let dy = Math.abs(a.y - b.y); if (dy > WORLD_SIZE / 2) dy = WORLD_SIZE - dy;
  return Math.hypot(dx, dy);
}
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// Shortest signed delta between two torus positions (towards b from a)
function deltaX(a, b) {
  let dx = ((b.x - a.x) % WORLD_SIZE + WORLD_SIZE * 1.5) % WORLD_SIZE - WORLD_SIZE / 2;
  return dx;
}
function deltaY(a, b) {
  let dy = ((b.y - a.y) % WORLD_SIZE + WORLD_SIZE * 1.5) % WORLD_SIZE - WORLD_SIZE / 2;
  return dy;
}
function aimAt(a, b) { return Math.atan2(deltaY(a, b), deltaX(a, b)); }
// Shortest signed angle from b to a, in (-PI, PI]
function angleDiff(a, b) { return ((a - b + Math.PI * 3) % (Math.PI * 2)) - Math.PI; }

function isNearScreen(wx, wy) {
  if (!G.player) return false;
  return Math.abs(wx - G.player.x) < DRAW_RADIUS + 120 && Math.abs(wy - G.player.y) < DRAW_RADIUS + 120;
}
function screenPos(wx, wy) {
  if (!G.player) return { x: wx, y: wy };
  return {
    x: G.w / 2 + deltaX(G.player, { x: wx, y: wy }),
    y: G.h / 2 + deltaY(G.player, { x: wx, y: wy }),
  };
}
function onScreen(sp, margin) {
  return sp.x >= -margin && sp.x <= G.w + margin && sp.y >= -margin && sp.y <= G.h + margin;
}

// --- Particles ---
const MAX_PARTICLES = 900;
function spawnParticles(x, y, count, color, speed, life, opts) {
  const o = opts || {};
  for (let i = 0; i < count; i++) {
    if (G.particles.length >= MAX_PARTICLES) return;
    const angle = o.angle !== undefined ? o.angle + rand(-o.spread || 0.3, o.spread || 0.3) : rand(0, Math.PI * 2);
    const spd = rand(speed * 0.3, speed);
    G.particles.push({
      x, y,
      vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
      life: rand(life * 0.4, life), maxLife: life,
      color, size: rand(o.sizeMin || 1, o.sizeMax || 3),
      drag: o.drag !== undefined ? o.drag : 0.96,
      gravity: o.gravity || 0,
      glow: o.glow !== undefined ? o.glow : 1,
    });
  }
}

function spawnShockwave(x, y, maxR, color, dur) {
  G.shockwaves.push({ x, y, r: 4, maxR, color, life: dur, maxLife: dur, lineWidth: 3 });
}

function spawnFloatingText(x, y, text, color, size) {
  G.floatingTexts.push({ x, y, text, color: color || STAGES[getStageIndex()].accent, life: 1.0, maxLife: 1.0, size: size || 16 });
}

// Layered kill explosion: flash, shockwave, fire, sparks, smoke
function explosion(x, y, color, scale) {
  const s = scale || 1;
  addShake(0.28 * s);
  addHitStop(0.04 + 0.02 * s);
  spawnParticles(x, y, Math.floor(14 * s), color, 3.2 * s, 0.5, { sizeMax: 3.5 });
  spawnParticles(x, y, Math.floor(10 * s), '#ffd24a', 2.4 * s, 0.4, { sizeMin: 2, sizeMax: 4 });
  spawnParticles(x, y, Math.floor(6 * s), '#ffffff', 4.5 * s, 0.25, { sizeMax: 2 });
  spawnParticles(x, y, Math.floor(6 * s), '#44474f', 1.2 * s, 0.9, { sizeMin: 2, sizeMax: 5, drag: 0.94 });
  spawnShockwave(x, y, 34 * s, color, 0.32);
}

function spawnThrusterParticles(p, count, intensity) {
  const angle = DIR_ANGLES[p.dir] + Math.PI;
  const cx = Math.cos(angle), sy = Math.sin(angle);
  const ex = p.x + cx * 13, ey = p.y + sy * 13;
  for (let i = 0; i < count; i++) {
    if (G.particles.length >= MAX_PARTICLES) return;
    const spread = rand(-0.32, 0.32);
    const spd = rand(0.9, 2.8) * intensity;
    G.particles.push({
      x: ex + rand(-3, 3), y: ey + rand(-3, 3),
      vx: cx * spd + rand(-0.2, 0.2), vy: sy * spd + rand(-0.2, 0.2),
      life: rand(0.18, 0.5), maxLife: 0.5,
      color: intensity > 1.3 ? '#bdfcff' : '#ffb347',
      size: rand(1, 2.2),
      drag: 0.95,
    });
  }
}
