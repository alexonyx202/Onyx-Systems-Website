const POWERUP_COLORS = { rapid: '#2ff3ff', spread: '#ff4fd8', shield: '#3f8fff', extralife: '#3fff6f' };
const POWERUP_ICONS = { rapid: 'double', spread: 'triple', shield: 'ring', extralife: 'life' };

function spawnPowerUp(x, y, type) {
  G.powerUps.push({
    x: x + rand(-24, 24), y: y + rand(-24, 24),
    type, life: 9,
    color: POWERUP_COLORS[type] || '#fff',
    vy: rand(-0.35, -0.15),
    pulse: rand(0, Math.PI * 2),
  });
}

function maybeDropPowerUp(x, y, bonusChance) {
  const chance = G.powerUpChance + (bonusChance || 0);
  if (Math.random() > chance) return false;
  const r = Math.random();
  const w = G.powerUpWeights;
  let type = 'rapid';
  if (r < w.rapid) type = 'rapid';
  else if (r < w.rapid + w.spread) type = 'spread';
  else if (r < w.rapid + w.spread + w.shield) type = 'shield';
  else type = 'extralife';
  spawnPowerUp(x, y, type);
  return true;
}

function getStageIndex() {
  return (G.stage - 1) % (G.loop >= 2 ? 5 : 4);
}
// ============================================================
//  PLAYER — the swept-wing TP84 jet
// ============================================================
function createPlayer() {
  return {
    x: WORLD_SIZE / 2, y: WORLD_SIZE / 2,
    dir: 0,
    speed: 3.6,       // cruise speed (screen-relative to the arcade's 1px/f on a 256px world)
    shootCooldown: 0,
    missileCooldown: 0,
    launch: 0,        // >0 = stage-start 4× launch boost (ROM-verified)
    invincible: 2,
    alive: true,
    respawnTimer: 0,
    upgrade: 0,
    upgradeTimer: 0,
    shield: false,
    bank: 0,          // visual banking (-1..1) while turning
    afterimage: 0,    // afterimage timer
    muzzle: 0,        // muzzle flash timer
  };
}

const DIR_ANGLES = [-Math.PI / 2, -Math.PI / 4, 0, Math.PI / 4, Math.PI / 2, Math.PI * 3 / 4, Math.PI, -Math.PI * 3 / 4];
// Normalized (unit-length) so the ship flies at a constant speed in all 8
// directions — diagonals are 1/√2 × cardinal, exactly like the original 6809
// movement math extracted from the TP84 ROM.
const DIR_VECTORS = [
  { x: 0, y: -1 }, { x: 0.70710678, y: -0.70710678 }, { x: 1, y: 0 }, { x: 0.70710678, y: 0.70710678 },
  { x: 0, y: 1 }, { x: -0.70710678, y: 0.70710678 }, { x: -1, y: 0 }, { x: -0.70710678, y: -0.70710678 },
];

function angleToDir(angle) {
  let dir = Math.round((angle + Math.PI / 2) / (Math.PI / 4)) % 8;
  if (dir < 0) dir += 8;
  return dir;
}

function playerUpdate(p) {
  if (!p.alive) {
    p.respawnTimer -= G.dt;
    if (p.respawnTimer <= 0) {
      p.alive = true;
      p.invincible = 2.2;
      p.upgrade = 0; p.upgradeTimer = 0; p.shield = false;
      addFlash('#2ff3ff', 0.25);
      spawnShockwave(p.x, p.y, 60, '#2ff3ff', 0.4);
    }
    return;
  }

  let mx = 0, my = 0;
  if (G.keys['ArrowUp'] || G.keys['KeyW']) my = -1;
  if (G.keys['ArrowDown'] || G.keys['KeyS']) my = 1;
  if (G.keys['ArrowLeft'] || G.keys['KeyA']) mx = -1;
  if (G.keys['ArrowRight'] || G.keys['KeyD']) mx = 1;
  if (G.touchDir) { mx = G.touchDir.x; my = G.touchDir.y; }

  // TP84 steering: the jet ALWAYS flies forward along its heading — input
  // only turns the nose. No input = keep flying straight. (ROM-verified:
  // constant-speed cruise in all 8 directions, diagonal = cardinal / √2.)
  if (mx !== 0 || my !== 0) {
    const newDir = angleToDir(Math.atan2(my, mx));
    // Banking: lean toward the direction change
    const diff = ((newDir - p.dir + 12) % 8) - 4;
    p.dir = newDir;
    p.bank = lerp(p.bank, clamp(diff * 0.6, -1, 1), 0.25);
    p.afterimage = 0.12;
  } else {
    p.bank = lerp(p.bank, 0, 0.2);
  }

  // Stage-start launch: the ROM shows the jet launching at 4× cruise speed
  // for ~30 frames when a level begins, then settling into cruise.
  let speedMul = 1;
  if (p.launch > 0) {
    p.launch -= G.dt;
    speedMul = 1 + 3 * clamp(p.launch / 0.5, 0, 1);
  }
  const vec = DIR_VECTORS[p.dir];
  p.x = wrapX(p.x + vec.x * p.speed * speedMul);
  p.y = wrapY(p.y + vec.y * p.speed * speedMul);

  if (p.shootCooldown > 0) p.shootCooldown -= G.dt * 60;
  if (p.missileCooldown > 0) p.missileCooldown -= G.dt * 60;
  const shootDelay = p.upgrade === 1 ? 3 : (p.upgrade === 2 ? 8 : 6);
  const firing = G.keys['Space'] || G.keys['KeyZ'] || G.touchFiring;
  if (firing && p.shootCooldown <= 0) {
    p.shootCooldown = shootDelay;
    p.muzzle = 0.08;
    playerShoot(p);
  }
  // TP84 button 2: lock-on smart missile — only useful vs silver ships,
  // max 2 on screen (arcade cap).
  const missileFire = G.keys['KeyX'] || G.keys['ShiftLeft'] || G.keys['ShiftRight'] || G.touchMissile;
  if (missileFire && p.missileCooldown <= 0 && G.missiles.length < MAX_MISSILES) {
    p.missileCooldown = MISSILE_COOLDOWN;
    fireMissile(p);
  }

  {
    const rapidBoost = (p.upgrade === 1 && firing) ? 2.0 : 1.0;
    const spreadBoost = (p.upgrade === 2 && firing) ? 1.4 : 1.0;
    const count = Math.max(1, Math.floor(rapidBoost * spreadBoost));
    const intensity = 1.0 + (p.upgrade > 0 && firing ? 0.5 : 0);
    spawnThrusterParticles(p, count, intensity);
  }

  if (p.muzzle > 0) p.muzzle -= G.dt;
  if (p.afterimage > 0) p.afterimage -= G.dt;
  if (p.invincible > 0) p.invincible -= G.dt;
  if (p.upgradeTimer > 0) {
    p.upgradeTimer -= G.dt;
    if (p.upgradeTimer <= 0) p.upgrade = 0;
  }
}

function playerShoot(p) {
  const angle = DIR_ANGLES[p.dir];
  const cx = Math.cos(angle), sy = Math.sin(angle);
  vibrate(10, 100, 'shoot');
  G.bullets.push({
    x: p.x + cx * 16, y: p.y + sy * 16,
    vx: cx * BULLET_SPEED, vy: sy * BULLET_SPEED,
    life: 1.6, type: 'player',
    trail: 0,
  });
  if (p.upgrade === 2) {
    for (const spread of [-0.27, 0.27]) {
      const a2 = angle + spread;
      G.bullets.push({
        x: p.x + Math.cos(a2) * 16, y: p.y + Math.sin(a2) * 16,
        vx: Math.cos(a2) * BULLET_SPEED, vy: Math.sin(a2) * BULLET_SPEED,
        life: 1.6, type: 'player', trail: 0,
      });
    }
  }
  playSound('shoot', (G.player.dir % 2) ? 0.25 : -0.25);
}

// TP84 button 2: lock-on smart missile. It auto-locks the nearest silver
// ship (the 500pt craft that shrugs off gunfire) and chases it down.
function fireMissile(p) {
  const angle = DIR_ANGLES[p.dir];
  const cx = Math.cos(angle), sy = Math.sin(angle);
  // Lock the nearest living silver ship; fall back to the nearest enemy.
  let target = null, bestD = Infinity;
  const cands = G.enemies.filter(e => e.alive);
  for (const e of cands) {
    const d = wrapDist({ x: p.x, y: p.y }, e);
    if (d < bestD) { bestD = d; target = e; }
  }
  if (G.formationActive) {
    for (const s of G.formationShips) {
      if (!s.alive) continue;
      const d = wrapDist({ x: p.x, y: p.y }, s);
      if (d < bestD) { bestD = d; target = s; }
    }
  }
  vibrate(14, 120, 'missile');
  G.missiles.push({
    x: p.x + cx * 18, y: p.y + sy * 18,
    vx: cx * MISSILE_SPEED, vy: sy * MISSILE_SPEED,
    target,
    life: 3.5, trail: 0,
  });
  playSound('missile');
  spawnParticles(p.x + cx * 18, p.y + sy * 18, 5, '#ffd23f', 1.6, 0.25);
}

// ============================================================
//  ENEMIES — ROM-authentic jet silhouettes
// ============================================================
// silhouette: 0 = swept-wing dart (classic TP84 jet)
//             1 = delta wing (wide)
//             2 = twin-engine heavy
function createEnemy(stage, loop) {
  const diff = G.difficulty;
  const diffMult = diff === 'easy' ? 0.6 : diff === 'hard' ? 1.4 : 1.0;
  const idx = getStageIndex();
  const era = STAGES[idx];

  const edge = randInt(0, 3);
  let x = G.player.x, y = G.player.y;
  if (edge === 0) { x += rand(DRAW_RADIUS - 60, DRAW_RADIUS + 120); y += rand(-DRAW_RADIUS, DRAW_RADIUS); }
  else if (edge === 1) { x -= rand(DRAW_RADIUS - 60, DRAW_RADIUS + 120); y += rand(-DRAW_RADIUS, DRAW_RADIUS); }
  else if (edge === 2) { y += rand(DRAW_RADIUS - 60, DRAW_RADIUS + 120); x += rand(-DRAW_RADIUS, DRAW_RADIUS); }
  else { y -= rand(DRAW_RADIUS - 60, DRAW_RADIUS + 120); x += rand(-DRAW_RADIUS, DRAW_RADIUS); }
  x = wrapX(x); y = wrapY(y);

  const isSilver = Math.random() < (0.2 + loop * 0.05);
  const hp = isSilver ? 2 : 1;
  const stageMult = (stage === 5 && loop >= 2) ? 1.3 : 1.0;
  const speed = (1.9 + loop * 0.32 + (isSilver ? 0.5 : 0)) * diffMult * stageMult;
  const fireRate = Math.max(40, 150 - loop * 10 - (isSilver ? 20 : 0) - (stage === 5 ? 20 : 0)) / diffMult;

  // Straight-line flight across the screen (like the original)
  const tx = G.player.x + rand(-260, 260);
  const ty = G.player.y + rand(-190, 190);
  let dx = deltaX({ x, y }, { x: tx, y: ty });
  let dy = deltaY({ x, y }, { x: tx, y: ty });
  const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;

  return {
    x, y,
    vx: dx * speed, vy: dy * speed,
    angle: Math.atan2(dy, dx),
    hp, maxHp: hp,
    isSilver,
    silhouette: isSilver ? 3 : randInt(0, 2),
    fireTimer: rand(fireRate * 0.3, fireRate),
    fireRate,
    color: isSilver ? '#cfd8ff' : era.enemyColors[randInt(0, 2)],
    score: isSilver ? 500 : 100,   // ROM-authentic: 100pt jets, 500pt silver ships
    alive: true,
    hitFlash: 0,
    _phaseTimer: rand(2, 5), _phaseSafe: 0,
    _turnTimer: 0, _turned: false,
    _pulse: rand(0, Math.PI * 2),
  };
}

function enemyUpdate(e) {
  if (!e.alive) return;

  // Formation wave members are steered by their wave leader (position, angle
  // and banking all come from the shared V-formation sweep). They skip the
  // autonomous movement below but still collide and get culled the same way.
  if (!e.wave) {
    // Stage 5 "phase" teleport (Cyber Nexus)
    if (G.stage === 5 && G.loop >= 2 && !e.isSilver) {
      e._phaseTimer -= G.dt;
      if (e._phaseTimer <= 0) {
        e._phaseTimer = rand(1.6, 4);
        const pa = rand(0, Math.PI * 2), pd = rand(45, 90);
        e.x = wrapX(e.x + Math.cos(pa) * pd);
        e.y = wrapY(e.y + Math.sin(pa) * pd);
        e.hitFlash = 0.08;
        e._phaseSafe = 0.25;
        spawnParticles(e.x, e.y, 6, '#2bff8f', 1.6, 0.25);
      }
    }

    // Silver ships drift gently toward the player
    if (e.isSilver) {
      const ang = aimAt(e, G.player);
      const spd = Math.hypot(e.vx, e.vy);
      const turn = clamp(((ang - Math.atan2(e.vy, e.vx) + Math.PI * 3) % (Math.PI * 2)) - Math.PI, -0.02, 0.02);
      const cur = Math.atan2(e.vy, e.vx) + turn;
      e.vx = Math.cos(cur) * spd; e.vy = Math.sin(cur) * spd;
    }

    e.x = wrapX(e.x + e.vx);
    e.y = wrapY(e.y + e.vy);

    // Some jets turn around and re-cross once (authentic TP84 looping behaviour)
    if (!e._turned && !e.isSilver && G.loop >= 1) {
      e._turnTimer -= G.dt;
      if (e._turnTimer <= 0 && wrapDist(e, G.player) > DRAW_RADIUS + 140) {
        e._turnTimer = 99;
        if (Math.random() < 0.35) {
          e._turned = true;
          // Head back toward a point near the player
          const ang = aimAt(e, G.player) + rand(-0.6, 0.6);
          const spd = Math.hypot(e.vx, e.vy) * 1.15;
          e.vx = Math.cos(ang) * spd; e.vy = Math.sin(ang) * spd;
          e.angle = ang;
        }
      }
    }
  }

  if (wrapDist(e, G.player) > 1700) { e.alive = false; return; }
  if (e.hitFlash > 0) e.hitFlash -= G.dt;
  if (e._phaseSafe > 0) e._phaseSafe -= G.dt;

  // Air enemies never fire in the original — only the ground turrets
  // (metallics) and the fortress boss shoot. Kept for authentic dogfights.

  if (e.alive && G.player.alive && G.player.invincible <= 0 && !(e._phaseSafe > 0)) {
    if (wrapDist(e, G.player) < PLAYER_RADIUS + 8) {
      playerHit();
      e.alive = false;
      explosion(e.x, e.y, e.color, 0.7);
    }
  }
}

// --- Bonus formation: classic V of five ---
function spawnFormation(stage) {
  const diff = G.difficulty;
  const speed = (1.1 + (diff === 'hard' ? 0.5 : 0)) * (1 + G.loop * 0.1);
  G.formationShips = [];
  G.formationEntry = 0;
  for (let i = 0; i < 5; i++) {
    G.formationShips.push({
      x: G.player.x + (i - 2) * 52,
      y: G.player.y - 300,
      targetX: G.player.x + (i - 2) * 52,
      vx: 0, vy: speed,
      hp: 1, alive: true,
      score: 100,   // formation jets are 100pt; the completion bonus is the big payday
      color: '#ffe23f',
      index: i,
      _entry: i,
    });
  }
  G.formationActive = true;
}

// --- Regular enemy waves: sweeping V-formations (Time Pilot '84) ---
// Instead of trickling in one jet at a time, the standard enemies arrive as
// V-formations that bank together — the leader at the apex and its wingmen
// spread behind — and sweep across the screen in a banking S-curve.
function spawnWave(stage, loop) {
  const diff = G.difficulty;
  const diffMult = diff === 'easy' ? 0.6 : diff === 'hard' ? 1.4 : 1.0;
  const idx = getStageIndex();
  const era = STAGES[idx];
  const stageMult = (stage === 5 && loop >= 2) ? 1.3 : 1.0;
  const speed = (1.9 + loop * 0.32) * diffMult * stageMult;

  // Spawn ahead of the player's heading, just outside the simulated radius,
  // so the formation flies in head-on and sweeps through the play area.
  const ang = DIR_ANGLES[G.player.dir] + rand(-1.2, 1.2);
  const r = DRAW_RADIUS + rand(30, 100);
  const x = wrapX(G.player.x + Math.cos(ang) * r);
  const y = wrapY(G.player.y + Math.sin(ang) * r);
  const heading = aimAt({ x, y }, G.player);

  // V geometry: apex (leader) forward, wings to the sides and back.
  const rows = [{ x: 0, y: 0 }, { x: -24, y: -22 }, { x: -24, y: 22 }];
  if (loop >= 1) rows.push({ x: -48, y: -44 }, { x: -48, y: 44 });

  const wave = {
    x, y,
    heading,
    baseHeading: heading,
    speed,
    bank: 0,
    turnPhase: rand(0, Math.PI * 2),
    turnPhaseSpeed: rand(0.02, 0.035),
    sweepAmp: rand(0.35, 0.6),
    life: rand(16, 22),
    members: [],
  };

  const cosH = Math.cos(heading), sinH = Math.sin(heading);
  for (let i = 0; i < rows.length; i++) {
    if (G.enemies.length >= MAX_ENEMIES) break;
    const off = rows[i];
    const m = {
      x: wrapX(x + off.x * cosH - off.y * sinH),
      y: wrapY(y + off.x * sinH + off.y * cosH),
      vx: 0, vy: 0,
      angle: heading,
      hp: 1, maxHp: 1,
      isSilver: false,
      silhouette: randInt(0, 2),
      fireTimer: 0, fireRate: 0,
      color: era.enemyColors[randInt(0, 2)],
      score: 100,            // standard 100pt jet
      alive: true,
      hitFlash: 0,
      _phaseSafe: 0,
      _pulse: rand(0, Math.PI * 2),
      wave, wOffX: off.x, wOffY: off.y,
    };
    wave.members.push(m);
    G.enemies.push(m);
  }

  if (wave.members.length > 0) G.waves.push(wave);
}

function updateWaves() {
  for (const w of G.waves) {
    // Banking sweep: the heading oscillates gently around the base heading,
    // carving an S-curve as the formation crosses the play area.
    w.turnPhase += w.turnPhaseSpeed;
    const targetHeading = w.baseHeading + Math.sin(w.turnPhase) * w.sweepAmp;
    const turn = clamp(angleDiff(targetHeading, w.heading), -0.022, 0.022);
    w.heading += turn;
    w.bank = clamp(turn / 0.022, -1, 1);

    // Advance the formation center, then place each member on its V offset.
    w.x = wrapX(w.x + Math.cos(w.heading) * w.speed);
    w.y = wrapY(w.y + Math.sin(w.heading) * w.speed);

    const cosH = Math.cos(w.heading), sinH = Math.sin(w.heading);
    for (const m of w.members) {
      if (!m.alive) continue;
      m.x = wrapX(w.x + m.wOffX * cosH - m.wOffY * sinH);
      m.y = wrapY(w.y + m.wOffX * sinH + m.wOffY * cosH);
      // Members bank together — a shared lean into the turn on top of the
      // heading keeps the whole V sweeping as one unit.
      m.angle = w.heading + w.bank * 0.14;
    }

    w.life -= G.dt;
  }

  // Cull expired waves and drop dead members from their leader's roster.
  for (const w of G.waves) {
    if (w.life <= 0) for (const m of w.members) m.alive = false;
    w.members = w.members.filter(m => m.alive);
  }
  G.waves = G.waves.filter(w => w.members.length > 0 && w.life > 0);
}

// --- Boss: the Alter Fortress ---
function createBoss(stage, loop) {
  playSound('boss');
  const diff = G.difficulty;
  const hpMult = diff === 'easy' ? 0.6 : diff === 'hard' ? 1.5 : 1.0;
  const isNexus = (stage === 5);
  const baseHp = isNexus ? 24 : 16;
  return {
    x: G.player.x,
    y: G.player.y - (isNexus ? 300 : 330),
    hp: Math.floor(baseHp * hpMult * (1 + loop * 0.1)),
    maxHp: Math.floor(baseHp * hpMult * (1 + loop * 0.1)),
    alive: true,
    fireTimer: 0, fireRate: isNexus ? 26 : 42,
    hitFlash: 0, angle: 0,
    speed: isNexus ? 0.75 : 0.55,
    score: isNexus ? 8000 : 5000,
    isNexus,
    phase: 1, phaseTimer: 0,
    summonTimer: rand(4, 6),
    spiralAngle: 0,
    enterT: 0,          // enter animation
    enterDone: false,
    deathTimer: 0,      // >0 = exploding out
    deathChain: 0,
  };
}

function bossUpdate(b) {
  if (!b.alive) return;
  if (b.hitFlash > 0) b.hitFlash -= G.dt;

  // Entry: drift down into position
  if (!b.enterDone) {
    b.enterT += G.dt;
    const targetY = b.y + 60;
    b.y = lerp(b.y, targetY, 0.03);
    if (b.enterT > 2) b.enterDone = true;
    return;
  }

  // Phase by HP
  const frac = b.hp / b.maxHp;
  if (frac <= 0.28 && b.phase < 3) { b.phase = 3; addFlash('#ff2f2f', 0.3); playSound('boss'); }
  else if (frac <= 0.55 && b.phase < 2) { b.phase = 2; addFlash('#ff2f2f', 0.3); playSound('boss'); }

  const speedMul = 1 + (b.phase - 1) * 0.4;
  b.x = wrapX(b.x + Math.sin(G.frame * 0.02) * b.speed * speedMul);
  b.y = wrapY(b.y + Math.cos(G.frame * 0.03) * b.speed * 0.5 * speedMul);

  b.fireTimer -= G.dt * 60;
  if (b.fireTimer <= 0) {
    b.fireTimer = Math.max(12, b.fireRate - b.phase * 6);
    const ang = aimAt(b, G.player);

    if (b.phase >= 3) {
      // Rapid rotating rings + homing shot
      b.spiralAngle += 0.35;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + b.spiralAngle;
        G.enemyBullets.push({
          x: b.x, y: b.y,
          vx: Math.cos(a) * ENEMY_BULLET_SPEED * 1.05,
          vy: Math.sin(a) * ENEMY_BULLET_SPEED * 1.05,
          life: 3, color: b.isNexus ? '#2bff8f' : '#ff5c5c',
        });
      }
      G.enemyBullets.push({
        x: b.x, y: b.y,
        vx: Math.cos(ang) * ENEMY_BULLET_SPEED * 1.5,
        vy: Math.sin(ang) * ENEMY_BULLET_SPEED * 1.5,
        life: 4, color: '#ff3f9f', homing: true,
      });
    } else if (b.phase === 2) {
      // Ring + aimed trio + summons
      b.spiralAngle += 0.25;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + b.spiralAngle;
        G.enemyBullets.push({
          x: b.x, y: b.y,
          vx: Math.cos(a) * ENEMY_BULLET_SPEED,
          vy: Math.sin(a) * ENEMY_BULLET_SPEED,
          life: 3, color: b.isNexus ? '#2bff8f' : '#ff7a2f',
        });
      }
      for (let i = -1; i <= 1; i++) {
        const a = ang + i * 0.14;
        G.enemyBullets.push({
          x: b.x, y: b.y,
          vx: Math.cos(a) * ENEMY_BULLET_SPEED * 1.25,
          vy: Math.sin(a) * ENEMY_BULLET_SPEED * 1.25,
          life: 4, color: '#ff4ff0', homing: true,
        });
      }
    } else {
      // Phase 1: aimed 3-shot burst
      for (let i = -1; i <= 1; i++) {
        const a = ang + i * 0.12;
        G.enemyBullets.push({
          x: b.x, y: b.y,
          vx: Math.cos(a) * ENEMY_BULLET_SPEED * 1.2,
          vy: Math.sin(a) * ENEMY_BULLET_SPEED * 1.2,
          life: 4, color: '#ff4ff0', homing: true,
        });
      }
    }
    playSound('zap');
  }

  // Phase 2+: summon escort jets
  if (b.phase >= 2 && G.enemies.length < 4) {
    b.summonTimer -= G.dt;
    if (b.summonTimer <= 0) {
      b.summonTimer = rand(4, 7);
      for (let i = 0; i < 2; i++) {
        const e = createEnemy(G.stage, G.loop);
        e.isSilver = false;
        e.color = b.isNexus ? '#2bff8f' : '#ff4ff0';
        e.x = b.x + (i === 0 ? -120 : 120);
        e.y = b.y + 60;
        e.vx = (i === 0 ? -1 : 1) * 1.4; e.vy = 1.2;
        e.angle = Math.atan2(e.vy, e.vx);
        G.enemies.push(e);
      }
      spawnParticles(b.x, b.y, 10, '#ff4ff0', 2, 0.4);
    }
  }

  if (G.player.alive && G.player.invincible <= 0) {
    if (wrapDist(b, G.player) < PLAYER_RADIUS + 32) playerHit();
  }
}

// ============================================================
//  TURRETS & HIDDEN TARGETS
// ============================================================
function spawnTurrets(stage, loop) {
  G.turrets = [];
  for (let i = 0; i < 3 + loop; i++) {
    G.turrets.push({
      x: rand(150, WORLD_SIZE - 150), y: rand(150, WORLD_SIZE - 150),
      alive: true, hp: 2, fireTimer: rand(100, 200),
      hitFlash: 0, color: '#ff7a2f', score: 200,
      angle: 0,
    });
  }
}

function spawnHiddenTargets(stage) {
  G.hiddenTargets = [];
  for (let i = 0; i < 8; i++) {
    G.hiddenTargets.push({
      x: rand(200, WORLD_SIZE - 200),
      y: rand(200, WORLD_SIZE - 200),
      alive: true, revealed: false, score: 5000,
      shimmer: rand(0, Math.PI * 2),
    });
  }
}
// ============================================================
//  GAME LOGIC
// ============================================================
function startGame() {
  initAudio();
  startMusic();
  for (const id of ['title-screen', 'gameover-screen', 'pause-overlay', 'hs-screen', 'stage-intro']) {
    document.getElementById(id).classList.remove('active');
  }
  document.getElementById('name-entry').style.display = 'none';
  G.score = 0;
  G.lives = G.difficulty === 'easy' ? 5 : G.difficulty === 'hard' ? 2 : 3;
  G.stage = 1;
  G.loop = 0;
  G.frame = 0;
  G.enemiesDestroyed = 0;
  G.enemiesForBoss = targetForStage(1);
  G.targetCount = targetForStage(1);
  G.bossActive = false; G.boss = null;
  G.formationActive = false; G.formationShips = [];
  G.formationTimer = 0;
  G.enemies = []; G.waves = []; G.bullets = []; G.missiles = []; G.enemyBullets = [];
  G.particles = []; G.shockwaves = []; G.floatingTexts = [];
  G.turrets = []; G.hiddenTargets = []; G.powerUps = [];
  G.screenShake = 0; G.hitStop = 0; G.screenFlash = 0; G.flashAlpha = 0;
  G.warp = null;
  // Extra men: 1st at 20,000, then every 60,000 (ROM/walkthrough-verified)
  G.nextExtraLife = G.difficulty === 'easy' ? 15000 : 20000;
  G.extraLifeThreshold = G.nextExtraLife;
  G.formationBonus = 1000;      // escalating formation bonus: 1000 -> 4000 per stage
  G.player = createPlayer();
  G.player.launch = 0.5;        // stage-start 4× launch boost (ROM-verified)
  G.paused = false;
  G.state = 'stageIntro';
  G.introTimer = 2.2;
  G.introStage = 1;

  spawnTurrets(1, 0);
  spawnHiddenTargets(1);
  updateHUD();
  showStageIntro(1);
}

function targetForStage(stageNum) {
  const idx = (stageNum - 1) % (G.loop >= 2 ? 5 : 4);
  return STAGES[idx].target + G.loop * 2;
}

function showStageIntro(stageNum) {
  const main = document.getElementById('stage-text-main');
  const sub = document.getElementById('stage-text-sub');
  const s = STAGES[(stageNum - 1) % (G.loop >= 2 ? 5 : 4)];
  main.textContent = s.name;
  main.style.color = s.accent;
  main.style.textShadow = '0 0 22px ' + s.accent;
  sub.textContent = s.sub;
  document.getElementById('stage-intro').classList.add('active');
  G.introTimer = 2.2;
  G.state = 'stageIntro';
  updateTouchVisibility();
}

// --- Arcade juice helpers ---
function addShake(amount) { G.screenShake = Math.min(1, G.screenShake + amount); }
function addHitStop(dur) { G.hitStop = Math.max(G.hitStop, dur); }
function addFlash(color, dur) { G.flashColor = color; G.screenFlash = Math.max(G.screenFlash, dur); }

function addScore(pts, x, y) {
  G.score += pts;
  if (G.score >= G.nextExtraLife) {
    G.lives++;
    G.nextExtraLife += 60000;   // arcade cadence: 20k, then every 60k
    playSound('extralife');
    if (x !== undefined) spawnFloatingText(x, y - 30, '1UP!', '#3fff6f', 22);
    updateHUD();
  }
  if (G.score > G.highScore) G.highScore = G.score;
  updateHUD();
}

function playerHit() {
  if (!G.player.alive || G.player.invincible > 0) return;
  if (G.player.shield) {
    G.player.shield = false;
    addShake(0.35);
    addHitStop(0.07);
    addFlash('#3f8fff', 0.28);
    playSound('shieldbreak');
    spawnParticles(G.player.x, G.player.y, 26, '#3f8fff', 3.4, 0.5);
    spawnShockwave(G.player.x, G.player.y, 40, '#3f8fff', 0.3);
    spawnFloatingText(G.player.x, G.player.y - 22, 'SHIELD DOWN!', '#3f8fff');
    return;
  }
  G.player.alive = false;
  G.lives--;
  G.player.respawnTimer = 1.5;
  addShake(0.65);
  addHitStop(0.14);
  addFlash('#ff2f2f', 0.4);
  playSound('playerhit');
  vibrate([80, 40, 80], 500, 'hit');
  spawnParticles(G.player.x, G.player.y, 44, '#2ff3ff', 4.5, 0.9);
  spawnParticles(G.player.x, G.player.y, 24, '#ffffff', 5, 0.6);
  spawnShockwave(G.player.x, G.player.y, 70, '#2ff3ff', 0.45);
  updateHUD();
  if (G.lives <= 0) gameOver();
}

function collectPowerUp(pu) {
  const p = G.player;
  switch (pu.type) {
    case 'rapid':
      p.upgrade = 1; p.upgradeTimer = 16;
      spawnFloatingText(pu.x, pu.y - 22, 'RAPID FIRE!', '#2ff3ff', 20);
      break;
    case 'spread':
      p.upgrade = 2; p.upgradeTimer = 16;
      spawnFloatingText(pu.x, pu.y - 22, 'SPREAD SHOT!', '#ff4fd8', 20);
      break;
    case 'shield':
      p.shield = true;
      spawnFloatingText(pu.x, pu.y - 22, 'SHIELD UP!', '#3f8fff', 20);
      spawnShockwave(p.x, p.y, 40, '#3f8fff', 0.35);
      break;
    case 'extralife':
      G.lives++;
      playSound('extralife');
      spawnFloatingText(pu.x, pu.y - 22, '1UP!', '#3fff6f', 24);
      updateHUD();
      return;
  }
  playSound('powerup');
  addScore(50);
  spawnParticles(pu.x, pu.y, 14, pu.color, 2.2, 0.45);
  spawnShockwave(pu.x, pu.y, 26, pu.color, 0.3);
}

// --- Haptics ---
const _vibeTimers = {};
function vibrate(pattern, throttle, key) {
  if (!G.hapticsOn || !navigator.vibrate || !isTouchDevice()) return;
  const k = key || '_';
  const now = performance.now();
  if (throttle && _vibeTimers[k] && now - _vibeTimers[k] < throttle) return;
  _vibeTimers[k] = now;
  try { navigator.vibrate(pattern); } catch (e) {}
}

// ============================================================
//  STAGE PROGRESSION + TIME WARP
// ============================================================
function checkStageProgress() {
  if (G.bossActive) return;
  if (G.formationActive) return;

  const maxStage = G.loop >= 2 ? 5 : 4;
  const isFinalStage = G.stage === maxStage;

  if (isFinalStage && G.enemiesDestroyed >= G.enemiesForBoss && !G.boss && !G.bossActive) {
    G.bossActive = true;
    G.enemies = []; G.waves = [];
    G.bullets = [];
    G.boss = createBoss(G.stage, G.loop);
    return;
  }

  if (!isFinalStage && G.enemiesDestroyed >= G.targetCount) {
    startWarp();
  }
}

function startWarp() {
  if (G.state !== 'playing') return;
  G.state = 'warp';
  stopMusic();
  playTimeWarp();
  addFlash('#ffffff', 0.5);
  addShake(0.35);
  // Freeze most world state; keep the player drifting into the tunnel
  G.warp = {
    t: 0,
    duration: 1.7,
    from: STAGES[getStageIndex()],
    to: STAGES[((G.stage) % (G.loop >= 2 ? 5 : 4))],
    speed: 1,
  };
  G.enemies = []; G.waves = [];
  G.enemyBullets = [];
  G.formationActive = false;
  G.formationShips = [];
}

function warpUpdate() {
  const w = G.warp;
  if (!w) return;
  w.t += G.dt;
  w.speed = 1 + w.t * 1.4;
  // Streak particles radiate outward for the tunnel feel
  if (G.frame % 2 === 0) {
    const cx = G.w / 2, cy = G.h / 2;
    const a = rand(0, Math.PI * 2);
    const r = rand(10, 200);
    G.particles.push({
      x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r,
      vx: Math.cos(a) * w.speed * 6, vy: Math.sin(a) * w.speed * 6,
      life: 0.6, maxLife: 0.6,
      color: w.t < w.duration * 0.55 ? w.from.accent : w.to.accent,
      size: rand(1.5, 3.5), drag: 0.9,
    });
  }
  if (w.t >= w.duration) {
    const next = G.stage + 1;
    const maxStage = G.loop >= 2 ? 5 : 4;
    if (next > maxStage) { G.stage = 1; G.loop++; }
    else G.stage = next;
    G.enemiesDestroyed = 0;
    G.targetCount = targetForStage(G.stage);
    G.enemiesForBoss = targetForStage(G.stage);
    G.bossActive = false; G.boss = null;
    G.enemies = []; G.waves = []; G.bullets = []; G.missiles = []; G.enemyBullets = [];
    G.particles = []; G.shockwaves = []; G.powerUps = []; G.floatingTexts = [];
    G.formationTimer = 0;
    G.formationBonus = 1000;    // formation bonus escalates within a stage
    G.player.launch = 0.5;      // launch boost at the start of every era
    G.warp = null;
    spawnTurrets(G.stage, G.loop);
    spawnHiddenTargets(G.stage);
    startMusic(0.4);
    showStageIntro(G.stage);
  }
}

function gameOver() {
  G.state = 'gameover';
  stopMusic();
  playSound('gameover');
  document.getElementById('gameover-screen').classList.add('active');
  document.getElementById('go-score').textContent = 'SCORE: ' + G.score.toLocaleString();

  const scores = getHighScores();
  const isNew = scores.length < 10 || G.score > scores[scores.length - 1].score;
  if (isNew && G.score > 0) {
    document.getElementById('go-newhs').style.display = 'block';
    document.getElementById('name-entry').style.display = 'flex';
    document.getElementById('name-input').focus();
  } else {
    document.getElementById('go-newhs').style.display = 'none';
    document.getElementById('name-entry').style.display = 'none';
  }
  document.getElementById('hud').classList.remove('active');
  updateTouchVisibility();
}

function enterHighScore(name) {
  if (!name) name = 'AAA';
  name = name.toUpperCase().slice(0, 3);
  const scores = getHighScores();
  scores.push({ name, score: G.score, stage: G.stage });
  scores.sort((a, b) => b.score - a.score);
  if (scores.length > 10) scores.length = 10;
  try { localStorage.setItem('neonpilot_scores', JSON.stringify(scores)); } catch (e) {}
  document.getElementById('name-entry').style.display = 'none';
}

function getHighScores() {
  try { return JSON.parse(localStorage.getItem('neonpilot_scores')) || []; } catch (e) { return []; }
}

let hsCameFrom = 'title';
function showHighScores() {
  hsCameFrom = (document.getElementById('gameover-screen').classList.contains('active')) ? 'gameover' : 'title';
  G.state = 'highscores';
  document.getElementById('title-screen').classList.remove('active');
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('hs-screen').classList.add('active');
  updateTouchVisibility();
  const scores = getHighScores();
  let html = '<table class="hs-table"><tr><th>#</th><th>Name</th><th>Score</th><th>Stage</th></tr>';
  if (scores.length === 0) {
    html += '<tr><td colspan="4" style="text-align:center;color:rgba(255,255,255,.3);padding:2em;">No scores yet</td></tr>';
  } else {
    scores.forEach((s, i) => {
      html += `<tr><td class="hs-rank">${i + 1}</td><td class="hs-name">${s.name}</td><td class="hs-score">${s.score.toLocaleString()}</td><td class="hs-stage">${s.stage}</td></tr>`;
    });
  }
  html += '</table>';
  document.getElementById('hs-table-container').innerHTML = html;
}
// ============================================================
//  RENDER — neon + vector renderers, per-era parallax worlds
// ============================================================

// Deterministic pseudo-random from a seed (stable terrain patterns)
function terrainRand(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

// Screen-space offset for a parallax layer scrolling at `factor` with tile `tile`
function parOff(pos, factor, tile) {
  return ((-(pos * factor) % tile) + tile) % tile;
}

// Soft drifting ambient glows — top-down-safe atmosphere (no horizon/sky cues).
// Screen-fixed color washes, each wandering on its own scattered path (no net direction).
function drawAmbientGlows(ctx, rgb) {
  if (G.quality >= 2) return;
  for (let i = 0; i < 3; i++) {
    const ph = i * 2.4;
    const gx = ((i * 260) % (G.w + 200)) - 100 + Math.sin(G.time * 0.30 + ph) * 34 + Math.cos(G.time * 0.22 + ph * 1.3) * 14;
    const gy = ((i * 190) % G.h) + Math.cos(G.time * 0.26 + ph * 1.7) * 26 + Math.sin(G.time * 0.34 + ph) * 10;
    const pr = 170 * (1 + Math.sin(G.time * 0.18 + ph * 2.7) * 0.06); // ±6% slow breathing
    const g = ctx.createRadialGradient(gx, gy, 6, gx, gy, pr);
    g.addColorStop(0, 'rgba(' + rgb + ',0.05)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(gx - pr, gy - pr, pr * 2, pr * 2);
  }
}

// Layered starfield — three depths with per-star size, brightness and twinkle.
// Screen-anchored; each star wanders on its own scattered path (no net direction).
const STAR_PALETTE = ['210,235,255', '222,238,255', '198,226,255', '238,228,255'];
function drawStarLayer(ctx, tile, count, sizeMin, sizeMax, brightBase, twSpeed) {
  for (let fx = 0; fx < G.w; fx += tile) {
    for (let fy = 0; fy < G.h; fy += tile) {
      for (let k = 0; k < count; k++) {
        const seed = fx * 7.13 + fy * 3.7 + k * 5.1;
        const bx = fx + terrainRand(seed) * tile;
        const by = fy + terrainRand(fx * 1.9 + fy * 9.3 + k * 2.7) * tile;
        const ph = terrainRand(seed * 4.1) * Math.PI * 2;
        const amp = 0.8 + terrainRand(seed * 2.3) * 1.8;
        const f1 = 0.30 + terrainRand(seed * 5.7) * 0.30; // rad/s → 10–21s periods
        const sx = bx + Math.sin(G.time * f1 + ph) * amp;
        const sy = by + Math.cos(G.time * f1 * 0.85 + ph * 1.3) * amp;
        const size = sizeMin + terrainRand(fx * 3.3 + fy * 1.1 + k * 7.7) * (sizeMax - sizeMin);
        const pulse = 1 + Math.sin(G.time * (0.18 + terrainRand(seed * 6.9) * 0.24) + ph * 2.1) * 0.28; // ±28% breathing
        const tw = 0.5 + 0.5 * Math.sin(G.time * twSpeed + (fx * 0.7 + fy * 0.31 + k * 2.3) * 1.9);
        const col = STAR_PALETTE[Math.floor(terrainRand(fx * 5.1 + fy * 2.9 + k * 3.1) * STAR_PALETTE.length)];
        ctx.fillStyle = 'rgba(' + col + ',' + (brightBase + tw * brightBase).toFixed(3) + ')';
        ctx.fillRect(sx, sy, size * pulse, size * pulse);
      }
    }
  }
}

function drawStars(ctx) {
  // far: tiny dim stars, slowest drift
  drawStarLayer(ctx, 340, 4, 0.5, 1.1, 0.12, 0.85);
  // mid: small stars
  drawStarLayer(ctx, 260, 6, 0.7, 1.6, 0.18, 1.10);
  // near: larger bright stars — dropped first when the quality governor kicks in
  if (!G.quality) drawStarLayer(ctx, 380, 3, 1.4, 2.6, 0.26, 1.35);
}

// ------------------------------------------------------------
//  SHARED BACKGROUND
// ------------------------------------------------------------
let skyGradCache = {};
function getSkyGradient(ctx, s) {
  // Cache one linear gradient per stage; cleared in resize() when the canvas resets
  if (!skyGradCache[s.id]) {
    const sky = ctx.createLinearGradient(0, 0, 0, G.h);
    sky.addColorStop(0, s.bgTop);
    sky.addColorStop(1, s.bgBottom);
    skyGradCache[s.id] = sky;
  }
  return skyGradCache[s.id];
}

function drawBackground(ctx) {
  const s = STAGES[getStageIndex()];
  // Vertical gradient sky (cached per stage)
  ctx.fillStyle = getSkyGradient(ctx, s);
  ctx.fillRect(-40, -40, G.w + 80, G.h + 80);

  if (!G.player) return;
  const px = G.player.x, py = G.player.y;

  // Layered starfield (scattered random drift, varied size, twinkle)
  drawStars(ctx);

  drawEraBackground(ctx, s, px, py);
}

function drawEraBackground(ctx, s, px, py) {
  switch (s.id) {
    case 1: eraCity(ctx, px, py, s); break;
    case 2: eraWasteland(ctx, px, py, s); break;
    case 3: eraOcean(ctx, px, py, s); break;
    case 4: eraSpace(ctx, px, py, s); break;
    case 5: eraNexus(ctx, px, py, s); break;
  }
}

// ---------- 1984 NEON METROPOLIS ----------
// Top-down clean backdrop: dark sky, shared star motes, faint cyan glows.
function eraCity(ctx) {
  drawAmbientGlows(ctx, '0,255,255');
}

// ---------- 1999 NEON WASTELAND ----------
// Top-down clean backdrop: warm glows + drifting dust motes.
function eraWasteland(ctx) {
  drawAmbientGlows(ctx, '255,122,47');
  // Floating dust motes — each drifts on its own scattered path (no net direction)
  ctx.fillStyle = 'rgba(255,190,120,0.12)';
  for (let i = 0; i < 14; i++) {
    const ph = i * 1.9;
    const x = ((i * 137) % (G.w + 40)) - 20 + Math.sin(G.time * (0.45 + (i % 3) * 0.07) + ph) * (4 + (i % 3) * 2);
    const y = ((i * 71) % G.h) + Math.cos(G.time * (0.40 + (i % 4) * 0.06) + ph * 1.4) * (3 + (i % 4) * 1.5);
    const sz = 2 + Math.sin(G.time * (0.35 + (i % 5) * 0.05) + ph * 2.2) * 0.7; // 1.3–2.7px breathing
    ctx.fillRect(x, y, sz, sz);
  }
}

// ---------- 2000 NEON DEPTHS ----------
function eraOcean(ctx) {
  // Top-down clean backdrop: cool glows + bubbles that wander in place.
  drawAmbientGlows(ctx, '20,160,255');
  // Bubbles — screen-fixed, each wanders gently on its own path (no rising current)
  for (let i = 0; i < 16; i++) {
    const ph = i * 1.53;
    const bx = ((i * 173) % (G.w + 40)) - 20 + Math.sin(G.time * (0.40 + (i % 3) * 0.06) + ph) * (2.5 + (i % 3) * 1.5);
    const by = ((i * 97) % (G.h + 60)) - 30 + Math.cos(G.time * (0.36 + (i % 4) * 0.05) + ph * 1.6) * (2 + (i % 4) * 1);
    ctx.strokeStyle = 'rgba(120,220,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(bx, by, (2 + (i % 3)) * (1 + Math.sin(G.time * (0.30 + (i % 5) * 0.04) + ph * 2.4) * 0.18), 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ---------- 2001 ALTER FORTRESS (space) ----------
function eraSpace(ctx) {
  // Nebulas — screen-fixed, each wanders on its own scattered path (no net drift)
  if (G.quality < 2) for (let n = 0; n < 3; n++) {
    const ph = n * 2.1;
    const nx = (((n * 380 + 80) % (G.w + 500)) - 250) + Math.sin(G.time * 0.30 + ph) * 30 + Math.cos(G.time * 0.22 + ph * 1.7) * 14;
    const ny = ((n * 260) % G.h) + Math.cos(G.time * 0.26 + ph * 1.3) * 20 + Math.sin(G.time * 0.34 + ph) * 10;
    const col = n === 0 ? '255,79,240' : n === 1 ? '63,120,255' : '43,255,143';
    const pr = 190 * (1 + Math.sin(G.time * 0.22 + ph * 2.3) * 0.07); // ±7% slow breathing
    const g = ctx.createRadialGradient(nx, ny, 8, nx, ny, pr);
    g.addColorStop(0, 'rgba(' + col + ',0.07)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(nx - pr, ny - pr, pr * 2, pr * 2);
  }
  // Planets — fixed on screen with a barely-there shimmer, never scrolling
  const p1x = ((1400 % (G.w + 300)) - 150) + Math.sin(G.time * 0.24) * 5;
  const p2x = ((3400 % (G.w + 300)) - 150) + Math.cos(G.time * 0.20) * 4;
  drawPlanet(ctx, p1x, 90 + Math.sin(G.time * 0.26) * 4, 46 * (1 + Math.sin(G.time * 0.20 + 1.1) * 0.025), '#ff7a2f', '#5c2a10');
  drawPlanet(ctx, p2x, G.h - 150 + Math.cos(G.time * 0.22) * 4, 30 * (1 + Math.cos(G.time * 0.17 + 0.4) * 0.025), '#1fe3ff', '#0a2a44');
  // Asteroid field — screen-anchored, each rock wanders on its own path
  if (G.quality < 2) {
  const nTile = 280;
  for (let ax = 0; ax < G.w; ax += nTile) {
    for (let ay = 0; ay < G.h; ay += nTile) {
      for (let k = 0; k < 2; k++) {
        const seed = ax * 0.7 + ay + k * 3;
        const bx = ax + terrainRand(seed) * nTile;
        const by = ay + terrainRand(ax + ay * 0.9 + k * 7) * nTile;
        const r = 3 + terrainRand(ax + k) * 7;
        const ph = terrainRand(seed * 2.7 + k) * Math.PI * 2;
        const amp = 1.5 + terrainRand(seed * 1.3) * 3.5;
        const x = bx + Math.sin(G.time * (0.45 + terrainRand(seed * 2.7 + k) * 0.15) + ph) * amp;
        const y = by + Math.cos(G.time * (0.40 + terrainRand(seed * 3.1 + k) * 0.15) + ph * 1.5) * amp;
        const pr = r * (1 + Math.sin(G.time * (0.30 + terrainRand(seed * 4.7 + k) * 0.15) + ph * 2.5) * 0.15); // ±15% breathing
        ctx.fillStyle = 'rgba(180,150,220,0.07)';
        ctx.beginPath();
        ctx.arc(x, y, pr, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,150,220,0.05)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  }
}

function drawPlanet(ctx, x, y, r, col, shade) {
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, col);
  g.addColorStop(1, shade);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  // Ring for the second planet
  ctx.strokeStyle = 'rgba(180,210,255,0.14)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, y, r * 1.7, r * 0.5, -0.3, 0, Math.PI * 2);
  ctx.stroke();
}

// ---------- 3001 CYBER NEXUS ----------
function eraNexus(ctx) {
  // Faint green ambient glows (clean top-down backdrop)
  drawAmbientGlows(ctx, '43,255,143');
  // Data streams — screen-fixed; each wanders on its own scattered path (no uniform rain)
  for (let i = 0; i < 22; i++) {
    const ph = i * 1.37;
    const sx = ((i * 97) % (G.w + 40)) - 20 + Math.sin(G.time * (0.45 + (i % 4) * 0.06) + ph) * (3 + (i % 4) * 1.5);
    const headY = ((i * 73) % (G.h + 80)) - 40 + Math.cos(G.time * (0.40 + (i % 3) * 0.07) + ph * 1.6) * (4 + (i % 3) * 2);
    const len = (40 + i % 3 * 26) * (1 + Math.sin(G.time * (0.28 + (i % 4) * 0.05) + ph * 2.3) * 0.15); // ±15% breathing

    ctx.fillStyle = 'rgba(43,255,143,0.10)';
    ctx.fillRect(sx, headY - len, 2, len);
    ctx.fillStyle = 'rgba(43,255,143,0.35)';
    ctx.fillRect(sx, headY, 2, 10);
    if (i % 3 === 0) {
      ctx.fillStyle = 'rgba(255,63,159,0.18)';
      ctx.fillRect(sx + 6, headY - len * 0.6, 2, len * 0.6);
    }
  }
}

// ------------------------------------------------------------
//  VECTOR-STYLE TERRAIN (thin white on black)
// ------------------------------------------------------------
function drawBackgroundVector(ctx) {
  const s = STAGES[getStageIndex()];
  ctx.fillStyle = '#050508';
  ctx.fillRect(-40, -40, G.w + 80, G.h + 80);
  if (!G.player) return;

  // Layered starfield (scattered random drift, varied size, twinkle)
  drawStars(ctx);

  ctx.lineWidth = 1;
  if (s.id === 1 || s.id === 2 || s.id === 3) {
    // clean top-down backdrop — shared motes only
  } else if (s.id === 4) {
    // Nebula rings — screen-fixed with scattered wander
    for (let n = 0; n < 3; n++) {
      const ph = n * 2.1;
      const nx = (((n * 380 + 80) % (G.w + 500)) - 250) + Math.sin(G.time * 0.30 + ph) * 30;
      const ny = ((n * 260) % G.h) + Math.cos(G.time * 0.26 + ph * 1.3) * 20;
      const rr = (60 + n * 20) * (1 + Math.sin(G.time * 0.22 + ph * 2.3) * 0.07); // ±7% slow breathing
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.beginPath(); ctx.arc(nx, ny, rr, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Radio rings around player
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let r = 110; r < 560; r += 110) {
    ctx.beginPath(); ctx.arc(G.w / 2, G.h / 2, r, 0, Math.PI * 2); ctx.stroke();
  }
}

// ------------------------------------------------------------
//  PLAYER SHIP — swept-wing TP84 jet
// ------------------------------------------------------------
function drawPlayer(ctx) {
  const p = G.player;
  if (!p || !p.alive) return;
  if (p.invincible > 0 && Math.sin(G.frame * 0.35) > 0) return;

  const cx = G.w / 2, cy = G.h / 2;
  const angle = DIR_ANGLES[p.dir] + p.bank * 0.06;

  // Afterimage ghost when turning fast
  if (p.afterimage > 0) {
    ctx.save();
    ctx.globalAlpha = p.afterimage * 2.2 * 0.25;
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    shipPath(ctx, 14, 'rgba(120,240,255,0.5)', false);
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // Glow
  const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
  grad.addColorStop(0, 'rgba(0,255,255,0.28)');
  grad.addColorStop(1, 'rgba(0,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();

  ctx.shadowColor = '#2ff3ff';
  ctx.shadowBlur = gb(12);

  // Fuselage (white with red nose)
  ctx.fillStyle = '#eef6ff';
  ctx.beginPath();
  ctx.moveTo(16, 0);                      // nose
  ctx.lineTo(6, -3.4);                    // shoulders
  ctx.lineTo(-2, -3);
  ctx.lineTo(-12, -1.6);                  // tail
  ctx.lineTo(-12, 1.6);
  ctx.lineTo(-2, 3);
  ctx.lineTo(6, 3.4);
  ctx.closePath();
  ctx.fill();

  // Red nose cone (authentic TP84 accent)
  ctx.shadowColor = '#ff4040';
  ctx.shadowBlur = gb(8);
  ctx.fillStyle = '#ff4040';
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(7.5, -2.6);
  ctx.lineTo(7.5, 2.6);
  ctx.closePath();
  ctx.fill();

  // Wings — swept back like the original
  ctx.shadowColor = '#2ff3ff';
  ctx.shadowBlur = gb(10);
  ctx.fillStyle = '#39d8ff';
  ctx.beginPath();
  ctx.moveTo(5, -2.4);
  ctx.lineTo(-11, -9.5);
  ctx.lineTo(-13, -8.5);
  ctx.lineTo(-7, 0);
  ctx.lineTo(-13, 8.5);
  ctx.lineTo(-11, 9.5);
  ctx.lineTo(5, 2.4);
  ctx.closePath();
  ctx.fill();

  // Wingtip lights (blink)
  ctx.shadowBlur = gb(6);
  ctx.fillStyle = (Math.sin(G.frame * 0.2) > 0) ? '#ff4040' : '#ffd24a';
  ctx.fillRect(-13, -9, 2.5, 2);
  ctx.fillStyle = (Math.sin(G.frame * 0.2 + Math.PI) > 0) ? '#ff4040' : '#ffd24a';
  ctx.fillRect(-13, 7.5, 2.5, 2);

  // Canopy
  ctx.shadowColor = '#aef4ff';
  ctx.shadowBlur = gb(6);
  ctx.fillStyle = '#aef4ff';
  ctx.beginPath();
  ctx.ellipse(8, 0, 3.2, 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Engine nacelles + exhaust
  ctx.shadowColor = '#ff9d2f';
  ctx.shadowBlur = gb(10);
  ctx.fillStyle = '#ff9d2f';
  ctx.beginPath();
  ctx.moveTo(-3, -2.2);
  ctx.lineTo(-13, -3.6);
  ctx.lineTo(-13, -0.4);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-3, 2.2);
  ctx.lineTo(-13, 3.6);
  ctx.lineTo(-13, 0.4);
  ctx.closePath();
  ctx.fill();

  // Afterburner flame
  const trail = 7 + Math.sin(G.frame * 0.6) * 3;
  ctx.shadowBlur = gb(16);
  ctx.fillStyle = '#ffd24a';
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(-12.5, -1.4);
  ctx.lineTo(-12.5 - trail, 0);
  ctx.lineTo(-12.5, 1.4);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-12.5, -0.8);
  ctx.lineTo(-12.5 - trail * 0.55, 0);
  ctx.lineTo(-12.5, 0.8);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // Muzzle flash
  if (p.muzzle > 0) {
    ctx.save();
    ctx.globalAlpha = p.muzzle * 10;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(16, -2);
    ctx.lineTo(24, 0);
    ctx.lineTo(16, 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Shield bubble
  if (p.shield) {
    ctx.shadowColor = '#3f8fff';
    ctx.shadowBlur = gb(16 + Math.sin(G.frame * 0.15) * 6);
    ctx.strokeStyle = '#5fc0ff';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#3f8fff';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Upgrade timer arc
  if (p.upgrade > 0 && p.upgradeTimer > 0) {
    const frac = clamp(p.upgradeTimer / 16, 0, 1);
    const color = p.upgrade === 1 ? '#2ff3ff' : '#ff4fd8';
    ctx.shadowColor = color;
    ctx.shadowBlur = gb(8);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5 + frac * 0.5;
    ctx.beginPath();
    ctx.arc(0, 0, 25, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

// Shared ship path helper
function shipPath(ctx, size, fill, stroke) {
  const s = size;
  ctx.beginPath();
  ctx.moveTo(s * 1.14, 0);
  ctx.lineTo(s * 0.43, -s * 0.24);
  ctx.lineTo(-s * 0.14, -s * 0.21);
  ctx.lineTo(-s * 0.86, -s * 0.11);
  ctx.lineTo(-s * 0.86, s * 0.11);
  ctx.lineTo(-s * 0.14, s * 0.21);
  ctx.lineTo(s * 0.43, s * 0.24);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawPlayerVector(ctx) {
  const p = G.player;
  if (!p || !p.alive) return;
  if (p.invincible > 0 && Math.sin(G.frame * 0.35) > 0) return;
  const cx = G.w / 2, cy = G.h / 2;
  const angle = DIR_ANGLES[p.dir] + p.bank * 0.05;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.4;
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(6, -3.4);
  ctx.lineTo(-2, -3);
  ctx.lineTo(-12, -1.6);
  ctx.lineTo(-12, 1.6);
  ctx.lineTo(-2, 3);
  ctx.lineTo(6, 3.4);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Wing lines
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(5, -2.4); ctx.lineTo(-11, -9.5); ctx.lineTo(-13, -8.5); ctx.lineTo(-7, 0);
  ctx.lineTo(-13, 8.5); ctx.lineTo(-11, 9.5); ctx.lineTo(5, 2.4);
  ctx.stroke();

  // Canopy
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(8, 0, 3, 1.8, 0, 0, Math.PI * 2); ctx.fill();

  // Afterburner
  const trail = 6 + Math.sin(G.frame * 0.6) * 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-12.5, 0);
  ctx.lineTo(-12.5 - trail, 0);
  ctx.stroke();

  // Shield
  if (p.shield) {
    ctx.strokeStyle = '#7fc4ff';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.stroke();
  }
  // Upgrade arc
  if (p.upgrade > 0 && p.upgradeTimer > 0) {
    const frac = clamp(p.upgradeTimer / 16, 0, 1);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4 + frac * 0.4;
    ctx.beginPath();
    ctx.arc(0, 0, 25, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ------------------------------------------------------------
//  ENEMIES — ROM-authentic silhouettes
// ------------------------------------------------------------
function drawEnemy(ctx, e) {
  if (!e.alive) return;
  const sp = screenPos(e.x, e.y);
  if (!onScreen(sp, 60)) return;

  ctx.save();
  ctx.translate(sp.x, sp.y);
  const flash = e.hitFlash > 0;

  if (e.isSilver) {
    // Hexagonal silver craft (ROM)
    const r = 11 + Math.sin(G.frame * 0.1 + e._pulse) * 0.6;
    ctx.shadowColor = '#cfd8ff';
    ctx.shadowBlur = gb(10);
    ctx.strokeStyle = flash ? '#fff' : '#cfd8ff';
    ctx.lineWidth = 2;
    ctx.fillStyle = flash ? '#fff' : 'rgba(190,200,240,0.14)';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 - Math.PI / 2 + G.frame * 0.02;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Inner detail
    ctx.strokeStyle = flash ? '#fff' : 'rgba(210,220,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = gb(12);
    ctx.fillStyle = flash ? '#fff' : '#eaf0ff';
    ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.rotate(e.angle);
    ctx.shadowColor = e.color;
    ctx.shadowBlur = gb(8);
    ctx.strokeStyle = flash ? '#fff' : e.color;
    ctx.lineWidth = 1.6;
    ctx.fillStyle = flash ? '#fff' : 'rgba(255,255,255,0.07)';

    if (e.silhouette === 0) {
      // Swept-wing dart (classic TP84 jet)
      ctx.beginPath();
      ctx.moveTo(11, 0);
      ctx.lineTo(-1, -3.4);
      ctx.lineTo(-8, -7);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-8, 7);
      ctx.lineTo(-1, 3.4);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Cockpit
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.beginPath(); ctx.ellipse(5, 0, 2.2, 1.4, 0, 0, Math.PI * 2); ctx.fill();
      // Engine
      ctx.fillStyle = flash ? '#fff' : '#ffd24a';
      ctx.fillRect(-9, -1.2, 2.5, 2.4);
    } else if (e.silhouette === 1) {
      // Delta wing (wide)
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(-7, -7.4);
      ctx.lineTo(-9, -6);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-9, 6);
      ctx.lineTo(-7, 7.4);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.fillRect(3.5, -1.4, 2.4, 2.8);
    } else {
      // Twin-engine heavy
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(3, -3.6);
      ctx.lineTo(-6, -3.2);
      ctx.lineTo(-10, -5.4);
      ctx.lineTo(-10, 5.4);
      ctx.lineTo(-6, 3.2);
      ctx.lineTo(3, 3.6);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.beginPath(); ctx.ellipse(6, 0, 2, 1.6, 0, 0, Math.PI * 2); ctx.fill();
      // Twin engines
      ctx.fillStyle = flash ? '#fff' : '#ffd24a';
      ctx.fillRect(-11, -3.4, 2.2, 2);
      ctx.fillRect(-11, 1.4, 2.2, 2);
    }
  }

  // Hit flash ring
  if (flash) {
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemyVector(ctx, e) {
  if (!e.alive) return;
  const sp = screenPos(e.x, e.y);
  if (!onScreen(sp, 60)) return;
  ctx.save();
  ctx.translate(sp.x, sp.y);
  const flash = e.hitFlash > 0;
  ctx.strokeStyle = flash ? '#fff' : '#fff';
  ctx.fillStyle = flash ? '#fff' : '#2a2a2e';
  ctx.lineWidth = 1.2;

  if (e.isSilver) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * 11, Math.sin(a) * 11);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.rotate(e.angle);
    if (e.silhouette === 0) {
      ctx.beginPath();
      ctx.moveTo(11, 0); ctx.lineTo(-1, -3.4); ctx.lineTo(-8, -7);
      ctx.lineTo(-6, 0); ctx.lineTo(-8, 7); ctx.lineTo(-1, 3.4);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (e.silhouette === 1) {
      ctx.beginPath();
      ctx.moveTo(10, 0); ctx.lineTo(-7, -7.4); ctx.lineTo(-9, -6);
      ctx.lineTo(-4, 0); ctx.lineTo(-9, 6); ctx.lineTo(-7, 7.4);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(3, -3.6); ctx.lineTo(-6, -3.2);
      ctx.lineTo(-10, -5.4); ctx.lineTo(-10, 5.4); ctx.lineTo(-6, 3.2);
      ctx.lineTo(3, 3.6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}

// ------------------------------------------------------------
//  BOSS — the Alter Fortress
// ------------------------------------------------------------
function drawBoss(ctx, b) {
  if (!b || !b.alive) return;
  const sp = screenPos(b.x, b.y);
  if (!onScreen(sp, 120)) return;

  ctx.save();
  ctx.translate(sp.x, sp.y);
  const flash = b.hitFlash > 0;
  const baseColor = b.isNexus ? '#2bff8f' : '#ff4ff0';
  const color = flash ? '#fff' : baseColor;
  const size = b.isNexus ? 44 : 40;
  const rot = b.angle;

  // Glow
  const grad = ctx.createRadialGradient(0, 0, 6, 0, 0, size * 1.6);
  grad.addColorStop(0, b.isNexus ? 'rgba(43,255,143,0.30)' : 'rgba(255,79,240,0.26)');
  grad.addColorStop(1, b.isNexus ? 'rgba(43,255,143,0)' : 'rgba(255,79,240,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, size * 1.6, 0, Math.PI * 2); ctx.fill();

  // Outer hexagon (rotates slowly)
  ctx.shadowColor = color;
  ctx.shadowBlur = gb(22);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.4;
  ctx.fillStyle = flash ? '#fff' : (b.isNexus ? 'rgba(43,255,143,0.10)' : 'rgba(255,79,240,0.10)');
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + rot;
    ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Gun pods at vertices
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + rot;
    const px2 = Math.cos(a) * (size - 6), py2 = Math.sin(a) * (size - 6);
    ctx.shadowBlur = gb(8);
    ctx.fillStyle = flash ? '#fff' : (i % 2 ? '#ff4040' : '#ffd24a');
    ctx.beginPath(); ctx.arc(px2, py2, 3.2, 0, Math.PI * 2); ctx.fill();
  }

  // Inner hexagon
  ctx.shadowBlur = gb(10);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - rot * 0.6;
    ctx.lineTo(Math.cos(a) * size * 0.55, Math.sin(a) * size * 0.55);
  }
  ctx.closePath(); ctx.stroke();
  ctx.globalAlpha = 1;

  // Rotating light ring
  ctx.strokeStyle = flash ? '#fff' : color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(0, 0, size * 0.72, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  const la = G.frame * 0.04;
  ctx.fillStyle = flash ? '#fff' : '#fff';
  ctx.beginPath(); ctx.arc(Math.cos(la) * size * 0.72, Math.sin(la) * size * 0.72, 2.5, 0, Math.PI * 2); ctx.fill();

  // Core eye (pulses with phase)
  const pulse = 4 + Math.sin(G.frame * 0.2) * 1.5 + (b.phase - 1) * 0.8;
  ctx.shadowColor = flash ? '#fff' : (b.phase >= 3 ? '#ff2f2f' : '#ffffff');
  ctx.shadowBlur = gb(18);
  ctx.fillStyle = flash ? '#fff' : (b.phase >= 3 ? '#ff6a5a' : '#ffffff');
  ctx.beginPath(); ctx.arc(0, 0, pulse, 0, Math.PI * 2); ctx.fill();

  // HP bar
  ctx.shadowBlur = 0;
  const barW = 72, barH = 5;
  const bx2 = -barW / 2, by2 = -size - 16;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(bx2 - 1, by2 - 1, barW + 2, barH + 2);
  ctx.fillStyle = 'rgba(255,0,0,0.35)';
  ctx.fillRect(bx2, by2, barW, barH);
  const frac = clamp(b.hp / b.maxHp, 0, 1);
  ctx.fillStyle = frac > 0.55 ? '#3fff6f' : frac > 0.28 ? '#ffd24a' : '#ff4040';
  ctx.fillRect(bx2, by2, barW * frac, barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx2, by2, barW, barH);

  ctx.restore();
}

function drawBossVector(ctx, b) {
  if (!b || !b.alive) return;
  const sp = screenPos(b.x, b.y);
  if (!onScreen(sp, 120)) return;
  ctx.save();
  ctx.translate(sp.x, sp.y);
  const size = b.isNexus ? 44 : 40;
  const rot = G.frame * 0.01;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.6;
  ctx.fillStyle = '#111116';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + rot;
    ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - rot * 0.6;
    ctx.lineTo(Math.cos(a) * size * 0.55, Math.sin(a) * size * 0.55);
  }
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#ddd';
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();

  // HP bar
  const barW = 72, barH = 4;
  ctx.fillStyle = '#222';
  ctx.fillRect(-barW / 2, -size - 16, barW, barH);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-barW / 2, -size - 16, barW * clamp(b.hp / b.maxHp, 0, 1), barH);
  ctx.restore();
}

// ------------------------------------------------------------
//  FORMATION SHIPS
// ------------------------------------------------------------
function drawFormationShip(ctx, s) {
  if (!s.alive) return;
  const sp = screenPos(s.x, s.y);
  if (!onScreen(sp, 40)) return;
  ctx.save();
  ctx.translate(sp.x, sp.y);
  // Banking V formation look
  ctx.rotate(-0.25 + s.index * 0.125);
  ctx.shadowColor = '#ffe23f';
  ctx.shadowBlur = gb(9);
  ctx.strokeStyle = flashColor('#ffe23f', s);
  ctx.lineWidth = 1.6;
  ctx.fillStyle = s.hitFlash > 0 ? '#fff' : 'rgba(255,226,63,0.14)';
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-1, -3.2);
  ctx.lineTo(-9, -6.4);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-9, 6.4);
  ctx.lineTo(-1, 3.2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffe23f';
  ctx.fillRect(-10, -1.2, 2.4, 2.4);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function flashColor(c, e) { return e.hitFlash > 0 ? '#fff' : c; }

function drawFormationShipVector(ctx, s) {
  if (!s.alive) return;
  const sp = screenPos(s.x, s.y);
  if (!onScreen(sp, 40)) return;
  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(-0.25 + s.index * 0.125);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#2a2a2e';

function drawBullets(ctx) {
  for (const b of G.bullets) {
    const sp = screenPos(b.x, b.y);
    ctx.save();
    // Trail
    ctx.strokeStyle = 'rgba(0,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(sp.x - b.vx * 1.6, sp.y - b.vy * 1.6);
    ctx.stroke();
    ctx.shadowColor = '#2ff3ff';
    ctx.shadowBlur = gb(8);
    ctx.fillStyle = '#bffcff';
    ctx.fillRect(sp.x - 1.6, sp.y - 1.6, 3.2, 3.2);
    ctx.restore();
  }
  for (const b of G.enemyBullets) {
    const sp = screenPos(b.x, b.y);
    const color = b.color || '#ff5c5c';
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = gb(7);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, b.homing ? 3.4 : 2.8, 0, Math.PI * 2);
    ctx.fill();
    // Homing shot gets a pulsing ring
    if (b.homing) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5 + Math.sin(G.frame * 0.4) * 0.3;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  // Lock-on smart missiles (TP84 button 2)
  for (const m of G.missiles) {
    const sp = screenPos(m.x, m.y);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,210,63,0.4)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(sp.x - m.vx * 1.9, sp.y - m.vy * 1.9);
    ctx.stroke();
    ctx.shadowColor = '#ffd23f';
    ctx.shadowBlur = gb(12);
    ctx.fillStyle = '#fff2c0';
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 3, 0, Math.PI * 2);
    ctx.fill();
    if (m.target && m.target.alive) {
      ctx.globalAlpha = 0.35 + Math.sin(G.frame * 0.5) * 0.15;
      ctx.strokeStyle = '#ffd23f';
      ctx.lineWidth = 1;
      const ts = screenPos(m.target.x, m.target.y);
      ctx.beginPath();
      ctx.moveTo(sp.x, sp.y);
      ctx.lineTo(ts.x, ts.y);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawShockwaves(ctx) {

function drawTurrets(ctx) {

    const flash = t.hitFlash > 0;
    const color = flash ? '#fff' : '#ff7a2f';
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(Math.sin(G.frame * 0.03 + t.x) * 0.1);
    ctx.shadowColor = color;
    ctx.shadowBlur = gb(8);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.fillStyle = flash ? '#fff' : 'rgba(255,122,47,0.14)';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Barrel
    ctx.fillStyle = flash ? '#fff' : '#ff9d2f';
    ctx.fillRect(-2, -9, 4, 6);
    // Core
    ctx.fillStyle = flash ? '#fff' : '#ffd24a';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();

function drawPowerUps(ctx) {

    ctx.shadowBlur = gb(14 + Math.sin(pu.pulse) * 5);

    ctx.lineTo(sp.x, sp.y + s);
    ctx.lineTo(sp.x - s, sp.y);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = pu.color + '33';
    ctx.fill();
    ctx.rotate(-Math.sin(pu.pulse) * 0.3);

    ctx.fillStyle = '#fff';

      ctx.fillRect(sp.x - 4, sp.y - 1.2, 3, 2.4);

// ------------------------------------------------------------
//  WARP TUNNEL — the iconic time-warp sequence
// ------------------------------------------------------------
function drawWarp(ctx) {
  const w = G.warp;
  if (!w) return;
  const t = w.t / w.duration;
  const cx = G.w / 2, cy = G.h / 2;
  const maxR = Math.max(G.w, G.h) * 0.75;

  // Fade into the tunnel (first 15%)
  if (t < 0.15) {
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 1 - t / 0.15;
    ctx.fillRect(0, 0, G.w, G.h);
    ctx.globalAlpha = 1;
  }

  const spin = t * w.speed * 0.6;
  const rings = 10;
  for (let i = rings - 1; i >= 0; i--) {
    const f = i / rings;
    const r = lerp(maxR, 20, f) + t * 40;
    if (r <= 0) continue;
    const col = lerpColor(w.from.accent, w.to.accent, clamp(t * 1.4, 0, 1));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(spin * (1 + f * 2));
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.12 + (1 - f) * 0.5;
    ctx.lineWidth = 2 + (1 - f) * 3;
    ctx.beginPath();
    const segs = 40;
    for (let k = 0; k <= segs; k++) {
      const a = (k / segs) * Math.PI * 2;
      const rr = r + Math.sin(a * 2 + spin * 3) * r * 0.06;
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr * 0.55; // squashed: perspective
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  // Center glow
  const cg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 120);
  cg.addColorStop(0, 'rgba(255,255,255,0.55)');
  cg.addColorStop(0.4, lerpColorA(w.from.accent, w.to.accent, t, 0.67));
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.fillRect(cx - 130, cy - 130, 260, 260);

  // End flash
  if (t > 0.88) {
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = (t - 0.88) / 0.12 * 0.9;
    ctx.fillRect(0, 0, G.w, G.h);
    ctx.globalAlpha = 1;
  }
}

function drawWarpVector(ctx) {
  const w = G.warp;
  if (!w) return;
  const t = w.t / w.duration;
  const cx = G.w / 2, cy = G.h / 2;
  const maxR = Math.max(G.w, G.h) * 0.75;
  const spin = t * w.speed * 0.6;
  const rings = 8;
  for (let i = rings - 1; i >= 0; i--) {
    const f = i / rings;
    const r = lerp(maxR, 24, f) + t * 40;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(spin * (1 + f * 2));
    ctx.strokeStyle = '#fff';
    ctx.globalAlpha = 0.15 + (1 - f) * 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 0; k <= 32; k++) {
      const a = (k / 32) * Math.PI * 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r * 0.55;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  if (t > 0.88) {
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = (t - 0.88) / 0.12 * 0.9;
    ctx.fillRect(0, 0, G.w, G.h);
    ctx.globalAlpha = 1;
  }
}

// Hex color helpers
function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function lerpColor(a, b, t) {
  const ca = hexToRgb(a), cb = hexToRgb(b);
  return 'rgb(' + Math.round(lerp(ca[0], cb[0], t)) + ',' + Math.round(lerp(ca[1], cb[1], t)) + ',' + Math.round(lerp(ca[2], cb[2], t)) + ')';
}
function lerpColorA(a, b, t, alpha) {
  const ca = hexToRgb(a), cb = hexToRgb(b);
  return 'rgba(' + Math.round(lerp(ca[0], cb[0], t)) + ',' + Math.round(lerp(ca[1], cb[1], t)) + ',' + Math.round(lerp(ca[2], cb[2], t)) + ',' + alpha + ')';
}
