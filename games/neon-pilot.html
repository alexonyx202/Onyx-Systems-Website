function drawTargetHUD(ctx) {
  if (G.state !== 'playing' && G.state !== 'paused') return;
  const s = STAGES[getStageIndex()];
  const done = G.enemiesDestroyed;
  const total = G.targetCount;
  const remaining = Math.max(0, total - done);
  const barW = 150, barH = 4;
  const x = 14, y = G.h - 16;

  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x - 6, y - 8, barW + 70, 18);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = 'bold 10px "Courier New",monospace';
  ctx.textAlign = 'left';
  ctx.fillText('TARGET', x, y - 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(x, y + 3, barW, barH);
  ctx.fillStyle = s.accent;
  ctx.fillRect(x, y + 3, barW * clamp(done / total, 0, 1), barH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px "Courier New",monospace';
  ctx.fillText(remaining + ' MORE', x + barW + 10, y + 5);
  ctx.restore();
}

// ============================================================
//  UPDATE
// ============================================================
function update() {
  G.frame++;
  G.screenShake = Math.max(0, G.screenShake - G.dt * 2.2);
  G.screenFlash = Math.max(0, G.screenFlash - G.dt * 2.6);

  // Attractor mode idle timer on title
  if (G.state === 'title') {
    if (!G.aiDemo) {
      G.aiIdleTimer += G.dt;
      const remaining = Math.ceil(G.aiIdleTimeout - G.aiIdleTimer);
      const prompt = document.querySelector('.title-prompt');
      if (prompt && remaining > 0 && remaining <= 5) {
        prompt.textContent = '▶ DEMO IN ' + remaining + '... ◀';
      } else if (prompt && remaining <= 0) {
        prompt.textContent = '▶ DEMO PLAYING... ◀';
      }
      if (G.aiIdleTimer >= G.aiIdleTimeout) {
        startDemo();
        if (prompt) prompt.textContent = '▶ PRESS ENTER OR TAP TO START ◀';
      }
    }
    return;
  }

  if (G.state === 'paused') return;
  if (G.state === 'gameover') {
    if (G.aiDemo && G.frame % 120 === 0) {
      document.getElementById('gameover-screen').classList.remove('active');
      startDemo();
    }
    return;
  }
  if (G.state === 'highscores') return;

  if (G.state === 'stageIntro') {
    G.introTimer -= G.dt;
    if (G.introTimer <= 0) {
      document.getElementById('stage-intro').classList.remove('active');
      G.state = 'playing';
      // ROM-verified stage-start launch: 4× cruise speed, decaying over ~0.5s
      G.player.launch = 0.5;
      document.getElementById('hud').classList.add('active');
      updateTouchVisibility();
    }
    return;
  }

  if (G.state === 'warp') {
    warpUpdate();
    updateParticles();
    return;
  }

  if (G.state !== 'playing') return;

  if (G.hitStop > 0) {
    G.hitStop -= G.dt;
    return;
  }

  if (G.aiDemo || G.autopilot) updateAI();
  playerUpdate(G.player);

  // Enemy spawning — regular enemies arrive as sweeping V-formation waves
  if (!G.bossActive && !G.formationActive && G.enemies.length < MAX_ENEMIES) {
    const waveInterval = Math.max(55, 110 - G.loop * 12);
    if (G.frame % waveInterval === 0) {
      spawnWave(G.stage, G.loop);
    }
  }

  // Formation spawning (periodic)
  if (!G.bossActive && !G.formationActive) {
    G.formationTimer += G.dt;
    if (G.formationTimer > 22 + G.loop * 2) {
      G.formationTimer = 0;
      if (Math.random() < 0.35) spawnFormation(G.stage);
    }
  }

  updateWaves();
  for (const e of G.enemies) enemyUpdate(e);
  G.enemies = G.enemies.filter(e => e.alive);

  // Formation update
  if (G.formationActive) {
    updateFormation();
  }

  if (G.bossActive && G.boss) bossUpdate(G.boss);

  // Power-ups
  for (const pu of G.powerUps) {
    pu.y += pu.vy;
    pu.life -= G.dt;
    pu.pulse += G.dt * 3;
    if (G.player.alive && wrapDist(pu, G.player) < 26) {
      pu.life = -1;
      collectPowerUp(pu);
    }
  }
  G.powerUps = G.powerUps.filter(pu => pu.life > 0);

  // Player bullets
  for (const b of G.bullets) {
    b.x = wrapX(b.x + b.vx);
    b.y = wrapY(b.y + b.vy);
    b.life -= G.dt;
    b.trail += G.dt;
    if (b.trail > 0.03) {
      b.trail = 0;
      if (G.particles.length < MAX_PARTICLES) {
        G.particles.push({
          x: b.x, y: b.y, vx: 0, vy: 0,
          life: 0.18, maxLife: 0.18, color: 'rgba(120,240,255,0.7)', size: 2, drag: 1,
        });
      }
    }
  }
  G.bullets = G.bullets.filter(b => b.life > 0);

  // Smart missiles — homing, 2 max on screen (TP84 button 2)
  for (const m of G.missiles) {
    if (m.target && m.target.alive) {
      const ang = aimAt(m, m.target);
      const cur = Math.atan2(m.vy, m.vx);
      const diff = ((ang - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      const turn = clamp(diff, -0.09, 0.09);
      const spd = Math.hypot(m.vx, m.vy);
      const na = cur + turn;
      m.vx = Math.cos(na) * spd; m.vy = Math.sin(na) * spd;
    }
    m.x = wrapX(m.x + m.vx);
    m.y = wrapY(m.y + m.vy);
    m.life -= G.dt;
    m.trail += G.dt;
    if (m.trail > 0.02 && G.particles.length < MAX_PARTICLES) {
      m.trail = 0;
      G.particles.push({
        x: m.x, y: m.y, vx: 0, vy: 0,
        life: 0.22, maxLife: 0.22, color: 'rgba(255,210,63,0.8)', size: 2.4, drag: 1,
      });
    }
    for (const e of G.enemies) {
      if (!e.alive) continue;
      if (wrapDist(m, e) < 13) {
        m.life = -1;
        e.hp -= 3;
        e.hitFlash = 0.1;
        spawnParticles(m.x, m.y, 6, '#ffd23f', 2.2, 0.25);
        playSound('hit');
        if (e.hp <= 0) {
          e.alive = false;
          addScore(e.score, e.x, e.y);
          G.enemiesDestroyed++;
          explosion(e.x, e.y, e.color, e.isSilver ? 1.4 : 1);
          playSound('explode');
          spawnFloatingText(e.x, e.y, '+' + e.score, STAGES[getStageIndex()].accent);
          maybeDropPowerUp(e.x, e.y, e.isSilver ? 0.10 : 0);
        }
        break;
      }
    }
    if (m.life > 0 && G.formationActive) {
      for (const s of G.formationShips) {
        if (!s.alive) continue;
        if (wrapDist(m, s) < 11) {
          m.life = -1;
          s.alive = false;
          addScore(s.score, s.x, s.y);
          explosion(s.x, s.y, '#ffe23f', 1);
          playSound('explode');
          spawnFloatingText(s.x, s.y, '+' + s.score, '#ffe23f');
          maybeDropPowerUp(s.x, s.y, 0.05);
          break;
        }
      }
    }
  }
  G.missiles = G.missiles.filter(m => m.life > 0);

  // Enemy bullets
  for (const b of G.enemyBullets) {
    b.x = wrapX(b.x + b.vx);
    b.y = wrapY(b.y + b.vy);
    b.life -= G.dt;
    if (b.homing && G.player.alive) {
      const ang = aimAt(b, G.player);
      const current = Math.atan2(b.vy, b.vx);
      const diff = ang - current;
      const turn = clamp(((diff + Math.PI * 3) % (Math.PI * 2)) - Math.PI, -0.035, 0.035);
      const spd = Math.hypot(b.vx, b.vy);
      const newAng = current + turn;
      b.vx = Math.cos(newAng) * spd;
      b.vy = Math.sin(newAng) * spd;
    }
    if (G.player.alive && G.player.invincible <= 0) {
      if (wrapDist(b, G.player) < PLAYER_RADIUS + 5) {
        b.life = -1;
        playerHit();
      }
    }
    // Bullets can be shot down
    for (const pb of G.bullets) {
      if (pb.type !== 'player' || pb.life <= 0) continue;
      if (wrapDist(pb, b) < 8) {
        b.life = -1;
        pb.life = -1;
        spawnParticles(b.x, b.y, 6, '#fff', 2, 0.3);
        addScore(10);
        break;
      }
    }
  }
  G.enemyBullets = G.enemyBullets.filter(b => b.life > 0);

  // Player bullet collisions
  for (const b of G.bullets) {
    if (b.type !== 'player' || b.life <= 0) continue;

    // Enemies — silver ships are immune to gunfire in the original: only the
    // lock-on smart missiles can bring them down (TP84 dual-weapon system).
    for (const e of G.enemies) {
      if (!e.alive || e.isSilver) continue;
      if (wrapDist(b, e) < 12) {
        b.life = -1;
        e.hp--;
        e.hitFlash = 0.1;
        spawnParticles(b.x, b.y, 4, '#fff', 2, 0.2);
        playSound('hit');
        if (e.hp <= 0) {
          e.alive = false;
          addScore(e.score, e.x, e.y);
          G.enemiesDestroyed++;
          explosion(e.x, e.y, e.color, e.isSilver ? 1.3 : 1);
          playSound('explode');
          spawnFloatingText(e.x, e.y, '+' + e.score, STAGES[getStageIndex()].accent);
          maybeDropPowerUp(e.x, e.y, e.isSilver ? 0.08 : 0);
        }
        break;
      }
    }

    // Turrets
    for (const t of G.turrets) {
      if (!t.alive) continue;
      if (wrapDist(b, t) < 13) {
        b.life = -1;
        t.hp--;
        t.hitFlash = 0.1;
        spawnParticles(b.x, b.y, 4, '#fff', 2, 0.2);
        playSound('hit');
        if (t.hp <= 0) {
          t.alive = false;
          addScore(t.score, t.x, t.y);
          explosion(t.x, t.y, '#ff7a2f', 1.1);
          playSound('explode');
          spawnFloatingText(t.x, t.y, '+' + t.score, '#ff7a2f');
          maybeDropPowerUp(t.x, t.y, 0.03);
        }
        break;
      }
    }

    // Boss
    if (G.boss && G.boss.alive && wrapDist(b, G.boss) < 38) {
      b.life = -1;
      G.boss.hp--;
      G.boss.hitFlash = 0.1;
      spawnParticles(b.x, b.y, 6, '#ff4ff0', 2, 0.3);
      playSound('hit');
      if (G.boss.hp <= 0) {
        G.boss.deathTimer = 1.2;
        G.boss.alive = false;
        G.bossActive = false;
        G.enemiesDestroyed = 0;
        addScore(G.boss.score, G.boss.x, G.boss.y);
        playSound('bigboom');
        addShake(1);
        addHitStop(0.25);
        addFlash('#ff4ff0', 0.4);
        spawnFloatingText(G.boss.x, G.boss.y - 40, '+' + G.boss.score, '#ff4ff0', 26);
        bossDeathSequence();
      }
    }

    // Hidden targets
    for (const t of G.hiddenTargets) {
      if (!t.alive) continue;
      if (wrapDist(b, t) < 9) {
        b.life = -1;
        t.alive = false;
        addScore(t.score, t.x, t.y);
        addShake(0.5);
        addHitStop(0.09);
        explosion(t.x, t.y, '#ffe23f', 1.2);
        playSound('fanfare');
        spawnFloatingText(t.x, t.y, '+5000 TARGET!', '#ffe23f', 20);
        maybeDropPowerUp(t.x, t.y, 0.10);
        break;
      }
    }
  }

  updateParticles();

  // Turret firing
  for (const t of G.turrets) {
    if (!t.alive) continue;
    t.fireTimer -= G.dt * 60;
    if (t.fireTimer <= 0 && wrapDist(t, G.player) < 360) {
      t.fireTimer = rand(80, 150);
      const ang = aimAt(t, G.player) + Math.sin(G.frame * 0.1 + t.x) * 0.2;
      G.enemyBullets.push({
        x: t.x, y: t.y,
        vx: Math.cos(ang) * ENEMY_BULLET_SPEED * 0.85,
        vy: Math.sin(ang) * ENEMY_BULLET_SPEED * 0.85,
        life: 3, color: '#ff9d2f',
      });
      spawnParticles(t.x, t.y, 3, '#ff9d2f', 1.2, 0.2);
    }
  }

  checkStageProgress();
  updateHUD();
}

function updateFormation() {
  const done = [];
  for (const s of G.formationShips) {
    if (!s.alive) { done.push(s); continue; }
    s.x = wrapX(s.x + s.vx);
    s.y = wrapY(s.y + s.vy);

    for (const b of G.bullets) {
      if (b.type !== 'player' || b.life <= 0) continue;
      if (wrapDist(b, s) < 10) {
        b.life = -1;
        s.alive = false;
        addScore(s.score, s.x, s.y);
        explosion(s.x, s.y, '#ffe23f', 1);
        playSound('explode');
        spawnFloatingText(s.x, s.y, '+' + s.score, '#ffe23f');
        maybeDropPowerUp(s.x, s.y, 0.05);
        break;
      }
    }
    if (G.player.alive && G.player.invincible <= 0 && wrapDist(s, G.player) < PLAYER_RADIUS + 8) {
      playerHit();
    }
  }

  const allDead = G.formationShips.every(s => !s.alive);
  if (allDead) {
    G.formationActive = false;
    G.formationShips = [];
    // ROM-authentic formation bonus: 1000 -> 2000 -> 3000 -> 4000, resets per stage
    const bonus = G.formationBonus;
    addScore(bonus, G.player.x, G.player.y - 30);
    spawnFloatingText(G.player.x, G.player.y - 60, 'FORMATION +' + bonus, '#ffe23f', 22);
    playSound('fanfare');
    addShake(0.25);
    G.formationBonus = Math.min(4000, G.formationBonus + 1000);
    return;
  }
  const lead = G.formationShips.find(s => s.alive);
  if (lead && deltaY(G.player, lead) > DRAW_RADIUS) {
    G.formationActive = false;
    G.formationShips = [];
  }
}

function updateParticles() {
  for (const p of G.particles) {
    p.x = wrapX(p.x + p.vx);
    p.y = wrapY(p.y + p.vy);
    p.vx *= p.drag;
    p.vy *= p.drag;
    if (p.gravity) p.vy += p.gravity * G.dt;
    p.life -= G.dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);

  for (const sw of G.shockwaves) {
    sw.life -= G.dt;
  }
  G.shockwaves = G.shockwaves.filter(sw => sw.life > 0);

  for (const ft of G.floatingTexts) {
    ft.y -= 32 * G.dt;
    ft.life -= G.dt;
  }
  G.floatingTexts = G.floatingTexts.filter(ft => ft.life > 0);
}

// Boss death: chain of explosions before the warp
let bossDeathTimer = 0;
function bossDeathSequence() {
  bossDeathTimer = 0;
  const b = G.boss;
  const n = 10;
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      if (!b || G.state !== 'playing') return;
      const a = rand(0, Math.PI * 2);
      const r = rand(10, 46);
      const x = b.x + Math.cos(a) * r;
      const y = b.y + Math.sin(a) * r;
      explosion(x, y, b.isNexus ? '#2bff8f' : '#ff4ff0', rand(0.8, 1.6));
      playSound('explode');
      if (i === n - 1) {
        spawnParticles(b.x, b.y, 50, '#ffffff', 6, 1.2);
        spawnShockwave(b.x, b.y, 90, b.isNexus ? '#2bff8f' : '#ff4ff0', 0.5);
        addFlash('#ffffff', 0.4);
        setTimeout(() => {
          if (G.state === 'playing') startWarp();
        }, 400);
      }
    }, i * 90);
  }
}

// ============================================================
//  RENDER LOOP
// ============================================================
function render() {
  const ctx = G.ctx;
  ctx.save();

  // Screen shake (trauma-style)
  if (G.screenShake > 0) {
    const amp = G.screenShake * G.screenShake;
    const sx = (Math.random() - 0.5) * amp * 28;
    const sy = (Math.random() - 0.5) * amp * 28;
    ctx.translate(sx, sy);
    ctx.translate(G.w / 2, G.h / 2);
    ctx.rotate((Math.random() - 0.5) * amp * 0.022);
    ctx.translate(-G.w / 2, -G.h / 2);
  }

  const inGame = G.state === 'playing' || G.state === 'paused' || G.state === 'stageIntro' ||
                 G.state === 'gameover' || G.state === 'warp';

  if (G.state === 'warp') {
    ctx.fillStyle = '#000';
    ctx.fillRect(-40, -40, G.w + 80, G.h + 80);
    if (G.style === 'neon') drawWarp(ctx); else drawWarpVector(ctx);
    drawParticlesDispatch(ctx);
    ctx.restore();
    drawFlash(ctx);
    return;
  }

  if (inGame) {
    drawBackgroundDispatch(ctx);

    drawTurretsDispatch(ctx);
    drawHiddenTargetsDispatch(ctx);
    for (const s of G.formationShips) drawFormationShipDispatch(ctx, s);
    for (const e of G.enemies) drawEnemyDispatch(ctx, e);
    drawBossDispatch(ctx, G.boss);
    drawBulletsDispatch(ctx);
    drawPlayerDispatch(ctx);
    drawShockwaves(ctx);
    drawParticlesDispatch(ctx);
    drawFloatingTextsDispatch(ctx);
    drawPowerUpsDispatch(ctx);

    drawTargetHUD(ctx);
  }

  ctx.restore();

  drawFlash(ctx);

  // DEMO watermark
  if (G.aiDemo) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.font = 'bold 12px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▶ DEMO MODE ◀', G.w / 2, G.h - 12);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '10px "Courier New",monospace';
    ctx.fillText('PRESS ANY KEY TO PLAY', G.w / 2, G.h - 2);
    ctx.restore();
  }
}

function drawFlash(ctx) {
  if (G.screenFlash <= 0) return;
  ctx.fillStyle = G.flashColor;
  ctx.globalAlpha = Math.min(0.55, G.screenFlash * 1.8);
  ctx.fillRect(-40, -40, G.w + 80, G.h + 80);
  ctx.globalAlpha = 1;
}

// ============================================================
//  MAIN LOOP
// ============================================================
function gameLoop(timestamp) {
  if (!G.lastTime) G.lastTime = timestamp;
  G.dt = Math.min((timestamp - G.lastTime) / 1000, 0.05);
  G.lastTime = timestamp;
  // Seconds-based clock so background wander stays identical at any refresh rate
  G.time = (G.time || 0) + G.dt;
  // Measure the game's own per-frame work (external rAF throttling is ignored)
  const wt0 = performance.now();
  update();
  render();
  musicTick();
  G.avgWork = G.avgWork * 0.94 + (performance.now() - wt0) * 0.06;
  // Adaptive quality governor — steps render load down only when the game itself is slow
  G.qCooldown = (G.qCooldown || 0) - G.dt;
  if (G.qCooldown <= 0) {
    if (G.avgWork > 15 && G.quality < 2) { G.quality++; applyQuality(); G.qCooldown = 2; }
    else if (G.avgWork < 9 && G.quality > 0) { G.quality--; applyQuality(); G.qCooldown = 5; }
  }
  requestAnimationFrame(gameLoop);
}
// ============================================================
//  STYLE-DISPATCHING WRAPPERS
// ============================================================
function drawBackgroundDispatch(ctx) { if (G.style === 'neon') drawBackground(ctx); else drawBackgroundVector(ctx); }
function drawPlayerDispatch(ctx) { if (G.style === 'neon') drawPlayer(ctx); else drawPlayerVector(ctx); }
function drawEnemyDispatch(ctx, e) { if (G.style === 'neon') drawEnemy(ctx, e); else drawEnemyVector(ctx, e); }
function drawBossDispatch(ctx, b) { if (G.style === 'neon') drawBoss(ctx, b); else drawBossVector(ctx, b); }
function drawFormationShipDispatch(ctx, s) { if (G.style === 'neon') drawFormationShip(ctx, s); else drawFormationShipVector(ctx, s); }
function drawBulletsDispatch(ctx) { if (G.style === 'neon') drawBullets(ctx); else drawBulletsVector(ctx); }
function drawParticlesDispatch(ctx) { if (G.style === 'neon') drawParticles(ctx); else drawParticlesVector(ctx); }
function drawTurretsDispatch(ctx) { if (G.style === 'neon') drawTurrets(ctx); else drawTurretsVector(ctx); }
function drawHiddenTargetsDispatch(ctx) { if (G.style === 'neon') drawHiddenTargets(ctx); else drawHiddenTargetsVector(ctx); }
function drawFloatingTextsDispatch(ctx) { if (G.style === 'neon') drawFloatingTexts(ctx); else drawFloatingTextsVector(ctx); }
function drawPowerUpsDispatch(ctx) { if (G.style === 'neon') drawPowerUps(ctx); else drawPowerUpsVector(ctx); }

// Tint the HUD value accent to the current stage's ambient glow color
function setHudAccent() {
  const s = STAGES[getStageIndex()];
  const root = document.documentElement;
  root.style.setProperty('--hud-accent', s.accent);
  const r = parseInt(s.accent.slice(1, 3), 16);
  const g = parseInt(s.accent.slice(3, 5), 16);
  const b = parseInt(s.accent.slice(5, 7), 16);
  root.style.setProperty('--hud-accent-rgb', r + ',' + g + ',' + b);
}

function updateHUD() {
  setHudAccent();
  const el = (id) => document.getElementById(id);
  el('hud-score').textContent = G.score.toLocaleString();
  el('hud-hi').textContent = G.highScore.toLocaleString();
  el('hud-stage').textContent = G.stage + (G.loop > 0 ? '-' + (G.loop + 1) : '');
  let livesStr = '';
  for (let i = 0; i < G.lives; i++) livesStr += '●';
  el('hud-lives').textContent = livesStr || '—';
  updateMissileHUD();
  if (G.state === 'paused') el('pause-overlay').classList.add('active');
  else el('pause-overlay').classList.remove('active');
}

// Lock-on missile indicator: two pips = the 2 on-screen slots, a meter = the
// brief re-launch cooldown, and a status word (READY / RECHARGE / MAX).
function updateMissileHUD() {
  const value = document.getElementById('hud-missile-value');
  if (!value) return;
  const fill = document.getElementById('hud-missile-fill');
  const pips = [
    document.getElementById('hud-missile-pip-0'),
    document.getElementById('hud-missile-pip-1'),
  ];
  const p = G.player;
  const onScreen = G.missiles.filter(m => m.life > 0).length;

  const cdFrac = (p && p.missileCooldown > 0)
    ? 1 - Math.min(1, p.missileCooldown / MISSILE_COOLDOWN)
    : 1;
  if (fill) fill.style.width = (cdFrac * 100).toFixed(1) + '%';

  for (let i = 0; i < MAX_MISSILES; i++) {
    if (pips[i]) pips[i].classList.toggle('lit', i < onScreen);
  }

  value.classList.remove('ready', 'recharge', 'max');
  if (p && p.missileCooldown > 0) {
    value.textContent = 'RECHARGE';
    value.classList.add('recharge');
  } else if (onScreen >= MAX_MISSILES) {
    value.textContent = 'MAX';
    value.classList.add('max');
  } else {
    value.textContent = 'READY';
    value.classList.add('ready');
  }
}

// ============================================================
//  INPUT
// ============================================================
document.addEventListener('keydown', e => {
  if (G.aiDemo) {
    endDemo();
    G.keys = {};
    return;
  }
  G.keys[e.code] = true;

  if (e.code === 'Enter' || e.code === 'Space') {
    if (G.state === 'title') { e.preventDefault(); startGame(); return; }
    if (G.state === 'gameover') {
      // Restart from game over via Enter
      if (document.getElementById('name-entry').style.display !== 'flex') {
        document.getElementById('gameover-screen').classList.remove('active');
        startGame();
        return;
      }
    }
  }

  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (G.state === 'playing') {
      G.state = 'paused';
      updateHUD();
      suspendAudio();
    } else if (G.state === 'paused') {
      G.state = 'playing';
      updateHUD();
      document.getElementById('pause-overlay').classList.remove('active');
      resumeAudio();
    }
  }

  if (e.code === 'KeyM') setMuted(!G.muted);
});

document.addEventListener('keyup', e => { G.keys[e.code] = false; });

// Touch input
let touchIdentifier = null;
G.touchDir = null;
G.touchFiring = false;
G.touchMissile = false;

const dpad = document.getElementById('touch-dpad');
dpad.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchIdentifier = t.identifier;
  updateTouchDir(t);
}, { passive: false });
dpad.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchIdentifier) updateTouchDir(t);
  }
}, { passive: false });
dpad.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchIdentifier) { G.touchDir = null; touchIdentifier = null; }
  }
}, { passive: false });
dpad.addEventListener('touchcancel', () => { G.touchDir = null; touchIdentifier = null; });

function updateTouchDir(touch) {
  const rect = dpad.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = touch.clientX - cx;
  const dy = touch.clientY - cy;
  if (Math.hypot(dx, dy) < 15) { G.touchDir = null; return; }
  const dir = angleToDir(Math.atan2(dy, dx));
  const vec = DIR_VECTORS[dir];
  G.touchDir = { x: vec.x, y: vec.y };
}

const missileBtn = document.getElementById('touch-missile');
missileBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  G.touchMissile = true;
  missileBtn.classList.add('pressed');
}, { passive: false });
missileBtn.addEventListener('touchend', e => {
  e.preventDefault();
  G.touchMissile = false;
  missileBtn.classList.remove('pressed');
}, { passive: false });
missileBtn.addEventListener('touchcancel', () => {
  G.touchMissile = false;
  missileBtn.classList.remove('pressed');
});

const fireBtn = document.getElementById('touch-fire');
fireBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  G.touchFiring = true;
  fireBtn.classList.add('pressed');
}, { passive: false });
fireBtn.addEventListener('touchend', e => {
  e.preventDefault();
  G.touchFiring = false;

fireBtn.addEventListener('touchcancel', () => {

// ============================================================
//  AI ATTRACTOR MODE
// ============================================================
function startDemo() {
  if (G.aiDemo) return;
  G.aiDemo = true;
  G.aiTarget = null;
  G.aiMoveTimer = 0; G.aiShootTimer = 0; G.aiDodgeTimer = 0;
  G.aiDodgeDir = 0; G.aiLastDir = 0; G.aiDirChangeTimer = 0;

  const savedDiff = G.difficulty;
  G.difficulty = 'easy';
  startGame();
  G.difficulty = savedDiff;
  document.getElementById('title-screen').classList.remove('active');
  G.keys = {};
  G.touchDir = null;
  G.touchFiring = false;
  G._demoExit = function () { endDemo(); };
  document.addEventListener('touchstart', G._demoExit, { once: true });
  document.addEventListener('click', G._demoExit, { once: true });
}

function endDemo() {
  if (!G.aiDemo) return;
  G.aiDemo = false;
  G.aiTarget = null;
  G.keys = {};
  if (G._demoExit) {
    document.removeEventListener('touchstart', G._demoExit);
    document.removeEventListener('click', G._demoExit);
    G._demoExit = null;
  }
  stopMusic();
  resumeAudio();
  G.state = 'title';
  document.getElementById('hud').classList.remove('active');
  document.getElementById('stage-intro').classList.remove('active');
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('hs-screen').classList.remove('active');
  document.getElementById('pause-overlay').classList.remove('active');
  document.getElementById('title-screen').classList.add('active');
  updateTouchVisibility();
  updateHUD();
  G.aiIdleTimer = 0;
  const prompt = document.querySelector('.title-prompt');
  if (prompt) prompt.textContent = '▶ PRESS ENTER OR TAP TO START ◀';
}

function aiMoveDir(dir, fire) {
  const vec = DIR_VECTORS[dir];
  G.keys = {};
  if (vec.y < 0) G.keys['ArrowUp'] = true;
  if (vec.y > 0) G.keys['ArrowDown'] = true;
  if (vec.x < 0) G.keys['ArrowLeft'] = true;
  if (vec.x > 0) G.keys['ArrowRight'] = true;
  if (fire) G.keys['Space'] = true;
}

function aiFindDanger(p) {
  let worst = null, worstScore = 0;
  const pv = DIR_VECTORS[p.dir];
  const pvx = pv.x * p.speed * 60, pvy = pv.y * p.speed * 60;
  for (const b of G.enemyBullets) {
    const r0x = deltaX(p, b), r0y = deltaY(p, b);
    const rvx = b.vx * 60 - pvx, rvy = b.vy * 60 - pvy;
    const spd2 = (rvx * rvx + rvy * rvy) || 1;
    const tca = clamp(-(r0x * rvx + r0y * rvy) / spd2, 0, 1.2);
    const cdist = Math.hypot(r0x + rvx * tca, r0y + rvy * tca);
    const curD = Math.hypot(r0x, r0y);
    if (tca <= 1.1 && cdist < 44 && curD < 280) {
      const score = 1000 - cdist * 6 - tca * 300;
      if (score > worstScore) { worstScore = score; worst = { b, tca, cdist }; }
    }
  }
  return worst;
}

function aiDodgeDir(p, danger) {
  const bulletAngle = Math.atan2(danger.b.vy, danger.b.vx);
  const opts = [bulletAngle + Math.PI / 2, bulletAngle - Math.PI / 2];
  const look = 0.35;
  const spd = p.speed * 60;
  const scored = opts.map(a => {
    const dir = angleToDir(a);
    const vec = DIR_VECTORS[dir];
    const fx = wrapX(p.x + vec.x * spd * look);
    const fy = wrapY(p.y + vec.y * spd * look);
    let score = wrapDist({ x: fx, y: fy }, { x: danger.b.x + danger.b.vx * 60 * look, y: danger.b.y + danger.b.vy * 60 * look });
    let minClear = 999;
    for (const ob of G.enemyBullets) {
      const d = wrapDist({ x: fx, y: fy }, { x: ob.x + ob.vx * 60 * look, y: ob.y + ob.vy * 60 * look });
      if (d < minClear) minClear = d;
    }
    score += minClear * 0.6;
    return { dir, score };
  });
  const best = scored[0].score >= scored[1].score ? scored[0] : scored[1];
  const cur = scored.find(s => s.dir === G.aiDodgeDir) || best;
  if (best.score > cur.score * 1.25) return best.dir;
  return cur.dir;
}

function aiPickTarget(p) {
  if (G.formationActive) {
    let best = null, bestD = Infinity;
    for (const s of G.formationShips) {
      if (!s.alive) continue;
      const d = wrapDist(p, s);
      if (d < bestD) { bestD = d; best = s; }
    }
    if (best && bestD < 720) return { type: 'formation', obj: best, dist: bestD };
  }
  let nearEnemy = Infinity;
  for (const e of G.enemies) {
    if (!e.alive) continue;
    const d = wrapDist(p, e);
    if (d < nearEnemy) nearEnemy = d;
  }
  if (nearEnemy > 120) {
    let best = null, bestD = Infinity;
    for (const t of G.hiddenTargets) {
      if (!t.alive) continue;
      const d = wrapDist(p, t);
      if (d < 460 && d < bestD) { bestD = d; best = t; }
    }
    if (best) return { type: 'hidden', obj: best, dist: bestD };
  }
  let best = null, bestD = Infinity;
  for (const e of G.enemies) {
    if (!e.alive) continue;
    const d = wrapDist(p, e);
    if (d < bestD) { bestD = d; best = e; }
  }
  if (best) return { type: 'enemy', obj: best, dist: bestD };
  for (const t of G.hiddenTargets) {
    if (!t.alive) continue;
    const d = wrapDist(p, t);
    if (d < bestD) { bestD = d; best = t; }
  }
  if (best) return { type: 'hidden', obj: best, dist: bestD };
  return null;
}

function updateAI() {
  if (!G.aiDemo && !G.autopilot) return;
  if (!G.player || !G.player.alive) { G.aiTarget = null; G.keys = {}; return; }
  const p = G.player;

  const danger = aiFindDanger(p);
  if (danger) {
    G.aiDodgeTimer = 0.3;
    G.aiDodgeDir = aiDodgeDir(p, danger);
  }
  if (G.aiDodgeTimer > 0) {
    G.aiDodgeTimer -= G.dt;
    aiMoveDir(G.aiDodgeDir, true);
    return;
  }

  const tgt = aiPickTarget(p);
  if (tgt) {
    const dx = deltaX(p, tgt.obj), dy = deltaY(p, tgt.obj);
    const dist = Math.hypot(dx, dy);
    const dir = angleToDir(Math.atan2(dy, dx));
    G.aiDirChangeTimer -= G.dt;
    if (dir !== G.aiLastDir || G.aiDirChangeTimer <= 0) {
      G.aiLastDir = dir;
      G.aiDirChangeTimer = 0.5;
    }
    aiMoveDir(G.aiLastDir, true);
    const standoff = tgt.type === 'hidden' ? 0 : 90;
    if (dist < standoff) aiMoveDir((G.aiLastDir + 4) % 8, true);
  } else {
    G.aiDirChangeTimer -= G.dt;
    if (G.aiDirChangeTimer <= 0) {
      G.aiLastDir = randInt(0, 7);
      G.aiDirChangeTimer = rand(0.5, 2);
    }
    aiMoveDir(G.aiLastDir, true);
  }
}

// ============================================================
//  TITLE / MENU BINDINGS
// ============================================================
document.getElementById('title-screen').addEventListener('touchstart', e => {
  if (G.state === 'title' && e.target.tagName !== 'BUTTON') startGame();
});
document.getElementById('title-screen').addEventListener('click', e => {
  if (G.state === 'title' && e.target.tagName !== 'BUTTON') startGame();
});

document.querySelectorAll('.style-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    G.style = btn.dataset.style;
  });
});
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    G.difficulty = btn.dataset.diff;
  });
});

function togglePause() {
  if (G.state === 'playing') {
    G.state = 'paused';
    updateHUD();
    suspendAudio();
  } else if (G.state === 'paused') {
    G.state = 'playing';
    updateHUD();
    document.getElementById('pause-overlay').classList.remove('active');
    resumeAudio();
  }
}
document.getElementById('hud-pause-btn').addEventListener('click', togglePause);
document.getElementById('resume-btn').addEventListener('click', togglePause);

document.getElementById('sound-btn').addEventListener('click', () => setMuted(!G.muted));
document.getElementById('haptics-btn').addEventListener('click', () => setHaptics(!G.hapticsOn));

function quitToTitle() {
  G.state = 'title';
  stopMusic();
  resumeAudio();
  for (const id of ['pause-overlay', 'hud', 'gameover-screen', 'hs-screen', 'stage-intro']) {
    document.getElementById(id).classList.remove('active');
  }
  document.getElementById('title-screen').classList.add('active');
  updateTouchVisibility();
  updateHUD();
}
document.getElementById('quit-btn').addEventListener('click', quitToTitle);

document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('name-entry').style.display = 'none';
  startGame();
});
document.getElementById('hs-btn').addEventListener('click', showHighScores);
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('name-entry').style.display = 'none';
  G.state = 'title';
  stopMusic();
  resumeAudio();
  document.getElementById('title-screen').classList.add('active');
});
document.getElementById('name-submit').addEventListener('click', () => {
  const name = document.getElementById('name-input').value || 'AAA';
  enterHighScore(name);
  document.getElementById('name-entry').style.display = 'none';
});
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('name-submit').click();
});
document.getElementById('name-input').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
});
document.getElementById('hs-back-btn').addEventListener('click', () => {
  document.getElementById('hs-screen').classList.remove('active');
  if (hsCameFrom === 'gameover') {
    G.state = 'gameover';
    document.getElementById('gameover-screen').classList.add('active');
  } else {
    G.state = 'title';
    document.getElementById('title-screen').classList.add('active');
  }
  updateTouchVisibility();
});

// ============================================================
//  INIT
// ============================================================
function init() {
  try { G.muted = localStorage.getItem('neonpilot_muted') === '1'; } catch (e) {}
  try { G.hapticsOn = localStorage.getItem('neonpilot_haptics') !== '0'; } catch (e) {}
  setMuted(G.muted);
  setHaptics(G.hapticsOn);

  const canvas = document.getElementById('game');
  G.canvas = canvas;
  G.ctx = canvas.getContext('2d');

  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.state === 'playing') togglePause();
  });

  for (let i = 0; i < 240; i++) {
    G.stars.push({
      x: rand(0, WORLD_SIZE), y: rand(0, WORLD_SIZE),
      size: rand(0.5, 2.2), brightness: rand(0.2, 1),
    });
  }

  const scores = getHighScores();
  if (scores.length > 0) G.highScore = scores[0].score;

  updateHUD();

  const qp = new URLSearchParams(location.search);
  if (qp.get('style')) G.style = qp.get('style') === 'vector' ? 'vector' : 'neon';
  if (qp.get('diff') && ['easy', 'normal', 'hard'].includes(qp.get('diff'))) G.difficulty = qp.get('diff');
  if (qp.get('autostart')) {
    if (qp.get('autopilot')) {
      setTimeout(() => { startGame(); G.autopilot = true; }, 250);
    } else {
      setTimeout(() => startDemo(), 250);
    }
  }

  gameLoop(0);
}

function applyQuality() {
  // Step render load down as the game's own work time rises; recover when it clears.
  const q = G.quality;
  G.maxDpr = q >= 1 ? 1 : 2;        // drop retina overdraw first (biggest win)
  G.renderScale = q >= 2 ? 0.75 : 1; // then shrink the backing store
  G.glowMul = q >= 1 ? 0.6 : 1;      // and soften glow blur
  if (typeof resize === 'function') resize();
}

function resize() {
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  const ratio = 4 / 3;
  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  G.w = Math.floor(w);
  G.h = Math.floor(h);
  const dpr = Math.min(window.devicePixelRatio || 1, G.maxDpr || 2) * (G.renderScale || 1);
  G.canvas.style.width = G.w + 'px';
  G.canvas.style.height = G.h + 'px';
  G.canvas.width = Math.max(1, Math.floor(G.w * dpr));
  G.canvas.height = Math.max(1, Math.floor(G.h * dpr));
  if (typeof updateTouchVisibility === 'function') updateTouchVisibility();
  G.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G.ctx.imageSmoothingEnabled = false;
  skyGradCache = {}; // canvas was cleared — drop cached gradients
  updateTouchVisibility();
}

function isTouchDevice() {
  if (window.matchMedia) {
    if (window.matchMedia('(pointer: coarse)').matches) return true;
    if (window.matchMedia('(any-pointer: coarse)').matches && window.innerWidth <= 768) return true;
  }
  return ('ontouchstart' in window) && window.innerWidth <= 768;
}

function updateTouchVisibility() {
  const el = document.getElementById('touch-controls');
  if (isTouchDevice()) el.classList.toggle('active', G.state === 'playing');
  else el.classList.remove('active');
}

window.addEventListener('load', init);

</script>
