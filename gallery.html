<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery — Inside Onyx Systems | Onyx Systems, Lake City FL</title>

<script>document.documentElement.dataset.theme=localStorage.getItem('onyx-theme')||'dark';</script>
<style>
  :root{
    --copper:#C2703D; --copper-2:#E8B06A; --copper-deep:#A8542A; --copper-wash:rgba(199,112,61,.14);
    --accent:#C2703D; --accent-deep:#A8542A; --onyx-2:#1F1F25; --paper:#F7F4EF;
    --bg:#16161A; --surface:#212128; --surface-2:#27272F; --text:#EDE8E0; --text-2:#E0DAD1;
    --muted:#A89E94; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
    --line-accent:rgba(199,112,61,.35); --shadow:0 10px 30px rgba(0,0,0,.28);
    --shadow-focus:0 0 0 3px rgba(199,112,61,.55);
    --brand-font:'Oswald',"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --maxw:1140px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  }
  :root[data-theme="light"]{
    --bg:#F4F1EB; --surface:#FFFFFF; --surface-2:#FBF8F2; --text:#23201C; --text-2:#403a34;
    --muted:#5d564d; --line:rgba(35,32,28,.12); --line-strong:rgba(35,32,28,.18);
    --line-accent:rgba(168,84,42,.35); --footer-bg:#23201C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:17px}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--r-sm)}
  .wrap{width:min(var(--maxw),92vw);margin:0 auto}
  .brand-font{font-family:var(--brand-font);font-weight:700;letter-spacing:.02em;display:inline-block}
  /* header */
  header.site{position:sticky;top:0;z-index:50;background:var(--nav-bg,rgba(22,22,26,.96));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:16px;padding:12px 0}
  .brand img{height:38px;width:auto}
  .nav .spacer{flex:1}
  .back-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--r-pill);background:var(--copper);color:#fff;font-weight:700;font-size:15px;min-height:44px}
  .back-link:hover{background:var(--copper-2);color:#23201C}
  /* section */
  .gallery-page{padding:48px 0 72px}
  .eyebrow{color:var(--copper-2);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;text-align:center}
  h1{text-align:center;font-size:clamp(34px,6vw,56px);color:var(--text);font-weight:800;margin:8px 0 4px;letter-spacing:.02em}
  h1 .hl{color:var(--copper)}
  .sub{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 28px;font-size:16px}
  /* masonry grid — natural vertical scroll, ALL items reachable (no modal clipping) */
  .gallery-grid{column-count:3;column-gap:16px;margin-top:8px}
  @media(max-width:900px){.gallery-grid{column-count:2}}
  @media(max-width:560px){.gallery-grid{column-count:1}}
  .gallery-item{break-inside:avoid;margin:0 0 16px;display:block;width:100%;border-radius:12px;overflow:hidden;background:#000;box-shadow:var(--shadow);position:relative;border:1px solid var(--line)}
  .gallery-item img,.gallery-item video{display:block;width:100%;height:auto;border-radius:12px;background:#05080a}
  .gallery-item video{aspect-ratio:16/9}
  .gallery-item:hover{box-shadow:0 18px 40px rgba(194,112,61,.35);border-color:var(--copper)}
  .gallery-item:focus-visible{outline:3px solid var(--copper-deep);outline-offset:3px}
  /* full-size in-page viewer (click pic -> largest that fits, aspect preserved, click-out returns to grid) */
  .gl-viewer{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
  .gl-viewer[hidden]{display:none}
  .glv-scrim{position:absolute;inset:0;background:rgba(8,8,10,.94);backdrop-filter:blur(4px);cursor:zoom-out}
  .glv-stage{position:relative;z-index:1;max-width:96vw;max-height:94vh;display:flex;align-items:center;justify-content:center}
  .glv-stage img,.glv-stage video{max-width:100%;max-height:94vh;width:auto;height:auto;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000;display:block}
  .glv-close{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:50%;border:none;background:var(--copper-deep);color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
  .glv-close:hover{background:var(--copper)}
  footer.site{background:var(--footer-bg,#0e0e12);color:#cfc9c0;padding:32px 0;text-align:center;font-size:14px;margin-top:40px}
  footer a{color:var(--copper-2)}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-theme="dark">
<header class="site">
  <div class="wrap nav">
    <a class="brand" href="index.html" aria-label="Onyx Systems home"><img src="assets/img/brand/onyxsystems-logo.png" alt="Onyx Systems"></a>
    <span class="spacer"></span>
    <a class="back-link" href="index.html">← Back to onyxpc.us</a>
  </div>
</header>

<main class="gallery-page">
  <div class="wrap">
    <div class="eyebrow">From Inside the Shop</div>
    <h1>GALLERY</h1>
    <p class="sub">A look inside Onyx Systems</p>
    <div class="gallery-grid" id="galleryGrid" aria-label="Full photo and video gallery, newest first"></div>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <div class="brand-font" style="font-size:22px;color:#fff">ONYX SYSTEMS</div>
    <p style="margin-top:8px">Complete Computer Care · Lake City, FL · Since 1997</p>
    <p style="margin-top:6px"><a href="tel:+13867557772">📞 (386) 755-7772</a> · <a href="index.html">Back to home</a></p>
  </div>
</footer>

<div class="gl-viewer" id="glViewer" role="dialog" aria-modal="true" aria-label="Photo and video viewer" hidden>
  <div class="glv-scrim" id="glvScrim"></div>
  <div class="glv-stage" id="glvStage">
    <button class="glv-close" id="glvClose" aria-label="Close viewer (Esc)">×</button>
  </div>
</div>

<script>
/* ---- Gallery data (mirrors index.html GALLERY array; newest-first) ---- */
var GALLERY=[
  {date:'2026-07-09', type:'image', full:'assets/img/gallery/g-2026-07-09.webp', fullJpg:'assets/img/gallery/g-2026-07-09.jpg', thumb:'assets/img/gallery/g-2026-07-09-thumb.webp', thumbJpg:'assets/img/gallery/g-2026-07-09-thumb.jpg', w:1600, h:1205, alt:'Inside the Onyx Systems shop with John working at the repair bench (2026).'},
  {date:'2020-07-27', type:'image', full:'assets/img/gallery/g-2020-07-27.webp', fullJpg:'assets/img/gallery/g-2020-07-27.jpg', thumb:'assets/img/gallery/g-2020-07-27-thumb.webp', thumbJpg:'assets/img/gallery/g-2020-07-27-thumb.jpg', w:1600, h:900, alt:'The Onyx Systems shop and work area (2020).'},
  {date:'2020-04-24', type:'video', video:'assets/img/gallery/g-2020-04-24.mp4', poster:'assets/img/gallery/g-2020-04-24-poster.webp', posterJpg:'assets/img/gallery/g-2020-04-24-poster.jpg', w:1280, h:720, alt:'Video: a computer on the bench at Onyx Systems being repaired and updated.'},
  {date:'2016-12-08', type:'image', full:'assets/img/gallery/g-2016-12-08-1.webp', fullJpg:'assets/img/gallery/g-2016-12-08-1.jpg', thumb:'assets/img/gallery/g-2016-12-08-1-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-12-08-1-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (December 2016).'},
  {date:'2016-12-08', type:'image', full:'assets/img/gallery/g-2016-12-08-2.webp', fullJpg:'assets/img/gallery/g-2016-12-08-2.jpg', thumb:'assets/img/gallery/g-2016-12-08-2-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-12-08-2-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (December 2016).'},
  {date:'2016-12-08', type:'image', full:'assets/img/gallery/g-2016-12-08-3.webp', fullJpg:'assets/img/gallery/g-2016-12-08-3.jpg', thumb:'assets/img/gallery/g-2016-12-08-3-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-12-08-3-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (December 2016).'},
  {date:'2016-11-07', type:'image', full:'assets/img/gallery/g-2016-11-07-1.webp', fullJpg:'assets/img/gallery/g-2016-11-07-1.jpg', thumb:'assets/img/gallery/g-2016-11-07-1-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-11-07-1-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (November 2016).'},
  {date:'2016-11-07', type:'image', full:'assets/img/gallery/g-2016-11-07-2.webp', fullJpg:'assets/img/gallery/g-2016-11-07-2.jpg', thumb:'assets/img/gallery/g-2016-11-07-2-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-11-07-2-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (November 2016).'},
  {date:'2016-11-07', type:'image', full:'assets/img/gallery/g-2016-11-07-3.webp', fullJpg:'assets/img/gallery/g-2016-11-07-3.jpg', thumb:'assets/img/gallery/g-2016-11-07-3-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-11-07-3-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (November 2016).'},
  {date:'2016-11-07', type:'image', full:'assets/img/gallery/g-2016-11-07-4.webp', fullJpg:'assets/img/gallery/g-2016-11-07-4.jpg', thumb:'assets/img/gallery/g-2016-11-07-4-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-11-07-4-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (November 2016).'},
  {date:'2016-11-07', type:'image', full:'assets/img/gallery/g-2016-11-07-5.webp', fullJpg:'assets/img/gallery/g-2016-11-07-5.jpg', thumb:'assets/img/gallery/g-2016-11-07-5-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-11-07-5-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (November 2016).'},
  {date:'2016-11-07', type:'image', full:'assets/img/gallery/g-2016-11-07-6.webp', fullJpg:'assets/img/gallery/g-2016-11-07-6.jpg', thumb:'assets/img/gallery/g-2016-11-07-6-thumb.webp', thumbJpg:'assets/img/gallery/g-2016-11-07-6-thumb.jpg', w:1600, h:900, alt:'Inside the Onyx Systems shop (November 2016).'}
];
(function(){
  var supportsWebp=false;
  try{var c=document.createElement('canvas');supportsWebp=!!(c.getContext&&c.getContext('2d')&&c.toDataURL&&c.toDataURL('image/webp').indexOf('image/webp')===0);}catch(e){supportsWebp=false;}
  var grid=document.getElementById('galleryGrid');
  if(!grid)return;
  GALLERY.forEach(function(item){
    var fig=document.createElement('figure');
    fig.className='gallery-item';
    if(item.type==='video'){
      var v=document.createElement('video');
      v.src=item.video; v.poster=supportsWebp?item.poster:item.posterJpg;
      v.controls=true; v.muted=false; v.playsInline=true; v.preload='metadata';
      v.setAttribute('aria-label',item.alt||'shop video');
      fig.appendChild(v);
    } else {
      var p=document.createElement('picture');
      if(supportsWebp){var s=document.createElement('source');s.srcset=item.full;s.type='image/webp';p.appendChild(s);}
      var im=document.createElement('img');
      im.src=supportsWebp?item.full:item.fullJpg;
      im.alt=item.alt||''; im.loading='lazy'; im.decoding='async';
      if(item.w&&item.h) im.width=item.w, im.height=item.h;
      p.appendChild(im); fig.appendChild(p);
    }
    grid.appendChild(fig);
    fig.style.cursor='pointer';
    fig.setAttribute('role','button');
    fig.setAttribute('tabindex','0');
    fig.setAttribute('aria-label',(item.type==='video'?'Play video: ':'View photo: ')+(item.alt||'shop media'));
    fig.addEventListener('click', function(){ openViewer(item); });
    fig.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openViewer(item); } });
  });

  /* ---- full-size in-page viewer: click pic -> largest that fits, aspect preserved; click-out/ESC/backdrop returns to grid (no URL change) ---- */
  var viewer=document.getElementById('glViewer'),
      vstage=document.getElementById('glvStage'),
      vscrim=document.getElementById('glvScrim'),
      vclose=document.getElementById('glvClose'),
      vLast=null;
  function openViewer(item){
    vLast=document.activeElement;
    vstage.querySelectorAll('.glv-media').forEach(function(n){ if(n.tagName==='VIDEO'){try{n.pause();}catch(e){}} n.remove(); });
    if(item.type==='video'){
      var v=document.createElement('video');
      v.className='glv-media'; v.src=item.video; v.poster=supportsWebp?item.poster:item.posterJpg;
      v.controls=true; v.autoplay=true; v.playsInline=true; v.muted=false;
      v.setAttribute('aria-label', item.alt||'shop video');
      vstage.appendChild(v); v.play().catch(function(){});
    } else {
      var p=document.createElement('picture');
      if(supportsWebp){ var s=document.createElement('source'); s.srcset=item.full; s.type='image/webp'; p.appendChild(s); }
      var im=document.createElement('img'); im.className='glv-media';
      im.src=supportsWebp?item.full:item.fullJpg; im.alt=item.alt||'';
      p.appendChild(im); vstage.appendChild(p);
    }
    viewer.hidden=false;
    document.body.style.overflow='hidden';
    vclose.focus();
  }
  function closeViewer(){
    if(viewer.hidden) return;
    viewer.hidden=true;
    document.body.style.overflow='';
    vstage.querySelectorAll('.glv-media').forEach(function(n){ if(n.tagName==='VIDEO'){try{n.pause();}catch(e){}} n.remove(); });
    if(vLast && vLast.focus) vLast.focus();
  }
  if(vscrim) vscrim.addEventListener('click', closeViewer);
  if(vclose) vclose.addEventListener('click', closeViewer);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !viewer.hidden) closeViewer(); });
})();
</script>
</body>
</html>
