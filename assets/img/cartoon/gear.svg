<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img" aria-label="Cartoon gear representing process and steps">
  <!-- teeth -->
  <g fill="#23232b" stroke="#C2703D" stroke-width="4">
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(0 120 100)"/>
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(45 120 100)"/>
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(90 120 100)"/>
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(135 120 100)"/>
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(180 120 100)"/>
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(225 120 100)"/>
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(270 120 100)"/>
    <rect x="111" y="40" width="18" height="26" rx="5" transform="rotate(315 120 100)"/>
  </g>
  <!-- body -->
  <circle cx="120" cy="100" r="40" fill="#15151b" stroke="#C2703D" stroke-width="4"/>
  <circle cx="120" cy="100" r="16" fill="#23232b" stroke="#C2703D" stroke-width="3"/>
  <circle cx="120" cy="100" r="5" fill="#E8B06A"/>
</svg>
