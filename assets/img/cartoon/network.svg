<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img" aria-label="Cartoon wifi router with signal">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23232b"/><stop offset="1" stop-color="#15151b"/>
    </linearGradient>
  </defs>
  <!-- router -->
  <rect x="70" y="118" width="100" height="40" rx="10" fill="url(#ng)" stroke="#C2703D" stroke-width="4"/>
  <circle cx="90" cy="138" r="4" fill="#E8B06A"/>
  <circle cx="106" cy="138" r="4" fill="#E8B06A"/>
  <circle cx="122" cy="138" r="4" fill="#E8B06A"/>
  <!-- antennas -->
  <path d="M88 118 v-18 M152 118 v-18" stroke="#6B635A" stroke-width="4" stroke-linecap="round"/>
  <!-- signal waves -->
  <g stroke="#C2703D" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M120 96 q22 -26 44 0" opacity="0.95"/>
    <path d="M120 80 q34 -40 68 0" opacity="0.7"/>
    <path d="M120 64 q46 -54 92 0" opacity="0.45"/>
  </g>
  <circle cx="120" cy="104" r="6" fill="#C2703D"/>
  <path d="M196 150 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z" fill="#E8B06A"/>
</svg>
