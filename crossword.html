<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Crossword — Onyx Systems</title>
<meta name="description" content="Today's crossword from Onyx Systems — a fresh puzzle every day. Fill across and down, check your answers, and reveal the solution.">
<style>
  :root{
    --copper:#C2703D; --copper-2:#E8B06A; --copper-deep:#A8542A;
    --cream:#f7f4ef; --ink:#16161a; --xw-cell:34px;
    --surface:#15131c; --surface-2:#0d0b13; --hair:rgba(194,112,61,.30);
    --txt:#f7f4ef; --txt-2:#cfc9c0; --muted:#9a938a;
    --r:14px; --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#0a0612;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh;overflow:hidden;
    background-image:radial-gradient(120% 70% at 50% 0%,#3a1052 0%,transparent 55%),
      radial-gradient(120% 80% at 50% 120%,#2a0b3f 0%,#0a0612 60%),
      linear-gradient(180deg,#120726,#1a0b2e 55%,#06030d);
    background-attachment:fixed;
  }
  body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.16;pointer-events:none;
    background-image:linear-gradient(90deg,rgba(194,112,61,.5) 1px,transparent 1px),
      linear-gradient(0deg,rgba(120,80,255,.4) 1px,transparent 1px);background-size:46px 46px}

  .xw-app{display:flex;flex-direction:column;height:100vh;max-width:1120px;margin:0 auto;padding:16px 18px 14px;gap:14px}

  /* ---------- Header ---------- */
  .xw-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .xw-brand{display:flex;align-items:center;gap:13px;min-width:0}
  .xw-glyph{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--copper),var(--copper-deep));color:#1a0b09;
    font-size:24px;font-weight:800;box-shadow:0 8px 20px rgba(194,112,61,.35)}
  .xw-title{font-family:"Oswald","Segoe UI",sans-serif;font-weight:700;font-size:clamp(24px,4.4vw,38px);
    line-height:1;color:#fff;letter-spacing:.015em;margin:0;
    text-shadow:0 0 1px #0a0612,0 3px 10px rgba(0,0,0,.85),0 0 18px rgba(194,112,61,.5)}
  .xw-sub{margin:4px 0 0;font-size:13px;color:var(--copper-2);font-weight:600;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xw-sub #xwMeta{color:var(--muted);font-weight:500}
  .xw-back{display:inline-block;text-decoration:none;padding:10px 18px;border-radius:999px;
    background:rgba(255,255,255,.07);color:var(--txt);font-weight:700;font-size:14px;
    border:1px solid var(--hair);transition:background .2s var(--ease),color .2s var(--ease);white-space:nowrap}
  .xw-back:hover{background:var(--copper);color:#fff}

  /* ---------- Stage: board + clues ---------- */
  .xw-stage{flex:1 1 auto;min-height:0;display:flex;gap:18px}
  .xw-boardcol{flex:1 1 auto;min-width:0;min-height:0;display:flex}
  .xw-board{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:flex;
    align-items:center;justify-content:safe center;overflow:auto;border:2px solid var(--copper);
    border-radius:var(--r);padding:16px;
    background:linear-gradient(180deg,var(--surface),var(--surface-2));
    box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03)}
  .xw-grid{display:grid;gap:3px;background:#0a0612;padding:7px;border-radius:9px;margin:auto}

  .xw-cell{position:relative;width:var(--xw-cell);height:var(--xw-cell);background:#f3ead9;border-radius:3px;
    transition:background .18s var(--ease)}
  .xw-cell.block{background:transparent}
  .xw-cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;
    font-size:calc(var(--xw-cell) * .72);font-weight:800;text-transform:uppercase;color:var(--ink);
    padding:0;border-radius:3px;cursor:pointer;font-family:inherit}
  .xw-cell input:focus{outline:none}
  .xw-cell:focus-within{outline:2px solid var(--copper-2);outline-offset:-2px}
  .xw-num{position:absolute;top:1px;left:3px;font-size:calc(var(--xw-cell) * .34);line-height:1;
    color:#6B635A;pointer-events:none;font-weight:800}
  /* whole active word gets a copper wash; the active cell a stronger ring */
  .xw-cell.word{background:#f6e3c8}
  .xw-cell.active-cell{background:#f6e3c8;box-shadow:inset 0 0 0 2px rgba(194,112,61,.55)}
  .xw-cell.correct{background:#bfe6c4}
  .xw-cell.wrong{background:#e8b4ad}
  .xw-cell.word.correct{background:#bfe6c4}
  .xw-cell.word.wrong{background:#e8b4ad}

  /* ---------- Clues panel ---------- */
  .xw-clues{flex:0 0 330px;min-height:0;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--hair);
    border-radius:var(--r);padding:14px 8px 14px 16px}
  .xw-cluehead{display:flex;gap:8px;margin-bottom:10px}
  .xw-tab{flex:1;text-align:center;padding:9px 0;border-radius:999px;font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;
    border:1px solid var(--hair);user-select:none;transition:.2s var(--ease)}
  .xw-tab[aria-selected="true"]{background:var(--copper);color:#fff;border-color:var(--copper)}
  .xw-cluelist{flex:1 1 auto;min-height:0;overflow:auto;padding-right:6px}
  .xw-list{list-style:none;margin:0;padding:0}
  .xw-list[hidden]{display:none}
  .xw-h{font-weight:800;color:var(--copper-2);text-transform:uppercase;letter-spacing:.08em;
    margin:0 0 8px;font-size:13px;border-bottom:1px solid var(--hair);padding-bottom:6px;display:none}
  .xw-clue{margin-bottom:7px;color:var(--txt-2);cursor:pointer;line-height:1.4;font-size:14.5px;
    padding:6px 9px;border-radius:7px;transition:background .15s var(--ease),color .15s var(--ease);
    border-left:3px solid transparent}
  .xw-clue b{color:var(--cream);margin-right:5px}
  .xw-clue:hover{background:rgba(255,255,255,.05)}
  .xw-clue.active{background:rgba(194,112,61,.16);color:var(--copper-2);font-weight:600;
    border-left-color:var(--copper)}

  /* ---------- Footer: current-clue bar + actions + status ---------- */
  .xw-footer{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
    background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--hair);
    border-radius:var(--r);padding:12px 16px}
  .xw-now{flex:1 1 260px;min-width:0;display:flex;align-items:baseline;gap:10px;
    background:rgba(194,112,61,.10);border:1px solid var(--hair);border-radius:10px;padding:9px 14px}
  .xw-now-num{flex:0 0 auto;font-family:"Oswald","Segoe UI",sans-serif;font-weight:700;font-size:15px;
    color:var(--copper-2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .xw-now-text{font-size:15px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xw-actions{flex:0 0 auto;display:flex;gap:9px}
  .xw-btn{border:1px solid var(--hair);background:rgba(255,255,255,.07);color:var(--txt);
    padding:11px 20px;border-radius:999px;cursor:pointer;font-size:14.5px;font-weight:700;
    transition:background .2s var(--ease),color .2s var(--ease),transform .12s var(--ease)}
  .xw-btn:hover{background:var(--copper);color:#fff}
  .xw-btn:active{transform:translateY(1px)}
  .xw-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5);background:rgba(255,255,255,.04);color:var(--muted)}
  .xw-btn:focus-visible{outline:2px solid var(--copper-2);outline-offset:2px}
  .xw-msg{flex:1 1 100%;min-height:20px;font-size:14.5px;color:var(--copper-2);font-weight:700}

  /* ---------- Entrance ---------- */
  @media (prefers-reduced-motion: no-preference){
    .xw-app{animation:appIn .5s var(--ease) both}
    .xw-board{animation:boardIn .55s var(--ease) both}
    @keyframes appIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes boardIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  }

  /* ---------- Mobile: stack board over clues, tabs switch lists ---------- */
  @media(max-width:760px){
    html,body{height:auto}
    body{height:auto;overflow:auto;min-height:100vh}
    .xw-app{height:auto;min-height:100vh;padding:14px 14px 20px}
    .xw-stage{flex-direction:column;gap:12px}
    .xw-boardcol{flex:0 0 auto}
    /* MOBILE FIX 2026-08-26: the board needs a DEFINITE height here, not just a
       max-height. fitCell() in assets/js/crossword.js sizes the cells from the
       board's measured clientHeight; with height:auto the board collapsed to its
       (empty) content box and cells floored to 1px — the whole grid rendered
       unreadable on phones. min() caps it so big puzzles still fit the fold. */
    .xw-board{height:min(58vh,520px)}
    .xw-clues{flex:1 1 auto}
    .xw-h{display:block}            /* show section headers when both lists visible fallback */
    .xw-cluehead{display:flex}       /* tabs drive which list shows */
    .xw-footer{position:sticky;bottom:0}
  }
  @media(min-width:761px){
    .xw-tab{display:none}            /* on desktop show both lists at once */
    .xw-cluehead{display:none}
    .xw-list{display:block !important}
  }
</style>
  <meta name="onyx-build" content="20260901">
</head>
<body>
<div class="xw-app">
  <header class="xw-header">
    <div class="xw-brand">
      <div class="xw-glyph" aria-hidden="true">▦</div>
      <div style="min-width:0">
        <h1 class="xw-title">Daily Crossword</h1>
        <p class="xw-sub"><span id="xwTitle">Loading…</span> <span id="xwMeta"></span></p>
      </div>
    </div>
    <a class="xw-back" href="index.html">← Back to site</a>
  </header>

  <main class="xw-stage">
    <div class="xw-boardcol">
      <div class="xw-board" id="xwBoard" aria-label="Crossword grid">
        <div class="xw-grid" id="xwGrid" role="grid"></div>
      </div>
    </div>
    <aside class="xw-clues" aria-label="Clues">
      <div class="xw-cluehead" role="tablist">
        <div class="xw-tab" role="tab" aria-selected="true" data-dir="across" tabindex="0">Across</div>
        <div class="xw-tab" role="tab" aria-selected="false" data-dir="down" tabindex="0">Down</div>
      </div>
      <div class="xw-cluelist">
        <h2 class="xw-h">Across</h2>
        <ol id="xwAcross" class="xw-list" role="list"></ol>
        <h2 class="xw-h">Down</h2>
        <ol id="xwDown" class="xw-list" role="list" hidden></ol>
      </div>
    </aside>
  </main>

  <footer class="xw-footer">
    <div class="xw-now" id="xwNow" aria-live="polite">
      <span class="xw-now-num"></span>
      <span class="xw-now-text">Tap a square to begin</span>
    </div>
    <div class="xw-actions">
      <button id="xwCheck" class="xw-btn" type="button">Check</button>
      <button id="xwReveal" class="xw-btn" type="button">Reveal</button>
      <button id="xwClear" class="xw-btn" type="button">Clear</button>
    </div>
    <div class="xw-msg" id="xwMsg" aria-live="polite"></div>
  </footer>
</div>
<script src="assets/js/crossword.js"></script>
<script>
  XW.load(function(){
    XW.renderFull(
      document.getElementById('xwGrid'),
      document.getElementById('xwAcross'),
      document.getElementById('xwDown'),
      document.getElementById('xwMsg'),
      document.getElementById('xwTitle')
    );
  });
</script>

<script>
/* Freshness layer (2026-08-15): bfcache self-heal + build-date cache-bust + service worker.
   Top-level only — embedded/iframe pages are never force-reloaded. */
window.addEventListener('pageshow',function(e){if(e.persisted&&window.self===window.top)location.reload();});
(function(){
  try{
    var m=document.querySelector('meta[name="onyx-build"]');
    var b=m?m.getAttribute('content'):'';
    if(b&&/^\d{8}$/.test(b)&&window.self===window.top&&window.sessionStorage){
      var key='onyxBust'+location.pathname;
      var age=Math.floor((Date.now()-Date.UTC(+b.slice(0,4),+b.slice(4,6)-1,+b.slice(6,8)))/86400000);
      if(age>2&&sessionStorage.getItem(key)!=='1'){sessionStorage.setItem(key,'1');location.replace(location.pathname+'?cb='+Date.now());}
    }
  }catch(e){}
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).catch(function(){});});
  }
})();
</script>
</body>
</html>
