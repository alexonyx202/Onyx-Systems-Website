<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Crossword — Onyx Systems</title>
<style>
  :root{--copper:#C2703D;--copper-2:#E8B06A;--cream:#f7f4ef;--xw-cell:27px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#0a0612;color:#f7f4ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;
    background-image:radial-gradient(120% 70% at 50% 0%,#3a1052 0%,transparent 55%),radial-gradient(120% 80% at 50% 120%,#2a0b3f 0%,#0a0612 60%),linear-gradient(180deg,#120726,#1a0b2e 55%,#06030d);
    background-attachment:fixed}
  body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.18;pointer-events:none;background-image:linear-gradient(90deg,rgba(194,112,61,.5) 1px,transparent 1px),linear-gradient(0deg,rgba(120,80,255,.4) 1px,transparent 1px);background-size:46px 46px}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .title{font-family:"Oswald","Segoe UI",sans-serif;font-weight:700;font-size:clamp(28px,5vw,44px);color:#fff;letter-spacing:.02em;
    text-shadow:0 0 1px #0a0612,0 3px 10px rgba(0,0,0,.85),0 0 18px rgba(194,112,61,.55)}
  .title .pill{color:var(--copper-2)}
  .close{display:inline-block;text-decoration:none;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--cream);font-weight:700;border:1px solid rgba(194,112,61,.4);transition:.2s}
  .close:hover{background:var(--copper);color:#fff}
  .layout{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:start}
  @media(max-width:720px){.layout{grid-template-columns:1fr}}
  .board{background:linear-gradient(180deg,#15131c,#0d0b13);border:2px solid var(--copper);border-radius:16px;padding:18px;display:flex;justify-content:center}
  .xw-grid{display:grid;gap:3px;background:#0a0612;padding:6px;border-radius:8px}
  .xw-cell{position:relative;width:var(--xw-cell);height:var(--xw-cell);background:#f3ead9;border-radius:3px}
  .xw-cell.block{background:transparent}
  .xw-cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:22px;font-weight:800;text-transform:uppercase;color:#16161a;padding:0;border-radius:3px;cursor:pointer}
  .xw-cell input:focus{outline:2px solid var(--copper-2);outline-offset:-2px}
  .xw-num{position:absolute;top:1px;left:3px;font-size:10px;line-height:1;color:#6B635A;pointer-events:none;font-weight:800}
  .xw-cell.correct{background:#bfe6c4}
  .xw-cell.wrong{background:#e8b4ad}
  .xw-cell.active-cell{box-shadow:inset 0 0 0 2px rgba(194,112,61,.5)}
  .clues{display:flex;flex-direction:column;gap:22px}
  @media(max-width:720px){.clues{flex-direction:row;flex-wrap:wrap}}
  .clue-col{flex:1;min-width:240px}
  .xw-h{font-weight:800;color:var(--copper-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;font-size:14px;border-bottom:1px solid rgba(194,112,61,.35);padding-bottom:6px}
  .xw-list{list-style:none;margin:0;padding:0}
  .xw-clue{margin-bottom:8px;color:#cfc9c0;cursor:pointer;line-height:1.4;font-size:15px;padding:4px 8px;border-radius:6px}
  .xw-clue b{color:var(--cream)}
  .xw-clue:hover{background:rgba(255,255,255,.05)}
  .xw-clue.active{background:rgba(194,112,61,.18);color:var(--copper-2);font-weight:600}
  .controls{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
  .controls button{background:rgba(255,255,255,.08);border:1px solid rgba(194,112,61,.4);color:var(--cream);padding:11px 22px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:700;transition:.2s}
  .controls button:hover{background:var(--copper);color:#fff}
  .controls button:disabled,.controls button.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.5);background:rgba(255,255,255,.04);color:#9a938a}
  .xw-msg{margin-top:14px;font-size:16px;min-height:22px;color:var(--copper-2);font-weight:700}
  @media(max-width:520px){:root{--xw-cell:22px}.xw-cell input{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">🔤 Daily Crossword — <span class="pill" id="xwTitle"></span></div>
    <a class="close" href="index.html">← Back to site</a>
  </header>
  <div class="layout">
    <div class="board">
      <div class="xw-grid" id="xwGrid"></div>
    </div>
    <div class="clues">
      <div class="clue-col">
        <div class="xw-h">Across</div>
        <ol id="xwAcross" class="xw-list"></ol>
      </div>
      <div class="clue-col">
        <div class="xw-h">Down</div>
        <ol id="xwDown" class="xw-list"></ol>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="xwCheck">Check</button>
    <button id="xwReveal">Reveal answer</button>
    <button id="xwClear">Clear</button>
  </div>
  <div class="xw-msg" id="xwMsg"></div>
</div>
<script src="assets/js/crossword.js"></script>
<script>
  XW.load(function(){
    XW.renderFull(document.getElementById('xwGrid'), document.getElementById('xwAcross'), document.getElementById('xwDown'), document.getElementById('xwMsg'), document.getElementById('xwTitle'));
  });
</script>
</body>
</html>
