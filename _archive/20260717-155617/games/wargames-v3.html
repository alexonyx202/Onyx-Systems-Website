<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARGAMES :: MISSILE DEFENSE</title>
<style>
  :root{
    --green:#19ff8a;
    --green-dim:#0c8f4c;
    --amber:#ffb000;
    --red:#ff3b30;
    --bg:#05080a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--green);
    font-family:"Courier New",Courier,monospace;
    -webkit-font-smoothing:none;
  }
  /* centered framed shell so it looks right embedded or standalone */
  .wrap{
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .machine{
    position:relative;
    width:min(960px,100%);
    border:2px solid var(--green-dim);
    border-radius:10px;
    background:
      radial-gradient(120% 120% at 50% 0%, #0a1418 0%, #04070a 70%);
    box-shadow:0 0 0 4px #020405, 0 0 40px rgba(25,255,138,.12) inset, 0 10px 40px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .scanlines{
    pointer-events:none;
    position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 4px);
    mix-blend-mode:multiply;
    z-index:5;
  }
  .flicker{
    pointer-events:none;position:absolute;inset:0;
    background:rgba(25,255,138,.02);
    animation:flick 6s infinite;z-index:6;
  }
  @keyframes flick{0%,97%,100%{opacity:.0}98%{opacity:.5}99%{opacity:.1}}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 14px;border-bottom:1px solid var(--green-dim);
    font-size:13px;letter-spacing:1px;color:var(--green);
    text-shadow:0 0 6px rgba(25,255,138,.6);
  }
  .topbar .title{font-weight:bold;}
  .topbar .blink{animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  canvas{
    display:block;width:100%;height:auto;
    image-rendering:pixelated;
    background:#04070a;
    cursor:crosshair;
  }
  .screen{position:relative;}
  /* blast-radius ring overlay: DOM element, browser-composited via transform.
     Immune to canvas screen-shake and never lags the native OS cursor. */
  #ring{
    position:absolute; left:0; top:0;
    border:1px dashed rgba(255,176,0,0.45);
    border-radius:50%;
    pointer-events:none;
    display:none;
    mix-blend-mode:screen;
    will-change:transform,width,height;
    box-sizing:border-box;
  }

  .hud{
    display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
    padding:8px 14px;border-top:1px solid var(--green-dim);
    font-size:14px;letter-spacing:1px;
  }
  .hud b{color:var(--amber);text-shadow:0 0 6px rgba(255,176,0,.5);}

  .status{
    padding:4px 14px 10px;font-size:12px;color:var(--green-dim);
    min-height:16px;text-align:center;letter-spacing:1px;
  }

  /* CRT power-on text glow */
  .glow{text-shadow:0 0 8px currentColor;}
</style>
</head>
<body>
<div class="wrap">
  <div class="machine">
    <div class="scanlines"></div>
    <div class="flicker"></div>

    <div class="topbar">
      <span class="title glow">W O P R &nbsp;//&nbsp; STRATEGIC DEFENSE GRID</span>
      <span class="blink">● REC</span>
    </div>

    <div class="screen">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="ring"></div>
    </div>

    <div class="hud">
      <span>SCORE <b id="score">0</b></span>
      <span>WAVE <b id="wave">1</b></span>
      <span>BASES <b id="bases">3</b></span>
      <span>STATUS <b id="tstatus">STANDBY</b></span>
    </div>
    <div class="status" id="status">AWAITING OPERATOR...</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const COL = {
    green:'#19ff8a', greenDim:'#0c8f4c',
    amber:'#ffb000', red:'#ff3b30',
    blue:'#37c0ff', white:'#dfffe9'
  };

  // ---------- tunables: difficulty presets (V2) ----------
  // PRESETS are immutable templates; TUNE is the live (mutable) copy used by the sim.
  const PRESETS = {
    EASY:   { baseEnemies:4, perWave:2, enemySpeed:0.80, speedPerWave:0.10, spawnBase:2.6, spawnPerWave:0.10, spawnMin:0.6, blastRadius:56 },
    NORMAL: { baseEnemies:5, perWave:2, enemySpeed:0.90, speedPerWave:0.12, spawnBase:2.2, spawnPerWave:0.12, spawnMin:0.5, blastRadius:46 },
    HARD:   { baseEnemies:6, perWave:3, enemySpeed:1.10, speedPerWave:0.15, spawnBase:1.7, spawnPerWave:0.15, spawnMin:0.4, blastRadius:42 }
  };
  let TUNE = Object.assign({}, PRESETS.NORMAL);

  // difficulty selector (intro screen)
  const DIFFS = ['EASY','NORMAL','HARD'];
  let diffIndex = 1; // NORMAL default
  let diffButtons = []; // {x,y,w,h,key} computed during intro draw
  function setDifficulty(key){
    if(PRESETS[key]){ TUNE = Object.assign({}, PRESETS[key]); diffIndex = DIFFS.indexOf(key); }
  }

  // ---------- DOM refs ----------
  const el = {
    score: document.getElementById('score'),
    wave: document.getElementById('wave'),
    bases: document.getElementById('bases'),
    tstatus: document.getElementById('tstatus'),
    status: document.getElementById('status')
  };

  // ---------- world grid map (equirectangular graticule) ----------
  // Simple sinusoidal coastline silhouettes for a "war games" world map look.
  // Drawn in equirectangular space: x = (lon+180)/360 * W, y=(90-lat)/180 * H
  function lon2x(lon){ return (lon+180)/360 * W; }
  function lat2y(lat){ return (90-lat)/180 * H; }

  const coast = [
    // North America (rough)
    [[-168,65],[-160,71],[-140,70],[-125,70],[-100,73],[-85,70],[-80,62],[-78,52],[-64,60],[-56,52],[-66,45],[-70,42],[-74,40],[-81,31],[-80,25],[-82,23],[-97,26],[-97,21],[-105,20],[-110,23],[-114,28],[-117,33],[-124,40],[-124,48],[-130,55],[-150,59],[-168,65]],
    // Greenland
    [[-45,60],[-30,70],[-20,76],[-30,83],[-50,82],[-58,76],[-55,68],[-45,60]],
    // South America
    [[-80,8],[-72,10],[-62,10],[-52,5],[-35,-5],[-38,-13],[-48,-25],[-58,-35],[-65,-42],[-71,-50],[-75,-52],[-71,-44],[-71,-33],[-71,-18],[-77,-5],[-81,-3],[-80,8]],
    // Europe
    [[-10,36],[-9,43],[-2,48],[-5,54],[2,58],[10,63],[20,70],[30,70],[28,60],[18,55],[12,54],[10,45],[3,42],[-10,36]],
    // Africa
    [[-17,15],[-16,21],[-10,30],[0,34],[10,37],[20,33],[33,31],[43,12],[51,12],[42,-1],[40,-15],[35,-25],[25,-34],[18,-35],[12,-17],[8,5],[-8,5],[-17,15]],
    // Asia
    [[28,60],[40,68],[60,72],[90,76],[110,74],[140,73],[160,68],[170,66],[160,60],[145,58],[140,50],[130,43],[122,40],[122,30],[108,22],[100,15],[95,18],[90,22],[80,8],[77,8],[70,22],[60,25],[50,30],[45,40],[40,42],[35,45],[28,60]],
    // India peninsula split handled in Asia above
    // Australia
    [[114,-22],[122,-18],[130,-12],[142,-12],[146,-18],[153,-28],[150,-38],[140,-38],[131,-32],[115,-34],[113,-26],[114,-22]]
  ];

  function drawWorld(){
    // ocean grid background
    ctx.fillStyle = '#04070a';
    ctx.fillRect(0,0,W,H);

    // graticule (lat/lon lines)
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(25,255,138,0.10)';
    ctx.beginPath();
    for(let lon=-180; lon<=180; lon+=30){
      const x = lon2x(lon);
      ctx.moveTo(x,0); ctx.lineTo(x,H);
    }
    for(let lat=-90; lat<=90; lat+=30){
      const y = lat2y(lat);
      ctx.moveTo(0,y); ctx.lineTo(W,y);
    }
    ctx.stroke();

    // equator + prime meridian brighter
    ctx.strokeStyle = 'rgba(25,255,138,0.22)';
    ctx.beginPath();
    ctx.moveTo(0, lat2y(0)); ctx.lineTo(W, lat2y(0));
    ctx.moveTo(lon2x(0),0); ctx.lineTo(lon2x(0),H);
    ctx.stroke();

    // coastlines
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(25,255,138,0.55)';
    ctx.fillStyle = 'rgba(12,143,76,0.16)';
    for(const poly of coast){
      ctx.beginPath();
      poly.forEach((p,i)=>{
        const x = lon2x(p[0]), y = lat2y(p[1]);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // subtle "scan" sweep
    const sweep = (Date.now()/30) % W;
    const g = ctx.createLinearGradient(sweep-60,0,sweep,0);
    g.addColorStop(0,'rgba(25,255,138,0)');
    g.addColorStop(1,'rgba(25,255,138,0.05)');
    ctx.fillStyle = g;
    ctx.fillRect(sweep-60,0,60,H);
  }

  // ---------- audio (WebAudio, no assets) ----------
  let actx = null;
  function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq, dur, type, vol){
    const a = audio(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.value = (vol==null?0.05:vol);
    o.connect(g); g.connect(a.destination);
    const t = a.currentTime;
    o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.stop(t+dur+0.02);
  }
  function noiseBurst(dur, vol){
    const a = audio(); if(!a) return;
    const n = Math.floor(a.sampleRate*dur);
    const buf = a.createBuffer(1,n,a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = vol==null?0.18:vol;
    src.connect(g); g.connect(a.destination);
    src.start();
  }

  // ---------- game state ----------
  const STATE = { INTRO:'intro', PLAY:'play', BETWEEN:'between', OVER:'over', WIN:'win' };
  let state = STATE.INTRO;

  let score = 0, wave = 1;
  let cities = [];      // ground bases
  let missiles = [];    // player counter-missiles (rising)
  let enemy = [];       // incoming ICBMs
  let blasts = [];      // explosions
  let trails = [];      // detonation trails (expanding circles)
  let particles = [];   // explosion particles

  let toSpawn = 0;       // remaining enemies to spawn this wave
  let spawnTimer = 0;
  let waveTimer = 0;
  let shake = 0;

  // intro
  const introLines = [
    "Greetings, Professor Falken.",
    "",
    "SHALL WE PLAY A GAME?",
    "",
    "[ DEFENSE BRIEFING ]",
    "- Hostile ICBMs rain down on NORAD, MOSCOW & BEIJING.",
    "- MOVE your cursor to aim. The crosshair is your targeting reticle.",
    "- CLICK / TAP anywhere to launch an interceptor. It blooms into",
    "  a blast radius (dashed ring) that vaporizes any warhead inside it.",
    "- The amber ring shows your kill zone - bigger = easier, but",
    "  smaller on HARD. Time your shots; you can't move a blast.",
    "- Defend all 3 bases through 12 waves. Lose them all = GAME OVER.",
    "- Score = warheads intercepted. The only winning move is a clean board.",
    "",
    "Choose your threat level below, then engage."
  ];
  let introLine = 0;

  function initCities(){
    cities = [];
    const defs = [
      {name:'NORAD', lon:-104, lat:39},
      {name:'MOSCOW', lon:37, lat:55},
      {name:'BEIJING', lon:116, lat:40}
    ];
    for(const d of defs){
      cities.push({ x: lon2x(d.lon), y: H-40, name:d.name, alive:true });
    }
    // normalize x if map edge
    for(const c of cities){ c.x = Math.max(40, Math.min(W-40, c.x)); }
  }

  function resetWave(){
    enemy = []; missiles = []; blasts = []; trails = []; particles = [];
    toSpawn = TUNE.baseEnemies + wave*TUNE.perWave;
    spawnTimer = 0;
    waveTimer = 0;
  }

  function startGame(){
    score = 0; wave = 1;
    initCities();
    resetWave();
    state = STATE.PLAY;
    beep(660,0.08,'square',0.05);
    setStatus("WAVE 1 INBOUND — TRACK HOSTILE ICBMs");
  }

  function setStatus(t){ el.status.textContent = t; }

  // ---------- spawning / firing ----------
  function spawnEnemy(){
    const target = cities[Math.floor(Math.random()*cities.length)];
    // launch from random edge of map (an enemy nation)
    const edge = Math.random();
    let sx, sy;
    if(edge < 0.33){ sx = Math.random()*W; sy = -10; }
    else if(edge < 0.66){ sx = -10; sy = Math.random()*H*0.6; }
    else { sx = W+10; sy = Math.random()*H*0.6; }

    const tx = target.x + (Math.random()*40-20);
    const ty = target.y;
    const ang = Math.atan2(ty-sy, tx-sx);
    const speed = TUNE.enemySpeed + wave*TUNE.speedPerWave;
    enemy.push({
      x:sx, y:sy,
      vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      tx, ty, target,
      trail:[]
    });
    beep(140,0.06,'sawtooth',0.03);
  }

  function fireAt(mx, my){
    if(state!==STATE.PLAY) return;
    // fire from nearest alive base
    let base = null, best = 1e9;
    for(const c of cities){ if(!c.alive) continue; const d=Math.hypot(c.x-mx,c.y-my); if(d<best){best=d;base=c;} }
    if(!base) return;
    const ang = Math.atan2(my-base.y, mx-base.x);
    const speed = 9;
    missiles.push({ x:base.x, y:base.y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed, target:{x:mx,y:my} });
    beep(880,0.06,'square',0.04);
  }

  function detonate(x,y,color){
    blasts.push({ x, y, r:0, max:TUNE.blastRadius, color: color||COL.amber });
    trails.push({ x, y, r:0, max:70, life:1, color: color||COL.amber });
    noiseBurst(0.25,0.14);
    shake = 8;
    // particles
    for(let i=0;i<14;i++){
      const a = Math.random()*Math.PI*2, s = Math.random()*3+1;
      particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color:COL.white });
    }
  }

  // ---------- update ----------
  function update(dt){
    if(state===STATE.PLAY || state===STATE.BETWEEN){
      // spawn
      if(state===STATE.PLAY && toSpawn>0){
        spawnTimer -= dt;
        if(spawnTimer<=0){ spawnEnemy(); toSpawn--; spawnTimer = Math.max(TUNE.spawnMin, TUNE.spawnBase - wave*TUNE.spawnPerWave); }
      }

      // move player missiles
      for(let i=missiles.length-1;i>=0;i--){
        const m = missiles[i];
        m.x += m.vx; m.y += m.vy;
        const d = Math.hypot(m.target.x-m.x, m.target.y-m.y);
        if(d < 8 || m.y<0){ detonate(m.x,m.y,COL.amber); missiles.splice(i,1); }
      }

      // move enemies
      for(let i=enemy.length-1;i>=0;i--){
        const e = enemy[i];
        e.x += e.vx; e.y += e.vy;
        e.trail.push({x:e.x,y:e.y});
        if(e.trail.length>40) e.trail.shift();
        const d = Math.hypot(e.tx-e.x, e.ty-e.y);
        if(d < 6){ detonate(e.x,e.y,COL.red); enemy.splice(i,1); hitCity(e.target); }
        else if(e.y > H-30){ // reached ground near a base
          detonate(e.x, H-30, COL.red);
          // damage nearest base
          let b=null,bd=1e9; for(const c of cities){ if(!c.alive) continue; const dd=Math.abs(c.x-e.x); if(dd<bd){bd=dd;b=c;} }
          if(b) hitCity(b);
          enemy.splice(i,1);
        }
      }

      // blasts expand
      for(let i=blasts.length-1;i>=0;i--){
        const b = blasts[i];
        b.r += 2.2;
        // collision with enemies
        for(let j=enemy.length-1;j>=0;j--){
          const e = enemy[j];
          if(Math.hypot(e.x-b.x, e.y-b.y) < b.r){
            detonate(e.x,e.y,COL.red);
            enemy.splice(j,1);
            score += 25;
            beep(420,0.05,'square',0.04);
          }
        }
        if(b.r >= b.max) blasts.splice(i,1);
      }

      // trails fade
      for(let i=trails.length-1;i>=0;i--){
        const t = trails[i];
        t.r += 1.6; t.life -= 0.03;
        if(t.life<=0 || t.r>=t.max) trails.splice(i,1);
      }

      // particles
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life-=0.03;
        if(p.life<=0) particles.splice(i,1);
      }

      // wave logic
      if(state===STATE.PLAY && toSpawn===0 && enemy.length===0 && missiles.length===0){
        // wave cleared
        score += 100;
        wave++;
        el.wave.textContent = wave;
        if(wave > 12){
          state = STATE.WIN;
          setStatus("ALL HOSTILES NEUTRALIZED. YOU WIN... THIS ROUND.");
        } else {
          state = STATE.BETWEEN;
          waveTimer = 2.5;
          setStatus("SECTOR CLEAR. NEXT WAVE INCOMING...");
          beep(990,0.12,'square',0.05);
        }
      }

      if(state===STATE.BETWEEN){
        waveTimer -= dt;
        if(waveTimer<=0){ resetWave(); state=STATE.PLAY; setStatus("WAVE "+wave+" INBOUND"); }
      }

      // shake decay
      if(shake>0) shake -= dt*30;

      // lose condition
      const alive = cities.filter(c=>c.alive).length;
      el.bases.textContent = alive;
      if(alive===0 && state!==STATE.OVER){
        state = STATE.OVER;
        setStatus("GAME OVER :: THERMONUCLEAR DETONATION — POPULATION ZERO");
        el.tstatus.textContent = 'LOST';
        beep(80,0.6,'sawtooth',0.12);
      } else if(alive>0){
        el.tstatus.textContent = (state===STATE.BETWEEN)?'RELOAD':'ACTIVE';
      }
    }
    el.score.textContent = score;
  }

  function hitCity(c){
    if(c && c.alive){ c.alive=false; detonate(c.x,c.y,COL.red); }
  }

  // ---------- render ----------
  function drawCities(){
    for(const c of cities){
      if(!c.alive){
        // rubble
        ctx.fillStyle = 'rgba(255,59,48,0.5)';
        ctx.fillRect(c.x-14, c.y-2, 28, 10);
        ctx.strokeStyle='rgba(255,59,48,0.6)';
        ctx.beginPath(); ctx.moveTo(c.x-14,c.y-2); ctx.lineTo(c.x-8,c.y-10); ctx.lineTo(c.x,c.y-3); ctx.lineTo(c.x+8,c.y-9); ctx.lineTo(c.x+14,c.y-2); ctx.stroke();
        continue;
      }
      // base glow
      ctx.fillStyle = COL.green;
      ctx.shadowColor = COL.green; ctx.shadowBlur = 10;
      ctx.fillRect(c.x-14, c.y-4, 28, 12);
      ctx.shadowBlur = 0;
      // label
      ctx.fillStyle = COL.greenDim;
      ctx.font = '10px Courier New';
      ctx.textAlign='center';
      ctx.fillText(c.name, c.x, c.y+16);
      ctx.textAlign='left';
    }
    // ground line
    ctx.strokeStyle = 'rgba(25,255,138,0.4)';
    ctx.beginPath(); ctx.moveTo(0,H-30); ctx.lineTo(W,H-30); ctx.stroke();
  }

  function drawEnemy(e){
    // trail
    ctx.strokeStyle = COL.red; ctx.lineWidth=2;
    ctx.beginPath();
    if(e.trail.length){
      e.trail.forEach((p,i)=>{ if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
      ctx.lineTo(e.x,e.y);
    }
    ctx.stroke();
    // warhead
    ctx.fillStyle = COL.red;
    ctx.shadowColor=COL.red; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(e.x,e.y,3,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  function drawMissile(m){
    ctx.strokeStyle = COL.amber; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-m.vx*2, m.y-m.vy*2); ctx.stroke();
    ctx.fillStyle=COL.amber;
    ctx.beginPath(); ctx.arc(m.x,m.y,2.5,0,Math.PI*2); ctx.fill();
  }

  function drawBlasts(){
    for(const b of blasts){
      ctx.strokeStyle = b.color; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,176,0,'+(0.12*(1-b.r/b.max))+')';
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }
    for(const t of trails){
      ctx.strokeStyle = t.color; ctx.globalAlpha = Math.max(0,t.life)*0.5; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }
    for(const p of particles){
      ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillRect(p.x,p.y,2,2);
      ctx.globalAlpha=1;
    }
  }

  function drawIntro(dt){
    drawWorld();
    ctx.fillStyle = 'rgba(4,7,10,0.82)';
    ctx.fillRect(0,0,W,H);

    // ---- game title (V3) ----
    ctx.textAlign='center';
    ctx.fillStyle = COL.amber;
    ctx.font = 'bold 34px Courier New';
    ctx.shadowColor = COL.amber; ctx.shadowBlur = 14;
    ctx.fillText('WARGAMES', W/2, 52);
    ctx.shadowBlur = 0;
    ctx.fillStyle = COL.green;
    ctx.font = 'bold 20px Courier New';
    ctx.fillText('—  M I S S I L E   D E F E N S E  —', W/2, 80);
    ctx.textAlign='left';

    // ---- briefing lines ----
    ctx.font = '15px Courier New';
    ctx.textAlign='left';
    const lh = 21;
    const topY = 112;
    introLine += dt*7; // typewriter-ish reveal
    const shown = Math.min(introLines.length, Math.floor(introLine));
    for(let i=0;i<shown;i++){
      const line = introLines[i];
      let color = COL.green, font = '15px Courier New';
      if(line.includes('SHALL WE PLAY')){ color = COL.amber; font = 'bold 18px Courier New'; }
      if(line.startsWith('[')){ color = COL.blue; font = 'bold 15px Courier New'; }
      if(line.startsWith('-')){ color = COL.white; }
      if(line.includes('Choose your threat')){ color = COL.greenDim; }
      ctx.fillStyle = color;
      ctx.font = font;
      ctx.fillText(line, 70, topY + i*lh);
    }
    // blinking cursor
    if(Math.floor(Date.now()/500)%2===0){
      ctx.fillStyle=COL.green;
      ctx.fillText('_', 70, topY + shown*lh);
    }
    ctx.textAlign='left';

    // ---- difficulty selector (V2/V3) ----
    const bw = 150, bh = 36, gap = 22;
    const totalW = bw*3 + gap*2;
    const startX = (W-totalW)/2;
    const by = H - 96;
    diffButtons = [];
    ctx.textAlign='center';
    ctx.font='13px Courier New';
    ctx.fillStyle=COL.greenDim;
    ctx.fillText('SELECT THREAT LEVEL   [ PRESS 1 / 2 / 3  OR  CLICK ]', W/2, by-14);
    for(let i=0;i<DIFFS.length;i++){
      const key = DIFFS[i];
      const bx = startX + i*(bw+gap);
      const active = (i===diffIndex);
      ctx.lineWidth = active?2:1;
      ctx.strokeStyle = active?COL.amber:COL.greenDim;
      if(active){ ctx.shadowColor=COL.amber; ctx.shadowBlur=10; }
      ctx.strokeRect(bx, by, bw, bh);
      ctx.shadowBlur=0;
      ctx.fillStyle = active?COL.amber:COL.green;
      ctx.font = (active?'bold ':'')+'17px Courier New';
      ctx.fillText(key, bx+bw/2, by+bh/2+6);
      diffButtons.push({x:bx, y:by, w:bw, h:bh, key});
    }
    ctx.fillStyle=COL.white;
    ctx.font='14px Courier New';
    ctx.fillText('CLICK anywhere else  /  PRESS [SPACE]  to ENGAGE DEFENSE GRID', W/2, by+bh+22);
    ctx.textAlign='left';
  }

  function drawOverlay(title, sub, color){
    drawWorld();
    drawCities();
    drawBlasts();
    ctx.fillStyle='rgba(4,7,10,0.8)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=color||COL.green;
    ctx.font='bold 42px Courier New';
    ctx.fillText(title, W/2, H/2-30);
    ctx.font='18px Courier New';
    ctx.fillStyle=COL.white;
    ctx.fillText(sub, W/2, H/2+10);
    ctx.fillStyle=COL.greenDim;
    ctx.font='14px Courier New';
    ctx.fillText('CLICK or [SPACE] to play again', W/2, H/2+44);
    ctx.textAlign='left';
  }

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;

    update(dt);

    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }

    if(state===STATE.INTRO){
      drawIntro(dt);
    } else if(state===STATE.PLAY || state===STATE.BETWEEN){
      drawWorld();
      drawCities();
      for(const e of enemy) drawEnemy(e);
      for(const m of missiles) drawMissile(m);
      drawBlasts();
      if(state===STATE.BETWEEN){
        ctx.textAlign='center';
        ctx.fillStyle=COL.amber; ctx.font='22px Courier New';
        ctx.fillText('SECTOR CLEAR', W/2, 50);
        ctx.textAlign='left';
      }
    } else if(state===STATE.OVER){
      drawOverlay('GAME OVER', 'FINAL SCORE: '+score, COL.red);
    } else if(state===STATE.WIN){
      drawOverlay('VICTORY', 'YOU SURVIVED. FINAL SCORE: '+score, COL.green);
    }
    ctx.restore();

    // V2: DOM radius ring (shake-free, native cursor kept)
    drawBlastRing();

    requestAnimationFrame(frame);
  }

  // V2: blast-radius ring as DOM overlay (displayed px), shake-free, no lag.
  const ringEl = document.getElementById('ring');
  function drawBlastRing(){
    if(!ringEl) return;
    const playing = (state===STATE.PLAY || state===STATE.BETWEEN);
    if(!playing || !mouse.inside){ ringEl.style.display='none'; return; }
    const scale = canvas.clientWidth / W;       // displayed : internal px
    const size = TUNE.blastRadius * 2 * scale;
    ringEl.style.display = 'block';
    ringEl.style.width = size + 'px';
    ringEl.style.height = size + 'px';
    ringEl.style.transform = 'translate('+(mouse.x*scale - size/2)+'px,'+(mouse.y*scale - size/2)+'px)';
  }

  // ---------- input ----------
  let mouse = { x: W/2, y: H/2, inside:false };
  function toCanvas(ev){
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
    if(ev.touches && ev.touches[0]){ return { x:(ev.touches[0].clientX-rect.left)*sx, y:(ev.touches[0].clientY-rect.top)*sy }; }
    return { x:(ev.clientX-rect.left)*sx, y:(ev.clientY-rect.top)*sy };
  }
  function onMove(ev){ const p = toCanvas(ev); mouse.x=p.x; mouse.y=p.y; mouse.inside=true; }
  function onPoint(ev){
    audio() && actx.resume && actx.resume();
    const p = toCanvas(ev);
    if(state===STATE.INTRO){
      // clicking a difficulty button selects it; clicking elsewhere starts the game
      for(const b of diffButtons){
        if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){
          setDifficulty(b.key);
          beep(520,0.05,'square',0.04);
          return;
        }
      }
      startGame(); return;
    }
    if(state===STATE.OVER || state===STATE.WIN){ startGame(); return; }
    fireAt(p.x,p.y);
  }
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', function(){ mouse.inside=false; });
  canvas.addEventListener('mousedown', onPoint);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); onPoint(e); }, {passive:false});

  function onKey(e){
    if(e.code==='Space' || e.code==='Enter'){
      if(state===STATE.INTRO || state===STATE.OVER || state===STATE.WIN){ e.preventDefault(); startGame(); }
    }
    if(state===STATE.INTRO){
      if(e.key==='1'){ setDifficulty('EASY'); beep(520,0.05,'square',0.04); }
      else if(e.key==='2'){ setDifficulty('NORMAL'); beep(520,0.05,'square',0.04); }
      else if(e.key==='3'){ setDifficulty('HARD'); beep(520,0.05,'square',0.04); }
    }
  }
  window.addEventListener('keydown', onKey);

  // start: render one frame so diffButtons exist, then drive the loop
  initCities();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
