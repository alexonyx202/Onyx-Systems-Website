<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img" aria-label="Cartoon computer being repaired">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23232b"/><stop offset="1" stop-color="#15151b"/>
    </linearGradient>
  </defs>
  <!-- monitor -->
  <rect x="48" y="34" width="144" height="96" rx="12" fill="url(#scr)" stroke="#C2703D" stroke-width="4"/>
  <rect x="62" y="48" width="116" height="68" rx="6" fill="#0e0e12"/>
  <!-- happy face on screen -->
  <circle cx="104" cy="78" r="5" fill="#C2703D"/>
  <circle cx="146" cy="78" r="5" fill="#C2703D"/>
  <path d="M104 96 q21 18 42 0" stroke="#C2703D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- stand -->
  <path d="M120 130 v18 M96 152 h48" stroke="#6B635A" stroke-width="6" stroke-linecap="round"/>
  <!-- spark / wrench -->
  <g transform="translate(176 40) rotate(35)">
    <rect x="0" y="0" width="10" height="40" rx="5" fill="#C2703D"/>
    <path d="M0 0 q5 -10 10 0" stroke="#C2703D" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M0 40 q5 10 10 0" stroke="#C2703D" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <path d="M60 30 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#E8B06A"/>
  <path d="M196 150 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#E8B06A"/>
</svg>
