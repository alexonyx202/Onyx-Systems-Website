<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img" aria-label="Cartoon hard drive recovering data">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23232b"/><stop offset="1" stop-color="#15151b"/>
    </linearGradient>
  </defs>
  <!-- drive body -->
  <rect x="56" y="58" width="128" height="84" rx="12" fill="url(#dg)" stroke="#C2703D" stroke-width="4"/>
  <circle cx="84" cy="100" r="16" fill="#0e0e12" stroke="#C2703D" stroke-width="3"/>
  <circle cx="84" cy="100" r="4" fill="#E8B06A"/>
  <rect x="112" y="86" width="56" height="8" rx="4" fill="#6B635A"/>
  <rect x="112" y="102" width="40" height="8" rx="4" fill="#6B635A"/>
  <!-- floating files -->
  <g transform="translate(150 30)">
    <rect x="0" y="0" width="40" height="50" rx="6" fill="#23232b" stroke="#C2703D" stroke-width="3"/>
    <path d="M0 14 h40 M8 26 h24 M8 36 h24" stroke="#6B635A" stroke-width="3"/>
    <path d="M30 0 v14 h14z" fill="#C2703D"/>
  </g>
  <path d="M132 52 q18 -18 18 0" stroke="#E8B06A" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- sparkle -->
  <path d="M48 150 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z" fill="#E8B06A"/>
</svg>
